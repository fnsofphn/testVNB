làm gia tăng căng thẳng với khách hàng không?", "s": "p", "l": false}, {"t": "MỤC V NHỮNG HÀNH VI LÀM TỔN HẠI TRẢI NGHIỆM KHÁCH HÀNG CẦN TRÁNH", "s": "p", "l": false}]}]}, {"num": "V", "title": "NHỮNG HÀNH VI LÀM TỔN HẠI TRẢI NGHIỆM KHÁCH HÀNG CẦN TRÁNH", "articles": [{"num": "24", "title": "Hành vi thiếu tôn trọng và thiếu đồng cảm với khách hàng", "blocks": [{"t": "Những hành vi dưới đây làm tổn thương cảm nhận của khách hàng và xói mòn niềm tin vào EVN, vì vậy cần tuyệt đối tránh trong mọi tiếp xúc với khách hàng, đồng nghiệp, đối tác và cộng đồng:", "s": "p", "l": false}, {"t": "1. Thái độ thờ ơ, lạnh nhạt, cáu gắt, thiếu kiên nhẫn hoặc coi nhẹ phản ánh của khách hàng.", "s": "p", "l": false}, {"t": "2. Dùng cách nói chuyện trống không, mỉa mai, châm chọc, phán xét, đe dọa, quy chụp hoặc làm", "s": "p", "l": false}, {"t": "khách hàng cảm thấy bị xem thường.", "s": "p", "l": false}, {"t": "3. Ngắt lời, tranh luận hơn thua, phủ nhận cảm xúc của khách hàng khi họ đang lo lắng, bức xúc hoặc gặp", "s": "p", "l": false}, {"t": "khó khăn.", "s": "p", "l": false}, {"t": "4. Để khách hàng chờ mà không giải thích lý do, không cập nhật tiến độ hoặc không hướng dẫn", "s": "p", "l": false}, {"t": "bước tiếp theo.", "s": "p", "l": false}, {"t": "5. Tỏ thái độ sốt ruột, khó chịu hoặc thiếu hỗ trợ với người cao tuổi, người khuyết tật, khách hàng yếu thế,", "s": "p", "l": false}, {"t": "khách hàng vùng sâu, vùng xa, hải đảo hoặc khách hàng chưa quen sử dụng kênh số.", "s": "p", "l": false}, {"t": "6. Chỉ trích cá nhân, đồng nghiệp, bộ phận, đơn vị hoặc đối tác trước mặt khách hàng.", "s": "h4", "l": false}, {"t": "7. Có hành vi, lời nói hoặc biểu hiện phân biệt đối xử theo vùng miền, giới tính, độ tuổi, nghề nghiệp, điều kiện", "s": "p", "l": false}, {"t": "kinh tế, khả năng tiếp cận công nghệ hoặc hoàn cảnh cá nhân của khách hàng.", "s": "p", "l": false}, {"t": "Gợi ý tự kiểm: Hành vi, lời nói hoặc thái độ của mình có làm khách hàng cảm thấy bị coi nhẹ, bị bỏ mặc, bị", "s": "label", "l": false}, {"t": "phán xét hoặc bị đối xử thiếu công bằng không?", "s": "p", "l": false}]}, {"num": "25", "title": "Hành vi đùn đẩy, gây phiền hà, nhũng nhiễu hoặc trục lợi", "blocks": [{"t": "Những hành vi dưới đây đẩy khó khăn về phía khách hàng và làm mất sự thuận tiện, công bằng mà khách hàng đáng được hưởng, vì vậy bị nghiêm cấm trong quá trình phục vụ:", "s": "p", "l": false}, {"t": "1. Né tránh trách nhiệm, trả lời “không thuộc bộ phận tôi” mà không hướng dẫn hoặc chuyển đúng đầu mối.", "s": "p", "l": false}, {"t": "2. Chuyển khách hàng lòng vòng, yêu cầu khách hàng tự liên hệ nhiều nơi khi EVN có thể phối hợp nội bộ", "s": "p", "l": false}, {"t": "để xử lý.", "s": "p", "l": false}, {"t": "3. Không bàn giao đầy đủ thông tin khi chuyển xử lý, làm khách hàng phải trình bày lại nhiều lần.", "s": "p", "l": false}, {"t": "4. Cố tình làm chậm, gây khó, yêu cầu bổ sung hồ sơ, giấy tờ hoặc thao tác không cần thiết trái quy định.", "s": "p", "l": false}, {"t": "5. Gợi ý, vòi vĩnh, nhận tiền, quà, lợi ích vật chất hoặc phi vật chất ngoài quy định để ưu tiên, đẩy nhanh, bỏ", "s": "p", "l": false}, {"t": "qua hoặc thay đổi kết quả xử lý.", "s": "p", "l": false}, {"t": "6. Lợi dụng vị trí công tác, thông tin nội bộ, quan hệ với khách hàng hoặc đối tác để trục lợi cho bản thân", "s": "p", "l": false}, {"t": "hoặc người khác.", "s": "p", "l": false}, {"t": "7. Bao che, tiếp tay hoặc làm ngơ cho hành vi nhũng nhiễu, trục lợi, gây phiền hà của cá nhân, bộ phận,", "s": "p", "l": false}, {"t": "đối tác hoặc nhà thầu.", "s": "p", "l": false}, {"t": "8. Đẩy khó khăn nội bộ, lỗi phối hợp, lỗi hệ thống hoặc vướng mắc giữa các đơn vị sang khách hàng.", "s": "p", "l": false}, {"t": "Gợi ý tự kiểm: Cách xử lý của mình có làm khách hàng mất thêm thời gian, công sức, chi phí hoặc phải tự đi", "s": "label", "l": false}, {"t": "giải quyết việc lẽ ra EVN cần phối hợp nội bộ không?", "s": "p", "l": false}]}, {"num": "26", "title": "Hành vi cung cấp thông tin sai lệch, vượt thẩm quyền, vi phạm bảo mật hoặc an toàn", "blocks": [{"t": "Những hành vi dưới đây làm khách hàng hiểu sai, mất an toàn hoặc bị xâm phạm thông tin, gây tổn hại nghiêm trọng đến niềm tin và quyền lợi của khách hàng, vì vậy bị nghiêm cấm trong khi thực hiện nhiệm vụ:", "s": "p", "l": false}, {"t": "1. Cung cấp thông tin sai, thiếu căn cứ, không nhất quán hoặc chưa được kiểm chứng về hồ sơ, chi phí,", "s": "p", "l": false}, {"t": "tiến độ, hóa đơn, hợp đồng, sự cố, lịch ngừng cấp điện hoặc kết quả xử lý.", "s": "p", "l": false}, {"t": "2. Hứa hẹn vượt thẩm quyền, cam kết thay bộ phận khác, cam kết thời gian hoặc kết quả khi chưa có căn cứ", "s": "p", "l": false}, {"t": "xác nhận.", "s": "p", "l": false}, {"t": "3. Che giấu sai sót, không thừa nhận lỗi đã được xác định, né tránh cung cấp thông tin cần thiết theo quy", "s": "p", "l": false}, {"t": "định hoặc cố tình làm sai lệch bản chất sự việc.", "s": "p", "l": false}, {"t": "4. Tự ý sửa, xóa, bỏ qua, trì hoãn hoặc cập nhật sai dữ liệu khách hàng, dữ liệu hồ sơ, dữ liệu xử lý yêu cầu", "s": "p", "l": false}, {"t": "hoặc dữ liệu trên hệ thống nghiệp vụ.", "s": "p", "l": false}, {"t": "5. Tiết lộ thông tin khách hàng trái quy định, gồm thông tin cá nhân, hợp đồng, hóa đơn, lịch sử sử dụng điện,", "s": "p", "l": false}, {"t": "dữ liệu thanh toán, hình ảnh khách hàng, hồ sơ hoặc nội dung trao đổi với khách hàng.", "s": "p", "l": false}, {"t": "6. Chia sẻ hình ảnh hiện trường, thông tin sự cố, thông tin vận hành, dữ liệu hệ thống hoặc tài liệu nội bộ khi", "s": "p", "l": false}, {"t": "chưa được phép.", "s": "p", "l": false}, {"t": "7. Hướng dẫn khách hàng thực hiện thao tác có nguy cơ mất an toàn điện, mất an toàn thông tin hoặc trái", "s": "p", "l": false}, {"t": "quy trình.", "s": "p", "l": false}, {"t": "8. Thực hiện công việc tại hiện trường khi chưa bảo đảm điều kiện an toàn, không sử dụng bảo hộ theo quy", "s": "p", "l": false}, {"t": "định, bỏ qua cảnh báo nguy cơ hoặc rút ngắn thao tác gây rủi ro cho khách hàng, cộng đồng, bản thân hoặc hệ thống kỹ thuật.", "s": "p", "l": false}, {"t": "9. Bỏ qua việc ghi nhận, báo cáo hoặc chuyển xử lý các nguy cơ mất an toàn, vi phạm bảo mật, lỗi dữ liệu", "s": "p", "l": false}, {"t": "hoặc điểm đau lặp lại có thể ảnh hưởng đến trải nghiệm khách hàng.", "s": "p", "l": false}, {"t": "Gợi ý tự kiểm: Thông tin mình cung cấp, dữ liệu mình sử dụng và thao tác mình thực hiện có đúng thẩm", "s": "label", "l": false}, {"t": "quyền, đúng quy định, bảo mật và an toàn cho khách hàng, cộng đồng, bản thân và EVN không?", "s": "p", "l": false}, {"t": "III C H Ư Ơ N G I I I QUY TẮC THỰC THI THEO ĐIỂM TIẾP XÚC VÀ HÀNH TRÌNH KHÁCH HÀNG “Mỗi điểm chạm là một lời hứa; mỗi hành trình là một cơ hội để khách hàng tin tưởng hơn.”", "s": "p", "l": false}, {"t": "THỰC THI THEO ĐIỂM TIẾP XÚC III QUY TẮC THỰC THI THEO ĐIỂM TIẾP XÚC VÀ HÀNH TRÌNH KHÁCH HÀNG BỐN ĐIỂM TIẾP XÚC · 15 HÀNH TRÌNH KHÁCH HÀNG ☎ ⌂ ⚒ ◍ Tổng đài Điểm giao dịch Hiện trường Không gian số & kênh thoại BA MỨC ĐỊNH HƯỚNG HÀNH VI CHUẨN TỐT TỎA SÁNG Sàn chất lượng Mức nên đạt Vượt mong đợi tối thiểu bắt buộc chủ động vượt cơ bản tạo ấn tượng sâu Mỗi hành vi được soi chiếu theo điểm chạm, hành trình và ba mức chất lượng Tổng quan Chương III là lớp chuyển hóa trực tiếp các nền tảng của Chương I và Chương II vào thực tế tiếp xúc với khách hàng. Nếu Chương I xác lập triết lý phục vụ, phương châm phục vụ và các nguyên tắc cốt lõi; Chương II cụ thể hóa thành các chuẩn hành vi chung về thái độ, giao tiếp, tác phong, phối hợp và hình ảnh EVN; thì Chương III làm rõ cách những nền tảng đó được thể hiện tại từng điểm tiếp xúc và trong các hành trình trải nghiệm khách hàng.", "s": "p", "l": false}, {"t": "Hành trình khách hàng là chuỗi điểm tiếp xúc nối tiếp nhau. Trong mỗi hành trình, khách hàng không chỉ mong nhận được kết quả dịch vụ mà còn mong được lắng nghe, được thông tin rõ ràng, được đối xử minh bạch, được đồng hành có trách nhiệm và được khép lại tương tác với cảm giác yên tâm hơn. Vì vậy, khách hàng đánh giá EVN không chỉ ở kết quả cuối cùng mà còn ở toàn bộ quá trình.", "s": "p", "l": false}, {"t": "Chương III được tổ chức theo một logic xuyên suốt: khách hàng cần cảm nhận gì; trong mọi hành trình trọng yếu phải bảo đảm điều gì; tại từng điểm tiếp xúc phải ứng xử ra sao; trong từng hành trình cụ thể phải thực hiện như thế nào; và cần tránh những gì để không làm gãy trải nghiệm. Chương này không lặp lại toàn bộ chuẩn mực ở Chương II mà tập trung vào việc vận dụng trong những tình huống phục vụ cụ thể, nhất là ở các điểm tiếp xúc và các hành trình mà khách hàng dễ phát sinh lo lắng, chờ đợi, thắc mắc hoặc giảm niềm tin.", "s": "p", "l": false}, {"t": "MỤC I KIM CHỈ NAM – 6 TRỌNG TÂM THEN CHỐT CỦA TNKH", "s": "p", "l": false}]}]}], "intro": "Chương II là lớp chuyển hóa các nền tảng của Chương I thành chuẩn mực ứng xử có thể quan sát, rèn luyện và thực hiện trong công việc hằng ngày qua thái độ, lời nói, tác phong, phối hợp, hình ảnh và cách sử dụng các kênh giao tiếp."}, {"num": "III", "title": "QUY TẮC THỰC THI THEO ĐIỂM TIẾP XÚC VÀ HÀNH TRÌNH KHÁCH HÀNG", "sections": [{"num": "I", "title": "KIM CHỈ NAM – 6 TRỌNG TÂM THEN CHỐT CỦA TNKH", "articles": [{"num": "27", "title": "Sáu cảm nhận khách hàng EVN hướng tới", "blocks": [{"t": "1. Được đáp ứng đúng mong đợi chính đáng", "s": "h4", "l": false}, {"t": "Khách hàng nhận được kết quả phù hợp với nhu cầu, quyền lợi, nghĩa vụ và điều kiện thực tế, trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định của EVN.", "s": "p", "l": false}, {"t": "2. Được theo dõi, đồng hành đến cùng", "s": "h4", "l": false}, {"t": "Khách hàng cảm nhận rằng yêu cầu của mình có người tiếp nhận, có đầu mối theo dõi, có cập nhật tiến độ và không bị bỏ dở giữa các bộ phận, các kênh hoặc các bước xử lý.", "s": "p", "l": false}, {"t": "3. Được phục vụ một cách minh bạch, đáng tin", "s": "h4", "l": false}, {"t": "Khách hàng được cung cấp thông tin đúng, đủ, rõ ràng, dễ hiểu về hồ sơ, chi phí, thời gian, tiến độ, điều kiện thực hiện, quyền lợi, nghĩa vụ và trách nhiệm của các bên.", "s": "p", "l": false}, {"t": "4. Được phục vụ thuận tiện, nhanh chóng, đúng hẹn", "s": "h4", "l": false}, {"t": "Khách hàng được hướng dẫn dễ thực hiện, giảm bớt thời gian chờ đợi, hạn chế đi lại hoặc trình bày lại nhiều lần; các cam kết về thời gian, lịch hẹn và phản hồi được thực hiện nghiêm túc.", "s": "p", "l": false}, {"t": "5. Được lắng nghe, thấu hiểu và tôn trọng", "s": "h4", "l": false}, {"t": "Khách hàng cảm nhận ý kiến, nhu cầu, cảm xúc và hoàn cảnh của mình được ghi nhận đúng mực; được giao tiếp bằng thái độ tôn trọng, ngôn ngữ dễ hiểu và tinh thần cầu thị.", "s": "p", "l": false}, {"t": "6. Được hỗ trợ phù hợp với hoàn cảnh", "s": "h4", "l": false}, {"t": "Khách hàng được phục vụ công bằng, nhân văn và có sự hỗ trợ phù hợp với điều kiện tiếp cận, khả năng sử dụng kênh số, khu vực sinh sống, mức độ cấp thiết và những hoàn cảnh đặc thù như người cao tuổi, người khuyết tật, hộ nghèo, hộ cận nghèo, vùng sâu, vùng xa, hải đảo hoặc tình huống khẩn cấp.", "s": "p", "l": false}, {"t": "Sáu cảm nhận này là cách diễn đạt ngắn gọn từ góc nhìn của khách hàng về kết quả trải nghiệm mà EVN cần tạo ra trong từng điểm tiếp xúc và trong suốt hành trình phục vụ. Đây không phải là một hệ giá trị mới tách rời các giá trị cốt lõi, chuẩn mực đạo đức nghề nghiệp, chuẩn hành vi và nguyên tắc phục vụ đã nêu tại Chương I và Chương II, mà là thước đo giúp mỗi đơn vị, bộ phận và CBCNV EVN tự soi chiếu: sau mỗi lần phục vụ, khách hàng có yên tâm hơn, thuận tiện hơn và tin tưởng hơn vào EVN hay không.", "s": "p", "l": false}]}, {"num": "28", "title": "Sáu yêu cầu thực thi xuyên suốt trong phục vụ khách hàng", "blocks": [{"t": "1. Đúng hẹn, giữ cam kết", "s": "h4", "l": false}, {"t": "Thực hiện đúng thời gian, nội dung, phạm vi và trách nhiệm đã thông tin hoặc cam kết với khách hàng; trường hợp có thay đổi, chậm trễ hoặc phát sinh vướng mắc, phải kịp thời thông báo lý do, thời gian dự kiến và phương án xử lý tiếp theo.", "s": "p", "l": false}, {"t": "2. Chủ động thông tin", "s": "h4", "l": false}, {"t": "Cung cấp, cập nhật và nhắc lại những thông tin cần thiết cho khách hàng trước, trong và sau quá trình xử lý;", "s": "p", "l": false}, {"t": "không để khách hàng phải hỏi nhiều lần mới biết tình trạng yêu cầu, tiến độ thực hiện hoặc bước tiếp theo cần làm.", "s": "p", "l": false}, {"t": "3. Minh bạch, dễ hiểu", "s": "h4", "l": false}, {"t": "Giải thích rõ ràng, đúng, đủ và nhất quán về quy trình, hồ sơ, chi phí, thời gian, điều kiện thực hiện, quyền lợi, nghĩa vụ và trách nhiệm của các bên; sử dụng ngôn ngữ phù hợp để khách hàng dễ hiểu, dễ thực hiện và không hiểu sai.", "s": "p", "l": false}, {"t": "4. Rõ trách nhiệm, đồng hành đến kết quả", "s": "h4", "l": false}, {"t": "Xác định rõ đầu mối tiếp nhận, xử lý, phối hợp và phản hồi; không để yêu cầu của khách hàng bị chuyển vòng, bị bỏ dở hoặc “trôi” giữa các bộ phận, các kênh phục vụ; theo dõi đến khi khách hàng nhận được kết quả hoặc phản hồi cuối cùng trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "5. Thấu hiểu hoàn cảnh", "s": "h4", "l": false}, {"t": "Lắng nghe, ghi nhận đúng nhu cầu, cảm xúc, điều kiện tiếp cận và mức độ cấp thiết của khách hàng; có cách hướng dẫn, hỗ trợ phù hợp với từng nhóm khách hàng, đặc biệt là người cao tuổi, người khuyết tật, hộ nghèo, hộ cận nghèo, khách hàng vùng sâu, vùng xa, hải đảo, khách hàng chưa quen sử dụng kênh số hoặc khách hàng trong tình huống khẩn cấp.", "s": "p", "l": false}, {"t": "6. Khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "Trước khi kết thúc giao dịch, cuộc gọi, phiếu yêu cầu hoặc hành trình phục vụ, cần xác nhận khách hàng đã hiểu rõ kết quả, tình trạng xử lý, bước tiếp theo hoặc đầu mối hỗ trợ; hướng tới việc khách hàng rời khỏi điểm chạm với cảm nhận yên tâm hơn, rõ ràng hơn, thuận tiện hơn và tin tưởng hơn vào EVN.", "s": "p", "l": false}, {"t": "Sáu yêu cầu thực thi trên là kim chỉ nam để chuyển hóa triết lý phục vụ, phương châm phục vụ, chuẩn mực đạo đức nghề nghiệp và các nguyên tắc phục vụ đã nêu tại Chương I và Chương II vào thực tế tiếp xúc với khách hàng. Các yêu cầu này cần được áp dụng nhất quán trong cả kênh trực tiếp, kênh số, tổng đài, hiện trường và các hoạt động phối hợp nội bộ có ảnh hưởng đến trải nghiệm khách hàng.", "s": "p", "l": false}, {"t": "Việc thực thi được xem là đạt yêu cầu khi không chỉ hoàn thành phần việc nội bộ, mà còn giúp khách hàng nhận được kết quả phù hợp hoặc được hướng dẫn rõ ràng về bước tiếp theo; hiểu đúng tình trạng vụ việc;", "s": "p", "l": false}, {"t": "biết đầu mối hỗ trợ khi cần; và cảm thấy yên tâm hơn sau khi tương tác với EVN.", "s": "p", "l": false}, {"t": "MỤC II ỨNG XỬ VĂN HÓA THEO ĐIỂM TIẾP XÚC", "s": "p", "l": false}]}]}, {"num": "II", "title": "ỨNG XỬ VĂN HÓA THEO ĐIỂM TIẾP XÚC", "articles": [{"num": "29", "title": "Quy tắc chung về ứng xử văn hóa theo điểm tiếp xúc", "blocks": [{"t": "KHÁCH HÀNG ☎ ⌂ ⚒ ◍ Tổng đài & kênh thoại Điểm giao dịch Hiện trường Không gian số Tiếp nhận nhanh · Lắng nghe Đón tiếp lịch sự· Hướng dẫn đủ Đúng hẹn · Giải thích rõ · Dễ dùng · Có người hỗ trợ · Tư vấn đúng · Khép cuộc gọi rõ · Ưu tiên nhóm yếu thế Minh bạch chi phí · An toàn Dữ liệu đúng · Bảo mật YÊU CẦU TNKH YÊU CẦU TNKH YÊU CẦU TNKH YÊU CẦU TNKH Mỗi điểm tương tác đều quy chiếu về cùng một bộ yêu cầu trải nghiệm khách hàng", "s": "p", "l": false}, {"t": "1. Mọi điểm tiếp xúc với khách hàng, dù trực tiếp hay gián tiếp, đều phải được thực hiện trên tinh thần tôn", "s": "p", "l": false}, {"t": "trọng, rõ ràng, nhất quán, đúng trách nhiệm và hướng tới việc giữ niềm tin cho khách hàng trong suốt quá trình phục vụ.", "s": "p", "l": false}, {"t": "2. Tại bất kỳ điểm tiếp xúc nào, việc giao tiếp, hướng dẫn và xử lý đều phải bảo đảm: a) khách hàng biết", "s": "p", "l": false}, {"t": "mình đang ở bước nào; b) khách hàng biết cần làm gì hoặc chờ gì tiếp theo; c) khách hàng biết đầu mối hoặc kênh hỗ trợ tiếp tục; d) khách hàng không bị bỏ lại trong trạng thái mơ hồ, phải tự suy đoán hoặc tự nối các khâu xử lý với nhau.", "s": "p", "l": false}, {"t": "3. Không được coi một điểm tiếp xúc là hoàn tất chỉ vì đã trả lời hoặc đã chuyển việc; một điểm tiếp xúc", "s": "p", "l": false}, {"t": "chỉ được coi là đạt yêu cầu khi giúp khách hàng rõ hơn, yên tâm hơn và thuận lợi hơn cho bước tiếp theo của hành trình.", "s": "p", "l": false}]}, {"num": "30", "title": "Ứng xử văn hóa tại tổng đài và kênh thoại", "blocks": [{"t": "1. Khi tiếp nhận cuộc gọi hoặc trao đổi qua kênh thoại, phải chào hỏi đúng mực, lắng nghe trọn ý, xác nhận", "s": "p", "l": false}, {"t": "đúng nội dung khách hàng cần hỗ trợ trước khi trả lời hoặc hướng dẫn.", "s": "p", "l": false}, {"t": "2. Việc trao đổi phải ngắn gọn, rõ ý, dễ hiểu, tránh dùng thuật ngữ chuyên môn khó hiểu hoặc viện dẫn quy", "s": "p", "l": false}, {"t": "định theo cách làm khách hàng thêm bối rối.", "s": "p", "l": false}, {"t": "3. Trường hợp chưa thể trả lời hoặc xử lý ngay, phải thông báo rõ tình trạng tiếp nhận, đầu mối xử lý, thời gian", "s": "p", "l": false}, {"t": "dự kiến phản hồi và cách thức khách hàng được cập nhật thông tin tiếp theo.", "s": "p", "l": false}, {"t": "4. Khi khách hàng đang bức xúc, lo lắng hoặc phản ánh sự cố ảnh hưởng trực tiếp đến sinh hoạt, sản xuất,", "s": "p", "l": false}, {"t": "phải giữ bình tĩnh, không tranh cãi, không ngắt lời không cần thiết và ưu tiên hướng dẫn bước tiếp theo một cách rõ ràng.", "s": "p", "l": false}]}, {"num": "31", "title": "Ứng xử văn hóa tại điểm giao dịch", "blocks": [{"t": "1. Tại điểm giao dịch, phải đón tiếp với thái độ tôn trọng, hướng dẫn rõ ràng, không để khách hàng bối rối", "s": "p", "l": false}, {"t": "trong việc xác định quầy, chọn dịch vụ, chuẩn bị hồ sơ hoặc chờ đợi không rõ lý do.", "s": "p", "l": false}, {"t": "2. Thông tin niêm yết về thủ tục, hồ sơ, thời gian giải quyết, mức phí, chứng từ, biểu mẫu và đầu mối hỗ trợ", "s": "p", "l": false}, {"t": "phải rõ ràng, dễ quan sát, dễ hiểu.", "s": "p", "l": false}, {"t": "3. Khi tiếp nhận hồ sơ, phải kiểm tra và hướng dẫn một lần cho đầy đủ trong phạm vi có thể; trường hợp hồ", "s": "p", "l": false}, {"t": "sơ chưa đủ điều kiện, phải nói rõ nội dung cần bổ sung, lý do và cách hoàn thiện.", "s": "p", "l": false}, {"t": "4. Kết thúc giao dịch phải xác nhận để khách hàng biết rõ hồ sơ đã được tiếp nhận đến đâu, thời gian xử lý,", "s": "p", "l": false}, {"t": "cách tra cứu tiến độ và kênh liên hệ tiếp theo nếu cần.", "s": "p", "l": false}]}, {"num": "32", "title": "Ứng xử văn hóa tại hiện trường", "blocks": [{"t": "1. Khi làm việc tại hiện trường, phải giới thiệu rõ mục đích, nội dung công việc, phạm vi thực hiện và các lưu ý", "s": "p", "l": false}, {"t": "cần thiết với khách hàng hoặc đại diện khách hàng.", "s": "p", "l": false}, {"t": "2. Mọi thao tác kỹ thuật có khả năng ảnh hưởng đến tài sản, công trình, sinh hoạt hoặc sản xuất của khách hàng", "s": "p", "l": false}, {"t": "phải được trao đổi rõ trước khi thực hiện; khi có thay đổi so với dự kiến ban đầu, phải thông tin kịp thời.", "s": "p", "l": false}, {"t": "3. Quá trình làm việc tại hiện trường phải bảo đảm tác phong chuyên nghiệp, cẩn trọng, tôn trọng tài sản và", "s": "p", "l": false}, {"t": "không gian của khách hàng, đúng quy định và đúng kỹ thuật.", "s": "p", "l": false}, {"t": "4. Sau khi hoàn tất, phải thông tin rõ kết quả, xác nhận các nội dung khách hàng cần lưu ý và hướng dẫn đầu", "s": "p", "l": false}, {"t": "mối liên hệ tiếp theo khi phát sinh nhu cầu hỗ trợ.", "s": "p", "l": false}]}, {"num": "33", "title": "Ứng xử văn hóa với khách hàng trong không gian số", "blocks": [{"t": "1. Không gian số của EVN bao gồm website, cổng dịch vụ công, ứng dụng di động, email, chatbot, livechat,", "s": "p", "l": false}, {"t": "mạng xã hội và các nền tảng số khác là một phần chính thức của trải nghiệm khách hàng; vì vậy mọi nội dung, phản hồi và hướng dẫn trên không gian số đều phải bảo đảm chuẩn mực văn hóa như trong giao tiếp trực tiếp.", "s": "p", "l": false}, {"t": "2. Thông tin công bố trên không gian số phải chính xác, thống nhất, cập nhật, dễ tìm, dễ hiểu, dễ thao tác và", "s": "p", "l": false}, {"t": "dễ kiểm chứng; không để khách hàng phải dò tìm nhiều nơi mới biết cùng một thông tin.", "s": "p", "l": false}, {"t": "3. Hướng dẫn trên website, mobile app, chatbot và các kênh số khác phải được thiết kế theo tinh thần giúp", "s": "p", "l": false}, {"t": "khách hàng tự thực hiện được dịch vụ, tự tra cứu được thông tin và biết rõ bước tiếp theo; không để khách hàng bị mắc kẹt giữa các màn hình, các lớp hướng dẫn hoặc các lựa chọn khó hiểu.", "s": "p", "l": false}, {"t": "4. Phản hồi trên kênh số phải đúng mực, không cộc lốc, không máy móc, không sao chép câu trả lời mẫu", "s": "p", "l": false}, {"t": "thiếu phù hợp với tình huống cụ thể; trường hợp câu hỏi vượt khả năng xử lý tự động, phải hướng dẫn rõ cách chuyển sang tổng đài, điểm giao dịch hoặc hỗ trợ trực tiếp.", "s": "p", "l": false}, {"t": "5. Không được biến kênh số thành nơi đẩy trách nhiệm phục vụ sang cho khách hàng; kênh số phải làm", "s": "p", "l": false}, {"t": "cho việc phục vụ trở nên thuận tiện hơn, minh bạch hơn và liền mạch hơn.", "s": "p", "l": false}]}, {"num": "34", "title": "Nguyên tắc thiết kế, quản trị trải nghiệm số và bảo mật dữ liệu khách hàng", "blocks": [{"t": "Bên cạnh chuẩn mực ứng xử của từng cá nhân trên kênh số đã nêu tại Điều 30 và Điều 41, các đơn vị, bộ phận vận hành kênh số có trách nhiệm bảo đảm các nguyên tắc sau, để khách hàng tiếp cận dịch vụ thuận tiện, minh bạch, liền mạch và an toàn.", "s": "p", "l": false}, {"t": "1. Thiết kế trải nghiệm số", "s": "h4", "l": false}, {"t": "a) Minh bạch không cần hỏi: mọi màn hình hiển thị số tiền, sản lượng hoặc thủ tục phải kèm lối xem cách tính và quy định liên quan; hiển thị đầy đủ hạn thanh toán, hạn xử lý, không để trống trường thời hạn.", "s": "li", "l": true}, {"t": "b) Khép vòng mọi yêu cầu: mỗi thao tác của khách hàng phải nhận được xác nhận tiếp nhận, mốc thời gian dự kiến và thông báo khi hoàn tất.", "s": "li", "l": true}, {"t": "c) Ngôn ngữ dễ hiểu và phục vụ bao trùm: dùng ngôn ngữ thuần Việt, đúng mực, không hù dọa; duy trì lối liên hệ với người hỗ trợ thật và giữ kênh phục vụ phi số song song, không lấy việc đã có ứng dụng làm lý do giảm phục vụ trực tiếp nhóm yếu thế.", "s": "li", "l": true}, {"t": "2. Quản trị vận hành ứng dụng", "s": "h4", "l": false}, {"t": "a) Đồng nhất đa kênh: thông tin trên ứng dụng, website, tin nhắn và tổng đài phải nhất quán; khắc phục triệt để tình trạng dữ liệu chưa đồng bộ giữa các nền tảng.", "s": "li", "l": true}, {"t": "b) Chủ động thông báo theo tiến độ: hệ thống tự động báo trước, cập nhật và thông báo hoàn tất đối với mọi dịch vụ có tiến trình xử lý.", "s": "li", "l": true}, {"t": "c) Không gián đoạn thầm lặng: việc bảo trì, thay đổi hoặc sự cố ứng dụng phải được thông báo trước; thông điệp lỗi phải chỉ rõ khách hàng cần làm gì tiếp theo.", "s": "li", "l": true}, {"t": "3. Quản lý dữ liệu khách hàng", "s": "h4", "l": false}, {"t": "a) Dữ liệu đúng, đủ, đồng bộ, kịp thời: chỉ số, hóa đơn, tiến độ phải chính xác, cập nhật theo thời gian thực; kiểm soát và xử lý kịp thời các sai lệch số liệu.", "s": "li", "l": true}, {"t": "b) Minh bạch quyền dữ liệu: khách hàng có quyền xem, tải và đối chiếu dữ liệu tiêu thụ của mình; công khai nguyên tắc tính toán. Đối với điện mặt trời mái nhà, việc đối soát sản lượng mua – bán phải rõ ràng và tra cứu được.", "s": "li", "l": true}, {"t": "4. An toàn, bảo mật thông tin", "s": "h4", "l": false}, {"t": "a) An toàn giao dịch số: bảo đảm cơ chế xác thực an toàn; cảnh báo khách hàng về các hình thức lừa đảo, giả mạo; hướng dẫn khách hàng chỉ giao dịch, thanh toán qua kênh chính thức.", "s": "li", "l": true}, {"t": "b) Phòng ngừa và xử lý sự cố dữ liệu: chủ động giám sát rủi ro an ninh thông tin; khi xảy ra sự cố lộ, lọt dữ liệu phải kịp thời khắc phục, thông báo và bảo vệ quyền lợi khách hàng theo quy định.", "s": "li", "l": true}]}, {"num": "35", "title": "Ứng xử văn hóa tại điểm nối giữa kênh số và con người", "blocks": [{"t": "1. Khi khách hàng chuyển từ website, mobile app, chatbot, email, mạng xã hội hoặc cổng dịch vụ công sang", "s": "p", "l": false}, {"t": "tổng đài, điểm giao dịch hoặc hiện trường, phải tiếp nhận theo tinh thần liên thông thông tin, hạn chế tối đa việc yêu cầu khách hàng trình bày lại toàn bộ nội dung đã cung cấp.", "s": "p", "l": false}, {"t": "2. Trường hợp vẫn cần khách hàng cung cấp lại một số thông tin, phải giải thích rõ lý do và chỉ yêu cầu", "s": "p", "l": false}, {"t": "những nội dung thật sự cần thiết.", "s": "p", "l": false}, {"t": "3. Khi chuyển yêu cầu giữa các kênh, các bộ phận hoặc các cấp xử lý, phải bảo đảm thông tin đi cùng vụ", "s": "p", "l": false}, {"t": "việc, trách nhiệm đi cùng chuyển tiếp và khách hàng biết rõ đầu mối tiếp theo.", "s": "p", "l": false}, {"t": "MỤC III ỨNG XỬ VĂN HÓA TRONG CÁC HÀNH TRÌNH TRẢI NGHIỆM KHÁCH HÀNG TRỌNG YẾU", "s": "p", "l": false}]}]}, {"num": "III", "title": "ỨNG XỬ VĂN HÓA TRONG CÁC HÀNH TRÌNH TRẢI NGHIỆM KHÁCH HÀNG TRỌNG YẾU", "articles": [{"num": "36", "title": "Quy tắc chung về ứng xử văn hóa trong các hành trình khách hàng trọng yếu", "blocks": [{"t": "1. Hành trình trải nghiệm khách hàng trọng yếu là chuỗi điểm tiếp xúc liên tiếp mà trong đó khách hàng", "s": "p", "l": false}, {"t": "không chỉ mong nhận được kết quả dịch vụ, mà còn mong được thông tin rõ ràng, được đối xử minh bạch, được đồng hành có trách nhiệm và được tôn trọng trong suốt quá trình phục vụ.", "s": "p", "l": false}, {"t": "2. Trong mọi hành trình trải nghiệm khách hàng trọng yếu, phải bảo đảm nhất quán các yêu cầu sau đây: a)", "s": "p", "l": false}, {"t": "đúng hẹn và giữ cam kết; b) chủ động thông tin ở các mốc cần thiết; c) minh bạch và dễ hiểu về quy trình, chi phí, kết quả, chứng từ và căn cứ xử lý; d) rõ trách nhiệm, phối hợp liền mạch, đồng hành đến kết quả; đ) lắng nghe, thấu hiểu và hỗ trợ phù hợp với khách hàng, hoàn cảnh; e) khép lại hành trình bằng việc giúp khách hàng hiểu rõ kết quả, biết bước tiếp theo và yên tâm hơn trong tương tác với EVN.", "s": "p", "l": false}, {"t": "3. Tên các hành trình trong Mục này được sử dụng theo thuật ngữ chuẩn của Quy trình KDĐN EVN, bảo đảm", "s": "p", "l": false}, {"t": "thống nhất trong toàn EVN, gồm các thuật ngữ như HĐMBĐ, TBĐĐ, ghi chỉ số công tơ, ngừng hoặc giảm cung cấp điện và DPPA.", "s": "p", "l": false}, {"t": "4. Các hành trình trọng yếu dưới đây được trình bày đầy đủ hơn do có mức độ phổ biến cao, mức ảnh hưởng", "s": "p", "l": false}, {"t": "lớn đến cảm nhận của khách hàng hoặc gắn với các điểm dễ phát sinh đứt gãy trải nghiệm.", "s": "p", "l": false}]}, {"num": "37", "title": "Hành trình cấp điện mới", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Cấp điện mới là hành trình mở đầu quan hệ chính thức giữa khách hàng và ngành Điện. Đây là ấn tượng đầu tiên, và ấn tượng ấy thường định hình cách khách hàng nhìn nhận EVN trong suốt nhiều năm sau đó. Khác với suy nghĩ thông thường, bản chất hành trình không nằm ở việc lắp đặt một công tơ hay đấu nối một đường dây, mà ở việc khách hàng được dẫn dắt qua một quy trình xa lạ một cách rõ ràng và yên tâm. Với phần lớn khách hàng, đây là lần hiếm hoi họ tiếp xúc trực tiếp với thủ tục ngành Điện, nên mỗi bước đều mới mẻ. Làm tốt hành trình này là đặt nền móng niềm tin cho cả quan hệ lâu dài.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau gốc rễ không nằm ở việc phải làm thủ tục, mà ở cảm giác hồ sơ không rõ ràng, thời gian chờ đợi trong mơ hồ, chi phí phát sinh và công sức phải bỏ ra để tự xoay xở. Khách hàng không biết hồ sơ đã đến đâu, còn bao lâu nữa có điện, phải chuẩn bị gì tiếp theo, và khi nào thì ai sẽ liên hệ. Sự im lặng giữa các bước khiến họ thấp thỏm, phải chủ động gọi hỏi nhiều lần.", "s": "li", "l": true}, {"t": "b) Điểm đau nặng thêm khi phát sinh chi phí không được báo trước, khi bị đẩy qua lại giữa các bộ phận, hoặc khi lịch hẹn thi công bị lỡ mà không có lời giải thích. Gốc rễ là cảm giác bị bỏ mặc tự tìm đường trong một quy trình mà chỉ EVN mới nắm rõ.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Cần thể hiện tinh thần tận tâm, chuyên nghiệp, minh bạch và theo việc đến cùng. Khách hàng phải được dẫn dắt như một người đồng hành, chứ không bị bỏ lại tự dò đường qua từng thủ tục.", "s": "li", "l": true}, {"t": "b) Tinh thần cốt lõi là chủ động thay khách hàng: chủ động thông tin, chủ động cập nhật tiến độ, chủ động báo trước thay vì để họ phải hỏi mới biết. Việc phối hợp giữa các bộ phận là trách nhiệm nội bộ của EVN, không phải gánh nặng đẩy sang cho khách hàng tự gánh.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Hướng dẫn rõ ràng, đầy đủ, dễ hiểu về điều kiện, hồ sơ, quy trình, thời gian xử lý, chi phí và trách nhiệm của các bên ngay từ đầu.", "s": "li", "l": true}, {"t": "b) Tại website, ứng dụng, cổng dịch vụ công và chatbot, thông tin về thủ tục, hồ sơ, tiến độ và chi phí phải nhất quán, dễ tra cứu, không mâu thuẫn giữa các kênh.", "s": "li", "l": true}, {"t": "c) Tại khâu khảo sát và thi công hiện trường, giải thích rõ hiện trạng, phương án và trách nhiệm xử lý bằng ngôn ngữ khách hàng hiểu được.", "s": "li", "l": true}, {"t": "d) Khi có phát sinh chi phí hoặc chậm tiến độ, phải chủ động báo cho khách hàng, không chờ khách hàng gọi hỏi mới trả lời.", "s": "li", "l": true}, {"t": "e) Bảo đảm có đầu mối theo việc đến cùng; việc chuyển bước giữa các bộ phận là trách nhiệm nội bộ, không để khách hàng tự đi tìm.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "Khách hàng cảm thấy hồ sơ rõ ràng, tiến độ luôn được cập nhật, chi phí minh bạch và luôn có một đầu mối theo việc đến cùng. Họ không phải thấp thỏm chờ đợi hay tự gọi hỏi nhiều lần, mà yên tâm vì biết mình đang ở bước nào và còn gì phía trước.", "s": "p", "l": false}, {"t": "Quan trọng nhất, kết thúc hành trình, khách hàng không chỉ đã được cấp điện mà còn đã hiểu, đã yên tâm và biết rõ cách tiếp tục tương tác với EVN sau này. Ấn tượng đầu tiên ấy trở thành nền tảng tin cậy cho cả quan hệ lâu dài.", "s": "p", "l": false}]}, {"num": "38", "title": "Hành trình báo và xử lý mất điện, sự cố", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Báo và xử lý mất điện là hành trình có cường độ cảm xúc cao nhất trong quan hệ giữa khách hàng và EVN. Mất điện không chỉ là gián đoạn một dịch vụ, mà làm đảo lộn sinh hoạt, sản xuất và đôi khi đe dọa an toàn của khách hàng. Đây là thời điểm khách hàng dễ tổn thương nhất và cũng kỳ vọng nhiều nhất vào sự hiện diện của EVN. Bản chất hành trình vì thế không nằm ở việc khắc phục sự cố nhanh hay chậm về mặt kỹ thuật, mà ở việc khách hàng có cảm thấy được đồng hành trong lúc chờ đợi hay không. Một sự cố được xử lý chậm nhưng có thông tin minh bạch vẫn tốt hơn một sự cố xử lý nhanh nhưng để khách hàng chờ trong im lặng.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau nặng nhất không nằm ở bản thân việc mất điện, mà ở cảm giác bị bỏ rơi trong bất định: khách hàng không liên hệ được, không biết nguyên nhân, không biết bao giờ có điện trở lại, nên không thể chủ động sắp xếp công việc và cuộc sống.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai đến từ sự im lặng và thiếu nhất quán: gọi tổng đài không ai bắt máy hoặc chỉ nhận câu trả lời chung chung, thông tin trên các kênh khác nhau lại khác nhau, khiến khách hàng cảm thấy EVN không thực sự quan tâm và không kiểm soát được tình hình.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Thể hiện sự bình tĩnh, thấu hiểu và nghĩa tình: dù chưa thể khôi phục điện ngay, vẫn cho khách hàng thấy họ không bị bỏ lại một mình và sự khó khăn của họ được ghi nhận.", "s": "li", "l": true}, {"t": "b) Đề cao minh bạch và trách nhiệm chủ động: chủ động cung cấp thông tin trong khả năng có thể, thay vì để khách hàng phải đi tìm, và giữ thông tin nhất quán trên mọi kênh.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Tại các kênh số như ứng dụng, website, chatbot và tổng đài, phải tạo điều kiện để khách hàng báo sự cố dễ dàng, xác nhận rõ đã tiếp nhận và phản hồi bước đầu trong thời gian ngắn nhất.", "s": "li", "l": true}, {"t": "b) Chủ động cung cấp thông tin về nguyên nhân trong phạm vi có thể, khu vực ảnh hưởng và thời gian dự kiến khôi phục; cập nhật kịp thời khi có thay đổi, không để khách hàng chờ trong im lặng.", "s": "li", "l": true}, {"t": "c) Bảo đảm thông tin nhất quán trên mọi kênh; khi khách hàng chuyển từ kênh số sang hỗ trợ trực tiếp, tiếp nhận theo tinh thần liên thông, không bắt họ trình bày lại từ đầu.", "s": "li", "l": true}, {"t": "d) Ưu tiên xử lý và thông tin cho các trường hợp khẩn cấp, khách hàng quan trọng và đối tượng dễ tổn thương.", "s": "li", "l": true}, {"t": "e) Sau khi khôi phục, xác nhận với khách hàng và thể hiện sự quan tâm, biến thời điểm kết thúc sự cố thành cơ hội củng cố niềm tin.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng cảm thấy được lắng nghe và ghi nhận ngay khi báo sự cố, biết rằng yêu cầu của mình đã đến đúng nơi.", "s": "li", "l": true}, {"t": "b) Khách hàng nắm được tình hình: hiểu nguyên nhân trong mức có thể và biết khi nào điện trở lại, nhờ đó chủ động sắp xếp.", "s": "li", "l": true}, {"t": "c) Khách hàng cảm thấy được đồng hành trong suốt thời gian chờ, không bị bỏ rơi trong im lặng.", "s": "li", "l": true}, {"t": "d) Khi có điện trở lại, khách hàng cảm thấy yên tâm và tin tưởng hơn vào trách nhiệm của EVN, thay vì chỉ nhẹ nhõm vì hết mất điện.", "s": "li", "l": true}]}, {"num": "39", "title": "Hành trình thanh toán tiền điện", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Thanh toán tiền điện là hành trình lặp lại đều đặn nhất và thường xuyên nhất trong suốt vòng đời quan hệ giữa khách hàng và EVN. Mỗi tháng một lần, đây là điểm chạm duy trì cảm nhận liên tục về chất lượng phục vụ, và cũng là nơi khách hàng trực tiếp bỏ tiền ra. Bản chất hành trình không nằm ở thao tác thu tiền hay phương thức thanh toán, mà ở việc khách hàng có tin rằng số tiền mình trả là đúng và công bằng hay không.", "s": "p", "l": false}, {"t": "Vì lặp lại thường xuyên, mỗi trải nghiệm nhỏ đều tích lũy: một lần hóa đơn khó hiểu, một lần thanh toán rồi vẫn bị nhắc nợ, đều có thể bào mòn niềm tin được xây dựng qua nhiều tháng phục vụ tốt.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau nặng nhất là nghi ngờ về tính chính trực của con số: khách hàng không hiểu vì sao hóa đơn tháng này tăng, không có căn cứ rõ ràng để đối chiếu, nên dễ cho rằng mình bị tính sai hoặc bị tính nhiều hơn thực tế.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai đến từ sự gián đoạn và thiếu ghi nhận kịp thời: khách hàng đã thanh toán nhưng vẫn bị nhắc nợ hoặc bị gián đoạn điện do lỗi đồng bộ dữ liệu, khiến họ cảm thấy nỗ lực thực hiện đúng nghĩa vụ của mình không được tôn trọng.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Đề cao minh bạch và chính trực: chủ động giải thích căn cứ tính tiền một cách rõ ràng, dễ hiểu, để khách hàng yên tâm rằng con số là công bằng, thay vì chờ khách hàng thắc mắc mới giải thích.", "s": "li", "l": true}, {"t": "b) Thể hiện sự trân trọng và ghi nhận kịp thời: coi mỗi lần khách hàng thanh toán là một lần giữ chữ tín với EVN, và đáp lại bằng việc ghi nhận nhanh, chính xác, không để sai sót làm tổn thương thiện chí của họ.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Cung cấp hóa đơn rõ ràng, dễ hiểu, kèm căn cứ tính tiền để khách hàng có thể đối chiếu; chủ động giải thích khi hóa đơn biến động bất thường, không để khách hàng tự suy đoán.", "s": "li", "l": true}, {"t": "b) Tạo điều kiện thanh toán thuận tiện, đa dạng kênh, phù hợp với mọi nhóm khách hàng kể cả người ít dùng công nghệ.", "s": "li", "l": true}, {"t": "c) Ghi nhận thanh toán nhanh và chính xác; bảo đảm dữ liệu được đồng bộ kịp thời để không xảy ra việc đã trả tiền vẫn bị nhắc nợ hoặc gián đoạn điện.", "s": "li", "l": true}, {"t": "d) Khi có sai sót do lỗi của EVN, chủ động nhận lỗi, xin lỗi và khắc phục bằng hành động cụ thể, không để khách hàng phải chứng minh mình đã trả tiền.", "s": "li", "l": true}, {"t": "e) Cung cấp chứng từ đầy đủ và hướng dẫn rõ cách tra cứu lịch sử thanh toán, cách khiếu nại khi khách hàng còn băn khoăn về hóa đơn.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng hiểu được vì sao hóa đơn có số tiền như vậy và tin rằng con số là đúng, công bằng.", "s": "li", "l": true}, {"t": "b) Khách hàng thấy việc thanh toán thuận tiện, nhẹ nhàng, không mất công sức hay thời gian không cần thiết.", "s": "li", "l": true}, {"t": "c) Khách hàng cảm thấy nỗ lực trả tiền đúng hạn của mình được ghi nhận kịp thời và trân trọng.", "s": "li", "l": true}, {"t": "d) Khi có sai sót, khách hàng cảm thấy được EVN chủ động đứng ra giải quyết, thay vì phải tự chứng minh mình đúng.", "s": "li", "l": true}]}, {"num": "40", "title": "Hành trình treo, tháo và kiểm định thiết bị đo đếm", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Treo, tháo và kiểm định thiết bị đo đếm là hành trình quyết định con số làm căn cứ tính tiền điện cho khách hàng. Khác với các hành trình khác, đây là nơi khách hàng ở thế bị động hoàn toàn về chuyên môn: họ không thể tự kiểm chứng công tơ chạy đúng hay sai, mà phải tin vào kết quả do chính bên bán điện đưa ra. Bản chất hành trình vì thế không nằm ở thao tác kỹ thuật, mà ở việc kiểm chứng sự công bằng của con số. Mỗi lần treo, tháo hay kiểm định đều chạm tới câu hỏi nhạy cảm nhất: liệu tôi có đang bị tính đúng số tiền mình phải trả, khi người đo cũng chính là người thu tiền.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau nặng nhất là nghi ngờ về tính công bằng: bên thực hiện kiểm định cũng chính là bên hưởng lợi từ kết quả, tạo ra xung đột về niềm tin; khi không được mời chứng kiến hoặc kết quả chỉ là một con số không giải thích, khách hàng dễ cho rằng mình bị áp đặt.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai là cảm giác mất kiểm soát và không có tiếng nói: hóa đơn thay đổi sau kiểm định nhưng khách hàng không hiểu vì sao, không biết dựa vào đâu để đối chiếu, và cảm thấy mình đứng ngoài một việc liên quan trực tiếp đến tiền của mình.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Đề cao minh bạch và công tâm: mọi thao tác và kết quả cần công khai đến mức khách hàng cảm thấy yên tâm, biến một việc dễ gây nghi ngờ thành quá trình chứng minh sự công bằng.", "s": "li", "l": true}, {"t": "b) Tôn trọng quyền của khách hàng và đồng hành kiểm chứng: nhìn nhận khách hàng là một bên có quyền được biết, được chứng kiến và được giải thích, chứ không phải đối tượng bị kiểm tra.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Thông báo trước cho khách hàng về việc treo, tháo, kiểm định và mời họ chứng kiến; tôn trọng quyền có mặt của khách hàng tại thời điểm thực hiện.", "s": "li", "l": true}, {"t": "b) Giải thích rõ lý do, quy trình, căn cứ pháp lý và quyền của khách hàng bằng ngôn ngữ dễ hiểu, trước và trong khi thực hiện.", "s": "li", "l": true}, {"t": "c) Lập biên bản đầy đủ, có xác nhận của khách hàng; bàn giao kết quả kiểm định và giải thích ý nghĩa con số ở mức khách hàng cần hiểu.", "s": "li", "l": true}, {"t": "d) Khi kết quả ảnh hưởng đến hóa đơn, chủ động giải thích cơ sở thay đổi, không để khách hàng tự suy đoán.", "s": "li", "l": true}, {"t": "e) Hướng dẫn rõ quyền và cách khiếu nại, yêu cầu kiểm định lại nếu khách hàng còn băn khoăn về kết quả.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng cảm thấy được tôn trọng trong suốt quá trình kiểm chứng, được mời chứng kiến chứ không bị làm việc sau lưng.", "s": "li", "l": true}, {"t": "b) Khách hàng hiểu được kết quả ở mức cần thiết và biết con số dựa trên căn cứ rõ ràng.", "s": "li", "l": true}, {"t": "c) Khách hàng tin rằng mình được đối xử công bằng, dù không có chuyên môn kỹ thuật.", "s": "li", "l": true}, {"t": "d) Khách hàng yên tâm rằng EVN không lợi dụng vị thế chuyên môn để áp đặt, và biết rõ mình có quyền lên tiếng nếu còn băn khoăn.", "s": "li", "l": true}]}, {"num": "41", "title": "Hành trình đôn đốc và xử lý nợ tiền điện", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Đôn đốc và xử lý nợ tiền điện là hành trình đặc thù và nhạy cảm nhất trong quan hệ giữa khách hàng và EVN, bởi đây là nơi tồn tại quyền lực bất đối xứng: EVN có quyền ngừng cấp một dịch vụ thiết yếu như một biện pháp cưỡng chế. Khách hàng trong hành trình này vừa là người chưa thực hiện nghĩa vụ, vừa là người dễ tổn thương, vì việc mất điện do bị cắt ảnh hưởng nặng nề đến sinh hoạt và phẩm giá. Bản chất hành trình không nằm ở việc thu hồi được nợ, mà ở cách EVN thực thi quyền của mình một cách chính danh, đúng quy định và nhân văn, để ngay cả khi phải đôn đốc hay ngừng cấp điện, khách hàng vẫn cảm thấy được đối xử như một con người, không bị hạ thấp.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau nặng nhất là cảm giác bị đối xử thiếu tôn trọng và bị áp đặt: khi việc nhắc nợ mang giọng đe dọa, gây áp lực hoặc làm khách hàng xấu hổ, họ cảm thấy phẩm giá bị tổn thương, dù lỗi chậm trả có thể đến từ khó khăn thực sự hoặc nhầm lẫn.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai là sự bất ngờ và thiếu lối thoát: bị ngừng cấp điện mà không được báo trước rõ ràng, không hiểu căn cứ và thời hạn, hoặc không được biết cách khắc phục, khiến khách hàng rơi vào thế bị động và mất niềm tin.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Đề cao sự tôn trọng và nhân văn: giữ thái độ điềm đạm, không phán xét, không gây áp lực hay làm khách hàng mất thể diện; coi việc đôn đốc là nhắc nhở đồng hành chứ không phải trừng phạt.", "s": "li", "l": true}, {"t": "b) Đề cao tính chính danh và minh bạch: thực hiện đúng quy định, đúng trình tự và đúng thời hạn, công khai căn cứ và luôn dành cho khách hàng lối thoát rõ ràng để khắc phục.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Nhắc nợ sớm, lịch sự và rõ ràng về số nợ, thời hạn và hệ quả; chọn thời điểm và cách thức nhắc phù hợp, không gây phiền hà hay làm khách hàng mất thể diện.", "s": "li", "l": true}, {"t": "b) Giải thích minh bạch căn cứ, trình tự và mốc thời gian trước khi áp dụng biện pháp ngừng cấp điện; bảo đảm khách hàng được báo trước theo đúng quy định.", "s": "li", "l": true}, {"t": "c) Luôn mở lối khắc phục: hướng dẫn rõ cách thanh toán, các phương án hỗ trợ và điều kiện cấp điện trở lại.", "s": "li", "l": true}, {"t": "d) Đặc biệt thận trọng và nhân văn với hộ khó khăn, đối tượng yếu thế và khách hàng quan trọng về an toàn; cân nhắc kỹ trước khi thực hiện biện pháp cứng rắn.", "s": "li", "l": true}, {"t": "e) Khi khách hàng đã thanh toán, cấp điện trở lại nhanh nhất có thể và xác nhận rõ ràng, không để họ chờ đợi thêm trong thế bị động.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng cảm thấy được nhắc nhở một cách tôn trọng, không bị đe dọa hay hạ thấp phẩm giá.", "s": "li", "l": true}, {"t": "b) Khách hàng hiểu rõ số nợ, căn cứ, thời hạn và hệ quả, không bị bất ngờ trước bất kỳ biện pháp nào.", "s": "li", "l": true}, {"t": "c) Khách hàng luôn thấy có lối thoát rõ ràng để khắc phục và biết cách được cấp điện trở lại.", "s": "li", "l": true}, {"t": "d) Ngay cả khi bị ngừng cấp điện, khách hàng vẫn cảm thấy EVN hành xử công bằng, đúng quy định và nhân văn, thay vì lạm dụng quyền lực.", "s": "li", "l": true}]}, {"num": "42", "title": "Hành trình khắc phục rò điện, bảo đảm an toàn điện", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Khắc phục rò điện, bảo đảm an toàn điện là hành trình duy nhất mà sai sót có thể đe dọa trực tiếp đến tính mạng con người. Khác với mọi hành trình khác vốn xoay quanh tiền bạc, thời gian hay sự thuận tiện, đây là nơi giá trị cao nhất là sinh mạng và sự an toàn của khách hàng cùng cộng đồng. Bản chất hành trình không nằm ở việc xử lý xong sự cố kỹ thuật, mà ở việc bảo vệ con người khỏi nguy hiểm một cách kịp thời và có trách nhiệm. Mỗi tình huống rò điện đều là phép thử về việc EVN có thực sự đặt an toàn của khách hàng lên trên mọi yếu tố khác hay không, kể cả khi nguyên nhân nằm ngoài phạm vi tài sản do EVN quản lý.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau nặng nhất là cảm giác bất an và nguy hiểm không được ứng phó kịp thời: khi phát hiện dấu hiệu rò điện, nguy cơ cháy nổ hay giật điện, khách hàng cần sự can thiệp ngay lập tức, nên bất kỳ sự chậm trễ, thờ ơ hay đùn đẩy nào cũng làm nỗi sợ tăng lên gấp bội.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai là sự đùn đẩy trách nhiệm theo ranh giới tài sản: khi EVN viện lý do sự cố nằm ngoài phạm vi quản lý để từ chối hỗ trợ, khách hàng cảm thấy bị bỏ mặc trong tình huống nguy hiểm và mất niềm tin vào trách nhiệm của ngành điện.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Đặt an toàn tính mạng lên trên hết: ưu tiên tuyệt đối việc bảo vệ con người, phản ứng khẩn trương và chủ động cảnh báo nguy hiểm, không để bất kỳ yếu tố nào trì hoãn việc bảo đảm an toàn.", "s": "li", "l": true}, {"t": "b) Đề cao trách nhiệm và nghĩa tình vượt trên ranh giới tài sản: không đùn đẩy, luôn hỗ trợ và hướng dẫn khách hàng xử lý an toàn ngay cả khi sự cố nằm ngoài phạm vi quản lý của EVN.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Tiếp nhận ngay và ưu tiên cao nhất mọi phản ánh về rò điện, mất an toàn; xác nhận đã tiếp nhận và hướng dẫn khách hàng biện pháp phòng tránh nguy hiểm tức thời.", "s": "li", "l": true}, {"t": "b) Hướng dẫn rõ và bình tĩnh các bước bảo đảm an toàn ngay trong lúc chờ xử lý, như tránh xa khu vực nguy hiểm, ngắt nguồn điện nếu an toàn để làm.", "s": "li", "l": true}, {"t": "c) Nhanh chóng cử lực lượng đến hiện trường xử lý; trong khi di chuyển vẫn giữ liên lạc và trấn an khách hàng.", "s": "li", "l": true}, {"t": "d) Khi sự cố nằm ngoài phạm vi tài sản của EVN, vẫn hỗ trợ cảnh báo, hướng dẫn và kết nối phương án xử lý an toàn, không từ chối với lý do ranh giới trách nhiệm.", "s": "li", "l": true}, {"t": "e) Sau khi xử lý, giải thích rõ nguyên nhân, biện pháp đã thực hiện và khuyến nghị phòng ngừa để khách hàng yên tâm và chủ động phòng tránh về sau.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng cảm thấy nỗi lo về an toàn được tiếp nhận và ứng phó ngay lập tức, không bị xem nhẹ.", "s": "li", "l": true}, {"t": "b) Khách hàng cảm thấy được bảo vệ và đồng hành trong tình huống nguy hiểm, không bị bỏ mặc một mình.", "s": "li", "l": true}, {"t": "c) Khách hàng tin rằng EVN đặt an toàn của mình lên trên ranh giới trách nhiệm hay lợi ích, kể cả khi sự cố ngoài phạm vi quản lý.", "s": "li", "l": true}, {"t": "d) Sau khi khắc phục, khách hàng cảm thấy an tâm, hiểu cách phòng tránh và tin tưởng sâu sắc hơn vào trách nhiệm của ngành điện.", "s": "li", "l": true}]}, {"num": "43", "title": "Hành trình tiếp nhận phản ánh, khiếu nại", "blocks": [{"t": "1. Bản chất hành trình", "s": "h4", "l": false}, {"t": "Tiếp nhận phản ánh, khiếu nại là hành trình phục hồi niềm tin, thường xuất hiện khi một hành trình khác đã không trọn vẹn. Khách hàng đến với khiếu nại không đơn thuần để báo một lỗi, mà mang theo sự thất vọng và mong muốn được sửa chữa. Đây là cơ hội cuối cùng và quý giá nhất để cứu vãn quan hệ: làm tốt thì một khách hàng bức xúc có thể trở thành khách hàng trung thành, làm dở thì mất niềm tin vĩnh viễn.", "s": "p", "l": false}, {"t": "Bản chất hành trình không nằm ở việc tiếp nhận hay phản hồi cho có, mà ở việc giải quyết vấn đề đến cùng và khôi phục cảm giác được tôn trọng. Mỗi khiếu nại được xử lý trọn vẹn còn là một nguồn thông tin quý để EVN hoàn thiện chính mình.", "s": "p", "l": false}, {"t": "2. Gốc rễ điểm đau trải nghiệm", "s": "h4", "l": false}, {"t": "a) Điểm đau n ặng nhất là vấn đề không được giải quyết đến cùng: khách hàng chỉ nhận được sự tiếp nhận, lời hứa hoặc câu trả lời chung chung, rồi việc bị bỏ lửng, phải khiếu nại lặp đi lặp lại cùng một chuyện mà không có kết quả thực sự.", "s": "li", "l": true}, {"t": "b) Điểm đau thứ hai là cảm giác không được tôn trọng và bị đẩy đi: khi gặp thái độ phòng thủ, biện minh, đùn đẩy giữa các bộ phận hoặc bị xem nhẹ, khách hàng vốn đã bức xúc lại càng tổn thương và mất niềm tin.", "s": "li", "l": true}, {"t": "3. Tinh thần ứng xử văn hóa", "s": "h4", "l": false}, {"t": "a) Đề cao sự c ầu thị và tôn trọng: đón nhận khiếu nại như một món quà giúp EVN tốt lên, giữ thái độ bình tĩnh, không phản ứng lại, không biện minh, đặt mình vào vị trí của khách hàng.", "s": "li", "l": true}, {"t": "b) Đề cao trách nhiệm theo đến cùng: coi việc giải quyết trọn vẹn là cam kết, không dừng ở tiếp nhận; xem việ c phối hợp giữa các bộ phận là trách nhiệm nội bộ của EVN, không để khách hàng gánh.", "s": "li", "l": true}, {"t": "4. Điểm chú ý then chốt", "s": "h4", "l": false}, {"t": "a) Tiếp nhận với thái độ bình tĩnh, cầu thị, không phản ứng lại hay biện minh; lắng nghe trọn vẹn, ghi nhận đầy đủ và thể hiện sự thấu hiểu với bức xúc của khách hàng.", "s": "li", "l": true}, {"t": "b) Tìm hiểu rõ gốc rễ vấn đề, xác định đúng nguyên nhân thay vì xử lý bề mặt; chỉ rõ một đầu mối chịu trách nhiệm theo dõi..", "s": "li", "l": true}, {"t": "c) Chủ động thông tin tiến trình giải quyết, cho khách hàng biết vấn đề đang ở bước nào và dự kiến khi nào có kết quả, không để họ phải hỏi mới biết.", "s": "li", "l": true}, {"t": "d) Theo đuổi đến khi có kết quả thực sự; coi phối hợp nội bộ là trách nhiệm của EVN, không đẩy khách hàng qua lại giữa các bộ phận.", "s": "li", "l": true}, {"t": "e) Sau khi giải quyết, xác nhận kết quả với khách hàng, ghi nhận bài học và cải tiến để lỗi không lặp lại.", "s": "li", "l": true}, {"t": "5. Cách khép lại bằng cảm nhận tích cực", "s": "h4", "l": false}, {"t": "a) Khách hàng cảm thấy bức xúc của mình được lắng nghe nghiêm túc và được tôn trọng, thay vì bị xem nhẹ hay đẩy đi.", "s": "li", "l": true}, {"t": "b) Khách hàng nắm được tiến trình xử lý, biết ai đang giải quyết và khi nào có kết quả, không còn cảm giác bị bỏ lửng.", "s": "li", "l": true}, {"t": "c) Khách hàng thấy vấn đề được giải quyết đến cùng, dứt điểm, không phải khiếu nại lại cùng một chuyện.", "s": "li", "l": true}, {"t": "d) Sau khi được giải quyết, khách hàng cảm thấy tin tưởng trở lại, thậm chí gắn bó hơn vì thấy EVN thực sự cầu thị và có trách nhiệm.", "s": "li", "l": true}]}, {"num": "44", "title": "Đối với các hành trình khách hàng khác", "blocks": [{"t": "1. Tìm hiểu thông tin và yêu cầu dịch vụ điện", "s": "h4", "l": false}, {"t": "1.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Dễ tìm và dễ tiếp cận thông tin về các dịch vụ điện ở bất cứ kênh nào mình quen dùng, không phải đi nhiều nơi hay hỏi nhiều lần mới có câu trả lời.", "s": "li", "l": true}, {"t": "b) Dễ hiểu nội dung được cung cấp: điều kiện, hồ sơ, trình tự, thời gian và chi phí được trình bày rõ ràng, bằng ngôn ngữ gần gũi, để tự nắm được mình cần làm gì.", "s": "li", "l": true}, {"t": "c) Dễ biết mình nên bắt đầu từ đâu và liên hệ với ai, để chuyển từ tìm hiểu sang gửi yêu cầu một cách thuận lợi, không bị lúng túng giữa nhiều đầu mối.", "s": "li", "l": true}, {"t": "1.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Thông tin tản mát, không nhất quán giữa các kênh: mỗi nơi nói một kiểu, hoặc nội dung trên website, ứng dụng và tổng đài vênh nhau, khiến khách hàng hoang mang không biết tin vào đâu.", "s": "li", "l": true}, {"t": "b) Thông tin khó hiểu hoặc thiếu hụt: dùng nhiều thuật ngữ chuyên ngành, trình bày rườm rà, không nêu đủ điều kiện, hồ sơ, thời gian và chi phí, khiến khách hàng vẫn mơ hồ sau khi đã tìm hiểu.", "s": "li", "l": true}, {"t": "c) Không rõ đầu mối và bước tiếp theo: khách hàng không biết liên hệ với ai, bắt đầu từ đâu, bị đẩy qua lại giữa các bộ phận và cảm thấy bị bỏ mặc ngay từ khâu đầu tiên.", "s": "li", "l": true}, {"t": "1.3. Định hướng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Bảo đảm thông tin đầy đủ, chính xác và nhất quán trên mọi kênh, để khách hàng nhận được cùng một câu trả lời dù tiếp cận ở đâu.", "s": "li", "l": true}, {"t": "b) Trình bày thông tin rõ ràng, dễ hiểu, bằng ngôn ngữ gần gũi; nêu đủ điều kiện, hồ sơ, trình tự, thời gian và chi phí của từng dịch vụ.", "s": "li", "l": true}, {"t": "c) Chỉ rõ đầu mối tiếp nhận và hướng dẫn cụ thể bước tiếp theo, giúp khách hàng chuyển từ tìm hiểu sang gửi yêu cầu thuận lợi.", "s": "li", "l": true}, {"t": "d) Chủ động hỏi nhu cầu và hướng dẫn tận tình hơn mong đợi; không để khách hàng tự xoay xở hay phải tự tìm đường giữa các bộ phận.", "s": "li", "l": true}, {"t": "2. Thay đổi, gia hạn, chấm dứt hợp đồng mua bán điện (HĐMBĐ)", "s": "h4", "l": false}, {"t": "2.1. Điều khách hàn g mong đợi", "s": "p", "l": false}, {"t": "a) Biết rõ điều kiện và giấy tờ cần thiết cho đúng loại việc mình cần làm, dù là thay đổi thông tin, thay đổi chủ thể, gia hạn hay chấm dứt HĐMBĐ.", "s": "li", "l": true}, {"t": "b) Biết rõ thời gian xử lý và đầu mối tiếp nhận, để chủ động chuẩn bị và không phải đi lại nhiều lần.", "s": "li", "l": true}, {"t": "c) Hiểu rõ ảnh hưởng và hệ quả của việc thay đổi hoặc chấm dứt hợp đồng đối với việc sử dụng điện và các nghĩa vụ liên quan của mình.", "s": "li", "l": true}, {"t": "2.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Hồ sơ không rõ ràng: không biết cần giấy tờ gì cho đúng loại việc, được yêu cầu bổ sung nhiều lần, khiến khách hàng mất thời gian và công sức.", "s": "li", "l": true}, {"t": "b) Đầu mối không rõ và phối hợp nội bộ chậm: khách hàng bị đẩy qua lại giữa các bộ phận, phải đi lại nhiều lần do các khâu bên trong EVN xử lý thiếu thông suốt.", "s": "li", "l": true}, {"t": "c) Không rõ tiến độ và trạng thái sau xử lý: khách hàng không biết hồ sơ đang ở bước nào, không được xác nhận hợp đồng đã thay đổi hay chấm dứt ra sao, nên thấp thỏm và mơ hồ.", "s": "li", "l": true}, {"t": "2.3. Định hướng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "Xác định và giải thích đúng loại việc, đúng giấy tờ cần thiết và đúng hiệu lực ngay từ đầu, tránh để a) khách hàng phải bổ sung nhiều lần.", "s": "p", "l": false}, {"t": "b) Chỉ rõ một đầu mối tiếp nhận; coi việc phối hợp giữa các bộ phận là trách nhiệm nội bộ của EVN, không để khách hàng tự đi tìm.", "s": "li", "l": true}, {"t": "c) Chủ động thông tin tiến độ xử lý, không để khách hàng phải hỏi mới biết hồ sơ đang ở bước nào.", "s": "li", "l": true}, {"t": "d) Xác nhận rõ ràng trạng thái hợp đồng sau khi xử lý, để khách hàng yên tâm về kết quả và các nghĩa vụ liên quan.", "s": "li", "l": true}, {"t": "3. Nhận thông báo ngừng, giảm cung cấp điện", "s": "h4", "l": false}, {"t": "3.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Được biết trước đủ sớm về việc ngừng, giảm cung cấp điện, để có thời gian chủ động sắp xếp sinh hoạt, sản xuất và công việc.", "s": "li", "l": true}, {"t": "b) Được biết đúng và đầy đủ thông tin: phạm vi ảnh hưởng, thời gian bắt đầu, thời điểm dự kiến khôi phục và lý do ngừng, giảm.", "s": "li", "l": true}, {"t": "c) Được biết kịp thời mọi thay đổi, để không bị động khi lịch ngừng, giảm điện được điều chỉnh, hủy bỏ hay bổ sung.", "s": "li", "l": true}, {"t": "3.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Thông báo muộn: khách hàng nhận tin sát giờ hoặc sau khi đã mất điện, không còn thời gian để chuẩn bị và sắp xếp.", "s": "li", "l": true}, {"t": "b) Thông báo không rõ: thiếu thông tin về khung giờ, phạm vi, lý do hoặc thời điểm khôi phục, khiến khách hàng mơ hồ và lo lắng.", "s": "li", "l": true}, {"t": "c) Thông tin giữa các kênh không thống nhất: nội dung trên ứng dụng, website, tổng đài và điểm giao dịch vênh nhau, khiến khách hàng không biết tin vào đâu.", "s": "li", "l": true}, {"t": "3.3. Định hướng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Thông báo sớm theo đúng quy định, bảo đảm khách hàng có đủ thời gian để chủ động sắp xếp.", "s": "li", "l": true}, {"t": "b) Nêu rõ phạm vi ảnh hưởng, thời gian bắt đầu, thời điểm dự kiến khôi phục và lý do ngừng, giảm cung cấp điện.", "s": "li", "l": true}, {"t": "c) Cập nhật đồng bộ trên các kênh số, tổng đài và điểm giao dịch, bảo đảm khách hàng nhận được cùng một thông tin dù tiếp cận ở đâu.", "s": "li", "l": true}, {"t": "d) Chủ động cập nhật kịp thời khi có thay đổi, điều chỉnh hay khôi phục, không để khách hàng tự dò tìm. Thông tin về hóa đơn và căn cứ tính tiền điện 4.", "s": "li", "l": true}, {"t": "4.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Hiểu được vì sao hóa đơn tháng này có số tiền như vậy: dựa trên chỉ số tiêu thụ nào, áp theo biểu giá ra sao, gồm những khoản gì.", "s": "li", "l": true}, {"t": "b) Có căn cứ rõ ràng để tự đối chiếu khi cần, nhất là khi hóa đơn biến động so với những tháng trước.", "s": "li", "l": true}, {"t": "c) Biết cách tra cứu, thắc mắc và yêu cầu kiểm tra lại nếu còn băn khoăn, để yên tâm rằng con số là đúng và công bằng.", "s": "li", "l": true}, {"t": "4.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Hóa đơn khó hiểu: trình bày nhiều khoản mục, thuật ngữ chuyên ngành, không tách bạch rõ chỉ số, biểu giá và các khoản, khiến khách hàng không nắm được cơ sở tính tiền.", "s": "li", "l": true}, {"t": "b) Thiếu căn cứ để đối chiếu: khi hóa đơn tăng bất thường, khách hàng không được giải thích vì sao và không có cơ sở để so sánh, nên dễ nghi ngờ mình bị tính sai.", "s": "li", "l": true}, {"t": "c) Khó tra cứu và khó được giải đáp: không biết xem lại lịch sử ở đâu, hỏi ai, hoặc khi thắc mắc thì nhận câu trả lời chung chung, làm nghi ngờ tăng lên.", "s": "li", "l": true}, {"t": "4.3. Định hướng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Cung cấp hóa đơn rõ ràng, tách bạch chỉ số tiêu thụ, biểu giá áp dụng và từng khoản, bằng cách trình bày dễ hiểu với mọi nhóm khách hàng.", "s": "li", "l": true}, {"t": "b) Chủ động giải thích cơ sở tính tiền và lý do biến động khi hóa đơn tăng bất thường, không để khách hàng tự suy đoán.", "s": "li", "l": true}, {"t": "c) Hướng dẫn rõ cách tra cứu lịch sử tiêu thụ, hóa đơn và cách đối chiếu, giúp khách hàng tự kiểm chứng thuận lợi.", "s": "li", "l": true}, {"t": "d) Tiếp nhận thắc mắc với tinh thần minh bạch, giải đáp cụ thể và hướng dẫn cách yêu cầu kiểm tra lại khi khách hàng còn băn khoăn.", "s": "li", "l": true}, {"t": "5. Yêu cầu ngừng, cấp điện trở lại", "s": "h4", "l": false}, {"t": "5.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Được thực hiện đúng quy định và đúng thời gian đã hẹn, để chủ động sắp xếp việc sửa chữa, xây dựng hay sử dụng điện của mình.", "s": "li", "l": true}, {"t": "b) Biết rõ điều kiện, thủ tục và chi phí liên quan đến việc ngừng hoặc cấp điện trở lại theo yêu cầu.", "s": "li", "l": true}, {"t": "c) Hiểu rõ hệ quả của việc ngừng, cấp lại đối với hợp đồng và việc sử dụng điện, để quyết định đúng nhu cầu thực tế.", "s": "li", "l": true}, {"t": "5.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Thực hiện không đúng thời gian: chậm so với hẹn hoặc không báo trước khi có thay đổi, làm đảo lộn kế hoạch của khách hàng.", "s": "li", "l": true}, {"t": "b) Không rõ điều kiện, thủ tục, chi phí: khách hàng không biết cần làm gì, mất bao lâu, tốn bao nhiêu, nên lúng túng và bị động.", "s": "li", "l": true}, {"t": "c) Không rõ hệ quả và trạng thái sau xử lý: khách hàng không được giải thích ảnh hưởng đến hợp đồng, hoặc không được xác nhận đã ngừng, đã cấp lại ra sao.", "s": "li", "l": true}, {"t": "5.3. Định hướng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Thực hiện đúng quy định và đúng thời gian đã hẹn; chủ động báo trước nếu có thay đổi, không để khách hàng chờ trong bị động.", "s": "li", "l": true}, {"t": "b) Giải thích rõ điều kiện, thủ tục, thời gian và chi phí ngay từ đầu, bằng ngôn ngữ dễ hiểu.", "s": "li", "l": true}, {"t": "c) Nêu rõ hệ quả của việc ngừng, cấp điện trở lại đối với hợp đồng và việc sử dụng điện, để khách hàng quyết định đúng nhu cầu.", "s": "li", "l": true}, {"t": "d) Xác nhận rõ ràng trạng thái sau khi xử lý, để khách hàng yên tâm về kết quả và các nghĩa vụ liên quan.", "s": "li", "l": true}, {"t": "6. Thay đổi công suất, vị trí thiết bị đo đếm", "s": "h4", "l": false}, {"t": "6.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Hiểu rõ lý do kỹ thuật và phương án thực hiện việc thay đổi công suất hoặc di dời thiết bị đo đếm, để yên tâm rằng việc này là cần thiết và hợp lý.", "s": "li", "l": true}, {"t": "b) Biết rõ thời gian thực hiện và chi phí liên quan, để chủ động chuẩn bị và cân nhắc trước khi quyết định.", "s": "li", "l": true}, {"t": "c) Được thực hiện đúng phương án đã thống nhất, không phát sinh ngoài dự kiến trong quá trình thi công.", "s": "li", "l": true}, {"t": "6.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Thiếu giải thích kỹ thuật: khách hàng không hiểu vì sao phải thay đổi, phương án ra sao, nên nghi ngờ về sự cần thiết và tính hợp lý.", "s": "li", "l": true}, {"t": "b) Không rõ thời gian, chi phí: khách hàng không biết mất bao lâu, tốn bao nhiêu, nên bị động và lo lắng về khoản phát sinh.", "s": "li", "l": true}, {"t": "c) Thay đổi phương án hoặc phát sinh giữa chừng mà không trao đổi: việc thi công lệch so với thống nhất ban đầu, phát sinh chi phí hoặc kéo dài thời gian, khiến khách hàng mất niềm tin.", "s": "li", "l": true}, {"t": "6.3. Định hư ớng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Giải thích rõ lý do kỹ thuật, phương án thực hiện, trách nhiệm của các bên bằng ngôn ngữ dễ hiểu trước khi tiến hành.", "s": "li", "l": true}, {"t": "b) Thông tin rõ thời gian và chi phí ngay từ đầu, để khách hàng chủ động cân nhắc và chuẩn bị.", "s": "li", "l": true}, {"t": "c) Thực hiện đúng phương án đã thống nhất; khi có phát sinh hoặc cần điều chỉnh, chủ động trao đổi và thống nhất lại với khách hàng trước khi làm.", "s": "li", "l": true}, {"t": "d) Cập nhật tiến độ và xác nhận rõ kết quả sau khi hoàn thành, để khách hàng yên tâm về việc đã thực hiện.", "s": "li", "l": true}, {"t": "7. Nh u cầu lắp đặt điện mặt trời mái nhà và mua bán điện trực tiếp (DPPA)", "s": "h4", "l": false}, {"t": "7.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Được hướng dẫn đúng quy định, đúng phạm vi áp dụng và đúng điều kiện tham gia, để biết mình có thuộc diện được lắp đặt điện mặt trời mái nhà hoặc tham gia DPPA hay không.", "s": "li", "l": true}, {"t": "b) Hiểu rõ trình tự, thủ tục, quyền lợi và nghĩa vụ khi tham gia, bằng cách trình bày dễ hiểu thay vì thuật ngữ phức tạp.", "s": "li", "l": true}, {"t": "c) Biết rõ đầu mối tiếp nhận và được tư vấn nhất quán, để yên tâm trong một lĩnh vực còn mới và nhiều thay đổi về chính sách.", "s": "li", "l": true}, {"t": "7.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Thuật ngữ khó hiểu và thông tin phức tạp: nội dung nặng tính chuyên ngành, chính sách thay đổi, khiến khách hàng khó nắm được mình cần làm gì và được gì.", "s": "li", "l": true}, {"t": "b) Tư vấn không nhất quán hoặc thiếu chính xác: thông tin giữa các kênh, các thời điểm vênh nhau, hoặc hướng dẫn không đúng quy định, khiến khách hàng hoang mang và dễ làm sai.", "s": "li", "l": true}, {"t": "c) Không rõ phạm vi áp dụng và đầu mối: khách hàng không biết mình có đủ điều kiện không, liên hệ với ai, bị đẩy qua lại và cảm thấy không được hỗ trợ trong việc phức tạp.", "s": "li", "l": true}, {"t": "7.3. Định hư ớng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Tư vấn đúng quy định, đúng phạm vi áp dụng và đúng điều kiện hiện hành; cập nhật kịp thời khi chính sách thay đổi.", "s": "li", "l": true}, {"t": "b) Giải thích trình tự, thủ tục, quyền lợi và nghĩa vụ bằng ngôn ngữ dễ hiểu, tránh thuật ngữ gây rối cho khách hàng.", "s": "li", "l": true}, {"t": "c) Bảo đảm thông tin nhất quán trên mọi kênh và mọi thời điểm; chỉ rõ một đầu mối tiếp nhận và đồng hành hướng dẫn.", "s": "li", "l": true}, {"t": "d) Chủ động làm rõ khách hàng có thuộc diện áp dụng hay không, không để khách hàng tự phán đoán hay tự xoay xở trong một lĩnh vực mới.", "s": "li", "l": true}, {"t": "8. Nhu cầu tư vấn sử dụng điện tiết kiệm, hiệu quả", "s": "h4", "l": false}, {"t": "8.1. Điều khách hàng mong đợi", "s": "p", "l": false}, {"t": "a) Nhận được gợi ý thiết thực, cụ thể, dễ áp dụng vào chính cách sử dụng điện và hoàn cảnh thực tế của mình.", "s": "li", "l": true}, {"t": "b) Hiểu được lợi ích rõ ràng của việc tiết kiệm điện, như giảm chi phí hằng tháng, để có động lực thực hiện.", "s": "li", "l": true}, {"t": "c) Cảm nhận EVN tư vấn vì lợi ích của khách hàng, đồng hành giúp dùng điện hiệu quả, chứ không chỉ để hoàn thành nghĩa vụ tuyên truyền.", "s": "li", "l": true}, {"t": "8.2. Điều gì dễ làm hỏng kỳ vọng của khách hàng", "s": "p", "l": false}, {"t": "a) Tuyên truyền chung chung, hình thức: thông điệp khẩu hiệu, không gắn với thực tế sử dụng của khách hàng, nên không biết áp dụng thế nào.", "s": "li", "l": true}, {"t": "b) Gợi ý khó áp dụng hoặc không phù hợp: lời khuyên xa rời hoàn cảnh, nhu cầu và điều kiện cụ thể, khiến khách hàng thấy không liên quan đến mình.", "s": "li", "l": true}, {"t": "c) Thiếu sự cá nhân hóa và đồng hành: tư vấn đại trà, không dựa trên đặc điểm tiêu thụ thực tế, khiến khách hàng cảm thấy chỉ là đối tượng tuyên truyền, không phải người được hỗ trợ.", "s": "li", "l": true}, {"t": "8.3. Định hư ớng ứng xử văn hóa cần có", "s": "p", "l": false}, {"t": "a) Đưa ra gợi ý cụ thể, thiết thực, dựa trên đặc điểm tiêu thụ và hoàn cảnh thực tế của khách hàng để dễ áp dụng.", "s": "li", "l": true}, {"t": "b) Giải thích rõ lợi ích, nhất là khoản chi phí có thể tiết kiệm, bằng cách trình bày dễ hiểu, gần gũi.", "s": "li", "l": true}, {"t": "c) Cá nhân hóa tư vấn theo nhóm khách hàng và nhu cầu sử dụng, thay vì truyền thông đại trà một chiều.", "s": "li", "l": true}, {"t": "d) Thể hiện tinh thần đồng hành vì lợi ích khách hàng, sẵn sàng hỗ trợ giải đáp và hướng dẫn thêm khi khách hàng cần.", "s": "li", "l": true}]}, {"num": "45", "title": "Bản đồ Hành trình và định hướng hành vi theo từng điểm chạm", "blocks": [{"t": "CÁCH SOI CHIẾU HÀNH VI TRÊN BẢN ĐỒ HÀNH TRÌNH Mỗi hành vi được nhìn đồng thời:", "s": "p", "l": false}, {"t": "Hành trình nào · Điểm chạm nào · Giai đoạn nào · Làn phục vụ nào · Đáp ứng cảm nhận & yêu cầu nào CHUẨN TỐT TỎA SÁNG Mức tối thiểu bắt buộc Mức nên đạt Mức vượt mong đợi Sàn chất lượng, Thể hiện sự chủ động Tạo ấn tượng sâu trong không được thấp hơn vượt trên cơ bản lòng khách hàng Bao quát toàn bộ 15 hành trình khách hàng đã nêu tại Chương III", "s": "p", "l": false}, {"t": "1. Mục đích và cách sử dụng", "s": "h4", "l": false}, {"t": "Bản đồ Hành trình Khách hàng và bảng định hướng hành vi là công cụ tổng hợp, giúp người EVN nhìn nhanh toàn cảnh các hành trình khách hàng: mỗi hành trình đi qua những điểm chạm nào, điểm nào dễ làm tổn thương trải nghiệm, và cần ứng xử ra sao để mang lại cảm nhận tích cực. Công cụ này không thay thế các quy tắc đã nêu tại Chương I, II và III, mà hệ thống hóa và cụ thể hóa các quy tắc đó thành một bảng tra cứu trực quan, giúp mỗi đơn vị, bộ phận và CBCNV dễ vận dụng trong công việc hằng ngày.", "s": "p", "l": false}, {"t": "2. Cách soi chiếu hành vi", "s": "h4", "l": false}, {"t": "Mỗi hành vi ứng xử được nhìn đồng thời trên nhiều phương diện, để trả lời rõ: hành vi diễn ra ở hành trình nào, tại điểm chạm nào, do ai thực hiện và hướng tới cảm nhận gì của khách hàng. Cụ thể gồm bốn phương diện: hành trình (khách hàng đang ở chặng nào của quan hệ với EVN), điểm tiếp xúc (tổng đài, hiện trường, điểm giao dịch hay kênh số), người phục vụ (vai trò trực tiếp tiếp xúc với khách hàng) và trải nghiệm (cảm nhận đích cần đạt).", "s": "p", "l": false}, {"t": "3. Ba mức định hướng hành vi", "s": "h4", "l": false}, {"t": "Tại mỗi hành vi cụ thể, định hướng được chia thành ba mức tăng dần, vừa giữ sàn chất lượng vừa mở không gian phấn đấu:", "s": "p", "l": false}, {"t": "a) Chuẩn: mức tối thiểu bắt buộc, là sàn chất lượng không được thấp hơn.", "s": "li", "l": true}, {"t": "b) Tốt: mức nên đạt, thể hiện sự chủ động vượt trên cơ bản.", "s": "li", "l": true}, {"t": "c) Tỏa sáng: mức vượt mong đợi, tạo ấn tượng sâu trong lòng khách hàng.", "s": "li", "l": true}, {"t": "4. Phạm vi tổng hợp", "s": "h4", "l": false}, {"t": "Công cụ bao quát toàn bộ 15 hành trình khách hàng đã nêu tại Chương III, trải trên cả hai làn phục vụ: làn trực tiếp do CBCNV phục vụ và làn khách hàng tự thực hiện trên kênh số. Với mỗi hành trình, công cụ chỉ rõ điểm dễ gãy chủ đạo cần phòng tránh, định hướng hành vi tại từng điểm chạm theo ba mức nêu trên, tình huống tiêu biểu minh họa và ba điều then chốt cần ghi nhớ.", "s": "p", "l": false}, {"t": "5. Dẫn chiếu", "s": "h4", "l": false}, {"t": "Toàn bộ bản đồ tổng quan, bảng định hướng hành vi chi tiết theo từng hành trình, bảng tóm tắt và phần tra cứu theo nhóm CBCNV được trình bày đầy đủ tại Phụ lục 2 kèm theo Bộ Quy tắc này. Khi vận dụng, đơn vị và CBCNV sử dụng Phụ lục 2 như tài liệu tra cứu đi kèm.", "s": "p", "l": false}, {"t": "IV C H Ư Ơ N G I V TỔ CHỨC THỰC HIỆN Tổ chức thực hiện Bộ Quy tắc trong toàn hệ thống EVN “Quy tắc chỉ sống khi mỗi người EVN biến nó thành thói quen phục vụ hằng ngày.”", "s": "p", "l": false}, {"t": "TỔ CHỨC THỰC HIỆN IV TỔ CHỨC THỰC HIỆN CHUỖI TRÁCH NHIỆM TỔ CHỨC THỰC HIỆN Tập đoàn EVN Tổng công ty Công ty Điện lực Người quản lý CBCNV Ban hành Phổ biến, cụ thể hóa Triển khai đến Nêu gương, Thực hiện trong & định hướng & giám sát từng vị trí chịu trách nhiệm công việc hằng ngày Từ định hướng của Tập đoàn đến hành vi phục vụ hằng ngày của mỗi CBCNV Năm cấp trách nhiệm bảo đảm Bộ Quy tắc đi vào thực tiễn phục vụ Điều [__] Phạm vi và đối tượng áp dụng", "s": "p", "l": false}, {"t": "1. Bộ Quy tắc này áp dụng đối với toàn thể CBCNV trong toàn hệ thống EVN khi thực hiện hoặc tham", "s": "p", "l": false}, {"t": "gia các hoạt động có ảnh hưởng đến trải nghiệm khách hàng, bao gồm Cơ quan Tập đoàn Điện lực Việt Nam, các Tổng công ty Điện lực, Công ty Điện lực, đơn vị điện lực và các đơn vị trực thuộc.", "s": "p", "l": false}, {"t": "2. Mức độ áp dụng phù hợp với tính chất công việc của từng vị trí: tại vị trí trực tiếp giao tiếp với khách", "s": "p", "l": false}, {"t": "hàng, Bộ Quy tắc áp dụng đầy đủ cho từng hành vi, lời nói và thao tác ở điểm chạm; tại vị trí xây dựng chính sách, quy trình, thiết kế dịch vụ, vận hành kênh số hoặc xử lý phản ánh, kiến nghị, khiếu nại, Bộ Quy tắc áp dụng thông qua chất lượng, sự minh bạch và trách nhiệm của các quyết định, sản phẩm và hoạt động có ảnh hưởng đến khách hàng.", "s": "p", "l": false}, {"t": "3. Đối tác, nhà thầu và đơn vị cung cấp dịch vụ khi thay mặt hoặc phối hợp với đơn vị trong hệ thống", "s": "p", "l": false}, {"t": "EVN để phục vụ khách hàng có trách nhiệm tuân thủ các chuẩn mực ứng xử phù hợp tại Bộ Quy tắc này, theo yêu cầu của đơn vị quản lý.", "s": "p", "l": false}, {"t": "4. Bộ Quy tắc được thực hiện đồng thời với pháp luật hiện hành, quy trình kinh doanh điện năng, quy định về", "s": "p", "l": false}, {"t": "chăm sóc khách hàng và các quy định nội bộ có liên quan. Trường hợp có nội dung chưa được quy định cụ thể, việc ứng xử thực hiện theo các nguyên tắc phục vụ và kiến tạo trải nghiệm khách hàng nêu tại Chương I.", "s": "p", "l": false}, {"t": "Điều [__] Trách nhiệm của các Tổng công ty Điện lực", "s": "p", "l": false}, {"t": "1. Tổ chức phổ biến, quán triệt Bộ Quy tắc đến toàn thể CBCNV thuộc phạm vi quản lý; đưa nội dung Bộ", "s": "p", "l": false}, {"t": "Quy tắc vào chương trình đào tạo, bồi dưỡng, tập huấn và sinh hoạt chuyên môn định kỳ.", "s": "p", "l": false}, {"t": "2. Cụ thể hóa Bộ Quy tắc vào đặc thù địa bàn và mô hình tổ chức của đơn vị; chỉ đạo các công ty Điện", "s": "p", "l": false}, {"t": "lực, đơn vị trực thuộc triển khai thống nhất, gắn với Phụ lục Bản đồ Hành trình và Sổ tình huống ứng xử kèm theo.", "s": "p", "l": false}, {"t": "3. Tổ chức kiểm tra, giám sát việc thực hiện trong phạm vi quản lý; tổng hợp khó khăn, vướng mắc và", "s": "p", "l": false}, {"t": "đề xuất điều chỉnh về đầu mối do Tập đoàn giao.", "s": "p", "l": false}, {"t": "4. Bố trí nguồn lực, điều kiện làm việc và công cụ hỗ trợ để cán bộ, công nhân viên thực hiện được các", "s": "p", "l": false}, {"t": "chuẩn mực phục vụ khách hàng.", "s": "p", "l": false}, {"t": "Điều [__] Trách nhiệm của Công ty Điện lực và đơn vị trực tiếp phục vụ khách hàng", "s": "p", "l": false}, {"t": "1. Triển khai Bộ Quy tắc đến từng bộ phận, từng vị trí công việc có ảnh hưởng đến trải nghiệm khách", "s": "p", "l": false}, {"t": "hàng; bảo đảm mỗi CBCNV hiểu đúng và thực hiện thống nhất.", "s": "p", "l": false}, {"t": "2. Theo dõi, nhắc nhở và hỗ trợ cán bộ, công nhân viên trong quá trình thực hiện; kịp thời chấn chỉnh", "s": "p", "l": false}, {"t": "các biểu hiện chưa phù hợp với chuẩn mực.", "s": "p", "l": false}, {"t": "3. Ghi nhận, biểu dương và lan tỏa các cá nhân, tập thể có cách phục vụ tốt, tạo trải nghiệm tích cực", "s": "p", "l": false}, {"t": "cho khách hàng, để khuyến khích và nhân rộng.", "s": "p", "l": false}, {"t": "4.", "s": "p", "l": false}, {"t": "Tiếp nhận, xử lý và rút kinh nghiệm từ các phản ánh của khách hàng liên quan đến thái độ, hành vi phục vụ trong phạm vi quản lý.", "s": "p", "l": false}, {"t": "Điều [__] Trách nhiệm của người quản lý các cấp", "s": "p", "l": false}, {"t": "1. Nêu gương trong ứng xử văn hóa và phục vụ khách hàng; trực tiếp quan tâm, chỉ đạo xử lý các", "s": "p", "l": false}, {"t": "trường hợp phản ánh, kiến nghị, khiếu nại phức tạp hoặc kéo dài, không trả lời chung chung, đối phó.", "s": "p", "l": false}, {"t": "2. Chịu trách nhiệm về chất lượng dịch vụ và văn hóa phục vụ khách hàng của đơn vị, bộ phận mình", "s": "p", "l": false}, {"t": "phụ trách.", "s": "p", "l": false}, {"t": "3. Bảo vệ cán bộ, công nhân viên trước các tình huống khách hàng ứng xử quá mức, đồng thời xử lý", "s": "p", "l": false}, {"t": "nghiêm các biểu hiện vi phạm chuẩn mực phục vụ thuộc phạm vi quản lý.", "s": "p", "l": false}, {"t": "Điều [__] Trách nhiệm của CBCNV", "s": "p", "l": false}, {"t": "1. Nghiên cứu, nắm vững và thực hiện đúng Bộ Quy tắc trong công việc hằng ngày.", "s": "h4", "l": false}, {"t": "2. Chủ động phối hợp với đồng nghiệp, bộ phận và đơn vị liên quan để khách hàng được phục vụ liền", "s": "p", "l": false}, {"t": "mạch, đúng trách nhiệm.", "s": "p", "l": false}, {"t": "3. Chủ động phản ánh, đề xuất cải tiến khi phát hiện điểm đau lặp lại của khách hàng, bất cập trong phục", "s": "p", "l": false}, {"t": "vụ hoặc nguy cơ mất an toàn, vi phạm bảo mật.", "s": "p", "l": false}, {"t": "Điều [__] Kiểm tra, giám sát và xử lý vi phạm", "s": "p", "l": false}, {"t": "1. Việc thực hiện Bộ Quy tắc được kiểm tra, giám sát thường xuyên thông qua công tác quản lý của đơn", "s": "p", "l": false}, {"t": "vị, kết quả phục vụ khách hàng và phản ánh, đánh giá của khách hàng.", "s": "p", "l": false}, {"t": "2. CBCNV thực hiện tốt, có đóng góp tích cực vào trải nghiệm khách hàng được xem xét ghi nhận, biểu", "s": "p", "l": false}, {"t": "dương, khen thưởng theo quy định.", "s": "p", "l": false}, {"t": "3. Hành vi vi phạm các chuẩn mực và quy định tại Bộ Quy tắc, tùy theo tính chất và mức độ, được xem", "s": "p", "l": false}, {"t": "xét, xử lý theo nội quy lao động, quy chế của đơn vị và các quy định hiện hành của EVN; trường hợp vi phạm pháp luật thì xử lý theo quy định của pháp luật.", "s": "p", "l": false}, {"t": "Điều [__] Sửa đổi, bổ sung và hiệu lực thi hành", "s": "p", "l": false}, {"t": "1. Bộ Quy tắc được rà soát, cập nhật định kỳ hoặc khi có thay đổi về pháp luật, quy trình nghiệp vụ, mô", "s": "p", "l": false}, {"t": "hình phục vụ hoặc nhu cầu thực tế của khách hàng.", "s": "p", "l": false}, {"t": "2. Các Phụ lục, Sổ tình huống ứng xử và tài liệu hướng dẫn kèm theo có thể được cập nhật linh hoạt trên", "s": "p", "l": false}, {"t": "cơ sở phản hồi từ thực tiễn, mà không làm thay đổi các chuẩn mực, nguyên tắc cốt lõi của Bộ Quy tắc.", "s": "p", "l": false}, {"t": "3. Bộ Quy tắc này có hiệu lực thi hành kể từ ngày ký ban hành. Trong quá trình thực hiện, nếu có khó", "s": "p", "l": false}, {"t": "khăn, vướng mắc, các đơn vị phản ánh về đầu mối được giao để tổng hợp, báo cáo cấp có thẩm quyền xem xét, điều chỉnh.", "s": "p", "l": false}, {"t": "Điều [__] Trách nhiệm tổ chức thực hiện", "s": "p", "l": false}, {"t": "1. Các đơn vị trong hệ thống có trách nhiệm phổ biến, quán triệt Bộ Quy tắc đến toàn thể cán bộ, công", "s": "p", "l": false}, {"t": "nhân viên thuộc phạm vi quản lý; đưa nội dung Bộ Quy tắc vào công tác đào tạo, bồi dưỡng và sinh hoạt chuyên môn để mỗi người hiểu đúng và thực hiện thống nhất.", "s": "p", "l": false}, {"t": "2. Người đứng đầu các đơn vị, bộ phận chịu trách nhiệm nêu gương trong ứng xử văn hóa, bố trí nguồn", "s": "p", "l": false}, {"t": "lực và tạo điều kiện để cán bộ, công nhân viên thực hiện Bộ Quy tắc; trực tiếp quan tâm các trường hợp phản ánh, khiếu nại phức tạp, kéo dài và bảo vệ cán bộ, công nhân viên trước những tình huống khách hàng ứng xử quá mức.", "s": "p", "l": false}, {"t": "3. Các đơn vị, bộ phận chủ động vận dụng Bộ Quy tắc cùng với Phụ lục Bản đồ Hành trình và định hướng", "s": "p", "l": false}, {"t": "hành vi, Sổ tình huống ứng xử và các tài liệu hướng dẫn kèm theo để cụ thể hóa vào từng vị trí công việc và từng hành trình khách hàng.", "s": "p", "l": false}, {"t": "4. CBCNV có trách nhiệm nghiên cứu, thực hiện đúng Bộ Quy tắc trong công việc hằng ngày và chủ động", "s": "p", "l": false}, {"t": "phản ánh, đề xuất cải tiến khi phát hiện điểm đau lặp lại của khách hàng hoặc bất cập trong phục vụ.", "s": "p", "l": false}, {"t": "“Văn hóa dẫn dắt hành vi.", "s": "quote", "l": true}, {"t": "Hành vi tạo trải nghiệm.", "s": "p", "l": false}, {"t": "Trải nghiệm làm nên thương hiệu.”", "s": "p", "l": false}, {"t": "T Ậ P Đ O À N Đ I Ệ N L Ự C V I Ệ T N A M", "s": "p", "l": false}]}]}], "intro": "Chương III là lớp chuyển hóa trực tiếp các nền tảng của Chương I và Chương II vào thực tế tiếp xúc với khách hàng, làm rõ cách những nền tảng đó được thể hiện tại từng điểm tiếp xúc và trong các hành trình trải nghiệm khách hàng."}, {"num": "IV", "title": "TỔ CHỨC THỰC HIỆN", "sections": [{"num": "", "title": "", "articles": [{"num": "46", "title": "Phạm vi và đối tượng áp dụng", "blocks": [{"t": "1. Bộ Quy tắc này áp dụng đối với toàn thể CBCNV trong toàn hệ thống EVN khi thực hiện hoặc tham gia các hoạt động có ảnh hưởng đến trải nghiệm khách hàng, bao gồm Cơ quan Tập đoàn Điện lực Việt Nam, các Tổng công ty Điện lực, Công ty Điện lực, đơn vị điện lực và các đơn vị trực thuộc.", "s": "p", "l": false}, {"t": "2. Mức độ áp dụng phù hợp với tính chất công việc của từng vị trí: tại vị trí trực tiếp giao tiếp với khách hàng, Bộ Quy tắc áp dụng đầy đủ cho từng hành vi, lời nói và thao tác ở điểm chạm; tại vị trí xây dựng chính sách, quy trình, thiết kế dịch vụ, vận hành kênh số hoặc xử lý phản ánh, kiến nghị, khiếu nại, Bộ Quy tắc áp dụng thông qua chất lượng, sự minh bạch và trách nhiệm của các quyết định, sản phẩm và hoạt động có ảnh hưởng đến khách hàng.", "s": "p", "l": false}, {"t": "3. Đối tác, nhà thầu và đơn vị cung cấp dịch vụ khi thay mặt hoặc phối hợp với đơn vị trong hệ thống EVN để phục vụ khách hàng có trách nhiệm tuân thủ các chuẩn mực ứng x
