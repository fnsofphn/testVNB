", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Trấn an ngay rằng trường hợp thanh toán trùng sẽ được kiểm tra và hoàn trả theo quy định.", "Trả lời ngay “không hoàn được” khi chưa kiểm tra."], ["Thu thập đủ thông tin giao dịch (mã khách hàng, thời gian, kênh, số tiền, chứng từ).", "Đổ lỗi cho ngân hàng, ví điện tử hoặc bên thứ ba."], ["Tra cứu trạng thái giao dịch trên hệ thống trước khi trả lời.", "Yêu cầu khách hàng tự liên hệ các bên mà không hướng dẫn cụ thể."], ["Hướng dẫn rõ cách theo dõi tiến độ và cam kết hỗ trợ đến khi hoàn tất.", "Tỏ thái độ thờ ơ, thiếu trách nhiệm với tiền của khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Anh/chị yên tâm, trường hợp thanh toán trùng sẽ được kiểm tra và hoàn trả theo quy định. Em hỗ trợ kiểm tra ngay ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em ghi nhận yêu cầu, hướng dẫn anh/chị cách theo dõi và sẽ đồng hành đến khi hoàn tất ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy số tiền của mình được ngành điện coi trọng và theo dõi cẩn thận, không bị bỏ mặc giữa các bên trung gian. Họ hiểu rõ cơ chế đối soát, hoàn trả và thời gian xử lý, biết chính xác mình cần làm gì và sẽ được cập nhật ra sao, nên hoàn toàn yên tâm rằng khoản tiền thừa nhất định sẽ được trả lại đúng và đủ.", "s": "Normal"}]}, {"code": "I.6", "title": "Khách hàng yêu cầu thay công tơ điện tử sang công tơ cơ vì thấy số “nhảy nhanh”, khó theo dõi", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đang dùng công tơ điện tử nhưng thấy chỉ số thay đổi nhanh, khó đọc, nên nghi ngờ thiết bị không chính xác và đề nghị lắp lại công tơ cơ cho dễ quan sát. Đằng sau đề nghị này là sự thiếu tin tưởng vào thiết bị mới và lo mình bị tính nhiều tiền hơn, nên khách hàng cần được giải thích minh bạch và được hướng dẫn cách tự theo dõi để yên tâm.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe và ghi nhận băn khoăn của khách hàng, không bác bỏ ngay.", "Khẳng định “công tơ đúng rồi” khi chưa giải thích, chưa kiểm tra."], ["Giải thích vì sao ngành điện dùng công tơ điện tử và cơ chế kiểm định, niêm phong đảm bảo chính xác.", "Dùng thuật ngữ kỹ thuật khó hiểu làm khách hàng thêm hoang mang."], ["Hướng dẫn cách đọc chỉ số và dùng ứng dụng CSKH để tự theo dõi điện năng hằng ngày.", "Hứa thay công tơ cơ trái quy định để chiều khách hàng."], ["Nếu khách hàng còn nghi ngờ, hướng dẫn thủ tục kiểm định độc lập để đảm bảo quyền lợi.", "Tỏ thái độ coi nhẹ nghi ngờ của khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hiểu anh/chị thấy khó theo dõi ạ. Em hướng dẫn cách đọc chỉ số và xem điện năng trên ứng dụng để mình nắm rõ hằng ngày nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu anh/chị còn băn khoăn, em hướng dẫn thủ tục kiểm định độc lập công tơ để đảm bảo quyền lợi của mình ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nghi ngờ của mình được tôn trọng và giải đáp thấu đáo, hiểu rằng công tơ điện tử được kiểm định và quản lý chặt chẽ. Quan trọng hơn, họ biết cách tự theo dõi điện năng mỗi ngày và biết mình có quyền yêu cầu kiểm định độc lập, nên chuyển từ lo lắng, ngờ vực sang chủ động và yên tâm với thiết bị đo đếm của gia đình.", "s": "Normal"}]}]}, {"num": "II", "title": "NHÂN VIÊN THI CÔNG HIỆN TRƯỜNG (CÔNG NHÂN ĐIỆN)", "intro": "Nhân viên thi công là gương mặt của ngành điện ngay tại nhà khách hàng. Một thái độ cầu thị, một lời giải thích rõ ranh giới trách nhiệm hay một lần xử lý nhanh gọn đều để lại ấn tượng trực tiếp về sự chuyên nghiệp và tử tế của ngành điện.", "situations": [{"code": "II.1", "title": "Khách hàng bức xúc tại hiện trường vì mất điện kéo dài, không được báo trước, không rõ khi nào có điện lại", "principles": "NT5 Tôn trọng và đồng cảm; NT3 Trách nhiệm chung toàn hệ thống; NT7 Chủ động phục vụ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã chờ lâu trong cảnh mất điện, ảnh hưởng đến sinh hoạt hoặc sản xuất, lại không được thông báo trước và không rõ khi nào có điện lại. Khi gặp nhân viên đến xử lý, họ dồn hết bức xúc tích tụ, có thể lớn tiếng và yêu cầu giải thích ngay. Họ cần được thừa nhận bất tiện, được giải thích trung thực và thấy việc được xử lý khẩn trương thay vì những lời biện minh.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Chủ động tiếp xúc, xin lỗi và thừa nhận bất tiện.", "Né tránh, không tiếp xúc khách hàng tại hiện trường."], ["Giải thích nguyên nhân ngắn gọn, không biện minh.", "Tranh luận, đôi co khi khách hàng bức xúc."], ["Giữ thông tin thống nhất với tổng đài.", "Đổ lỗi cho thời tiết, đơn vị khác hoặc tổng đài."], ["Tập trung xử lý nhanh, khẩn trương.", "Gia hạn thời gian có điện lại nhiều lần, làm việc thiếu khẩn trương."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi rất xin lỗi anh/chị vì mất điện kéo dài đã ảnh hưởng đến sinh hoạt. Tôi đang xử lý và sẽ làm nhanh nhất có thể ạ.”", "s": "Normal"}, {"type": "p", "t": "“Hiện đơn vị đang xử lý, dự kiến khôi phục trong [thời gian có cơ sở]. Tôi sẽ báo lại anh/chị ngay khi xong ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng nguôi đi bức xúc vì cảm thấy được lắng nghe, được tôn trọng và được xin lỗi chân thành thay vì nghe những lời đổ lỗi quanh co. Họ thấy nhân viên thật sự khẩn trương xử lý và thông tin nhất quán với những gì tổng đài đã nói, nên tin rằng ngành điện đang nỗ lực hết sức vì mình, từ đó một sự cố khó chịu lại trở thành dịp củng cố niềm tin vào sự trung thực và trách nhiệm.", "s": "Normal"}]}, {"code": "II.2", "title": "Đến ngày thi công, khách hàng đề nghị đổi vị trí lắp công tơ so với thiết kế đã thống nhất", "principles": "NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng muốn đổi vị trí công tơ vì lý do thẩm mỹ hoặc tiện theo dõi, nhưng việc này có thể ảnh hưởng đến kỹ thuật, an toàn, chi phí và tiến độ thi công. Đến ngày thi công mới phát sinh đề nghị thay đổi khiến cả hai bên đứng trước bài toán cân đối giữa mong muốn chính đáng và ràng buộc kỹ thuật. Họ mong được tôn trọng nhu cầu nhưng cũng cần hiểu vì sao có những giới hạn.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tôn trọng, lắng nghe lý do của khách hàng.", "Tự ý đổi vị trí không qua khảo sát thiết kế và phê duyệt."], ["Giải thích rủi ro an toàn, kỹ thuật một cách dễ hiểu.", "Gợi ý chi phí ngoài quy định, thông tin mập mờ về chi phí."], ["Lập biên bản và minh bạch chi phí cho mọi thay đổi.", "Gây áp lực, tỏ thái độ khó chịu với khách hàng."], ["Phối hợp bộ phận thiết kế khi cần điều chỉnh.", "Đồng ý phương án không đảm bảo an toàn để làm cho nhanh."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu mong muốn của anh/chị. Để đảm bảo an toàn và đúng kỹ thuật, tôi xin trao đổi phương án phù hợp nhất cho mình nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu thay đổi này cần điều chỉnh thiết kế, tôi sẽ ghi nhận và báo lại thời gian cụ thể, mọi chi phí (nếu có) tôi thông tin rõ trước ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nhu cầu của mình được tôn trọng và được lắng nghe nghiêm túc, đồng thời được tư vấn trung thực về những ràng buộc kỹ thuật và an toàn thay vì bị áp đặt hay gạt đi. Họ hiểu rằng mọi thay đổi đều được lập biên bản và minh bạch chi phí, nên tin rằng ngành điện đặt sự an toàn lâu dài của chính gia đình mình lên trước, và an tâm với phương án cuối cùng được thống nhất.", "s": "Normal"}]}, {"code": "II.3", "title": "Khách hàng báo mất điện, nhưng kiểm tra cho thấy sự cố thuộc đường dây sau công tơ do khách hàng quản lý", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng mong được hỗ trợ trực tiếp và nhanh chóng, nhưng chưa hiểu rõ ranh giới trách nhiệm giữa phần của ngành điện và phần tài sản sau công tơ thuộc về mình. Khi nhân viên đến kiểm tra và phát hiện sự cố nằm ngoài phạm vi quản lý của ngành điện, cách giải thích sẽ quyết định khách hàng cảm thấy được hỗ trợ hay bị từ chối. Một lời từ chối khô khan dễ làm họ thất vọng đúng lúc cần giúp.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tiếp nhận và lắng nghe trước khi giải thích.", "Từ chối ngay, tạo cảm giác bị từ chối."], ["Phân định ranh giới trách nhiệm rõ ràng, dễ hiểu.", "Tự ý sửa chữa khi chưa có yêu cầu chính thức."], ["Minh bạch chi phí nếu khách hàng cần hỗ trợ.", "Gợi ý chi phí ngoài quy định, thu tiền không đúng quy trình."], ["Giữ thái độ hỗ trợ, cảm ơn khi kết thúc.", "Bỏ đi mà không giải thích ranh giới cho khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi kiểm tra thì phần này nằm sau công tơ, thuộc tài sản của gia đình mình. Tôi xin giải thích rõ để anh/chị nắm và hỗ trợ hướng xử lý phù hợp nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu anh/chị cần, tôi thông tin rõ công việc và chi phí theo quy định để mình chủ động ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rõ ranh giới trách nhiệm giữa phần của ngành điện và phần tài sản sau công tơ của gia đình, mà vẫn cảm thấy được hỗ trợ tận tình chứ không bị từ chối lạnh lùng. Họ ghi nhận thái độ niềm nở, sự giải thích minh bạch và thông tin chi phí rõ ràng của nhân viên, nên dù phần việc không thuộc ngành điện, họ vẫn giữ được thiện cảm và tin tưởng vào sự tử tế, chuyên nghiệp của người phục vụ.", "s": "Normal"}]}, {"code": "II.4", "title": "Khách hàng phản ánh thái độ, cách giao tiếp của nhân viên khi thay công tơ định kỳ chưa đúng mực", "principles": "NT5 Tôn trọng và đồng cảm; NT2 Mỗi điểm chạm tạo niềm tin; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng cảm thấy bị thiếu tôn trọng trong một lần tiếp xúc khi nhân viên thay công tơ định kỳ và phản ứng mạnh, kể lại chi tiết trải nghiệm tiêu cực, so sánh với kỳ vọng phục vụ phải tốt hơn. Họ nhấn vào yếu tố thái độ hơn là kỹ thuật, và nếu không được xử lý thỏa đáng, bức xúc dễ lan truyền hoặc phản ánh tiếp trên mạng xã hội. Họ cần được xin lỗi, lắng nghe và thấy sự cải thiện thật.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe trọn vẹn, xin lỗi chân thành.", "Tranh cãi, phủ nhận hoặc đổ lỗi cho khách hàng."], ["Tiếp thu, không né tránh hay đổ lỗi.", "Bao che, xử lý hình thức."], ["Xác minh và xử lý nội bộ nghiêm túc.", "Phản hồi chung chung, không rõ kết quả."], ["Phản hồi kết quả cụ thể, cảm ơn góp ý.", "Để tái diễn hành vi thiếu chuẩn mực."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi rất xin lỗi anh/chị về trải nghiệm chưa tốt vừa rồi. Đơn vị sẽ kiểm tra và xử lý nghiêm túc ạ.”", "s": "Normal"}, {"type": "p", "t": "“Cảm ơn anh/chị đã phản ánh để chúng tôi chấn chỉnh. Tôi sẽ báo lại kết quả xử lý cho anh/chị ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy phản ánh của mình được trân trọng và được xin lỗi một cách chân thành, thay vì bị tranh cãi hay đổ lỗi ngược lại. Họ thấy ngành điện thực sự cầu thị qua việc tiếp thu, xác minh và cam kết chấn chỉnh, nên tin rằng góp ý của mình có giá trị và sẽ tạo ra thay đổi. Nhờ vậy, một trải nghiệm tiêu cực lại trở thành cơ hội để khách hàng lấy lại và củng cố niềm tin.", "s": "Normal"}]}, {"code": "II.5", "title": "Khách hàng đề nghị lắp công tơ, cấp điện sớm hơn thường lệ do nhu cầu cấp bách", "principles": "NT7 Chủ động phục vụ; NT8 Công bằng, nhân văn; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng có nhu cầu cấp bách như khai trương, khánh thành, tổ chức sự kiện hoặc phục vụ sản xuất, kinh doanh, nên mong được lắp công tơ và cấp điện nhanh hơn thời gian thông thường. Họ đang chịu áp lực tiến độ thật sự và dễ thất vọng nếu nhận câu trả lời máy móc, nên cần thấy ngành điện thấu hiểu và hỗ trợ tối đa trong khuôn khổ quy định.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe, thấu hiểu nhu cầu cấp bách và thể hiện thiện chí hỗ trợ tối đa trong phạm vi cho phép.", "Lợi dụng nhu cầu cấp bách để vòi vĩnh, gợi ý chi phí ngoài quy định."], ["Hỗ trợ khách hàng chuẩn bị hồ sơ đầy đủ ngay từ đầu để rút ngắn thời gian xử lý.", "Trả lời máy móc kiểu “chỉ làm theo quy định, không nhanh hơn được”."], ["Thông tin minh bạch thời gian theo quy định và ưu tiên xử lý khi hồ sơ đầy đủ, không vướng mắc.", "Bỏ qua quy trình kỹ thuật, an toàn để làm cho nhanh."], ["Giải thích rõ nguyên nhân khách quan nếu chưa thể rút ngắn và cùng khách hàng tháo gỡ.", "Không giải thích rõ nguyên nhân khi chậm tiến độ."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu việc của anh/chị đang gấp. Tôi hỗ trợ chuẩn bị hồ sơ đầy đủ ngay để xử lý nhanh nhất trong quy định ạ.”", "s": "Normal"}, {"type": "p", "t": "“Trường hợp hồ sơ đầy đủ, không vướng mắc, đơn vị sẽ ưu tiên xử lý sớm nhất có thể ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy sự cấp bách của mình được lắng nghe và ngành điện thật sự đứng về phía mình để hỗ trợ, thay vì viện quy định để từ chối. Họ hiểu rõ thời gian xử lý, biết những gì có thể được ưu tiên và cùng nhân viên tháo gỡ vướng mắc, nên dù tiến độ phụ thuộc quy trình, họ vẫn yên tâm và tin tưởng vào thiện chí phục vụ của ngành điện.", "s": "Normal"}]}, {"code": "II.6", "title": "Khách hàng đề nghị di dời công tơ ngoài giờ, không qua quy trình tiếp nhận chính thức", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT12 An toàn, bảo mật, cải tiến; NT3 Trách nhiệm chung toàn hệ thống", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng muốn nhân viên di dời công tơ ngay, ngoài giờ làm việc và không qua kênh đăng ký chính thức, thường vì muốn nhanh gọn. Tuy nhiên cách làm này tiềm ẩn rủi ro mất an toàn, sai lệch kỹ thuật và tranh chấp chi phí về sau, nên nhân viên cần vừa giữ thiện chí hỗ trợ, vừa kiên định hướng dẫn khách hàng thực hiện đúng quy trình để bảo vệ quyền lợi của chính họ.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tiếp nhận đề nghị lịch sự, cầu thị, giải thích rõ vì sao phải thực hiện qua quy trình chính thức.", "Tự ý di dời ngoài quy trình, ngoài giờ, không có phân công."], ["Hướng dẫn khách hàng đăng ký dịch vụ qua các kênh chính thức của ngành điện.", "Nhận thỏa thuận riêng hoặc thu tiền ngoài hệ thống."], ["Hỗ trợ tại phòng giao dịch nếu khách hàng gặp khó khăn khi đăng ký.", "Gợi ý, vòi vĩnh hoặc giới thiệu bên thứ ba thực hiện."], ["Thông tin minh bạch chi phí và điều kiện thực hiện theo quy định.", "Cung cấp thông tin sai lệch về quy định hoặc chi phí."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi rất muốn hỗ trợ anh/chị, nhưng để đảm bảo an toàn và đúng quy định, mình thực hiện qua kênh đăng ký chính thức nhé.”", "s": "Normal"}, {"type": "p", "t": "“Tôi hướng dẫn anh/chị đăng ký và thông tin rõ chi phí, điều kiện theo quy định để mình chủ động ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rằng việc làm đúng quy trình không phải là sự gây khó, mà là cách bảo vệ an toàn và quyền lợi lâu dài của chính gia đình mình. Họ cảm nhận được thiện chí hỗ trợ chân thành của nhân viên qua việc được hướng dẫn tận tình và thông tin chi phí minh bạch, nên dù không được làm tắt, họ vẫn thấy hài lòng và tin tưởng vào sự chính trực của ngành điện.", "s": "Normal"}]}]}, {"num": "III", "title": "NHÂN VIÊN THU NGÂN, ĐỐC NỢ", "intro": "Nhắc nợ là tình huống nhạy cảm vì liên quan đến danh dự và hoàn cảnh của khách hàng. Ở đây, sự tử tế, minh bạch và đúng quy trình quan trọng hơn bao giờ hết: cách ứng xử khi đòi quyền lợi chính đáng của ngành điện lại chính là lúc dễ làm tổn thương niềm tin nhất.", "situations": [{"code": "III.1", "title": "Khách hàng từ chối đóng tiền vì cho rằng chưa nhận được thông báo, bức xúc khi bị nhắc nợ và dọa cắt điện", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng ngạc nhiên và bức xúc vì nghĩ mình chưa từng được báo mà đã bị nhân viên đến nhắc nợ, thậm chí nhận thông báo ngừng cấp điện sau hai kỳ quá hạn. Họ cảm thấy bị đối xử bất công và dễ phản ứng gay gắt. Điều cần làm là minh bạch lịch sử thông báo bằng dữ liệu mà không tranh cãi đúng sai về cảm nhận, đồng thời giữ thể diện cho khách hàng trong một tình huống vốn rất nhạy cảm.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận cảm xúc, giữ thể diện cho khách hàng.", "Tranh luận đúng sai để chứng minh khách hàng nhầm."], ["Đối chiếu dữ liệu thông báo một cách minh bạch.", "Đe dọa cắt điện để gây áp lực."], ["Hướng dẫn thanh toán qua kênh chính thức.", "Thu tiền mặt trực tiếp trái quy định."], ["Giúp khách hàng đăng ký nhận thông báo về sau.", "Khẳng định khi chưa tra cứu, đối chiếu."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu anh/chị bất ngờ. Tôi cùng anh/chị kiểm tra lại lịch sử thông báo trên hệ thống cho rõ nhé.”", "s": "Normal"}, {"type": "p", "t": "“Để thuận tiện, tôi hướng dẫn anh/chị thanh toán qua kênh chính thức và đăng ký nhận thông báo cho những kỳ sau ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy mình được tôn trọng và được giải thích minh bạch bằng dữ liệu, thay vì bị quy là nói dối hay bị ép buộc bằng lời đe dọa cắt điện. Họ hiểu rõ tình trạng nợ và biết cách chủ động kiểm tra, nhận thông báo cho những kỳ sau, nên dù phải thực hiện nghĩa vụ thanh toán, họ vẫn giữ được thiện cảm và thấy ngành điện ứng xử công bằng, có lý có tình.", "s": "Normal"}]}, {"code": "III.2", "title": "Khách hàng lớn tuổi, sống một mình, không dùng điện thoại thông minh, khó theo dõi và thanh toán tiền điện", "principles": "NT8 Công bằng, nhân văn; NT5 Tôn trọng và đồng cảm; NT7 Chủ động phục vụ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng thuộc nhóm yếu thế: lớn tuổi, sống một mình, không dùng điện thoại thông minh, không đọc được tin nhắn và không biết các cách thanh toán điện tử. Con cái đi làm xa, ít người hỗ trợ, nên họ dễ lo lắng bị gián đoạn điện và bối rối trước các thủ tục. Họ cần được hỗ trợ kiên nhẫn, gần gũi và phù hợp với khả năng của mình, thay vì bị đẩy vào những kênh vượt quá tầm với.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Kiên nhẫn, nói chậm và rõ.", "Ép dùng kênh số khi khách hàng chưa sẵn sàng."], ["Đề xuất cách thanh toán phù hợp khả năng.", "Hướng dẫn nhanh, dùng thuật ngữ khó."], ["Hướng dẫn cách theo dõi hóa đơn dễ nhớ.", "Tỏ thái độ thiếu kiên nhẫn."], ["Trấn an về sự hỗ trợ liên tục.", "Bỏ mặc khách hàng tự xoay xở."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Bác cứ yên tâm, cháu hướng dẫn từng bước thật chậm để bác làm được ạ.”", "s": "Normal"}, {"type": "p", "t": "“Nếu tiện, bác có thể thanh toán ở điểm thu gần nhà, cháu chỉ chỗ cho bác nhé.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được quan tâm, thấu hiểu và đối xử ân cần đúng với hoàn cảnh của mình, không bị bỏ lại phía sau vì tuổi tác hay vì không quen công nghệ. Họ được hướng dẫn cách thanh toán và theo dõi hóa đơn phù hợp với khả năng, nên không còn lo lắng bị gián đoạn điện, và yên tâm rằng mình luôn có ngành điện sẵn sàng hỗ trợ trực tiếp mỗi khi cần, một cách gần gũi và tử tế.", "s": "Normal"}]}, {"code": "III.3", "title": "Khách hàng khó khăn tài chính, chủ động xin khất nợ và cam kết thanh toán khi có điều kiện", "principles": "NT8 Công bằng, nhân văn; NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã nhận thông báo đầy đủ nhưng đang gặp khó khăn kinh tế như mất việc, kinh doanh giảm sút hoặc chi phí đột xuất, nên chủ động liên hệ xin gia hạn và cam kết thanh toán khi có điều kiện. Họ ở thế dễ tổn thương, vừa muốn giữ chữ tín vừa lo bị phán xét. Họ cần được đối xử nhân văn, đúng quy định và được hướng dẫn rõ ràng lối ra thay vì bị từ chối cứng nhắc.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận hoàn cảnh và thiện chí, không phán xét.", "Phán xét, dò xét hoàn cảnh khách hàng."], ["Minh bạch quy định và thẩm quyền xử lý.", "Hứa gia hạn vượt thẩm quyền."], ["Hướng dẫn đúng kênh đề nghị gia hạn.", "Từ chối cứng nhắc, không chỉ lối ra."], ["Thể hiện sự đồng hành, chia sẻ.", "Tỏ thái độ coi thường khách hàng nợ."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi ghi nhận hoàn cảnh và thiện chí của anh/chị. Tôi hướng dẫn anh/chị làm đề nghị gia hạn để bộ phận có thẩm quyền xem xét ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi sẽ chuyển đề nghị và báo lại kết quả cho anh/chị trong thời gian sớm nhất ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được tôn trọng và thấu hiểu trong lúc khó khăn, thấy thiện chí thanh toán của mình được ghi nhận thay vì bị dò xét hay phán xét hoàn cảnh. Họ được hướng dẫn minh bạch về quy định và cách làm đề nghị gia hạn đúng kênh, nên dù chưa biết kết quả, họ vẫn tin rằng ngành điện đối xử nhân văn, công bằng và đang đồng hành để cùng mình tháo gỡ, từ đó giữ trọn sự trân trọng và hợp tác.", "s": "Normal"}]}, {"code": "III.4", "title": "Khách hàng nợ do quên, muốn đưa tiền mặt trực tiếp cho nhân viên cho nhanh", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT12 An toàn, bảo mật, cải tiến; NT9 Trách nhiệm đến cùng, phối hợp liền mạch", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng thừa nhận đã nhận thông báo qua ứng dụng nhưng vì bận nên quên, nay muốn đưa tiền mặt trực tiếp cho nhân viên để xử lý cho nhanh. Đây là tình huống nhạy cảm vì việc nhận tiền mặt trái quy định dễ gây hiểu lầm và rủi ro tiêu cực, nên nhân viên cần từ chối khéo léo mà vẫn giữ được sự thiện chí và giúp khách hàng thanh toán thuận tiện qua kênh chính thống.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lịch sự từ chối nhận tiền mặt và mọi khoản bồi dưỡng, giải thích chủ trương không dùng tiền mặt.", "Nhận tiền mặt trực tiếp khi không có chức năng thu hộ được cấp phép."], ["Hướng dẫn điểm thu hộ gần nhất hoặc các kênh thanh toán điện tử thuận tiện.", "Gợi ý hoặc nhận bất kỳ khoản phí ngoài quy định nào."], ["Giúp khách hàng thấy lợi ích minh bạch của việc thanh toán qua kênh chính thống.", "Tỏ thái độ khó chịu khi từ chối khách hàng."], ["Giữ thái độ thân thiện để khách hàng không cảm thấy bị từ chối lạnh lùng.", "Tạo cảm giác khách hàng bị gây khó dễ."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em xin phép không nhận tiền mặt theo quy định ạ. Để minh bạch cho anh/chị, em hướng dẫn điểm thu gần nhất hoặc cách thanh toán nhanh trên kênh chính thức nhé.”", "s": "Normal"}, {"type": "p", "t": "“Cách này giúp anh/chị có chứng từ rõ ràng và an tâm hơn ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rằng việc nhân viên từ chối nhận tiền mặt là vì sự minh bạch và bảo vệ quyền lợi của chính mình, chứ không phải gây khó. Họ cảm thấy được hướng dẫn tận tình một cách thuận tiện, có chứng từ rõ ràng để yên tâm, nên ủng hộ phương thức thanh toán không dùng tiền mặt và thêm tin tưởng vào sự liêm chính, chuyên nghiệp của đội ngũ ngành điện.", "s": "Normal"}]}, {"code": "III.5", "title": "Khách hàng nóng nảy, xúc phạm nhân viên khi bị nhắc nợ tại nhà, có nguy cơ xung đột", "principles": "NT5 Tôn trọng và đồng cảm; NT12 An toàn, bảo mật, cải tiến; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Trong lúc nhắc nợ tại hiện trường, khách hàng tỏ ra nóng nảy, dùng lời lẽ xúc phạm, cho rằng việc đến tận nhà ảnh hưởng danh dự của họ, dù trước đó đã nhận thông báo. Tình huống có nguy cơ xung đột trực tiếp, ảnh hưởng đến an toàn của nhân viên và hình ảnh ngành điện, nên ưu tiên hàng đầu là giữ bình tĩnh, truyền đạt đúng việc và biết “lùi bước an toàn” khi cần.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Giữ giọng nói bình tĩnh, thái độ tôn trọng, không phản ứng trước lời lẽ xúc phạm.", "Tranh cãi, đôi co hoặc xúc phạm lại khách hàng."], ["Truyền đạt ngắn gọn nội dung nhắc nợ, tránh kéo dài trao đổi, không bị cuốn vào xung đột.", "Có hành vi khiêu khích, đáp trả làm căng thẳng thêm."], ["Thực hiện “lùi bước an toàn”, chủ động kết thúc lịch sự khi tình huống căng thẳng và rời khu vực.", "Tự ý xử lý ngoài quy trình hoặc có hành động trả đũa."], ["Ghi chép trung thực diễn biến và báo cáo lãnh đạo, hướng dẫn khách hàng nhận thông báo qua kênh trực tuyến.", "Tiếp tục trao đổi khi tình huống đã vượt tầm kiểm soát."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi xin phép đã thông tin đến anh/chị. Nếu cần hỗ trợ thêm, đơn vị sẽ tiếp tục phối hợp theo quy định ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi hướng dẫn anh/chị nhận thông báo qua kênh trực tuyến để những lần sau thuận tiện hơn ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Dù trong tình huống căng thẳng, khách hàng vẫn cảm nhận được sự điềm tĩnh, đúng mực và tôn trọng từ nhân viên, không bị đẩy vào thế đối đầu. Khi bình tâm lại, họ thấy cách ứng xử chuyên nghiệp ấy giữ được thể diện cho cả hai bên, và việc được hướng dẫn nhận thông báo qua kênh trực tuyến giúp họ thấy ngành điện thực sự muốn tránh làm phiền mình ở những lần sau.", "s": "Normal"}]}, {"code": "III.6", "title": "Khách hàng thắc mắc tiền điện tăng cao nên cố tình chưa thanh toán, chờ ngành điện giải quyết", "principles": "NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin; NT9 Trách nhiệm đến cùng, phối hợp liền mạch", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng thấy tin nhắn báo tiền điện tăng gấp đôi tháng trước nên bức xúc và quyết định chưa đóng để chờ xem ngành điện giải quyết thế nào. Họ vừa muốn được làm rõ thắc mắc, vừa dùng việc chưa thanh toán như một cách gây sức ép. Nhân viên cần tách bạch khéo léo giữa quyền khiếu nại của khách hàng và nghĩa vụ thanh toán, để vừa giữ được niềm tin vừa duy trì dịch vụ.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe, thấu hiểu và ghi nhận thắc mắc, yêu cầu kiểm tra thiết bị đo đếm của khách hàng.", "Lờ đi thắc mắc của khách hàng, chỉ đòi thanh toán."], ["Hẹn thời gian kiểm tra cụ thể và giải thích quy trình xử lý thắc mắc minh bạch.", "Đưa ra quan điểm cá nhân về hóa đơn khi chưa có kết quả kiểm tra."], ["Nhắc về nghĩa vụ thanh toán đúng hạn để tránh phát sinh lãi chậm trả hoặc tạm ngừng cấp điện.", "Đe dọa cắt điện ngay mà không giải thích quy trình."], ["Làm rõ nếu kiểm tra phát hiện sai sót từ phía ngành điện thì phần chênh lệch sẽ được thoái hoàn.", "Tỏ thái độ thiếu kiên nhẫn với thắc mắc của khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi ghi nhận thắc mắc của anh/chị và sẽ hẹn kiểm tra cụ thể ạ. Nếu có sai sót từ phía ngành điện, phần chênh lệch sẽ được hoàn lại.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị thanh toán đúng hạn để tránh phát sinh lãi chậm trả, còn thắc mắc sẽ được xử lý song song, minh bạch ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy thắc mắc của mình được ghi nhận và sẽ được kiểm tra nghiêm túc, minh bạch, thay vì bị phớt lờ. Họ hiểu rằng quyền khiếu nại và nghĩa vụ thanh toán là hai việc song song, và yên tâm rằng nếu ngành điện có sai sót thì phần chênh lệch sẽ được trả lại. Nhờ đó, họ sẵn sàng thực hiện nghĩa vụ của mình mà vẫn giữ được niềm tin vào sự công bằng, sòng phẳng của ngành điện.", "s": "Normal"}]}]}, {"num": "IV", "title": "NHÂN VIÊN KIỂM TRA SỬ DỤNG ĐIỆN", "intro": "Công tác kiểm tra dễ khiến khách hàng cảm thấy bị nghi ngờ hoặc bị làm phiền. Vì vậy sự minh bạch, công khai và tôn trọng trong từng thao tác là cách để biến một lần kiểm tra thành dịp củng cố niềm tin, thay vì gây căng thẳng.", "situations": [{"code": "IV.1", "title": "Trong lúc kiểm tra công tơ, nhân viên vô tình làm mất điện cả nhà khiến khách hàng lo hư hỏng thiết bị", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT12 An toàn, bảo mật, cải tiến; NT5 Tôn trọng và đồng cảm", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đang sử dụng nhiều thiết bị thì bị mất điện đột ngột do thao tác kiểm tra công tơ của nhân viên, lập tức bức xúc và lo các thiết bị như tivi, máy tính, nồi cơm điện bị hư hỏng vì mất điện bất ngờ. Trong khoảnh khắc đó, điều khách hàng cần là thấy nhân viên nhận lỗi ngay, khắc phục nhanh và thật sự quan tâm đến thiệt hại có thể xảy ra với mình, thay vì né tránh hay biện minh.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Nhận trách nhiệm và xin lỗi ngay.", "Né tránh, đổ lỗi cho khách hàng hoặc hoàn cảnh."], ["Ưu tiên khôi phục điện an toàn, nhanh chóng.", "Tranh cãi, to tiếng."], ["Hỏi thăm, xác nhận khách hàng dùng điện bình thường.", "Bỏ đi khi chưa khắc phục xong."], ["Giữ bình tĩnh dù khách hàng bức xúc.", "Thao tác tiếp khi chưa đảm bảo an toàn."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi xin lỗi anh/chị, thao tác vừa rồi làm mất điện. Tôi kiểm tra và khôi phục ngay, đảm bảo an toàn rồi mới đóng điện lại ạ.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị kiểm tra giúp tôi xem thiết bị đã hoạt động bình thường chưa ạ?”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nhân viên thật sự trung thực và có trách nhiệm khi nhận lỗi ngay, khẩn trương khắc phục và quan tâm hỏi han đến thiết bị của mình. Họ thấy sự cố ngoài ý muốn được xử lý an toàn, đúng mực và chu đáo, nên cơn bức xúc ban đầu được xoa dịu. Nhờ cách ứng xử cầu thị đó, niềm tin của khách hàng không những không bị xói mòn mà còn được củng cố qua chính tình huống đáng tiếc này.", "s": "Normal"}]}, {"code": "IV.2", "title": "Khách hàng không hợp tác kiểm tra, nghi ngờ nhân viên chỉnh công tơ chạy nhanh làm tăng tiền điện", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng cho rằng việc kiểm tra công tơ là không cần thiết vì công tơ là tài sản của ngành điện, đồng thời nghi ngờ nhân viên lợi dụng việc kiểm tra để chỉnh công tơ chạy nhanh làm tăng tiền điện. Họ ở thế phòng thủ, mất lòng tin và không hợp tác. Sự công khai, mời khách hàng cùng giám sát và giải thích minh bạch bằng căn cứ chính là chìa khóa để hóa giải nghi ngờ và căng thẳng.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Giới thiệu rõ chức danh, lý do kiểm tra ngay từ đầu.", "Tranh cãi, thách thức, phản ứng gay gắt."], ["Mời khách hàng giám sát toàn bộ quá trình.", "Phát ngôn mỉa mai, tỏ thái độ khó chịu."], ["Giải thích cơ chế kiểm định, niêm phong minh bạch.", "Tự ý kiểm tra khi khách hàng chưa đồng thuận."], ["Hướng dẫn cách tự theo dõi và kiểm định độc lập.", "Giải thích qua loa, đưa thông tin thiếu căn cứ."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Mời an/chị cùng quan sát toàn bộ quá trình kiểm tra ạ, tôi giải thích từng bước để anh/chị yên tâm.”", "s": "Normal"}, {"type": "p", "t": "“Nếu anh/chị còn băn khoăn, tôi hướng dẫn thủ tục kiểm định độc lập công tơ để đảm bảo quyền lợi của mình ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng chuyển từ nghi ngờ, đề phòng sang yên tâm và hợp tác vì thấy mọi thao tác đều được công khai và mình được mời cùng giám sát toàn bộ quá trình. Họ hiểu rằng thiết bị đo đếm được kiểm định, niêm phong chặt chẽ và biết mình có quyền yêu cầu kiểm định độc lập, nên tin rằng quyền lợi của mình được đặt lên trước. Nhờ đó, một tình huống dễ thành xung đột lại trở thành dịp khẳng định tính minh bạch của ngành điện.", "s": "Normal"}]}, {"code": "IV.3", "title": "Khách hàng cảnh giác, yêu cầu xuất trình giấy tờ vì lo gặp người giả danh nhân viên ngành điện", "principles": "NT12 An toàn, bảo mật, cải tiến; NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Trong bối cảnh xuất hiện nhiều vụ giả danh nhân viên ngành điện để lừa đảo, khách hàng cảnh giác là điều hoàn toàn chính đáng. Họ yêu cầu nhân viên xuất trình thẻ ngành, giấy giới thiệu hoặc gọi xác minh trước khi cho làm việc, thậm chí quay video để tự bảo vệ. Đây không phải là sự gây khó, mà là cơ hội để nhân viên thể hiện sự minh bạch, chuyên nghiệp và giúp khách hàng phòng tránh rủi ro lừa đảo thật sự.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Chủ động giới thiệu và xuất trình giấy tờ.", "Tỏ thái độ khó chịu khi bị yêu cầu xác minh."], ["Hoan nghênh sự cảnh giác của khách hàng.", "Thiếu thẻ ngành, giấy tờ hoặc không sẵn sàng xuất trình."], ["Mời khách hàng gọi xác minh với đơn vị.", "Ép vào làm việc khi khách hàng chưa yên tâm."], ["Hướng dẫn cách phòng tránh giả danh.", "Mặc trang phục, tác phong không đúng quy định."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Anh/chị cẩn thận như vậy là rất đúng ạ. Đây là thẻ ngành và giấy giới thiệu của tôi, anh/chị có thể gọi đơn vị xác minh ạ.”", "s": "Normal"}, {"type": "p", "t": "“Khi nào anh/chị yên tâm thì tôi xin phép bắt đầu công việc ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy an tâm và được tôn trọng khi sự cảnh giác chính đáng của mình được nhân viên hoan nghênh thay vì khó chịu. Họ thấy ngành điện minh bạch và đáng tin qua việc chủ động xuất trình giấy tờ và sẵn sàng cho xác minh, đồng thời được trang bị cách nhận biết nhân viên thật để phòng tránh giả danh. Nhờ đó, họ không chỉ yên tâm với lần làm việc này mà còn được bảo vệ tốt hơn trước nguy cơ lừa đảo về sau.", "s": "Normal"}]}, {"code": "IV.4", "title": "Nhân viên làm rơi, hư hỏng thiết bị của khách hàng trong quá trình kiểm tra", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Trong lúc kiểm tra hiện trạng sử dụng điện tại hộ kinh doanh kết hợp nhà ở, nhân viên sơ suất làm rơi và hư hỏng quạt điện của khách hàng. Khách hàng bức xúc, lớn tiếng cho rằng nhân viên thao tác bất cẩn làm hỏng tài sản gia đình và yêu cầu giải thích trách nhiệm, bồi thường, nên điều quan trọng là nhận lỗi ngay, không né tránh và xử lý thấu tình đạt lý để giữ niềm tin.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Thừa nhận ngay sự cố do mình gây ra, không né tránh, không đổ lỗi.", "Né tránh, đổ lỗi cho khách hàng hoặc hoàn cảnh."], ["Xin lỗi kịp thời, đúng mực, lắng nghe ý kiến của khách hàng.", "Tranh cãi, to tiếng đáp lại khách hàng."], ["Ghi nhận đầy đủ sự việc và hướng dẫn giải quyết theo quy định về trách nhiệm, bồi thường.", "Phủ nhận trách nhiệm hoặc hứa hẹn không có cơ sở."], ["Giữ thái độ bình tĩnh, cầu thị dù khách hàng đang lớn tiếng.", "Bỏ qua, không ghi nhận và báo cáo sự việc."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi thành thật xin lỗi anh/chị, sơ suất này là do tôi. Tôi ghi nhận đầy đủ và hướng dẫn anh/chị cách giải quyết theo quy định ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi rất mong anh/chị thông cảm, tôi sẽ báo cáo và phối hợp xử lý thỏa đáng ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy sự cố ngoài ý muốn được nhân viên đối diện một cách trung thực và trách nhiệm, thay vì bị chối quanh. Việc được xin lỗi chân thành ngay từ đầu và được hướng dẫn giải quyết rõ ràng giúp họ nguôi giận, thấy mình được tôn trọng. Nhờ vậy, một sự cố đáng tiếc lại trở thành minh chứng cho sự tử tế và chính trực của người ngành điện.", "s": "Normal"}]}, {"code": "IV.5", "title": "Khách hàng nhờ kiểm tra thêm thiết bị điện trong nhà nằm ngoài phạm vi công việc", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT5 Tôn trọng và đồng cảm; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Sau khi hoàn tất kiểm tra theo kế hoạch, khách hàng tranh thủ nhờ nhân viên kiểm tra thêm ổ cắm, cầu dao, dây điện âm tường hoặc thiết bị chập chờn trong nhà, nghĩ rằng nhân viên “tiện đường” thì giúp luôn cho khỏi thuê thợ. Tuy nhiên các nội dung này thuộc phần sau công tơ do khách hàng tự quản lý, nên nhân viên cần từ chối khéo léo mà vẫn giữ thiện cảm, tránh để khách hàng cảm thấy ngành điện “không giúp dân”.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận thiện chí nhờ vả của khách hàng với thái độ niềm nở.", "Từ chối cộc lốc tạo cảm giác ngành điện thờ ơ."], ["Giải thích rõ phần điện sau công tơ thuộc tài sản và trách nhiệm của khách hàng.", "Tự ý kiểm tra, sửa chữa phần sau công tơ ngoài phạm vi."], ["Hướng dẫn khách hàng cách xử lý phù hợp hoặc tìm thợ điện có chuyên môn.", "Gợi ý chi phí hoặc nhận làm thêm ngoài quy định."], ["Lưu ý khách hàng các điểm an toàn điện cơ bản nếu quan sát thấy.", "Tỏ thái độ khó chịu khi khách hàng nhờ thêm."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Phần này thuộc sau công tơ, là tài sản của gia đình mình nên tôi không thực hiện được ạ. Tôi xin chỉ anh/chị hướng xử lý phù hợp nhé.”", "s": "Normal"}, {"type": "p", "t": "“Tôi lưu ý anh/chị vài điểm an toàn để mình yên tâm sử dụng ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rõ vì sao có những phần việc nhân viên không thể thực hiện, mà không cảm thấy bị từ chối một cách lạnh lùng hay vô trách nhiệm. Việc được giải thích nhẹ nhàng về ranh giới tài sản và được hướng dẫn cách xử lý, kèm vài lưu ý an toàn, khiến họ thấy nhân viên vẫn quan tâm và tận tâm với mình, nên giữ được thiện cảm và sự trân trọng dành cho ngành điện.", "s": "Normal"}]}, {"code": "IV.6", "title": "Khách hàng nghi ngờ tiền điện tăng do công tơ chạy nhanh trong mùa nắng nóng, đề nghị kiểm tra", "principles": "NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Vào mùa nắng nóng, nhu cầu dùng máy lạnh, quạt, tủ lạnh tăng cao khiến tiền điện tăng đáng kể, nhưng khách hàng cho rằng mức tăng là bất thường và nghi ngờ công tơ chạy nhanh. Khi nhân viên đến hiện trường, khách hàng thường so sánh với hóa đơn các tháng trước và yêu cầu giải thích, thậm chí đề nghị thay hoặc tháo công tơ đi kiểm định, nên cần được giải thích bằng số liệu và thái độ đồng cảm.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe và đồng cảm với băn khoăn của khách hàng, không bác bỏ ngay.", "Khẳng định “công tơ đúng rồi” khi chưa giải thích bằng số liệu."], ["Giải thích nguyên nhân tăng bằng số liệu so sánh sản lượng các kỳ và yếu tố thời tiết, thiết bị.", "Tranh luận hoặc đổ lỗi cho khách hàng dùng nhiều điện."], ["Mời khách hàng cùng quan sát hiện trạng công tơ và giải thích cơ chế kiểm định, niêm phong.", "Từ chối đề nghị kiểm định hợp lệ của khách hàng."], ["Hướng dẫn thủ tục kiểm định độc lập và cách dùng ứng dụng CSKH để tự theo dõi điện năng.", "Dùng thuật ngữ kỹ thuật khó hiểu khi giải thích."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu anh/chị thấy mức tăng bất thường ạ. Tôi xin so sánh sản lượng các tháng và giải thích nguyên nhân cụ thể nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu anh/chị vẫn chưa yên tâm, tôi hướng dẫn thủ tục kiểm định độc lập để đảm bảo quyền lợi của mình ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy băn khoăn của mình được đón nhận với sự đồng cảm và được giải đáp bằng số liệu cụ thể, dễ hiểu, thay vì bị bác bỏ. Họ hiểu được vì sao tiền điện tăng trong mùa nắng nóng, biết công tơ được kiểm định chặt chẽ và mình có quyền yêu cầu kiểm định độc lập. Nhờ đó, họ chuyển từ nghi ngờ sang yên tâm, tin rằng cách đo đếm và tính tiền của ngành điện là chính xác, minh bạch.", "s": "Normal"}]}]}, {"num": "V", "title": "NHÂN VIÊN KINH DOANH, CHĂM SÓC KHÁCH HÀNG", "intro": "Nhân viên kinh doanh, chăm sóc khách hàng là người đồng hành cùng khách hàng trong các nhu cầu hằng ngày và cả những thay đổi mới. Sự tận tâm, kiên nhẫn và tôn trọng lựa chọn của khách hàng giúp mỗi lần tiếp xúc trở thành một trải nghiệm tích cực.", "situations": [{"code": "V.1", "title": "Khách hàng đến quầy nhờ hướng dẫn cài đặt và sử dụng ứng dụng CSKH trên điện thoại", "principles": "NT7 Chủ động phục vụ; NT10 Kênh số dễ dùng, dễ đến kết quả; NT5 Tôn trọng và đồng cảm", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng mang điện thoại đến quầy nhưng chưa biết cách cài đặt và sử dụng ứng dụng CSKH. Họ mong được chỉ dẫn tận nơi, dễ hiểu, vì với người chưa quen công nghệ, một giao diện mới có thể là rào cản đáng ngại. Đây là cơ hội để khách hàng thấy kênh số thực sự thuận tiện chứ không phải thứ khiến mình bối rối, nếu được hướng dẫn từng bước với sự kiên nhẫn và gần gũi.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Hướng dẫn từng bước, chờ khách hàng làm theo.", "Hướng dẫn quá nhanh, dùng thuật ngữ khó."], ["Để khách hàng tự thao tác lại để ghi nhớ.", "Làm thay hết, không để khách hàng tự làm."], ["Cảnh báo kênh chính thức, tránh lừa đảo.", "Tỏ thái độ qua loa vì nghĩ việc nhỏ."], ["Trấn an về hỗ trợ trực tiếp khi cần.", "Bỏ qua cảnh báo an toàn khi dùng kênh số."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hướng dẫn anh/chị từng bước nhé, mình làm chậm để lần sau anh/chị tự dùng được ạ.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị thử thao tác lại một lần giúp em, có gì em chỉ thêm ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy ứng dụng CSKH thật sự dễ dùng và tiện lợi sau khi được hướng dẫn từng bước một cách kiên nhẫn, đến mức tự thao tác lại được. Họ tự tin hơn với kênh số mà vẫn yên tâm vì biết luôn có người hỗ trợ trực tiếp khi cần, đồng thời được nhắc về kênh chính thức để tránh lừa đảo. Cảm nhận đọng lại là ngành điện đang giúp cuộc sống của mình thuận tiện hơn chứ không tạo thêm gánh nặng.", "s": "Normal"}]}, {"code": "V.2", "title": "Khách hàng quen thanh toán tiền mặt, lo ngại độ an toàn khi chuyển sang thanh toán qua ứng dụng", "principles": "NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng có thói quen thanh toán tiền mặt lâu năm và e ngại rủi ro khi chuyển sang thanh toán qua ứng dụng, lo về độ an toàn và tính chính xác của giao dịch. Sự lo lắng của họ là có thật và chính đáng, nhất là với những người chưa quen giao dịch điện tử. Họ cần được tôn trọng thói quen, được giải thích minh bạch về cơ chế bảo mật và không bị ép buộc thay đổi trước khi sẵn sàng.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Thừa nhận và tôn trọng nỗi lo của khách hàng.", "Ép khách hàng chuyển đổi ngay."], ["Giải thích bảo mật minh bạch, có căn cứ.", "Xem nhẹ nỗi lo về an toàn."], ["Hướng dẫn cách tự kiểm tra giao dịch.", "Giải thích chung chung, thiếu căn cứ."], ["Để khách hàng tự quyết định thời điểm.", "Tạo cảm giác bắt buộc, gây phản ứng ngược."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hiểu anh/chị lo về an toàn ạ. Em giải thích cách giao dịch an toàn và cách tự kiểm tra để anh/chị yên tâm nhé.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị cứ dùng cách quen thuộc, khi nào sẵn sàng thử cách mới em luôn hỗ trợ ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nỗi lo về an toàn của mình được tôn trọng và giải tỏa bằng những giải thích cụ thể, có căn cứ, chứ không bị xem nhẹ hay thúc ép. Họ biết cách tự kiểm tra để xác nhận giao dịch thành công, nên cảm giác kiểm soát được củng cố. Quan trọng hơn, họ thấy mình được quyền tự quyết định thời điểm chuyển đổi, nên giữ được sự thoải mái, tin tưởng và dần cởi mở hơn với phương thức thanh toán mới.", "s": "Normal"}]}, {"code": "V.3", "title": "Khách hàng từ chối dùng ứng dụng CSKH vì ngại công nghệ, muốn giữ thói quen giao dịch trực tiếp", "principles": "NT8 Công bằng, nhân văn; NT5 Tôn trọng và đồng cảm; NT7 Chủ động phục vụ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng nói thẳng là không muốn dùng ứng dụng CSKH vì thấy phiền và ngại công nghệ, muốn giữ thói quen giao dịch trực tiếp tại quầy hoặc qua điện thoại. Họ lo việc từ chối có thể ảnh hưởng đến quyền lợi hoặc làm gián đoạn dịch vụ về sau. Cần để khách hàng yên tâm rằng lựa chọn của họ được tôn trọng và họ vẫn được phục vụ đầy đủ, thay vì bị thuyết phục quá mức gây phản tác dụng.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tôn trọng lựa chọn, đồng cảm với lý do.", "Tỏ thái độ khó chịu khi khách hàng từ chối."], ["Giới thiệu lợi ích ngắn gọn, nhẹ nhàng.", "Ép buộc hoặc thuyết phục quá mức."], ["Khẳng định quyền lợi không thay đổi.", "Tạo cảm giác thiệt thòi nếu không dùng ứng dụng."], ["Tập trung phục vụ nhu cầu chính.", "Giảm chất lượng phục vụ."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Dạ, em hiểu anh/chị chưa quen nên thấy chưa thuận tiện ạ. Anh/chị vẫn dùng tổng đài và quầy giao dịch như bình thường nhé.”", "s": "Normal"}, {"type": "p", "t": "“Quyền lợi của anh/chị vẫn được đảm bảo đầy đủ ạ, khi nào cần em luôn hỗ trợ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy lựa chọn của mình được tôn trọng hoàn toàn, không bị ép buộc hay thuyết phục đến mức khó chịu. Họ yên tâm rằng quyền lợi của mình vẫn được đảm bảo đầy đủ và vẫn được phục vụ tận tình qua các kênh quen thuộc, nên không còn lo bị thiệt thòi vì không dùng ứng dụng. Cảm nhận đọng lại là ngành điện đặt sự thoải mái và nhu cầu thật của khách hàng lên trên, một cách nhân văn và chuyên nghiệp.", "s": "Normal"}]}, {"code": "V.4", "title": "Khách hàng lo lắng vì không còn nhận được tin nhắn SMS thông báo tiền điện như trước", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT7 Chủ động phục vụ; NT10 Kênh số dễ dùng, dễ đến kết quả", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng phản ánh thời gian gần đây không còn nhận tin nhắn SMS báo tiền điện như trước, lo không kịp nắm thông tin để thanh toán đúng hạn và sợ bị tính tiền chậm trả hoặc ngừng cấp điện. Sự thay đổi kênh thông báo khiến khách hàng cảm thấy bất an vì mất đi thói quen quen thuộc, nên cần được giải thích rõ ràng, trấn an và hướng dẫn cách tiếp nhận thông tin mới một cách chủ động.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tiếp nhận thắc mắc nhẹ nhàng, giải thích rõ việc ngành điện đang chuyển sang các kênh chăm sóc điện tử.", "Giải thích qua loa khiến khách hàng thêm lo lắng."], ["Hướng dẫn cài đặt và bật thông báo trên ứng dụng CSKH để không bỏ sót thông tin quan trọng.", "Ép khách hàng dùng kênh mới một cách cứng nhắc."], ["Kiểm tra và hướng dẫn đăng ký bổ sung kênh khác nếu hệ thống hỗ trợ và khách hàng có nhu cầu.", "Bỏ qua nhu cầu nhận thông báo phù hợp của khách hàng."], ["Tạo tâm lý yên tâm, tránh để khách hàng hiểu nhầm hoặc lo lắng không cần thiết.", "Để khách hàng cảm thấy có thể bị bỏ sót thông tin quan trọng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hiểu anh/chị lo không nắm kịp thông tin ạ. Ngành điện đang chuyển sang kênh điện tử, em hướng dẫn anh/chị bật thông báo trên ứng dụng để không bỏ sót nhé.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị yên tâm, em hỗ trợ để mình luôn nhận đủ thông báo tiền điện đúng hạn ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nỗi lo bị bỏ sót thông tin của mình được lắng nghe và giải tỏa, hiểu rõ vì sao kênh thông báo thay đổi thay vì hoang mang. Sau khi được hướng dẫn cài đặt và bật thông báo, họ thấy cách tiếp cận mới thật ra còn chủ động và tiện lợi hơn, nên yên tâm rằng mình sẽ luôn nắm được tiền điện đúng hạn và không bị gián đoạn dịch vụ.", "s": "Normal"}]}, {"code": "V.5", "title": "Khách hàng đến quầy nhờ cấp lại hóa đơn điện tử gấp để kê khai, quyết toán thuế", "principles": "NT7 Chủ động phục vụ; NT6 Rõ ràng, chân thành, đáng tin; NT10 Kênh số dễ dùng, dễ đến kết quả", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đến quầy cần được cấp lại hóa đơn tiền điện gấp để phục vụ kê khai, quyết toán thuế trong thời gian ngắn, nhưng chưa nắm cách tra cứu và tải hóa đơn điện tử qua các kênh trực tuyến của ngành điện. Họ đang chịu áp lực thời hạn và lo không kịp, nên cần được hỗ trợ nhanh, tận tình và đồng thời được hướng dẫn để lần sau có thể tự chủ động lấy hóa đơn.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận nhu cầu gấp, thể hiện sự sẵn sàng hỗ trợ ngay.", "Tỏ thái độ qua loa vì cho là việc nhỏ."], ["Hướng dẫn tra cứu và tải hóa đơn điện tử qua các kênh chính thức của ngành điện.", "Yêu cầu khách hàng tự về làm online khi đang gấp."], ["Hỗ trợ thao tác trực tiếp tại quầy nếu khách hàng chưa quen.", "Dùng thuật ngữ khó hiểu khi hướng dẫn."], ["Hướng dẫn cách tự lấy hóa đơn cho những lần sau để khách hàng chủ động.", "Bỏ mặc khách hàng tự xoay xở với hệ thống."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Anh/chị cần gấp thì em hỗ trợ lấy hóa đơn ngay bây giờ ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em hướng dẫn luôn cách tự tra cứu để lần sau anh/chị chủ động lấy hóa đơn nhanh ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nhẹ nhõm vì nhu cầu gấp được đáp ứng ngay, không phải lo trễ hạn kê khai thuế. Họ trân trọng sự tận tình khi được hỗ trợ tại chỗ, và đặc biệt hài lòng khi được hướng dẫn cách tự lấy hóa đơn cho lần sau, vì điều đó giúp họ chủ động hơn. Cảm nhận đọng lại là ngành điện không chỉ giải quyết việc trước mắt mà còn quan tâm đến sự thuận tiện lâu dài của khách hàng.", "s": "Normal"}]}]}, {"num": "VI", "title": "ĐIỆN MẶT TRỜI MÁI NHÀ VÀ MUA BÁN ĐIỆN TRỰC TIẾP (DPPA)", "intro": "Các nhu cầu năng lượng mới đòi hỏi ngành điện thể hiện vai trò tiên phong, đồng hành và minh bạch. Ứng xử đúng ở nhóm này cho thấy ngành điện không né tránh cái mới mà chủ động hỗ trợ khách hàng trong chuyển dịch năng lượng.", "situations": [{"code": "VI.1", "title": "Khách hàng phản ánh công tơ hai chiều ghi nhận sản lượng phát lên lưới không đúng thực tế", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT11 Dữ liệu đúng, đồng bộ; NT4 Đồng hành nhu cầu năng lượng mới", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng lắp điện mặt trời mái nhà nghi ngờ công tơ hai chiều ghi nhận sản lượng phát lên lưới không đúng thực tế, ảnh hưởng trực tiếp đến quyền lợi tài chính của mình. Với một dịch vụ năng lượng mới còn nhiều mới mẻ, sự thiếu minh bạch về số liệu rất dễ làm khách hàng mất niềm tin. Họ cần được kiểm tra khách quan, được giải thích rõ trên cơ sở số liệu và thấy ngành điện thật sự đồng hành.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận phản ánh với thái độ cầu thị.", "Quy trách nhiệm cho khách hàng khi chưa xác minh."], ["Kiểm tra khách quan, minh bạch theo quy trình.", "Tranh cãi, phủ nhận phản ánh."], ["Giải thích bằng số liệu cụ thể.", "Giải thích thiếu căn cứ về đo đếm."], ["Hẹn rõ thời gian và phản hồi kết quả.", "Xử lý chậm, không hẹn thời gian."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi ghi nhận phản ánh của anh/chị và sẽ kiểm tra số liệu đo đếm một cách khách quan ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi sẽ đối chiếu sản lượng phát và nhận, có kết quả tôi giải thích cụ thể và phản hồi anh/chị trong [thời gian theo quy định] ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng tin rằng quyền lợi của mình được kiểm tra một cách công bằng, khách quan và minh bạch, dựa trên số liệu đo đếm cụ thể chứ không phải lời nói chung chung. Họ thấy ngành điện không né tránh hay quy trách nhiệm vội vàng mà sẵn sàng đối chiếu, giải thích và xử lý nếu có sai lệch, nên yên tâm về tính chính xác của thiết bị. Cảm nhận đọng lại là ngành điện đồng hành thật sự với nhu cầu năng lượng mới của mình.", "s": "Normal"}]}, {"code": "VI.2", "title": "Doanh nghiệp muốn được tư vấn về cơ chế mua bán điện trực tiếp (DPPA)", "principles": "NT4 Đồng hành nhu cầu năng lượng mới; NT6 Rõ ràng, chân thành, đáng tin; NT1 Thành công của khách hàng", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng doanh nghiệp quan tâm đến cơ chế mua bán điện trực tiếp nhưng chưa nắm rõ cơ chế, điều kiện tham gia và vai trò của các bên. Đây là lĩnh vực mới, phức tạp và liên quan đến quyết định đầu tư của doanh nghiệp, nên họ cần được tư vấn chính xác, trung thực và định hướng đúng đầu mối chuyên môn, thay vì nhận những câu trả lời lúng túng, tùy tiện hay những lời hứa vượt thẩm quyền dễ gây kỳ vọng sai.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Nắm kiến thức cơ bản, tư vấn chính xác.", "Trả lời lúng túng hoặc tùy tiện."], ["Giữ vai trò trung lập, đúng thẩm quyền.", "Hứa vượt thẩm quyền về giá, tiến độ."], ["Chuyển đúng đầu mối kèm đủ bối cảnh.", "Tư vấn sai lệch quy định."], ["Hẹn rõ bước tiếp theo và đầu mối.", "Để khách hàng tự đi tìm đúng bộ phận."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Về cơ chế này, tôi thông tin các nội dung cơ bản, còn phần chuyên sâu tôi kết nối đúng đầu mối để tư vấn kỹ cho anh/chị ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi xin phép không cam kết phần ngoài thẩm quyền, nhưng sẽ chuyển thông tin đầy đủ để anh/chị không phải trình bày lại ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng doanh nghiệp cảm thấy ngành điện chuyên nghiệp, hiện đại và đáng tin khi được tư vấn chính xác những nội dung cơ bản và được kết nối đúng đầu mối cho phần chuyên sâu. Họ thấy nhân viên trung thực, giữ vai trò trung lập, không hứa hẹn vượt thẩm quyền, nên không bị dẫn đến kỳ vọng sai lệch. Cảm nhận đọng lại là ngành điện thật sự đồng hành và tiên phong cùng doanh nghiệp trong quá trình chuyển dịch năng lượng.", "s": "Normal"}]}, {"code": "VI.3", "title": "Khách hàng đề nghị làm “linh hoạt” hồ sơ hoặc bỏ qua một số bước trong thủ tục DPPA", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT12 An toàn, bảo mật, cải tiến; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng muốn rút gọn thủ tục tham gia cơ chế mua bán điện trực tiếp bằng cách bỏ qua một số bước, thường do sốt ruột về tiến độ. Cần giữ sự minh bạch và công bằng với mọi khách hàng, vừa không cứng nhắc gây khó vừa không phá vỡ quy định để tạo tiền lệ. Đây là lúc nhân viên thể hiện bản lĩnh chính trực, giải thích vì sao mỗi bước là cần thiết và đồng hành để làm nhanh trong khuôn khổ.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Giải thích sự cần thiết của từng bước.", "Đồng ý bỏ bước, làm tắt trái quy định."], ["Hỗ trợ chuẩn bị hồ sơ đầy đủ từ đầu.", "Từ chối cứng nhắc, không giải thích."], ["Giữ nguyên tắc công bằng, minh bạch.", "Mập mờ lý do, tạo cảm giác tùy tiện."], ["Đồng hành để làm nhanh trong khuôn khổ.", "Gợi ý chi phí hoặc thỏa thuận ngoài quy định."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu anh/chị sốt ruột về tiến độ. Các bước này là để bảo vệ quyền lợi của chính mình, tôi xin giải thích rõ ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi hỗ trợ anh/chị chuẩn bị hồ sơ đầy đủ ngay để xử lý nhanh nhất trong quy định ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu và yên tâm rằng các bước trong thủ tục không phải là sự gây khó mà chính là để bảo vệ quyền lợi của mình, sau khi được giải thích rõ ràng và thuyết phục. Họ cảm nhận được thiện chí đồng hành của nhân viên qua việc được hỗ trợ chuẩn bị hồ sơ đầy đủ để rút ngắn thời gian trong khuôn khổ. Nhờ đó, dù không được làm tắt, họ vẫn tin tưởng vào sự công bằng, minh bạch và chính trực của ngành điện.", "s": "Normal"}]}, {"code": "VI.4", "title": "Khách hàng tự ý lắp đặt hệ thống điện mặt trời mái nhà nhưng chưa đăng ký với ngành điện", "principles": "NT4 Đồng hành nhu cầu năng lượng mới; NT12 An toàn, bảo mật, cải tiến; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã tự lắp đặt hệ thống điện mặt trời mái nhà và đưa vào sử dụng nhưng chưa đăng ký với ngành điện, có thể do chưa nắm quy định hoặc muốn làm nhanh. Việc này tiềm ẩn rủi ro mất an toàn cho lưới điện và cho chính khách hàng, nên nhân viên cần giải thích rõ quy định và đồng hành hướng dẫn khách hàng hoàn thiện thủ tục thay vì chỉ phê phán hay xử lý cứng nhắc.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ghi nhận thực trạng với thái độ cầu thị, không phê phán gay gắt.", "Phê phán, quy chụp khách hàng cố tình vi phạm."], ["Giải thích rõ vì sao hệ thống điện mặt trời cần được đăng ký và kiểm tra an toàn.", "Bỏ qua các rủi ro an toàn khi hệ thống chưa được kiểm tra."], ["Hướng dẫn khách hàng thủ tục đăng ký, đấu nối theo quy định.", "Hướng dẫn chung chung, không cụ thể thủ tục."], ["Lưu ý các yêu cầu về an toàn điện và chất lượng điện khi hòa lưới.", "Tỏ thái độ gây khó dễ với khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi hiểu anh/chị muốn dùng sớm. Để đảm bảo an toàn và đúng quy định, tôi hướng dẫn anh/chị hoàn thiện thủ tục đăng ký, đấu nối nhé.”", "s": "Normal"}, {"type": "p", "t": "“Việc đăng ký cũng là để bảo vệ an toàn cho hệ thống của gia đình mình ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rằng yêu cầu đăng ký và kiểm tra an toàn không phải là rào cản mà là để bảo vệ chính hệ thống và sự an toàn của gia đình mình. Thay vì cảm thấy bị bắt lỗi, họ thấy được nhân viên đồng hành hướng dẫn tận tình để hoàn thiện thủ tục, nên sẵn sàng hợp tác và tin rằng ngành điện thực sự ủng hộ, đồng hành với nhu cầu sử dụng năng lượng mới của mình.", "s": "Normal"}]}, {"code": "VI.5", "title": "Khách hàng thắc mắc về số liệu đo đếm, sản lượng, đối soát giữa các bên tham gia DPPA", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT11 Dữ liệu đúng, đồng bộ; NT4 Đồng hành nhu cầu năng lượng mới", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng tham gia cơ chế mua bán điện trực tiếp thắc mắc hoặc tranh chấp về số liệu đo đếm, sản lượng, kết quả đối soát hoặc việc kết nối dữ liệu giữa các bên. Đây là nội dung phức tạp, liên quan quyền lợi tài chính của doanh nghiệp, nên khách hàng cần sự minh bạch tuyệt đối về số liệu, quy trình đối soát rõ ràng và thái độ trung lập, khách quan từ phía ngành điện.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Lắng nghe đầy đủ, ghi nhận thắc mắc với thái độ khách quan, không quy kết.", "Trả lời thiếu căn cứ hoặc né tránh thắc mắc về số liệu."], ["Tra cứu, đối chiếu số liệu đo đếm và kết quả đối soát một cách minh bạch.", "Nghiêng về một bên, làm mất tính trung lập."], ["Giải thích rõ cơ chế đo đếm, đối soát và vai trò của các bên theo quy định.", "Dùng thuật ngữ phức tạp mà không giải thích."], ["Giữ vai trò trung lập, phối hợp các bên liên quan để làm rõ và xử lý.", "Để thắc mắc kéo dài không có hướng xử lý."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi ghi nhận thắc mắc của anh/chị và sẽ đối chiếu số liệu đo đếm một cách minh bạch ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi giữ vai trò trung lập và phối hợp các bên để làm rõ, có kết quả tôi phản hồi cụ thể ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng doanh nghiệp cảm thấy quyền lợi và thắc mắc về số liệu của mình được xử lý nghiêm túc, minh bạch và công bằng. Việc ngành điện giữ vai trò trung lập, sẵn sàng đối chiếu số liệu và giải thích rõ cơ chế đối soát giúp họ tin tưởng vào tính khách quan của quá trình, yên tâm rằng tranh chấp sẽ được làm rõ dựa trên dữ liệu, chứ không bị xử lý cảm tính hay thiên lệch.", "s": "Normal"}]}, {"code": "VI.6", "title": "Hệ thống điện mặt trời của khách hàng gây tăng điện áp, ảnh hưởng chất lượng điện khu vực", "principles": "NT4 Đồng hành nhu cầu năng lượng mới; NT12 An toàn, bảo mật, cải tiến; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Hệ thống điện mặt trời mái nhà của khách hàng phát công suất lớn vào lưới gây tăng điện áp, ảnh hưởng đến chất lượng điện của khu vực và có thể tác động đến các hộ lân cận. Khách hàng có thể chưa hiểu nguyên nhân kỹ thuật và lo việc điều chỉnh ảnh hưởng đến quyền lợi của mình, nên nhân viên cần giải thích rõ ràng, đồng hành tìm giải pháp thay vì tạo cảm giác đổ lỗi hay gây khó.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Giải thích rõ, dễ hiểu hiện tượng tăng điện áp và ảnh hưởng đến chất lượng điện khu vực.", "Quy lỗi cho khách hàng một cách gay gắt."], ["Trao đổi với khách hàng về phương án kỹ thuật để hài hòa giữa quyền lợi và an toàn lưới điện.", "Yêu cầu điều chỉnh mà không giải thích lý do kỹ thuật."], ["Phối hợp bộ phận chuyên môn kiểm tra, đề xuất giải pháp phù hợp theo quy định.", "Bỏ qua quyền lợi của khách hàng khi đề xuất giải pháp."], ["Giữ thái độ đồng hành, ghi nhận hợp tác của khách hàng trong việc điều chỉnh.", "Dùng thuật ngữ kỹ thuật phức tạp khiến khách hàng khó hiểu."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi xin giải thích hiện tượng tăng điện áp và cùng anh/chị tìm phương án phù hợp để vừa đảm bảo quyền lợi, vừa an toàn cho lưới điện nhé.”", "s": "Normal"}, {"type": "p", "t": "“Tôi phối hợp bộ phận chuyên môn kiểm tra và đề xuất giải pháp theo quy định, sẽ thông tin rõ cho anh/chị ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng hiểu rõ nguyên nhân kỹ thuật của việc tăng điện áp và thấy ngành điện cùng mình tìm giải pháp, thay vì bị quy lỗi hay yêu cầu điều chỉnh một cách áp đặt. Họ cảm nhận được tinh thần đồng hành và sự minh bạch khi quyền lợi của mình vẫn được cân nhắc bên cạnh an toàn chung của lưới điện. Nhờ đó, họ sẵn sàng hợp tác và tin rằng ngành điện thật sự ủng hộ nhu cầu sử dụng năng lượng sạch của mình.", "s": "Normal"}]}]}, {"num": "VII", "title": "GIAO DỊCH VIÊN PHÒNG GIAO DỊCH KHÁCH HÀNG", "intro": "Phòng giao dịch là nơi khách hàng tìm đến khi cần sự hỗ trợ trực tiếp, nhất là khi các kênh khác chưa giải quyết được. Một giao dịch viên tận tâm, kiên nhẫn và biết xoa dịu sẽ biến điểm chạm này thành nơi khách hàng lấy lại niềm tin.", "situations": [{"code": "VII.1", "title": "Khách hàng ở nông thôn mang hồ sơ giấy đến nộp trực tiếp, chưa biết các kênh đăng ký trực tuyến", "principles": "NT8 Công bằng, nhân văn; NT7 Chủ động phục vụ; NT10 Kênh số dễ dùng, dễ đến kết quả", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng ở khu vực nông thôn quen nộp hồ sơ giấy trực tiếp tại quầy và chưa biết đến các kênh đăng ký trực tuyến như Cổng dịch vụ công, website, ứng dụng hay tổng đài. Họ cần được tiếp nhận tử tế và hướng dẫn nhẹ nhàng, vì với người chưa quen kênh số, một thái độ từ chối hay yêu cầu tự về làm online dễ khiến họ thấy bị đẩy đi và mất thiện cảm với ngành điện.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tiếp nhận niềm nở, không từ chối.", "Yêu cầu khách hàng tự về làm online."], ["Hỗ trợ đăng ký, tạo tài khoản ngay tại quầy.", "Tỏ thái độ “không tiếp nhận”."], ["Hướng dẫn từng bước nhẹ nhàng.", "Hướng dẫn vội, bỏ mặc khách hàng."], ["Thông tin rõ thời gian và cách theo dõi.", "Phân biệt khách hàng chưa quen kênh số."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Dạ, em tiếp nhận giúp anh/chị ngay ạ. Em hỗ trợ đăng ký luôn tại quầy cho thuận tiện nhé.”", "s": "Normal"}, {"type": "p", "t": "“Em hướng dẫn anh/chị cách theo dõi tiến độ để mình chủ động ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được đón tiếp tử tế và hỗ trợ tận tình ngay tại quầy, không bị từ chối hay đẩy về tự làm trực tuyến dù chưa quen kênh số. Qua việc được hướng dẫn từng bước và hỗ trợ tạo tài khoản, họ bắt đầu thấy kênh trực tuyến gần gũi, dễ tiếp cận hơn mình tưởng. Cảm nhận đọng lại là ngành điện không bỏ ai lại phía sau và sẵn sàng giúp mọi khách hàng tiếp cận dịch vụ một cách thuận tiện, công bằng.", "s": "Normal"}]}, {"code": "VII.2", "title": "Khách hàng bức xúc đến quầy vì đã liên hệ nhiều kênh, nhiều lần mà chưa được xử lý dứt điểm", "principles": "NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT5 Tôn trọng và đồng cảm; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã liên hệ nhiều kênh và nhiều lần cho cùng một yêu cầu mà vẫn chưa được xử lý dứt điểm, nay đến quầy trong tâm lý mất niềm tin và mệt mỏi. Mỗi lần phải kể lại từ đầu hay bị chuyển sang bộ phận khác là một lần họ cảm thấy công sức của mình vô ích và không ai chịu trách nhiệm. Họ cần một người đứng ra nhận việc và theo đến cùng, thay vì tiếp tục bị đẩy đi.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Tra cứu lịch sử trước khi hỏi khách hàng.", "Bắt khách hàng kể lại từ đầu."], ["Nhận việc và điều phối xử lý đến cùng.", "Đẩy sang bộ phận khác."], ["Cam kết mốc thời gian và đầu mối cụ thể.", "Hứa chung chung, không có mốc thời gian."], ["Chủ động cập nhật tiến độ.", "Để khách hàng phải tự gọi lại theo dõi."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em rất xin lỗi vì anh/chị phải liên hệ nhiều lần. Em đã xem lại lịch sử, anh/chị không cần kể lại, để em nhận và theo đến khi xong ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em cam kết phản hồi anh/chị trước [mốc thời gian] và sẽ chủ động cập nhật cho anh/chị ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nhẹ nhõm vì cuối cùng đã có một người đứng ra nhận việc và cam kết theo đến cùng, thay vì tiếp tục bị chuyền tay giữa các bộ phận. Việc được tra cứu lịch sử trước, không phải kể lại từ đầu và được hẹn mốc thời gian cụ thể giúp họ thấy mình được tôn trọng và việc của mình được coi trọng. Nhờ đó, niềm tin đã hao mòn của khách hàng dần được phục hồi và củng cố trở lại.", "s": "Normal"}]}, {"code": "VII.3", "title": "Khách hàng yêu cầu xử lý gấp dịch vụ điện do nhu cầu cấp bách như xây dựng, kinh doanh, sự kiện", "principles": "NT7 Chủ động phục vụ; NT6 Rõ ràng, chân thành, đáng tin; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng có việc gấp như xây dựng, kinh doanh hay tổ chức sự kiện nên mong dịch vụ điện được giải quyết ngay hoặc rút ngắn thời gian. Họ kỳ vọng cao và dễ thất vọng nếu bị từ chối khô khan hoặc nhận câu trả lời máy móc. Cần hỗ trợ tối đa trong khuôn khổ quy định, đảm bảo công bằng với các khách hàng khác, đồng thời quản lý kỳ vọng minh bạch để khách hàng không hiểu sai về thời gian xử lý.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Thấu hiểu và ghi nhận sự cấp bách.", "Hứa hẹn, cam kết vượt quy định."], ["Kiểm tra hệ thống trước khi trả lời.", "Trả lời máy móc, thiếu hỗ trợ."], ["Minh bạch quy trình, thời gian theo quy định.", "Ưu tiên trái quy định, gây bất công."], ["Hỗ trợ chuẩn bị hồ sơ để rút ngắn thời gian.", "Để khách hàng kỳ vọng sai lệch."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hiểu việc của anh/chị đang gấp. Em hỗ trợ chuẩn bị hồ sơ đầy đủ ngay để xử lý nhanh nhất trong quy định ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em xin thông tin rõ thời gian theo quy định để anh/chị chủ động, và sẽ cùng anh/chị tháo gỡ vướng mắc ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy sự cấp bách của mình được thấu hiểu và ngành điện thật sự hỗ trợ hết mình để xử lý nhanh nhất trong khuôn khổ, thay vì bị từ chối một cách khô khan. Họ nắm rõ quy trình, thời gian theo quy định và được giúp chuẩn bị hồ sơ đầy đủ để rút ngắn thời gian, nên không bị kỳ vọng sai lệch. Cảm nhận đọng lại là ngành điện vừa tận tâm, vừa minh bạch và công bằng với mọi khách hàng.", "s": "Normal"}]}, {"code": "VII.4", "title": "Khách hàng lo ngại lừa đảo, sợ lộ thông tin khi dùng dịch vụ điện trực tuyến, muốn làm hồ sơ giấy", "principles": "NT12 An toàn, bảo mật, cải tiến; NT6 Rõ ràng, chân thành, đáng tin; NT10 Kênh số dễ dùng, dễ đến kết quả", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng e ngại bị lộ thông tin cá nhân, sợ giả mạo điện lực, link giả hay yêu cầu OTP bất thường, nên từ chối kênh trực tuyến và muốn làm hồ sơ giấy. Nỗi lo của họ là chính đáng trong bối cảnh có nhiều hình thức lừa đảo tinh vi. Cần trấn an khách hàng, hướng dẫn cách nhận biết kênh chính thức và dùng dịch vụ an toàn, đồng thời tôn trọng lựa chọn của họ thay vì ép buộc dùng kênh số.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Thừa nhận nỗi lo, đồng cảm với khách hàng.", "Xem nhẹ nỗi lo của khách hàng."], ["Hướng dẫn nhận biết kênh chính thức, cảnh báo lừa đảo.", "Ép dùng kênh trực tuyến."], ["Giải thích cơ chế bảo mật thông tin.", "Bỏ qua hướng dẫn an toàn."], ["Hỗ trợ tại quầy, tôn trọng lựa chọn.", "Tạo cảm giác bắt buộc, thiếu tôn trọng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Anh/chị lo như vậy là rất đúng ạ. Em hướng dẫn cách nhận biết kênh chính thức để mình tránh lừa đảo nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu anh/chị chưa sẵn sàng dùng trực tuyến, em hỗ trợ làm ngay tại quầy ạ, quyền lợi của mình vẫn đảm bảo.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy nỗi lo về an toàn và bảo mật của mình được tôn trọng và xem là chính đáng, thay vì bị xem nhẹ hay ép buộc dùng kênh trực tuyến. Họ được trang bị cách nhận biết kênh chính thức, cảnh báo dấu hiệu lừa đảo và hiểu rõ thông tin của mình được bảo vệ ra sao, nên yên tâm hơn hẳn. Cảm nhận đọng lại là ngành điện thật sự quan tâm đến sự an toàn của khách hàng và luôn để họ tự quyết định một cách thoải mái.", "s": "Normal"}]}, {"code": "VII.5", "title": "Khách hàng đến quầy phản ánh đã thanh toán tiền điện hai lần cho cùng một kỳ, yêu cầu hoàn trả", "principles": "NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT11 Dữ liệu đúng, đồng bộ; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đến phòng giao dịch phản ánh đã thanh toán hai lần cho cùng một kỳ hóa đơn và yêu cầu kiểm tra, hoàn trả. Họ lo lắng về khoản tiền thừa và mong được hỗ trợ trực tiếp thay vì phải tự liên hệ nhiều bên. Đây là dịp để giao dịch viên thể hiện trách nhiệm đồng hành, kiểm tra kỹ trước khi trả lời và giúp khách hàng yên tâm rằng tiền sẽ được hoàn đúng, đủ, kịp thời.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Trấn an khách hàng và khẳng định trường hợp thanh toán trùng sẽ được xử lý hoàn trả theo quy định.", "Trả lời ngay “không hoàn được” khi chưa kiểm tra."], ["Thu thập đủ thông tin giao dịch và tra cứu trạng thái trên hệ thống trước khi trả lời.", "Đổ lỗi cho ngân hàng, ví điện tử hoặc bên thứ ba."], ["Hướng dẫn xử lý theo từng trường hợp tiền đã về hoặc chưa về tài khoản điện lực.", "Yêu cầu khách hàng tự xử lý mà không hướng dẫn cụ thể."], ["Ghi nhận yêu cầu, hướng dẫn theo dõi tiến độ và cam kết hỗ trợ đến khi hoàn tất.", "Tỏ thái độ thờ ơ, thiếu trách nhiệm."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Anh/chị yên tâm, trường hợp thanh toán trùng sẽ được kiểm tra và hoàn trả theo quy định. Em hỗ trợ kiểm tra ngay ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em ghi nhận yêu cầu và sẽ đồng hành cùng anh/chị đến khi nhận lại được khoản tiền thừa ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được đón nhận và hỗ trợ tận nơi, không phải tự loay hoay giữa các bên trung gian để đòi lại tiền của mình. Sự chủ động kiểm tra, giải thích rõ quy trình và cam kết đồng hành đến khi hoàn tất giúp họ tin rằng khoản tiền thừa chắc chắn được trả lại đúng và đủ, đồng thời cảm nhận được tinh thần trách nhiệm và sự tử tế của ngành điện.", "s": "Normal"}]}, {"code": "VII.6", "title": "Khách hàng lớn tuổi, ít tiếp cận công nghệ, không tự thực hiện được dịch vụ điện trực tuyến", "principles": "NT8 Công bằng, nhân văn; NT5 Tôn trọng và đồng cảm; NT10 Kênh số dễ dùng, dễ đến kết quả", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng lớn tuổi hoặc ở khu vực ít tiếp cận công nghệ đến phòng giao dịch để làm dịch vụ như cấp điện mới, thay đổi thông tin, di dời công tơ, nhưng không có điện thoại thông minh hoặc không thao tác được các bước xác thực như OTP, nên không thể tự thực hiện trực tuyến. Họ dễ cảm thấy lúng túng, ngại ngần, nên cần được đón tiếp kiên nhẫn, hỗ trợ tận nơi và không bị tạo cảm giác mình là gánh nặng.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Đón tiếp ân cần, kiên nhẫn, giao tiếp chậm rãi và dễ hiểu.", "Yêu cầu khách hàng tự về làm trực tuyến."], ["Hỗ trợ khách hàng thực hiện dịch vụ ngay tại quầy, không bắt tự làm trực tuyến.", "Tỏ thái độ thiếu kiên nhẫn hoặc thúc giục."], ["Hướng dẫn từng bước nếu khách hàng muốn thử, hoặc gợi ý nhờ người thân hỗ trợ.", "Dùng thuật ngữ công nghệ khó hiểu."], ["Trấn an rằng khách hàng luôn được phục vụ đầy đủ qua kênh trực tiếp.", "Tạo cảm giác khách hàng là gánh nặng vì không quen kênh số."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Bác/anh/chị cứ yên tâm, em hỗ trợ làm ngay tại quầy ạ, mình không cần dùng điện thoại đâu.”", "s": "Normal"}, {"type": "p", "t": "“Em hướng dẫn từng bước thật chậm, có gì bác/anh/chị cứ hỏi em nhé.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được tôn trọng và quan tâm đúng với hoàn cảnh của mình, không bị bỏ lại phía sau vì không quen công nghệ. Việc được hỗ trợ tận nơi, kiên nhẫn và không bị thúc ép khiến họ thấy thoải mái, tự tin hơn khi giao dịch. Cảm nhận đọng lại là ngành điện thực sự công bằng và nhân văn, phục vụ chu đáo mọi khách hàng dù ở bất kỳ độ tuổi hay điều kiện nào.", "s": "Normal"}]}]}, {"num": "VIII", "title": "CBCNV Ở VĂN PHÒNG (CƠ QUAN TẬP ĐOÀN, CƠ QUAN TỔNG CÔNG TY)", "intro": "Lưu ý duyệt: Nhóm vị trí này chưa có dữ liệu tình huống gốc trong dự thảo. Các tình huống dưới đây được soạn mới theo tinh thần \"trách nhiệm chung của toàn hệ thống\", đề nghị anh/chị rà soát và điều chỉnh cho phù hợp thực tế trước khi đưa vào bản chính thức. CBCNV ở văn phòng không trực tiếp gặp khách hàng, nhưng mỗi quyết định, mỗi văn bản, mỗi lần phối hợp nội bộ đều ảnh hưởng đến trải nghiệm khách hàng ở tuyến đầu. Trong mắt khách hàng chỉ có một ngành điện, nên trách nhiệm tạo trải nghiệm tốt thuộc về toàn hệ thống, kể cả những người ở phía sau.", "situations": [{"code": "VIII.1", "title": "Tuyến đầu cần dữ liệu, hướng dẫn để trả lời khách hàng nhưng bộ phận văn phòng phản hồi chậm", "principles": "NT3 Trách nhiệm chung toàn hệ thống; NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Một khách hàng đang chờ câu trả lời ở tuyến đầu, nhưng nhân viên lại phải chờ bộ phận văn phòng cung cấp dữ liệu hoặc hướng dẫn. Sự chậm trễ phía sau, dù khách hàng không nhìn thấy, lập tức trở thành sự chậm trễ mà chính họ phải gánh chịu. Trong mắt khách hàng chỉ có một ngành điện, nên một đề nghị nội bộ bị coi nhẹ có thể khiến cả trải nghiệm tuyến đầu bị đứt gãy và niềm tin bị bào mòn.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Ưu tiên đề nghị nội bộ đang ảnh hưởng khách hàng.", "Coi đề nghị nội bộ là việc phụ, xử lý chậm."], ["Cung cấp dữ liệu đầy đủ, chính xác, nhất quán.", "Cung cấp thông tin thiếu, không nhất quán."], ["Hẹn rõ thời gian phản hồi khi cần.", "Đẩy phiếu qua lại giữa các bộ phận."], ["Phối hợp đến cùng, ghi nhận để cải tiến.", "Bỏ qua các vướng mắc lặp lại."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Đề nghị này đang ảnh hưởng đến khách hàng đang chờ, tôi ưu tiên xử lý và gửi lại trong [thời gian] nhé.”", "s": "Normal"}, {"type": "p", "t": "“Tôi gửi đủ dữ liệu và bối cảnh để anh/chị trả lời khách hàng chính xác, có gì cần thêm tôi hỗ trợ ngay ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng, thông qua tuyến đầu, nhận được câu trả lời nhanh, chính xác và nhất quán, không phải gánh chịu sự chậm trễ hay thiếu thông tin từ phía sau. Dù không biết đến những phối hợp nội bộ, họ cảm nhận được kết quả qua một dịch vụ liền mạch và đáng tin. Khi mỗi bộ phận đều coi việc của mình là góp phần phục vụ khách hàng, người dân thấy ngành điện vận hành như một thể thống nhất, chuyên nghiệp và có trách nhiệm đến cùng.", "s": "Normal"}]}, {"code": "VIII.2", "title": "Soạn thảo văn bản, hướng dẫn áp dụng cho toàn hệ thống có nội dung khó hiểu, dễ gây vướng cho tuy
