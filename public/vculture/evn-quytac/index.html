<script>
window.APP = {"core": {"chapters": [{"num": "I", "title": "NỀN TẢNG VĂN HÓA, ĐẠO ĐỨC NGHỀ NGHIỆP VÀ TRIẾT LÝ PHỤC VỤ KHÁCH HÀNG", "sections": [{"num": "I", "title": "TUYÊN NGÔN TRẢI NGHIỆM KHÁCH HÀNG EVN", "articles": [{"num": "1", "title": "Tuyên ngôn Trải nghiệm Khách hàng EVN: Triết lý, định hướng và phương châm phục vụ", "blocks": [{"t": "1. Triết lý phục vụ khách hàng EVN", "s": "h4", "l": false}, {"t": "Người EVN tin rằng: dòng điện thắp sáng cuộc sống, còn cách phục vụ thắp sáng niềm tin. Mỗi hành động phục vụ, dù lớn hay nhỏ, đều phải hướng đến sự an toàn, minh bạch, thuận tiện, đúng quy định và trọn trách nhiệm; để khách hàng không chỉ nhận được điện, mà còn cảm nhận được sự tin cậy, tận tâm và đồng hành của EVN.", "s": "p", "l": false}, {"t": "Diễn giải:", "s": "label", "l": false}, {"t": "Triết lý phục vụ khách hàng EVN được bắt đầu từ một niềm tin giản dị nhưng sâu sắc: dòng điện thắp sáng cuộc sống, còn cách phục vụ thắp sáng niềm tin. Điện là nhu cầu thiết yếu gắn với sinh hoạt, sản xuất, học tập, chăm sóc sức khỏe và sự vận hành của xã hội. Vì vậy, với người EVN, phục vụ khách hàng không chỉ là cung cấp điện, tiếp nhận yêu cầu hay hoàn thành một quy trình nghiệp vụ, mà còn là trách nhiệm gìn giữ sự yên tâm, tin cậy và gắn bó của khách hàng đối với ngành Điện.", "s": "p", "l": false}, {"t": "Mỗi hành động phục vụ của người EVN, dù lớn hay nhỏ, đều cần được thực hiện trên nền tảng an toàn, minh bạch, thuận tiện, đúng quy định và trọn trách nhiệm. An toàn để khách hàng yên tâm sử dụng điện; minh bạch để khách hàng hiểu rõ thông tin, chi phí, thời gian và cách thức xử lý; thuận tiện để khách hàng giảm bớt công sức, thời gian và số lần phải liên hệ; đúng quy định để bảo đảm công bằng, nhất quán và chuẩn mực; trọn trách nhiệm để mỗi việc được theo dõi, phối hợp và khép lại đến nơi đến chốn.", "s": "p", "l": false}, {"t": "Triết lý ấy cũng nhắc nhở rằng trải nghiệm khách hàng không chỉ được tạo ra ở những vị trí trực tiếp giao tiếp với khách hàng, mà còn đến từ toàn bộ hệ thống EVN. Một thao tác kỹ thuật chính xác, một dữ liệu được cập nhật đầy đủ, một thông báo kịp thời, một cuộc hẹn đúng giờ, một sự phối hợp thông suốt giữa các bộ phận hay một lời giải thích chân thành đều góp phần tạo nên cảm nhận của khách hàng về EVN.", "s": "p", "l": false}, {"t": "Vì vậy, trách nhiệm phục vụ của người EVN không dừng lại ở “phần việc của tôi”, mà hướng đến kết quả khách hàng thật sự nhận được. Khi khách hàng không chỉ được đáp ứng nhu cầu về điện, mà còn cảm nhận được sự tin cậy, tận tâm và đồng hành của EVN sau mỗi lần tiếp xúc, đó chính là lúc văn hóa EVN được thể hiện một cách sống động và thuyết phục nhất.", "s": "p", "l": false}, {"t": "2. Định hướng văn hóa kinh doanh phục vụ khách hàng EVN", "s": "h4", "l": false}, {"t": "Văn hóa kinh doanh phục vụ khách hàng của EVN lấy trải nghiệm khách hàng làm thước đo, lấy niềm tin của khách hàng làm mục tiêu, lấy an toàn, minh bạch, thuận tiện, tận tâm và trọn trách nhiệm làm chuẩn mực hành động.", "s": "p", "l": false}, {"t": "Trong mọi hoạt động kinh doanh và dịch vụ khách hàng, EVN hướng tới cung cấp điện an toàn, ổn định; phục vụ rõ ràng, dễ hiểu, đúng quy định; lắng nghe để thấu hiểu; phối hợp để giải quyết thông suốt; và đồng hành đến khi khách hàng yên tâm, tin tưởng, cảm nhận rõ hình ảnh EVN trách nhiệm, chuyên nghiệp, nghĩa tình trong từng điểm chạm.", "s": "p", "l": false}, {"t": "Diễn giải:", "s": "label", "l": false}, {"t": "Định hướng văn hóa kinh doanh phục vụ khách hàng EVN khẳng định rằng mọi hoạt động kinh doanh, dịch vụ và vận hành liên quan đến khách hàng đều phải được nhìn từ trải nghiệm thực tế của khách hàng. Không chỉ hỏi “EVN đã làm đúng quy trình chưa”, mà còn phải hỏi “khách hàng có được phục vụ an toàn, rõ ràng, thuận tiện, đúng hẹn và yên tâm hơn sau mỗi lần tiếp xúc hay không”.", "s": "p", "l": false}, {"t": "Theo định hướng đó, chất lượng phục vụ khách hàng không chỉ nằm ở kết quả cuối cùng, mà còn nằm trong toàn bộ quá trình khách hàng tương tác với EVN: từ khi tìm hiểu thông tin, đăng ký dịch vụ, ký kết hợp đồng, sử dụng điện, thanh toán, nhận thông báo, phản ánh yêu cầu, đến khi sự việc được giải quyết và khép lại. Ở mỗi điểm chạm, khách hàng cần được cung cấp thông tin minh bạch, được hướng dẫn dễ hiểu, được hỗ trợ đúng lúc, được tôn trọng và được đồng hành đến nơi đến chốn.", "s": "p", "l": false}, {"t": "Định hướng này cũng nhấn mạnh rằng trải nghiệm khách hàng là trách nhiệm chung của toàn hệ thống EVN.", "s": "p", "l": false}, {"t": "Người trực tiếp giao tiếp với khách hàng tạo nên cảm nhận bằng thái độ, lời nói, tác phong và cách xử lý tình huống. Người làm việc phía sau tạo nên trải nghiệm bằng dữ liệu chính xác, quy trình thông suốt, phối hợp kịp thời, kỹ thuật an toàn và tiến độ được bảo đảm. Chỉ khi các bộ phận cùng hướng đến kết quả khách hàng nhận được, dịch vụ của EVN mới thật sự liền mạch và đáng tin cậy.", "s": "p", "l": false}, {"t": "Vì vậy, mỗi CBCNV EVN cần coi từng điểm chạm với khách hàng là một cơ hội thể hiện văn hóa EVN. Khi EVN cung cấp điện an toàn, ổn định; phục vụ minh bạch, thuận tiện, tận tâm; lắng nghe, phối hợp và giải quyết trọn trách nhiệm, khách hàng không chỉ được đáp ứng nhu cầu về điện, mà còn cảm nhận rõ một EVN chuyên nghiệp trong năng lực, trách nhiệm trong hành động và nghĩa tình trong cách phục vụ.", "s": "p", "l": false}, {"t": "3. Phương châm phục vụ", "s": "h4", "l": false}, {"t": "(1) Thắp sáng niềm tin trong từng điểm chạm.", "s": "p", "l": false}, {"t": "(2) Thấu hiểu khách hàng trong suốt quá trình phục vụ.", "s": "p", "l": false}, {"t": "(3) Chủ động nhận diện nhu cầu, kịp thời kết nối giải pháp.", "s": "p", "l": false}, {"t": "(4) Đồng hành đến cùng, tận tâm trọn việc.", "s": "p", "l": false}, {"t": "(5) Khép lại mỗi hành trình bằng cảm nhận tích cực của khách hàng.", "s": "p", "l": false}, {"t": "Diễn giải:", "s": "label", "l": false}, {"t": "Phương châm phục vụ Trải nghiệm Khách hàng EVN là lời nhắc nhở ngắn gọn, dễ nhớ và dễ thực hiện đối với mỗi người EVN trong mọi hoạt động liên quan đến khách hàng. Phương châm này chuyển hóa triết lý “dòng điện thắp sáng cuộc sống, còn cách phục vụ thắp sáng niềm tin” thành những định hướng hành động cụ thể trong từng điểm chạm, từng quy trình và từng hành trình sử dụng điện của khách hàng.", "s": "p", "l": false}, {"t": "Trong hành trình sử dụng điện, khách hàng không chỉ quan tâm yêu cầu của mình có được xử lý hay không, mà còn quan tâm đến cách EVN tiếp nhận, hướng dẫn, giải thích, cập nhật, phối hợp và đồng hành với họ trong suốt quá trình đó. Một thông tin rõ ràng, một lời giải thích dễ hiểu, một cuộc hẹn đúng giờ, một sự chủ động thông báo, một thái độ tận tâm hay một cam kết được thực hiện đến cùng đều có thể trở thành điểm chạm làm nên niềm tin của khách hàng đối với EVN.", "s": "p", "l": false}, {"t": "Vì vậy, “thắp sáng niềm tin trong từng điểm chạm” là yêu cầu xuyên suốt trong mọi tiếp xúc với khách hàng.", "s": "p", "l": false}, {"t": "Mỗi điểm chạm, dù trực tiếp tại phòng giao dịch, tại hiện trường, qua tổng đài, website, ứng dụng số hay qua các thông báo của EVN, đều cần thể hiện sự tôn trọng, minh bạch, chuyên nghiệp và trách nhiệm.", "s": "p", "l": false}, {"t": "“Thấu hiểu khách hàng trong suốt quá trình phục vụ” đòi hỏi người EVN không chỉ nghe yêu cầu, mà còn hiểu đúng hoàn cảnh, mức độ cấp thiết, khả năng tiếp cận thông tin và cảm xúc của khách hàng.", "s": "quote", "l": true}, {"t": "Với từng nhóm khách hàng, nhất là người cao tuổi, người khuyết tật, khách hàng ở vùng sâu, vùng xa hoặc khách hàng đang gặp sự cố về điện, sự thấu hiểu cần được thể hiện bằng cách hướng dẫn dễ hiểu, hỗ trợ phù hợp và phản hồi kịp thời.”", "s": "p", "l": false}, {"t": "“Chủ động nhận diện nhu cầu, kịp thời kết nối giải pháp” nhấn mạnh tinh thần không chờ khách hàng phải hỏi nhiều lần, đi lại nhiều nơi hoặc tự xoay xở giữa các bộ phận. Khi phát hiện nhu cầu, vướng mắc hoặc nguy cơ phát sinh trải nghiệm không tốt, người EVN cần chủ động cung cấp thông tin, kết nối đúng đầu mối, phối hợp đúng trách nhiệm và dẫn dắt khách hàng đến giải pháp phù hợp, đúng quy định.”", "s": "quote", "l": true}, {"t": "“Đồng hành đến cùng, tận tâm trọn việc” có nghĩa là trách nhiệm phục vụ không dừng lại ở việc đã tiếp nhận, đã chuyển xử lý hoặc đã hoàn thành phần việc của một cá nhân, bộ phận. Người EVN cần quan tâm đến kết quả cuối cùng mà khách hàng thật sự nhận được, theo dõi tiến độ, phối hợp thông suốt và khép lại sự việc một cách rõ ràng, có trách nhiệm.”", "s": "quote", "l": true}, {"t": "“Khép lại mỗi hành trình bằng cảm nhận tích cực của khách hàng” là mục tiêu cuối cùng của phương châm phục vụ. Sau mỗi lần tiếp xúc với EVN, khách hàng cần cảm thấy yên tâm hơn, hiểu rõ hơn, thuận tiện hơn và tin tưởng hơn. Khi mỗi hành trình của khách hàng được khép lại bằng sự hài lòng, niềm tin và cảm nhận tích cực, đó chính là biểu hiện cụ thể của văn hóa kinh doanh và tinh thần phục vụ khách hàng EVN.", "s": "quote", "l": true}, {"t": "MỤC II SỨ MỆNH, TẦM NHÌN VÀ GIÁ TRỊ CỐT LÕI TRONG CÔNG TÁC KINH DOANH PHỤC VỤ KHÁCH HÀNG", "s": "p", "l": false}]}]}, {"num": "II", "title": "SỨ MỆNH, TẦM NHÌN VÀ GIÁ TRỊ CỐT LÕI TRONG CÔNG TÁC KINH DOANH PHỤC VỤ KHÁCH HÀNG", "articles": [{"num": "2", "title": "Sứ mệnh của EVN và công tác kinh doanh phục vụ khách hàng", "blocks": [{"t": "Sứ mệnh của EVN là:", "s": "p", "l": false}, {"t": "“Cung cấp điện với chất lượng và dịch vụ ngày càng tốt hơn, đảm bảo trách nhiệm với môi trường và cộng đồng.”", "s": "quote", "l": true}, {"t": "Trong công tác kinh doanh và dịch vụ khách hàng, sứ mệnh đó được cụ thể hóa bằng yêu cầu không ngừng nâng cao chất lượng cung cấp điện, chất lượng dịch vụ và chất lượng trải nghiệm của khách hàng. Người EVN không chỉ thực hiện đúng quy định, đúng quy trình, đúng trách nhiệm, mà còn phải quan tâm đến cảm nhận thực tế của khách hàng trong từng điểm chạm với EVN.", "s": "p", "l": false}, {"t": "Thực hiện sứ mệnh của EVN trong phục vụ khách hàng có nghĩa là: điện phải được cung cấp an toàn, ổn định;", "s": "p", "l": false}, {"t": "dịch vụ phải minh bạch, thuận tiện; thông tin phải rõ ràng, dễ hiểu; các yêu cầu của khách hàng phải được tiếp nhận, hướng dẫn, phối hợp và xử lý kịp thời trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định. Mỗi CBCNV EVN, dù ở vị trí trực tiếp hay gián tiếp phục vụ khách hàng, đều có trách nhiệm góp phần làm cho quá trình khách hàng tiếp xúc với EVN trở nên thông suốt, tin cậy và có trách nhiệm hơn.", "s": "p", "l": false}, {"t": "Vì vậy, mỗi tương tác với khách hàng cần được xem là một cơ hội chuyển hóa sứ mệnh của EVN thành hành động cụ thể. Khi người EVN biết lắng nghe để thấu hiểu, giải thích để khách hàng yên tâm, chủ động phối hợp để công việc được thông suốt và đồng hành đến khi sự việc được khép lại rõ ràng, đúng đắn, trọn trách nhiệm, sứ mệnh của EVN không chỉ được thể hiện qua dòng điện cung cấp cho xã hội, mà còn qua niềm tin khách hàng cảm nhận được trong từng lần được phục vụ.", "s": "p", "l": false}]}, {"num": "3", "title": "Tầm nhìn của EVN và công tác kinh doanh phục vụ khách hàng", "blocks": [{"t": "Tầm nhìn của EVN là:", "s": "p", "l": false}, {"t": "“EVN là tập đoàn kinh tế hàng đầu trong lĩnh vực năng lượng tại Việt Nam và khu vực châu Á.”", "s": "quote", "l": true}, {"t": "Trong công tác kinh doanh và dịch vụ khách hàng, tầm nhìn này không chỉ được thể hiện bằng quy mô hệ thống, năng lực kỹ thuật, chất lượng cung cấp điện hay mức độ hiện đại hóa hạ tầng, mà còn bằng chất lượng trải nghiệm mà EVN mang lại cho khách hàng trong từng hành trình sử dụng điện. Một EVN hiện đại phải là EVN giúp khách hàng tiếp cận dịch vụ dễ dàng hơn, hiểu thông tin rõ ràng hơn, thực hiện giao dịch thuận tiện hơn, được hỗ trợ kịp thời hơn và cảm nhận được sự chuyên nghiệp, trách nhiệm, tận tâm trong mọi kênh phục vụ.", "s": "p", "l": false}, {"t": "Trong bối cảnh ngành năng lượng đang chuyển dịch mạnh mẽ, dịch vụ điện ngày càng được số hóa và nhu cầu của khách hàng ngày càng đa dạng, công tác kinh doanh và dịch vụ khách hàng cần góp phần xây dựng hình ảnh EVN tiên phong, hiện đại, đáng tin cậy và đồng hành. EVN không chỉ đáp ứng tốt các nhu cầu truyền thống của khách hàng như cấp điện, ký kết và thay đổi hợp đồng, thanh toán, ghi nhận sản lượng, thông báo ngừng giảm cung cấp điện, xử lý sự cố, tiếp nhận phản ánh, kiến nghị, mà còn cần chủ động hỗ trợ khách hàng tiếp cận các nhu cầu mới về sử dụng điện thông minh, tiết kiệm điện, năng lượng tái tạo, điện mặt trời mái nhà, trạm sạc xe điện và các giải pháp liên quan đến chuyển dịch năng lượng.", "s": "p", "l": false}, {"t": "Vì vậy, nâng tầm trải nghiệm khách hàng là một phần quan trọng trong hành trình hiện thực hóa tầm nhìn của EVN. Đó là quá trình kết hợp giữa hạ tầng điện an toàn, ổn định; quy trình phục vụ minh bạch, nhất quán; công nghệ số thuận tiện, dễ sử dụng; dữ liệu khách hàng được quản lý đúng mục đích, an toàn; và văn hóa phục vụ lấy niềm tin của khách hàng làm đích đến.", "s": "p", "l": false}, {"t": "Mỗi CBCNV EVN, dù ở vị trí trực tiếp giao tiếp với khách hàng hay làm việc phía sau hệ thống, đều có trách nhiệm góp phần đưa hình ảnh EVN hiện đại và đáng tin cậy đến với khách hàng bằng những hành động cụ thể:", "s": "p", "l": false}, {"t": "làm đúng quy định, phục vụ rõ ràng, phối hợp thông suốt, ứng dụng công nghệ hiệu quả và đồng hành với khách hàng trong quá trình sử dụng điện an toàn, tiết kiệm, bền vững.", "s": "p", "l": false}]}, {"num": "4", "title": "Giá trị cốt lõi của EVN trong công tác kinh doanh phục vụ khách hàng", "blocks": [{"t": "EVN có năm giá trị cốt lõi: Niềm tin – Chất lượng – Tiên phong – Sáng tạo – Trách nhiệm, với tinh thần xuyên suốt là “EVN Thắp sáng niềm tin”. Trong công tác kinh doanh và dịch vụ khách hàng, các giá trị này không chỉ là định hướng văn hóa chung, mà cần được chuyển hóa thành chuẩn mực phục vụ cụ thể trong từng hành vi, từng điểm chạm và từng kết quả khách hàng cảm nhận được.", "s": "p", "l": false}, {"t": "1. Niềm tin", "s": "h4", "l": false}, {"t": "Niềm tin là nền tảng của mọi quan hệ giữa EVN và khách hàng. Trong phục vụ khách hàng, niềm tin không được tạo nên bằng lời hứa chung chung, mà bằng những hành động nhất quán: cung cấp điện an toàn, ổn định; thông tin minh bạch; giải thích rõ ràng; giữ đúng cam kết; xử lý đúng quy định; và ứng xử có trách nhiệm trong từng tình huống. Mỗi điểm chạm với khách hàng là một cơ hội để EVN thắp sáng, củng cố và gìn giữ niềm tin đó.", "s": "p", "l": false}, {"t": "2. Chất lượng", "s": "h4", "l": false}, {"t": "Chất lượng trong phục vụ khách hàng không chỉ là chất lượng điện năng, mà còn là chất lượng của toàn bộ trải nghiệm khách hàng nhận được. Một dịch vụ có chất lượng là dịch vụ được thực hiện đúng, đủ, kịp thời, minh bạch, thuận tiện và làm khách hàng yên tâm. Vì vậy, trong từng hoạt động phục vụ, mỗi CBCNV EVN không chỉ cần hoàn thành nghiệp vụ, mà còn cần giúp khách hàng hiểu rõ quy trình, nắm được thông tin cần thiết, biết việc của mình đang được xử lý như thế nào và cảm nhận được sự chuyên nghiệp trong từng bước phục vụ.", "s": "p", "l": false}, {"t": "3. Tiên phong", "s": "h4", "l": false}, {"t": "Tiên phong trong phục vụ khách hàng là chủ động đi trước nhu cầu, thay đổi cách phục vụ để phù hợp với sự phát triển của xã hội, công nghệ và thị trường năng lượng. EVN cần không ngừng mở rộng, hoàn thiện các kênh phục vụ hiện đại; ứng dụng công nghệ số; nâng cao năng lực tư vấn; và đồng hành với khách hàng trong các nhu cầu mới như sử dụng điện thông minh, chuyển dịch năng lượng, điện mặt trời mái nhà, trạm sạc xe điện và các dịch vụ năng lượng tương lai.", "s": "p", "l": false}, {"t": "4. Sáng tạo", "s": "h4", "l": false}, {"t": "Sáng tạo trong phục vụ khách hàng là không bằng lòng với cách làm quen thuộc nếu cách làm đó còn gây khó hiểu, chậm trễ, phiền hà hoặc làm khách hàng phải tự xoay xở. Mỗi CBCNV EVN cần chủ động đề xuất cải tiến, đơn giản hóa cách hướng dẫn, nâng cao khả năng tiếp cận dịch vụ, cá nhân hóa hỗ trợ theo từng nhóm khách hàng và tìm kiếm giải pháp phù hợp để mỗi hành trình của khách hàng ngày càng thuận tiện, dễ hiểu và tích cực hơn.", "s": "p", "l": false}, {"t": "5. Trách nhiệm", "s": "h4", "l": false}, {"t": "Trách nhiệm là giá trị làm nên bản sắc phục vụ của EVN. Trong kinh doanh và dịch vụ khách hàng, trách nhiệm không dừng lại ở phần việc được giao, mà hướng đến kết quả khách hàng thật sự nhận được. Mỗi CBCNV EVN cần thực hiện đúng cam kết, đúng thẩm quyền, đúng quy định; chủ động phối hợp khi công việc liên quan nhiều bộ phận; thông tin kịp thời khi có thay đổi; và đồng hành đến khi yêu cầu của khách hàng được xử lý rõ ràng, trọn việc. Trách nhiệm đến cùng chính là cách EVN làm cho khách hàng yên tâm và làm cho niềm tin với EVN trở nên bền vững.", "s": "p", "l": false}, {"t": "MỤC III CÁC GIÁ TRỊ VÀ CHUẨN MỰC ĐẠO ĐỨC NGHỀ NGHIỆP EVN TRONG KINH DOANH PHỤC VỤ KHÁCH HÀNG Các chuẩn mực đạo đức nghề nghiệp EVN trong kinh doanh phục vụ khách hàng được xây dựng trên nền tảng các giá trị: An toàn – Đoàn kết – Nhân văn – Trung thực – Minh bạch. Đây không chỉ là các yêu cầu đạo đức chung của CBCNV EVN, mà là “đường ray chuẩn mực” để mọi hoạt động kinh doanh, dịch vụ khách hàng và trải nghiệm khách hàng được thực hiện đúng đắn, đáng tin cậy và có trách nhiệm.", "s": "p", "l": false}, {"t": "Trong lĩnh vực dịch vụ điện, mỗi quyết định, mỗi lời tư vấn, mỗi thông tin cung cấp, mỗi thao tác kỹ thuật và mỗi cách phối hợp nội bộ đều có thể ảnh hưởng trực tiếp đến quyền lợi, sự an toàn, sự thuận tiện và niềm tin của khách hàng. Vì vậy, thực thi đạo đức nghề nghiệp không phải là nội dung tách rời công việc hằng ngày, mà chính là cách EVN bảo vệ uy tín của ngành Điện, giữ gìn niềm tin của khách hàng và làm cho văn hóa EVN được thể hiện bằng hành vi cụ thể.", "s": "p", "l": false}, {"t": "Các chuẩn mực đạo đức nghề nghiệp trong kinh doanh phục vụ khách hàng nhằm giúp mỗi CBCNV EVN biết rõ điều gì phải tuân thủ, điều gì không được đánh đổi, điều gì cần minh bạch, điều gì phải phối hợp và điều gì cần được thực hiện bằng tinh thần nhân văn, nghĩa tình. Đây là nền tảng để phục vụ khách hàng đúng quy định, đúng trách nhiệm, đúng lương tâm nghề nghiệp và đúng bản sắc văn hóa EVN.", "s": "p", "l": false}]}]}, {"num": "III", "title": "CÁC GIÁ TRỊ VÀ CHUẨN MỰC ĐẠO ĐỨC NGHỀ NGHIỆP EVN TRONG KINH DOANH PHỤC VỤ KHÁCH HÀNG", "articles": [{"num": "5", "title": "Tuân thủ là nền tảng của phục vụ đúng đắn", "blocks": [{"t": "Tuân thủ pháp luật, quy trình kinh doanh điện năng, quy định về chăm sóc khách hàng và các chuẩn mực ứng xử của EVN là yêu cầu đạo đức bắt buộc trong mọi hoạt động kinh doanh phục vụ khách hàng. Không vì áp lực tiến độ, sự thuận tiện trước mắt, thói quen xử lý cũ hoặc mong muốn “giải quyết nhanh” mà bỏ qua quy định, làm sai thẩm quyền hoặc tạo tiền lệ không đúng.", "s": "p", "l": false}, {"t": "Tuân thủ không chỉ là làm đúng để tránh sai phạm, mà là cách bảo vệ khách hàng, bảo vệ người lao động, bảo vệ tổ chức và bảo vệ sự công bằng trong cung cấp dịch vụ điện. Mỗi hồ sơ, mỗi giao dịch, mỗi yêu cầu của khách hàng phải được tiếp nhận và xử lý trên cơ sở đúng quy định, rõ trách nhiệm, có căn cứ, có kiểm soát và có khả năng giải trình.", "s": "p", "l": false}, {"t": "Cần thống nhất nhận thức rằng: phục vụ tận tâm không có nghĩa là làm thay quy định; linh hoạt không có nghĩa là tùy tiện; nhanh chóng không có nghĩa là bỏ bước; và hỗ trợ khách hàng không thể tách rời yêu cầu tuân thủ pháp luật, quy trình và chuẩn mực đạo đức nghề nghiệp.", "s": "p", "l": false}]}, {"num": "6", "title": "Bảo đảm an toàn trong cung cấp dịch vụ điện", "blocks": [{"t": "An toàn là chuẩn mực đạo đức hàng đầu trong cung cấp dịch vụ điện. Mọi hoạt động kinh doanh và phục vụ khách hàng của EVN phải đặt an toàn của khách hàng, cộng đồng và CBCNV lên trước yêu cầu tiến độ, chi phí hay sự thuận tiện tức thời.", "s": "p", "l": false}, {"t": "Trong mọi hoạt động phục vụ, không đánh đổi an toàn để rút ngắn thời gian xử lý, không bỏ qua cảnh báo rủi ro, không chủ quan trong thao tác hiện trường, không cung cấp hướng dẫn có thể làm khách hàng hiểu sai hoặc tự thực hiện những việc vượt quá điều kiện an toàn. Thông tin về an toàn điện cần được giải thích rõ ràng, dễ hiểu, phù hợp với từng nhóm khách hàng, đặc biệt là hộ gia đình, người cao tuổi, người dân vùng sâu vùng xa, cơ sở sản xuất, kinh doanh và các khách hàng có nguy cơ cao về sử dụng điện.", "s": "p", "l": false}, {"t": "Bảo đảm an toàn không chỉ là yêu cầu kỹ thuật, mà là biểu hiện của trách nhiệm nghề nghiệp và đạo đức phục vụ. Một dịch vụ chỉ thật sự có chất lượng khi được thực hiện an toàn, đúng quy định và làm khách hàng yên tâm.", "s": "p", "l": false}]}, {"num": "7", "title": "Trung thực và minh bạch trong cung cấp dịch vụ điện", "blocks": [{"t": "Trung thực và minh bạch là nền tảng của niềm tin giữa EVN và khách hàng. Mọi thông tin cung cấp cho khách hàng phải đúng, đủ, dễ hiểu về hồ sơ, quy trình, chi phí, tiến độ, quyền lợi, nghĩa vụ và kết quả xử lý yêu cầu. Không nói quá khả năng, không hứa vượt thẩm quyền, không trả lời chung chung khi có thể tra cứu, không né tránh thông tin cần công khai, không để khách hàng hiểu sai về trách nhiệm của EVN và trách nhiệm của khách hàng.", "s": "p", "l": false}, {"t": "Trong những tình huống có vướng mắc, chậm trễ hoặc sai sót, cần chủ động thông tin, giải thích rõ nguyên nhân, hướng xử lý và thời gian dự kiến trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định. Khi có sai sót thuộc trách nhiệm của EVN, cần thẳng thắn ghi nhận, phối hợp khắc phục và phản hồi cho khách hàng với thái độ cầu thị.", "s": "p", "l": false}, {"t": "Minh bạch không chỉ giúp khách hàng hiểu đúng, mà còn giúp giảm nghi ngờ, giảm bức xúc và củng cố hình ảnh EVN chuyên nghiệp, đáng tin cậy. Trung thực trong lời nói, minh bạch trong thông tin và rõ ràng trong trách nhiệm là những yêu cầu không thể thiếu của đạo đức nghề nghiệp trong phục vụ khách hàng.", "s": "p", "l": false}]}, {"num": "8", "title": "Tinh thần đoàn kết, hợp tác và trách nhiệm nhân văn", "blocks": [{"t": "Trong cảm nhận của khách hàng, chỉ có một EVN. Khách hàng không phân biệt đầy đủ giữa tổng đài, điện lực, phòng giao dịch, đội hiện trường, bộ phận kỹ thuật, bộ phận kinh doanh hay hệ thống số. Vì vậy, mọi sự phối hợp thiếu nhịp nhàng, mọi sự chuyển tiếp không rõ ràng, mọi việc đùn đẩy trách nhiệm hoặc để khách hàng tự liên hệ nhiều nơi đều có thể làm suy giảm niềm tin vào EVN.", "s": "p", "l": false}, {"t": "Mỗi đơn vị, bộ phận và cá nhân liên quan cần hợp tác trên tinh thần cùng chịu trách nhiệm về trải nghiệm khách hàng. Khi yêu cầu của khách hàng liên quan đến nhiều khâu, cần chủ động phối hợp, cập nhật, chuyển giao đầy đủ thông tin và theo dõi đến khi công việc được xử lý rõ ràng. Khó khăn nội bộ không được chuyển thành khó khăn của khách hàng; khác biệt về chức năng không được trở thành lý do làm khách hàng phải chờ đợi, hỏi lại hoặc tự xoay xở.", "s": "p", "l": false}, {"t": "Tinh thần hợp tác và trách nhiệm phải đi cùng yếu tố nhân văn, nghĩa tình. EVN cần quan tâm hơn đến những khách hàng gặp rào cản trong tiếp cận dịch vụ như người cao tuổi, người khuyết tật, hộ nghèo, hộ cận nghèo, khách hàng vùng sâu, vùng xa, hải đảo, khách hàng chưa quen sử dụng kênh số hoặc khách hàng đang ở trong tình huống khẩn cấp, dễ tổn thương. Sự hỗ trợ phù hợp với từng hoàn cảnh không chỉ làm dịch vụ tốt hơn, mà còn thể hiện bản sắc văn hóa EVN: trách nhiệm, tận tâm và nghĩa tình trong từng điểm chạm.", "s": "p", "l": false}, {"t": "MỤC IV CÁC NGUYÊN TẮC PHỤC VỤ VÀ KIẾN TẠO TRẢI NGHIỆM KHÁCH HÀNG Các nguyên tắc phục vụ và kiến tạo trải nghiệm khách hàng là lớp chuyển hóa từ triết lý phục vụ, định hướng văn hóa kinh doanh, phương châm phục vụ và chuẩn mực đạo đức nghề nghiệp thành định hướng hành vi thống nhất cho toàn EVN. Bộ nguyên tắc này không thay thế quy trình, quy định nghiệp vụ, mà giúp mỗi CBCNV EVN biết cách thực hiện quy trình bằng tinh thần phục vụ đúng đắn, nhân văn, minh bạch và có trách nhiệm.", "s": "p", "l": false}, {"t": "Bộ 12 nguyên tắc được tổ chức thành bốn nhóm logic. Nhóm thứ nhất – Đích phục vụ và niềm tin của khách hàng xác định kết quả, sự rõ ràng, sự yên tâm và việc giữ cam kết là thước đo giá trị phục vụ. Nhóm thứ hai – Ứng xử với khách hàng bằng sự tôn trọng, minh bạch và nhân văn định hướng cách CBCNV EVN lắng nghe, giải thích, cung cấp thông tin và hỗ trợ phù hợp với từng hoàn cảnh. Nhóm thứ ba – Một EVN thống nhất, phối hợp liền mạch đến kết quả bảo đảm khách hàng không phải gánh ranh giới nội bộ, không phải chờ trong im lặng và luôn có đầu mối chịu trách nhiệm. Nhóm thứ tư – Nền tảng số, dữ liệu, an toàn và cải tiến liên tục đặt ra yêu cầu về kênh số dễ dùng, dữ liệu đồng bộ, an toàn, bảo mật và học hỏi từ các điểm đau lặp lại.", "s": "p", "l": false}, {"t": "Mỗi nguyên tắc là một trục soi chiếu hành vi tại điểm chạm. Khi vận dụng, CBCNV EVN cần tự kiểm: việc mình làm đã giúp khách hàng rõ hơn, yên tâm hơn, tin hơn và nhận được kết quả phù hợp trong phạm vi trách nhiệm, thẩm quyền, đúng quy định hay chưa.", "s": "p", "l": false}, {"t": "Bảng t ra cứu nhanh — Bộ 12 nguyên tắc phục vụ và kiến tạo TNKH", "s": "p", "l": false}, {"t": "NT1: Khách hàng nhận được kết quả là thước đo hoàn thành công việc.", "s": "ntquick", "l": true}, {"t": "NT2: Mỗi điểm chạm phải làm khách hàng rõ hơn, yên tâm hơn và tin hơn.", "s": "ntquick", "l": true}, {"t": "NT3: Đúng hẹn, giữ cam kết; nếu thay đổi phải báo trước, nói rõ lý do và phương án tiếp theo.", "s": "ntquick", "l": true}, {"t": "NT4: Lắng nghe, tôn trọng và đồng cảm trước khi hướng dẫn, giải thích hoặc xử lý.", "s": "ntquick", "l": true}, {"t": "NT5: Thông tin phải rõ ràng, trung thực, dễ hiểu và có căn cứ.", "s": "ntquick", "l": true}, {"t": "NT6: Phục vụ công bằng, nhân văn và phù hợp với hoàn cảnh trong khuôn khổ quy định.", "s": "ntquick", "l": true}, {"t": "NT7: Khách hàng chỉ làm việc với một EVN thống nhất, không phải với các ranh giới nội bộ.", "s": "ntquick", "l": true}, {"t": "NT8: Không để khách hàng chờ trong im lặng; phải chủ động cập nhật và hỗ trợ kịp thời.", "s": "ntquick", "l": true}, {"t": "NT9: Rõ một đầu mối, rõ trách nhiệm, phối hợp đến khi có kết quả cuối cùng.", "s": "ntquick", "l": true}, {"t": "NT10: Kênh số phải dễ dùng, có người hỗ trợ và không bỏ lại khách hàng giữa chừng.", "s": "ntquick", "l": true}, {"t": "NT11: Dữ liệu phải đúng, đồng bộ; thông tin EVN đã có thì không bắt khách hàng trình bày lại.", "s": "ntquick", "l": true}, {"t": "NT12: An toàn là trước hết, bảo mật là bắt buộc, điểm đau lặp lại phải được cải tiến.", "s": "ntquick", "l": true}]}]}, {"num": "IV", "title": "CÁC NGUYÊN TẮC PHỤC VỤ VÀ KIẾN TẠO TRẢI NGHIỆM KHÁCH HÀNG", "articles": [{"num": "9", "title": "Các nguyên tắc về kết quả phục vụ và niềm tin của khách hàng", "blocks": [{"t": "Phục vụ khách hàng không dừng ở việc thực hiện đúng quy trình nội bộ, mà phải hướng tới kết quả khách hàng thực sự nhận được và cảm nhận sau mỗi lần tương tác với EVN. Trong trải nghiệm khách hàng, niềm tin không được tạo ra bằng khẩu hiệu chung, mà được tích lũy qua từng điểm chạm cụ thể: một cuộc gọi được trả lời rõ ràng, một lịch hẹn được giữ đúng, một thay đổi được báo trước, một vướng mắc được theo dõi đến nơi đến chốn. Vì vậy, mỗi CBCNV cần coi kết quả, sự rõ ràng, sự yên tâm và việc giữ cam kết với khách hàng là thước đo trực tiếp của giá trị phục vụ.", "s": "p", "l": false}, {"t": "Nguyên tắc 1 Khách hàng nhận được kết quả là thước đo hoàn thành công việc", "s": "nt", "l": false}, {"t": "Yêu cầu: Công việc chỉ được xem là hoàn thành khi khách hàng nhận được kết quả hợp lệ, hiểu rõ tình trạng xử", "s": "label", "l": false}, {"t": "lý hoặc biết chắc bước tiếp theo, thời gian dự kiến và đầu mối hỗ trợ; không chỉ khi quy trình nội bộ đã kết thúc.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Trước khi đóng phiếu, kết thúc cuộc gọi, rời hiện trường hoặc khép lại giao dịch, CBCNV", "s": "label", "l": false}, {"t": "cần xác nhận khách hàng đã nhận được kết quả, đã hiểu thông tin chính, đã biết việc gì sẽ xảy ra tiếp theo và liên hệ ai khi cần hỗ trợ.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Nếu tôi dừng việc tại đây, khách hàng đã thật sự có kết quả hoặc đã đủ rõ để yên tâm chờ bước", "s": "label", "l": false}, {"t": "tiếp theo chưa?", "s": "p", "l": false}, {"t": "Nguyên tắc 2 Mỗi điểm chạm phải làm khách hàng rõ hơn, yên tâm hơn và tin hơn", "s": "nt", "l": false}, {"t": "Yêu cầu: Mỗi tương tác với khách hàng, dù trực tiếp hay trên kênh số, phải giúp khách hàng rõ hơn về", "s": "label", "l": false}, {"t": "thông tin, yên tâm hơn về cách EVN xử lý và tin hơn vào trách nhiệm của EVN; không điểm chạm nào được để khách hàng mơ hồ hơn, lo lắng hơn hoặc mất niềm tin hơn.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Trong từng cuộc gọi, tin nhắn, lần giao dịch, lần đến hiện trường hoặc phản hồi trên", "s": "label", "l": false}, {"t": "ứng dụng, CBCNV cần cung cấp thông tin có ích, thể hiện thái độ có trách nhiệm và chỉ dẫn rõ ràng.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Sau điểm chạm này, khách hàng có rõ hơn, yên tâm hơn và tin EVN hơn không?", "s": "label", "l": false}, {"t": "Nguyên tắc 3 Đúng hẹn, giữ cam kết; nếu thay đổi phải báo trước, nói rõ lý do và phương án tiếp theo", "s": "nt", "l": false}, {"t": "Yêu cầu: Mọi cam kết với khách hàng về thời gian, lịch hẹn, tiến độ, kết quả xử lý hoặc phản hồi phải được", "s": "label", "l": false}, {"t": "tôn trọng. Khi có nguy cơ trễ hẹn, thay đổi lịch, phát sinh vướng mắc hoặc chưa thể có kết quả như đã hẹn, EVN phải chủ động thông báo trước, nêu rõ lý do, thời gian dự kiến và phương án tiếp theo.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Không hứa vượt thẩm quyền hoặc hứa theo cảm tính. Khi đã hẹn khảo sát, thi công,", "s": "label", "l": false}, {"t": "xử lý sự cố, cấp điện trở lại, kiểm tra công tơ, phản hồi khiếu nại hoặc cập nhật tiến độ, cần theo dõi để thực hiện đúng hẹn. Nếu không thể đúng hẹn, phải báo trước khi khách hàng phải tự hỏi hoặc chờ đợi trong bị động.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Tôi đã giữ đúng điều đã hẹn chưa; nếu chưa, khách hàng đã được báo trước, hiểu lý do và", "s": "label", "l": false}, {"t": "biết bước tiếp theo chưa?", "s": "p", "l": false}]}, {"num": "10", "title": "Các nguyên tắc về giao tiếp, ứng xử với khách hàng", "blocks": [{"t": "Trải nghiệm khách hàng được định hình rất mạnh bởi cách EVN giao tiếp với khách hàng trong những thời điểm họ cần hỗ trợ, đang lo lắng, chưa hiểu thông tin, gặp khó khăn hoặc đang bức xúc. Một lời giải thích đúng nhưng thiếu lắng nghe có thể làm khách hàng cảm thấy bị xem nhẹ; một quy định được áp dụng đúng nhưng thiếu hướng dẫn dễ hiểu có thể làm khách hàng cảm thấy bị làm khó. Vì vậy, văn hóa phục vụ của EVN cần được thể hiện qua ba yêu cầu nền tảng: lắng nghe và tôn trọng trước khi giải thích; cung cấp thông tin rõ ràng, trung thực, có căn cứ; phục vụ công bằng nhưng vẫn nhân văn, phù hợp với hoàn cảnh cụ thể của khách hàng.", "s": "p", "l": false}, {"t": "Nguyên tắc 4 Lắng nghe, tôn trọng và đồng cảm trước khi hướng dẫn, giải thích hoặc xử lý", "s": "nt", "l": false}, {"t": "Yêu cầu: Trước khi giải thích quy định, hướng dẫn thủ tục hoặc xử lý yêu cầu, CBCNV cần lắng nghe đầy", "s": "label", "l": false}, {"t": "đủ, tôn trọng cảm xúc và ghi nhận hoàn cảnh của khách hàng; không ngắt lời, không phủ nhận cảm xúc, không tranh luận hơn thua và không đổ lỗi khi khách hàng đang bức xúc.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Với các tình huống cảm xúc cao như mất điện, hóa đơn tăng bất thường, khiếu nại", "s": "label", "l": false}, {"t": "kéo dài, nhắc nợ, sự cố an toàn hoặc chậm tiến độ, cần ưu tiên trấn an, lắng nghe và ghi nhận trước khi đi vào giải thích. Cần điều chỉnh cách giao tiếp với người cao tuổi, người khuyết tật, khách hàng yếu thế, vùng sâu, vùng xa, hải đảo hoặc người chưa quen sử dụng kênh số.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Tôi đã làm khách hàng cảm thấy được lắng nghe và tôn trọng trước khi yêu cầu họ nghe giải", "s": "label", "l": false}, {"t": "thích hay chưa?", "s": "p", "l": false}, {"t": "Nguyên tắc 5 Thông tin phải rõ ràng, trung thực, dễ hiểu và có căn cứ", "s": "nt", "l": false}, {"t": "Yêu cầu: Thông tin cung cấp cho khách hàng phải đúng, đủ, dễ hiểu, nhất quán và có căn cứ về quy trình,", "s": "label", "l": false}, {"t": "chi phí, tiến độ, điều kiện, quyền lợi, nghĩa vụ, trách nhiệm của các bên và bước tiếp theo; không nói chung chung, không suy đoán, không hứa vượt thẩm quyền và không để khách hàng hiểu nhầm.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Cần dùng ngôn ngữ đời thường khi giải thích cho khách hàng, nhất là với nội dung kỹ", "s": "label", "l": false}, {"t": "thuật, hóa đơn, công tơ, hợp đồng, chi phí, ngừng giảm cung cấp điện hoặc xử lý sự cố. Khi chưa đủ căn cứ, phải nói rõ sẽ kiểm tra, hẹn thời điểm phản hồi và thực hiện đúng hẹn.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Thông tin tôi cung cấp có đúng, có căn cứ, dễ hiểu và đủ để khách hàng biết cần làm gì tiếp", "s": "label", "l": false}, {"t": "theo không?", "s": "p", "l": false}, {"t": "Nguyên tắc 6 Phục vụ công bằng, nhân văn và phù hợp với hoàn cảnh trong khuôn khổ quy định", "s": "nt", "l": false}, {"t": "Yêu cầu: Phục vụ khách hàng phải công bằng, không phân biệt đối xử, không thiên vị, không gây khó dễ;", "s": "label", "l": false}, {"t": "đồng thời cần hỗ trợ phù hợp với các rào cản cụ thể của khách hàng về tuổi tác, sức khỏe, khả năng tiếp cận kênh số, ngôn ngữ, địa bàn, điều kiện kinh tế hoặc hoàn cảnh đặc biệt, trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Cần áp dụng đúng quy định, nhưng không máy móc trong cách hướng dẫn. Với người", "s": "label", "l": false}, {"t": "cao tuổi, người khuyết tật, hộ nghèo, hộ cận nghèo, khách hàng vùng sâu, vùng xa, hải đảo hoặc người chưa có khả năng tự thao tác trên kênh số, cần hướng dẫn chậm hơn, rõ hơn, hỗ trợ nhiều hơn trong phạm vi cho phép.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Tôi đã phục vụ đúng quy định, không phân biệt đối xử và có hỗ trợ phù hợp với rào cản thực tế", "s": "label", "l": false}, {"t": "của khách hàng chưa?", "s": "p", "l": false}]}, {"num": "11", "title": "Các nguyên tắc về phối hợp phục vụ thống nhất trong EVN", "blocks": [{"t": "Khách hàng không nhìn EVN theo ranh giới phòng ban, đơn vị, cấp quản lý, hệ thống dữ liệu hay kênh phục vụ. Khách hàng chỉ cảm nhận một EVN qua toàn bộ hành trình của mình: từ lúc tìm hiểu thông tin, gửi yêu cầu, chờ xử lý, nhận kết quả, thanh toán, phản ánh, khiếu nại hoặc cần hỗ trợ sau cùng. Vì vậy, mọi phối hợp nội bộ phải được tổ chức theo nguyên tắc không để khách hàng phải gánh khó khăn của hệ thống. Khi yêu cầu liên quan nhiều bộ phận, EVN cần có một đầu mối rõ ràng, cập nhật chủ động, chuyển giao đầy đủ thông tin và theo dõi đến khi khách hàng nhận được kết quả hoặc phản hồi cuối cùng.", "s": "p", "l": false}, {"t": "Nguyên tắc 7 Khách hàng chỉ làm việc với một EVN thống nhất, không phải với các ranh giới nội bộ", "s": "nt", "l": false}, {"t": "Yêu cầu: Dù yêu cầu của khách hàng liên quan đến nhiều đơn vị, bộ phận, kênh phục vụ hoặc cấp xử lý, khách", "s": "label", "l": false}, {"t": "hàng vẫn phải được phục vụ như đang làm việc với một EVN thống nhất, liền mạch và có trách nhiệm; không được chuyển khó khăn phối hợp nội bộ thành khó khăn của khách hàng.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Khi chuyển kênh, chuyển bộ phận hoặc chuyển cấp xử lý, cần cập nhật đầy đủ lịch sử", "s": "label", "l": false}, {"t": "tương tác, nội dung đã trao đổi, hồ sơ đã có và việc cần làm tiếp.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Bộ phận tiếp theo có đủ thông tin để tiếp tục phục vụ mà không bắt khách hàng bắt đầu lại từ", "s": "label", "l": false}, {"t": "đầu chưa?", "s": "p", "l": false}, {"t": "Nguyên tắc 8 Không để khách hàng chờ trong im lặng; phải chủ động cập nhật và hỗ trợ kịp thời", "s": "nt", "l": false}, {"t": "Yêu cầu: Khi yêu cầu của khách hàng đang được xử lý, có thay đổi, phát sinh vướng mắc, trễ hẹn hoặc chưa", "s": "label", "l": false}, {"t": "thể có kết quả ngay, EVN phải chủ động cập nhật thông tin, nêu rõ tình trạng, lý do, thời gian dự kiến và phương án hỗ trợ; không để khách hàng phải hỏi nhiều lần mới biết việc của mình đang ở đâu.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Sau khi tiếp nhận yêu cầu, cần tóm tắt lại nội dung đã ghi nhận, bước tiếp theo, thời", "s": "label", "l": false}, {"t": "gian dự kiến và kênh liên hệ. Với mất điện, sự cố, cấp điện mới, phản ánh khiếu nại, kiểm định công tơ hoặc thay đổi hợp đồng, cần cập nhật tiến độ theo các mốc quan trọng.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Khách hàng có đang phải chờ trong im lặng không; họ đã biết việc của mình đang ở bước nào", "s": "label", "l": false}, {"t": "và khi nào có thông tin tiếp theo chưa?", "s": "p", "l": false}, {"t": "Nguyên tắc 9 Rõ một đầu mối, rõ trách nhiệm, phối hợp đến khi có kết quả cuối cùng", "s": "nt", "l": false}, {"t": "Yêu cầu: Khi yêu cầu của khách hàng liên quan đến nhiều bộ phận, phải xác định rõ một đầu mối theo dõi, rõ", "s": "label", "l": false}, {"t": "trách nhiệm xử lý, rõ mốc phản hồi và phối hợp nội bộ đến khi khách hàng nhận được kết quả hoặc phản hồi cuối cùng trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Không để yêu cầu “trôi” giữa các bộ phận, không chuyển khách hàng đi vòng quanh", "s": "label", "l": false}, {"t": "hệ thống, không yêu cầu khách hàng tự liên hệ nhiều đầu mối để thúc đẩy việc của mình. Đầu mối tiếp nhận hoặc được phân công phải theo dõi đến khi có kết quả cuối cùng.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Việc này đã có một đầu mối chịu trách nhiệm theo dõi đến cùng chưa, hay khách hàng vẫn", "s": "label", "l": false}, {"t": "phải tự đi tìm người xử lý?", "s": "p", "l": false}]}, {"num": "12", "title": "Các nguyên tắc về nền tảng số, dữ liệu, an toàn và cải tiến phục vụ", "blocks": [{"t": "Trải nghiệm khách hàng hiện đại của EVN không chỉ được tạo nên bởi thái độ phục vụ trực tiếp, mà còn phụ thuộc vào chất lượng kênh số, độ đúng và đồng bộ của dữ liệu, khả năng bảo vệ thông tin khách hàng, yêu cầu an toàn điện và năng lực cải tiến từ các điểm đau lặp lại. Kênh số phải giúp khách hàng dễ đi đến kết quả, chứ không làm họ mắc kẹt giữa thao tác. Dữ liệu phải giúp khách hàng không phải khai lại, trình bày lại hoặc bắt đầu lại từ đầu. Mọi phục vụ phải đặt an toàn lên trước hết, bảo mật như kỷ luật bắt buộc và coi phản ánh của khách hàng là nguồn học hỏi để nâng chất lượng phục vụ.", "s": "p", "l": false}, {"t": "Nguyên tắc 10 Kênh số phải dễ dùng, có người hỗ trợ và không bỏ lại khách hàng giữa chừng", "s": "nt", "l": false}, {"t": "Yêu cầu: Ứng dụng, website, tổng đài thông minh, chatbot và các nền tảng số phải giúp khách hàng dễ tìm", "s": "label", "l": false}, {"t": "thông tin, dễ thao tác, dễ gửi yêu cầu, dễ theo dõi tiến độ và dễ nhận hỗ trợ khi gặp vướng mắc; không để khách hàng bị mắc kẹt giữa quy trình số mà không có lối hỗ trợ phù hợp.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Khi khách hàng không thao tác được, gặp lỗi, không hiểu thông tin hoặc không phù", "s": "label", "l": false}, {"t": "hợp với kênh số, cần hướng dẫn kênh thay thế, kết nối nhân viên hỗ trợ hoặc ghi nhận lỗi để xử lý. Ở các điểm chạm có cảm xúc cao như mất điện, sự cố an toàn, khiếu nại, nhắc nợ hoặc hóa đơn bất thường, yếu tố con người cần được duy trì để đồng hành, không phó mặc khách hàng cho hệ thống.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Khách hàng có thể hoàn thành việc trên kênh số không; nếu không, họ đã có người hoặc kênh", "s": "label", "l": false}, {"t": "khác hỗ trợ để đi đến kết quả chưa?", "s": "p", "l": false}, {"t": "Nguyên tắc 11 Dữ liệu phải đúng, đồng bộ; thông tin EVN đã có thì không bắt khách hàng trình bày lại", "s": "nt", "l": false}, {"t": "Yêu cầu: Dữ liệu khách hàng, dữ liệu yêu cầu, lịch sử tương tác và tình trạng xử lý phải được cập nhật", "s": "label", "l": false}, {"t": "chính xác, thống nhất giữa các kênh, đơn vị và bộ phận; thông tin EVN đã có hoặc có thể tra cứu thì không được bắt khách hàng khai lại, nộp lại, trình bày lại hoặc bắt đầu lại từ đầu khi chuyển điểm chạm.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Tổng đài, ứng dụng, website, điện lực, phòng giao dịch và nhân viên hiện trường cần", "s": "label", "l": false}, {"t": "sử dụng cùng một nguồn thông tin cập nhật. Khi tiếp nhận chuyển giao, cần đọc lịch sử xử lý trước khi hỏi lại khách hàng.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Thông tin này EVN đã có chưa; nếu đã có, vì sao khách hàng vẫn phải nói lại hoặc nộp lại?", "s": "label", "l": false}, {"t": "Nguyên tắc 12 An toàn là trước hết, bảo mật là bắt buộc, điểm đau lặp lại phải được cải tiến", "s": "nt", "l": false}, {"t": "Yêu cầu: Mọi hoạt động phục vụ khách hàng phải đặt an toàn điện, an toàn khách hàng và an toàn người", "s": "label", "l": false}, {"t": "lao động lên trước hết; phải bảo mật thông tin khách hàng như một kỷ luật bắt buộc; đồng thời phải ghi nhận, phân tích và cải tiến các lỗi, phản ánh, khiếu nại hoặc điểm đau lặp lại để nâng chất lượng phục vụ.", "s": "p", "l": false}, {"t": "Thực hiện và tự kiểm: Không hướng dẫn khách hàng thao tác có nguy cơ mất an toàn. Không chia sẻ, sử", "s": "label", "l": false}, {"t": "dụng hoặc tiết lộ thông tin khách hàng sai mục đích. Với các lỗi hệ thống, sai lệch dữ liệu, phản ánh lặp lại, chậm xử lý hoặc điểm nghẽn quy trình, cần ghi nhận để báo cáo, khắc phục và phòng ngừa tái diễn.", "s": "p", "l": false}, {"t": "Câu tự kiểm: Tình huống này đã an toàn chưa, thông tin khách hàng đã được bảo vệ chưa, và nếu có điểm", "s": "label", "l": false}, {"t": "đau lặp lại thì đã được ghi nhận để cải tiến chưa?", "s": "p", "l": false}, {"t": "II C H Ư Ơ N G I I CHUẨN MỰC HÀNH VI ỨNG XỬ, TÁC PHONG VÀ HÌNH ẢNH TRONG KINH DOANH VÀ PHỤC VỤ KHÁCH HÀNG Chuẩn mực h ành vi · Tác phong · Hình ảnh trong phục vụ khách hàng “Sự chuyên nghiệp không nằm ở điều ta nói khi hài lòng, mà ở cách ta ứng xử khi khó khăn.”", "s": "p", "l": false}, {"t": "CHUẨN MỰC HÀNH VI CHUẨN MỰC HÀNH VI ỨNG XỬ, TÁC PHONG VÀ HÌNH ẢNH TRONG KINH DOANH VÀ PHỤC VỤ II KHÁCH HÀNG Chuẩn mực hành vi chung Năm chuẩn thái độ · Tác phong & hình ảnh nghề nghiệp NGƯỜI EVN Ứng xử kiến tạo trải nghiệm tích cực Hành vi · Tác phong 2 Tận tâm · Chữ tín · Đồng hành · Phối hợp đồng nghiệp & đối tác Hình ảnh Kênh gián tiếp & hành vi cần tránh Điện thoại · Kênh số · Mạng xã hội · Những hành vi cần tránh Từ tác phong cá nhân đến ứng xử trực tiếp và trên các kênh gián tiếp Tổng quan Chương II quy định các chuẩn mực hành vi chung mà mọi CBCNV EVN cần thực hiện trong công tác kinh doanh và dịch vụ khách hàng. Nếu Chương I xác lập nền tảng văn hóa, đạo đức nghề nghiệp, triết lý phục vụ, phương châm phục vụ và hệ nguyên tắc kiến tạo trải nghiệm khách hàng, thì Chương II là lớp chuyển hóa các nền tảng đó thành chuẩn mực ứng xử có thể quan sát, rèn luyện và thực hiện trong công việc hằng ngày.", "s": "p", "l": false}, {"t": "Chương I trả lời câu hỏi: “Người EVN phục vụ khách hàng dựa trên nền tảng nào?”, Chương II trả lời câu hỏi: “Người EVN cần thể hiện nền tảng đó ra sao qua thái độ, lời nói, tác phong, phối hợp, hình ảnh và cách sử dụng các kênh giao tiếp?”. Vì vậy, mọi chuẩn mực trong Chương II đều hướng đến một mục tiêu thống nhất: làm cho khách hàng được tôn trọng hơn, được hướng dẫn rõ hơn, được phục vụ thuận tiện hơn, được đồng hành có trách nhiệm hơn và có cảm nhận tích cực hơn về EVN trong từng điểm chạm.", "s": "p", "l": false}, {"t": "Chương này bao quát năm nhóm nội dung: chuẩn mực hành vi chung; ứng xử với khách hàng; ứng xử với đồng nghiệp, đơn vị nội bộ và đối tác; giao tiếp qua các kênh gián tiếp; và những hành vi không được phép.", "s": "p", "l": false}, {"t": "Các chuẩn mực này là cầu nối giữa các nguyên tắc ở Chương I với chuẩn hành vi chi tiết theo từng điểm chạm tại Chương III.", "s": "p", "l": false}, {"t": "MỤC I CHUẨN MỰC HÀNH VI CHUNG TRONG PHỤC VỤ KHÁCH HÀNG", "s": "p", "l": false}]}]}], "intro": "Chương I xác lập nền tảng văn hóa, đạo đức nghề nghiệp, triết lý phục vụ, phương châm phục vụ và hệ 12 nguyên tắc kiến tạo trải nghiệm khách hàng — trả lời câu hỏi: Người EVN phục vụ khách hàng dựa trên nền tảng nào?"}, {"num": "II", "title": "CHUẨN MỰC HÀNH VI ỨNG XỬ, TÁC PHONG VÀ HÌNH ẢNH TRONG KINH DOANH VÀ PHỤC VỤ KHÁCH HÀNG", "sections": [{"num": "I", "title": "CHUẨN MỰC HÀNH VI CHUNG TRONG PHỤC VỤ KHÁCH HÀNG", "articles": [{"num": "13", "title": "Năm chuẩn thái độ làm nên niềm tin của khách hàng", "blocks": [{"t": "Trong mỗi tương tác, khách hàng cảm nhận văn hóa EVN không qua khẩu hiệu mà qua thái độ cụ thể của người phục vụ. Năm chuẩn thái độ cũng chính là năm giá trị chuẩn mực hành vi ứng xử chung của EVN:", "s": "p", "l": false}, {"t": "Tôn trọng, Tận tâm, Chuyên nghiệp, Hợp tác, Nghĩa tình là cách người EVN đưa triết lý phục vụ vào từng lời nói, cử chỉ và phản hồi, để sau mỗi lần tiếp xúc khách hàng tin tưởng hơn vào EVN.", "s": "p", "l": false}, {"t": "1. Tôn trọng để khách hàng thấy mình được lắng nghe", "s": "h4", "l": false}, {"t": "Người EVN giao tiếp niềm nở, khiêm tốn, lễ phép; dùng ngôn ngữ hòa nhã, không nói tục, không cao giọng, không mỉa mai, không phán xét khách hàng. Tôn trọng không chỉ là phép lịch sự, mà là nền tảng để khách hàng cảm thấy được lắng nghe và đối xử công bằng.", "s": "p", "l": false}, {"t": "2. Tận tâm để khách hàng không phải tự xoay xở", "s": "h4", "l": false}, {"t": "Người EVN cởi mở, sẵn lòng hỗ trợ, lắng nghe đến hết ý, hướng dẫn rõ ràng, dễ hiểu; không làm qua loa, không để khách hàng tự loay hoay khi chưa hiểu việc cần làm. Tận tâm là biểu hiện cụ thể của tinh thần đồng hành đến cùng, trọn việc.", "s": "p", "l": false}, {"t": "3. Chuyên nghiệp để khách hàng yên tâm với thông tin nhận được", "s": "h4", "l": false}, {"t": "Người EVN giao tiếp đúng vai trò, đúng thông tin, đúng thẩm quyền, đúng quy định; trình bày ngắn gọn, mạch lạc; không suy đoán, không trả lời khi chưa kiểm tra dữ liệu hoặc chưa nắm chắc căn cứ. Chuyên nghiệp giúp khách hàng yên tâm vì thông tin nhận được rõ ràng, đáng tin cậy.", "s": "p", "l": false}, {"t": "4. Hợp tác để khách hàng được phục vụ liền mạch", "s": "h4", "l": false}, {"t": "Người EVN chủ động phối hợp với đồng nghiệp, bộ phận và đơn vị liên quan để xử lý yêu cầu của khách hàng; không chuyển lòng vòng, không để khách hàng phải trình bày lại nhiều lần, không biến ranh giới nội bộ thành khó khăn của khách hàng.", "s": "p", "l": false}, {"t": "5. Nghĩa tình để việc thực hiện quy định trở nên gần gũi", "s": "h4", "l": false}, {"t": "Người EVN quan tâm phù hợp với hoàn cảnh của khách hàng, nhất là người cao tuổi, người khuyết tật, khách hàng yếu thế, hộ nghèo, hộ cận nghèo, khách hàng vùng sâu, vùng xa, hải đảo hoặc khách hàng chưa quen sử dụng kênh số. Nghĩa tình không làm thay quy định, mà làm cho việc thực hiện quy định trở nên dễ hiểu, nhân văn và gần gũi hơn.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "Thay vì nói “Việc này không thuộc bộ phận tôi”, nên nói “Tôi sẽ kiểm tra hoặc chuyển đúng đầu mối phụ trách và thông tin lại cho anh/chị.”", "s": "p", "l": false}, {"t": "Thay vì nói “Anh/chị tự liên hệ bên kia”, nên nói “Tôi sẽ hướng dẫn anh/chị kênh liên hệ phù hợp hoặc chuyển thông tin để bộ phận phụ trách tiếp nhận.”", "s": "p", "l": false}, {"t": "Thay vì nói “Hệ thống lỗi, tôi không biết”, nên nói “Hiện hệ thống đang cần kiểm tra thêm; tôi sẽ ghi nhận và hướng dẫn anh/chị phương án thay thế trong thời gian chờ xử lý.”", "s": "p", "l": false}, {"t": "Thay vì nói “Quy định là vậy”, nên nói “Theo quy định hiện hành, trường hợp của anh/chị được xử lý theo hướng sau. Tôi xin giải thích cụ thể để anh/chị nắm rõ.”", "s": "p", "l": false}, {"t": "Gợi ý tự kiểm: Sau mỗi lần tương tác, khách hàng có cảm thấy được tôn trọng, được lắng nghe, được hướng", "s": "label", "l": false}, {"t": "dẫn rõ ràng và không bị bỏ mặc khi làm việc với EVN không?", "s": "p", "l": false}]}, {"num": "14", "title": "Tác phong và hình ảnh nghề nghiệp như một phần của trải nghiệm khách hàng", "blocks": [{"t": "Khách hàng đánh giá EVN không chỉ qua kết quả xử lý yêu cầu, mà còn qua cách người EVN xuất hiện, giao tiếp, thao tác, bảo đảm an toàn, bảo mật thông tin và giữ gìn hình ảnh tại nơi tiếp xúc. Mỗi hình ảnh chỉn chu, mỗi thao tác cẩn trọng, mỗi lời giải thích rõ ràng đều góp phần củng cố niềm tin của khách hàng.", "s": "p", "l": false}, {"t": "1. Đồng phục và nhận diện", "s": "h4", "l": false}, {"t": "Mặc đồng phục đúng quy định khi thực thi nhiệm vụ trực tiếp hoặc khi đại diện EVN tiếp xúc với khách hàng, đối tác, cộng đồng. Đồng phục không chỉ là trang phục làm việc, mà là biểu hiện của trách nhiệm đại diện cho hình ảnh EVN.", "s": "p", "l": false}, {"t": "2. Thẻ nhân viên và giới thiệu danh tính", "s": "h4", "l": false}, {"t": "Khi làm việc tại nơi tiếp xúc khách hàng hoặc hiện trường, đeo thẻ đầy đủ, đúng quy cách; giới thiệu rõ danh tính, đơn vị, mục đích và phạm vi công việc khi cần thiết, nhất là khi bước vào không gian riêng của khách hàng như nhà riêng, cơ sở sản xuất, kinh doanh,...", "s": "p", "l": false}, {"t": "3. Tác phong cá nhân", "s": "h4", "l": false}, {"t": "Trang phục sạch sẽ, chỉnh tề; thái độ nghiêm túc, chuẩn mực; không tùy tiện, thiếu chuyên nghiệp hoặc thiếu tôn trọng khách hàng. Người EVN tránh các biểu hiện dễ tạo ấn tượng không tốt như nói chuyện riêng, dùng điện thoại cá nhân không phục vụ công việc, tỏ thái độ sốt ruột hoặc thiếu tập trung khi khách hàng đang trình bày.", "s": "p", "l": false}, {"t": "4. Không gian tiếp xúc khách hàng", "s": "h4", "l": false}, {"t": "Môi trường và không gian tiếp đón khách hàng cần xanh - sạch - đẹp, đúng nhận diện thương hiệu; tài liệu, biểu mẫu, bảng hướng dẫn và khu vực chờ phải được sắp xếp gọn gàng, dễ nhìn, dễ tiếp cận. Khu vực phục vụ rõ ràng, thân thiện giúp khách hàng giảm bối rối và cảm nhận được sự chuyên nghiệp của EVN.", "s": "p", "l": false}, {"t": "5. Tác phong an toàn tại hiện trường", "s": "h4", "l": false}, {"t": "Khi làm việc tại hiện trường hoặc khu vực có yếu tố kỹ thuật điện, tuân thủ đầy đủ quy định an toàn, sử dụng trang bị bảo hộ phù hợp, cảnh báo nguy cơ cho khách hàng và không thực hiện thao tác có nguy cơ mất an toàn để rút ngắn thời gian.", "s": "p", "l": false}, {"t": "6. Bảo mật trong tác phong làm việc", "s": "h4", "l": false}, {"t": "Khi sử dụng hồ sơ, thiết bị di động, máy tính bảng, ứng dụng nghiệp vụ hoặc biểu mẫu điện tử trước mặt khách hàng, thao tác cẩn trọng, không để lộ thông tin cá nhân, hợp đồng, hóa đơn hoặc dữ liệu sử dụng điện của khách hàng khác.", "s": "p", "l": false}, {"t": "7. Khép lại công việc tại điểm chạm", "s": "h4", "l": false}, {"t": "Khi hoàn tất công việc tại quầy, qua điện thoại, trên kênh số hoặc tại hiện trường, thông tin lại kết quả, nội dung đã xử lý hoặc bước tiếp theo cho khách hàng. Không rời điểm chạm khi khách hàng vẫn chưa rõ việc của mình đã được xử lý đến đâu.", "s": "p", "l": false}, {"t": "Gợi ý tự kiểm: Hình ảnh cá nhân, không gian tiếp xúc, thao tác nghiệp vụ và tác phong hiện trường có tạo được", "s": "label", "l": false}, {"t": "cảm giác chuyên nghiệp, an toàn, đáng tin cậy và đúng hình ảnh EVN không?", "s": "p", "l": false}, {"t": "MỤC II ỨNG XỬ VỚI KHÁCH HÀNG ĐỂ KIẾN TẠO TRẢI NGHIỆM TÍCH CỰC", "s": "p", "l": false}]}]}, {"num": "II", "title": "ỨNG XỬ VỚI KHÁCH HÀNG ĐỂ KIẾN TẠO TRẢI NGHIỆM TÍCH CỰC", "articles": [{"num": "15", "title": "Phục vụ tận tâm để khách hàng yên tâm và tin cậy", "blocks": [{"t": "Trong mọi tiếp xúc, người EVN không chỉ tiếp nhận và xử lý yêu cầu theo quy trình, mà còn làm cho khách hàng hiểu rõ, yên tâm và cảm nhận được trách nhiệm phục vụ đến cùng. Đó là điều biến một giao dịch đúng quy trình thành một trải nghiệm đáng tin cậy.", "s": "p", "l": false}, {"t": "1. Tiếp nhận và xử lý không né tránh", "s": "h4", "l": false}, {"t": "Khi tiếp xúc với khách hàng tiếp nhận đúng mực, hướng dẫn rõ ràng, xử lý trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định, hoặc chuyển đúng đầu mối có thẩm quyền; không né tránh, không đùn đẩy, không để khách hàng tự xoay xở.", "s": "p", "l": false}, {"t": "2. Lắng nghe để thấu hiểu", "s": "h4", "l": false}, {"t": "Kiên nhẫn lắng nghe, thấu hiểu nhu cầu, cảm thông với khó khăn của khách hàng; không ngắt lời, không tranh luận hơn thua, không phủ nhận cảm xúc của khách hàng khi họ đang bức xúc hoặc lo lắng.", "s": "p", "l": false}, {"t": "3. Giải thích để khách hàng hiểu đúng", "s": "h4", "l": false}, {"t": "Các nội dung về hợp đồng, hóa đơn, chi phí, tiến độ, điều kiện cung cấp dịch vụ và quy định liên quan được giải thích trung thực, minh bạch, dễ hiểu, đúng pháp luật và đúng thẩm quyền.", "s": "p", "l": false}, {"t": "4. Hỗ trợ khách hàng yếu thế bằng sự kiên nhẫn", "s": "h4", "l": false}, {"t": "Với người cao tuổi, người khuyết tật, khách hàng yếu thế, hộ nghèo, hộ cận nghèo, khách hàng vùng sâu, vùng xa, hải đảo hoặc khách hàng chưa quen kênh số, hướng dẫn chậm rãi, từng bước, dùng ngôn ngữ dễ hiểu, xác nhận khách hàng đã hiểu và hỗ trợ kênh thay thế phù hợp trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "5. Theo việc đến khi khách hàng có kết quả", "s": "h4", "l": false}, {"t": "Khi yêu cầu của khách hàng cần nhiều bộ phận tham gia, chủ động tiếp nhận đầy đủ thông tin, chuyển đúng đầu mối, làm rõ bước tiếp theo và theo dõi đến khi khách hàng nhận được kết quả hoặc phản hồi rõ ràng trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Tôi đã ghi nhận nội dung anh/chị phản ánh. Tôi sẽ kiểm tra và thông tin lại theo đầu mối phù hợp.”", "s": "quote", "l": true}, {"t": "“Trường hợp này cần bộ phận chuyên môn xử lý; tôi sẽ chuyển đầy đủ thông tin để anh/chị không phải trình bày lại.”", "s": "quote", "l": true}, {"t": "“Để anh/chị yên tâm, tôi xin tóm tắt lại các bước tiếp theo như sau…”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Khách hàng có được tiếp nhận đầy đủ, hiểu rõ bước tiếp theo và biết ai hoặc đơn vị nào đang", "s": "label", "l": false}, {"t": "chịu trách nhiệm xử lý yêu cầu của mình không?", "s": "p", "l": false}]}, {"num": "16", "title": "Giữ chữ tín và chất lượng dịch vụ để nuôi dưỡng niềm tin", "blocks": [{"t": "Chất lượng phục vụ trong cảm nhận của khách hàng không chỉ nằm ở việc làm đúng nghiệp vụ, mà ở việc thông tin đúng, cam kết đúng, thực hiện đúng và giúp khách hàng thấy rõ ràng, thuận tiện, tin cậy trong suốt hành trình. Chữ tín được giữ qua từng việc nhỏ.", "s": "p", "l": false}, {"t": "1. Giữ đúng cam kết", "s": "h4", "l": false}, {"t": "Thực hiện đúng và đầy đủ cam kết về chất lượng, thời gian và nội dung đã thông tin với khách hàng trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "2. Không hứa vượt thẩm quyền", "s": "h4", "l": false}, {"t": "Chỉ cam kết những nội dung có căn cứ, thuộc thẩm quyền hoặc đã được xác nhận; không hứa thay cho bộ phận khác, không hứa thời gian hoặc kết quả khi chưa có cơ sở.", "s": "p", "l": false}, {"t": "3. Thông tin nhất quán giữa các kênh", "s": "h4", "l": false}, {"t": "Thông tin về hồ sơ, chi phí, tiến độ, nguyên nhân, kết quả xử lý phải nhất quán giữa các kênh và các bộ phận.", "s": "p", "l": false}, {"t": "Khi dữ liệu chưa rõ hoặc có dấu hiệu lệch, kiểm tra trước khi trả lời.", "s": "p", "l": false}, {"t": "4. Chủ động tạo trải nghiệm tích cực", "s": "h4", "l": false}, {"t": "Cần liên tục cải tiến cách phục vụ để rút ngắn thời gian, công sức, tiết kiệm chi phí, giảm số lần khách hàng phải hỏi lại và giúp khách hàng dễ tiếp cận dịch vụ hơn. Trải nghiệm tích cực được tạo nên từ những việc cụ thể: hướng dẫn dễ hiểu, cập nhật đúng lúc, hẹn đúng, phản hồi rõ và phối hợp liền mạch.", "s": "p", "l": false}, {"t": "5. Bảo mật thông tin khách hàng", "s": "h4", "l": false}, {"t": "Tôn trọng và bảo vệ thông tin cá nhân, hợp đồng, hóa đơn, lịch sử sử dụng điện, dữ liệu thanh toán và các dữ liệu liên quan; chỉ sử dụng thông tin khách hàng cho mục đích nghiệp vụ được phép.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Tôi sẽ kiểm tra căn cứ trước khi thông tin để bảo đảm nội dung trả lời chính xác.”", "s": "quote", "l": true}, {"t": "“Hiện tôi chưa đủ cơ sở để cam kết thời gian cụ thể; tôi sẽ ghi nhận và phản hồi lại anh/chị ngay khi có thông tin xác nhận.”", "s": "quote", "l": true}, {"t": "“Thông tin của anh/chị sẽ được bảo mật và chỉ sử dụng để xử lý yêu cầu này theo quy định.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Những điều đã thông tin hoặc cam kết với khách hàng có đúng căn cứ, đúng thẩm quyền, đúng", "s": "label", "l": false}, {"t": "quy định và có thể thực hiện được không?", "s": "p", "l": false}]}, {"num": "17", "title": "Đồng hành cùng khách hàng trong các tình huống khó khăn", "blocks": [{"t": "Tình huống khó khăn là lúc văn hóa phục vụ của EVN được khách hàng cảm nhận rõ nhất. Khi khách hàng bức xúc, lo lắng, phản ánh gay gắt hoặc gặp sự cố ảnh hưởng lớn đến sinh hoạt, sản xuất, kinh doanh, người EVN càng cần giữ bình tĩnh, lắng nghe, giải thích rõ và đồng hành có trách nhiệm.", "s": "p", "l": false}, {"t": "1. Bình tĩnh và hòa nhã", "s": "h4", "l": false}, {"t": "Giữ thái độ tự chủ trong mọi tình huống, kể cả khi khách hàng nóng nảy, bức xúc hoặc phản ứng gay gắt;", "s": "p", "l": false}, {"t": "không cao giọng, không đôi co, không tranh luận hơn thua.", "s": "p", "l": false}, {"t": "2. Lắng nghe và ghi nhận cảm xúc", "s": "h4", "l": false}, {"t": "Để khách hàng trình bày đầy đủ; ghi nhận sự bất tiện, lo lắng hoặc bức xúc của khách hàng trước khi giải thích nguyên nhân hay quy định.", "s": "p", "l": false}, {"t": "3. Chủ động xin lỗi khi phù hợp", "s": "h4", "l": false}, {"t": "Xin lỗi chân thành khi có sơ suất, chậm trễ, thông tin chưa rõ, hệ thống lỗi hoặc tình huống gây bất tiện;", "s": "p", "l": false}, {"t": "không xin lỗi hình thức, không đổ lỗi cho khách hàng, đồng nghiệp, hệ thống hoặc đơn vị khác.", "s": "p", "l": false}, {"t": "4. Kiểm tra trước khi kết luận", "s": "h4", "l": false}, {"t": "Tra cứu dữ liệu, xác minh thông tin hoặc liên hệ đầu mối chuyên môn trước khi kết luận; không suy đoán, không trả lời chung chung, không phủ nhận phản ánh khi chưa kiểm tra.", "s": "p", "l": false}, {"t": "5. Đưa hướng xử lý rõ ràng", "s": "h4", "l": false}, {"t": "Chủ động chọn phương án phù hợp nhất trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định; nếu chưa thể xử lý ngay, thông tin rõ lý do, bước tiếp theo, thời gian dự kiến và đầu mối theo dõi.", "s": "p", "l": false}, {"t": "6. Chủ động cập nhật tiến độ", "s": "h4", "l": false}, {"t": "Với tình huống kéo dài hoặc cần phối hợp nhiều bộ phận, cập nhật tiến độ ở các mốc phù hợp; không để khách hàng phải hỏi nhiều lần mới biết tình trạng xử lý.", "s": "p", "l": false}, {"t": "7. Quan tâm nhóm dễ bị tổn thương", "s": "h4", "l": false}, {"t": "Với khách hàng yếu thế, người cao tuổi, người khuyết tật, khách hàng vùng sâu, vùng xa, hải đảo hoặc khách hàng bị ảnh hưởng lớn do sự cố điện, ưu tiên thái độ trấn an, hướng dẫn rõ ràng, hỗ trợ phù hợp và chuyển đúng đầu mối theo quy định.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Tôi rất chia sẻ với sự bất tiện anh/chị đang gặp phải.”", "s": "quote", "l": true}, {"t": "“Tôi xin phép kiểm tra lại thông tin trước khi trả lời để tránh sai sót.”", "s": "quote", "l": true}, {"t": "“Hiện hướng xử lý phù hợp là… Thời gian dự kiến hoặc bước tiếp theo là…”", "s": "quote", "l": true}, {"t": "“Tôi sẽ ghi nhận và chuyển đúng đầu mối; anh/chị không cần trình bày lại từ đầu.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Sau tình huống khó, khách hàng có được lắng nghe, được giải thích rõ, biết hướng xử lý tiếp theo", "s": "label", "l": false}, {"t": "và cảm thấy EVN có trách nhiệm với vấn đề của mình không?", "s": "p", "l": false}, {"t": "MỤC III PHỐI HỢP NỘI BỘ VÀ VỚI ĐỐI TÁC ĐỂ KHÁCH HÀNG ĐƯỢC PHỤC VỤ LIỀN MẠCH Mục này không quy định quan hệ ứng xử nội bộ nói chung, mà chỉ điều chỉnh sự phối hợp giữa các cá nhân, đơn vị và đối tác ở phần có ảnh hưởng trực tiếp đến trải nghiệm khách hàng - để dù nhiều bộ phận cùng tham gia, khách hàng vẫn cảm nhận một EVN thống nhất, liền mạch và có trách nhiệm.", "s": "p", "l": false}]}]}, {"num": "III", "title": "PHỐI HỢP NỘI BỘ VÀ VỚI ĐỐI TÁC ĐỂ KHÁCH HÀNG ĐƯỢC PHỤC VỤ LIỀN MẠCH", "articles": [{"num": "18", "title": "Phối hợp với đồng nghiệp để khách hàng không bị gián đoạn", "blocks": [{"t": "Trải nghiệm khách hàng không chỉ do người trực tiếp gặp khách hàng tạo ra, mà còn do sự phối hợp của nhiều cá nhân phía sau. Khi phối hợp rời rạc, khách hàng là người gánh hậu quả: phải trình bày lại, chờ đợi hoặc bị đẩy qua lại. Vì vậy, mọi sự phối hợp giữa đồng nghiệp trong công tác kinh doanh và dịch vụ khách hàng đều phải hướng đến một kết quả: khách hàng được phục vụ liền mạch như đang làm việc với một EVN duy nhất.", "s": "p", "l": false}, {"t": "1. Hợp tác vì kết quả của khách hàng", "s": "h4", "l": false}, {"t": "Tôn trọng, hỗ trợ lẫn nhau với mục tiêu cuối cùng là khách hàng nhận được kết quả, không để ranh giới giữa các cá nhân trở thành khó khăn của khách hàng.", "s": "p", "l": false}, {"t": "2. Chia sẻ thông tin để khách hàng không phải nhắc lại", "s": "h4", "l": false}, {"t": "Chủ động chuyển cho đồng nghiệp những thông tin cần thiết về yêu cầu của khách hàng; không giữ thông tin khiến người tiếp theo phải hỏi lại khách hàng từ đầu.", "s": "p", "l": false}, {"t": "3. Góp ý kín, giữ hình ảnh chung trước khách hàng", "s": "h4", "l": false}, {"t": "Trao đổi thẳng thắn, thiện chí về công việc trong nội bộ; tuyệt đối không chỉ trích cá nhân, bộ phận khác trước mặt khách hàng, vì điều đó làm khách hàng mất niềm tin vào cả EVN.", "s": "p", "l": false}, {"t": "4. Lo kết quả cho khách hàng trước, rà soát nội bộ sau", "s": "h4", "l": false}, {"t": "Khi phát sinh sai sót, ưu tiên phối hợp để khách hàng có kết quả trước; việc xác định nguyên nhân và trách nhiệm nội bộ tiến hành sau theo quy định, không để khách hàng phải chờ trong khi nội bộ phân định đúng sai.", "s": "p", "l": false}, {"t": "5. Không cam kết thay phần việc chưa nắm chắc.", "s": "h4", "l": false}, {"t": "Không cam kết thay phần việc chưa nắm chắc. Không hứa thay đồng nghiệp hoặc bộ phận khác khi chưa có xác nhận, để tránh đưa cho khách hàng thông tin sai và làm gãy niềm tin ở bước sau.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Tôi đã ghi nhận đầy đủ thông tin rồi, nhờ anh/chị/em tiếp nhận giúp để khách hàng không phải trình bày lại nhé.”", "s": "quote", "l": true}, {"t": "“Phần này thuộc chuyên môn của anh/chị/em, tôi chuyển kèm tóm tắt; có gì cần thêm anh/chị/em báo để tôi hỗ trợ.”", "s": "quote", "l": true}, {"t": "“Trường hợp này tôi cùng phối hợp xử lý để khách có kết quả trước, việc rà soát nội bộ tính sau nhé.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Việc phối hợp vừa rồi có giúp khách hàng được phục vụ liền mạch hơn, không phải trình bày lại", "s": "label", "l": false}, {"t": "và không bị ảnh hưởng bởi ranh giới nội bộ không?", "s": "p", "l": false}]}, {"num": "19", "title": "Phối hợp giữa các đơn vị để khách hàng nhận một câu trả lời thống nhất", "blocks": [{"t": "Trong cảm nhận của khách hàng, EVN là một chỉnh thể duy nhất. Khách hàng không có trách nhiệm phải hiểu ranh giới giữa các phòng ban, đơn vị, tổng đài, kênh số hay đội hiện trường. Mọi sự phối hợp giữa các đơn vị, vì thế, phải bảo đảm khách hàng nhận được một câu trả lời nhất quán và không bị bỏ rơi giữa các khâu.", "s": "p", "l": false}, {"t": "1. Một EVN trong mắt khách hàng", "s": "h4", "l": false}, {"t": "Các đơn vị phối hợp liền mạch, không để khách hàng gánh hậu quả của việc thiếu phối hợp nội bộ.", "s": "p", "l": false}, {"t": "2. Bàn giao đầy đủ để khách hàng không kể lại từ đầu", "s": "h4", "l": false}, {"t": "Chuyển giao công việc kèm đủ thông tin để bộ phận sau phục vụ tiếp được, hạn chế tối đa việc khách hàng phải trình bày lại cùng một nội dung cho nhiều đầu mối.", "s": "p", "l": false}, {"t": "3. Thông tin tối thiểu khi chuyển tiếp", "s": "h4", "l": false}, {"t": "Mọi yêu cầu chuyển tiếp cần kèm: mã khách hàng hoặc mã hồ sơ (nếu có), nội dung đã tiếp nhận, trạng thái xử lý, thông tin đã cam kết hoặc đã thông báo với khách hàng, đầu mối phụ trách và bước tiếp theo.", "s": "p", "l": false}, {"t": "4. Dữ liệu thống nhất", "s": "h4", "l": false}, {"t": "Các đơn vị cập nhật thông tin kịp thời, đúng trạng thái trên hệ thống; không để tổng đài, điện lực, kênh số và nhân viên hiện trường trả lời khác nhau do dữ liệu lệch.", "s": "p", "l": false}, {"t": "5. Cùng giải quyết trước, phân định sau", "s": "h4", "l": false}, {"t": "Khi có sự cố liên đơn vị, cùng tìm cách giải quyết cho khách hàng trước, quy trách nhiệm sau; tuyệt đối không đổ lỗi cho đơn vị khác trước mặt khách hàng.", "s": "p", "l": false}, {"t": "6. Một đầu mối theo việc đến cùng", "s": "h4", "l": false}, {"t": "Với những việc cần phối hợp nhiều đơn vị, phải xác định đầu mối chịu trách nhiệm theo dõi hoặc thông tin lại cho khách hàng trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Đơn vị tôi đã hoàn tất phần kinh doanh, chuyển sang kỹ thuật kèm đầy đủ hồ sơ để khách không phải chờ.”", "s": "quote", "l": true}, {"t": "“Để khách hàng được phục vụ liền mạch, hai bên thống nhất đầu mối theo dõi đến khi có kết quả cuối cùng.”", "s": "quote", "l": true}, {"t": "“Tôi cập nhật trạng thái lên hệ thống rồi, các đơn vị liên quan nắm chung một thông tin nhé.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Khách hàng có nhận được một câu trả lời thống nhất từ EVN, thay vì nhiều câu trả lời khác nhau từ", "s": "label", "l": false}, {"t": "các bộ phận khác nhau không?", "s": "p", "l": false}]}, {"num": "20", "title": "Quản lý đối tác như một phần hình ảnh EVN trước khách hàng", "blocks": [{"t": "Đối tác, nhà thầu, đơn vị cung cấp dịch vụ hoặc tổ chức trung gian khi tham gia hành trình phục vụ đều ảnh hưởng đến cảm nhận của khách hàng về EVN — bởi với khách hàng, họ chính là EVN tại điểm chạm đó. Vì vậy, quản lý đối tác không chỉ là quản lý hợp đồng, mà là quản lý trải nghiệm khách hàng và uy tín EVN.", "s": "p", "l": false}, {"t": "1. Chuyên nghiệp và thiện chí", "s": "h4", "l": false}, {"t": "Ứng xử với nhà thầu, đối tác và các bên liên quan trên tinh thần trách nhiệm, thiện chí, công bằng và tin tưởng lẫn nhau, làm nền cho việc phục vụ khách hàng thông suốt.", "s": "p", "l": false}, {"t": "2. Công bằng, minh bạch", "s": "h4", "l": false}, {"t": "Bảo đảm công bằng, minh bạch trong giao dịch; không trục lợi, không gây khó, không ưu ái trái quy định.", "s": "p", "l": false}, {"t": "3. Đối tác giữ chuẩn mực EVN khi tiếp xúc khách hàng", "s": "h4", "l": false}, {"t": "Yêu cầu đối tác tuân thủ chuẩn mực ứng xử của EVN khi tiếp xúc khách hàng, vì khách hàng nhìn họ như đại diện của EVN.", "s": "p", "l": false}, {"t": "4. Phổ biến chuẩn mực trước khi đối tác ra điểm chạm", "s": "h4", "l": false}, {"t": "Khi đối tác thay mặt EVN tiếp xúc khách hàng, đơn vị quản lý phải phổ biến trước chuẩn mực ứng xử, yêu cầu về an toàn, bảo mật thông tin và cơ chế tiếp nhận khiếu nại, phản ánh.", "s": "p", "l": false}, {"t": "5. Không chuyển rủi ro cho khách hàng", "s": "h4", "l": false}, {"t": "Khi phát sinh vướng mắc giữa EVN và đối tác, các bên phối hợp xử lý trên tinh thần bảo vệ quyền lợi khách hàng; không để khách hàng phải tự đi lại, tự liên hệ nhiều nơi hoặc gánh hậu quả do phối hợp chưa tốt.", "s": "p", "l": false}, {"t": "6. Bảo mật và an toàn", "s": "h4", "l": false}, {"t": "Đối tác tiếp cận dữ liệu, hồ sơ, hệ thống, hiện trường hoặc thông tin khách hàng phải tuân thủ yêu cầu bảo mật, an toàn điện, an toàn thông tin và các quy định liên quan.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Khi tiếp xúc với khách hàng, đề nghị đối tác giữ đúng tác phong và chuẩn mực như người EVN.”", "s": "quote", "l": true}, {"t": "“Anh/chị thực hiện đúng cam kết tiến độ và an toàn; mọi vướng mắc với khách hàng vui lòng phối hợp với EVN để xử lý.”", "s": "quote", "l": true}, {"t": "“Hình ảnh của đối tác tại hiện trường cũng là hình ảnh của EVN, mong anh/chị cùng giữ gìn.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Đối tác khi tiếp xúc khách hàng có thể hiện chuẩn mực, an toàn, minh bạch và bảo vệ uy tín EVN", "s": "label", "l": false}, {"t": "như một phần của trải nghiệm khách hàng không?", "s": "p", "l": false}, {"t": "KHÁCH HÀNG 29 MỤC IV GIỮ TRỌN TRẢI NGHIỆM KHÁCH HÀNG QUA CÁC KÊNH GIAO TIẾP GIÁN TIẾP", "s": "p", "l": false}]}]}, {"num": "IV", "title": "GIỮ TRỌN TRẢI NGHIỆM KHÁCH HÀNG QUA CÁC KÊNH GIAO TIẾP GIÁN TIẾP", "articles": [{"num": "21", "title": "Giao tiếp qua điện thoại", "blocks": [{"t": "Qua điện thoại, khách hàng không nhìn thấy người phục vụ nhưng cảm nhận rất rõ EVN có tôn trọng, có lắng nghe và có trách nhiệm với mình hay không, chỉ qua giọng nói và cách phản hồi. Vì vậy mỗi cuộc gọi là một điểm chạm có thể củng cố hoặc làm sứt mẻ niềm tin của khách hàng, dù nội dung công việc lớn hay nhỏ.", "s": "p", "l": false}, {"t": "1. Mở đầu để khách hàng biết ai đang phục vụ họ", "s": "h4", "l": false}, {"t": "Chào hỏi, xưng tên, chức danh hoặc bộ phận ngay khi bắt đầu cuộc gọi, với giọng rõ ràng, thân thiện, tốc độ phù hợp, để khách hàng yên tâm đã gọi đúng nơi.", "s": "p", "l": false}, {"t": "2. Lắng nghe để khách hàng thấy được tôn trọng", "s": "h4", "l": false}, {"t": "Không ngắt lời, không vừa nghe vừa làm việc riêng gây gián đoạn, không để khách hàng chờ trên máy lâu mà không giải thích.", "s": "p", "l": false}, {"t": "3. Trao đổi để khách hàng hiểu, không chỉ để trả lời", "s": "h4", "l": false}, {"t": "Nói chuyện từ tốn, ngắn gọn, rõ ràng, dùng ngôn ngữ đời thường, hạn chế thuật ngữ kỹ thuật và xác nhận khách hàng đã nắm được thông tin chính.", "s": "p", "l": false}, {"t": "4. Khi cần tra cứu, không để khách hàng chờ trong im lặng", "s": "h4", "l": false}, {"t": "Thông báo rõ với khách hàng rằng cần kiểm tra dữ liệu; không để máy im lặng kéo dài; nếu cần thời gian xử lý, hẹn lại theo thời điểm phù hợp.", "s": "p", "l": false}, {"t": "5. Khi chuyển cuộc gọi, không bắt khách hàng kể lại từ đầu", "s": "h4", "l": false}, {"t": "Tóm tắt nội dung đã tiếp nhận, chuyển đúng đầu mối và hạn chế tối đa việc khách hàng phải trình bày lại.", "s": "p", "l": false}, {"t": "6. Kết thúc để khách hàng biết bước tiếp theo", "s": "h4", "l": false}, {"t": "Cảm ơn và chào trước khi gác máy, tóm tắt bước tiếp theo, thời gian dự kiến hoặc kênh liên hệ tiếp theo nếu cần.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Tôi xin phép kiểm tra thông tin trong ít phút.”", "s": "quote", "l": true}, {"t": "“Tôi xin tóm tắt lại nội dung anh/chị vừa trao đổi để bảo đảm ghi nhận đúng.”", "s": "quote", "l": true}, {"t": "“Tôi sẽ chuyển thông tin này đến bộ phận phụ trách kèm nội dung đã tiếp nhận để anh/chị không phải trình bày lại.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Sau cuộc gọi, khách hàng có cảm thấy được lắng nghe, hiểu rõ thông tin chính và biết bước tiếp", "s": "label", "l": false}, {"t": "theo cần làm hoặc chờ EVN xử lý không?", "s": "p", "l": false}]}, {"num": "22", "title": "Phục vụ khách hàng trên kênh số", "blocks": [{"t": "Kênh số là một phần của trải nghiệm khách hàng tổng thể. Ứng xử trên kênh số không chỉ là thao tác kỹ thuật, mà là cách EVN làm cho khách hàng tiếp cận dịch vụ thuận tiện hơn, theo dõi thông tin dễ hơn, được hỗ trợ kịp thời hơn và không bị bỏ lại phía sau trong quá trình chuyển đổi số.", "s": "p", "l": false}, {"t": "1. Phạm vi kênh số", "s": "h4", "l": false}, {"t": "Kênh số gồm ứng dụng chăm sóc khách hàng, website, email, chatbot, tin nhắn, Zalo và các kênh điện tử khác mà EVN dùng để tiếp nhận, tra cứu, phản hồi và hỗ trợ khách hàng.", "s": "p", "l": false}, {"t": "2. Phản hồi để khách hàng không chờ trong vô định", "s": "h4", "l": false}, {"t": "Trả lời yêu cầu qua kênh số trong thời gian cam kết, không để khách hàng chờ mà không biết trạng thái tiếp nhận hoặc bước xử lý tiếp theo.", "s": "p", "l": false}, {"t": "3. Đồng hành khi khách hàng gặp vướng", "s": "h4", "l": false}, {"t": "Khi kênh số lỗi, khách hàng thao tác không thành công hoặc chưa quen sử dụng, chủ động hướng dẫn cách thay thế, hỗ trợ từng bước hoặc ghi nhận lỗi cho bộ phận kỹ thuật.", "s": "p", "l": false}, {"t": "4. Không đẩy lỗi hệ thống sang khách hàng", "s": "h4", "l": false}, {"t": "Nếu lỗi phát sinh từ hệ thống, dữ liệu hoặc quy trình của EVN, không yêu cầu khách hàng tự xử lý hay tự liên hệ nhiều nơi, mà hướng dẫn phương án thay thế phù hợp trong phạm vi trách nhiệm, thẩm quyền và theo đúng quy định.", "s": "p", "l": false}, {"t": "5. Dữ liệu nhất quán để khách hàng không nhận hai câu trả lời", "s": "h4", "l": false}, {"t": "Bảo đảm thông tin trên kênh số thống nhất với tổng đài, phòng giao dịch, đơn vị điện lực và nhân viên hiện trường; khi phát hiện dữ liệu lệch thì kiểm tra, cập nhật hoặc chuyển đúng đầu mối xử lý.", "s": "p", "l": false}, {"t": "6. Không kết luận vội khi dữ liệu chưa rõ", "s": "h4", "l": false}, {"t": "Khi hệ thống chưa cập nhật, dữ liệu chưa đồng bộ hoặc thông tin có dấu hiệu bất thường, không vội kết luận với khách hàng mà kiểm tra lại và hẹn phản hồi rõ ràng.", "s": "p", "l": false}, {"t": "7. Hướng dẫn để khách hàng tự làm được", "s": "h4", "l": false}, {"t": "Nội dung hướng dẫn trên kênh số cần ngắn gọn, rõ từng bước, dễ hiểu, hạn chế thuật ngữ kỹ thuật, ưu tiên cách trình bày giúp khách hàng biết mình cần làm gì tiếp theo.", "s": "p", "l": false}, {"t": "8. Bảo mật dữ liệu của khách hàng", "s": "h4", "l": false}, {"t": "Không chụp, gửi, chia sẻ hoặc hiển thị trái quy định thông tin cá nhân, hợp đồng, hóa đơn, dữ liệu sử dụng điện, dữ liệu thanh toán; chỉ dùng dữ liệu khách hàng cho mục đích nghiệp vụ được phép.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“Anh/chị có thể thực hiện theo các bước sau…”", "s": "quote", "l": true}, {"t": "“Nếu thao tác trên ứng dụng chưa thành công, anh/chị có thể sử dụng kênh thay thế là…”", "s": "quote", "l": true}, {"t": "“Thông tin trên hệ thống đang cần kiểm tra thêm; chúng tôi sẽ phản hồi lại anh/chị theo đầu mối phù hợp.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Khách hàng có hoàn thành được việc cần làm trên kênh số, hoặc nhận được hướng dẫn và kênh", "s": "label", "l": false}, {"t": "thay thế phù hợp khi gặp vướng mắc không?", "s": "p", "l": false}]}, {"num": "23", "title": "Ứng xử trên mạng xã hội và truyền thông", "blocks": [{"t": "Trên mạng xã hội và các kênh truyền thông, hình ảnh EVN trong mắt khách hàng có thể được củng cố hoặc bị ảnh hưởng rất nhanh, và một phản ứng thiếu cân nhắc có thể làm tổn thương niềm tin của nhiều khách hàng cùng lúc. Vì vậy mỗi CBCNV cần tham gia không gian này với ý thức bảo vệ trải nghiệm và niềm tin của khách hàng, đúng thẩm quyền, đúng chuẩn mực và bảo mật thông tin.", "s": "p", "l": false}, {"t": "1. Phát ngôn đúng thẩm quyền", "s": "h4", "l": false}, {"t": "Không tự ý phát ngôn thay EVN, đơn vị hoặc bộ phận chuyên môn khi chưa được phân công hoặc ủy quyền.", "s": "p", "l": false}, {"t": "2. Phát ngôn lành mạnh", "s": "h4", "l": false}, {"t": "Phát ngôn phù hợp với giá trị đạo đức, văn hóa dân tộc và văn hóa EVN, không dùng ngôn ngữ kích động, mỉa mai, xúc phạm hoặc gây chia rẽ.", "s": "p", "l": false}, {"t": "3. Bảo vệ hình ảnh EVN", "s": "h4", "l": false}, {"t": "Không đăng tải, chia sẻ hoặc bình luận nội dung có thể ảnh hưởng tiêu cực đến uy tín EVN, đến khách hàng, đồng nghiệp, đối tác hoặc cơ quan quản lý.", "s": "p", "l": false}, {"t": "4. Bảo mật dữ liệu khách hàng", "s": "h4", "l": false}, {"t": "Không đăng tải, chia sẻ hình ảnh, hồ sơ, hóa đơn, hợp đồng, mã khách hàng, số điện thoại, địa chỉ, dữ liệu sử dụng điện hoặc bất kỳ thông tin cá nhân nào của khách hàng khi chưa được phép và không có căn cứ nghiệp vụ hợp lệ.", "s": "p", "l": false}, {"t": "5. Bảo mật hình ảnh hiện trường và thông tin vận hành", "s": "h4", "l": false}, {"t": "Không tự ý chia sẻ hình ảnh hiện trường, sự cố điện, thông tin vận hành, hồ sơ kỹ thuật, dữ liệu hệ thống hoặc nội dung nội bộ có thể ảnh hưởng đến an toàn, bảo mật, uy tín EVN hoặc quyền lợi khách hàng.", "s": "p", "l": false}, {"t": "6. Không tranh luận cảm tính với khách hàng", "s": "h4", "l": false}, {"t": "Không dùng tài khoản cá nhân để đôi co, công kích, phủ nhận cảm xúc hoặc phản ứng gay gắt với khách hàng. Khi thấy phản ánh của khách hàng, chuyển thông tin đến đầu mối có thẩm quyền để xử lý, vì một phản ứng nóng vội có thể làm hỏng niềm tin của nhiều người cùng theo dõi.", "s": "p", "l": false}, {"t": "7. Xử lý thông tin sai lệch đúng đầu mối", "s": "h4", "l": false}, {"t": "Khi phát hiện thông tin sai lệch, tin giả, phản ánh tiêu cực hoặc nội dung có nguy cơ ảnh hưởng đến EVN, không tự ý phát ngôn hay phản bác nếu không có thẩm quyền, mà báo cáo hoặc chuyển cho đầu mối truyền thông, chăm sóc khách hàng hoặc đơn vị có trách nhiệm.", "s": "p", "l": false}, {"t": "8. Trách nhiệm cá nhân", "s": "h4", "l": false}, {"t": "Chịu trách nhiệm về nội dung mình đăng tải, chia sẻ, bình luận trên mạng xã hội; việc dùng tài khoản cá nhân không làm giảm trách nhiệm tuân thủ văn hóa, đạo đức nghề nghiệp và quy định của EVN.", "s": "p", "l": false}, {"t": "Chuẩn ngôn ngữ khuyến nghị:", "s": "label", "l": false}, {"t": "“EVN/đơn vị đã ghi nhận phản ánh của quý khách và sẽ chuyển đến đầu mối phụ trách để kiểm tra.”", "s": "quote", "l": true}, {"t": "“Để bảo mật thông tin cá nhân, đề nghị quý khách cung cấp thông tin qua kênh chính thức…”", "s": "quote", "l": true}, {"t": "“Nội dung này cần được xác minh bởi bộ phận có thẩm quyền; chúng tôi sẽ phản hồi theo quy định.”", "s": "quote", "l": true}, {"t": "Gợi ý tự kiểm: Nội dung đăng tải, chia sẻ hoặc phản hồi trên mạng xã hội có đúng thẩm quyền, không làm lộ", "s": "label", "l": false}, {"t": "dữ liệu, không ảnh hưởng hình ảnh EVN và không
