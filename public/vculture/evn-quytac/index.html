ử phù hợp tại Bộ Quy tắc này, theo yêu cầu của đơn vị quản lý.", "s": "p", "l": false}, {"t": "4. Bộ Quy tắc được thực hiện đồng thời với pháp luật hiện hành, quy trình kinh doanh điện năng, quy định về chăm sóc khách hàng và các quy định nội bộ có liên quan. Trường hợp có nội dung chưa được quy định cụ thể, việc ứng xử thực hiện theo các nguyên tắc phục vụ và kiến tạo trải nghiệm khách hàng nêu tại Chương I.", "s": "p", "l": false}]}, {"num": "47", "title": "Trách nhiệm của các Tổng công ty Điện lực", "blocks": [{"t": "1. Tổ chức phổ biến, quán triệt Bộ Quy tắc đến toàn thể CBCNV thuộc phạm vi quản lý; đưa nội dung Bộ Quy tắc vào chương trình đào tạo, bồi dưỡng, tập huấn và sinh hoạt chuyên môn định kỳ.", "s": "p", "l": false}, {"t": "2. Cụ thể hóa Bộ Quy tắc vào đặc thù địa bàn và mô hình tổ chức của đơn vị; chỉ đạo các công ty Điện lực, đơn vị trực thuộc triển khai thống nhất, gắn với Phụ lục Bản đồ Hành trình và Sổ tình huống ứng xử kèm theo.", "s": "p", "l": false}, {"t": "3. Tổ chức kiểm tra, giám sát việc thực hiện trong phạm vi quản lý; tổng hợp khó khăn, vướng mắc và đề xuất điều chỉnh về đầu mối do Tập đoàn giao.", "s": "p", "l": false}, {"t": "4. Bố trí nguồn lực, điều kiện làm việc và công cụ hỗ trợ để cán bộ, công nhân viên thực hiện được các chuẩn mực phục vụ khách hàng.", "s": "p", "l": false}]}, {"num": "48", "title": "Trách nhiệm của Công ty Điện lực và đơn vị trực tiếp phục vụ khách hàng", "blocks": [{"t": "1. Triển khai Bộ Quy tắc đến từng bộ phận, từng vị trí công việc có ảnh hưởng đến trải nghiệm khách hàng; bảo đảm mỗi CBCNV hiểu đúng và thực hiện thống nhất.", "s": "p", "l": false}, {"t": "2. Theo dõi, nhắc nhở và hỗ trợ cán bộ, công nhân viên trong quá trình thực hiện; kịp thời chấn chỉnh các biểu hiện chưa phù hợp với chuẩn mực.", "s": "p", "l": false}, {"t": "3. Ghi nhận, biểu dương và lan tỏa các cá nhân, tập thể có cách phục vụ tốt, tạo trải nghiệm tích cực cho khách hàng, để khuyến khích và nhân rộng.", "s": "p", "l": false}, {"t": "4. Tiếp nhận, xử lý và rút kinh nghiệm từ các phản ánh của khách hàng liên quan đến thái độ, hành vi phục vụ trong phạm vi quản lý.", "s": "p", "l": false}]}, {"num": "49", "title": "Trách nhiệm của người quản lý các cấp", "blocks": [{"t": "1. Nêu gương trong ứng xử văn hóa và phục vụ khách hàng; trực tiếp quan tâm, chỉ đạo xử lý các trường hợp phản ánh, kiến nghị, khiếu nại phức tạp hoặc kéo dài, không trả lời chung chung, đối phó.", "s": "p", "l": false}, {"t": "2. Chịu trách nhiệm về chất lượng dịch vụ và văn hóa phục vụ khách hàng của đơn vị, bộ phận mình phụ trách.", "s": "p", "l": false}, {"t": "3. Bảo vệ cán bộ, công nhân viên trước các tình huống khách hàng ứng xử quá mức, đồng thời xử lý nghiêm các biểu hiện vi phạm chuẩn mực phục vụ thuộc phạm vi quản lý.", "s": "p", "l": false}]}, {"num": "50", "title": "Trách nhiệm của CBCNV", "blocks": [{"t": "1. Nghiên cứu, nắm vững và thực hiện đúng Bộ Quy tắc trong công việc hằng ngày.", "s": "p", "l": false}, {"t": "2. Chủ động phối hợp với đồng nghiệp, bộ phận và đơn vị liên quan để khách hàng được phục vụ liền mạch, đúng trách nhiệm.", "s": "p", "l": false}, {"t": "3. Chủ động phản ánh, đề xuất cải tiến khi phát hiện điểm đau lặp lại của khách hàng, bất cập trong phục vụ hoặc nguy cơ mất an toàn, vi phạm bảo mật.", "s": "p", "l": false}]}, {"num": "51", "title": "Kiểm tra, giám sát và xử lý vi phạm", "blocks": [{"t": "1. Việc thực hiện Bộ Quy tắc được kiểm tra, giám sát thường xuyên thông qua công tác quản lý của đơn vị, kết quả phục vụ khách hàng và phản ánh, đánh giá của khách hàng.", "s": "p", "l": false}, {"t": "2. CBCNV thực hiện tốt, có đóng góp tích cực vào trải nghiệm khách hàng được xem xét ghi nhận, biểu dương, khen thưởng theo quy định.", "s": "p", "l": false}, {"t": "3. Hành vi vi phạm các chuẩn mực và quy định tại Bộ Quy tắc, tùy theo tính chất và mức độ, được xem xét, xử lý theo nội quy lao động, quy chế của đơn vị và các quy định hiện hành của EVN; trường hợp vi phạm pháp luật thì xử lý theo quy định của pháp luật.", "s": "p", "l": false}]}, {"num": "52", "title": "Sửa đổi, bổ sung và hiệu lực thi hành", "blocks": [{"t": "1. Bộ Quy tắc được rà soát, cập nhật định kỳ hoặc khi có thay đổi về pháp luật, quy trình nghiệp vụ, mô hình phục vụ hoặc nhu cầu thực tế của khách hàng.", "s": "p", "l": false}, {"t": "2. Các Phụ lục, Sổ tình huống ứng xử và tài liệu hướng dẫn kèm theo có thể được cập nhật linh hoạt trên cơ sở phản hồi từ thực tiễn, mà không làm thay đổi các chuẩn mực, nguyên tắc cốt lõi của Bộ Quy tắc.", "s": "p", "l": false}, {"t": "3. Bộ Quy tắc này có hiệu lực thi hành kể từ ngày ký ban hành. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, các đơn vị phản ánh về đầu mối được giao để tổng hợp, báo cáo cấp có thẩm quyền xem xét, điều chỉnh.", "s": "p", "l": false}]}]}], "intro": "Chương IV quy định việc tổ chức thực hiện Bộ Quy tắc trong toàn hệ thống EVN: phạm vi áp dụng, trách nhiệm các cấp, kiểm tra giám sát và hiệu lực thi hành."}]}, "journeymap": {"pre": [{"type": "p", "t": "PHỤ LỤC 2", "s": "Normal"}, {"type": "p", "t": "BẢN ĐỒ HÀNH TRÌNH KHÁCH HÀNG", "s": "Normal"}, {"type": "p", "t": "VÀ MA TRẬN CHUẨN MỰC HÀNH VI ĐA CHIỀU PHÂN TẦNG", "s": "Normal"}, {"type": "p", "t": "Công cụ tổng hợp giúp nhận diện điểm chạm, định hướng hành vi phân tầng và cảm nhận đích theo từng hành trình", "s": "Normal"}, {"type": "p", "t": "1. Mục đích và cách sử dụng", "s": "Heading 1"}, {"type": "p", "t": "Bản đồ và ma trận tại Phụ lục này là công cụ tổng hợp, giúp người EVN nhìn nhanh toàn cảnh các hành trình khách hàng: mỗi hành trình đi qua những điểm chạm nào, điểm nào dễ làm tổn thương trải nghiệm, và cần định hướng hành vi ra sao ở từng mức để mang lại cảm nhận tích cực. Ma trận không thay thế nội dung chi tiết tại các điều của Bộ Quy tắc, mà cô đọng và cụ thể hóa để dễ ghi nhớ, dễ tra cứu và dễ áp dụng cho từng nhóm cán bộ, công nhân viên.", "s": "Normal"}, {"type": "p", "t": "Logic đa chiều", "s": "Heading 2"}, {"type": "p", "t": "Một hành vi ứng xử được soi qua nhiều trục giao nhau, để trả lời đồng thời: xảy ra ở hành trình nào, tại điểm chạm nào, do ai thực hiện và hướng tới trải nghiệm gì.", "s": "Normal"}, {"type": "p", "t": "•  Trục hành trình: khách hàng đang trong chặng nào của quan hệ với EVN.", "s": "Normal"}, {"type": "p", "t": "•  Trục điểm tiếp xúc: tương tác diễn ra ở tổng đài, hiện trường, điểm giao dịch hay kênh số.", "s": "Normal"}, {"type": "p", "t": "•  Trục nhân sự: ai trực tiếp phục vụ, mỗi vai trò có yêu cầu hành vi riêng.", "s": "Normal"}, {"type": "p", "t": "•  Trục trải nghiệm: khách hàng cần cảm thấy gì, gắn với cảm nhận đích.", "s": "Normal"}, {"type": "p", "t": "Logic phân tầng", "s": "Heading 2"}, {"type": "p", "t": "Tại mỗi hành vi thành phần của một điểm chạm, định hướng được chia thành ba mức tăng dần, vừa giữ sàn chất lượng vừa mở không gian phấn đấu.", "s": "Normal"}, {"type": "p", "t": "•  Chuẩn: mức tối thiểu bắt buộc, là sàn chất lượng không được thấp hơn.", "s": "Normal"}, {"type": "p", "t": "•  Tốt: mức nên đạt, thể hiện sự chủ động vượt trên cơ bản.", "s": "Normal"}, {"type": "p", "t": "•  Tỏa sáng: mức vượt mong đợi, tạo ấn tượng sâu trong lòng khách hàng.", "s": "Normal"}, {"type": "p", "t": "Công thức tổng: Hành trình × Điểm tiếp xúc × Hành vi thành phần → ba tầng Chuẩn / Tốt / Tỏa sáng.", "s": "Normal"}, {"type": "p", "t": "2. Bản đồ tổng quan các hành trình", "s": "Heading 1"}, {"type": "p", "t": "Mười lăm hành trình khách hàng được sắp xếp theo bốn nhóm: Nhóm A về tiếp cận, gia nhập và thay đổi hợp đồng; Nhóm B về sử dụng điện thường xuyên, đo đếm và thanh toán; Nhóm C về đo đếm, kỹ thuật và an toàn; Nhóm D về phản hồi, khiếu nại và dịch vụ năng lượng mới. Trong đó, sáu hành trình trọng yếu được xếp trước tiên; cả mười lăm hành trình đều được trình bày chi tiết theo cùng một khuôn để bảo đảm tính đồng bộ.", "s": "Normal"}, {"type": "p", "t": "Phụ lục được tổ chức theo ba lớp: bản đồ tổng quan cho bức tranh toàn cảnh, ma trận chi tiết cho từng hành trình phục vụ thực thi, và ma trận khái quát chung để ghi nhớ nhanh.", "s": "Normal"}, {"type": "p", "t": "Hình 1. Bản đồ tổng quan mười lăm hành trình trên hai làn trải nghiệm", "s": "Normal"}, {"type": "p", "t": "Làn người là nơi CBCNV trực tiếp phục vụ; làn số là nơi khách hàng tự thực hiện. Điểm dễ tổn thương trải nghiệm nhất thường nằm ở chỗ chuyển giao giữa hai làn và giữa các bộ phận, nơi khách hàng dễ phải kể lại thông tin hoặc chờ đợi không rõ lý do.", "s": "Normal"}, {"type": "p", "t": "3. Ma trận chi tiết theo từng hành trình", "s": "Heading 1"}, {"type": "p", "t": "Với mỗi hành trình, phần này nêu rõ điểm dễ gãy chủ đạo cần đặc biệt lưu ý, sau đó đi qua từng điểm chạm. Mỗi điểm chạm được trình bày bằng một bảng: dòng là các hành vi thành phần, cột là định hướng ở ba mức Chuẩn, Tốt và Tỏa sáng. Cuối mỗi hành trình có một tình huống tiêu biểu minh họa, được chọn lọc từ thực tiễn phục vụ, giúp người đọc hình dung cách vận dụng các chuẩn mực vào một trường hợp cụ thể. Sáu hành trình trọng yếu được xếp trước, chín hành trình còn lại theo sau, tất cả cùng một khuôn trình bày.", "s": "Normal"}], "journeys": [{"code": "3.1", "title": "Hành trình cấp điện mới", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất trong hành trình cấp điện mới không nằm ở việc khách hàng phải làm thủ tục, mà ở cảm giác hồ sơ không rõ ràng, tiến độ không được cập nhật và chi phí thiếu minh bạch. Khi đã nộp yêu cầu, khách hàng thường lo lắng không biết hồ sơ đang ở bước nào, khi nào được thi công, và liệu có phát sinh chi phí ngoài dự kiến hay không. Việc trễ hẹn thi công mà không được báo trước là điều khiến khách hàng thất vọng nhất, vì nó phá vỡ kế hoạch và làm mất niềm tin ngay từ lần tiếp xúc đầu tiên.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tìm hiểu, nộp yêu cầu", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Hướng dẫn điều kiện cấp điện", "Nêu rõ các điều kiện để được cấp điện mới.", "Giải thích vì sao cần các điều kiện đó.", "Chủ động kiểm tra giúp khách hàng đã đủ điều kiện hay chưa."], ["Hướng dẫn hồ sơ, giấy tờ", "Liệt kê đầy đủ giấy tờ cần nộp.", "Gợi ý cách chuẩn bị từng loại giấy tờ.", "Hỗ trợ khách hàng hoàn thiện hồ sơ ngay tại chỗ."], ["Hướng dẫn thời gian xử lý", "Nêu rõ tổng thời gian xử lý theo quy định.", "Nêu mốc thời gian của từng bước.", "Cam kết mốc cụ thể và chủ động theo dõi đúng hẹn."], ["Hướng dẫn chi phí", "Nêu rõ các khoản chi phí phải trả.", "Giải thích căn cứ của từng khoản chi phí.", "Tư vấn phương án hợp lý để tối ưu chi phí cho khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Khảo sát, báo giá", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giải thích hiện trạng", "Thông báo kết quả khảo sát hiện trạng.", "Giải thích rõ hiện trạng ảnh hưởng đến phương án ra sao.", "Trao đổi đến khi khách hàng thực sự hiểu hiện trạng."], ["Trình bày phương án", "Đưa ra một phương án thi công khả thi.", "Đưa nhiều phương án để khách hàng lựa chọn.", "Tư vấn phương án tối ưu nhất theo nhu cầu của khách."], ["Làm rõ ranh giới trách nhiệm", "Nêu rõ phần việc của EVN và của khách hàng.", "Giải thích lý do phân định ranh giới như vậy.", "Chủ động giúp khách hàng hiểu và yên tâm về ranh giới."]]}, {"type": "p", "t": "▸ Điểm chạm: Thi công, lắp đặt", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giữ đúng hẹn", "Thi công đúng thời gian đã cam kết.", "Chủ động báo trước khi có khả năng trễ hẹn.", "Cập nhật tiến độ chủ động và bù đắp khi để khách chờ."], ["Thái độ tại hiện trường", "Làm việc đúng quy trình, gọn gàng.", "Giới thiệu danh tính, tôn trọng không gian khách.", "Chủ động hỏi nhu cầu, hỗ trợ thêm trong khả năng."]]}, {"type": "p", "t": "▸ Điểm chạm: Nghiệm thu, đóng điện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận kết quả", "Xác nhận đã đóng điện, bàn giao đầy đủ.", "Kiểm tra cùng khách hàng trước khi bàn giao.", "Bảo đảm khách hài lòng hoàn toàn trước khi rời đi."], ["Hướng dẫn tiếp theo", "Cung cấp thông tin liên hệ khi cần hỗ trợ.", "Hướng dẫn cách sử dụng dịch vụ, tra cứu hóa đơn.", "Chủ động hỏi thăm trải nghiệm sau khi đóng điện."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng đề nghị bỏ qua một số bước thủ tục cho nhanh", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Trong quá trình làm hồ sơ cấp điện, khách hàng đề nghị nhân viên “linh hoạt” bỏ qua một số bước hoặc giấy tờ để được cấp điện nhanh hơn.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Tiếp nhận đề nghị với thái độ lịch sự, cầu thị; giải thích rõ vì sao cần tuân thủ đầy đủ trình tự, nhất là các yêu cầu về an toàn và pháp lý; hướng dẫn cách hoàn thiện hồ sơ nhanh nhất trong khuôn khổ quy định.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Đồng ý làm tắt, bỏ qua bước bảo đảm an toàn, kỹ thuật; hoặc tỏ thái độ khó chịu, từ chối cứng nhắc mà không giải thích.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Hồ sơ mập mờ, trễ hẹn không báo"], ["Hành vi cốt lõi cần làm", "Minh bạch, đúng hẹn, theo đến cùng"], ["Cảm nhận đích cần đạt", "Yên tâm bước vào quan hệ với EVN"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Nhân viên giao dịch / tiếp nhận", "Hướng dẫn đầy đủ điều kiện, hồ sơ, thời gian, chi phí ngay từ đầu; là đầu mối giúp khách không phải đi lại nhiều lần."], ["Nhân viên khảo sát", "Giải thích hiện trạng và phương án bằng ngôn ngữ dễ hiểu; làm rõ ranh giới trách nhiệm và chi phí trước khi khách quyết định."], ["Nhân viên thi công", "Giữ đúng hẹn là ưu tiên số một; nếu có khả năng trễ phải chủ động báo trước, không để khách chờ trong bị động."]]}, {"code": "3.2", "title": "Hành trình báo và xử lý mất điện, sự cố", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất không nằm ở bản thân việc mất điện, mà ở cảm giác bị bỏ rơi trong bất định: khách hàng không liên hệ được, không biết nguyên nhân, không biết bao giờ có điện trở lại, nên không thể chủ động sắp xếp công việc và cuộc sống. Sự im lặng và thiếu nhất quán giữa các kênh càng làm nỗi lo tăng lên, khiến khách hàng cảm thấy EVN không thực sự quan tâm và không kiểm soát được tình hình. Với mất điện, một sự cố xử lý chậm nhưng có thông tin minh bạch vẫn tốt hơn xử lý nhanh nhưng để khách chờ trong im lặng.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Báo sự cố", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Tiếp nhận yêu cầu", "Tiếp nhận và xác nhận đã ghi nhận sự cố.", "Phản hồi bước đầu trong thời gian ngắn nhất.", "Trấn an và thể hiện thấu hiểu ngay khi tiếp nhận."], ["Tạo điều kiện báo trên nhiều kênh", "Cho phép báo sự cố qua kênh cơ bản.", "Báo được dễ dàng trên ứng dụng, tổng đài, chatbot.", "Liên thông thông tin, không bắt khách báo lại từ đầu."]]}, {"type": "p", "t": "▸ Điểm chạm: Chờ xử lý", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Cung cấp nguyên nhân", "Thông báo nguyên nhân trong phạm vi có thể.", "Giải thích rõ nguyên nhân và khu vực ảnh hưởng.", "Chủ động làm rõ để khách hiểu và yên tâm chờ đợi."], ["Thông tin thời gian khôi phục", "Cung cấp thời gian dự kiến có điện trở lại.", "Cập nhật kịp thời mỗi khi mốc thời gian thay đổi.", "Chủ động liên hệ lại, không để khách phải gọi hỏi."]]}, {"type": "p", "t": "▸ Điểm chạm: Xử lý hiện trường", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Thông tin tình trạng", "Thông tin rõ tình trạng xử lý trong khả năng.", "Giải thích nếu chưa thể xử lý dứt điểm ngay.", "Giải thích cặn kẽ, giữ liên lạc với khách hàng."], ["Ưu tiên trường hợp đặc biệt", "Xử lý theo trình tự, không bỏ sót.", "Ưu tiên trường hợp khẩn cấp, dễ tổn thương.", "Chủ động hỗ trợ vượt phạm vi khi an toàn cho phép."]]}, {"type": "p", "t": "▸ Điểm chạm: Khôi phục", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận khôi phục", "Xác nhận đã có điện trở lại.", "Thông báo chủ động cho khách khi đã khắc phục.", "Hỏi thăm để chắc chắn điện đã ổn định bình thường."], ["Củng cố niềm tin", "Khép lại sự cố đúng quy trình.", "Thể hiện sự quan tâm sau khi xử lý xong.", "Biến kết thúc sự cố thành cơ hội củng cố niềm tin."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng báo mất điện trong khi các hộ xung quanh vẫn có điện", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng gọi tổng đài phản ánh nhà bị mất điện trong khi các hộ xung quanh vẫn có điện, với tâm lý lo lắng, mong được xử lý nhanh.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Lắng nghe, đồng cảm, tiếp nhận nhanh; tra cứu hệ thống để phân loại đúng nguyên nhân; hướng dẫn khách kiểm tra ban đầu CB, aptomat; tạo yêu cầu kiểm tra và tư vấn thời gian xử lý để khách an tâm.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Đổ lỗi cho khách hàng hoặc suy đoán nguyên nhân thiếu căn cứ; bỏ sót trường hợp mất điện do nợ tiền điện.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Bị bỏ rơi trong im lặng"], ["Hành vi cốt lõi cần làm", "Cập nhật chủ động, đồng hành cùng khách"], ["Cảm nhận đích cần đạt", "Được đồng hành, không cô đơn"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Điện thoại viên tổng đài", "Tiếp nhận nhanh, xác nhận rõ đã ghi nhận; cung cấp thông tin bước đầu về nguyên nhân và thời gian dự kiến khôi phục."], ["Nhân viên trực vận hành", "Cập nhật kịp thời thời gian khôi phục trên mọi kênh; bảo đảm thông tin nhất quán để tổng đài và hiện trường nói cùng một thông điệp."], ["Nhân viên hiện trường", "Thông tin rõ tình trạng trong khả năng; ưu tiên trường hợp khẩn cấp và đối tượng dễ tổn thương."]]}, {"code": "3.3", "title": "Hành trình thanh toán tiền điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất là nghi ngờ về tính chính trực của con số: khách hàng không hiểu vì sao hóa đơn tháng này tăng, không có căn cứ rõ ràng để đối chiếu, nên dễ cho rằng mình bị tính sai hoặc bị tính nhiều hơn thực tế. Bên cạnh đó, việc đã thanh toán nhưng vẫn bị nhắc nợ hoặc bị gián đoạn điện do lỗi đồng bộ dữ liệu khiến khách hàng cảm thấy nỗ lực thực hiện đúng nghĩa vụ của mình không được tôn trọng. Vì hành trình này lặp lại hằng tháng, mỗi sai sót nhỏ đều tích lũy và bào mòn niềm tin được xây dựng qua nhiều tháng.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Nhận hóa đơn", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Trình bày hóa đơn", "Hóa đơn nêu rõ chỉ số, biểu giá, các khoản.", "Trình bày tách bạch, dễ hiểu với mọi nhóm khách.", "Kèm hướng dẫn đối chiếu để khách tự kiểm chứng."], ["Khi hóa đơn biến động", "Cung cấp hóa đơn đúng kỳ.", "Chủ động giải thích khi hóa đơn tăng bất thường.", "Cảnh báo sớm biến động và tư vấn cách tiết kiệm."]]}, {"type": "p", "t": "▸ Điểm chạm: Thanh toán", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Kênh thanh toán", "Cung cấp đủ các kênh thanh toán cơ bản.", "Đa dạng kênh, thuận tiện cho mọi nhóm khách.", "Hỗ trợ tận nơi cho người yếu thế, ít dùng công nghệ."], ["Trải nghiệm thanh toán", "Quy trình thanh toán đúng, không lỗi.", "Thanh toán nhanh, ít thao tác.", "Chủ động nhắc nhẹ nhàng, gợi ý thanh toán tự động."]]}, {"type": "p", "t": "▸ Điểm chạm: Ghi nhận thanh toán", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Độ chính xác", "Ghi nhận chính xác khoản đã trả.", "Cập nhật nhanh ngay sau khi khách thanh toán.", "Gửi xác nhận để khách yên tâm đã trả thành công."], ["Đồng bộ dữ liệu", "Cập nhật trạng thái nợ theo quy định.", "Đồng bộ dữ liệu kịp thời giữa các hệ thống.", "Bảo đảm tuyệt đối không nhắc nợ sai sau thanh toán."]]}, {"type": "p", "t": "▸ Điểm chạm: Khi có sai sót", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Tiếp nhận phản ánh", "Tiếp nhận và kiểm tra lại khi khách phản ánh.", "Chủ động nhận lỗi khi lỗi thuộc về EVN.", "Xin lỗi chân thành, không để khách phải chứng minh."], ["Khắc phục", "Điều chỉnh sai sót theo quy định.", "Khắc phục nhanh bằng hành động cụ thể.", "Đứng ra giải quyết trọn vẹn, chủ động bù đắp."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng phản ánh tiền điện kỳ gần nhất tăng cao bất thường", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đến quầy giao dịch phản ánh tiền điện kỳ gần nhất tăng cao hơn nhiều so với thói quen sử dụng, nghi ngờ công tơ hoặc cách tính.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Trấn an và lắng nghe đầy đủ; giải thích minh bạch chỉ số, mức tăng so với các kỳ trước và thời điểm phát sinh; đối chiếu cùng khách; hướng dẫn cách kiểm tra lại và quyền yêu cầu kiểm định nếu còn băn khoăn.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Trả lời qua loa rằng công tơ luôn đúng mà không giải thích; tỏ thái độ cho rằng khách hàng dùng nhiều mà không đối chiếu căn cứ.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Nghi ngờ con số; đã trả vẫn bị nhắc nợ"], ["Hành vi cốt lõi cần làm", "Hóa đơn minh bạch, ghi nhận chính xác"], ["Cảm nhận đích cần đạt", "Tin con số là đúng và công bằng"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Giao dịch viên", "Giải thích căn cứ tính tiền rõ ràng khi khách thắc mắc; hướng dẫn cách tra cứu và đối chiếu hóa đơn."], ["Nhân viên thu tiền", "Ghi nhận thanh toán chính xác, kịp thời; cung cấp chứng từ đầy đủ; không nhắc nợ khi khách đã trả."], ["Bộ phận quản lý dữ liệu, hóa đơn", "Bảo đảm dữ liệu đồng bộ kịp thời để không xảy ra việc đã trả tiền vẫn bị nhắc nợ hoặc gián đoạn điện."]]}, {"code": "3.4", "title": "Hành trình treo, tháo và kiểm định thiết bị đo đếm", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất là nghi ngờ về tính công bằng, bởi bên thực hiện kiểm định cũng chính là bên hưởng lợi từ kết quả, tạo ra xung đột về niềm tin. Khi công tơ được treo, tháo mà khách hàng không được mời chứng kiến, hoặc kết quả kiểm định chỉ là một con số không được giải thích, khách hàng dễ cho rằng mình bị áp đặt. Điểm đau càng nặng khi hóa đơn thay đổi sau kiểm định mà khách hàng không hiểu vì sao, không biết dựa vào đâu để đối chiếu, và cảm thấy mình đứng ngoài một việc liên quan trực tiếp đến tiền của mình.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Thông báo thực hiện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Báo trước", "Thông báo cho khách trước khi thực hiện.", "Báo trước với thời gian hợp lý để khách sắp xếp.", "Sắp xếp thời điểm theo điều kiện của khách hàng."], ["Mời chứng kiến", "Cho phép khách hàng có mặt khi thực hiện.", "Chủ động mời khách hàng cùng chứng kiến.", "Tôn trọng tuyệt đối quyền có mặt và giám sát của khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Khi thực hiện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Thực hiện và lập biên bản", "Thực hiện đúng quy trình, lập biên bản đầy đủ.", "Có xác nhận của khách hàng trên biên bản.", "Minh bạch toàn bộ thao tác để khách yên tâm."], ["Giải thích trong quá trình", "Nêu lý do thực hiện việc treo, tháo, kiểm định.", "Giải thích quy trình và quyền của khách hàng.", "Giải thích đến khi khách hiểu và không còn băn khoăn."]]}, {"type": "p", "t": "▸ Điểm chạm: Bàn giao kết quả", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Bàn giao con số", "Bàn giao kết quả kiểm định cho khách.", "Giải thích ý nghĩa con số ở mức khách cần hiểu.", "Đối chiếu minh bạch, chứng minh kết quả công bằng."]]}, {"type": "p", "t": "▸ Điểm chạm: Khi ảnh hưởng hóa đơn", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giải thích thay đổi", "Thông báo việc hóa đơn thay đổi.", "Chủ động giải thích cơ sở của thay đổi.", "Giúp khách hiểu rõ và chấp nhận trên cơ sở công bằng."], ["Bảo đảm quyền khiếu nại", "Tiếp nhận khiếu nại nếu khách không đồng ý.", "Hướng dẫn rõ quyền và cách yêu cầu kiểm định lại.", "Đồng hành đến khi khách hài lòng về tính chính xác."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Thao tác kiểm định công tơ làm mất điện của khách hàng", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Tổ công tác đến kiểm tra định kỳ công tơ theo kế hoạch; trong quá trình mở hộp công tơ thao tác làm mất điện của khách hàng.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Dừng thao tác ngay khi phát hiện gây mất điện; xin lỗi trực tiếp, giải thích ngắn gọn nguyên nhân; kiểm tra và khôi phục cấp điện sớm nhất, bảo đảm an toàn trước khi đóng điện trở lại; ghi nhận để rút kinh nghiệm.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Tự ý bỏ đi khi chưa khắc phục xong; thao tác tiếp khi chưa bảo đảm an toàn; im lặng không báo cáo sự cố.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Làm sau lưng, áp đặt kết quả"], ["Hành vi cốt lõi cần làm", "Mời chứng kiến, giải thích minh bạch"], ["Cảm nhận đích cần đạt", "Tin mình được đối xử công bằng"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Nhân viên kiểm tra, kiểm định", "Báo trước và mời khách chứng kiến; giải thích lý do, quy trình, quyền của khách; lập biên bản có xác nhận."], ["Bộ phận tính toán hóa đơn", "Khi kết quả ảnh hưởng hóa đơn, chủ động giải thích cơ sở thay đổi, không để khách tự suy đoán."], ["Bộ phận giải quyết khiếu nại", "Hướng dẫn rõ quyền và cách yêu cầu kiểm định lại; đồng hành đến khi khách yên tâm về kết quả."]]}, {"code": "3.5", "title": "Hành trình đôn đốc và xử lý nợ tiền điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất là cảm giác bị đối xử thiếu tôn trọng và bị áp đặt: khi việc nhắc nợ mang giọng đe dọa, gây áp lực hoặc làm khách hàng xấu hổ, họ cảm thấy phẩm giá bị tổn thương, dù lỗi chậm trả có thể đến từ khó khăn thực sự hoặc nhầm lẫn. Điểm đau thứ hai là sự bất ngờ và thiếu lối thoát: bị ngừng cấp điện mà không được báo trước rõ ràng, không hiểu căn cứ và thời hạn, hoặc không được biết cách khắc phục, khiến khách hàng rơi vào thế bị động và mất niềm tin vào sự công bằng của EVN.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Nhắc nợ", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Nội dung nhắc", "Nêu rõ số nợ, thời hạn và hệ quả.", "Trình bày rõ ràng, lịch sự, dễ hiểu.", "Kèm phương án hỗ trợ ngay khi nhắc nợ."], ["Thái độ và cách nhắc", "Nhắc đúng quy định, không sai sót.", "Chọn thời điểm và cách thức phù hợp, không phiền hà.", "Điềm đạm, không phán xét, giữ thể diện cho khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Trước khi ngừng cấp điện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Báo trước", "Báo trước việc ngừng cấp đúng quy định.", "Giải thích căn cứ, trình tự và mốc thời gian.", "Chủ động tìm hiểu hoàn cảnh trước khi quyết định."], ["Cân nhắc trường hợp đặc biệt", "Thực hiện theo đúng quy định.", "Thận trọng với hộ khó khăn, đối tượng yếu thế.", "Cân nhắc kỹ, ưu tiên giải pháp nhân văn trước khi cắt."]]}, {"type": "p", "t": "▸ Điểm chạm: Mở lối khắc phục", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Hướng dẫn thanh toán", "Hướng dẫn cách thanh toán khoản nợ.", "Cung cấp các phương án và điều kiện cấp điện lại.", "Đồng hành tìm giải pháp phù hợp với khả năng của khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Cấp điện trở lại", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Thực hiện cấp lại", "Cấp điện trở lại theo quy định sau thanh toán.", "Thực hiện nhanh và xác nhận rõ ràng với khách.", "Cấp lại nhanh nhất có thể, không để khách chờ thêm."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng có thái độ căng thẳng, xúc phạm khi bị nhắc nợ tại hiện trường", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Trong lúc nhắc nợ tại hiện trường, khách hàng nóng nảy, bức xúc, dùng lời lẽ xúc phạm nhân viên.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Giữ giọng bình tĩnh, thái độ tôn trọng; truyền đạt ngắn gọn nội dung nhắc nợ; không phản ứng trước lời lẽ xúc phạm; thực hiện “lùi bước an toàn” khi khách có biểu hiện căng thẳng, mất kiểm soát, hẹn liên hệ lại sau.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Tiếp tục tranh luận, đôi co; có lời lẽ hoặc thái độ đáp trả làm tình huống căng thẳng thêm.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Đe dọa, hạ thấp; bất ngờ cắt điện"], ["Hành vi cốt lõi cần làm", "Tôn trọng, minh bạch, mở lối thoát"], ["Cảm nhận đích cần đạt", "Được đối xử công bằng và nhân văn"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Nhân viên đốc nợ", "Nhắc nợ lịch sự, rõ ràng, không đe dọa hay làm khách mất thể diện; luôn mở lối khắc phục và hướng dẫn phương án hỗ trợ."], ["Nhân viên thực hiện ngừng cấp điện", "Bảo đảm đã báo trước đúng quy định; đặc biệt thận trọng và nhân văn với hộ khó khăn, đối tượng yếu thế."], ["Nhân viên cấp điện trở lại", "Sau khi khách thanh toán, cấp điện trở lại nhanh nhất có thể và xác nhận rõ ràng, không để khách chờ trong thế bị động."]]}, {"code": "3.6", "title": "Hành trình khắc phục rò điện, bảo đảm an toàn điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất là cảm giác bất an và nguy hiểm không được ứng phó kịp thời: khi phát hiện dấu hiệu rò điện, nguy cơ cháy nổ hay giật điện, khách hàng cần sự can thiệp ngay lập tức, nên bất kỳ sự chậm trễ, thờ ơ hay đùn đẩy nào cũng làm nỗi sợ tăng lên gấp bội. Điểm đau thứ hai là sự đùn đẩy trách nhiệm theo ranh giới tài sản: khi EVN viện lý do sự cố nằm ngoài phạm vi quản lý để từ chối hỗ trợ, khách hàng cảm thấy bị bỏ mặc trong tình huống nguy hiểm và mất niềm tin vào trách nhiệm của ngành điện.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp nhận phản ánh", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Mức ưu tiên", "Tiếp nhận ngay phản ánh về mất an toàn.", "Đặt ưu tiên cao nhất, xử lý trước các việc khác.", "Phản ứng tức thì với tinh thần khẩn cấp tuyệt đối."], ["Hướng dẫn phòng tránh tức thời", "Nhắc khách tránh xa khu vực nguy hiểm.", "Hướng dẫn ngắt nguồn điện nếu an toàn để làm.", "Hướng dẫn bình tĩnh từng bước để bảo đảm an toàn."]]}, {"type": "p", "t": "▸ Điểm chạm: Chờ xử lý", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Cử lực lượng", "Cử lực lượng đến hiện trường.", "Đến nhanh nhất có thể trong tình huống khẩn.", "Theo sát liên tục đến khi bảo đảm an toàn."], ["Giữ liên lạc", "Xác nhận đang trên đường xử lý.", "Giữ liên lạc và trấn an khách trong khi di chuyển.", "Đồng hành qua điện thoại để khách bớt hoảng sợ."]]}, {"type": "p", "t": "▸ Điểm chạm: Xử lý hiện trường", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Khắc phục", "Khắc phục sự cố trong phạm vi quản lý.", "Xử lý dứt điểm nguy cơ mất an toàn.", "Kiểm tra toàn diện để loại trừ nguy cơ còn sót."], ["Khi ngoài phạm vi tài sản", "Cảnh báo nguy hiểm cho khách hàng.", "Hướng dẫn và kết nối phương án xử lý an toàn.", "Hỗ trợ tận tình, không từ chối với lý do ranh giới."]]}, {"type": "p", "t": "▸ Điểm chạm: Sau khắc phục", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giải thích và phòng ngừa", "Xác nhận đã xử lý an toàn.", "Giải thích nguyên nhân và biện pháp đã thực hiện.", "Khuyến nghị cách phòng ngừa để khách chủ động về sau."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng báo trụ điện trước nhà có dấu hiệu rò điện, tê tay khi chạm", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng gọi tổng đài phản ánh trụ điện trước nhà có dấu hiệu rò điện, chạm vào bị tê tay. Đây là tình huống khẩn cấp, rủi ro tai nạn cho nhiều người.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Đặt an toàn lên hàng đầu, tiếp nhận và xử lý ngay; hướng dẫn khách và người xung quanh không lại gần, giữ khoảng cách; tạo phiếu báo mất an toàn chuyển ngay đơn vị quản lý; liên hệ trực ban vận hành xử lý khẩn; theo dõi đến khi xử lý thực tế.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Xử lý chậm, không coi là khẩn cấp; không hướng dẫn an toàn ngay; hướng dẫn mơ hồ hoặc không chuyển xử lý ngay.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Chậm trễ; đùn đẩy ranh giới tài sản"], ["Hành vi cốt lõi cần làm", "An toàn trên hết, không đùn đẩy"], ["Cảm nhận đích cần đạt", "Được bảo vệ kịp thời"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Điện thoại viên tổng đài", "Đặt ưu tiên cao nhất cho phản ánh mất an toàn; hướng dẫn ngay biện pháp phòng tránh nguy hiểm tức thời cho khách."], ["Nhân viên trực sự cố, an toàn", "Đến hiện trường nhanh nhất; giữ liên lạc trấn an trong khi di chuyển; xử lý dứt điểm nguy cơ."], ["Toàn thể CBCNV tiếp nhận", "Khi sự cố ngoài phạm vi tài sản EVN, vẫn cảnh báo, hướng dẫn và kết nối phương án; tuyệt đối không từ chối vì lý do ranh giới."]]}, {"code": "3.7", "title": "Hành trình tìm hiểu thông tin và yêu cầu dịch vụ điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo của hành trình này nằm ở chỗ khách hàng khó tìm, khó hiểu và khó biết bắt đầu từ đâu. Thông tin về dịch vụ điện thường nằm rải rác ở nhiều nơi, trình bày bằng thuật ngữ chuyên ngành, lại không nhất quán giữa website, ứng dụng và tổng đài, khiến khách hàng hoang mang không biết tin vào đâu. Khi đã muốn yêu cầu dịch vụ, khách hàng lại không rõ liên hệ với ai, bị đẩy qua lại giữa các bộ phận và cảm thấy bị bỏ mặc ngay từ khâu đầu tiên, làm mất thiện cảm trước cả khi giao dịch bắt đầu.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp cận thông tin", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Tính sẵn có của thông tin", "Cung cấp thông tin dịch vụ qua kênh cơ bản.", "Thông tin dễ tìm trên nhiều kênh khách quen dùng.", "Chủ động đưa thông tin đến đúng nhóm khách hàng cần."], ["Tính nhất quán", "Bảo đảm thông tin đúng quy định.", "Thông tin nhất quán giữa website, app, tổng đài.", "Rà soát đồng bộ định kỳ để khách luôn nhận cùng câu trả lời."]]}, {"type": "p", "t": "▸ Điểm chạm: Hiểu nội dung", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Trình bày dễ hiểu", "Nêu đủ điều kiện, hồ sơ, thời gian, chi phí.", "Diễn đạt bằng ngôn ngữ gần gũi, tránh thuật ngữ.", "Có ví dụ, minh họa giúp khách nắm ngay."]]}, {"type": "p", "t": "▸ Điểm chạm: Chuyển sang gửi yêu cầu", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Chỉ dẫn đầu mối", "Cho biết nơi tiếp nhận yêu cầu.", "Chỉ rõ đầu mối và bước tiếp theo cụ thể.", "Đồng hành chuyển khách sang gửi yêu cầu liền mạch."], ["Hỗ trợ chủ động", "Trả lời khi khách hỏi.", "Chủ động hỏi nhu cầu của khách.", "Không để khách tự xoay xở giữa các bộ phận."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng đến quầy yêu cầu cấp lại hóa đơn để quyết toán thuế gấp", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đến quầy giao dịch yêu cầu cung cấp lại hóa đơn tiền điện để phục vụ kê khai, quyết toán thuế trong thời gian ngắn.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Tiếp nhận với thái độ chuyên nghiệp, xử lý nhanh chính xác; hỗ trợ tra cứu và cung cấp hóa đơn điện tử đầy đủ; chủ động giới thiệu và hướng dẫn cụ thể cách dùng App CSKH EVN để khách tự tra cứu, tải hóa đơn lần sau.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Để khách chờ lâu hoặc từ chối với lý do thủ tục; không hướng dẫn kênh trực tuyến khiến khách phải đến quầy mỗi lần.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Thông tin tản mát, khó hiểu, không rõ đầu mối"], ["Hành vi cốt lõi cần làm", "Thông tin nhất quán, dễ hiểu, chỉ rõ đầu mối"], ["Cảm nhận đích cần đạt", "Dễ tìm, dễ hiểu, biết bắt đầu từ đâu"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Điện thoại viên tổng đài", "Cung cấp thông tin chính xác, nhất quán; hướng dẫn rõ bước tiếp theo và đầu mối; chủ động hỏi nhu cầu của khách."], ["Giao dịch viên", "Giải thích điều kiện, hồ sơ, thời gian, chi phí bằng ngôn ngữ dễ hiểu; giới thiệu các kênh trực tuyến để khách chủ động."], ["Bộ phận quản lý nội dung kênh số", "Bảo đảm thông tin trên website, app đồng bộ và cập nhật, tránh vênh nhau giữa các kênh."]]}, {"code": "3.8", "title": "Hành trình thay đổi, gia hạn, chấm dứt hợp đồng mua bán điện (HĐMBĐ)", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo nằm ở sự mập mờ về thủ tục và sự chậm trễ do phối hợp nội bộ. Khách hàng thường không biết đúng loại việc của mình cần giấy tờ gì, bị yêu cầu bổ sung nhiều lần, phải đi lại nhiều lần vì các khâu bên trong xử lý thiếu thông suốt. Khi đã nộp hồ sơ, khách hàng lại không biết hồ sơ đang ở bước nào, không được xác nhận rõ hợp đồng đã thay đổi hay chấm dứt ra sao, nên thấp thỏm và mơ hồ về các nghĩa vụ liên quan của mình sau khi xử lý.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp nhận yêu cầu", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác định đúng loại việc", "Tiếp nhận yêu cầu của khách.", "Xác định đúng loại việc và giấy tờ tương ứng.", "Tư vấn loại việc phù hợp nhất với nhu cầu của khách."], ["Hướng dẫn hồ sơ", "Liệt kê giấy tờ cần nộp.", "Hướng dẫn rõ để khách không phải bổ sung nhiều lần.", "Hỗ trợ khách hoàn thiện hồ sơ ngay tại chỗ."]]}, {"type": "p", "t": "▸ Điểm chạm: Xử lý hồ sơ", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đầu mối và phối hợp", "Phân công bộ phận xử lý.", "Chỉ rõ một đầu mối; phối hợp nội bộ là việc của EVN.", "Khách không phải đi lại hay tự liên hệ nhiều bộ phận."], ["Thông tin tiến độ", "Phản hồi khi khách hỏi.", "Chủ động thông tin tiến độ xử lý.", "Cập nhật rõ đang ở bước nào, dự kiến khi nào xong."]]}, {"type": "p", "t": "▸ Điểm chạm: Hoàn tất", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận trạng thái", "Thông báo đã xử lý xong.", "Xác nhận rõ trạng thái hợp đồng sau xử lý.", "Giải thích các nghĩa vụ liên quan để khách yên tâm."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng đề nghị di dời, thay đổi ngoài quy trình chính thức cho nhanh", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đề nghị nhân viên thực hiện thay đổi, di dời ngoài giờ làm việc, không qua quy trình tiếp nhận chính thức để được nhanh.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Ứng xử niềm nở, không từ chối thiếu thiện chí; minh bạch giải thích quy định, quy trình và trách nhiệm; hướng dẫn khách thực hiện qua kênh chính thức; bảo đảm mọi can thiệp được kiểm soát kỹ thuật và an toàn.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Thực hiện công việc ngoài quy trình được phê duyệt; hoặc từ chối cứng nhắc, thiếu thiện chí mà không giải thích cho khách hiểu.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Hồ sơ không rõ, phối hợp chậm, không rõ trạng thái"], ["Hành vi cốt lõi cần làm", "Giải thích đúng giấy tờ, một đầu mối, xác nhận rõ"], ["Cảm nhận đích cần đạt", "Thủ tục rõ ràng, hợp đồng minh bạch"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Giao dịch viên", "Xác định đúng loại việc và giấy tờ ngay từ đầu; hướng dẫn rõ để khách không phải bổ sung nhiều lần."], ["Bộ phận xử lý hợp đồng", "Coi phối hợp nội bộ là trách nhiệm của EVN; chủ động thông tin tiến độ; xác nhận rõ trạng thái hợp đồng sau xử lý."]]}, {"code": "3.9", "title": "Hành trình thông báo ngừng, giảm cung cấp điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là khách hàng bị động vì không được biết trước, biết đúng và biết kịp thời. Thông báo đến muộn, sát giờ hoặc sau khi đã mất điện khiến khách không còn thời gian sắp xếp sinh hoạt, sản xuất. Khi thông báo lại thiếu thông tin về khung giờ, phạm vi, lý do hoặc thời điểm khôi phục, hoặc thông tin giữa các kênh vênh nhau, khách hàng càng lo lắng và không biết tin vào đâu. Với hành trình này, sự chủ động và nhất quán của thông tin quan trọng không kém việc ngừng giảm điện có hợp lý hay không.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Phát thông báo", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Thời điểm báo", "Báo trước theo đúng quy định.", "Báo sớm để khách có đủ thời gian chuẩn bị.", "Báo qua kênh khách ưu tiên, xác nhận đã nhận tin."], ["Nội dung báo", "Nêu thời gian ngừng, giảm điện.", "Nêu rõ phạm vi, thời gian, lý do, thời điểm khôi phục.", "Kèm gợi ý giúp khách chủ động ứng phó."]]}, {"type": "p", "t": "▸ Điểm chạm: Đồng bộ kênh", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Nhất quán thông tin", "Cập nhật trên kênh cơ bản.", "Đồng bộ trên kênh số, tổng đài, điểm giao dịch.", "Bảo đảm mọi kênh cùng một thông điệp tại mọi thời điểm."]]}, {"type": "p", "t": "▸ Điểm chạm: Cập nhật thay đổi", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Theo dõi và cập nhật", "Thông báo khi lịch thay đổi.", "Cập nhật kịp thời mọi điều chỉnh, hủy bỏ.", "Chủ động báo khi khôi phục sớm hơn dự kiến."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng từ chối đóng tiền vì chưa nhận được thông báo", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Nhân viên đến nhắc nợ, khách hàng cho biết chưa nhận được thông báo tiền điện nên từ chối đóng tiền.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Giữ thái độ bình tĩnh, cầu thị; tập trung kiểm tra kênh nhận thông tin của khách (Zalo, App, Email); hướng dẫn khách kiểm tra lịch sử tin nhắn, mục thông báo trên App CSKH; thuyết phục và hướng dẫn thanh toán trực tuyến thuận tiện.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Tranh cãi, khẳng định khách nói dối hoặc dùng ngôn từ gây áp lực; không kiểm tra giúp khách kênh nhận thông báo.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Báo muộn, không rõ, thông tin không thống nhất"], ["Hành vi cốt lõi cần làm", "Báo sớm, nêu rõ, đồng bộ mọi kênh"], ["Cảm nhận đích cần đạt", "Biết trước, biết đúng, chủ động sắp xếp"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Bộ phận lập kế hoạch ngừng, giảm điện", "Cập nhật lịch sớm và đầy đủ phạm vi, thời gian, lý do; bảo đảm thông tin được đưa lên các kênh đúng thời hạn quy định."], ["Điện thoại viên tổng đài", "Cung cấp thông tin nhất quán với các kênh khác; cập nhật kịp thời khi lịch thay đổi để khách không bị động."], ["Bộ phận quản lý kênh số", "Bảo đảm thông báo trên app, website đồng bộ với tổng đài và điểm giao dịch tại mọi thời điểm."]]}, {"code": "3.10", "title": "Hành trình hiểu hóa đơn và căn cứ tính tiền điện", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là khách hàng không hiểu vì sao hóa đơn có số tiền như vậy và thiếu căn cứ để đối chiếu. Hóa đơn trình bày nhiều khoản mục, dùng thuật ngữ chuyên ngành, không tách bạch rõ chỉ số tiêu thụ, biểu giá và các khoản, khiến khách khó nắm được cơ sở tính tiền. Khi hóa đơn tăng bất thường mà không được giải thích và không có cơ sở so sánh, khách hàng dễ nghi ngờ mình bị tính sai. Việc khó tra cứu lịch sử và khó được giải đáp khi thắc mắc càng làm nghi ngờ tăng lên, ảnh hưởng trực tiếp tới niềm tin.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Nhận và đọc hóa đơn", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Trình bày hóa đơn", "Hóa đơn nêu chỉ số, biểu giá, các khoản.", "Tách bạch, dễ hiểu với mọi nhóm khách.", "Kèm hướng dẫn đối chiếu để khách tự kiểm chứng."]]}, {"type": "p", "t": "▸ Điểm chạm: Khi hóa đơn biến động", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giải thích biến động", "Cung cấp số liệu khi khách hỏi.", "Chủ động giải thích nguyên nhân và lý do tăng.", "Cảnh báo sớm biến động bất thường, tư vấn cách tiết kiệm."], ["Căn cứ đối chiếu", "Cung cấp chỉ số kỳ hiện tại.", "So sánh với các kỳ trước để khách đối chiếu.", "Phân tích giúp khách hiểu rõ thói quen sử dụng."]]}, {"type": "p", "t": "▸ Điểm chạm: Tra cứu và thắc mắc", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Hỗ trợ tra cứu", "Hướng dẫn cách xem lại hóa đơn.", "Hướng dẫn dùng App CSKH tra cứu lịch sử.", "Đồng hành đến khi khách tự tra cứu thành thạo."], ["Tiếp nhận thắc mắc", "Tiếp nhận khi khách phản ánh.", "Giải đáp minh bạch, không né tránh.", "Hướng dẫn rõ cách yêu cầu kiểm tra, phúc tra."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng phản ánh tiền điện tháng hiện tại tăng cao bất thường", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng gọi tổng đài phản ánh tiền điện tháng hiện tại tăng cao bất thường so với các tháng trước, nghi ngờ Điện lực có sai sót.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Lắng nghe, thấu hiểu, ghi nhận đầy đủ băn khoăn; không tranh luận, không phủ nhận cảm nhận của khách; giải thích minh bạch chỉ số và biểu giá; đối chiếu với các kỳ trước và hướng dẫn cách kiểm tra lại, phúc tra nếu cần.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Khẳng định ngay công tơ đúng mà không giải thích; tranh luận hoặc cho rằng khách dùng nhiều mà không đối chiếu căn cứ.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Hóa đơn khó hiểu, thiếu căn cứ đối chiếu"], ["Hành vi cốt lõi cần làm", "Hóa đơn rõ ràng, giải thích chủ động"], ["Cảm nhận đích cần đạt", "Hiểu vì sao, tin con số đúng"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Giao dịch viên", "Giải thích minh bạch chỉ số, biểu giá, các khoản; so sánh với kỳ trước; hướng dẫn cách tra cứu và đối chiếu."], ["Điện thoại viên tổng đài", "Lắng nghe, không tranh luận, không phủ nhận cảm nhận của khách; giải thích rõ căn cứ và hướng dẫn kiểm tra lại."]]}, {"code": "3.11", "title": "Hành trình ngừng, cấp điện trở lại theo yêu cầu khách hàng", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là khách hàng cần được thực hiện đúng hẹn và hiểu rõ điều kiện, hệ quả. Việc thực hiện chậm so với hẹn hoặc không báo trước khi có thay đổi làm đảo lộn kế hoạch sửa chữa, xây dựng của khách. Khi không rõ điều kiện, thủ tục và chi phí, khách lúng túng và bị động; khi không được giải thích hệ quả đối với hợp đồng hoặc không được xác nhận đã ngừng, đã cấp lại ra sao, khách hàng mơ hồ về các nghĩa vụ liên quan. Sự đúng hẹn và rõ ràng là yếu tố quyết định trải nghiệm của hành trình này.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp nhận yêu cầu", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Hướng dẫn điều kiện, thủ tục", "Tiếp nhận yêu cầu ngừng, cấp lại.", "Giải thích rõ điều kiện, thủ tục, chi phí ngay từ đầu.", "Tư vấn phương án phù hợp nhất với nhu cầu của khách."], ["Làm rõ hệ quả", "Thông báo việc sẽ thực hiện.", "Nêu rõ hệ quả đối với hợp đồng, việc dùng điện.", "Giúp khách cân nhắc kỹ trước khi quyết định."]]}, {"type": "p", "t": "▸ Điểm chạm: Thực hiện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đúng hẹn", "Thực hiện theo quy định.", "Đúng thời gian đã hẹn; báo trước nếu thay đổi.", "Chủ động sắp xếp linh hoạt theo điều kiện của khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Hoàn tất", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận trạng thái", "Thông báo đã thực hiện.", "Xác nhận rõ trạng thái sau khi xử lý.", "Giải thích nghĩa vụ liên quan để khách yên tâm."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng yêu cầu xử lý nhanh, gấp các dịch vụ điện tại quầy", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đến quầy giao dịch yêu cầu xử lý nhanh, gấp các dịch vụ điện như cấp điện, ngừng hoặc cấp điện trở lại.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Tiếp nhận với thái độ trách nhiệm; giải thích rõ thời gian xử lý theo quy định và lý do; ưu tiên hỗ trợ trong khả năng; hướng dẫn các kênh trực tuyến để khách theo dõi tiến độ; chủ động cập nhật nếu có thể rút ngắn thời gian.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Hứa hẹn thời gian không thực hiện được; hoặc từ chối cứng nhắc mà không giải thích quy trình và phương án thay thế.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Chậm hẹn, không rõ thủ tục, không rõ hệ quả"], ["Hành vi cốt lõi cần làm", "Đúng hẹn, giải thích rõ, xác nhận trạng thái"], ["Cảm nhận đích cần đạt", "Được thực hiện đúng hẹn, hiểu rõ hệ quả"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Giao dịch viên / tiếp nhận", "Giải thích rõ điều kiện, thủ tục, thời gian, chi phí và hệ quả đối với hợp đồng ngay từ đầu."], ["Nhân viên thực hiện hiện trường", "Thực hiện đúng thời gian đã hẹn; chủ động báo trước nếu có thay đổi; xác nhận rõ trạng thái sau xử lý."]]}, {"code": "3.12", "title": "Hành trình thay đổi công suất, vị trí thiết bị đo đếm", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là khách hàng không hiểu lý do kỹ thuật và lo phát sinh ngoài dự kiến. Khi không được giải thích vì sao phải thay đổi công suất hay di dời thiết bị đo đếm, khách dễ nghi ngờ về sự cần thiết và tính hợp lý. Khi không rõ thời gian và chi phí, khách bị động và lo lắng về khoản phát sinh. Điểm đau nặng nhất xuất hiện khi việc thi công lệch so với phương án đã thống nhất, phát sinh chi phí hoặc kéo dài thời gian mà không được trao đổi trước, khiến khách hàng mất niềm tin vào sự minh bạch của EVN.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp nhận, tư vấn", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Giải thích kỹ thuật", "Nêu lý do cần thay đổi.", "Giải thích rõ lý do kỹ thuật và phương án thực hiện.", "Giải thích đến khi khách hiểu và yên tâm về sự cần thiết."], ["Thông tin thời gian, chi phí", "Nêu chi phí và thời gian.", "Làm rõ ngay từ đầu để khách chủ động cân nhắc.", "Tư vấn phương án tối ưu chi phí, thời gian cho khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Thi công", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Bám phương án thống nhất", "Thực hiện theo phương án.", "Đúng phương án đã thống nhất với khách.", "Khi có phát sinh, trao đổi và thống nhất lại trước khi làm."], ["Bảo đảm an toàn, kỹ thuật", "Tuân thủ yêu cầu kỹ thuật, an toàn.", "Giải thích các yêu cầu an toàn cho khách.", "Cân đối hài hòa nhu cầu khách và yêu cầu kỹ thuật."]]}, {"type": "p", "t": "▸ Điểm chạm: Hoàn tất", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận kết quả", "Thông báo đã hoàn thành.", "Cập nhật tiến độ và xác nhận kết quả.", "Hướng dẫn lưu ý sử dụng sau thay đổi để khách yên tâm."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng đề nghị vị trí lắp đặt mới không bảo đảm an toàn kỹ thuật", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đã được khảo sát, thống nhất vị trí lắp công tơ, nhưng sau đó đề nghị đổi sang vị trí mới không bảo đảm an toàn, kỹ thuật.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Giải thích rõ ràng, dễ hiểu các rủi ro về an toàn, kỹ thuật của vị trí khách đề xuất; cùng khách tìm phương án thay thế bảo đảm cả nhu cầu lẫn an toàn vận hành; giữ thái độ tôn trọng, không từ chối cứng nhắc.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Đồng ý phương án không bảo đảm an toàn kỹ thuật để chiều khách; hoặc từ chối mà không giải thích và không đề xuất phương án thay thế.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Thiếu giải thích, phát sinh không trao đổi"], ["Hành vi cốt lõi cần làm", "Giải thích kỹ thuật, trao đổi khi phát sinh"], ["Cảm nhận đích cần đạt", "Hiểu lý do, tin sự minh bạch"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Nhân viên khảo sát, kỹ thuật", "Giải thích rõ lý do kỹ thuật, phương án, thời gian, chi phí; cân đối hài hòa nhu cầu khách và yêu cầu an toàn."], ["Nhân viên thi công", "Thực hiện đúng phương án đã thống nhất; khi có phát sinh phải trao đổi và thống nhất lại với khách trước khi làm."]]}, {"code": "3.13", "title": "Hành trình tiếp nhận phản ánh, khiếu nại và giải quyết đến cùng", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau nặng nhất là vấn đề không được giải quyết đến cùng: khách hàng chỉ nhận được sự tiếp nhận, lời hứa hoặc câu trả lời chung chung rồi việc bị bỏ lửng, phải khiếu nại lặp lại cùng một chuyện mà không có kết quả thực sự. Điểm đau thứ hai là cảm giác không được tôn trọng và bị đẩy đi: khi gặp thái độ phòng thủ, biện minh, đùn đẩy giữa các bộ phận hoặc bị xem nhẹ, khách hàng vốn đã bức xúc lại càng tổn thương. Đây là hành trình phục hồi niềm tin, làm tốt thì một khách hàng bức xúc có thể trở nên gắn bó hơn.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp nhận", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Thái độ tiếp nhận", "Ghi nhận đầy đủ nội dung phản ánh.", "Bình tĩnh, cầu thị, không phản ứng hay biện minh.", "Thấu hiểu bức xúc, đón nhận như cơ hội hoàn thiện."], ["Lắng nghe", "Lắng nghe hết nội dung khách trình bày.", "Lắng nghe trọn vẹn, không ngắt lời.", "Đặt mình vào vị trí khách để hiểu gốc rễ bức xúc."]]}, {"type": "p", "t": "▸ Điểm chạm: Trong quá trình xử lý", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đầu mối theo dõi", "Phân công bộ phận giải quyết.", "Chỉ rõ một đầu mối chịu trách nhiệm theo dõi.", "Một đầu mối xuyên suốt, khách không bị đẩy qua lại."], ["Thông tin tiến trình", "Phản hồi khi khách hỏi.", "Chủ động thông tin tiến trình giải quyết.", "Cập nhật rõ đang ở bước nào, dự kiến khi nào xong."]]}, {"type": "p", "t": "▸ Điểm chạm: Giải quyết", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Tìm gốc rễ", "Xử lý theo quy định.", "Tìm đúng nguyên nhân gốc, không xử lý bề mặt.", "Giải quyết tận gốc để vấn đề không tái diễn."], ["Theo đến cùng", "Đưa ra hướng giải quyết.", "Theo đuổi đến khi có kết quả thực sự.", "Coi phối hợp nội bộ là việc của EVN, không để khách gánh."]]}, {"type": "p", "t": "▸ Điểm chạm: Sau giải quyết", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Xác nhận và cải tiến", "Thông báo kết quả cho khách.", "Xác nhận kết quả và ghi nhận bài học.", "Cải tiến để lỗi không lặp lại, khôi phục niềm tin."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng bức xúc vì đã liên hệ nhiều lần chưa được giải quyết", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng bức xúc đến phòng giao dịch phản ánh đã liên hệ nhiều lần qua nhiều kênh về cùng một việc nhưng chưa được giải quyết dứt điểm.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Lắng nghe, xin lỗi và nhận trách nhiệm; tra cứu đầy đủ lịch sử xử lý trên hệ thống, không bắt khách trình bày lại; chủ động tiếp nhận và theo dõi đến cùng, không đùn đẩy; hẹn rõ thời hạn và đầu mối, giải quyết dứt điểm.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Đùn đẩy, né tránh, chuyển trách nhiệm hình thức; bắt khách cung cấp lại thông tin đã có trên hệ thống.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Bỏ lửng, không đến kết quả; bị đẩy qua lại"], ["Hành vi cốt lõi cần làm", "Cầu thị, một đầu mối, theo đến cùng"], ["Cảm nhận đích cần đạt", "Vấn đề được giải quyết dứt điểm"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Điện thoại viên / nhân viên tiếp nhận", "Tiếp nhận bình tĩnh, cầu thị, không biện minh; ghi nhận đầy đủ và thể hiện thấu hiểu với bức xúc của khách."], ["Bộ phận giải quyết khiếu nại", "Là một đầu mối xuyên suốt; chủ động thông tin tiến trình; tìm đúng gốc rễ và theo đến khi có kết quả thực sự."], ["Cán bộ quản lý", "Coi phối hợp giữa các bộ phận là trách nhiệm nội bộ của EVN; ghi nhận bài học từ mỗi khiếu nại để cải tiến dịch vụ."]]}, {"code": "3.14", "title": "Hành trình điện mặt trời mái nhà và mua bán điện trực tiếp (DPPA)", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là sự phức tạp và thiếu nhất quán trong một lĩnh vực còn mới. Khách hàng đối mặt với thuật ngữ khó hiểu, chính sách thay đổi và thông tin nặng tính chuyên ngành, nên khó nắm được mình cần làm gì và được gì. Khi tư vấn không nhất quán giữa các kênh, các thời điểm, hoặc hướng dẫn không đúng quy định, khách hàng hoang mang và dễ làm sai. Việc không rõ phạm vi áp dụng và đầu mối khiến khách không biết mình có đủ điều kiện không, liên hệ với ai, và cảm thấy không được hỗ trợ trong một việc vốn đã phức tạp.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tư vấn ban đầu", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đúng quy định, phạm vi", "Giới thiệu khái quát cơ chế, điều kiện.", "Tư vấn đúng quy định, đúng phạm vi áp dụng hiện hành.", "Chủ động làm rõ khách có thuộc diện áp dụng hay không."], ["Giải thích dễ hiểu", "Cung cấp thông tin cơ bản.", "Giải thích trình tự, quyền lợi, nghĩa vụ dễ hiểu.", "Dùng ví dụ minh họa giúp khách nắm nhanh."]]}, {"type": "p", "t": "▸ Điểm chạm: Hướng dẫn thực hiện", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đầu mối nhất quán", "Cho biết bộ phận đầu mối.", "Chỉ rõ đầu mối, thông tin nhất quán mọi kênh.", "Đồng hành hướng dẫn khách qua từng bước."], ["Thận trọng cơ sở pháp lý", "Cung cấp thông tin trong thẩm quyền.", "Không khẳng định chắc chắn khi chưa đủ cơ sở pháp lý.", "Kết nối chuyên gia, đầu mối khi vượt thẩm quyền."]]}, {"type": "p", "t": "▸ Điểm chạm: Bảo đảm an toàn hệ thống", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Đánh giá kỹ thuật, an toàn", "Kiểm tra khả năng đấu nối.", "Đánh giá ảnh hưởng đến hệ thống, giải thích cho khách.", "Tư vấn giải pháp bảo đảm an toàn và lợi ích lâu dài."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Doanh nghiệp muốn được tư vấn về cơ chế mua bán điện trực tiếp", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng doanh nghiệp muốn được tư vấn về cơ chế mua bán điện trực tiếp (DPPA): điều kiện, trình tự và vai trò các bên.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Cung cấp thông tin chính xác, đúng quy định; giới thiệu khái quát cơ chế, điều kiện tham gia và vai trò của các bên; hướng dẫn khách đến bộ phận đầu mối để nhận hồ sơ, biểu mẫu, quy trình; không khẳng định chắc chắn khi chưa đủ cơ sở pháp lý hoặc kỹ thuật.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Phát biểu khẳng định chắc chắn khi chưa đủ cơ sở; tư vấn không nhất quán hoặc đẩy khách qua lại mà không chỉ rõ đầu mối.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Thuật ngữ khó, tư vấn không nhất quán"], ["Hành vi cốt lõi cần làm", "Đúng quy định, dễ hiểu, một đầu mối"], ["Cảm nhận đích cần đạt", "Được hướng dẫn đúng, rõ ràng, yên tâm"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Điện thoại viên / tư vấn", "Giới thiệu đúng cơ chế, điều kiện, phạm vi; không khẳng định chắc chắn khi chưa đủ cơ sở; hướng dẫn đến đầu mối."], ["Bộ phận đầu mối DPPA, ĐMTMN", "Cung cấp hồ sơ, biểu mẫu, quy trình; bảo đảm thông tin nhất quán; đánh giá kỹ thuật và an toàn hệ thống."], ["Nhân viên kỹ thuật", "Đánh giá khả năng phát ngược, ảnh hưởng hệ thống và yếu tố an toàn; giải thích rõ quy định đấu nối cho khách."]]}, {"code": "3.15", "title": "Hành trình tư vấn sử dụng điện tiết kiệm, hiệu quả", "blocks": [{"type": "p", "t": "Điểm dễ đứt gãy chủ đạo:", "s": "Normal"}, {"type": "p", "t": "Điểm đau chủ đạo là khách hàng nhận được tư vấn chung chung, hình thức, không áp dụng được. Khi thông điệp chỉ là khẩu hiệu, không gắn với thực tế sử dụng của khách, họ không biết áp dụng thế nào. Khi lời khuyên xa rời hoàn cảnh, nhu cầu và điều kiện cụ thể, khách thấy không liên quan đến mình. Việc tư vấn đại trà, không dựa trên đặc điểm tiêu thụ thực tế khiến khách cảm thấy chỉ là đối tượng tuyên truyền chứ không phải người được hỗ trợ, làm mất đi cơ hội xây dựng quan hệ đồng hành lâu dài với khách hàng.", "s": "Normal"}, {"type": "p", "t": "▸ Điểm chạm: Tiếp cận, lắng nghe", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Hiểu nhu cầu khách", "Tiếp nhận yêu cầu tư vấn.", "Tìm hiểu đặc điểm và hoàn cảnh sử dụng của khách.", "Phân tích đặc điểm tiêu thụ để tư vấn sát thực tế."], ["Đồng cảm", "Ghi nhận băn khoăn của khách.", "Chia sẻ, đồng cảm với áp lực chi tiêu của khách.", "Tạo cảm giác được đồng hành, không bị áp đặt."]]}, {"type": "p", "t": "▸ Điểm chạm: Đưa giải pháp", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Gợi ý thiết thực", "Đưa gợi ý tiết kiệm cơ bản.", "Gợi ý cụ thể, dễ áp dụng vào thực tế của khách.", "Đề xuất giải pháp cá nhân hóa theo thói quen dùng điện."], ["Giải thích lợi ích", "Nêu lợi ích tiết kiệm chung.", "Làm rõ khoản chi phí khách có thể tiết kiệm.", "Minh họa bằng con số gắn với hóa đơn của khách."]]}, {"type": "p", "t": "▸ Điểm chạm: Đồng hành tiếp theo", "s": "Normal"}, {"type": "table", "rows": [["Hành vi thành phần", "Chuẩn (tối thiểu)", "Tốt (nên đạt)", "Tỏa sáng (vượt mong đợi)"], ["Công cụ và hỗ trợ", "Giới thiệu kênh theo dõi tiêu thụ.", "Hướng dẫn dùng App CSKH theo dõi điện năng.", "Sẵn sàng hỗ trợ giải đáp và tư vấn thêm khi khách cần."]]}, {"type": "p", "t": "◆ Tình huống tiêu biểu minh họa", "s": "Normal"}, {"type": "p", "t": "Khách hàng phản ánh tiền điện tăng cao, xin tư vấn cách tiết kiệm", "s": "Normal"}, {"type": "p", "t": "Bối cảnh. Khách hàng đến quầy phản ánh tiền điện tăng cao và đề nghị được hướng dẫn các biện pháp sử dụng điện tiết kiệm.", "s": "Normal"}, {"type": "p", "t": "Hướng ứng xử đúng. Chia sẻ, đồng cảm với áp lực chi tiêu; giải thích nguyên nhân tăng sản lượng (như mùa nắng nóng); tư vấn giải pháp thiết thực như điều chỉnh nhiệt độ máy lạnh, kết hợp quạt; hướng dẫn dùng App CSKH EVN để theo dõi điện năng và tra cứu lịch sử.", "s": "Normal"}, {"type": "p", "t": "Điều cần tránh. Tư vấn lý thuyết, chung chung, áp đặt; không gắn với hoàn cảnh và thói quen sử dụng thực tế của khách.", "s": "Normal"}], "key3": [["Điểm dễ gãy cần tránh", "Tuyên truyền chung chung, khó áp dụng"], ["Hành vi cốt lõi cần làm", "Gợi ý thiết thực, cá nhân hóa, đồng hành"], ["Cảm nhận đích cần đạt", "Nhận gợi ý hữu ích, thấy được hỗ trợ"]], "cbcnv": [["Nhóm CBCNV chủ yếu phục vụ", "Thông tin và định hướng cụ thể"], ["Giao dịch viên", "Chia sẻ, đồng cảm với áp lực chi tiêu; tư vấn gợi ý cụ thể, dễ áp dụng; giới thiệu App CSKH để khách theo dõi tiêu thụ."], ["Nhân viên tư vấn sử dụng điện", "Dựa trên đặc điểm tiêu thụ thực tế của khách để tư vấn sát; làm rõ lợi ích chi phí; cá nhân hóa theo nhu cầu."]]}]}, "casebook": {"intro": [{"type": "p", "t": "TẬP ĐOÀN ĐIỆN LỰC VIỆT NAM", "s": "Normal"}, {"type": "p", "t": "PHỤ LỤC", "s": "Normal"}, {"type": "p", "t": "SỔ TAY TÌNH HUỐNG ỨNG XỬ (CASE BOOK)", "s": "Normal"}, {"type": "p", "t": "Tài liệu đào tạo đi kèm", "s": "Normal"}, {"type": "p", "t": "Bộ Quy tắc Ứng xử Văn hóa Kinh doanh và Dịch vụ khách hàng", "s": "Normal"}, {"type": "p", "t": "45 tình huống ứng xử theo 8 nhóm vị trí công việc", "s": "Normal"}, {"type": "p", "t": "Văn hóa dẫn dắt hành vi. Hành vi tạo trải nghiệm.", "s": "Normal"}, {"type": "p", "t": "Dữ liệu chỉ ra điểm cần cải thiện.", "s": "Normal"}, {"type": "p", "t": "CÁCH SỬ DỤNG TÀI LIỆU", "s": "Heading 1"}, {"type": "p", "t": "Sổ tay tình huống ứng xử là tài liệu đào tạo, không phải văn bản quy phạm. Mục đích là giúp cán bộ, công nhân viên vận dụng các chuẩn mực và nguyên tắc phục vụ vào những tình huống thực tế, hiểu được không chỉ \"làm thế nào\" mà cả \"vì sao\" và \"để khách hàng cảm thấy gì\".", "s": "Normal"}, {"type": "p", "t": "Tài liệu được tổ chức theo nhóm vị trí công việc. Mỗi tình huống gồm bốn phần: bối cảnh trải nghiệm của khách hàng, hành vi nên và không nên, mẫu câu chuẩn để tham khảo, và mục tiêu cần đạt với cảm nhận của khách hàng.", "s": "Normal"}, {"type": "p", "t": "Dòng in nghiêng ngay dưới mỗi tiêu đề là các nguyên tắc cốt lõi mà tình huống thể hiện, kết nối tình huống với Bộ 12 nguyên tắc ứng xử văn hóa. Mẫu câu chuẩn là gợi ý cách diễn đạt, không bắt buộc đọc nguyên văn; điều quan trọng là giữ đúng tinh thần.", "s": "Normal"}, {"type": "p", "t": "Hai bảng chỉ mục dưới đây giúp tra cứu nhanh tình huống theo 15 hành trình khách hàng và theo 12 nguyên tắc ứng xử.", "s": "Normal"}, {"type": "p", "t": "BẢNG 1. CHỈ MỤC TÌNH HUỐNG THEO 15 HÀNH TRÌNH KHÁCH HÀNG", "s": "Heading 1"}, {"type": "p", "t": "Một tình huống có thể thuộc nhiều hành trình. Hành trình nào còn ít tình huống minh họa là gợi ý để bổ sung ở các đợt biên soạn tiếp theo.", "s": "Normal"}, {"type": "p", "t": "BẢNG 2. CHỈ DẪN TÌNH HUỐNG THEO 12 NGUYÊN TẮC ỨNG XỬ", "s": "Heading 1"}, {"type": "p", "t": "Bảng này giúp phát hiện nguyên tắc nào còn thiếu tình huống minh họa, làm cơ sở cân đối nội dung khi mở rộng Sổ tay tình huống.", "s": "Normal"}], "index_journey": [["Hành trình khách hàng", "Tình huống minh họa"], ["1. Tìm hiểu thông tin về dịch vụ điện", "I.1, V.1, V.3, VII.1, VII.4"], ["2. Cấp điện mới", "I.1, II.2, II.5, VII.1, VII.3, VII.6"], ["3. Lắp đặt, xử lý phần điện sau công tơ", "II.3, IV.5"], ["4. Xử lý sự cố mất điện", "I.3, I.4, II.1, II.3"], ["5. Khắc phục rò điện, bảo đảm an toàn", "I.4, IV.3, VI.6"], ["6. Thanh toán tiền điện", "I.2, I.5, III.1, III.2, III.4, V.2, V.4, V.5, VII.5"], ["7. Nhắc nợ và xử lý nợ quá hạn", "III.1, III.2, III.3, III.4, III.5, III.6"], ["8. Kiểm tra, kiểm định thiết bị đo đếm", "I.6, II.4, IV.1, IV.2, IV.3, IV.4, IV.5, IV.6, VI.1"], ["9. Thay đổi công suất, vị trí thiết bị đo đếm", "II.2, II.6, VII.3"], ["10. Thay đổi thông tin hợp đồng mua bán điện", "VII.1, VII.3, VII.4, VII.6"], ["11. Thay đổi mục đích sử dụng điện", "IV.4"], ["12. Tạm ngừng, cấp điện trở lại, chấm dứt hợp đồng", "—"], ["13. Khiếu nại, phản ánh, giải đáp thắc mắc", "I.2, I.3, I.5, I.6, II.4, III.6, IV.2, IV.6, V.5, VII.2, VII.5, VIII.1, VIII.2, VIII.3, VIII.4"], ["14. Điện mặt trời mái nhà và DPPA", "VI.1, VI.2, VI.3, VI.4, VI.5, VI.6"], ["15. Tư vấn sử dụng điện tiết kiệm, hiệu quả", "V.1, V.2, V.3, V.4, VIII.4"]], "index_nt": [["Nguyên tắc", "Tình huống minh họa"], ["1. Thành công của khách hàng", "I.1, VI.2, VIII.4"], ["2. Mỗi điểm chạm tạo niềm tin", "II.4"], ["3. Trách nhiệm chung toàn hệ thống", "II.1, II.6, VIII.1, VIII.2, VIII.3, VIII.4"], ["4. Đồng hành nhu cầu năng lượng mới", "VI.1, VI.2, VI.4, VI.5, VI.6"], ["5. Tôn trọng và đồng cảm", "I.2, I.3, I.4, I.6, II.1, II.2, II.3, II.4, III.1, III.2, III.3, III.5, III.6, IV.1, IV.2, IV.3, IV.4, IV.5, IV.6, V.1, V.2, V.3, VII.2, VII.6"], ["6. Rõ ràng, chân thành, đáng tin", "I.1, I.2, I.5, I.6, II.2, II.3, II.5, II.6, III.1, III.3, III.4, III.6, IV.1, IV.2, IV.3, IV.4, IV.5, IV.6, V.2, V.4, V.5, VI.1, VI.2, VI.3, VI.4, VI.5, VI.6, VII.3, VII.4, VII.5, VIII.2"], ["7. Chủ động phục vụ", "I.1, I.4, II.1, II.5, III.2, V.1, V.3, V.4, V.5, VII.1, VII.3"], ["8. Công bằng, nhân văn", "II.5, III.2, III.3, III.5, IV.5, V.2, V.3, VI.3, VII.1, VII.3, VII.6, VIII.4"], ["9. Trách nhiệm đến cùng, phối hợp liền mạch", "I.3, I.5, III.4, III.6, VII.2, VII.5, VIII.1, VIII.3"], ["10. Kênh số dễ dùng, dễ đến kết quả", "V.1, V.4, V.5, VII.1, VII.4, VII.6"], ["11. Dữ liệu đúng, đồng bộ", "I.2, I.3, I.5, III.1, IV.6, VI.1, VI.5, VII.2, VII.5, VIII.1"], ["12. An toàn, bảo mật, cải tiến", "I.4, I.6, II.2, II.3, II.4, II.6, III.4, III.5, IV.1, IV.2, IV.3, IV.4, VI.3, VI.4, VI.6, VII.4, VIII.2, VIII.3"]], "groups": [{"num": "I", "title": "ĐIỆN THOẠI VIÊN TỔNG ĐÀI CHĂM SÓC KHÁCH HÀNG", "intro": "Tổng đài là điểm chạm đầu tiên và thường xuyên nhất giữa khách hàng với ngành điện. Mỗi cuộc gọi là một cơ hội để khách hàng tin hơn hoặc nghi ngờ hơn. Điện thoại viên không chỉ tiếp nhận yêu cầu, mà còn trấn an cảm xúc, định hướng giải pháp và giữ cho khách hàng cảm giác được đồng hành đến khi có kết quả.", "situations": [{"code": "I.1", "title": "Khách hàng gọi đến nhờ hướng dẫn thủ tục đăng ký cấp điện sinh hoạt cho gia đình", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT7 Chủ động phục vụ; NT1 Thành công của khách hàng", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng lần đầu làm thủ tục điện, chưa rõ cần giấy tờ gì, mất bao lâu, chi phí ra sao. Họ mong được chỉ dẫn một lần cho đủ, không phải gọi lại nhiều lần hay đi lại nhiều lượt. Trong các trường hợp pháp lý khác nhau về chủ thể sử dụng điện, một lời tư vấn thiếu rõ ràng dễ khiến khách hàng chuẩn bị nhầm hồ sơ và nản lòng ngay từ bước đầu tiên.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Hỏi rõ tình huống trước khi hướng dẫn, để tư vấn đúng trường hợp pháp lý.", "Ngắt lời, tỏ thái độ thiếu kiên nhẫn."], ["Liệt kê đủ hồ sơ, chi phí, thời gian trong một lần.", "Hướng dẫn thiếu hoặc sai hồ sơ, sai quy trình."], ["Dùng ngôn ngữ đời thường, tránh thuật ngữ.", "Cam kết chi phí, thời gian vượt thẩm quyền hoặc trái quy định."], ["Lập phiếu ngay khi khách hàng đủ điều kiện.", "Trả lời “liên hệ điện lực” mà không chỉ dẫn cụ thể."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Dạ, em hướng dẫn anh/chị đầy đủ một lần để mình chuẩn bị cho gọn nhé.”", "s": "Normal"}, {"type": "p", "t": "“Anh/chị cho em hỏi nhà mình là nhà sở hữu hay đang thuê ạ, để em tư vấn đúng giấy tờ cần thiết.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy mọi việc trở nên rõ ràng và đơn giản hơn họ tưởng, biết chính xác cần chuẩn bị gì, mất bao lâu và chi phí ra sao ngay trong một lần gọi. Họ không còn cảm giác bị đẩy đi hay phải tự mò mẫm, mà tin rằng ngành điện sẽ đồng hành với mình đến khi có điện, nên bước vào hành trình cấp điện mới với tâm thế tự tin và thiện cảm.", "s": "Normal"}]}, {"code": "I.2", "title": "Khách hàng phản ánh tiền điện tăng cao bất thường, nghi ngờ ghi sai chỉ số hoặc công tơ chạy nhanh", "principles": "NT5 Tôn trọng và đồng cảm; NT6 Rõ ràng, chân thành, đáng tin; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng nhìn hóa đơn tăng vọt so với tháng trước và thấy bất an, thậm chí bức xúc. Họ chưa biết vì sao tăng và lo mình bị tính nhầm. Với khoản chi liên quan trực tiếp đến túi tiền hằng tháng, tâm lý nghi ngờ rất dễ leo thang thành khiếu nại nếu không được giải tỏa. Điều họ cần trước hết là được lắng nghe và được giải thích minh bạch, có căn cứ.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Thừa nhận bất tiện và thể hiện đồng cảm ngay từ đầu.", "Kết luận “đúng rồi” khi chưa tra cứu, chưa so sánh."], ["Trình bày số liệu so sánh cụ thể, có căn cứ.", "Đổ lỗi cho khách hàng “do dùng nhiều điện”."], ["Chủ động đề xuất kiểm tra khi khách hàng còn băn khoăn.", "Từ chối lập phiếu kiểm tra hợp lệ."], ["Hẹn rõ thời gian phản hồi kết quả.", "Để khách hàng phải gọi lại nhiều lần vì xử lý nửa vời."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em hiểu anh/chị đang băn khoăn về mức tăng này. Để em kiểm tra số liệu và giải thích cụ thể giúp anh/chị nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu sau khi xem số liệu anh/chị vẫn chưa yên tâm, em sẽ tạo yêu cầu để đơn vị đến kiểm tra thực tế cho minh bạch ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy thắc mắc của mình được lắng nghe nghiêm túc và được giải đáp bằng số liệu cụ thể chứ không phải lời nói suông. Họ hiểu được nguyên nhân khiến tiền điện thay đổi, biết mình có quyền yêu cầu kiểm tra thực tế nếu chưa yên tâm, nên chuyển từ nghi ngờ, bức xúc sang tin tưởng rằng cách tính của ngành điện là minh bạch và quyền lợi của mình được bảo vệ.", "s": "Normal"}]}, {"code": "I.3", "title": "Khách hàng phản ánh đã yêu cầu dịch vụ hơn một tuần chưa có người xử lý, dù hệ thống báo “Hoàn tất”", "principles": "NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT5 Tôn trọng và đồng cảm; NT11 Dữ liệu đúng, đồng bộ", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã chờ nhiều ngày mà chưa ai đến, nay gọi lại trong tâm lý mất niềm tin và mệt mỏi. Trên hệ thống phiếu lại hiện trạng thái đã hoàn tất, tạo mâu thuẫn rõ rệt giữa dữ liệu nội bộ và trải nghiệm thật của khách hàng. Mỗi lần phải gọi lại cùng một việc là một lần niềm tin của họ bị bào mòn thêm, nên cách tiếp nhận lúc này có ý nghĩa quyết định.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Nhận trách nhiệm thay cho cả hệ thống, không đẩy lỗi sang bộ phận khác.", "Dùng trạng thái “Hoàn tất” để phủ nhận phản ánh."], ["Đối chiếu dữ liệu với hiện trạng thực tế.", "Trả lời “đã xử lý rồi” mà không kiểm tra."], ["Cam kết theo dõi và đôn đốc đến khi xong.", "Ghi phiếu sơ sài, thiếu thông tin."], ["Hẹn mốc phản hồi cụ thể.", "Không báo Trưởng ca khi có dấu hiệu sai lệch."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Em rất xin lỗi vì anh/chị đã chờ lâu. Hệ thống có ghi nhận, nhưng quan trọng là việc của anh/chị chưa xong nên em sẽ theo đến khi xử lý dứt điểm ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em ghi nhận lại hiện trạng và sẽ đôn đốc đơn vị, em cập nhật lại cho anh/chị trong [thời gian theo quy định].”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy phản ánh của mình được tin tưởng thay vì bị dữ liệu nội bộ phủ nhận, và thấy có một người thật sự đứng ra nhận trách nhiệm theo việc đến cùng. Họ không còn cảm giác bị đùn đẩy giữa các bộ phận hay phải gọi đi gọi lại, mà yên tâm rằng vướng mắc sẽ được đôn đốc xử lý dứt điểm và mình sẽ được cập nhật kết quả, nhờ đó niềm tin dần được phục hồi.", "s": "Normal"}]}, {"code": "I.4", "title": "Khách hàng báo trụ điện trước nhà có dấu hiệu rò điện, chạm vào tê tay, lo mất an toàn", "principles": "NT12 An toàn, bảo mật, cải tiến; NT7 Chủ động phục vụ; NT5 Tôn trọng và đồng cảm", "blocks": [{"type": "p", "t": "Bối cảnh. Đây là tình huống khẩn cấp, khách hàng lo sợ nguy cơ điện giật cho gia đình và những người xung quanh. Trụ điện ngay trước nhà có dấu hiệu rò điện, chạm vào tê tay, khiến mối nguy trở nên cận kề và có thể ảnh hưởng đến cả cộng đồng. Trong trạng thái hoảng hốt đó, khách hàng cần được trấn an, được hướng dẫn an toàn ngay lập tức và thấy ngành điện phản ứng thật nhanh.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Đặt an toàn của khách hàng và cộng đồng lên hàng đầu.", "Trì hoãn hoặc xem nhẹ mức độ khẩn cấp."], ["Hướng dẫn ngắn gọn, dễ làm để phòng tránh nguy hiểm.", "Kết luận nguyên nhân khi chưa kiểm tra hiện trường."], ["Kích hoạt đơn vị xử lý ngay lập tức.", "Hướng dẫn thao tác có thể gây nguy hiểm."], ["Theo dõi đến khi xử lý xong, không dừng ở tiếp nhận.", "Quên theo dõi và phản hồi kết quả cho khách hàng."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Dạ, anh/chị và mọi người tránh xa khu vực đó ngay, đừng chạm vào nhé. Em điều đơn vị đến xử lý khẩn cấp ngay bây giờ ạ.”", "s": "Normal"}, {"type": "p", "t": "“Em sẽ theo dõi đến khi đơn vị xử lý xong và báo lại cho anh/chị, anh/chị yên tâm ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng cảm thấy được bảo vệ kịp thời trong tình huống nguy hiểm, biết rõ phải làm gì ngay để giữ an toàn cho bản thân và mọi người xung quanh. Họ cảm nhận được sự khẩn trương, bình tĩnh và trách nhiệm của ngành điện qua việc được hướng dẫn dứt khoát và được cam kết theo dõi đến khi hiện trường xử lý xong, nhờ đó nỗi lo sợ được xoa dịu và niềm tin vào sự an toàn được củng cố.", "s": "Normal"}]}, {"code": "I.5", "title": "Khách hàng phản ánh thanh toán tiền điện trùng hai lần cho cùng một kỳ, mong được hoàn tiền", "principles": "NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT11 Dữ liệu đúng, đồng bộ; NT6 Rõ ràng, chân thành, đáng tin", "blocks": [{"type": "p", "t": "Bối cảnh. Khách hàng đã thanh toán hai lần cho cùng một mã khách hàng và kỳ hóa đơn qua các kênh khác nhau (ngân hàng, ví điện tử, điểm thu hộ), nay lo lắng số tiền thừa của mình có được trả lại hay không. Họ vừa sốt ruột vì tiền của mình đang ở đâu đó chưa rõ, vừa mong được hướng dẫn cụ thể thay vì phải tự xoay xở giữa nhiều bên trung gian.", "s": "Normal"}, {"type": "p
