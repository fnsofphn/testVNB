ến đầu", "principles": "NT6 Rõ ràng, chân thành, đáng tin; NT3 Trách nhiệm chung toàn hệ thống; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Một văn bản hoặc hướng dẫn nghiệp vụ áp dụng toàn hệ thống được ban hành nhưng diễn đạt khó hiểu, thiếu ví dụ, khiến các đơn vị áp dụng không thống nhất. Hệ quả là khách hàng ở những nơi khác nhau nhận được câu trả lời khác nhau cho cùng một vấn đề, làm xói mòn cảm giác về một ngành điện nhất quán. Một văn bản rõ ràng vì thế chính là một điểm chạm gián tiếp nhưng có sức ảnh hưởng lớn đến trải nghiệm khách hàng.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Viết rõ ràng, có căn cứ và ví dụ.", "Diễn đạt khó hiểu, nhiều cách hiểu."], ["Dự liệu tình huống và hướng dẫn xử lý thống nhất.", "Thiếu hướng dẫn cụ thể cho tuyến đầu."], ["Cung cấp đầu mối giải đáp vướng mắc.", "Bỏ qua phản hồi từ thực tiễn."], ["Tiếp thu phản hồi để cải tiến liên tục.", "Chậm làm rõ nội dung gây hiểu nhầm."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi bổ sung ví dụ và cách xử lý các tình huống thường gặp để các đơn vị áp dụng thống nhất nhé.”", "s": "Normal"}, {"type": "p", "t": "“Nếu trong quá trình áp dụng có vướng mắc, anh/chị liên hệ đầu mối này để được giải đáp kịp thời ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng ở mọi đơn vị, dù không biết đến văn bản hướng dẫn nội bộ, đều nhận được thông tin nhất quán và chính xác cho cùng một vấn đề, nhờ tuyến đầu hiểu đúng và làm đúng. Họ không còn rơi vào cảnh mỗi nơi trả lời một kiểu, nên cảm thấy ngành điện chuyên nghiệp, đáng tin và thống nhất. Cảm nhận đọng lại là sự rõ ràng, minh bạch trong từng câu trả lời, giúp củng cố niềm tin vào một ngành điện vận hành bài bản trên toàn hệ thống.", "s": "Normal"}]}, {"code": "VIII.3", "title": "Tiếp nhận phản ánh của khách hàng chuyển lên từ cấp trên hoặc qua truyền thông, cần điều phối xử lý", "principles": "NT9 Trách nhiệm đến cùng, phối hợp liền mạch; NT3 Trách nhiệm chung toàn hệ thống; NT12 An toàn, bảo mật, cải tiến", "blocks": [{"type": "p", "t": "Bối cảnh. Một phản ánh của khách hàng được chuyển lên cấp văn phòng để theo dõi, điều phối, có thể từ cấp trên hoặc qua truyền thông. Khách hàng ở cuối chuỗi đang chờ một kết quả thực sự, chứ không phải một phiếu được chuyển lòng vòng giữa các cấp rồi rơi vào khoảng trống. Nếu thiếu sự điều phối và đôn đốc, việc xử lý dễ kéo dài, khiến khách hàng mất niềm tin và có thể phản ánh vượt cấp, làm tổn hại hình ảnh ngành điện.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Xác định rõ trách nhiệm và mức ưu tiên.", "Chuyển tiếp hình thức, không theo dõi."], ["Điều phối, đôn đốc đến khi có kết quả thực chất.", "Thiếu phối hợp, để việc kéo dài."], ["Bảo đảm phản hồi nhất quán, đúng hạn.", "Tiết lộ thông tin khách hàng trái quy định."], ["Rút bài học, đề xuất cải tiến.", "Bỏ qua việc rút bài học từ phản ánh."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Tôi xác định đầu mối xử lý và sẽ đôn đốc đến khi có kết quả thực chất cho khách hàng ạ.”", "s": "Normal"}, {"type": "p", "t": "“Tôi tổng hợp nguyên nhân để đề xuất cải tiến, tránh trường hợp tương tự lặp lại ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng nhận được kết quả xử lý thực chất và đúng hẹn cho phản ánh của mình, thay vì cảm giác bị chuyển lòng vòng rồi rơi vào im lặng. Họ cảm nhận được sự phối hợp liền mạch giữa các cấp và các đơn vị của ngành điện, với thông tin phản hồi nhất quán và thông tin cá nhân được bảo mật. Cảm nhận đọng lại là phản ánh của mình thật sự được lắng nghe và giải quyết đến cùng, từ đó niềm tin vào trách nhiệm của cả hệ thống được củng cố.", "s": "Normal"}]}, {"code": "VIII.4", "title": "Đề xuất, tham mưu chính sách dịch vụ có thể ảnh hưởng trực tiếp đến trải nghiệm của khách hàng", "principles": "NT1 Thành công của khách hàng; NT3 Trách nhiệm chung toàn hệ thống; NT8 Công bằng, nhân văn", "blocks": [{"type": "p", "t": "Bối cảnh. Khi xây dựng, tham mưu một chính sách, quy định hoặc thay đổi quy trình dịch vụ áp dụng toàn hệ thống, CBCNV văn phòng đứng trước lựa chọn giữa thuận tiện cho quản lý nội bộ và thuận tiện cho khách hàng. Mỗi quyết định ở tầng này, dù khách hàng không trực tiếp nhìn thấy, đều có thể làm cho hàng triệu lượt tương tác ở tuyến đầu dễ chịu hơn hoặc khó khăn hơn, nên cần luôn lấy trải nghiệm khách hàng làm thước đo.", "s": "Normal"}, {"type": "p", "t": "Hành vi nên và không nên.", "s": "Normal"}, {"type": "table", "rows": [["Nên làm", "Không được làm"], ["Đặt câu hỏi chính sách này giúp khách hàng dễ hơn hay khó hơn trước khi đề xuất.", "Ưu tiên thuận tiện quản lý nội bộ mà bỏ qua tác động lên khách hàng."], ["Cân nhắc tác động đến các nhóm khách hàng khác nhau, nhất là nhóm yếu thế.", "Bỏ sót nhóm khách hàng yếu thế hoặc ít tiếp cận kênh số."], ["Tham khảo dữ liệu phản hồi, khiếu nại thực tế từ tuyến đầu khi xây dựng chính sách.", "Xây dựng chính sách thiếu căn cứ từ thực tiễn phục vụ."], ["Dự liệu nguồn lực và hướng dẫn để tuyến đầu thực thi được mà không gây phiền cho khách hàng.", "Ban hành thay đổi mà không chuẩn bị điều kiện thực thi cho tuyến đầu."]]}, {"type": "p", "t": "Mẫu câu chuẩn.", "s": "Normal"}, {"type": "p", "t": "“Trước khi đề xuất, tôi rà soát xem chính sách này làm khách hàng dễ hơn hay khó hơn, nhất là với nhóm yếu thế nhé.”", "s": "Normal"}, {"type": "p", "t": "“Tôi đối chiếu dữ liệu phản hồi từ tuyến đầu để chính sách sát thực tế phục vụ khách hàng ạ.”", "s": "Normal"}, {"type": "p", "t": "Mục tiêu cần đạt với cảm nhận của khách hàng. Khách hàng, dù không biết đến những quyết định ở tầng văn phòng, sẽ cảm nhận được kết quả qua từng dịch vụ thuận tiện, công bằng và ít phiền hà hơn. Khi chính sách được thiết kế lấy trải nghiệm khách hàng làm <style>
:root{

    linear-gradient(160deg,#081633 0%,#0a1a3a 45%,#0c1f47 100%)}
#particles{position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none}
a{color:inherit}
::selection{background:rgba(224,182,78,.28)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}

  border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(8,18,42,.6),rgba(10,26,58,.3));

.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:34px}

.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:10px}
.jcard{position:relative;border-radius:13px;padding:20px 20px 18px;cursor:pointer;background:var(--glass);
  border:1px solid var(--line);transition:.18s;overflow:hidden}
.jcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
.jcard.prio{background:linear-gradient(125deg,rgba(224,182,78,.1),rgba(37,99,184,.06))}
.jcard .jn{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--gold);line-height:.9;opacity:.85}
.jcard .jt{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:10px;line-height:1.3}
.jcard .jp{position:absolute;top:14px;right:14px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);font-weight:700;background:rgba(224,182,78,.14);padding:2px 8px;border-radius:20px}
.jdetail{margin-top:24px}
.painbox{border-radius:12px;padding:16px 20px;background:rgba(237,28,36,.07);border:1px solid rgba(237,28,36,.24);
  border-left:3px solid var(--red);margin:16px 0}
.painbox .pt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f0908f;font-weight:700;margin-bottom:6px}
.painbox p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.7}
.tp{border-radius:12px;border:1px solid var(--line);margin:14px 0;overflow:hidden;background:var(--glass)}
.tphd{display:flex;gap:10px;align-items:center;padding:12px 18px;background:rgba(16,35,80,.5);font-weight:700;
  font-size:14px;color:#fff}
.tphd .tpdot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tp .tpbody{padding:4px 16px 12px}
.samplebox{border-radius:12px;padding:4px 20px 16px;background:var(--glass2);border:1px solid var(--line);margin:14px 0}
.field{margin:12px 0}
.field .ft{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:3px}
.field p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.65}
.chiplbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);font-weight:700;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;cursor:pointer;
  background:var(--glass2);border:1px solid var(--line2);font-size:12.5px;color:var(--ink-soft);font-weight:500;transition:.15s}
.chip:hover{background:rgba(224,182,78,.14);border-color:var(--gold-soft);color:#fff}
.key3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
@media(max-width:700px){.key3{grid-template-columns:1fr}}
.key3 .k{border-radius:12px;padding:14px 16px;background:var(--glass);border:1px solid var(--line)}
.key3 .kk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:6px}
.key3 .k p{margin:0;font-size:13.5px;color:var(--ink);font-weight:500}

/* ---------- Casebook module ---------- */
.grpband{display:flex;gap:14px;align-items:center;padding:18px 22px;border-radius:14px;margin:26px 0 14px;
  background:linear-gradient(120deg,rgba(16,35,80,.55),rgba(10,26,58,.3));border:1px solid var(--line2)}
.grpband .gno{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--gold);line-height:.85}
.grpband h2{font-size:17px;margin:0;color:#fff;font-weight:700;letter-spacing:.02em}
.grpband .gc{font-size:11px;color:var(--ink-dim);margin-left:auto;background:var(--glass2);padding:3px 11px;border-radius:20px}
.grpintro{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin:0 4px 16px;font-style:italic}

.sit{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden;background:var(--glass);transition:.2s}
.sit.open{border-color:var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.28)}
.sithd{display:flex;gap:14px;align-items:center;padding:15px 20px;cursor:pointer}
.sithd:hover{background:var(--glass2)}
.sithd .scode{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0;min-width:38px}
.sithd .stt{font-size:14.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.35}
.sithd .stog{font-size:20px;color:var(--gold-soft);transition:.2s}
.sit.open .stog{transform:rotate(45deg)}
.sitbody{max-height:0;overflow:hidden;transition:max-height .35s ease}
.sitinner{padding:4px 22px 20px}
/* anchor box: the signature cross-link element */
.anchor{border-radius:12px;padding:15px 18px;margin:8px 0 16px;position:relative;
  background:linear-gradient(120deg,rgba(224,182,78,.09),rgba(37,99,184,.05));
  border:1px solid rgba(224,182,78,.28);border-left:3px solid var(--gold)}
.anchor .at{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;
  margin-bottom:10px;display:flex;align-items:center;gap:7px}
.anchor .arow{display:flex;gap:11px;padding:8px 0;border-top:1px solid rgba(224,182,78,.14)}
.anchor .arow:first-of-type{border-top:none}
.anchor .abadge{flex-shrink:0;font-family:var(--serif);font-weight:700;font-size:12px;color:var(--navy);
  background:var(--gold);padding:3px 10px;border-radius:7px;height:fit-content;cursor:pointer;transition:.15s;white-space:nowrap}
.anchor .abadge:hover{background:#fff}
.anchor .adesc{font-size:13px;color:var(--ink-soft);line-height:1.55}
.anchor .adesc b{color:#fff;font-weight:600}
.sitinner .sfield{margin:12px 0}
.sitinner .sfl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:4px}
.sitinner .sfield p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.65}
.sitinner .say{font-style:italic;color:var(--ink);background:rgba(255,255,255,.03);border-left:2px solid var(--gold-soft);
  padding:7px 13px;border-radius:0 8px 8px 0;margin:6px 0;font-size:13.5px}
.goal{border-radius:10px;padding:11px 15px;background:rgba(127,212,160,.07);border:1px solid rgba(127,212,160,.22);margin-top:14px}
.goal .gl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7fd4a0;font-weight:700;margin-bottom:4px}
.goal p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.6}

/* index tables */
.idxwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
@media(max-width:820px){.idxwrap{grid-template-columns:1fr}}
.idxcard{border-radius:14px;padding:18px 20px;background:var(--glass);border:1px solid var(--line)}
.idxcard h4{font-size:13px;color:var(--gold-soft);margin:0 0 12px;letter-spacing:.03em;font-weight:700}

.footn{margin-top:50px;padding-top:24px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-dim);text-align:center;letter-spacing:.03em}
.footn .fq{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold-soft);margin-bottom:8px}

/* filter bar */
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.fpill{padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--line);color:var(--ink-soft);transition:.15s}
.fpill:hover{border-color:var(--line2)}
.fpill.on{background:linear-gradient(100deg,rgba(224,182,78,.18),rgba(37,99,184,.1));color:#fff;border-color:var(--gold-soft)}
.search{width:100%;max-width:420px;padding:11px 16px;border-radius:11px;background:var(--glass);
  border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:14px;margin-bottom:20px;outline:none}
.search:focus{border-color:var(--gold-soft)}
.search::placeholder{color:var(--ink-dim)}
/* ===== Phương châm phục vụ — interactive stepper ===== */
.motto-wrap{margin:18px 0 8px}
.motto-head{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.motto-head::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
.motto-rail{display:flex;flex-direction:column;gap:0;position:relative;padding-left:8px}
.motto-step{position:relative;padding:2px 0 2px 42px;cursor:pointer;transition:.2s}
.motto-step::before{content:"";position:absolute;left:14px;top:34px;bottom:-6px;width:2px;background:linear-gradient(var(--gold-soft),rgba(197,165,114,.15))}
.motto-step:last-child::before{display:none}
.motto-node{position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy3),var(--navy2));border:2px solid var(--gold-soft);
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--gold);
  transition:.25s;z-index:2}
.motto-step:hover .motto-node,.motto-step.on .motto-node{background:var(--gold);color:var(--navy);
  border-color:var(--gold);box-shadow:0 0 20px rgba(224,182,78,.5);transform:scale(1.08)}
.motto-title{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);padding:8px 16px;
  border-radius:11px;transition:.2s;line-height:1.35}
.motto-step:hover .motto-title{color:#fff}
.motto-step.on .motto-title{color:var(--gold);background:linear-gradient(100deg,rgba(224,182,78,.1),transparent)}
.motto-exp{max-height:0;overflow:hidden;transition:max-height .35s ease;margin-left:16px}
.motto-exp-in{padding:6px 16px 14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);font-style:italic;
  border-left:2px solid rgba(224,182,78,.3)}

/* ===== Giá trị cốt lõi — 5 cards + focal ===== */
.val-intro{margin:12px 0 18px;color:var(--ink-soft);line-height:1.7}
.val-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:8px}
@media(max-width:760px){.val-grid{grid-template-columns:repeat(2,1fr)}}
.val-card{position:relative;border-radius:14px;padding:20px 14px 16px;cursor:pointer;text-align:center;
  background:linear-gradient(160deg,rgba(28,52,102,.5),rgba(16,35,80,.3));border:1px solid var(--line2);
  transition:.22s;overflow:hidden}
.val-card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(224,182,78,.14),transparent 70%);opacity:0;transition:.25s}
.val-card:hover{transform:translateY(-4px);border-color:var(--gold-soft);box-shadow:0 14px 36px rgba(0,0,0,.34)}
.val-card:hover::after,.val-card.on::after{opacity:1}
.val-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 14px 36px rgba(224,182,78,.16)}
.val-ic{width:44px;height:44px;margin:0 auto 11px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(224,182,78,.22),rgba(16,35,80,.4));border:1.5px solid var(--gold-soft)}
.val-ic svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.7}
.val-num{font-family:var(--serif);font-size:11px;color:var(--gold-soft);font-weight:700;letter-spacing:.05em}
.val-name{font-family:var(--serif);font-size:16px;font-weight:700;color:#fff;margin-top:3px}
.val-focal{margin-top:6px;border-radius:16px;overflow:hidden;max-height:0;transition:max-height .4s ease;
  background:linear-gradient(135deg,rgba(224,182,78,.09),rgba(37,99,184,.05));border:0 solid transparent}
.val-focal.show{border:1px solid rgba(224,182,78,.28);margin-top:14px}
.val-focal-in{padding:24px 28px;display:flex;gap:22px;align-items:flex-start}
@media(max-width:640px){.val-focal-in{flex-direction:column;gap:14px;padding:20px}}
.val-focal .fic{flex-shrink:0;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(224,182,78,.3),rgba(16,35,80,.5));border:2px solid var(--gold);
  box-shadow:0 0 26px rgba(224,182,78,.3)}
.val-focal .fic svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.7}
.val-focal .ftxt{flex:1}
.val-focal .fnum{font-family:var(--serif);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.val-focal .fname{font-family:var(--serif);font-size:26px;font-weight:700;color:#fff;margin:2px 0 10px}
.val-focal .fdesc{font-size:14.5px;line-height:1.75;color:var(--ink-soft)}

/* ===== Journey visual path ===== */
.jpath{position:relative;margin:8px 0 6px;padding:20px 4px 8px;overflow-x:auto}
.jpath-track{display:flex;align-items:flex-start;min-width:max-content;gap:0}
.jstop{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;
  min-width:150px;max-width:180px;padding:0 6px;transition:.2s}
.jstop-conn{position:absolute;top:23px;left:50%;width:100%;height:2px;
  background:repeating-linear-gradient(90deg,var(--gold-soft) 0 6px,transparent 6px 12px);z-index:0}
.jstop:last-child .jstop-conn{display:none}
.jstop-node{position:relative;z-index:2;width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy3),var(--navy2));border:2px solid var(--gold-soft);
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold);
  transition:.25s;margin-bottom:10px}
.jstop:hover .jstop-node{transform:scale(1.1);box-shadow:0 0 22px rgba(224,182,78,.45)}
.jstop.on .jstop-node{background:var(--gold);color:var(--navy);border-color:var(--gold);
  box-shadow:0 0 28px rgba(224,182,78,.6);transform:scale(1.12)}
.jstop-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-align:center;line-height:1.3;transition:.2s}
.jstop.on .jstop-label{color:var(--gold)}
.jstop-flag{position:absolute;top:-8px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--red);
  box-shadow:0 0 8px var(--red);opacity:0}
.jstart,.jend{display:flex;flex-direction:column;align-items:center;min-width:74px;padding-top:4px}
.jflag-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;
  background:rgba(16,35,80,.5);border:1px solid var(--line2);font-size:18px}
.jflag-lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
.jpanel{margin-top:14px;border-radius:14px;overflow:hidden;max-height:0;transition:max-height .4s ease;
  border:0 solid transparent}
.jpanel.show{border:1px solid var(--line2);background:var(--glass)}
.jpanel-in{padding:18px 22px}
.jpanel-hd{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.jpanel-hd .pn{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;flex-shrink:0}
.jpanel-hd h4{margin:0;font-size:17px;color:#fff;font-weight:700}
.jhint{font-size:12px;color:var(--ink-dim);text-align:center;margin-top:10px;font-style:italic;letter-spacing:.02em}

/* ===== Core hierarchical navigation: Chapter > Section > Article ===== */
.chapnav{margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(120deg,rgba(16,35,80,.5),rgba(10,26,58,.28))}
.chapnav.open{box-shadow:0 14px 40px rgba(0,0,0,.32)}
.chapnav-hd{display:flex;gap:18px;align-items:center;padding:20px 24px;cursor:pointer;transition:.18s}
.chapnav-hd:hover{background:rgba(28,52,102,.34)}
.chapnav-hd .cno{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--gold);line-height:.85;
  flex-shrink:0;min-width:52px;text-align:center;text-shadow:0 0 20px rgba(224,182,78,.3)}
.chapnav-hd .cmeta{flex:1;min-width:0}
.chapnav-hd .ceyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:4px}
.chapnav-hd h2{font-family:var(--serif);font-size:19px;margin:0;color:#fff;font-weight:700;line-height:1.25}
.chapnav-hd .cstat{font-size:11px;color:var(--ink-dim);margin-left:auto;flex-shrink:0;background:var(--glass2);
  padding:4px 11px;border-radius:20px;white-space:nowrap}
.chapnav-hd .ctog{font-size:22px;color:var(--gold-soft);transition:.25s;flex-shrink:0;margin-left:10px}
.chapnav.open .ctog{transform:rotate(45deg)}
.chapnav-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.chapnav-inner{padding:6px 20px 20px}
.chapnav-intro{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:2px 4px 16px;
  padding-left:14px;border-left:2px solid rgba(224,182,78,.28)}

.secnav{border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);background:var(--glass)}
.secnav.open{border-color:var(--line2)}
.secnav-hd{display:flex;gap:13px;align-items:center;padding:14px 18px;cursor:pointer;transition:.15s}
.secnav-hd:hover{background:var(--glass2)}
.secnav-hd .sic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(224,182,78,.18),rgba(37,99,184,.1));border:1px solid rgba(224,182,78,.28);
  font-family:var(--serif);font-weight:700;font-size:12px;color:var(--gold)}
.secnav-hd .stt{flex:1;font-size:13.5px;letter-spacing:.04em;font-weight:700;color:var(--gold-soft);text-transform:uppercase;line-height:1.35}
.secnav-hd .scount{font-size:11px;color:var(--ink-dim);flex-shrink:0}
.secnav-hd .stog{font-size:17px;color:var(--gold-soft);transition:.2s;flex-shrink:0}
.secnav.open .stog{transform:rotate(90deg)}
.secnav-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.secnav-inner{padding:6px 14px 14px}

/* article accordion — refined content frame */
.acc .accinner{background:linear-gradient(180deg,rgba(10,22,48,.4),transparent);border-radius:0 0 12px 12px}
.acc.open .acchd{background:linear-gradient(100deg,rgba(224,182,78,.08),rgba(37,99,184,.05));
  border-bottom:1px solid rgba(224,182,78,.16)}
.acc.open{box-shadow:0 12px 38px rgba(0,0,0,.3);border-color:rgba(224,182,78,.3)}
.artframe{border-left:2px solid rgba(224,182,78,.2);padding-left:16px;margin-top:4px}

/* ===== Do/Don't table — high-contrast dual panel ===== */
.dodont2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
@media(max-width:600px){.dodont2{grid-template-columns:1fr}}
.dd-col{border-radius:14px;overflow:hidden;border:1px solid transparent}
.dd-do{background:linear-gradient(165deg,rgba(46,160,110,.16),rgba(46,160,110,.04));border-color:rgba(80,200,140,.34)}
.dd-dont{background:linear-gradient(165deg,rgba(224,70,70,.15),rgba(224,70,70,.04));border-color:rgba(240,120,120,.32)}
.dd-hd{display:flex;align-items:center;gap:9px;padding:11px 16px;font-weight:800;font-size:13px;letter-spacing:.04em;
  text-transform:uppercase}
.dd-do .dd-hd{color:#7fe0ad;background:rgba(46,160,110,.14);border-bottom:1px solid rgba(80,200,140,.24)}
.dd-dont .dd-hd{color:#f4a0a0;background:rgba(224,70,70,.13);border-bottom:1px solid rgba(240,120,120,.24)}
.dd-hd .dd-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.dd-do .dd-ic{background:rgba(80,200,140,.28);color:#aef5cf}
.dd-dont .dd-ic{background:rgba(240,120,120,.28);color:#ffc9c9}
.dd-list{padding:8px 8px 10px}
.dd-item{display:flex;gap:10px;padding:9px 10px;font-size:13.5px;line-height:1.55;border-radius:9px;transition:.15s}
.dd-item:hover{background:rgba(255,255,255,.03)}
.dd-item .dd-mk{flex-shrink:0;font-weight:700;margin-top:1px}
.dd-do .dd-item{color:var(--ink-soft)}.dd-do .dd-mk{color:#7fe0ad}
.dd-dont .dd-item{color:var(--ink-soft)}.dd-dont .dd-mk{color:#f4a0a0}

/* ===== Text-heavy article as cards (Điều 8 etc.) ===== */
.para-cards{display:grid;gap:12px;margin:10px 0}
.para-card{position:relative;border-radius:14px;padding:16px 18px 16px 20px;
  background:linear-gradient(150deg,rgba(28,52,102,.4),rgba(16,35,80,.22));border:1px solid var(--line);
  transition:.2s}
.para-card:hover{border-color:var(--line2);transform:translateX(3px)}
.para-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:linear-gradient(var(--gold),var(--gold-soft))}
.para-card .pc-n{position:absolute;top:14px;right:16px;font-family:var(--serif);font-size:26px;font-weight:700;
  color:rgba(224,182,78,.16);line-height:1}

const PR_GROUPS=[
  {art:"9", name:"Kết quả & niềm tin", codes:[1,2,3], sub:"Đích phục vụ: kết quả, sự rõ ràng, giữ cam kết"},

];
function extractPrinciples(article){
  // returns [{n, title, req, do, check}]
  const out=[];let cur=null;let field=null;
  article.blocks.forEach(b=>{
    const nm=b.s==="nt"&&b.t.match(/^Nguyên tắc\s+(\d+)\s+(.+)/);
    if(nm){cur={n:+nm[1],title:nm[2].trim(),req:"",act:"",chk:""};out.push(cur);field=null;return;}
    if(!cur)return;
    if(b.s==="label"){
      if(/^Yêu cầu:/.test(b.t)){field="req";cur.req=b.t.replace(/^Yêu cầu:\s*/,"");}
      else if(/^Thực hiện và tự kiểm:/.test(b.t)){field="act";cur.act=b.t.replace(/^Thực hiện và tự kiểm:\s*/,"");}
      else if(/^Câu tự kiểm:/.test(b.t)){field="chk";cur.chk=b.t.replace(/^Câu tự kiểm:\s*/,"");}
      return;
    }
    if(b.s==="p"&&field){cur[field]=(cur[field]?cur[field]+" ":"")+b.t;}
  });
  return out;
}
function principlesSystematic(sec){

    card.onclick=()=>{

      // self-check flow

        <span class="pf-step">Thực hiện đúng</span><span class="pf-arr">→</span>

      dIn.appendChild(flow);

        const cb=wrap.closest(".chapnav-body");if(cb)cb.style.maxHeight=cb.firstElementChild.scrollHeight+2600+"px";
      },60);
    };
    groups.appendChild(card);
  });
  wrap.appendChild(groups);wrap.appendChild(detail);
  wrap.appendChild(el("div","jhint","Chọn một nhóm nguyên tắc để xem 3 nguyên tắc thành phần và mạch tự kiểm"));
  return wrap;
}

        `<div class="sic">${sec.num}</div><div class="stt">${esc(sec.title)}</div>
         <div class="scount">${sec.articles.length} điều</div><div class="stog">›</div>`);
      const sbody=el("div","secnav-body");const sinner=el("div","secnav-inner");
      // SPECIAL: Mục IV (Chương I) — 12 nguyên tắc systematic overview
      if(ch.num==="I"&&/NGUYÊN TẮC PHỤC VỤ VÀ KIẾN TẠO/i.test(sec.title)){
        sinner.appendChild(principlesSystematic(sec));

      }

function mottoStepper(mottos){
  const wrap=el("div","motto-wrap");

    const step=el("div","motto-step");
    step.innerHTML=`<div class="motto-node">${i+1}</div><div class="motto-title">${esc(m.title)}</div>`;
    const exp=el("div","motto-exp");
    if(m.exp){const ei=el("div","motto-exp-in",esc(m.exp));exp.appendChild(ei);}
    step.appendChild(exp);
    step.onclick=()=>{
      const isOpen=step.classList.contains("on");
      rail.querySelectorAll(".motto-step").forEach(s=>{s.classList.remove("on");s.querySelector(".motto-exp").style.maxHeight="0";});
      if(!isOpen&&m.exp){step.classList.add("on");exp.style.maxHeight=exp.scrollHeight+"px";}
    };
    rail.appendChild(step);
  });
  wrap.appendChild(rail);
  return wrap;
}

function extractValues(blocks){
  const vals=[];let cur=null;
  blocks.forEach(b=>{
    const m=b.s==="h4"&&b.t.match(/^\d+\.\s*(.+)/);
    if(m){cur={name:m[1].trim(),desc:""};vals.push(cur);}
    else if(cur&&b.s==="p"){cur.desc=(cur.desc?cur.desc+" ":"")+b.t;}
  });
  return vals;
}

function articleAcc(a){
  const acc=el("div","acc");acc.id="art-"+a.num;
  const hd=el("div","acchd",`<div class="anum">Điều<b>${a.num}</b></div><h3>${esc(a.title)}</h3><div class="atog">+</div>`);
  hd.onclick=()=>{acc.classList.toggle("open");openBody(acc);};
  acc.appendChild(hd);
  const body=el("div","accbody");const inner=el("div","accinner");

  // SPECIAL: Điều 4 — Giá trị cốt lõi as interactive cards
  if(a.num==="4"){
    const introB=a.blocks.find(b=>b.s==="p");
    if(introB)inner.appendChild(el("p","val-intro",esc(introB.t)));
    const vals=extractValues(a.blocks).slice(0,5);
    if(vals.length===5){
      inner.appendChild(valueCards(vals));
      inner.appendChild(el("div","jhint","Chọn một giá trị để xem trình bày chi tiết"));
      body.appendChild(inner);acc.appendChild(body);return acc;
    }
  }

  // SPECIAL: Điều 8 — text-heavy → paragraph cards (only its own 3 paragraphs)
  if(a.num==="8"){
    const tags=["Một EVN trong cảm nhận khách hàng","Phối hợp cùng chịu trách nhiệm","Nhân văn và nghĩa tình"];
    const paras=[];
    for(const b of a.blocks){
      if(b.s!=="p")continue;
      if(/^MỤC\s|^Bộ 12 nguyên tắc|^Bảng t? ?ra cứu|^Mỗi nguyên tắc là một trục/i.test(b.t))break;
      paras.push(b);
    }
    if(paras.length>=3){
      const grid=el("div","para-cards");
      paras.slice(0,3).forEach((p,i)=>{
        const card=el("div","para-card");
        card.innerHTML=`<div class="pc-n">${i+1}</div>`+(tags[i]?`<div class="pc-tag">${esc(tags[i])}</div>`:"")+`<p>${esc(p.t)}</p>`;
        grid.appendChild(card);
      });
      inner.appendChild(grid);
      body.appendChild(inner);acc.appendChild(body);return acc;
    }
  }

  // find phương châm range for Điều 1
  let pcStart=-1;
  if(a.num==="1"){pcStart=a.blocks.findIndex(b=>b.s==="h4"&&/^3\.\s*Phương châm/.test(b.t));}

  let ul=null;
  a.blocks.forEach((b,bi)=>{
    // SPECIAL: Điều 1 — render "3. Phương châm phục vụ" as interactive stepper
    if(a.num==="1"&&pcStart>=0){
      if(bi===pcStart){
        ul=null;
        inner.appendChild(el("h4",null,esc(b.t)));
        // titles = the 5 "(N) ..." lines
        const titles=[];
        for(let k=bi+1;k<a.blocks.length;k++){
          const mm=a.blocks[k].t.match(/^\((\d)\)\s*(.+?)\.?$/);
          if(mm)titles.push(mm[2].trim());else break;
        }
        // explanations: quotes (for motto 2-5) + paragraph pair (for motto 1)
        const quotes=a.blocks.filter(x=>x.s==="quote").map(x=>x.t.replace(/^["""]/,"").replace(/["""]$/,"").trim());
        const mottos=titles.map((t,ti)=>{
          let exp=quotes.find(q=>q.slice(0,18).includes(t.slice(0,12)));
          if(!exp){
            // motto 1 explanation lives in paragraphs referencing "thắp sáng niềm tin ... yêu cầu xuyên suốt"
            const parts=a.blocks.filter(x=>x.s==="p"&&/thắp sáng niềm tin.*yêu cầu xuyên suốt|Mỗi điểm chạm, dù trực tiếp/.test(x.t)).map(x=>x.t.trim());
            if(parts.length)exp=parts.join(" ");
          }
          if(!exp)exp="Phương châm này là một trong năm định hướng hành động cốt lõi, chuyển hóa triết lý phục vụ thành hành vi cụ thể trong từng điểm chạm với khách hàng.";
          return {title:t,exp:exp};
        });
        inner.appendChild(mottoStepper(mottos));
        return;
      }
      if(bi>pcStart){
        // skip motto lines, the Diễn giải block and all quote explanations of the phương châm
        if(/^\(\d\)\s/.test(b.t))return;
        if(b.s==="quote")return;
        if(b.s==="label"&&/^Diễn giải/.test(b.t))return;
        // skip the phương châm diễn giải paragraphs (they are folded into stepper)
        if(/thắp sáng niềm tin|phương châm phục vụ|Mỗi điểm chạm|Với từng nhóm/i.test(b.t))return;
      }
    }
    if(b.s==="li"||b.s==="quote"||b.s==="ntquick"){
      if(!ul){ul=el("ul");inner.appendChild(ul);}
      if(b.s==="quote"){const li=el("li");li.appendChild(el("div","quote",esc(b.t)));ul.appendChild(li);}
      else if(b.s==="ntquick"){const m=b.t.match(/^(NT\d+):\s*(.+)/);ul.appendChild(el("li",null,m?("<b>"+m[1]+":</b> "+esc(m[2])):esc(b.t)));}
      else ul.appendChild(el("li",null,esc(b.t)));
      return;
    }
    ul=null;
    if(b.s==="nt"){
      const m=b.t.match(/^Nguyên tắc\s+(\d+)\.\s*(.+)/);
      if(m)inner.appendChild(el("div","ntcard",`<div class="ntn">${m[1]}</div><div><h5>Nguyên tắc ${m[1]}</h5><p>${esc(m[2])}</p></div>`));
      else inner.appendChild(el("p",null,esc(b.t)));
    }
    else if(b.s==="h4")inner.appendChild(el("h4",null,esc(b.t)));
    else if(b.s==="label")inner.appendChild(el("p","lbl",esc(b.t)));
    else inner.appendChild(el("p",null,esc(b.t)));
  });
  body.appendChild(inner);acc.appendChild(body);
  return acc;
}

function openJourney(i){
  const j=JM.journeys[i];const d=$("#jdetail");d.innerHTML="";
  const wrap=el("div");wrap.className="jdetail";
  wrap.appendChild(el("div","eyebrow",`Hành trình ${i+1}/15${PRIO.includes(j.code)?" · Trọng yếu":""}`));

  const artNum=MAP.jm_to_art[j.code];
  const link=el("div","chips");link.style.margin="4px 0 8px";
  const lb=el("div","chip",`§ Điều ${artNum} · ${esc(artTitle(artNum))}`);
  lb.onclick=()=>go("core",artNum);link.appendChild(lb);
  wrap.appendChild(link);
  wrap.appendChild(el("hr","rule"));

  // ---- parse blocks into structured journey ----
  const J={pain:[],touchpoints:[],sample:[]};
  let mode=null,curTP=null;
  j.blocks.forEach(b=>{
    if(b.type==="table"){
      if(mode==="tp"&&curTP)curTP.table=b.rows;
      return;
    }
    const s=b.t.trim();
    if(/^Điểm dễ (gãy|đứt gãy) chủ đạo/i.test(s)){mode="pain";return;}
    if(/^▸\s*Điểm chạm/.test(s)){mode="tp";curTP={name:s.replace(/^▸\s*Điểm chạm:\s*/,"").trim(),table:null};J.touchpoints.push(curTP);return;}
    if(/^◆\s*Tình huống/.test(s)){mode="sample";return;}
    if(mode==="pain"){J.pain.push(s);mode="painmore";return;}
    if(mode==="painmore"){J.pain.push(s);return;}
    if(mode==="sample"){J.sample.push(s);return;}
  });

  // ---- pain box ----
  if(J.pain.length){
    const pb=el("div","painbox",`<div class="pt">Điểm dễ gãy chủ đạo</div>`);
    J.pain.forEach(p=>pb.appendChild(el("p",null,esc(p))));
    wrap.appendChild(pb);
  }

  // ---- VISUAL JOURNEY PATH ----

    wrap.appendChild(el("div","chiplbl","Hành trình trực quan qua các điểm chạm"));
    const path=el("div","jpath");
    const track=el("div","jpath-track");

    const start=el("div","jstart");
    start.innerHTML=`<div class="jflag-ic">▶</div><div class="jflag-lb">Bắt đầu</div>`;
    track.appendChild(start);
    // stops
    J.touchpoints.forEach((tp,ti)=>{
      const stop=el("div","jstop");
      stop.innerHTML=`<div class="jstop-conn"></div><div class="jstop-node">${ti+1}</div><div class="jstop-label">${esc(tp.name)}</div>`;
      stop.onclick=()=>{
        const wasOn=stop.classList.contains("on");
        track.querySelectorAll(".jstop").forEach(x=>x.classList.remove("on"));
        if(wasOn){panel.classList.remove("show");panel.style.maxHeight="0";return;}
        stop.classList.add("on");
        pIn.innerHTML="";
        const hd=el("div","jpanel-hd");
        hd.innerHTML=`<div class="pn">${ti+1}</div><h4>${esc(tp.name)}</h4>`;
        pIn.appendChild(hd);
        if(tp.table)pIn.appendChild(tableEl(tp.table,"tier"));
        panel.classList.add("show");panel.style.maxHeight=panel.scrollHeight+80+"px";
        panel.scrollIntoView({behavior:"smooth",block:"nearest"});
      };
      track.appendChild(stop);
    });
    // end flag
    const end=el("div","jend");
    end.innerHTML=`<div class="jflag-ic">◉</div><div class="jflag-lb">Cảm nhận tích cực</div>`;
    track.appendChild(end);
    path.appendChild(track);
    wrap.appendChild(path);
    const panel=el("div","jpanel");const pIn=el("div","jpanel-in");panel.appendChild(pIn);
    wrap.appendChild(panel);
    wrap.appendChild(el("div","jhint","Chọn một điểm chạm để xem ma trận hành vi Chuẩn · Tốt · Tỏa sáng"));
    // auto-open first touchpoint
    setTimeout(()=>{const first=track.querySelector(".jstop");if(first)first.click();},80);
  }

  // ---- sample situation ----
  if(J.sample.length){
    wrap.appendChild(el("div","chiplbl","Tình huống tiêu biểu minh họa"));
    const sb=el("div","samplebox");
    J.sample.forEach(s=>{
      const fm=s.match(/^(Bối cảnh|Hướng ứng xử đúng|Điều cần tránh)\.?\s*(.*)/);
      if(fm){const f=el("div","field");f.appendChild(el("div","ft",fm[1]));f.appendChild(el("p",null,esc(fm[2])));sb.appendChild(f);}
      else sb.appendChild(el("p",null,esc(s)));
    });
    wrap.appendChild(sb);
  }

  // key3
  if(j.key3){wrap.appendChild(el("div","chiplbl","Ba điều then chốt cần nhớ"));
    const k=el("div","key3");
    j.key3.forEach(r=>k.appendChild(el("div","k",`<div class="kk">${esc(r[0])}</div><p>${esc(r[1])}</p>`)));
    wrap.appendChild(k);}
  // cbcnv
  if(j.cbcnv){wrap.appendChild(el("div","chiplbl","Định hướng theo nhóm cán bộ, công nhân viên"));
    wrap.appendChild(tableEl(j.cbcnv,""));}
  // related situations
  const sits=sitsForJourney(j.code);
  if(sits.length){wrap.appendChild(el("div","chiplbl","Tình huống ứng xử liên quan (Mô-đun 03)"));
    const row=el("div","chips");
    sits.forEach(code=>{const b=el("div","chip","❖ "+code);const st=sitByCode(code);if(st)b.title=st.title;
      b.onclick=()=>go("casebook",code);row.appendChild(b);});
    wrap.appendChild(row);}

  d.appendChild(wrap);d.scrollIntoView({behavior:"smooth",block:"start"});

function sitAcc(s){
  const acc=el("div","sit");acc.id="sit-"+cssEsc(s.code);acc.dataset.code=s.code;
  const hd=el("div","sithd",`<div class="scode">${s.code}</div><div class="stt">${esc(s.title)}</div><div class="stog">+</div>`);

  // ---- signature: anchor box (cross-reference to Bộ Quy tắc) ----
  inner.appendChild(buildAnchor(s));

  // ---- situation content ----
  let sayMode=false;
  s.blocks.forEach(b=>{
    if(b.type==="table"){
      const head=(b.rows[0]||[]).join(" ");
      if(/Nên làm|Không được làm|Nên và không/i.test(head)){inner.appendChild(dodontPanel(b.rows));return;}
      inner.appendChild(tableEl(b.rows,"dodont"));return;
    }
    const t=b.t.trim();
    const fm=t.match(/^(Bối cảnh|Hành vi nên và không nên|Mẫu câu chuẩn|Mục tiêu cần đạt[^.]*)\.\s*(.*)/);
    if(fm){

      if(/nên và không nên/.test(fm[1])){inner.appendChild(el("div","sfl","Hành vi nên · không nên"));return;}
      if(/Mẫu câu/.test(fm[1])){inner.appendChild(el("div","sfl","Mẫu câu chuẩn"));return;}
    }
    if(t.startsWith("“")||t.startsWith('"')){inner.appendChild(el("div","say",esc(t)));return;}
    inner.appendChild(el("p",null,esc(t)));
  });
  body.appendChild(inner);acc.appendChild(body);
  return acc;

    const badge=el("div","abadge","NT"+nt+" → Điều "+art);
    badge.onclick=()=>go("core",art);
    const desc=el("div","adesc",`<b>Nguyên tắc ${nt}: ${esc(MAP.nt_names[nt]||m[2])}.</b> Được quy định tại Điều ${art} (${esc(artTitle(art))}), Chương I. Tình huống là cách vận dụng nguyên tắc này vào thực tế phục vụ.`);
    row.appendChild(badge);row.appendChild(desc);box.appendChild(row);
    seenArt[art]=true;
  });
  // journey anchor (which hành trình article)
  const js=journeysForSit(s.code);
  if(js.length){
    const arts=[...new Set(js.map(n=>MAP.journey_to_art[String(n)]).filter(Boolean))];
    arts.forEach(art=>{
      if(seenArt["j"+art])return;seenArt["j"+art]=true;
      const jnames=js.filter(n=>MAP.journey_to_art[String(n)]===art).map(n=>journeyName(n));
      const row=el("div","arow");
      const badge=el("div","abadge","HT → Điều "+art);
      badge.onclick=()=>go("core",art);
      row.appendChild(badge);
      row.appendChild(el("div","adesc",`<b>Hành trình: ${esc(jnames.join(", "))}.</b> Ứng xử theo Điều ${art} (${esc(artTitle(art))}), Chương III — quy tắc thực thi cho hành trình này.`));
      box.appendChild(row);
    });
  }
  return box;
}
function journeysForSit(code){
  const out=[];
  (CB.index_journey||[]).forEach(r=>{
    const m=r[0]&&r[0].match(/^(\d+)\./);
    if(m&&r[1]&&r[1].split(",").map(x=>x.trim()).includes(code))out.push(parseInt(m[1],10));
  });
  return out;
}
function journeyName(n){
  const r=(CB.index_journey||[]).find(x=>x[0]&&x[0].match(new RegExp("^"+n+"\\.")));
  return r?r[0].replace(/^\d+\.\s*/,""):("Hành trình "+n);
}
function sitByCode(code){for(const g of CB.groups)for(const s of g.situations)if(s.code===code)return s;return null;}
function filterGroup(g){document.querySelectorAll("#cbhost .grpblk").forEach(b=>b.hidden=(g!=="all"&&b.dataset.g!==g));}
function filterSits(q){
  document.querySelectorAll("#cbhost .grpblk").forEach(b=>{
    let any=false;
    b.querySelectorAll(".sit").forEach(s=>{
      const txt=(s.textContent+" "+s.dataset.code).toLowerCase();
      const show=!q||txt.includes(q);s.hidden=!show;if(show)any=true;});
    b.hidden=!any;
  });
}

/* ================= shared ================= */
function crumb(parts){const c=el("div","crumb");c.innerHTML=parts.map((p,i)=>i<parts.length-1?"<span>"+esc(p)+"</span> › ":esc(p)).join("");return c;}
function footer(c){c.appendChild(el("div","footn",`<div class="fq">"Văn hóa dẫn dắt hành vi. Hành vi tạo trải nghiệm. Trải nghiệm làm nên thương hiệu."</div>Bộ Quy tắc Ứng xử Văn hóa Kinh doanh & Dịch vụ Khách hàng · Tập đoàn Điện lực Việt Nam`));}
function roman(n){const M={"1":"I","2":"II","3":"III","4":"IV","5":"V","6":"VI","7":"VII","8":"VIII","I":"I","II":"II","III":"III","IV":"IV","V":"V","VI":"VI","VII":"VII","VIII":"VIII"};return M[n]||n;}
function properCase(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* particles */
function particles(){
  const cv=$("#particles");if(!cv)return;const ctx=cv.getContext("2d");
  let W,H,pts;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    pts=Array.from({length:Math.min(60,Math.floor(W/28))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,r:Math.random()*1.6+.4}));}
  rs();addEventListener("resize",rs);
  (function loop(){ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle="rgba(224,182,78,.5)";ctx.fill();});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle="rgba(120,160,230,"+(.10*(1-d/120))+")";ctx.stroke();}}
    requestAnimationFrame(loop);})();
}

buildNav();render();particles();
