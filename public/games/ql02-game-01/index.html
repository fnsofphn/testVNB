<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>QL02 Game 01 v2</title>
    <style>
      :root {
        --navy: #082f69;
        --blue: #0a4cad;
        --blue2: #1d69d5;
        --ink: #10233f;
        --muted: #64748b;
        --line: #dbe6f2;
        --orange: #f2a900;
        --green: #138a4b;
        --red: #c53f3f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        min-height: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #f8fbff, #e8f1fb);
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #f2a900;
        outline-offset: 3px;
      }
      .app {
        width: min(1120px, calc(100% - 28px));
        margin: auto;
      }
      .top {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--navy), var(--blue2));
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 900;
      }
      .brand b,
      .brand span {
        display: block;
      }
      .brand span {
        font-size: 12px;
        color: var(--muted);
      }
      .screen {
        padding: 34px 0 72px;
      }
      .hero {
        min-height: calc(100vh - 150px);
        display: grid;
        grid-template-columns: 1.1fr 0.72fr;
        align-items: center;
        gap: 60px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--blue);
      }
      h1 {
        font-size: clamp(44px, 6vw, 72px);
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--navy);
        margin: 15px 0;
      }
      h1 em {
        color: var(--blue2);
        font-style: normal;
      }
      .hero-title {
        font-size: clamp(44px, 5.2vw, 66px);
        line-height: 0.98;
        letter-spacing: -0.055em;
        max-width: 780px;
      }
      .hero-title > span {
        display: block;
      }
      .hero-title .nowrap {
        display: inline;
        white-space: nowrap;
      }
      .lead {
        font-size: 17px;
        line-height: 1.7;
        color: #53677f;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 27px;
        box-shadow: 0 20px 55px rgba(25, 62, 105, 0.13);
      }
      label {
        display: block;
        margin-top: 15px;
        font-size: 13px;
        font-weight: 800;
        color: #41566e;
      }
      input {
        width: 100%;
        margin-top: 7px;
        padding: 14px;
        border: 1px solid #cad9e9;
        border-radius: 12px;
      }
      .btn {
        border: 0;
        border-radius: 13px;
        min-height: 48px;
        padding: 0 18px;
        font-weight: 850;
      }
      .primary {
        color: #fff;
        background: linear-gradient(135deg, var(--navy), var(--blue2));
        box-shadow: 0 12px 24px rgba(10, 76, 173, 0.22);
      }
      .wide {
        width: 100%;
        margin-top: 20px;
      }
      .secondary {
        color: var(--blue);
        background: #eaf3ff;
      }
      .flow {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 26px;
      }
      .rules {
        display: grid;
        gap: 9px;
        margin-top: 22px;
      }
      .rule {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.78);
      }
      .rule > span {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--navy);
        color: #fff;
        font-weight: 900;
      }
      .rule small {
        color: var(--muted);
      }
      .rule strong {
        color: var(--blue);
        white-space: nowrap;
      }
      .pill {
        padding: 8px 11px;
        border-radius: 999px;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
      }
      .brief-head {
        text-align: center;
        max-width: 820px;
        margin: 0 auto 24px;
      }
      .brief-head h2,
      .guide h2,
      .round-intro h2 {
        color: var(--navy);
        font-size: clamp(32px, 4.5vw, 50px);
        letter-spacing: -0.04em;
        margin: 10px 0;
      }
      .tabshell {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 15px;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tabs button {
        min-height: 56px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        text-align: left;
        padding: 12px 14px;
        color: #53677e;
        font-weight: 850;
      }
      .tabs button.active {
        background: linear-gradient(135deg, var(--navy), var(--blue2));
        color: #fff;
      }
      .tabbody {
        min-height: 360px;
      }
      .tabbody h3 {
        font-size: 28px;
        color: var(--navy);
      }
      .brief-sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .brief-section {
        box-shadow: none;
      }
      .brief-section h3 {
        margin-top: 0;
        color: var(--navy);
        font-size: 20px;
      }
      .brief-section.data-section {
        grid-column: 1 / -1;
      }
      .brief-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }
      .callout {
        background: #fff7e4;
        border-left: 5px solid var(--orange);
        padding: 15px;
        border-radius: 0 12px 12px 0;
        color: #74520f;
        font-weight: 700;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
      }
      .fact {
        background: #f3f8fe;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px;
      }
      .fact small,
      .fact b,
      .fact span {
        display: block;
      }
      .fact b {
        color: var(--blue);
        font-size: 22px;
        margin: 7px 0;
      }
      .center {
        text-align: center;
      }
      .levelgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 25px 0;
      }
      .level {
        background: #fff;
        border: 1px solid var(--line);
        border-top: 5px solid var(--accent);
        border-radius: 18px;
        padding: 18px;
        text-align: left;
      }
      .level p {
        min-height: 42px;
      }
      .level.active {
        outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
        transform: translateY(-3px);
      }
      .round-intro {
        min-height: calc(100vh - 150px);
        display: grid;
        place-content: center;
        text-align: center;
      }
      .roundnum {
        font-size: 100px;
        font-weight: 950;
        color: transparent;
        -webkit-text-stroke: 2px #b0c8e5;
        line-height: 0.8;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .meta > div:first-child {
        display: grid;
        gap: 4px;
      }
      .score {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 9px 14px;
        color: var(--blue);
        font-weight: 900;
      }
      .progress {
        height: 8px;
        background: #dbe8f5;
        border-radius: 99px;
        margin: 15px 0 28px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--orange));
      }
      .contextlayout {
        display: grid;
        grid-template-columns: 0.78fr 1.22fr;
        gap: 18px;
      }
      .context {
        align-self: start;
      }
      .context h3 {
        color: var(--blue);
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .evidence {
        list-style: none;
        padding: 0;
      }
      .evidence li {
        background: #f5f9fe;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px;
        margin: 7px 0;
        font-size: 12px;
      }
      .qcard {
        background: linear-gradient(145deg, #072d65, #0a4cad);
        color: #fff;
        border-radius: 22px;
        padding: 28px;
      }
      .qcard blockquote {
        font-size: clamp(25px, 3vw, 36px);
        line-height: 1.25;
        margin: 26px 0;
      }
      .qcard p {
        color: #d6e6fa;
      }
      .tools {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        align-items: center;
      }
      .tools button {
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-radius: 9px;
        padding: 8px 10px;
      }
      .tools button.active {
        background: #fff;
        color: var(--navy);
      }
      .brief-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      .brief-heading h2 {
        margin-bottom: 0;
      }
      .brief-heading .btn {
        flex: 0 0 auto;
      }
      .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .answers button,
      .options button,
      .decisions button {
        border: 1px solid var(--line);
        border-left: 5px solid var(--accent, #9db2cb);
        background: #fff;
        border-radius: 15px;
        padding: 15px;
        text-align: left;
        color: var(--ink);
      }
      .answers button b,
      .answers button small {
        display: block;
      }
      .answers button small {
        color: var(--muted);
        margin-top: 4px;
      }
      .upgrade {
        max-width: 950px;
        margin: auto;
      }
      .upgradehead {
        background: linear-gradient(145deg, #072d65, #0a4cad);
        color: #fff;
        border-radius: 22px;
        padding: 26px;
      }
      .upgradehead blockquote {
        background: rgba(255, 255, 255, 0.1);
        border-left: 5px solid var(--orange);
        padding: 14px;
        font-size: 20px;
      }
      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 14px 0;
      }
      .options button {
        display: flex;
        gap: 11px;
        min-height: 92px;
      }
      .options button.selected {
        border-color: var(--blue2);
        background: #edf6ff;
      }
      .box {
        width: 33px;
        height: 33px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: #eaf3ff;
        color: var(--blue);
        font-weight: 900;
        flex: none;
      }
      .selected .box {
        background: var(--blue);
        color: #fff;
      }
      .options small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
      }
      .pickfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sequence {
        max-width: 820px;
        margin: auto;
      }
      .seqcard {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 13px;
        margin: 9px 0;
      }
      .seqcard .n {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        border-radius: 9px;
        font-weight: 900;
      }
      .seqcard .txt {
        flex: 1;
      }
      .moves button {
        border: 0;
        background: #edf4fc;
        color: var(--blue);
        border-radius: 8px;
        width: 33px;
        height: 33px;
      }
      .decisionhead {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 25px;
      }
      .decisions {
        display: grid;
        gap: 9px;
        margin-top: 13px;
      }
      .decisions button {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 78px;
      }
      .decisions button span {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        border-radius: 10px;
        font-weight: 900;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(5, 25, 52, 0.62);
        display: grid;
        place-items: center;
        padding: 18px;
        z-index: 10;
      }
      .feedback {
        width: min(620px, 100%);
        max-height: 90vh;
        overflow: auto;
      }
      .feedback h3 {
        text-align: center;
        color: var(--navy);
        font-size: 27px;
      }
      .fsec {
        background: #f5f9fe;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        margin-top: 10px;
      }
      .fsec b {
        color: var(--blue);
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .fsec p {
        color: #51657d;
        line-height: 1.55;
      }
      .result {
        text-align: center;
      }
      .ring {
        width: 170px;
        height: 170px;
        border-radius: 50%;
        margin: 20px auto;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--blue2) var(--angle), #dce8f5 0);
        position: relative;
      }
      .ring:before {
        content: "";
        position: absolute;
        inset: 13px;
        background: #f8fbff;
        border-radius: 50%;
      }
      .ring div {
        z-index: 1;
      }
      .ring b {
        display: block;
        font-size: 42px;
        color: var(--navy);
      }
      .resultgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px;
        margin: 24px 0;
        text-align: left;
      }
      .memory {
        background: linear-gradient(145deg, #072d65, #0a4cad);
        color: #fff;
        border-radius: 22px;
        padding: 24px;
      }
      .memgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 16px;
      }
      .memgrid div {
        background: rgba(255, 255, 255, 0.1);
        border-top: 4px solid var(--accent);
        padding: 12px;
        border-radius: 11px;
      }
      .hide {
        display: none !important;
      }
      @media (min-width: 851px) and (max-height: 760px) {
        .top {
          height: 56px;
        }
        .screen {
          padding: 12px 0 36px;
        }
        .brief-heading {
          align-items: center;
          margin-bottom: 12px;
        }
        .brief-head {
          max-width: 820px;
          margin: 0;
          text-align: left;
        }
        .brief-head h2,
        .guide h2,
        .round-intro h2 {
          margin: 4px 0;
          font-size: 36px;
        }
        .lead {
          margin: 6px 0;
          font-size: 15px;
          line-height: 1.45;
        }
        .tabs button {
          min-height: 48px;
          padding: 8px 12px;
        }
        .tabbody {
          min-height: 0;
          padding: 20px;
        }
        .tabbody h3 {
          margin: 4px 0 14px;
          font-size: 24px;
        }
        .fact {
          padding: 10px;
        }
        .fact b {
          margin: 4px 0;
        }
      }
      @media (max-width: 850px) {
        .top {
          height: 60px;
        }
        .screen {
          padding: 16px 0 44px;
        }
        .hero,
        .tabshell,
        .contextlayout,
        .brief-sections {
          grid-template-columns: 1fr;
        }
        .hero {
          min-height: auto;
          gap: 24px;
          padding-bottom: 24px;
        }
        .card {
          padding: clamp(18px, 4vw, 24px);
          border-radius: 18px;
        }
        .brief-head {
          margin-bottom: 0;
        }
        .brief-head h2,
        .guide h2,
        .round-intro h2 {
          font-size: clamp(30px, 7vw, 40px);
        }
        .tabbody {
          min-height: 0;
        }
        .tabs {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .levelgrid,
        .facts,
        .memgrid {
          grid-template-columns: 1fr 1fr;
        }
        .brief-heading {
          align-items: stretch;
          flex-direction: column;
          gap: 12px;
        }
        .brief-heading .btn {
          width: 100%;
        }
        .brief-section.data-section {
          grid-column: auto;
        }
        .brief-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 580px) {
        .app {
          width: min(100% - 20px, 1120px);
        }
        .hero {
          padding-top: 0;
        }
        h1,
        .hero-title {
          font-size: 36px;
          line-height: 1.03;
        }
        .brief-head h2,
        .guide h2,
        .round-intro h2 {
          font-size: 30px;
        }
        .tabs,
        .levelgrid,
        .facts,
        .answers,
        .options,
        .resultgrid,
        .memgrid {
          grid-template-columns: 1fr;
        }
        .tools,
        .pickfoot {
          flex-direction: column;
          align-items: stretch;
        }
        .brief-actions,
        .rule {
          grid-template-columns: 1fr;
        }
        .brief-actions {
          display: grid;
        }
        .rule > span {
          display: none;
        }
        .qcard {
          padding: 21px;
        }
        .qcard blockquote {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="mark">QL</div>
          <div>
            <b>QL02 · Game 01</b
            ><span>Từ số liệu đến kiến nghị hành động · v2.1</span>
          </div>
        </div>
        <span id="status" class="eyebrow"></span>
      </header>
      <main id="root"></main>
    </div>
    <script>
      const DATA = {
        LEVELS: [
          {
            id: "data",
            short: "Số liệu",
            name: "Tầng 1 · Số liệu",
            question: "Bao nhiêu?",
            description: "Một giá trị được ghi nhận, chưa có bối cảnh so sánh.",
            accent: "#3182ce",
            icon: "01",
          },
          {
            id: "information",
            short: "Thông tin",
            name: "Tầng 2 · Thông tin",
            question: "Thay đổi thế nào?",
            description:
              "Số liệu đã được đặt trong bối cảnh, xu hướng hoặc so sánh.",
            accent: "#6b46c1",
            icon: "02",
          },
          {
            id: "signal",
            short: "Tín hiệu quản trị",
            name: "Tầng 3 · Tín hiệu quản trị",
            question: "Điều gì đáng ưu tiên?",
            description:
              "Chỉ ra điểm nóng, mẫu hình hoặc ngoại lệ có thể làm thay đổi ưu tiên quản lý.",
            accent: "#d97706",
            icon: "03",
          },
          {
            id: "action",
            short: "Kiến nghị hành động",
            name: "Tầng 4 · Kiến nghị hành động",
            question: "Ai làm gì, khi nào?",
            description:
              "Nêu chủ thể, việc cần làm, phạm vi, thời hạn hoặc cơ chế theo dõi.",
            accent: "#15803d",
            icon: "04",
          },
        ],
        CASE_BRIEF: {
          title: "Sự cố trung áp tăng",
          role: "Bạn là Trưởng/Phó phòng chuyên môn đang rà soát hồ sơ sự cố trung áp trước khi trình Giám đốc.",
          what: "Ba tháng gần đây, số sự cố trung áp và SAIDI cùng tăng. Dự thảo hiện có nhiều số liệu nhưng chưa chỉ rõ lãnh đạo cần ưu tiên ở đâu.",
          why: "Giám đốc cần quyết định có tập trung nguồn lực vào một nhóm tuyến trọng điểm và phê duyệt kế hoạch xử lý 30 ngày hay không.",
          mission:
            "Phân loại nội dung vào bốn tầng Số liệu – Thông tin – Tín hiệu quản trị – Kiến nghị hành động; sau mỗi lựa chọn, xem lý do và cách nâng cấp phát biểu.",
          facts: [
            {
              label: "Sự cố",
              value: "18 → 31",

          ok,
          ok ? "Chuỗi lập luận chính xác" : "Chuỗi chưa đúng logic",
          "Số liệu → Thông tin → Tín hiệu quản trị → Kiến nghị hành động",
          "Hãy đặt con số trước bối cảnh, tín hiệu trước hành động.",
          "",
          "decision",
          pts,
        );
      };
      function decision() {
        let b = DATA.CASE_BRIEF;
        root.innerHTML = shell(
          '<div class="sequence"><div class="decisionhead"><span class="eyebrow">Phần 2/2 · Quyết định</span><h2>Giám đốc hỏi: “Vậy Phòng kiến nghị chọn cách nào?”</h2><p>Chọn phương án phù hợp nhất với điểm tập trung, nguồn lực và khả năng theo dõi.</p><div class="facts">' +
            b.facts
              .map(
                (f) =>
                  '<div class="fact"><small>' +
                  f.label +
                  "</small><b>" +
                  f.value +
                  "</b></div>",
              )
              .join("") +
            '</div></div><div class="decisions">' +
            orderedByIds(DATA.ROUND_3_ACTIONS, S.decisionOrder)
              .map(
                (a, optionIndex) =>
                  "<button onclick=\"final('" +
                  a.id +
                  "')\"><span>" +
                  (optionIndex + 1) +
                  "</span><b>" +
                  a.text +
                  "</b></button>",
              )
              .join("") +
            "</div></div>",
        );
      }
      window.final = (id) => {
        let a = DATA.ROUND_3_ACTIONS.find((x) => x.id === id),
          correctAction = DATA.ROUND_3_ACTIONS.find((option) => option.correct),
          pts = a.correct ? 20 : 0;
        S.score += pts;
        S.answers.push({
          round: 3,
          questionId: "G1-R3-DECISION",
          selected: id,
          correct: correctAction.id,
          ok: a.correct,
          points: pts,
        });
        feedback(
          a.correct,
          a.correct
            ? "Kiến nghị phù hợp với dữ liệu"
            : "Kiến nghị chưa đi theo tín hiệu",
          correctAction.text,
          correctAction.reason,
          "Kiến nghị phải bám vào điểm tập trung và nguồn lực thực tế.",
          "finish",
          pts,
        );
      };
      function feedback(ok, title, answer, explanation, next, action, pts) {
        root.insertAdjacentHTML(
          "beforeend",
          '<div class="modal"><div class="card feedback"><span class="eyebrow">' +
            (ok ? "+" + pts + " điểm" : "Phản hồi học tập") +
            "</span><h3>" +
            title +
            '</h3><div class="fsec"><b>ĐÁP ÁN</b><p>' +
            answer +
            '</p></div><div class="fsec"><b>DIỄN GIẢI</b><p>' +
            explanation +
            "</p>" +
            (next
              ? "<p>" +
                next +
                "</p>"
              : "") +
            "</div>" +
            '<button class="btn primary wide" onclick="after(\'' +
            action +
            "')\">" +
            (action === "decision"
                ? "Chọn kiến nghị cuối"
                : action === "finish"
                  ? "Xem kết quả"
                  : "Câu tiếp theo") +
            "</button></div></div>",
        );
      }
      window.after = (a) => {
        if (a === "decision") {
          S.phase = "decision";
          render();
          return;
        }
        if (a === "finish") {
          S.screen = "result";
          render();
          return;
        }
        if (S.round === 1) {
          if (S.idx < DATA.ROUND_1.length - 1) {
            S.idx++;
            resetQ();
            render();
          } else {
            S.screen = "intro";
            S.round = 2;
            S.idx = 0;
            render();
          }
        } else {
          if (S.idx < DATA.ROUND_2.length - 1) {
            S.idx++;
            resetQ();
            render();
          } else {
            S.screen = "intro";
            S.round = 3;
            S.idx = 0;
            render();
          }
        }
      };
      function result() {
        if (!S.attemptFinishedAt) finishAttempt();
        let pct = Math.min(100, Math.round((S.score / DATA.MAX_SCORE) * 100)),
          r1 = S.answers.filter((x) => x.round === 1 && x.ok).length,
          r2 = S.answers.filter((x) => x.round === 2 && x.ok).length,
          r3 = S.answers.filter((x) => x.round === 3 && x.ok).length;
        root.innerHTML =
          '<section class="screen result"><span class="eyebrow">Hoàn thành thử thách</span><div class="ring" style="--angle:' +
          pct * 3.6 +
          'deg"><div><b>' +
          pct +
          "%</b><small>" +
          S.score +
          "/" +
          DATA.MAX_SCORE +
          ' điểm</small></div></div><h1 style="font-size:48px">' +
          (pct >= 90
            ? "Tư duy tham mưu sắc bén"
            : pct >= 72
              ? "Đọc đúng giá trị quản trị"
              : "Cần luyện lại bốn tầng") +
          '</h1><div class="resultgrid"><div class="card"><h3>Kết quả theo vòng</h3><p>Xác định tầng dữ liệu: <b>' +
          r1 +
          "/" +
          DATA.ROUND_1.length +
          "</b></p><p>Nâng cấp dữ liệu: <b>" +
          r2 +
          "/" +
          DATA.ROUND_2.length +
          "</b></p><p>Sắp xếp và quyết định: <b>" +
          r3 +
          "/2</b></p><p>Tổng thời gian chơi: <b>" +
          formatDuration(S.attemptDurationMs) +
          '</b></p></div><div class="card"><h3>Gợi ý cải thiện</h3><p class="lead">' +
          (r1 < 6
            ? "Hãy chú ý tầng cao nhất câu thực sự đạt được; từ “cần” chưa đủ tạo kiến nghị."
            : "Bạn đã đọc khá vững bốn tầng. Hãy luôn truy ngược kiến nghị về tín hiệu và dữ liệu nguồn.") +
          '</p></div></div><div class="memory"><h3>Bốn câu hỏi khi duyệt báo cáo</h3><div class="memgrid">' +
          DATA.LEVELS.map(
            (x) =>
              '<div style="--accent:' +
              x.accent +
              '"><b>' +
              x.question +
              "</b><br><small>" +
              x.short +
              "</small></div>",
          ).join("") +
          '</div></div><button class="btn primary" style="margin-top:20px" onclick="restart()">Chơi lại từ đầu</button></section>';
      }
      window.restart = () => {
        localStorage.removeItem("ql02-g1-v2-standalone");
        Object.assign(S, {
          screen: "welcome",
          name: "",
          round: 1,
          idx: 0,
          score: 0,
          answers: [],
          selected: [],
          seq: [],
          phase: "sequence",
          resultPublished: false,
          attemptStartedMs: 0,
          attemptStartedAt: "",
          attemptFinishedAt: "",
          attemptDurationMs: 0,
          round1Orders: {},
          round2Orders: {},
          decisionOrder: [],
          clockOffsetMs: 0,
        });
        render();
      };
      function visibleAnswerOptions() {
        if (S.screen !== "playing") return [];
        if (S.round === 1) {
          const question = DATA.ROUND_1[S.idx];
          return orderedByIds(DATA.LEVELS, S.round1Orders[question.id]).map(
            (option) => option.short,
          );
        }
        if (S.round === 2) {
          const question = DATA.ROUND_2[S.idx];
          return orderedByIds(
            question.options,
            S.round2Orders[question.id],
          ).map((option) => option.text);
        }
        if (S.phase === "decision") {
          return orderedByIds(DATA.ROUND_3_ACTIONS, S.decisionOrder).map(
            (option) => option.text,
          );
        }
        return S.seq.map((item) => item.text);
      }
      window.render_game_to_text = () =>
        JSON.stringify({
          screen: S.screen,
          playerName: S.name,
          round: S.round,
          phase: S.phase,
          questionId:
            S.round === 1
              ? DATA.ROUND_1[S.idx]?.id || null
              : S.round === 2
                ? DATA.ROUND_2[S.idx]?.id || null
                : null,
          visibleOptions: visibleAnswerOptions(),
          selected: [...S.selected],
          score: S.score,
          progress: {
            current: Math.min(
              DATA.ROUND_1.length + DATA.ROUND_2.length + 2,
              S.answers.length,
            ),
            total: DATA.ROUND_1.length + DATA.ROUND_2.length + 2,
          },
          result: S.screen === "result" ? S.score : null,
        });
      window.advanceTime = (milliseconds) => {
        const delta = Math.max(0, Number(milliseconds) || 0);
        S.clockOffsetMs += delta;
        refreshStatus();
        return S.clockOffsetMs;
      };
      window.setInterval(refreshStatus, 1000);
      render();
    </script>
  </body>
</html>
