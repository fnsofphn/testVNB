<script>
const DATA={"slides":[{"n":1,"title":"Mở chuyên đề: học AI để làm việc quản lý nhanh hơn, chắc hơn","part":"1. Khởi động","loai":"Giảng","dur":3,"content":[],"loithoai":"Chuyên đề 1: Ứng dụng AI hiệu quả trong công tác quản lý\n\nTrọng tâm mới: giao ban – báo cáo – khách hàng – đội ngũ\n\nPhương pháp: giảng ngắn – làm mẫu – làm lại – kiểm chứng\n\nĐầu ra: mỗi học viên có ít nhất 3 sản phẩm công việc bằng AI\n\nNguyên tắc xuyên suốt: AI đề xuất – người quản lý quyết định\n\nKính chào anh chị. Chuyên đề hôm nay không phải là một lớp học công nghệ, cũng không phải buổi giới thiệu một công cụ mới cho biết. Mục tiêu của chúng ta rất thực tế: sau buổi học, anh chị có thể dùng AI để làm nhanh hơn một số việc đang làm hằng ngày, nhưng vẫn giữ được sự chắc chắn và trách nhiệm của người quản lý. Vì vậy, toàn bộ chuyên đề sẽ xoay quanh bốn nhóm việc rất quen thuộc với Trưởng/Phó Điện lực và lãnh đạo Xí nghiệp: chuẩn bị giao ban và giao việc; tổng hợp báo cáo và số liệu; xử lý tình huống khách hàng và phối hợp nội bộ; phát triển đội ngũ qua OJT, phản hồi SBI và kế hoạch phát triển cá nhân. Cách học cũng rất rõ: giảng viên nói ngắn, làm mẫu một lần, anh chị làm lại trên dữ liệu mẫu hoặc dữ liệu đã ẩn danh, sau đó cùng kiểm chứng và rút kinh nghiệm. Kết thúc chuyên đề, mỗi anh chị phải có ít nhất ba sản phẩm mang về: có thể là dàn ý giao ban 15 phút, bản nháp báo cáo tuần, tin nhắn phản hồi khách hàng, checklist OJT hoặc phản hồi SBI cho nhân viên. Điều quan trọng nhất cần giữ từ đầu đến cuối là: AI chỉ đề xuất, người quản lý kiểm chứng và quyết định.","hoatdong":""},{"n":2,"title":"Một ngày của Trưởng/Phó Điện lực: nhiều việc nhỏ nhưng chiếm nhiều thời gian","part":"1. Khởi động","loai":"Giảng + TH","dur":5,"content":[],"loithoai":"Việc đến từ nhiều kênh: công văn, giao ban, hiện trường, khách hàng, cấp trên\n\nNhiều việc là xử lý thông tin: đọc, tóm tắt, phân loại, soạn nháp\n\nViệc quản lý cốt lõi lại cần thời gian: phán đoán, điều phối, phát triển người\n\nCâu hỏi học tập: việc nào nên để AI hỗ trợ để mình có thời gian làm đúng vai quản lý?\n\nTrước khi nói về AI, ta nhìn lại một ngày rất quen thuộc của anh chị. Buổi sáng mở điện thoại đã có tin nhắn từ các tổ, việc tồn từ hôm qua, vài công văn chỉ đạo mới, một hồ sơ khách hàng đang chậm, một phản ánh về mất điện, thêm yêu cầu báo cáo nhanh từ Công ty. Nếu xử lý theo cách thủ công, người quản lý thường phải đọc, lọc, nhớ, sắp xếp, nhắc việc, soạn lại câu chữ, rồi cuối ngày vẫn còn vài việc chưa chạm tới. Điều đáng nói là nhiều việc trong số này không phải việc quản lý cốt lõi, mà là việc xử lý thông tin: tóm tắt văn bản, phân loại đầu việc, gom số liệu, soạn bản nháp, chuẩn hóa câu trả lời. Trong khi đó, những việc thực sự cần vai trò quản lý như phán đoán ưu tiên, kiểm tra hiện trường, điều phối phối hợp liên tổ, giải quyết điểm nghẽn, huấn luyện nhân viên lại bị đẩy xuống cuối ngày. AI có giá trị ở chỗ nó giúp xử lý phần thông tin lặp lại nhanh hơn, để anh chị có thêm thời gian cho phần việc mà AI không thể thay: ra quyết định, chịu trách nhiệm và phát triển đội ngũ. Vì vậy, câu hỏi của chuyên đề không phải “AI là gì cho hiện đại”, mà là “việc nào của tôi có thể giao cho AI hỗ trợ để tôi làm đúng vai quản lý hơn”.\n\nHoạt động cá nhân 2 phút: học viên đánh dấu trong danh sách công việc hằng ngày của mình 3 việc đang tốn nhiều thời gian nhất vì phải đọc, tổng hợp, sắp xếp hoặc soạn nháp. Giảng viên chốt: đây là vùng thử nghiệm AI đầu tiên.\n\nNỘI DUNG 2. AI LÀ TRỢ LÝ QUẢN LÝ","hoatdong":""},{"n":3,"title":"AI là trợ lý quản lý, không phải người ra quyết định","part":"2. AI là trợ lý quản lý","loai":"Giảng","dur":5,"content":[],"loithoai":"AI làm tốt phần xử lý thông tin lặp lại\n\nNgười quản lý giữ phán đoán, kiểm chứng, quyết định\n\nAI không biết đầy đủ địa bàn, con người, hiện trường\n\nMọi đầu ra AI là bản nháp có điều kiện\n\nNguyên tắc: AI đề xuất – quản lý kiểm chứng – quản lý quyết định\n\nTa bắt đầu bằng một tư duy nền: hãy xem AI như một trợ lý quản lý. Một trợ lý tốt có thể đọc nhanh, tóm tắt nhanh, sắp xếp thông tin, soạn bản nháp, gợi ý vài phương án. Nhưng trợ lý đó không thay người phụ trách ký báo cáo, không thay người chỉ huy hiện trường quyết định an toàn, không thay người quản lý đánh giá nhân viên, cũng không thay được hiểu biết về đặc thù địa bàn. Cách hiểu này giúp anh chị tránh hai thái cực. Thái cực thứ nhất là kỳ vọng quá cao, nghĩ rằng AI trả lời gì cũng đúng và có thể dùng ngay. Thái cực thứ hai là e ngại, cho rằng AI là chuyện kỹ thuật phức tạp, không phù hợp với công việc quản lý. Cả hai đều chưa đúng. AI rất hữu ích nếu được giao đúng việc và kiểm soát đúng cách. Với công văn dài, AI có thể tóm tắt để mình đọc nhanh hơn. Với danh sách việc lộn xộn, AI có thể phân loại để mình cân nhắc. Với phản hồi khách hàng, AI có thể gợi ý cách diễn đạt đồng cảm hơn. Nhưng khi chuyển thành quyết định, báo cáo chính thức hoặc thông điệp gửi ra ngoài, người quản lý phải đọc lại, kiểm chứng và chịu trách nhiệm. Câu cần nhớ là: AI đề xuất – người quản lý kiểm chứng – người quản lý quyết định.","hoatdong":""},{"n":4,"title":"Bản đồ việc nên giao AI và việc người quản lý phải giữ","part":"2. AI là trợ lý quản lý","loai":"Giảng","dur":3,"content":[],"loithoai":"AI hỗ trợ: tóm tắt, phân loại, soạn nháp, checklist, gợi ý phương án\n\nAI hỗ trợ: chuẩn hóa câu chữ, tạo dàn ý, mô phỏng câu hỏi huấn luyện\n\nNgười quản lý giữ: an toàn hiện trường, quyết định cắt điện, đánh giá nhân sự\n\nNgười quản lý giữ: kết luận số liệu, xử lý dữ liệu mật, phán đoán địa bàn\n\nRanh giới: việc có rủi ro cao chỉ dùng AI như nguồn tham khảo\n\nĐể dùng AI an toàn, anh chị cần một bản đồ phân vai rất rõ. Nhóm việc phù hợp để AI hỗ trợ thường có ba đặc điểm: lặp lại, tốn thời gian và chủ yếu xử lý ngôn ngữ hoặc thông tin. Ví dụ: tóm tắt công văn chỉ đạo, phân loại đầu việc trong ngày, soạn dàn ý giao ban, tạo checklist kiểm tra an toàn trước thi công, viết bản nháp báo cáo tuần, chuẩn hóa tin nhắn phản hồi khách hàng, gợi ý câu hỏi huấn luyện nhân viên sau một lỗi công việc. Đây là những việc AI giúp tiết kiệm thời gian rõ. Ngược lại, có những việc người quản lý phải giữ. Quyết định an toàn hiện trường, quyết định phương án cắt điện, kết luận nguyên nhân sự cố, đánh giá thi đua hoặc năng lực nhân viên, xử lý dữ liệu khách hàng thật, dùng số liệu tài chính hoặc tổn thất cụ thể đều không thể giao cho AI công cộng. Với các việc này, AI chỉ có thể là nguồn gợi ý chung, không phải cơ sở quyết định. Một cách tự hỏi rất đơn giản: nếu việc này sai thì ai chịu trách nhiệm và hậu quả là gì? Nếu hậu quả liên quan an toàn, pháp lý, khách hàng, uy tín đơn vị hoặc quyền lợi nhân viên, người quản lý phải giữ quyền quyết định và kiểm chứng kỹ. Biết ranh giới này giúp ta dùng AI mạnh dạn nhưng không liều lĩnh.","hoatdong":""},{"n":5,"title":"Bài tập nhanh: Phân loại công việc cho AI","part":"2. AI là trợ lý quản lý","loai":"Bài tập 1","dur":5,"content":[],"loithoai":"Mục tiêu: nhận diện đúng ranh giới dùng AI\n\n6 tình huống: công văn, giao ban, sự cố, khách hàng, nhân sự, an toàn\n\nPhân loại 2 nhóm: AI hỗ trợ / người quản lý giữ\n\nGhi lý do ngắn cho 3 tình huống rủi ro cao\n\nChốt bài: sai ranh giới là nguồn rủi ro lớn nhất\n\nBây giờ ta làm một bài tập ngắn để kiểm tra ranh giới dùng AI. Giảng viên sẽ đưa ra mười tình huống rất quen:\n\nNhiệm vụ của anh chị không phải trả lời dài, chỉ cần đánh dấu: việc này có thể dùng AI hỗ trợ hay người quản lý phải giữ. Với ba tình huống rủi ro cao, anh chị ghi thêm một lý do ngắn. Điều quan trọng là hiểu: nhiều việc không phải cấm dùng AI hoàn toàn, nhưng phải giới hạn vai trò của AI. Chẳng hạn, với khiếu nại tiền điện tăng, AI có thể gợi ý khung phương án và câu chữ phản hồi; nhưng việc kiểm tra chỉ số, đối chiếu hệ thống, quyết định hướng xử lý cụ thể vẫn thuộc người quản lý. Sau bài này, chúng ta sẽ có ngôn ngữ chung cho cả buổi: giao AI phần xử lý thông tin; giữ lại phần phán đoán, kiểm chứng và trách nhiệm.\n\nHọc viên làm theo cá nhân trong 5 phút trên phiếu bài tập. Sản phẩm: bảng phân loại 10 việc. Giảng viên mời 2 học viên chia sẻ tình huống dễ nhầm nhất, sau đó chốt ranh giới: an toàn, nhân sự, dữ liệu nhạy cảm, số liệu chính thức và quyết định với khách hàng phải do người quản lý kiểm soát.","hoatdong":"","tables":[{"title":"Lời thoại giảng viên","rows":[["#","Tình huống","Giao AI / Người QL giữ?"],["1","Tóm tắt công văn 8 trang thành 5 ý chính","?"],["2","Phân loại việc tồn đọng trong tuần","?"],["3","Tổng hợp sự cố theo tháng","?"],["4","Soạn phản hồi khách hàng phàn nàn về mất điện","?"],["5","Gợi ý phương án xử lý khiếu nại tiền điện tăng","?"],["6","Đưa ra quyết định cắt điện khu vực để xử lý sự cố","?"],["7","Đánh giá, xếp loại thi đua một nhân viên","?"],["8","Khẳng định \"địa bàn X có đúng 5 trạm\" để báo cáo","?"],["9","Soạn checklist kiểm tra an toàn trước thi công","?"],["10","Chuẩn bị dàn ý các nội dung giao ban sáng","?"]]}]},{"n":6,"title":"Đúc kết phần 2: dùng AI đúng việc để không tạo thêm rủi ro","part":"2. AI là trợ lý quản lý","loai":"Đúc kết","dur":2,"content":[],"loithoai":"AI tốt nhất ở vùng xử lý thông tin\n\nAI yếu ở vùng hiện trường, con người, số liệu chính thức, dữ liệu mật\n\nDùng AI càng nhiều càng cần kiểm chứng\n\nKhông dùng AI để né trách nhiệm quản lý\n\nCầu nối: muốn AI hỗ trợ tốt, phải giao việc rõ bằng prompt 3 lớp\n\nTa đúc kết phần phân vai. Giá trị lớn nhất của AI trong quản lý cấp Điện lực/Xí nghiệp nằm ở vùng xử lý thông tin: đọc nhanh, tóm tắt, phân loại, soạn bản nháp, tạo checklist, gợi ý phương án, chuẩn hóa câu chữ. Đây là vùng giúp tiết kiệm thời gian và tạo sản phẩm nhanh. Nhưng AI yếu ở những việc cần hiện trường, kinh nghiệm địa bàn, hiểu con người, kết luận số liệu chính thức, xử lý dữ liệu mật hoặc ra quyết định có rủi ro. Vì vậy, dùng AI đúng không phải là dùng càng nhiều càng tốt, mà là dùng đúng phần việc, đúng dữ liệu, đúng mức kiểm soát. Nếu dùng AI để né trách nhiệm, sao chép nguyên văn đầu ra, hoặc đưa dữ liệu nhạy cảm vào cho nhanh, rủi ro sẽ lớn hơn lợi ích. Ngược lại, nếu dùng AI như một trợ lý xử lý thông tin, còn người quản lý vẫn giữ quyền kiểm chứng và quyết định, AI sẽ trở thành công cụ rất thực tế. Từ đây ta chuyển sang kỹ năng quan trọng nhất: giao việc cho AI như thế nào. Trong quản lý, giao việc cho nhân viên mà nói mơ hồ thì kết quả mơ hồ. Với AI cũng vậy. Muốn AI hỗ trợ tốt, anh chị cần biết viết prompt rõ ràng theo công thức ba lớp: Mục tiêu – Vai trò/Bối cảnh – Đầu ra.\n\nNỘI DUNG 3. CÔNG THỨC PROMPT 3 LỚP","hoatdong":""},{"n":7,"title":"Giao việc cho AI bằng công thức 3 lớp","part":"3. Prompt 3 lớp","loai":"Giảng","dur":5,"content":[],"loithoai":"Lớp 1 – Mục tiêu: muốn AI làm gì?\n\nLớp 2 – Vai trò/Bối cảnh: ai dùng, trong tình huống nào?\n\nLớp 3 – Đầu ra: dạng bảng, dàn ý, tin nhắn, báo cáo, checklist?\n\nCàng rõ đầu vào, càng giảm thời gian sửa đầu ra\n\nCông thức dùng cho mọi prompt trong chuyên đề\n\nPrompt có thể hiểu đơn giản là cách anh chị giao việc cho AI. Ta không cần dùng thuật ngữ kỹ thuật phức tạp. Chỉ cần nhớ công thức ba lớp. Lớp thứ nhất là mục tiêu: anh chị muốn AI làm gì. Ví dụ: tóm tắt công văn, phân loại đầu việc, soạn dàn ý giao ban, viết bản nháp báo cáo tuần, gợi ý phương án xử lý khiếu nại, tạo checklist OJT. Lớp thứ hai là vai trò và bối cảnh: ai sẽ dùng kết quả này và dùng trong tình huống nào. Ví dụ: “Tôi là Trưởng Điện lực, chuẩn bị giao ban sáng 15 phút với các tổ”; hoặc “Tôi là Phó Giám đốc Xí nghiệp, cần phản hồi nội bộ sau một lỗi thực hiện công việc”. Lớp thứ ba là đầu ra: kết quả cần trình bày ra sao. Đây là phần rất quan trọng nhưng hay bị bỏ quên. Nếu muốn bảng thì nói rõ bảng; nếu muốn ba phương án thì nói rõ ba phương án; nếu muốn tin nhắn khách hàng thì yêu cầu ngắn gọn, đồng cảm, đúng mực; nếu muốn báo cáo tuần thì yêu cầu cấu trúc kết quả – vấn đề – nguyên nhân – đề xuất. Một prompt đủ ba lớp thường cho kết quả tốt hơn nhiều, vì AI không phải tự đoán ý người dùng. Trong toàn bộ chuyên đề, mọi prompt mẫu đều sẽ đi theo công thức này để anh chị dễ nhớ và dùng lại.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":8,"title":"So sánh prompt yếu và prompt tốt","part":"3. Prompt 3 lớp","loai":"Giảng","dur":4,"content":[],"loithoai":"Prompt yếu: “Làm giúp tôi báo cáo tuần”\n\nThiếu: mục tiêu cụ thể, vai trò, dữ liệu, cấu trúc đầu ra\n\nPrompt tốt: có vai trò Trưởng Điện lực, dữ liệu mẫu, cấu trúc 4 mục\n\nĐầu ra tốt hơn vì AI hiểu đúng việc, đúng người dùng, đúng định dạng\n\nBài học: viết rõ trước để sửa ít hơn sau\n\nTa xem một ví dụ rất đơn giản. Nếu anh chị gõ “Làm giúp tôi báo cáo tuần”, AI có thể trả lại một báo cáo chung chung, nghe có vẻ đúng nhưng không sát đơn vị. Nó không biết báo cáo gửi ai, tuần này có dữ liệu gì, cần nhấn mạnh an toàn hay khách hàng, có cần đề xuất hay không. Đó là prompt yếu. Bây giờ ta viết lại theo ba lớp: “Tôi là Trưởng Điện lực, cần soạn bản nháp báo cáo tuần gửi Công ty. Dưới đây là dữ liệu đã ẩn danh về kết quả công việc, sự cố, phản ánh khách hàng và việc tồn. Hãy soạn báo cáo theo 4 mục: kết quả nổi bật, vấn đề cần chú ý, nguyên nhân sơ bộ, đề xuất tuần tới. Trình bày ngắn gọn, dạng gạch đầu dòng, không tự tạo số liệu ngoài dữ liệu tôi cung cấp.” Prompt này khác hẳn. Nó nói rõ vai trò, mục tiêu, nguồn dữ liệu, cấu trúc đầu ra và cả yêu cầu không bịa số liệu. Kết quả thường sát hơn, dễ dùng hơn và ít phải sửa hơn. Bài học ở đây rất thực tế: đừng tiết kiệm vài giây khi viết prompt để rồi mất nhiều phút sửa một đầu ra mơ hồ. Viết prompt rõ cũng giống giao việc rõ cho nhân viên: rõ việc, rõ bối cảnh, rõ đầu ra thì khả năng hoàn thành đúng sẽ cao hơn.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":9,"title":"Chấm nhanh chất lượng prompt theo 5 tiêu chí","part":"3. Prompt 3 lớp","loai":"Giảng","dur":3,"content":[],"loithoai":"1. Mục tiêu rõ: AI cần làm gì?\n\n2. Vai trò/bối cảnh rõ: ai dùng, dùng để làm gì?\n\n3. Đầu ra cụ thể: bảng, dàn ý, báo cáo, tin nhắn, checklist?\n\n4. An toàn dữ liệu: không lộ thông tin nhạy cảm\n\n5. Dùng được: có thể áp dụng vào công việc thật sau khi kiểm chứng\n\nĐể tránh viết prompt theo cảm tính, ta dùng một bảng chấm nhanh gồm năm tiêu chí. Tiêu chí một: mục tiêu có rõ không. AI phải biết chính xác cần làm gì: tóm tắt, phân loại, soạn nháp, gợi ý, so sánh hay chuẩn hóa. Tiêu chí hai: vai trò và bối cảnh có rõ không. Cùng là báo cáo, nhưng báo cáo của Trưởng Điện lực gửi Công ty khác với thông tin nội bộ gửi tổ đội. Cùng là phản hồi, nhưng phản hồi khách hàng khác với phản hồi nhân viên. Tiêu chí ba: đầu ra có cụ thể không. Nếu muốn bảng thì nói bảng; nếu muốn ba phương án thì nói ba phương án; nếu muốn giới hạn độ dài thì nói rõ. Tiêu chí bốn: dữ liệu có an toàn không. Prompt tốt không được chứa tên khách hàng thật, số hợp đồng, địa chỉ, số công tơ, số liệu nhạy cảm, văn bản mật hoặc thông tin nhân sự cụ thể. Tiêu chí năm: đầu ra có khả năng dùng được trong công việc thật sau khi kiểm chứng không. Một prompt hay không phải prompt dài, mà là prompt tạo được đầu ra gần với nhu cầu công việc. Lát nữa khi thực hành, anh chị sẽ viết prompt lần một, xem đầu ra, sửa prompt lần hai, rồi tự chấm theo năm tiêu chí này. Đây là cách rèn kỹ năng rất nhanh.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":10,"title":"Bài tập 2: Luyện viết prompt theo cấu trúc 3 lớp","part":"3. Prompt 3 lớp","loai":"Bài tập 2","dur":15,"content":[],"loithoai":"Thực hiện trên Web App của PeopleOne\n\nCó 3 tình huống, mỗi tình huống soạn prompt theo cấu trúc 3 lớp (3 phút/tình huống)\n\nSau khi hoàn thành, đọc và đối chiếu với prompt mẫu, xác định điểm khác biệt giữa prompt anh/chị soạn và prompt mẫu, ghi chép lại\n\nGiảng viên mời 1-2 học viên chia sẻ\n\nBây giờ anh chị thực hành ngay. Mỗi người chọn một việc rất gần với công việc của mình. Có thể là chuẩn bị giao ban sáng từ danh sách đầu việc, soạn bản nháp báo cáo tuần từ dữ liệu mẫu, viết phản hồi khách hàng đã ẩn danh, hoặc soạn checklist OJT 15 phút cho một nhân viên mới. Bước một, anh chị viết prompt lần đầu theo công thức ba lớp. Bước hai, nhập vào công cụ AI và đọc kết quả. Đừng vội đánh giá đúng sai toàn bộ; chỉ cần tìm một điểm chưa ổn: thiếu bối cảnh, văn phong chưa đúng, đầu ra quá dài, thiếu bảng, thiếu thời hạn, hoặc có dấu hiệu tự tạo thông tin. Bước ba, sửa prompt lần hai để khắc phục đúng điểm đó. Ví dụ, nếu đầu ra quá chung, thêm bối cảnh “dùng cho giao ban 15 phút tại Điện lực”; nếu thiếu cấu trúc, thêm yêu cầu “trình bày dạng bảng gồm việc – người phụ trách – hạn báo lại”; nếu lo dữ liệu, thêm câu “không tự tạo số liệu ngoài dữ liệu cung cấp”. Bước bốn, tự chấm hai prompt theo năm tiêu chí. Mục tiêu không phải viết hoàn hảo ngay, mà là thấy rõ: chỉ cần thêm đúng lớp bối cảnh hoặc đầu ra, chất lượng kết quả có thể thay đổi đáng kể. Đây là kỹ năng anh chị sẽ dùng suốt bốn nhóm ứng dụng tiếp theo.\n\nHọc viên làm bài tập cá nhân 9 phút trên máy tính.. Giảng viên mời 2 học viên chia sẻ prompt trước/sau và chốt lỗi thường gặp: thiếu vai trò, thiếu định dạng, dùng dữ liệu quá cụ thể.\n\nNỘI DUNG 4. ỨNG DỤNG AI VÀO 4 VIỆC CỐT LÕI TẠI ĐIỆN LỰC\n\nViệc 1: Chuẩn bị giao ban (25 phút)","hoatdong":""},{"n":11,"title":"Ứng dụng 1: dùng AI chuẩn bị giao ban sáng 15 phút","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Giảng","dur":3,"content":[],"loithoai":"Mục tiêu: giao ban ngắn, rõ việc, rõ người, rõ hạn\n\nĐầu vào: việc tồn, việc mới, phản ánh khách hàng, lưu ý an toàn\n\nAI hỗ trợ: sắp xếp 4 mục giao ban\n\nĐầu ra: dàn ý giao ban 15 phút\n\nNgười quản lý: chọn điểm nhấn và quyết định ưu tiên\n\nTa chuyển sang nhóm ứng dụng đầu tiên: giao ban và giao việc. Đây là việc hầu như ngày nào Trưởng/Phó Điện lực cũng làm, nhưng chất lượng giao ban rất khác nhau giữa các đơn vị. Có nơi giao ban kéo dài, ai có gì nói nấy, cuối buổi nhiều việc vẫn chưa rõ ai làm, bao giờ báo lại. Có nơi giao ban chỉ 15 phút nhưng rất rõ: việc tồn, việc mới, việc liên quan trải nghiệm khách hàng, việc an toàn. AI có thể hỗ trợ chuẩn bị khung giao ban rất nhanh nếu ta cung cấp đầu vào đúng. Ví dụ đầu vào gồm: ba việc tồn từ hôm trước, năm việc mới hôm nay, một phản ánh khách hàng cần theo dõi, một lưu ý an toàn trước thi công. Prompt cần yêu cầu AI sắp xếp thành dàn ý giao ban 15 phút, mỗi mục có việc cần nêu, người phụ trách gợi ý, hạn báo lại và câu hỏi cần chốt. Tuy nhiên, AI chỉ sắp xếp bản nháp. Người quản lý vẫn phải chọn điểm thật sự quan trọng, điều chỉnh theo tình hình địa bàn và quyết định ưu tiên cuối cùng. Giá trị của AI ở đây là giảm thời gian chuẩn bị, giúp giao ban có cấu trúc hơn, không thay thế vai trò chủ trì của anh chị. Đây cũng là sản phẩm đầu tiên học viên sẽ tạo trong chuyên đề.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":12,"title":"Demo 1: từ danh sách việc lộn xộn thành dàn ý giao ban","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Demo","dur":5,"content":[],"loithoai":"Dữ liệu mẫu: 12 đầu việc đầu ngày đã ẩn danh\n\nPrompt mẫu: tạo dàn ý giao ban 15 phút theo 4 mục\n\nĐầu ra: việc tồn – việc mới – TNKH – an toàn\n\nBảng phụ: việc – người phụ trách – hạn báo lại – lưu ý\n\nChốt: AI sắp xếp, quản lý quyết định\n\nGiảng viên sẽ làm mẫu một lần. Ta có một danh sách 12 đầu việc đầu ngày: kiểm tra việc tồn của hồ sơ cấp điện mới, cập nhật tình hình sự cố khu vực A, xử lý phản ánh khách hàng về mất điện lặp lại, rà kế hoạch thi công trong ngày, nhắc an toàn trước khi ra hiện trường, tổng hợp báo cáo tuần, đôn đốc một việc phối hợp liên tổ, chuẩn bị nội dung họp với Công ty, và một vài việc hành chính khác. Nếu đọc và tự sắp xếp bằng tay, người quản lý có thể mất 20–30 phút. Prompt mẫu sẽ là: “Tôi là Trưởng Điện lực, chuẩn bị giao ban sáng 15 phút. Đây là danh sách đầu việc đã ẩn danh. Hãy sắp xếp thành dàn ý giao ban gồm 4 mục: việc tồn, việc mới, việc liên quan trải nghiệm khách hàng, việc an toàn. Trình bày bảng gồm: nội dung cần nêu, người phụ trách gợi ý, hạn báo lại, câu hỏi người chủ trì cần chốt. Không tự thêm việc ngoài danh sách.” Khi AI trả kết quả, giảng viên sẽ đọc cùng lớp và chỉ ra phần nào dùng được ngay, phần nào cần sửa. Ví dụ AI có thể gợi ý người phụ trách chưa sát vì không biết phân công thật tại đơn vị. Đó là lúc người quản lý điều chỉnh. Bài học là: AI giúp tạo khung nhanh, nhưng quyền ưu tiên và phân công vẫn thuộc người chủ trì giao ban.\n\nGiảng viên trình chiếu dữ liệu mẫu và chạy prompt trực tiếp. Học viên quan sát, ghi lại prompt mẫu và đánh dấu 2 điểm cần kiểm tra trước khi dùng: người phụ trách và hạn báo lại. Giảng viên chốt bằng nguyên tắc: “không dùng nguyên bảng AI nếu chưa điều chỉnh theo thực tế đơn vị”.","hoatdong":""},{"n":13,"title":"Thực hành: tạo dàn ý giao ban và bảng phân loại đầu việc","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Thực hành","dur":17,"content":[],"loithoai":"Học viên dùng dữ liệu mẫu 12 đầu việc\n\nTạo dàn ý giao ban 15 phút\n\nTạo bảng phân loại: khẩn cấp – quan trọng – giao được – lùi được\n\nĐiều chỉnh prompt theo đơn vị mình\n\nSản phẩm nộp: 01 dàn ý + 01 bảng phân loại\n\nBây giờ anh chị làm lại trên cùng dữ liệu mẫu. Mục tiêu của hoạt động này là mỗi người tạo được hai sản phẩm: một dàn ý giao ban 15 phút và một bảng phân loại đầu việc theo mức ưu tiên. Bước một, anh chị dùng prompt dàn ý giao ban mà giảng viên vừa làm mẫu, có thể sửa nhẹ nếu muốn. Bước hai, dùng một prompt thứ hai: “Tôi là Trưởng/Phó Điện lực. Với danh sách đầu việc trên, hãy phân loại theo 4 nhóm: khẩn cấp cần làm ngay; quan trọng cần lên kế hoạch; có thể giao cấp dưới; có thể lùi lại. Trình bày bảng gồm đầu việc, nhóm ưu tiên, lý do xếp loại, người phụ trách gợi ý, hạn báo lại.” Bước ba, đọc kết quả và đánh dấu ít nhất hai chỗ cần điều chỉnh theo đơn vị mình. Ví dụ, một việc AI cho là có thể lùi nhưng thực tế liên quan khách hàng đang chờ thì phải đưa lên ưu tiên cao hơn. Hoặc AI gợi ý người phụ trách là tổ kỹ thuật nhưng thực tế cần tổ kinh doanh chủ trì phản hồi khách hàng. Đây là phần học quan trọng nhất: anh chị không chỉ tạo đầu ra mà còn luyện phản xạ kiểm soát đầu ra. Sản phẩm cuối cùng không phải bảng AI tạo ra, mà là bảng đã được anh chị điều chỉnh theo phán đoán quản lý.\n\nHọc viên làm cá nhân 12 phút, dùng dữ liệu mẫu. Sản phẩm: dàn ý giao ban 15 phút và bảng phân loại đầu việc. Giảng viên mời 1–2 học viên chia sẻ (5 phút) một điều đã sửa so với AI, chốt tiêu chí nhận xét: rõ 4 mục, có người phụ trách, có hạn báo lại, có mục TNKH và an toàn.\n\nViệc 2: Tổng hợp sự cố tuần (25 phút)","hoatdong":""},{"n":14,"title":"Ứng dụng 2: dùng AI cho báo cáo và số liệu nhưng phải kiểm chứng","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Giảng","dur":3,"content":[],"loithoai":"Mục tiêu: rút ngắn thời gian đọc – tổng hợp – soạn nháp\n\nĐầu vào: công văn, dữ liệu sự cố, phản ánh khách hàng, việc tồn\n\nAI hỗ trợ: tóm tắt, nhóm số liệu, nhận diện điểm nóng, soạn báo cáo\n\nRủi ro: AI có thể cộng sai, nhận xét sai, tự thêm số liệu\n\nNguyên tắc: số liệu chính thức phải đối chiếu nguồn\n\nNhóm ứng dụng thứ hai là báo cáo và số liệu. Đây là vùng AI rất hữu ích nhưng cũng dễ phát sinh rủi ro nếu dùng không cẩn thận. Trong công việc thực tế, anh chị thường phải đọc công văn, tóm tắt chỉ đạo, gom số liệu từ các tổ, tổng hợp sự cố, theo dõi phản ánh khách hàng, rồi soạn báo cáo tuần hoặc báo cáo nhanh. AI có thể giúp rút ngắn đáng kể thời gian ở các khâu này. Nó có thể tóm tắt một văn bản dài thành vài ý chính; nhóm dữ liệu sự cố theo khu vực, loại sự cố; nhận diện điểm nóng trong phản ánh khách hàng; hoặc soạn bản nháp báo cáo theo cấu trúc rõ ràng. Nhưng với số liệu, ta phải rất tỉnh táo. AI có thể cộng sai, hiểu sai cột dữ liệu, rút ra nhận xét chưa đúng, hoặc tự tạo thêm con số nghe rất hợp lý. Vì vậy, nguyên tắc ở phần này là: AI hỗ trợ trình bày và phân tích sơ bộ, không thay thế nguồn số liệu chính thức. Mọi con số đưa vào báo cáo phải đối chiếu lại với hệ thống hoặc dữ liệu gốc. Mọi nhận xét của AI phải được kiểm tra xem có thật sự suy ra từ dữ liệu không. Nếu làm đúng, AI giúp báo cáo nhanh hơn và rõ hơn; nếu làm ẩu, AI có thể làm báo cáo đẹp hơn nhưng sai hơn.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":15,"title":"Demo: tổng hợp sự cố tuần và nhận diện điểm nóng","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Demo","dur":5,"content":[],"loithoai":"Dữ liệu mẫu: sự cố theo ngày, khu vực, loại sự cố, thời gian khôi phục\n\nPrompt mẫu: tổng hợp theo khu vực, loại sự cố, tần suất\n\nĐầu ra: bảng tổng hợp + 3 nhận xét + điểm nóng\n\nYêu cầu bắt buộc: kiểm chứng 1 dòng số liệu và 1 nhận xét\n\nChốt: AI chỉ ra “ở đâu/cái gì”, quản lý phân tích “vì sao/làm gì”\n\nGiảng viên làm mẫu với một bảng dữ liệu sự cố tuần đã được chuẩn bị sẵn và hoàn toàn ẩn danh. Bảng có các cột: ngày, khu vực, loại sự cố, thời gian khôi phục, ghi chú ngắn. Prompt mẫu là: “Tôi là Phó Giám đốc Điện lực, cần chuẩn bị báo cáo tuần. Dưới đây là dữ liệu sự cố đã ẩn danh. Hãy tổng hợp theo khu vực và loại sự cố; nhận diện khu vực có tần suất cao nhất, loại sự cố lặp lại nhiều nhất; trình bày bảng tổng hợp và 3 nhận xét ngắn. Không tự tạo số liệu ngoài bảng dữ liệu.” Sau khi AI trả kết quả, giảng viên không chấp nhận ngay mà làm đúng quy trình kiểm chứng. Ta chọn một dòng tổng hợp, ví dụ khu vực B có bao nhiêu sự cố, rồi đối chiếu với dữ liệu gốc. Sau đó chọn một nhận xét, ví dụ “sự cố tập trung vào buổi tối” hoặc “khu vực C là điểm nóng”, xem nhận xét đó có đúng từ dữ liệu không. Điểm cần nhấn mạnh là AI có thể giúp ta nhìn nhanh “ở đâu nhiều, loại nào lặp lại”, nhưng nguyên nhân gốc và quyết định xử lý vẫn cần người quản lý. Có thể khu vực có nhiều sự cố vì thời tiết, vì lưới cũ, vì thi công bên ngoài hoặc vì cách ghi nhận dữ liệu. AI không thể tự kết luận nếu chưa có bối cảnh.\n\nGiảng viên chạy demo trực tiếp. Học viên quan sát và cùng kiểm chứng một dòng số liệu, một nhận xét. Sản phẩm của lớp: một bảng tổng hợp đã đánh dấu phần “đã kiểm chứng” và phần “cần quản lý phân tích thêm”.","hoatdong":""},{"n":16,"title":"Thực hành: tạo bản nháp báo cáo tuần","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Thực hành","dur":17,"content":[],"loithoai":"Học viên dùng dữ liệu mẫu sự cố + việc tồn + phản ánh khách hàng\n\nTạo báo cáo 4 mục: kết quả – vấn đề – nguyên nhân – đề xuất\n\nKiểm chứng ít nhất 1 dòng số liệu\n\nKiểm chứng ít nhất 1 nhận xét của AI\n\nSản phẩm nộp: bản nháp báo cáo tuần đã đánh dấu chỗ cần rà\n\nỞ hoạt động này, anh chị sẽ tạo sản phẩm thứ hai của chuyên đề: bản nháp báo cáo tuần. Dữ liệu mẫu gồm ba phần: một bảng sự cố đã ẩn danh, một danh sách việc tồn và một số phản ánh khách hàng dạng mô phỏng. Prompt gợi ý là: “Tôi là Trưởng Điện lực, cần soạn bản nháp báo cáo tuần gửi Công ty. Dưới đây là dữ liệu đã ẩn danh về kết quả công việc, sự cố, phản ánh khách hàng và việc tồn. Hãy soạn báo cáo theo 4 mục: kết quả nổi bật, vấn đề cần chú ý, nguyên nhân sơ bộ, đề xuất tuần tới. Chỉ dùng dữ liệu được cung cấp, không tự tạo số liệu. Những điểm cần kiểm chứng hãy ghi chú rõ.” Sau khi có báo cáo, anh chị không sửa câu chữ ngay mà làm hai việc kiểm chứng. Một là chọn một dòng số liệu hoặc một con số AI nêu ra, đối chiếu với dữ liệu mẫu. Hai là chọn một nhận xét của AI, xem nhận xét đó có hợp logic không. Ví dụ, nếu AI nói “phản ánh khách hàng tăng do mất điện lặp lại”, trong dữ liệu có đủ cơ sở để nói như vậy không, hay chỉ mới là khả năng cần kiểm tra? Sản phẩm nộp là bản nháp báo cáo có đánh dấu: phần dùng được, phần cần kiểm chứng, phần cần bổ sung nhận định của người quản lý. Đây mới là cách dùng AI an toàn trong báo cáo.\n\nHọc viên làm cá nhân 15 phút. Dữ liệu dùng là dữ liệu mẫu. Sản phẩm: bản nháp báo cáo tuần 4 mục, kèm đánh dấu 1 dòng số liệu đã kiểm chứng và 1 nhận xét đã kiểm tra logic. Giảng viên chốt theo 4 tiêu chí: đúng cấu trúc, không tự tạo số liệu, có phần đề xuất, có dấu kiểm chứng.\n\nViệc 3: Đề xuất phương án xử lý & Hỗ trợ phản hồi khách hàng (25 phút)","hoatdong":""},{"n":17,"title":"Ứng dụng 3: dùng AI hỗ trợ xử lý khách hàng và phối hợp nội bộ","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Giảng","dur":3,"content":[],"loithoai":"Mục tiêu: phản hồi khách hàng rõ, đúng mực, đồng cảm\n\nAI hỗ trợ: soạn tin nhắn, gợi ý phương án, so sánh lựa chọn\n\nTình huống: tiền điện tăng, mất điện lặp lại, chậm hồ sơ\n\nTiêu chí so sánh: thời gian – chi phí – hài lòng KH – rủi ro vận hành\n\nNgười quản lý kiểm ngữ cảnh và quyết định thông điệp cuối\n\nNhóm ứng dụng thứ ba liên quan trực tiếp đến trải nghiệm khách hàng và phối hợp nội bộ. Đây là vùng mà cách diễn đạt và cách tổ chức xử lý ảnh hưởng rất lớn đến cảm nhận của khách hàng. Cùng một sự việc, nếu phản hồi chậm, câu chữ khô cứng, không nói rõ bước tiếp theo, khách hàng có thể thấy bị bỏ mặc. Nếu phản hồi ngắn gọn, đồng cảm, nêu rõ đang kiểm tra gì, thời gian cập nhật lại khi nào, cảm nhận sẽ khác. AI có thể hỗ trợ chuẩn hóa tin nhắn phản hồi, gợi ý phương án xử lý khiếu nại, hoặc so sánh các phương án theo tiêu chí thời gian, chi phí, mức độ hài lòng khách hàng và rủi ro vận hành. Ví dụ, với tình huống khách hàng phản ánh tiền điện tăng, AI có thể gợi ý các bước: tiếp nhận, kiểm tra lịch sử sử dụng, đối chiếu chỉ số, kiểm tra công tơ nếu cần, thông tin lại cho khách theo thời hạn rõ. Nhưng anh chị phải kiểm tra xem phương án đó có phù hợp quy định, phân quyền, văn hóa EVNSPC và thực tế địa bàn không. Đặc biệt, không đưa tên khách hàng thật, số hợp đồng, địa chỉ, số công tơ vào AI công cộng. Ta chỉ mô tả tình huống đã ẩn danh. Mục tiêu là dùng AI để chuẩn bị thông điệp và phương án tốt hơn, không để AI quyết định cách xử lý thay đơn vị.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":18,"title":"Demo: phản hồi khách hàng khiếu nại tiền điện tăng","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Demo","dur":5,"content":[],"loithoai":"Tình huống mẫu: KH X phản ánh hóa đơn tăng khoảng 40%\n\nPrompt 1: soạn phản hồi đồng cảm, rõ bước xử lý\n\nPrompt 2: đề xuất 3 phương án xử lý\n\nPrompt 3: so sánh phương án theo 4 tiêu chí\n\nKiểm tra: giọng điệu, quy định, thời hạn, dữ liệu nhạy cảm\n\nGiảng viên sẽ làm mẫu trên tình huống đã ẩn danh: “Khách hàng X phản ánh hóa đơn tháng này tăng khoảng 40% so với tháng trước, khách đang bức xúc và yêu cầu Điện lực giải thích.” Ta dùng ba prompt liên tiếp. Prompt thứ nhất: “Tôi là Trưởng Điện lực. Hãy soạn tin nhắn phản hồi khách hàng trong tình huống đã ẩn danh dưới đây. Yêu cầu: đồng cảm trước, giải thích ngắn gọn rằng Điện lực sẽ kiểm tra, nêu các bước xử lý, hẹn thời gian cập nhật lại, giọng văn đúng mực và chuyên nghiệp.” Prompt thứ hai: “Hãy đề xuất 3 phương án xử lý nội bộ, mỗi phương án gồm bước thực hiện, người/đầu mối phụ trách, thời hạn, lưu ý phối hợp.” Prompt thứ ba: “So sánh 3 phương án theo 4 tiêu chí: thời gian, chi phí, mức độ hài lòng khách hàng, rủi ro vận hành; trình bày dạng bảng.” Khi có đầu ra, giảng viên sẽ không đọc như một kết quả hoàn hảo, mà soi từng điểm: câu chữ có quá hứa hẹn không, có phù hợp văn hóa EVNSPC không, có nêu thời hạn thực tế không, có yêu cầu kiểm tra vượt thẩm quyền không, có lộ dữ liệu nhạy cảm không. Điều học viên cần thấy là AI rất tốt trong việc gợi ý cách nói và khung phương án, nhưng phản hồi cuối cùng phải do người quản lý kiểm ngữ cảnh và chuẩn hóa.\n\nGiảng viên chạy 3 prompt mẫu. Học viên quan sát và ghi lại cấu trúc phản hồi tốt: đồng cảm – xác nhận tiếp nhận – nêu bước kiểm tra – hẹn cập nhật – cảm ơn. Giảng viên chốt: không hứa chắc kết quả khi chưa kiểm tra dữ liệu chính thức.","hoatdong":""},{"n":19,"title":"Thực hành: tạo phản hồi khách hàng và bảng phương án xử lý","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Thực hành","dur":17,"content":[],"loithoai":"Học viên chọn 1 tình huống mẫu: tiền điện tăng / mất điện lặp lại / chậm hồ sơ\n\nTạo phản hồi khách hàng đã ẩn danh\n\nTạo bảng 3 phương án xử lý khiếu nại\n\nSo sánh theo 4 tiêu chí\n\nĐiều chỉnh giọng điệu theo văn hóa EVNSPC\n\nBây giờ anh chị thực hành nhóm khách hàng. Mỗi người hoặc mỗi cặp chọn một trong ba tình huống mẫu: khách hàng phản ánh tiền điện tăng; khách hàng bức xúc vì mất điện lặp lại; khách hàng phàn nàn hồ sơ cấp điện chậm và phải hỏi nhiều lần mới biết tiến độ. Tất cả tình huống đều đã ẩn danh, không dùng tên, địa chỉ, số hợp đồng hay số công tơ thật. Bước một, anh chị viết prompt tạo phản hồi khách hàng theo cấu trúc: đồng cảm, xác nhận tiếp nhận, nêu bước kiểm tra, hẹn thời gian cập nhật, cảm ơn. Bước hai, viết prompt yêu cầu AI đề xuất ba phương án xử lý nội bộ, mỗi phương án có bước thực hiện, đầu mối, thời hạn, rủi ro. Bước ba, yêu cầu AI so sánh phương án theo bốn tiêu chí: thời gian, chi phí, mức độ hài lòng khách hàng, rủi ro vận hành. Bước bốn, điều chỉnh giọng điệu phản hồi cho phù hợp: không quá thân mật, không cứng nhắc, không hứa chắc điều chưa kiểm tra, không đổ lỗi cho khách hàng hoặc bộ phận khác. Sản phẩm cuối cùng gồm một phản hồi khách hàng có thể dùng làm mẫu sau khi kiểm chứng và một bảng phương án xử lý để người quản lý cân nhắc. Đây là một trong những phần thiết thực nhất vì anh chị có thể dùng ngay trong các tình huống giao tiếp nhạy cảm.\n\nHọc viên làm cá nhân 12 phút. Sản phẩm: 01 phản hồi khách hàng đã ẩn danh và 01 bảng 3 phương án xử lý. Giảng viên chọn 1 phản hồi để cả lớp góp ý theo tiêu chí: đồng cảm, rõ bước, có thời hạn cập nhật, đúng văn hóa, không lộ dữ liệu, không hứa quá mức.\n\nViệc 4: Hỗ trợ phát triển đội ngũ (25 phút)","hoatdong":""},{"n":20,"title":"Ứng dụng 4: dùng AI hỗ trợ phát triển đội ngũ","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Giảng","dur":3,"content":[],"loithoai":"Mục tiêu: biến việc hằng ngày thành cơ hội huấn luyện\n\nAI hỗ trợ: checklist OJT, câu hỏi coaching, phản hồi SBI, khung IDP\n\nTình huống: nhân viên mới, lỗi công việc, nhân viên tiềm năng\n\nNgười quản lý giữ: đánh giá con người, quyết định phân công, phản hồi cuối cùng\n\nĐầu ra: OJT 15 phút + SBI + ý tưởng IDP 30–60–90 ngày\n\nNhóm ứng dụng thứ tư rất quan trọng nhưng thường bị bỏ quên: phát triển đội ngũ. Trong thực tế, Trưởng/Phó Điện lực không chỉ điều hành công việc mà còn phải làm cho đội ngũ trưởng thành hơn. Nhiều anh chị rất có kinh nghiệm nhưng khi hướng dẫn nhân viên lại làm theo cảm tính: thấy sai thì nhắc, thấy thiếu thì làm thay, ít khi có checklist hoặc cấu trúc phản hồi rõ. AI có thể hỗ trợ biến kinh nghiệm đó thành công cụ huấn luyện. Ví dụ, AI có thể soạn checklist OJT 15 phút cho nhân viên mới trước một việc thường xuyên; gợi ý câu hỏi coaching sau một lỗi công việc; viết bản nháp phản hồi theo mô hình SBI – tình huống, hành vi, tác động; hoặc lập khung kế hoạch phát triển cá nhân 30–60–90 ngày cho một nhân viên tiềm năng. Tuy nhiên, đây là vùng liên quan con người nên người quản lý càng phải giữ vai trò chính. AI không được dùng để đánh giá hay kết luận về một nhân viên cụ thể nếu không có kiểm chứng và trao đổi trực tiếp. Ta chỉ dùng AI để chuẩn bị cấu trúc, câu hỏi, cách diễn đạt và ý tưởng phát triển. Quyết định giao việc gì, phản hồi ra sao, nhân viên cần phát triển hướng nào vẫn thuộc người quản lý. Nếu dùng đúng, AI giúp anh chị huấn luyện có cấu trúc hơn, bớt nói chung chung và tiết kiệm thời gian chuẩn bị.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":21,"title":"Demo 4: từ một lỗi công việc thành phản hồi SBI và checklist OJT","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Demo","dur":5,"content":[],"loithoai":"Tình huống mẫu: nhân viên quên cập nhật tiến độ hồ sơ đúng hạn\n\nPrompt 1: tạo câu hỏi huấn luyện sau lỗi\n\nPrompt 2: viết phản hồi SBI đúng mực\n\nPrompt 3: soạn checklist OJT 15 phút để tránh lặp lỗi\n\nKiểm tra: không quy kết cá nhân, tập trung hành vi và cải thiện\n\nGiảng viên làm mẫu với một tình huống giả định: một nhân viên quên cập nhật tiến độ hồ sơ đúng hạn, khiến khách hàng phải gọi lại hỏi và tổ kinh doanh bị động. Nếu phản hồi theo thói quen, người quản lý có thể nói: “Em làm việc thiếu trách nhiệm, lần sau phải chú ý.” Câu này có thể đúng về cảm xúc nhưng chưa giúp nhân viên biết sửa cụ thể. Ta dùng AI để chuẩn bị phản hồi tốt hơn. Prompt thứ nhất: “Tôi là Phó Điện lực, cần huấn luyện nhân viên sau tình huống quên cập nhật tiến độ hồ sơ. Hãy gợi ý 5 câu hỏi coaching giúp nhân viên tự nhận ra vấn đề và cách cải thiện.” Prompt thứ hai: “Hãy viết phản hồi theo mô hình SBI: Situation – Behavior – Impact, giọng điệu thẳng thắn nhưng tôn trọng, tập trung vào hành vi, không quy kết con người.” Prompt thứ ba: “Hãy soạn checklist OJT 15 phút để hướng dẫn nhân viên cách cập nhật tiến độ hồ sơ đúng hạn, gồm mục tiêu, các bước thực hiện, điểm cần tránh, câu hỏi kiểm tra cuối buổi.” Khi có đầu ra, giảng viên sẽ chỉ ra phần nào tốt: phản hồi cụ thể hơn, ít phán xét hơn, có bước hành động hơn. Đồng thời cũng phải sửa những câu quá mềm hoặc quá chung. Bài học là AI giúp người quản lý chuẩn bị cách huấn luyện có cấu trúc, nhưng sự chân thành, hiểu người và theo dõi sau phản hồi vẫn là việc của anh chị.\n\nGiảng viên chạy demo. Học viên quan sát và ghi lại 3 thành phần của phản hồi SBI: tình huống cụ thể, hành vi quan sát được, tác động đến công việc/khách hàng. Giảng viên chốt: phản hồi tốt phải giúp nhân viên biết sửa gì, không chỉ biết mình bị phê bình.","hoatdong":""},{"n":22,"title":"Thực hành: tạo checklist OJT, phản hồi SBI và ý tưởng IDP","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Thực hành","dur":17,"content":[],"loithoai":"Chọn 1 tình huống giả định tại đơn vị\n\nTạo checklist OJT 15 phút\n\nTạo phản hồi SBI cho một hành vi cụ thể\n\nTạo ý tưởng IDP 30–60–90 ngày\n\nSản phẩm: 3 bản nháp đã chỉnh theo ngữ cảnh đơn vị\n\nĐây là hoạt động phát triển đội ngũ. Anh chị chọn một tình huống giả định, không nêu tên nhân viên thật. Ví dụ: nhân viên mới chưa nắm quy trình cập nhật hồ sơ; tổ trưởng trẻ cần cải thiện kỹ năng giao việc; nhân viên phản hồi khách hàng còn khô cứng; hoặc một nhân viên tiềm năng cần được giao việc để phát triển. Bước một, tạo checklist OJT 15 phút. Prompt cần nêu rõ mục tiêu OJT, đối tượng, việc cần hướng dẫn và đầu ra mong muốn. Bước hai, tạo phản hồi SBI cho một hành vi cụ thể. Hãy nhớ SBI chỉ nói về tình huống, hành vi quan sát được và tác động, không gán nhãn con người. Bước ba, tạo ý tưởng IDP 30–60–90 ngày: 30 ngày đầu nắm chuẩn công việc, 60 ngày thực hành có giám sát, 90 ngày tự chủ hoặc hướng dẫn lại người khác. Khi đọc đầu ra, anh chị kiểm tra ba điểm. Một, nội dung có sát việc thật không. Hai, giọng phản hồi có tôn trọng không. Ba, kế hoạch có khả thi với thời gian và nguồn lực tại đơn vị không. Sản phẩm cuối cùng là ba bản nháp: checklist OJT, phản hồi SBI và ý tưởng IDP. Đây là những công cụ giúp người quản lý chuyển từ “nhắc việc” sang “phát triển người qua công việc”, rất phù hợp với mục tiêu toàn khóa QL01A.\n\nHọc viên làm cá nhân 15 phút, dùng tình huống giả định hoặc dữ liệu đã ẩn danh. Sản phẩm: 01 checklist OJT 15 phút, 01 phản hồi SBI, 01 ý tưởng IDP ngắn. Giảng viên chốt theo tiêu chí: cụ thể, tôn trọng, có bước thực hiện, có thời hạn, không dùng thông tin cá nhân thật.","hoatdong":""},{"n":23,"title":"Tổng hợp 4 nhóm ứng dụng: từ công cụ cá nhân đến năng lực quản lý","part":"4. Ứng dụng vào 4 việc cốt lõi","loai":"Đúc kết","dur":2,"content":[],"loithoai":"Giao ban: rõ việc – rõ người – rõ hạn\n\nBáo cáo: nhanh hơn nhưng phải kiểm chứng số liệu\n\nKhách hàng: phản hồi đồng cảm, phương án rõ, không lộ dữ liệu\n\nĐội ngũ: OJT, SBI, IDP có cấu trúc\n\nGiá trị cuối cùng: thêm thời gian cho điều hành, hiện trường, con người, TNKH\n\nChúng ta vừa đi qua bốn nhóm ứng dụng quan trọng nhất. Nhóm giao ban giúp người quản lý bắt đầu ngày làm việc rõ hơn: rõ việc, rõ người, rõ hạn báo lại. Nhóm báo cáo giúp đọc, tổng hợp và soạn nháp nhanh hơn, nhưng luôn phải kiểm chứng số liệu và nhận xét trước khi dùng. Nhóm khách hàng giúp chuẩn hóa phản hồi, tạo phương án xử lý và so sánh lựa chọn theo nhiều tiêu chí, nhưng phải bảo đảm không lộ dữ liệu và không hứa quá mức. Nhóm phát triển đội ngũ giúp người quản lý có checklist OJT, phản hồi SBI và ý tưởng IDP có cấu trúc hơn, tránh nhắc việc chung chung. Khi nhìn tổng thể, AI không chỉ giúp tiết kiệm vài phút ở từng việc. Giá trị sâu hơn là giúp anh chị chuyển thời gian từ xử lý sự vụ sang làm đúng vai quản lý: giữ nhịp điều hành, xuống hiện trường khi cần, tháo gỡ điểm nghẽn, phát triển nhân viên, nâng cao trải nghiệm khách hàng. Đây cũng là cách chuyên đề AI nối với toàn bộ chương trình QL01A. AI không đứng riêng như một chủ đề công nghệ, mà là công cụ hỗ trợ các năng lực quản trị chuyên nghiệp. Ở phần tiếp theo, anh chị sẽ được giới thiệu bộ 12 prompt quản lý Điện lực/Xí nghiệp để có thể lưu lại, chỉnh nhẹ và dùng ngay sau khóa.\n\nKhông có hoạt động riêng.\n\nNỘI DUNG 5. BỘ 12 PROMPT ỨNG DỤNG TẠI ĐIỆN LỰC","hoatdong":""},{"n":24,"title":"Bộ 12 prompt quản lý Điện lực/Xí nghiệp: cách dùng như sổ tay","part":"5. Bộ 12 prompt","loai":"Giảng","dur":3,"content":[],"loithoai":"12 prompt gắn với 4 nhóm việc cốt lõi\n\nMỗi prompt có: dùng khi nào – mẫu – đầu vào – đầu ra – lưu ý\n\nKhông copy máy móc: luôn chỉnh vai trò, bối cảnh, dữ liệu và định dạng\n\nƯu tiên lưu 3 prompt dùng hằng tuần\n\nMỗi prompt đều phải qua kiểm chứng và bảo mật\n\nBộ 12 prompt là phần anh chị có thể xem như sổ tay mang về. Mục tiêu không phải để học thuộc, mà để copy, chỉnh nhẹ và dùng đúng lúc. Mười hai prompt được thiết kế theo các việc rất quen thuộc: tóm tắt công văn, chuẩn bị giao ban sáng, phân loại đầu việc, tổng hợp sự cố tuần, nhận diện điểm nóng trong khiếu nại, soạn báo cáo tuần, chuẩn hóa tin nhắn phản hồi khách hàng, gợi ý phương án xử lý khiếu nại, soạn checklist kiểm tra an toàn trước thi công, thiết kế OJT 15 phút, viết phản hồi SBI và lập kế hoạch 30 ngày áp dụng AI. Mỗi prompt đều có cấu trúc giống nhau: dùng khi nào, prompt mẫu, dữ liệu đầu vào cần chuẩn bị, đầu ra mong muốn, lưu ý kiểm chứng/bảo mật, gợi ý điều chỉnh theo đơn vị mình. Khi dùng, anh chị đừng copy máy móc. Hãy chỉnh vai trò cho đúng: Trưởng Điện lực, Phó Điện lực, Giám đốc Xí nghiệp, Phó Giám đốc Xí nghiệp. Hãy chỉnh bối cảnh cho đúng: giao ban sáng, báo cáo tuần, phản hồi khách hàng, huấn luyện nhân viên. Hãy dùng dữ liệu mẫu hoặc đã ẩn danh. Và luôn nhớ: prompt tốt chỉ tạo bản nháp tốt; bản dùng chính thức phải qua kiểm chứng và chuẩn hóa.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":25,"title":"Hoạt động: chọn 3 prompt ưu tiên dùng trong 30 ngày","part":"5. Bộ 12 prompt","loai":"Thực hành","dur":5,"content":[],"loithoai":"Đọc nhanh danh sách 12 prompt\n\nChọn 3 prompt gắn với việc mình làm hằng tuần\n\nGhi lý do chọn: tiết kiệm thời gian / giảm lỗi / nâng chất lượng\n\nXác định dữ liệu đầu vào cần chuẩn bị\n\nĐánh dấu prompt cần đặc biệt lưu ý bảo mật\n\nTrước khi đi vào phần kiểm chứng và bảo mật, anh chị chọn ra ba prompt mình sẽ thật sự dùng trong 30 ngày tới. Đây là một bước nhỏ nhưng rất quan trọng. Nếu học xong mà muốn dùng cả 12 prompt cùng lúc, khả năng cao sẽ quá tải và không dùng được gì bền vững. Hãy bắt đầu từ ba việc lặp lại hằng tuần, đang tốn thời gian hoặc hay sai sót. Ví dụ, nếu anh chị thường chuẩn bị giao ban mỗi sáng, prompt giao ban và phân loại đầu việc nên nằm trong nhóm ưu tiên. Nếu anh chị phải làm nhiều báo cáo, prompt tóm tắt công văn, tổng hợp sự cố và soạn báo cáo tuần sẽ hữu ích. Nếu đơn vị đang có áp lực về trải nghiệm khách hàng, hãy chọn prompt phản hồi khách hàng và phương án xử lý khiếu nại. Nếu anh chị muốn phát triển đội ngũ, hãy chọn prompt OJT, SBI hoặc IDP. Với mỗi prompt, ghi lý do chọn: tiết kiệm thời gian, giảm bỏ sót, nâng chất lượng phản hồi, hay giúp huấn luyện nhân viên tốt hơn. Đồng thời ghi dữ liệu đầu vào cần chuẩn bị, ví dụ danh sách việc, dữ liệu sự cố mẫu, tình huống khách hàng đã ẩn danh. Cuối cùng, đánh dấu prompt nào cần đặc biệt lưu ý bảo mật. Đây là bước chuẩn bị trực tiếp cho phiếu ứng dụng AI 30 ngày ở cuối chuyên đề.\n\nHọc viên làm cá nhân 5 phút. Sản phẩm: danh sách 3 prompt ưu tiên, lý do chọn và dữ liệu đầu vào cần chuẩn bị. Giảng viên mời vài học viên chia sẻ để thấy các vai trò khác nhau sẽ ưu tiên prompt khác nhau.\n\nBộ 12 prompt quản lý Điện lực/Xí nghiệp:","hoatdong":""},{"n":26,"title":"Kiểm chứng đầu ra AI theo 4 bước","part":"6. Kiểm chứng và bảo mật","loai":"Giảng","dur":3,"content":[],"loithoai":"1. Sự thực: số liệu, tên, thời gian, địa bàn, dữ kiện\n\n2. Logic: nguyên nhân – kết quả, lập luận, phương án\n\n3. Ngữ cảnh: quy định EVN/EVNSPC, văn hóa, địa bàn, vai trò\n\n4. Chuẩn hóa: số liệu, giọng văn, cấu trúc, trách nhiệm, thời hạn\n\nKhông dùng đầu ra AI nếu chưa đi qua 4 bước này\n\nBây giờ ta hệ thống hóa kỹ năng bắt buộc khi dùng AI: kiểm chứng đầu ra. Có bốn bước. Bước một là kiểm tra sự thực. Mọi số liệu, tên, thời gian, địa bàn, dữ kiện cụ thể đều phải đối chiếu với nguồn gốc. Nếu AI nói khu vực A có nhiều sự cố nhất, ta phải kiểm tra bảng dữ liệu. Nếu AI nêu một thời hạn, quy định hoặc con số, ta phải xem có căn cứ không. Bước hai là kiểm tra logic. AI có thể viết rất trôi chảy nhưng lập luận sai. Ví dụ, thấy khách hàng phàn nàn tiền điện tăng rồi đề xuất một bước không liên quan, hoặc kết luận nguyên nhân khi dữ liệu chưa đủ. Bước ba là kiểm tra ngữ cảnh. Nội dung có phù hợp quy định EVN/EVNSPC, văn hóa ngành điện, đặc thù địa bàn, vai trò Trưởng/Phó Điện lực không? Một tin nhắn có thể đúng ý nhưng giọng điệu quá thân mật hoặc quá cứng. Bước bốn là sửa và chuẩn hóa: chỉnh số liệu, thêm nguồn, sửa giọng văn, chốt trách nhiệm, thời hạn và cách trình bày trước khi dùng. Anh chị có thể xem bốn bước này như “cổng kiểm soát” bắt buộc. Không có đầu ra AI nào được đưa vào báo cáo, phản hồi khách hàng hay chỉ đạo nội bộ nếu chưa đi qua bốn bước này.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":27,"title":"Bảo mật theo 3 vùng dữ liệu: xanh – vàng – đỏ","part":"6. Kiểm chứng và bảo mật","loai":"Giảng","dur":3,"content":[],"loithoai":"Vùng xanh: dữ liệu mẫu, mô phỏng, thông tin công khai, yêu cầu chung\n\nVùng vàng: chỉ dùng sau khi ẩn danh đầy đủ\n\nVùng đỏ: không đưa vào AI công cộng trong mọi trường hợp\n\nẨn danh: bỏ tên, số hợp đồng, địa chỉ, số công tơ, số liệu nhạy cảm\n\nQuy tắc tự hỏi: nếu công khai, mình có chấp nhận được không?\n\nKiểm chứng bảo vệ chất lượng đầu ra, còn bảo mật bảo vệ an toàn dữ liệu đầu vào. Ta chia dữ liệu thành ba vùng để dễ nhớ. Vùng xanh là dữ liệu có thể dùng: tình huống mô phỏng, dữ liệu mẫu, thông tin đã công khai, yêu cầu chung không chứa định danh. Đây là vùng phù hợp nhất cho đào tạo và thử nghiệm ban đầu. Vùng vàng là dữ liệu chỉ dùng sau khi đã ẩn danh đầy đủ: tình huống khách hàng, danh sách công việc, báo cáo nội bộ đã bỏ tên, bỏ số hợp đồng, bỏ địa chỉ, bỏ số công tơ, bỏ số liệu nhạy cảm. Khi ẩn danh, cần giữ cấu trúc tình huống nhưng thay thông tin thật bằng ký hiệu như khách hàng X, khu vực Y, hồ sơ Z, mức tăng khoảng 40%. Vùng đỏ là dữ liệu không đưa vào AI công cộng trong mọi trường hợp: văn bản mật hoặc chưa công khai, dữ liệu khách hàng thật, hồ sơ cán bộ, số liệu tài chính hoặc tổn thất cụ thể, thông tin an toàn hệ thống, sự cố nhạy cảm. Một quy tắc tự hỏi rất thực tế là: nếu nội dung này xuất hiện công khai, đơn vị có chấp nhận được không? Nếu câu trả lời là không, đừng đưa vào AI công cộng. Dùng AI hiệu quả không bao giờ được đánh đổi bằng rủi ro dữ liệu.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":28,"title":"Bài tập soi lỗi “đầu ra AI”","part":"6. Kiểm chứng và bảo mật","loai":"Bài tập 3","dur":10,"content":[],"loithoai":"Prompt lỗi: có tên KH, số hợp đồng, địa chỉ, số công tơ\n\nĐầu ra lỗi: tự nêu số trạm, tự kết luận nguyên nhân, đề xuất phi lý\n\nNhiệm vụ 1: gạch lỗi bảo mật\n\nNhiệm vụ 2: gạch lỗi sự thực – logic – ngữ cảnh\n\nNhiệm vụ 3: viết lại prompt an toàn hơn\n\nThực hiện cá nhân, trên phiếu bài tập\n\nTa làm bài tập soi lỗi, vì đây là cách nhanh nhất để hình thành phản xạ an toàn. Giảng viên chiếu một prompt lỗi: “Khách hàng Nguyễn Văn B, số hợp đồng 67890, số công tơ 123456, địa chỉ số 12 đường X, khiếu nại hóa đơn tháng 6 tăng mạnh. Hãy cho biết nguyên nhân và đề xuất cách xử lý.” Đầu ra AI giả định có các lỗi như: “Địa bàn này có 5 trạm biến áp; nguyên nhân chắc chắn do khách sử dụng thiết bị công suất cao; đề xuất cắt điện ban đêm để giảm tổn thất và giảm hóa đơn cho khách.” Nhiệm vụ đầu tiên của anh chị là gạch lỗi bảo mật trong prompt: tên khách hàng, số hợp đồng, số công tơ, địa chỉ. Nhiệm vụ thứ hai là gạch lỗi đầu ra. “5 trạm biến áp” là dữ kiện AI tự nêu, phải kiểm tra sự thực. “Chắc chắn do khách sử dụng thiết bị công suất cao” là kết luận không đủ dữ liệu. “Cắt điện ban đêm để giảm hóa đơn” là đề xuất phi lý, không phù hợp chuyên môn và trải nghiệm khách hàng. Nhiệm vụ thứ ba là viết lại prompt an toàn: dùng khách hàng X, khu vực Y, mức tăng khoảng 40%, yêu cầu AI chỉ gợi ý các bước kiểm tra và phản hồi, không kết luận nguyên nhân khi chưa có dữ liệu chính thức. Bài tập này giúp anh chị thấy rõ: lỗi AI không chỉ nằm ở đầu ra, mà bắt đầu từ đầu vào thiếu an toàn.\n\nHọc viên làm theo cá nhân người trong 8 phút. Sản phẩm: danh sách lỗi bảo mật, lỗi sự thực, lỗi logic, lỗi ngữ cảnh và prompt viết lại an toàn hơn. Giảng viên chốt bằng bảng đáp án và nhấn mạnh: dữ liệu nhạy cảm phải xử lý trước khi nhập AI; đầu ra phải kiểm chứng trước khi dùng.\n\nChecklist kiểm chứng và bảo mật","hoatdong":""},{"n":29,"title":"Đúc kết kiểm chứng và bảo mật: dùng AI có trách nhiệm","part":"6. Kiểm chứng và bảo mật","loai":"Đúc kết","dur":2,"content":[],"loithoai":"Không dùng bản nháp AI như kết luận cuối cùng\n\nSố liệu phải đối chiếu nguồn chính thức\n\nPhương án phải kiểm tra chuyên môn và ngữ cảnh\n\nDữ liệu phải phân vùng trước khi nhập AI\n\nNgười quản lý chịu trách nhiệm cuối cùng với nội dung sử dụng\n\nTa đúc kết phần an toàn. Một, không dùng bản nháp AI như kết luận cuối cùng. Dù AI viết rất mạch lạc, đầu ra vẫn là bản nháp cần người quản lý đọc lại. Hai, số liệu phải đối chiếu nguồn chính thức. Nếu không thể kiểm chứng nguồn, không đưa vào báo cáo chính thức. Ba, phương án AI gợi ý phải kiểm tra chuyên môn và ngữ cảnh. Một đề xuất có thể nghe hợp lý với người ngoài ngành nhưng không phù hợp vận hành điện, an toàn, quy định hoặc văn hóa phục vụ. Bốn, dữ liệu phải phân vùng trước khi nhập AI. Vùng xanh có thể dùng; vùng vàng phải ẩn danh; vùng đỏ không đưa vào AI công cộng. Năm, người quản lý chịu trách nhiệm cuối cùng. Đây là điểm mấu chốt. Không thể nói “AI bảo vậy” khi báo cáo sai, phản hồi khách hàng không đúng, hoặc để lộ dữ liệu. Dùng AI có trách nhiệm nghĩa là khai thác tốc độ của công cụ nhưng không từ bỏ chuẩn mực quản lý. Khi anh chị giữ đúng năm nguyên tắc này, AI sẽ giúp công việc nhanh hơn, rõ hơn, có cấu trúc hơn mà vẫn an toàn. Phần cuối cùng của chuyên đề sẽ chuyển những gì đã học thành kế hoạch 30 ngày, để khi về đơn vị không bị rơi vào tình trạng học xong rồi để đó.\n\nKhông có hoạt động riêng.","hoatdong":""},{"n":30,"title":"Tổng kết chuyên đề: học viên đã có gì trong tay?","part":"7. Tổng kết chuyên đề","loai":"Đúc kết chuyên đề","dur":3,"content":[],"loithoai":"Hiểu đúng vai trò AI: trợ lý quản lý, không thay thế người quản lý\n\nBiết phân vai: AI hỗ trợ / người quản lý giữ\n\nBiết viết prompt 3 lớp và chấm prompt\n\nCó sản phẩm: giao ban, báo cáo, khách hàng, đội ngũ\n\nCó bộ 12 prompt, checklist an toàn và phiếu 30 ngày\n\nKết thúc chuyên đề, ta nhìn lại những gì anh chị đã có trong tay. Thứ nhất, anh chị hiểu đúng vai trò AI: đó là trợ lý quản lý, giúp xử lý thông tin, soạn nháp, gợi ý và chuẩn hóa, nhưng không thay người quản lý phán đoán, kiểm chứng và quyết định. Thứ hai, anh chị biết phân vai công việc: việc nào có thể dùng AI hỗ trợ, việc nào liên quan an toàn, nhân sự, số liệu chính thức, dữ liệu mật, quyết định khách hàng thì người quản lý phải giữ. Thứ ba, anh chị biết viết prompt theo công thức ba lớp: mục tiêu, vai trò/bối cảnh, đầu ra; và biết tự chấm prompt bằng năm tiêu chí. Thứ tư, anh chị đã tạo các sản phẩm công việc cụ thể: dàn ý giao ban hoặc bảng phân loại đầu việc; bản nháp báo cáo tuần hoặc bảng điểm nóng; phản hồi khách hàng và phương án xử lý; checklist OJT, phản hồi SBI hoặc ý tưởng IDP. Thứ năm, anh chị có bộ 12 prompt để dùng lại, checklist kiểm chứng – bảo mật và phiếu ứng dụng AI 30 ngày. Nếu chỉ nhớ một câu, hãy nhớ: dùng AI để làm nhanh phần xử lý thông tin, nhưng giữ chắc phần trách nhiệm quản lý. Khi về đơn vị, đừng bắt đầu bằng tất cả; hãy chọn một việc lặp lại, một prompt tốt, một sản phẩm trong 30 ngày và làm đến nơi đến chốn.\n\nGiảng viên mời 3 học viên chia sẻ cam kết một câu: “Trong 30 ngày tới, học viên sẽ dùng AI để làm gì…”. Giảng viên kết thúc bằng nhắc lại nguyên tắc kiểm chứng và bảo mật.","hoatdong":""}],"prep":["Trước buổi học, giảng viên chuẩn bị đầy đủ các hạng mục sau để bảo đảm phần làm mẫu (demo) và thực hành diễn ra trơn tru:","Dữ liệu mẫu cho 4 demo: (1) danh sách 12 đầu việc đầu ngày; (2) bảng sự cố lưới điện trong tuần theo khu vực/loại/thời gian khôi phục; (3) tình huống khách hàng khiếu nại tiền điện tăng; (4) tình huống một nhân viên mắc lỗi công việc để dựng phản hồi SBI và checklist OJT.","Thiết bị: máy chiếu; mỗi học viên (hoặc mỗi cặp) 1 thiết bị truy cập được công cụ AI; tài khoản/đường truy cập công cụ AI đã kiểm tra trước.","Phiếu in sẵn: phiếu phân loại 10 việc (slide 6), phiếu chấm prompt theo 5 tiêu chí (slide 10), phiếu ứng dụng AI 30 ngày (slide 31).","Agenda chi tiết đến từng slide"],"prompts12":[{"name":"1. Prompt tóm tắt công văn","rows":[["Dùng khi nào","Khi cần nắm nhanh ý chính của công văn/chỉ đạo không thuộc diện mật hoặc đã được phép sử dụng."],["Prompt mẫu","Tôi là [vai trò]. Hãy tóm tắt văn bản dưới đây thành 5–7 ý chính phục vụ [giao ban/báo cáo/chỉ đạo tổ đội]. Đầu ra gồm: ý chính, việc cần triển khai, đầu mối liên quan, thời hạn nếu có. Không tự suy diễn ngoài nội dung văn bản. Văn bản: [dán phần đã được phép dùng]."],["Dữ liệu đầu vào cần chuẩn bị","Văn bản không mật, không chứa nội dung chưa được phép; hoặc đoạn trích đã được duyệt/ẩn danh."],["Đầu ra mong muốn","Bảng tóm tắt 5–7 ý chính và danh sách việc cần triển khai."],["Lưu ý kiểm chứng/bảo mật","Không đưa văn bản mật/chưa công khai. Đối chiếu lại bản gốc trước khi chỉ đạo."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm yêu cầu “liên hệ với giao ban sáng tại Điện lực/Xí nghiệp” hoặc “chuyển thành checklist triển khai”."]]},{"name":"2. Prompt chuẩn bị giao ban sáng","rows":[["Dùng khi nào","Khi chuẩn bị giao ban 15 phút đầu ngày."],["Prompt mẫu","Tôi là [Trưởng/Phó Điện lực hoặc lãnh đạo Xí nghiệp], chuẩn bị giao ban sáng 15 phút. Đây là danh sách đầu việc đã ẩn danh: [dữ liệu]. Hãy sắp xếp thành 4 mục: việc tồn, việc mới, việc liên quan TNKH, việc an toàn. Trình bày bảng gồm nội dung, người phụ trách gợi ý, hạn báo lại, câu hỏi cần chốt."],["Dữ liệu đầu vào cần chuẩn bị","Danh sách đầu việc, việc tồn, phản ánh khách hàng đã ẩn danh, lưu ý an toàn."],["Đầu ra mong muốn","Dàn ý giao ban 15 phút và bảng chốt việc."],["Lưu ý kiểm chứng/bảo mật","Kiểm tra lại người phụ trách, hạn báo lại, mức ưu tiên. Không nhập tên khách hàng thật."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm mục riêng như “việc liên tổ”, “việc cần Công ty hỗ trợ”, “điểm cần Phó Điện lực theo dõi”."]]},{"name":"3. Prompt phân loại đầu việc theo mức ưu tiên","rows":[["Dùng khi nào","Khi có danh sách việc lộn xộn cần sắp xếp trước khi giao việc."],["Prompt mẫu","Tôi là [vai trò]. Hãy phân loại danh sách đầu việc dưới đây theo 4 nhóm: (1) khẩn cấp cần làm ngay, (2) quan trọng cần lên kế hoạch, (3) có thể giao cấp dưới, (4) có thể lùi lại. Trình bày bảng gồm đầu việc, nhóm ưu tiên, lý do, đầu mối gợi ý, hạn báo lại. Dữ liệu: [danh sách đã ẩn danh]."],["Dữ liệu đầu vào cần chuẩn bị","Danh sách việc trong ngày/tuần đã bỏ thông tin nhạy cảm."],["Đầu ra mong muốn","Bảng phân loại ưu tiên và gợi ý phân công."],["Lưu ý kiểm chứng/bảo mật","AI không biết đặc thù địa bàn; người quản lý phải điều chỉnh ưu tiên."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm tiêu chí “ảnh hưởng khách hàng”, “ảnh hưởng an toàn”, “liên quan cấp trên”."]]},{"name":"4. Prompt tổng hợp sự cố tuần","rows":[["Dùng khi nào","Khi cần tổng hợp dữ liệu sự cố để chuẩn bị báo cáo hoặc giao ban tuần."],["Prompt mẫu","Tôi là [vai trò], cần tổng hợp sự cố tuần. Dữ liệu đã ẩn danh gồm ngày, khu vực, loại sự cố, thời gian khôi phục: [bảng dữ liệu]. Hãy tổng hợp theo khu vực và loại sự cố, nhận diện điểm nóng, trình bày bảng và 3 nhận xét. Không tự tạo số liệu ngoài bảng."],["Dữ liệu đầu vào cần chuẩn bị","Bảng sự cố đã ẩn danh; không dùng dữ liệu nhạy cảm về hệ thống nếu chưa được phép."],["Đầu ra mong muốn","Bảng tổng hợp, điểm nóng, nhận xét sơ bộ."],["Lưu ý kiểm chứng/bảo mật","Kiểm chứng ít nhất một dòng số liệu và mọi nhận xét trước khi dùng."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm cột “mức độ ảnh hưởng KH” hoặc “cần phân tích nguyên nhân gốc”."]]},{"name":"5. Prompt nhận diện điểm nóng trong dữ liệu khiếu nại","rows":[["Dùng khi nào","Khi có danh sách phản ánh/khiếu nại đã ẩn danh và muốn tìm nhóm vấn đề nổi bật."],["Prompt mẫu","Tôi là [vai trò]. Dưới đây là danh sách phản ánh/khiếu nại đã ẩn danh: [dữ liệu]. Hãy nhóm theo nguyên nhân sơ bộ, khu vực, mức độ ảnh hưởng khách hàng; chỉ ra 3 điểm nóng cần ưu tiên kiểm tra. Trình bày bảng và ghi rõ điểm nào cần kiểm chứng thêm."],["Dữ liệu đầu vào cần chuẩn bị","Danh sách phản ánh đã bỏ tên KH, số hợp đồng, địa chỉ, số công tơ."],["Đầu ra mong muốn","Bảng nhóm khiếu nại và 3 điểm nóng cần kiểm chứng."],["Lưu ý kiểm chứng/bảo mật","Không kết luận nguyên nhân khi chưa có dữ liệu chính thức."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm tiêu chí “liên quan phối hợp nội bộ” hoặc “khả năng thành khiếu nại kéo dài”."]]},{"name":"6. Prompt soạn báo cáo tuần","rows":[["Dùng khi nào","Khi cần bản nháp báo cáo tuần từ dữ liệu đã có."],["Prompt mẫu","Tôi là [vai trò], cần soạn bản nháp báo cáo tuần gửi [đối tượng]. Dữ liệu đã ẩn danh: [dữ liệu]. Hãy viết báo cáo theo 4 mục: kết quả nổi bật, vấn đề cần chú ý, nguyên nhân sơ bộ, đề xuất tuần tới. Chỉ dùng dữ liệu cung cấp và đánh dấu phần cần kiểm chứng."],["Dữ liệu đầu vào cần chuẩn bị","Dữ liệu kết quả, sự cố, phản ánh, việc tồn đã ẩn danh."],["Đầu ra mong muốn","Bản nháp báo cáo tuần 4 mục."],["Lưu ý kiểm chứng/bảo mật","Đối chiếu số liệu, bổ sung nhận định quản lý, không dùng nguyên văn khi chưa sửa."],["Gợi ý điều chỉnh theo đơn vị mình","Điều chỉnh độ dài: 1 trang, 5 ý chính, hoặc dạng bảng cho giao ban."]]},{"name":"7. Prompt chuẩn hóa tin nhắn phản hồi khách hàng","rows":[["Dùng khi nào","Khi cần phản hồi khách hàng trong tình huống nhạy cảm đã ẩn danh."],["Prompt mẫu","Tôi là [vai trò]. Hãy soạn tin nhắn phản hồi khách hàng trong tình huống đã ẩn danh: [tình huống]. Yêu cầu: đồng cảm, xác nhận tiếp nhận, nêu bước kiểm tra, hẹn thời gian cập nhật, giọng văn đúng mực, không hứa kết quả khi chưa kiểm tra."],["Dữ liệu đầu vào cần chuẩn bị","Tình huống khách hàng đã ẩn danh, không có tên, địa chỉ, số hợp đồng, số công tơ."],["Đầu ra mong muốn","Tin nhắn phản hồi ngắn gọn, chuyên nghiệp."],["Lưu ý kiểm chứng/bảo mật","Kiểm ngữ cảnh, quy định, giọng điệu; không hứa quá mức."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm yêu cầu “ngắn dưới 120 từ” hoặc “dùng cho gọi điện/nhắn Zalo/quầy giao dịch”."]]},{"name":"8. Prompt gợi ý phương án xử lý khiếu nại","rows":[["Dùng khi nào","Khi cần chuẩn bị các lựa chọn xử lý nội bộ cho tình huống khách hàng."],["Prompt mẫu","Tôi là [vai trò]. Với tình huống khiếu nại đã ẩn danh sau: [tình huống], hãy đề xuất 3 phương án xử lý. Mỗi phương án gồm bước thực hiện, đầu mối phụ trách, thời hạn, ưu điểm, rủi ro. Sau đó so sánh theo thời gian, chi phí, hài lòng khách hàng, rủi ro vận hành."],["Dữ liệu đầu vào cần chuẩn bị","Tình huống mô phỏng hoặc đã ẩn danh."],["Đầu ra mong muốn","Bảng 3 phương án và bảng so sánh."],["Lưu ý kiểm chứng/bảo mật","Phương án chỉ tham khảo; phải kiểm quy định, phân quyền, dữ liệu chính thức."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm tiêu chí “phối hợp tổ kinh doanh – kỹ thuật” hoặc “mức độ cần báo cáo cấp trên”."]]},{"name":"9. Prompt soạn checklist kiểm tra an toàn trước thi công","rows":[["Dùng khi nào","Khi cần chuyển yêu cầu an toàn thành checklist nhắc việc."],["Prompt mẫu","Tôi là [vai trò], cần soạn checklist kiểm tra an toàn trước thi công cho tình huống chung: [mô tả không nhạy cảm]. Hãy trình bày checklist theo 3 giai đoạn: trước khi đi hiện trường, trước khi thao tác, sau khi hoàn thành. Mỗi mục có câu hỏi kiểm tra ngắn."],["Dữ liệu đầu vào cần chuẩn bị","Tình huống chung, quy định công khai hoặc yêu cầu an toàn được phép dùng."],["Đầu ra mong muốn","Checklist an toàn dạng bảng."],["Lưu ý kiểm chứng/bảo mật","Phải đối chiếu quy trình an toàn chính thức; AI không thay quy định chuyên môn."],["Gợi ý điều chỉnh theo đơn vị mình","Điều chỉnh theo loại công việc: kiểm tra hiện trường, sửa chữa, thao tác, phối hợp nhà thầu."]]},{"name":"10. Prompt thiết kế OJT 15 phút","rows":[["Dùng khi nào","Khi cần huấn luyện nhanh nhân viên qua công việc."],["Prompt mẫu","Tôi là [vai trò], cần thiết kế một phiên OJT 15 phút cho nhân viên về [kỹ năng/công việc]. Hãy lập kế hoạch gồm: mục tiêu, 3–5 bước hướng dẫn, việc nhân viên thực hành, câu hỏi kiểm tra cuối buổi, lỗi thường gặp, cách theo dõi sau OJT."],["Dữ liệu đầu vào cần chuẩn bị","Tình huống công việc chung, không nêu tên nhân viên thật."],["Đầu ra mong muốn","Checklist/kịch bản OJT 15 phút."],["Lưu ý kiểm chứng/bảo mật","Không dùng AI để đánh giá cá nhân; chỉ tạo khung huấn luyện."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm cấp độ nhân viên: mới, đã biết cơ bản, tổ trưởng trẻ, nhân viên tiềm năng."]]},{"name":"11. Prompt viết phản hồi SBI cho nhân viên","rows":[["Dùng khi nào","Khi cần chuẩn bị phản hồi cụ thể, tôn trọng sau một hành vi công việc."],["Prompt mẫu","Tôi là [vai trò]. Hãy viết bản nháp phản hồi theo mô hình SBI cho tình huống giả định: [tình huống]. Yêu cầu: Situation – Behavior – Impact, giọng thẳng thắn nhưng tôn trọng, tập trung hành vi quan sát được, thêm 2 câu hỏi giúp nhân viên tự cải thiện."],["Dữ liệu đầu vào cần chuẩn bị","Tình huống giả định hoặc đã ẩn danh, không nêu tên thật."],["Đầu ra mong muốn","Bản nháp phản hồi SBI và câu hỏi coaching."],["Lưu ý kiểm chứng/bảo mật","Người quản lý phải điều chỉnh theo con người thật và trao đổi trực tiếp."],["Gợi ý điều chỉnh theo đơn vị mình","Thêm yêu cầu “ngắn gọn để nói trong 3 phút” hoặc “dùng cho phản hồi tích cực”."]]},{"name":"12. Prompt lập kế hoạch 30 ngày áp dụng AI","rows":[["Dùng khi nào","Khi kết thúc chuyên đề hoặc bắt đầu thử nghiệm tại đơn vị."],["Prompt mẫu","Tôi là [vai trò]. Hãy giúp tôi lập kế hoạch 30 ngày áp dụng AI vào công việc cá nhân. Đầu vào: 3 việc tôi muốn thử [danh sách], 3 prompt ưu tiên [danh sách], dữ liệu không được đưa vào AI [danh sách]. Đầu ra gồm tuần 1–4, sản phẩm cần tạo, người cùng thử nghiệm, cách đo hiệu quả, lưu ý kiểm chứng/bảo mật."],["Dữ liệu đầu vào cần chuẩn bị","Danh sách việc ưu tiên, prompt ưu tiên, nguyên tắc dữ liệu của cá nhân/đơn vị."],["Đầu ra mong muốn","Kế hoạch 30 ngày có mốc tuần và chỉ số đánh giá."],["Lưu ý kiểm chứng/bảo mật","Không biến kế hoạch thành triển khai dữ liệu nhạy cảm; bắt đầu bằng dữ liệu mẫu/ẩn danh."],["Gợi ý điều chỉnh theo đơn vị mình","Điều chỉnh theo vai trò Trưởng Điện lực, Phó Điện lực, Giám đốc Xí nghiệp hoặc Phó Giám đốc Xí nghiệp."]]}],"checklist":[["Bước","Câu hỏi kiểm chứng"],["1. Sự thực","Số liệu, tên, thời gian, địa bàn, dữ kiện có đúng nguồn không? Có con số nào AI tự tạo không?"],["2. Logic","Kết luận có suy ra từ dữ liệu không? Có nhảy cóc nguyên nhân – kết quả không? Phương án có hợp chuyên môn ngành điện không?"],["3. Ngữ cảnh","Có phù hợp quy định EVN/EVNSPC, văn hóa phục vụ khách hàng, đặc thù địa bàn và vai trò quản lý không?"],["4. Chuẩn hóa","Đã sửa số liệu, nguồn, giọng văn, trách nhiệm, thời hạn, định dạng trước khi dùng chưa?"]],"vung":null,"andanh":null,"tomtat":[["Chủ đề","Prompt không tốt thường thiếu gì?","Prompt tốt cần có gì?"],["Giao ban và giao việc","Thiếu danh sách việc, tiêu chí ưu tiên, đầu ra","Dàn ý giao ban 15 phút + bảng giao việc rõ người, rõ hạn"],["Báo cáo và số liệu","Thiếu cấu trúc báo cáo, không yêu cầu kiểm chứng","Báo cáo 4 phần + bảng điểm nóng cần kiểm chứng"],["Xử lý khách hàng","Thiếu bối cảnh, dễ hứa quá mức hoặc kết luận sai","Phản hồi đồng cảm, ẩn danh, không kết luận khi chưa kiểm tra"],["Phát triển đội ngũ","Quá chung, dễ thành lý thuyết đào tạo","Checklist OJT, câu hỏi huấn luyện, phản hồi SBI, IDP ngắn"]],"mau4":[{"name":"1. Giao ban và giao việc","bad":["Hãy giúp tôi chuẩn bị giao ban sáng.","Vì sao chưa tốt:\nPrompt này quá chung chung. AI không biết người dùng là ai, giao ban cho đơn vị nào, có bao nhiêu đầu việc, cần ưu tiên theo tiêu chí nào, đầu ra cần dạng dàn ý hay bảng phân công, có cần gắn với an toàn/TNKH hay không."],"good":["Tôi là Trưởng Điện lực, đang chuẩn bị giao ban sáng 15 phút với các tổ kỹ thuật, kinh doanh, dịch vụ khách hàng và an toàn.","Bối cảnh hôm nay có các đầu việc sau:","03 hồ sơ cấp điện mới đang chờ khảo sát.","02 phản ánh khách hàng về mất điện lặp lại tại một khu vực.","01 công việc kiểm tra an toàn trước thi công đường dây hạ thế.","05 phiếu yêu cầu khách hàng sắp quá hạn xử lý.","01 báo cáo tuần cần hoàn thành trước 16h.","01 tổ đang thiếu nhân sự do có người nghỉ đột xuất.","Mục tiêu của tôi là tổ chức giao ban ngắn gọn, rõ việc, rõ người phụ trách, rõ thời hạn, không lan man.","Hãy giúp tôi lập dàn ý giao ban 15 phút theo 4 phần:","Việc tồn cần xử lý ngay.","Việc mới trong ngày.","Việc liên quan trải nghiệm khách hàng.","Việc liên quan an toàn.","Sau đó hãy lập thêm bảng giao việc gồm các cột: đầu việc, mức ưu tiên, người/đầu mối phụ trách, thời hạn báo lại, điểm cần lưu ý.","Không đưa ra quyết định thay tôi về an toàn, nhân sự hoặc thứ tự ưu tiên cuối cùng. Chỉ đề xuất bản nháp để tôi kiểm tra, điều chỉnh theo thực tế địa bàn và nguồn lực của đơn vị."]},{"name":"2. Báo cáo và số liệu","bad":["Viết báo cáo tuần cho tôi từ số liệu này.","Vì sao chưa tốt:\nPrompt này thiếu vai trò, thiếu mục đích báo cáo, thiếu cấu trúc đầu ra, không yêu cầu kiểm chứng số liệu, không nói rõ báo cáo gửi ai, cần ngắn hay dài, có cần nêu nguyên nhân và đề xuất hay không."],"good":["Tôi là Phó Giám đốc Điện lực phụ trách điều hành công việc tuần. Tôi cần chuẩn bị bản nháp báo cáo tuần gửi Giám đốc Điện lực và Công ty Điện lực.","Dữ liệu mẫu trong tuần như sau:","Tổng số yêu cầu khách hàng tiếp nhận: 126.","Số yêu cầu đã xử lý đúng hạn: 112.","Số yêu cầu quá hạn: 14.","Số sự cố mất điện: 08, trong đó 03 sự cố lặp lại tại cùng một khu vực.","Số phản ánh về hóa đơn tiền điện tăng: 11.","Số hồ sơ cấp điện mới hoàn thành: 18.","Số hồ sơ cấp điện mới còn tồn: 05.","02 trường hợp khách hàng phải gọi lại nhiều lần để hỏi tiến độ.","Mục tiêu là có một bản nháp báo cáo tuần rõ ràng, ngắn gọn, có phân tích quản lý, không chỉ liệt kê số liệu.","Hãy trình bày báo cáo theo 4 phần:","Kết quả chính trong tuần.","Vấn đề nổi bật cần chú ý.","Nguyên nhân sơ bộ cần kiểm tra thêm.","Đề xuất hành động cho tuần tới.","Định dạng đầu ra:","Viết bằng tiếng Việt, giọng văn báo cáo nội bộ chuyên nghiệp.","Mỗi phần không quá 5 bullet.","Có thêm một bảng “điểm nóng cần kiểm chứng” gồm: vấn đề, số liệu liên quan, rủi ro nếu không xử lý, dữ liệu cần kiểm tra lại.","Lưu ý: Không tự tạo thêm số liệu ngoài dữ liệu tôi cung cấp. Nếu có nhận xét nào dựa trên suy luận, hãy ghi rõ là “nhận định sơ bộ cần kiểm chứng”. Không kết luận nguyên nhân cuối cùng nếu chưa có dữ liệu xác minh."]},{"name":"3. Xử lý khách hàng và phối hợp nội bộ","bad":["Soạn tin nhắn trả lời khách hàng đang khiếu nại tiền điện tăng.","Vì sao chưa tốt:\nPrompt này thiếu bối cảnh khách hàng, thiếu mục tiêu phản hồi, thiếu giọng điệu mong muốn, không yêu cầu ẩn danh, không nêu giới hạn pháp lý/nghiệp vụ, dễ dẫn đến câu trả lời quá chung hoặc hứa quá mức."],"good":["Tôi là Trưởng Điện lực, đang cần chuẩn hóa phản hồi cho một khách hàng phản ánh hóa đơn tiền điện tháng này tăng khoảng 40% so với tháng trước.","Bối cảnh đã được ẩn danh:","Khách hàng X phản ánh hóa đơn tăng cao.","Khách hàng đang bức xúc vì cho rằng điện lực ghi chỉ số không chính xác.","Đơn vị cần phản hồi bước đầu, thể hiện sự lắng nghe, đồng thời hẹn kiểm tra lại dữ liệu sử dụng điện và chỉ số công tơ.","Chưa có kết luận cuối cùng về nguyên nhân tăng tiền điện.","Mục tiêu là soạn một tin nhắn phản hồi khách hàng theo hướng: tôn trọng, bình tĩnh, không đổ lỗi, không hứa chắc khi chưa kiểm tra, nhưng vẫn tạo cảm giác khách hàng được quan tâm và có người chịu trách nhiệm theo dõi.","Hãy viết cho tôi 3 phương án tin nhắn phản hồi, gồm:","Phương án ngắn gọn, dùng cho SMS/Zalo.","Phương án đầy đủ hơn, dùng khi nhân viên CSKH gọi điện hoặc nhắn trực tiếp.","Phương án dành cho trường hợp khách hàng đang rất bức xúc.","Mỗi phương án cần có 4 ý:","Ghi nhận phản ánh của khách hàng.","Xin lỗi hoặc chia sẻ về sự bất tiện nếu phù hợp.","Nêu bước kiểm tra tiếp theo.","Cam kết thời điểm phản hồi lại, nhưng không tự đặt thời hạn nếu chưa có quy định; hãy để dạng “[thời hạn theo quy định/đơn vị điền]”.","Không được kết luận rằng khách hàng sai. Không được khẳng định nguyên nhân tăng tiền điện khi chưa kiểm tra. Không dùng thông tin cá nhân thật, số hợp đồng, địa chỉ, số công tơ. Không dùng giọng văn quá thân mật hoặc quá hành chính khô cứng."]},{"name":"4. Phát triển đội ngũ","bad":["Hãy giúp tôi đào tạo nhân viên tốt hơn.","Vì sao chưa tốt:\nPrompt này không nêu nhân viên cần phát triển năng lực gì, tình huống công việc nào, quản lý cần sản phẩm gì: checklist OJT, câu hỏi huấn luyện, phản hồi SBI hay kế hoạch IDP. AI sẽ trả lời chung chung kiểu “cần đào tạo, kèm cặp, phản hồi”."],"good":["Tôi là Phó Giám đốc Điện lực, đang kèm cặp một nhân viên mới phụ trách tiếp nhận và theo dõi hồ sơ yêu cầu khách hàng. Nhân viên này nắm quy trình cơ bản nhưng còn hay quên bước cập nhật tiến độ và chưa chủ động báo lại khi hồ sơ có nguy cơ trễ hạn.","Mục tiêu của tôi là dùng AI để chuẩn bị một buổi OJT ngắn 15 phút tại nơi làm việc, giúp nhân viên hiểu rõ cách theo dõi hồ sơ, báo lại đúng nhịp và giảm tình trạng hồ sơ bị “rơi”.","Hãy giúp tôi tạo 3 sản phẩm:","Sản phẩm 1: Checklist OJT 15 phút\nGồm các phần: mục tiêu buổi OJT, tình huống thực hành, các bước hướng dẫn, câu hỏi kiểm tra hiểu bài, việc nhân viên cần làm sau buổi OJT.","Sản phẩm 2: Bộ câu hỏi huấn luyện\nGồm 6 câu hỏi để tôi hỏi nhân viên, theo hướng giúp nhân viên tự nhận ra vấn đề, không làm nhân viên cảm thấy bị phê bình nặng nề.","Sản phẩm 3: Phản hồi SBI\nViết một phản hồi theo mô hình SBI: Situation – Behavior – Impact, trong bối cảnh nhân viên chậm cập nhật tiến độ hồ sơ khiến khách hàng phải gọi lại nhiều lần.","Yêu cầu trình bày:","Dùng ngôn ngữ gần gũi, phù hợp với quản lý cấp Điện lực.","Không quy kết cá nhân, không dùng giọng trách mắng.","Tập trung vào hành vi cụ thể và cách cải thiện trong tuần tới.","Đầu ra trình bày dạng bảng hoặc bullet để tôi có thể dùng ngay khi kèm cặp nhân viên.","Không đưa ra đánh giá xếp loại nhân sự. Không đề xuất kỷ luật. Không tự tạo thông tin cá nhân của nhân viên. Chỉ hỗ trợ tôi chuẩn bị nội dung huấn luyện và phản hồi phát triển."]}],"framework":[["Phần","Số slide","Mục tiêu học tập","Hoạt động chính","Sản phẩm đầu ra","Thời lượng"],["1. Khởi động","2","Thấy AI là công cụ xử lý việc quản lý hằng ngày, không phải chủ đề công nghệ xa vời.","Poll nhanh, tình huống một ngày nhiều việc vụn, chốt kỳ vọng đầu ra.","Danh sách 3 việc cá nhân muốn dùng AI hỗ trợ.","8′"],["2. AI là trợ lý quản lý","4","Biết việc nào dùng AI hỗ trợ, việc nào người quản lý phải giữ.","Bài tập 1: Phân loại việc cho AI (trên phiếu)","Bảng phân vai 10 việc: AI hỗ trợ / người quản lý giữ.","15′"],["3. Prompt 3 lớp","4","Viết được prompt theo Mục tiêu – Vai trò/Bối cảnh – Đầu ra.","Bài tập 2: Luyện viết promt trên Web app","","27′"],["4. Ứng dụng vào 4 việc cốt lõi","13","Tạo được sản phẩm công việc bằng AI trong giao ban, báo cáo, khách hàng, đội ngũ.","Demo 1: Chuẩn bị giao ban\nDemo 2: Tổng hợp sự cố\nDemo 3: Phản hồi KH\nDemo 4: Phát triển đội ngũ","Dàn ý giao ban, báo cáo tuần, phản hồi khách hàng, checklist OJT/SBI/IDP.","100′\n(mỗi ứng dụng 25 phút)"],["5. Bộ 12 prompt","2","Biết dùng bộ prompt như sổ tay cá nhân.","Giới thiệu cấu trúc prompt, chọn 3 prompt ưu tiên.","Danh sách 3 prompt sẽ lưu dùng thường xuyên.","8′"],["6. Kiểm chứng và bảo mật","4","Áp dụng 4 bước kiểm chứng và 3 vùng dữ liệu.","Bài tập 3: Soi lỗi “đầu ra AI” trên phiếu","Checklist kiểm chứng + prompt đã ẩn danh.","18’"],["7. Tổng kết","1","","","Ứng dụng AI 30 ngày.","2′"]],"quiz":[{"slide":1,"q":"Thông điệp chính của Slide 1 là gì?","opts":["Mở chuyên đề: học AI để làm việc quản lý nhanh hơn, chắc hơn","Một n
