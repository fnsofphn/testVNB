const ORIENTATION={"title": "CHUYÊN ĐỀ ĐỊNH HƯỚNG", "subtitle": "Nền tảng lãnh đạo và quản trị chuyên nghiệp trong bối cảnh mới", "duration": "Thời lượng: 45 phút", "sourceFile": "1. CĐ Định hướng.docx", "items": [{"type": "heading", "text": "1. Mục tiêu chuyên đề"}, {"type": "p", "text": "Sau chuyên đề, học viên có thể:"}, {"type": "p", "text": "Nhận diện ba chuyển biến lớn (tổ chức – chuyển đổi số – kỳ vọng khách hàng) đang tác động trực tiếp đến công việc điều hành hằng ngày;"}, {"type": "p", "text": "Phân biệt hai cách tiếp cận quản lý sự vụ và quản trị chuyên nghiệp qua các biểu hiện cụ thể;"}, {"type": "p", "text": "Tiếp cận ba trụ cột quản trị chuyên nghiệp — Mục tiêu, Dữ liệu, Con người — và năm định hướng năng lực của giai đoạn mới;"}, {"type": "p", "text": "Tự soi chiếu cách điều hành hiện tại của bản thân so với các định hướng đó;"}, {"type": "p", "text": "Định vị lộ trình toàn khóa, ba chủ đề chủ đạo và yêu cầu đầu ra để chuẩn bị tâm thế học tập."}, {"type": "heading", "text": "2. Khởi động: Một ngày của hai người quản lý (8 phút)"}, {"type": "p", "text": "Tương tác học viên với Mentimeter (Vevents 1)"}, {"type": "p", "text": "Giảng viên hỏi cả lớp (giơ tay hoặc Mentimeter): “Một ngày làm việc điển hình của anh/chị, bao nhiêu phần trăm thời gian dành cho việc phát sinh, chữa cháy?”"}, {"type": "p", "text": "A. Dưới 30%    B. 30–50%    C. 50–70%    D. Trên 70%"}, {"type": "p", "text": "Kết quả dự kiến: Giảng viên không bình luận đúng/sai, chỉ ghi nhận: “Chúng ta cùng giữ con số này trong đầu đến cuối buổi.”"}, {"type": "p", "text": "Kể chuyện đối chiếu: Anh A và Chị B"}, {"type": "p", "text": "Giảng viên phác họa nhanh hai nhân vật cùng quy mô đơn vị (~20 nhân viên), cùng năng lực, nhưng khác nhau ở cách tổ chức công việc:"}, {"type": "table", "rows": [["ANH A — điều hành theo sự vụ", "CHỊ B — điều hành theo hệ thống"], ["7h30: mở điện thoại — 20 tin nhắn, 10 email, trả lời từng cái.9h: có sự cố, tự xuống hiện trường vì không yên tâm giao ai.11h: tự cầm máy xử lý khiếu nại.Chiều họp: phát biểu bằng cảm nhận, chưa kịp chuẩn bị số liệu.19h mới về. Tận tâm, chịu khó — nhưng luôn quá tải.", "7h30: nhìn bảng chỉ số tuần.7h45: giao ban 15 phút — mỗi đầu mối báo 1 phút việc hôm nay, điểm cần chú ý.9h: sự cố — giao đầu mối phụ trách, chốt điểm báo lại 10h. Không phải xuống hiện trường.11h: xem lịch sử khách trên hệ thống, đưa chuyên viên trả lời theo kịch bản chuẩn.17h về đúng giờ. Hôm sau đơn vị vẫn chạy tốt."]]}, {"type": "p", "text": "Thông điệp giảng viên: “Khác biệt giữa Anh A và Chị B không nằm ở năng lực hay sự tận tâm — cả hai đều giỏi. Khác biệt nằm ở cách tổ chức công việc. Anh A giải quyết sự vụ; Chị B thiết kế hệ thống. Buổi học hôm nay trả lời câu hỏi: điều gì tạo nên khác biệt đó, và vì sao bối cảnh mới đòi hỏi cách làm của Chị B.”"}, {"type": "heading", "text": "3. Ba chuyển biến đang định hình lại công việc điều hành (9 phút)"}, {"type": "p", "text": "Giảng viên dẫn dắt: cách làm của Anh A từng rất hiệu quả — nhưng môi trường vận hành đã thay đổi. Có ba chuyển biến diễn ra đồng thời, và người quản lý cấp trung là người chịu tác động trực tiếp nhất."}, {"type": "table", "rows": [["Chuyển biến", "Biểu hiện", "Tác động lên người quản lý"], ["1. Tổ chức", "Mô hình quản lý 2 cấp; sắp xếp lại bộ máy; địa bàn rộng hơn, nhiều đầu mối phối hợp hơn.", "Khối lượng và độ phức tạp tăng — trí nhớ cá nhân không còn theo kịp."], ["2. Chuyển đổi số", "Các nền tảng nội bộ, hệ thống chuyên ngành, ứng dụng hiện trường và AI đi vào vận hành.", "Câu hỏi chuyển từ “có dữ liệu không” sang “có biết khai thác dữ liệu để ra quyết định không”."], ["3. Kỳ vọng khách hàng", "Khách so sánh trải nghiệm điện với ngân hàng, TMĐT, viễn thông; mạng xã hội lan tin nhanh.", "Đòi hỏi minh bạch, phản hồi nhanh, cam kết thời gian — TNKH thành thước đo điều hành."]]}, {"type": "p", "text": "Câu hỏi tương tác (hỏi và mời học viên phát biểu ngay tại lớp): “Trong ba chuyển biến này, chuyển biến nào đang gây áp lực lớn nhất cho đơn vị anh/chị lúc này?”; mời 2–3 học viên chia sẻ nhanh, không phân tích sâu."}, {"type": "p", "text": "Chốt: Ba chuyển biến không xảy ra tuần tự mà đồng thời. Hiểu bức tranh chung giúp anh/chị định vị áp lực hiện tại và chọn cách thích ứng — thay vì chỉ phản ứng với từng việc rời rạc."}, {"type": "heading", "text": "4. Từ quản lý sự vụ sang quản trị chuyên nghiệp (10 phút)"}, {"type": "p", "text": "Năm biểu hiện của quản lý sự vụ"}, {"type": "p", "text": "Giảng viên nêu nhanh năm biểu hiện, mời học viên thầm đối chiếu với bản thân:"}, {"type": "p", "text": "Ôm việc vì “không tin ai làm được”;"}, {"type": "p", "text": "Nhắc việc liên tục vì không có cơ chế tự kiểm tra;"}, {"type": "p", "text": "Chữa cháy liên tục vì không có phòng ngừa;"}, {"type": "p", "text": "Quyết định theo cảm tính vì không có dữ liệu đối chiếu;"}, {"type": "p", "text": "Không có gì để đối thoại với cấp trên ngoài báo cáo định tính."}, {"type": "p", "text": "Ba trụ cột của quản trị chuyên nghiệp"}, {"type": "table", "rows": [["Trụ cột", "Bản chất", "Ví dụ tại Điện lực"], ["MỤC TIÊU", "Mỗi việc trả lời: đạt kết quả gì? đo bằng gì? ai chịu trách nhiệm cuối cùng?", "“Giảm tỷ lệ khiếu nại lặp lại xuống dưới 2% trong quý”, có đầu mối, có thời hạn."], ["DỮ LIỆU", "Bằng chứng khách quan hỗ trợ quyết định hằng ngày, không phải báo cáo cuối tháng.", "Tra hệ thống KH: khiếu nại theo nguyên nhân, khu vực, nhân viên tiếp nhận."], ["CON NGƯỜI", "Con người vừa là nguồn lực vừa là mục đích; quyết định tốt vừa xong việc vừa phát triển người.", "Giao việc khó cho NV tiềm năng kèm hướng dẫn — việc xong, người trưởng thành."]]}, {"type": "p", "text": "Nhấn mạnh: ba trụ cột liên kết chặt. Có mục tiêu mà thiếu dữ liệu thì theo dõi thiếu căn cứ; có dữ liệu mà không đầu tư con người thì đội ngũ không đủ sức dùng dữ liệu; có đội ngũ giỏi mà thiếu mục tiêu thì công sức phân tán. Phải phát triển song song."}, {"type": "p", "text": "Thông điệp: Chuyển dịch tư duy không phủ định kinh nghiệm, quan hệ, sự tận tâm — những giá trị đó cần được giữ. Nó bổ sung thêm một tầng: hệ thống, cấu trúc, dữ liệu và tính bền vững, để những gì đã có phát huy tốt hơn trong bối cảnh mới."}, {"type": "heading", "text": "5. Năm định hướng năng lực & lộ trình toàn khóa (10 phút)"}, {"type": "p", "text": "Năm định hướng năng lực của giai đoạn mới"}, {"type": "p", "text": "Định hướng 1 — Điều hành có cơ chế song song với xử lý sự vụ — nhịp giao ban cố định, quy tắc đầu mối–thời hạn–báo lại, điểm kiểm tra giữa chu kỳ."}, {"type": "p", "text": "Định hướng 2 — Dùng dữ liệu hỗ trợ ra quyết định — đặt câu hỏi vào dữ liệu sẵn có; dữ liệu bổ sung cho trực giác, không thay thế."}, {"type": "p", "text": "Định hướng 3 — Phát triển đội ngũ song song hoàn thành công việc — giao việc gắn phát triển, phản hồi tại chỗ, huấn luyện qua công việc."}, {"type": "p", "text": "Định hướng 4 — Ứng dụng công cụ số và AI đúng vai trò — AI lo tác vụ hành chính lặp lại; thời gian tiết kiệm dành cho hiện trường và con người. AI đề xuất – người quản lý quyết định."}, {"type": "p", "text": "Định hướng 5 — Gắn điều hành nội bộ với trải nghiệm khách hàng (TNKH) — rà soát mỗi quyết định qua câu hỏi “khách hàng sẽ cảm nhận thế nào”."}, {"type": "p", "text": "Liên kết: Cơ chế vận hành trên nền dữ liệu → dữ liệu cần đội ngũ đủ năng lực → đội ngũ hiệu quả hơn khi có công cụ số → đích đến cuối cùng của cả hệ thống là TNKH."}, {"type": "p", "text": "Lộ trình toàn khóa & yêu cầu đầu ra"}, {"type": "p", "text": "Giảng viên trình bày cách năm định hướng được triển khai qua ba chuyên đề chuyên môn:"}, {"type": "table", "rows": [["Chuyên đề", "Nội dung", "Giá trị cốt lõi"], ["CĐ 1", "Ứng dụng AI hiệu quả trong công tác quản lý", "AI giúp có THÊM THỜI GIAN — giảm việc hành chính lặp lại."], ["CĐ 2a", "Nâng cao năng lực quản trị công việc trên nền dữ liệu", "Cơ chế giúp đơn vị TỰ VẬN HÀNH — không phụ thuộc một người."], ["CĐ 2b", "Gắn điều hành nội bộ với nâng cao TNKH", "Nâng cao TNKH trong công việc của tuyến đầu"], ["CĐ 3a & CĐ 3b", "Đào tạo, huấn luyện và kèm cặp nhân viên qua công việc", "Huấn luyện giúp ĐỘI NGŨ TRƯỞNG THÀNH — giảm tải bền vững."]]}, {"type": "p", "text": "Vòng xoáy đi lên: AI giải phóng thời gian → có thời gian huấn luyện → cơ chế tạo nhịp → đội ngũ giỏi hơn → TNKH tốt hơn → ít phàn nàn → có thời gian lãnh đạo → tiếp tục đi lên."}, {"type": "heading", "text": "6. Tự soi chiếu & cam kết tâm thế (8 phút)"}, {"type": "p", "text": "Năm câu hỏi tự soi chiếu cho mỗi học viên"}, {"type": "p", "text": "Giảng viên mời cả lớp tạm dừng, tự trả lời — không cần viết ra, chỉ cần thành thật với chính mình:"}, {"type": "p", "text": "Câu 1: Một ngày điển hình, bao nhiêu % thời gian dành cho việc phát sinh, bao nhiêu % cho việc quan trọng nhưng không gấp?"}, {"type": "p", "text": "Câu 2: Lần gần nhất ra một quyết định quan trọng, anh/chị có tra cứu dữ liệu trước khi quyết định không?"}, {"type": "p", "text": "Câu 3: Trong đội ngũ hiện tại, có ai đủ năng lực thay anh/chị xử lý phần lớn công việc nếu anh/chị vắng một tuần không?"}, {"type": "p", "text": "Câu 4: Anh/chị đã từng thử dùng AI để hỗ trợ một tác vụ công việc nào chưa?"}, {"type": "p", "text": "Câu 5: Lần gần nhất ra một quyết định điều hành, anh/chị có nghĩ đến tác động tới khách hàng không?"}, {"type": "p", "text": "Liên hệ Phần 1: Giảng viên nhắc lại con số poll đầu buổi — “Con số đó chính là câu trả lời cho câu hỏi thứ nhất. Năm câu này không để tự phê bình, mà để định vị bản thân trước khi bước vào các chuyên đề.”"}, {"type": "p", "text": "Thông điệp kết:"}, {"type": "p", "text": "“Chương trình đào tạo này chỉ là một phần của quá trình thay đổi. Phần quan trọng còn lại nằm ở tâm thế học hỏi và mức độ áp dụng vào công việc thực tế của mỗi anh/chị. Anh/chị hoàn toàn có thể bắt đầu vòng xoáy đi lên này ngay từ tuần tới — không cần xin phép ai, không cần chờ hệ thống mới.”"}]};
let state={view:'overview',slide:1};

/* ---------- NAV ---------- */
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  nav.appendChild(el('div','nav-sec','Tổng quan & tài nguyên'));
  [['overview','📋 Agenda tổng quan'],
   ['orientation','🧭 Chuyên đề định hướng'],
   ['prompts','🗂 Bộ 12 prompt sổ tay'],
   ['mau','⚖ 4 prompt mẫu (tốt / chưa tốt)'],
   ['check','🔒 Checklist & bảo mật'],
   ['guide','🎯 Cẩm nang hoạt động'],
   ['quiz','📝 Trắc nghiệm kiểm tra']].forEach(([v,t])=>{
    const a=el('a','',`<span class="tt">${t}</span>`);a.dataset.v=v;a.onclick=()=>go(v);nav.appendChild(a);
  });
  PARTS.forEach(p=>{
    nav.appendChild(el('div','nav-sec',esc(p)));
    DATA.slides.filter(s=>s.part===p).forEach(s=>{
      const a=el('a','',`<span class="sn">${s.n}</span><span class="tt">${esc(s.title)}</span><span class="dur">${s.dur}′</span>`);
      a.dataset.slide=s.n;a.onclick=()=>goSlide(s.n);nav.appendChild(a);
    });
  });
}
function setActive(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  let a= state.view==='slide' ? document.querySelector(`.nav a[data-slide="${state.slide}"]`)
                              : document.querySelector(`.nav a[data-v="${state.view}"]`);
  if(a)a.classList.add('active');
}
function go(v){state.view=v;state.slide=null;render();closeNav();window.scrollTo(0,0);}
function goSlide(n){state.view='slide';state.slide=n;render();closeNav();window.scrollTo(0,0);}


/* ---------- ORIENTATION ---------- */
function renderOrientation(){
  const m=$('#main');m.innerHTML='';
  m.appendChild(el('div','eyebrow','Chương trình QL01A · Chuyên đề định hướng'));
  m.appendChild(el('h2','page',esc(ORIENTATION.title)));
  m.appendChild(el('p','sub',esc(ORIENTATION.subtitle)));
  const mb=el('div','metabar');
  const durationLabel=String(ORIENTATION.duration || '').replace('Thời lượng:', '').trim();
  mb.innerHTML=`<span class="chip red">Thời lượng <b>${esc(durationLabel)}</b></span>
    <span class="chip blue"><b>Nền tảng lãnh đạo</b></span>
    <span class="chip green">Mở tâm thế trước CĐ01</span>
    <span class="chip">File: ${esc(ORIENTATION.sourceFile)}</span>`;
  m.appendChild(mb);
  let card=null;
  let list=null;
  const flush=()=>{if(card){m.appendChild(card);card=null;}};
  const flushList=()=>{if(list&&card){card.appendChild(list);list=null;}};
  const isBulletLike=(text)=>{
    return /^(Nhận diện|Phân biệt|Tiếp cận|Tự soi chiếu|Định vị|Ôm việc|Nhắc việc|Chữa cháy|Quyết định|Không có gì|Định hướng \d|Câu \d|CĐ \d|Vòng xoáy)/.test(text);
  };
  const isNote=(text)=>/^(Kết quả dự kiến|Chốt:|Nhấn mạnh:|Liên kết:|Liên hệ Phần 1:)/.test(text);
  const isQuestion=(text)=>/^(Giảng viên hỏi|Câu hỏi tương tác)/.test(text);
  const isMiniTitle=(text)=>{
    return /^(Tương tác học viên|Kể chuyện đối chiếu|Năm biểu hiện|Ba trụ cột|Năm định hướng|Lộ trình toàn khóa|Năm câu hỏi)/.test(text);
  };
  const appendBullet=(text)=>{
    if(!list) list=el('div','bullet-card','<ul></ul>');
    list.querySelector('ul').appendChild(el('li','',esc(text)));
  };
  const appendParagraph=(text)=>{
    flushList();
    const p=el('p','lead',esc(text));
    card.appendChild(p);
  };
  const ensureCard=(title)=>{
    flushList();
    if(card) m.appendChild(card);
    card=el('div','card');
    card.appendChild(el('h3','',`<span class="ic" style="background:var(--red)">i</span>${esc(title)}`));
  };
  ORIENTATION.items.forEach((item, index)=>{
    if(item.type==='heading'){
      ensureCard(item.text);
      return;
    }
    if(!card) ensureCard('Nội dung định hướng');
    if(item.type==='table'){
      flushList();
      const table=el('table');
      const rows=item.rows||[];
      const formatCell=(cell)=>esc(cell)
        .replace(/\.(?=(?:9h|11h|19h|7h45|17h))/g,'.<br>')
        .replace(/\.(?=[A-Z])/g,'.<br>')
        .replace(/(10h\.)(?= Kh)/g,'$1<br>')
        .replace(/((?:19h|17h)[^<]*)$/g,'<span class="strong-line">$1</span>');
      table.innerHTML=rows.map((row,idx)=>'<tr>'+row.map((cell)=>idx===0?`<th>${esc(cell)}</th>`:`<td>${formatCell(cell)}</td>`).join('')+'</tr>').join('');
      card.appendChild(table);
      return;
    }
    if(item.text==='Thông điệp kết:'){
      flushList();
      const next=ORIENTATION.items[index+1];
      const box=el('div','message-box',`<div class="message-title">${esc(item.text.replace(':',''))}</div><p>${esc(next&&next.type==='p'?next.text:'')}</p>`);
      card.appendChild(box);
      return;
    }
    if(index>0 && ORIENTATION.items[index-1].text==='Thông điệp kết:') return;
    if(isMiniTitle(item.text)){
      flushList();
      card.appendChild(el('div','mini-title',esc(item.text)));
      return;
    }
    if(isQuestion(item.text)){
      flushList();
      card.appendChild(el('div','question-box',`<b>Câu hỏi tương tác:</b> ${esc(item.text.replace(/^Giảng viên hỏi cả lớp \(giơ tay hoặc Mentimeter\):\s*/,'').replace(/^Câu hỏi tương tác \(hỏi và mời học viên phát biểu ngay tại lớp\):\s*/,''))}`));
      return;
    }
    if(isNote(item.text)){
      flushList();
      const [label,...rest]=item.text.split(':');
      card.appendChild(el('div','note-box',`<b>${esc(label)}:</b>${rest.length?' '+esc(rest.join(':').trim()):''}`));
      return;
    }
    if(isBulletLike(item.text)){
      appendBullet(item.text);
      return;
    }
    appendParagraph(item.text);
  });
  flushList();
  flush();
  m.appendChild(el('div','callout','<b>Cách dùng:</b> Giảng viên mở mục này trước CĐ01 để thống nhất bối cảnh, tâm thế học tập và lộ trình toàn khóa; sau đó chuyển sang Agenda tổng quan hoặc Slide 1 của chuyên đề Ứng dụng AI.'));
  setActive();
}

  m.appendChild(el('div','eyebrow','Kiểm tra kiến thức giảng viên'));
  m.appendChild(el('h2','page','Bài trắc nghiệm theo từng slide chính'));
  if(!quizState.started){
    m.appendChild(el('p','sub',`Bài gồm ${DATA.quiz.length} câu, mỗi câu gắn một slide cốt lõi. Sau mỗi câu nhận phản hồi ngay; hoàn thành để xem điểm và phần ôn lại có liên kết về slide.`));
    const c=el('div','card');
    c.innerHTML=`<h3><span class="ic" style="background:var(--red)">i</span>Trước khi bắt đầu</h3>
      <ul><li>Không giới hạn thời gian — trả lời thật để tự đánh giá mức nắm bài.</li>
      <li>Mỗi câu chọn một đáp án; chọn xong hiện giải thích và slide liên quan.</li>
      <li>Đạt yêu cầu gợi ý: đúng từ 80% trở lên (${Math.ceil(DATA.quiz.length*0.8)}/${DATA.quiz.length} câu).</li></ul>`;
    m.appendChild(c);
    const b=el('button','btn primary','Bắt đầu làm bài →');b.style.marginTop='8px';
    b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();};m.appendChild(b);setActive();return;
  }
  if(quizState.i>=DATA.quiz.length){renderResult(m);setActive();return;}
  const q=DATA.quiz[quizState.i];
  m.appendChild(el('div','progress',`<i style="width:${Math.round(quizState.i/DATA.quiz.length*100)}%"></i>`));
  const card=el('div','q-card');
  card.appendChild(el('div','q-meta',`Câu ${quizState.i+1} / ${DATA.quiz.length}`));
  const sref=DATA.slides.find(x=>x.n===q.slide);
  const rl=el('div','q-ref',`📑 Liên quan Slide ${q.slide}: ${esc(sref?sref.title:'')}`);rl.onclick=()=>goSlide(q.slide);card.appendChild(rl);
  card.appendChild(el('p','q-text',esc(q.q)));
  const answered=quizState.answers[quizState.i]!=null;
  q.opts.forEach((o,idx)=>{
    const b=el('button','opt',`<span class="l">${String.fromCharCode(65+idx)}</span>${esc(o)}`);
    if(answered){
      const ch=quizState.answers[quizState.i];
      if(idx===q.a)b.classList.add('correct');else if(idx===ch)b.classList.add('wrong');else b.classList.add('dim');
      b.disabled=true;
    }else b.onclick=()=>{quizState.answers[quizState.i]=idx;renderQuiz();};
    card.appendChild(b);
  });
  const why=el('div','q-why'+(answered?' show':''));
  if(answered){const ok=quizState.answers[quizState.i]===q.a;why.innerHTML=`<b>${ok?'✔ Chính xác.':'✘ Chưa đúng.'}</b> ${esc(q.why)}`;}
  card.appendChild(why);
  if(answered){
    const nav=el('div','slidenav');
    const nx=el('button','btn primary',quizState.i<DATA.quiz.length-1?'Câu tiếp →':'Xem kết quả →');
    nx.onclick=()=>{quizState.i++;renderQuiz();window.scrollTo(0,0);};
    nav.appendChild(el('span'));nav.appendChild(nx);card.appendChild(nav);
  }
  m.appendChild(card);setActive();
}
function renderResult(m){
  const total=DATA.quiz.length,correct=quizState.answers.filter((a,i)=>a===DATA.quiz[i].a).length,pct=Math.round(correct/total*100),pass=pct>=80;
  const c=el('div','q-card result');
  c.innerHTML=`<div class="score">${correct}/${total}</div>
    <div class="lab" style="color:${pass?'var(--green)':'var(--red)'}">${pass?'Đạt yêu cầu ('+pct+'%)':'Cần ôn lại ('+pct+'%)'}</div>
    <p style="color:var(--grey);margin-top:8px">${pass?'Bạn đã nắm vững nội dung cốt lõi. Có thể tự tin đứng lớp.':'Hãy xem lại các slide ở phần ôn lại bên dưới rồi làm lại bài.'}</p>`;
  const rev=el('div','');rev.style.textAlign='left';rev.style.marginTop='20px';
  DATA.quiz.forEach((q,i)=>{
    const ok=quizState.answers[i]===q.a;const sref=DATA.slides.find(x=>x.n===q.slide);
    rev.appendChild(el('div','rev-item',
      `<div style="font-weight:700">${esc(q.q)}</div>
       <div style="margin-top:4px">${ok?'<span class="ok">✔ Bạn trả lời đúng</span>':'<span class="no">✘ Đáp án đúng: '+esc(q.opts[q.a])+'</span>'}</div>
       <div style="margin-top:5px;font-size:12.5px;color:var(--grey)">📑 <a onclick="goSlide(${q.slide})" style="cursor:pointer;color:var(--red)">Ôn Slide ${q.slide}: ${esc(sref?sref.title:'')}</a></div>`));
  });
  c.appendChild(rev);m.appendChild(c);
  const b=el('button','btn primary','↻ Làm lại bài');b.style.marginTop='18px';
  b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();window.scrollTo(0,0);};m.appendChild(b);
}

/* ---------- router ---------- */
function render(){
  ({overview:renderOverview,orientation:renderOrientation,slide:renderSlide,prompts:renderPrompts,mau:renderMau,
    check:renderCheck,guide:renderGuide,quiz:renderQuiz}[state.view]||renderOverview)();
}
function toggleNav(){$('#aside').classList.toggle('open');$('#backdrop').classList.toggle('open');}
function closeNav(){$('#aside').classList.remove('open');$('#backdrop').classList.remove('open');}
buildNav();render();

</script>
</body>
</html>
