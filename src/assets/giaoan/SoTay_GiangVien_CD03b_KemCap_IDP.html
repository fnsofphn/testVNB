<style>

.opt.correct{border-color:var(--green);background:#e9f5ef}.opt.correct .l{background:var(--green);color:#fff}

.opt.dim{opacity:.5}

<script>
const DATA={"slides":[{"n":1,"title":"MỤC LỤC CHUYÊN ĐỀ","part":"Nội dung","loai":"Giảng","dur":3,"content":["Nội dung trình bày: 5 chặng","Mô hình kèm cặp có cấu trúc — khái niệm và cách làm từng bước","Lộ trình phát triển đội ngũ qua kế hoạch phát triển cá nhân (IDP)","Thảo luận nhóm — tự xây kế hoạch kèm cặp và IDP tại đơn vị","Liên kết kèm cặp cá nhân với lộ trình phát triển đội ngũ","Video hướng dẫn — lập kế hoạch kèm cặp và IDP mẫu","Câu chốt dưới: \"Kèm một người là chiều sâu — phát triển cả đội là chiều rộng. Người quản lý giỏi làm cả hai.\"","Lời thoại: Đây là lộ trình năm chặng của chuyên đề. Chặng một, ta làm rõ thế nào là kèm cặp có cấu trúc — bắt đầu từ việc phân định vài khái niệm hay bị dùng lẫn, rồi đi vào một mô hình năm bước cụ thể, kèm ba ví dụ thật tại Điện lực để anh/chị thấy nó vận hành ra sao. Chặng hai, ta nâng tầm nhìn từ một buổi kèm cặp lên một lộ trình dài — giới thiệu công cụ kế hoạch phát triển cá nhân, quen gọi tắt là IDP, qua một ví dụ đầy đủ mười hai tháng. Chặng ba là phần thực hành quan trọng nhất: anh/chị chọn một nhân viên thật của mình và thiết kế cả hai tầng — kế hoạch kèm cặp ngắn hạn và lộ trình phát triển dài hạn. Chặng bốn trả lời một câu hỏi mà nhiều đơn vị làm chưa tốt: làm sao để việc kèm cặp từng người và việc phát triển cả đội ngũ ăn khớp với nhau, chứ không phải hai việc rời rạc. Và chặng năm, ta xem một video hướng dẫn cách lập kế hoạch mẫu qua một tình huống rất quen thuộc. Xin anh/chị lưu ý một điều xuyên suốt: kèm một người là đi vào chiều sâu, phát triển cả đội là mở ra chiều rộng — và người quản lý chuyên nghiệp phải làm được cả hai, một cách có chủ đích."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":2,"title":"KẾT NỐI TỪ CHUYÊN ĐỀ 3a","part":"Nội dung","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","CĐ3a đã trang bị: phân biệt nhắc việc – chỉ việc – huấn luyện – kèm cặp; huấn luyện 4 bước tại hiện trường; phản hồi sửa sai giữ động lực; kèm theo 4 nhóm nhân viên","CĐ3a là kỹ năng từng lần — biết cách kèm trong một buổi cụ thể","CĐ3b là cách tổ chức có hệ thống — biết kèm ai, kèm cái gì, trong bao lâu, theo lộ trình nào","Mũi tên: Kỹ năng từng lần (3a) → Hệ thống có cấu trúc + lộ trình (3b)","Lời thoại: Trước khi vào nội dung mới, ta nối lại với Chuyên đề 3a để thấy mạch liền mạch. Ở 3a, anh/chị đã được trang bị những kỹ năng nền rất thiết thực: phân biệt được khi nào chỉ cần nhắc việc, khi nào phải chỉ việc, khi nào là huấn luyện, khi nào là kèm cặp; biết cách huấn luyện bốn bước ngay tại hiện trường — quan sát, hỏi, chỉnh, chốt; biết phản hồi để sửa sai mà không làm nhân viên nản; và biết cách kèm khác nhau cho bốn nhóm nhân viên: người mới, người còn yếu, người tiềm năng, người đang căng thẳng. Tất cả những cái đó là kỹ năng ở cấp độ từng lần — nghĩa là khi ngồi trước một nhân viên trong một buổi cụ thể, anh/chị biết phải làm gì. Nhưng có một khoảng trống. Biết kèm trong một buổi chưa đảm bảo nhân viên sẽ tiến bộ thật, vì tiến bộ cần nhiều buổi nối nhau có chủ đích. Và biết kèm một người chưa đảm bảo cả đội ngũ cùng mạnh lên. Chuyên đề 3b lấp đúng khoảng trống đó: nó không dạy lại kỹ năng từng lần, mà dạy cách tổ chức những buổi kèm cặp ấy thành một hệ thống có cấu trúc, và nối các hệ thống ấy thành một lộ trình phát triển cho cả đội ngũ. Nói ngắn gọn: 3a cho anh/chị công cụ; 3b cho anh/chị bản thiết kế để dùng công cụ ấy một cách bài bản và bền vững.","NỘI DUNG 1 — MÔ HÌNH KÈM CẶP CÓ CẤU TRÚC","Nội dung trình bày:","Mô hình kèm cặp có cấu trúc cho nhân viên và nhóm nhân viên tại Điện lực","Bốn slide làm rõ khái niệm · Năm thành tố của mô hình · Kèm nhóm · Ba ví dụ thực tiễn","Mục tiêu: rời khỏi kèm cặp tùy hứng, bước sang kèm cặp có mục tiêu và đo được","Lời thoại: Chúng ta bắt đầu Nội dung 1 — trái tim của chuyên đề. Phần này trả lời câu hỏi: thế nào là kèm cặp có cấu trúc, và nó khác gì với cách nhiều người vẫn đang làm. Ta sẽ đi tuần tự. Trước hết, làm rõ ba khái niệm hay bị dùng lẫn, vì nếu không phân định đúng thì cả phần sau sẽ mờ. Sau đó, đi vào mô hình năm thành tố — mỗi thành tố tôi sẽ trình bày kỹ trên một slide riêng, kèm ví dụ, để anh/chị nắm chắc từng bước. Tiếp theo, ta bàn khi nào nên kèm một người, khi nào nên kèm cả một nhóm. Và cuối cùng, ba ví dụ thật tại Điện lực để anh/chị thấy mô hình vận hành trong thực tế công việc của mình. Xin anh/chị giữ trong đầu một ý: mục tiêu của cả Nội dung 1 là giúp anh/chị rời khỏi kiểu kèm cặp tùy hứng — gặp lỗi thì nhắc, nhắc xong thì thôi — để bước sang kèm cặp có mục tiêu rõ ràng, có cách đo được kết quả. Đó là khác biệt giữa một người quản lý bận rộn mà đội ngũ vẫn giậm chân, với một người quản lý có phương pháp và đội ngũ tiến bộ thấy được."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":3,"title":"KHÁI NIỆM: KÈM CẶP LÀ GÌ (khái niệm + ví dụ minh họa)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Kèm cặp = đồng hành có mục tiêu với một nhân viên, trong một khoảng thời gian xác định, để nâng một hoặc vài năng lực cụ thể","Ba dấu hiệu nhận biết: (1) có đích rõ (2) kéo dài nhiều buổi, không phải một lần (3) bám việc thật","Ví dụ minh họa: \"Trong 4 tuần tới, mỗi tuần em chủ trì một ca xử lý khiếu nại, tôi quan sát và góp ý; hết 4 tuần em tự khép được ca phức tạp.\"","Phân biệt nhanh: nhắc việc là một câu; kèm cặp là một hành trình có điểm đầu – điểm cuối","Lời thoại: Bắt đầu từ khái niệm gốc: kèm cặp là gì. Kèm cặp là việc người quản lý đồng hành có mục tiêu với một nhân viên, trong một khoảng thời gian xác định, để nâng một hoặc vài năng lực cụ thể của người đó. Xin anh/chị chú ý ba từ khóa trong định nghĩa này, vì chúng là ba dấu hiệu để nhận biết đâu mới thật là kèm cặp. Thứ nhất, \"có mục tiêu\" — tức phải có một đích rõ ràng, biết là kèm để người đó giỏi thêm ở đâu. Thứ hai, \"trong một khoảng thời gian xác định\" — kèm cặp không phải một câu nói thoáng qua, mà kéo dài nhiều buổi, thường vài tuần. Thứ ba, ngầm trong đó, là bám việc thật — kèm ngay trên công việc hằng ngày, không phải giảng lý thuyết. Lấy một ví dụ cho dễ hình dung. Nếu anh/chị nói với một nhân viên: \"Trong bốn tuần tới, mỗi tuần em chủ trì một ca xử lý khiếu nại, tôi sẽ quan sát và góp ý; hết bốn tuần em phải tự khép được một ca phức tạp\" — đó là kèm cặp. Nó có đích, có thời hạn, bám việc thật. Ngược lại, nếu anh/chị chỉ nói \"em cố gắng xử lý khiếu nại tốt hơn nhé\" thì đó chỉ là một lời nhắc, không phải kèm cặp. Khác biệt rất rõ: nhắc việc là một câu; kèm cặp là một hành trình có điểm đầu và điểm cuối."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":4,"title":"BẢN CHẤT & TRẢ LỜI CÂU HỎI CỐT LÕI","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Bản chất: kèm cặp không phải \"làm thay\" cũng không phải \"bỏ mặc\" — mà là trao việc kèm hướng dẫn để người tự làm được","Kèm cặp tốt luôn trả lời được 3 câu hỏi:","Người này cần giỏi thêm ở đâu? (năng lực đích)","Kèm trong bao lâu, đo bằng gì? (thời hạn + thước đo)","Sau khi đạt thì bước tiếp theo là gì? (nối lộ trình)","Nếu không trả lời được 3 câu này → đang nhắc việc, chưa phải kèm cặp","Lời thoại: Hiểu khái niệm rồi, giờ ta đi vào bản chất — tức cái lõi khiến kèm cặp khác với những việc trông giống nó. Bản chất của kèm cặp nằm ở một vị trí cân bằng: nó không phải \"làm thay\" — vì làm thay thì nhân viên không lớn lên; nhưng cũng không phải \"bỏ mặc\" — giao rồi để tự bơi thì nhân viên dễ sai và nản. Kèm cặp đứng giữa: trao việc cho nhân viên nhưng kèm theo hướng dẫn, để cuối cùng người đó tự làm được. Đó là điểm tinh tế nhất mà nhiều người quản lý chưa nắm: mục tiêu của kèm cặp không phải để việc xong hôm nay, mà để người làm được việc đó mãi về sau. Từ bản chất này, tôi đề nghị anh/chị dùng một phép thử đơn giản. Một hoạt động chỉ thật sự là kèm cặp khi nó trả lời được ba câu hỏi cốt lõi. Câu một: người này cần giỏi thêm ở đâu — tức năng lực đích là gì. Câu hai: kèm trong bao lâu và đo kết quả bằng gì — tức có thời hạn và thước đo. Câu ba: sau khi người đó đạt rồi thì bước tiếp theo là gì — tức nối vào lộ trình dài hơn. Nếu anh/chị đang định kèm một nhân viên mà chưa trả lời được ba câu này, thì thực chất anh/chị mới đang nhắc việc, chưa phải kèm cặp. Ba câu hỏi này sẽ theo chúng ta suốt phần còn lại, vì chúng chính là xương sống của mô hình năm thành tố sắp tới."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":5,"title":"ĐỂ KÈM CẶP HIỆU QUẢ, CẦN CHÚ Ý ĐIỀU GÌ","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày: 4 nguyên tắc giữ cho kèm cặp không \"chết yểu\"","Chọn đúng một, hai năng lực — không kèm dàn trải; mỗi chu kỳ tập trung 1–2 điều quan trọng nhất","Bám việc thật, không giảng lý thuyết — kèm ngay trên khiếu nại, phiếu, ca trực đang có","Có nhịp đều + mốc kiểm — hẹn lịch cố định, kiểm giữa chừng, không để \"nhớ thì kèm\"","Chẩn đoán đúng gốc trước khi kèm — phân biệt nhân viên thiếu kỹ năng hay thiếu động lực; kèm sai gốc thì vô ích","Lời thoại: Biết khái niệm và bản chất là một chuyện; kèm sao cho hiệu quả lại là chuyện khác. Rất nhiều kế hoạch kèm cặp bắt đầu hào hứng rồi chết yểu sau hai tuần. Để tránh điều đó, tôi xin nêu bốn điều cần chú ý. Thứ nhất, chọn đúng một đến hai năng lực để tập trung, đừng kèm dàn trải. Một nhân viên có thể yếu nhiều thứ, nhưng nếu anh/chị đòi sửa hết cùng lúc thì họ không nhớ nổi và không tiến bộ ở đâu cả; hãy chọn một, hai điều quan trọng nhất cho mỗi chu kỳ. Thứ hai, bám việc thật, đừng giảng lý thuyết. Kèm cặp hiệu quả nhất diễn ra ngay trên công việc đang có — một khiếu nại đang xử lý, một phiếu đang lập, một ca trực đang diễn ra — chứ không phải trong một buổi giảng tách rời. Thứ ba, phải có nhịp đều và mốc kiểm. Hãy hẹn lịch cố định — ví dụ mỗi tuần một buổi — và kiểm tra giữa chừng, đừng để rơi vào tình trạng nhớ thì kèm, quên thì thôi; chính cái nhịp đều mới tạo ra tiến bộ. Thứ tư, và quan trọng nhất, chẩn đoán đúng gốc trước khi kèm. Anh/chị phải phân biệt được nhân viên đang thiếu kỹ năng hay thiếu động lực — vì hai gốc này cần cách kèm hoàn toàn khác nhau. Nếu người ta thiếu động lực mà anh/chị cứ dạy kỹ năng, hoặc ngược lại, thì công sức đổ sông đổ biển. Bốn điều này là hàng rào bảo vệ, giúp việc kèm cặp của anh/chị đi được đến đích."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":6,"title":"RÀO CẢN TÂM LÝ NGƯỜI QUẢN LÝ CẦN TRÁNH","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày: 4 rào cản tâm lý thường gặp","\"Tự làm cho nhanh\" — tâm lý ngại mất thời gian hướng dẫn → giữ mãi việc, đội ngũ không lớn","\"Không tin ai làm được\" — thiếu tin tưởng → ôm việc, nhân viên mất cơ hội trưởng thành","\"Sợ nhân viên giỏi hơn / thay thế mình\" — giữ bí quyết → đội ngũ yếu, chính mình thành nút thắt","\"Kèm rồi mà chưa thấy khá, thôi bỏ\" — nóng vội, thiếu kiên nhẫn → dừng giữa chừng, phí công đã bỏ ra","Thông điệp: rào cản lớn nhất của kèm cặp không nằm ở nhân viên — mà ở chính tâm lý người quản lý","Lời thoại: Có một sự thật thẳng thắn: rào cản lớn nhất của việc kèm cặp thường không nằm ở nhân viên, mà nằm ở chính tâm lý của người quản lý. Tôi xin nêu bốn rào cản tâm lý phổ biến để anh/chị tự soi. Rào cản thứ nhất là tâm lý \"thôi để tôi làm cho nhanh\". Hướng dẫn một người mới bao giờ cũng chậm hơn tự làm, nên ta ngại; nhưng nếu cứ chọn nhanh trước mắt, ta sẽ giữ việc mãi mãi và đội ngũ không bao giờ lớn. Rào cản thứ hai là \"không tin ai làm được\". Sự thiếu tin tưởng này khiến ta ôm hết việc khó, và vô tình tước mất cơ hội trưởng thành của nhân viên — họ không được thử thì làm sao giỏi lên. Rào cản thứ ba, tế nhị hơn, là nỗi sợ nhân viên giỏi hơn mình hoặc thay thế mình, dẫn đến việc giữ lại bí quyết, dạy nửa vời. Đây là tâm lý nguy hiểm, vì nó khiến cả đội ngũ yếu đi và chính anh/chị trở thành nút thắt cổ chai — đơn vị không thể chạy khi anh/chị vắng. Rào cản thứ tư là sự nóng vội: kèm được vài buổi chưa thấy khá liền nản và bỏ cuộc. Kèm cặp là đầu tư dài hạn, hiệu quả tích lũy dần; bỏ giữa chừng là phí toàn bộ công đã bỏ ra. Tôi mong anh/chị thành thật nhận diện mình đang vướng rào cản nào — vì nhận ra được đã là một nửa của việc vượt qua nó."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":7,"title":"MÔ HÌNH KÈM CẶP CÓ CẤU TRÚC: TỔNG QUAN 5 THÀNH TỐ","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày: giới thiệu khung 5 bước (phiên dịch dễ hiểu)","Một chu kỳ kèm cặp có cấu trúc luôn đi đủ 5 bước, theo thứ tự:","ĐÍCH — kèm để đạt năng lực gì, đo bằng gì","THỰC TRẠNG — người này đang ở đâu, gốc vấn đề là gì","PHƯƠNG ÁN — kèm bằng cách nào","NHỊP & MỐC — kèm theo nhịp nào, kiểm ở đâu","ĐO & CHỐT — làm sao biết đạt, bước tiếp theo là gì","Kèm tùy hứng thường chỉ có bước 3; kèm có cấu trúc có đủ 5","Lời thoại: Bây giờ ta vào phần cốt lõi: mô hình kèm cặp có cấu trúc, gồm năm thành tố. Đây là khung xương giúp anh/chị biến việc kèm cặp từ cảm tính thành bài bản. Một chu kỳ kèm cặp có cấu trúc luôn đi đủ năm bước, theo đúng thứ tự. Bước một là Đích — xác định kèm để đạt năng lực gì và đo bằng gì. Bước hai là Thực trạng — nhìn xem người này đang ở đâu và gốc vấn đề thật sự nằm ở đâu. Bước ba là Phương án — chọn cách kèm phù hợp. Bước bốn là Nhịp và mốc — kèm theo nhịp nào, kiểm tra ở những điểm nào. Bước năm là Đo và chốt — làm sao biết đã đạt, và bước tiếp theo là gì. Tôi sẽ dành mỗi bước một slide riêng để trình bày kỹ, kèm ví dụ, nên ở đây anh/chị chỉ cần nắm bức tranh tổng thể. Xin nhấn mạnh một điều để thấy vì sao mô hình này quan trọng: kèm cặp tùy hứng mà phần lớn chúng ta hay làm thường chỉ dừng ở bước ba — tức là chỉ cách làm rồi thôi. Nó thiếu bước một là đích đo được, và thiếu bước bốn, bước năm là nhịp kiểm và cách chốt. Chính vì thiếu ba bước đó mà việc kèm cặp hay bị trôi, không đo được, và dễ bỏ dở. Mô hình năm thành tố đảm bảo anh/chị không bỏ sót bước nào."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":8,"title":"THÀNH TỐ 1: ĐÍCH (kèm để đạt năng lực gì, đo bằng gì)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Đích = năng lực cụ thể cần đạt sau chu kỳ kèm cặp, phải đo được","Tránh đích chung chung (\"làm tốt hơn\", \"chuyên nghiệp hơn\") → không biết khi nào đạt","Đích tốt có 2 phần: mô tả năng lực + thước đo","Ví dụ tại Điện lực: \"Sau 4 tuần, nhân viên tự khép trọn một khiếu nại hóa đơn mà không cần hỏi lại — đo bằng: 3 khiếu nại liên tiếp tự xử lý đạt\"","Nguyên tắc: không có đích đo được thì không bắt đầu kèm","Lời thoại: Ta đi vào thành tố thứ nhất, cũng là thành tố quan trọng nhất: Đích. Đích là năng lực cụ thể mà anh/chị muốn nhân viên đạt được sau chu kỳ kèm cặp, và điều kiện bắt buộc là nó phải đo được. Sai lầm phổ biến nhất khi kèm cặp là đặt đích chung chung: \"kèm cho em ấy làm tốt hơn\", \"cho chuyên nghiệp hơn\". Vấn đề của những đích này là không ai biết khi nào thì đạt — tốt hơn là bao nhiêu, chuyên nghiệp hơn đo bằng gì? Không đo được thì không bao giờ biết đã xong, và việc kèm cứ kéo dài mơ hồ rồi tan. Một đích tốt luôn có hai phần: phần mô tả năng lực, và phần thước đo. Lấy ví dụ tại Điện lực cho cụ thể. Thay vì nói \"kèm cho nhân viên xử lý khiếu nại tốt hơn\", anh/chị đặt đích thế này: \"Sau bốn tuần, nhân viên tự khép trọn một khiếu nại về hóa đơn mà không cần hỏi lại — và thước đo là ba khiếu nại liên tiếp tự xử lý đạt yêu cầu\". Anh/chị thấy sự khác biệt: đích này rõ ràng, có thời hạn, có con số để biết khi nào thành công. Tôi đề nghị một nguyên tắc cứng: nếu chưa đặt được một đích đo được, thì chưa bắt đầu kèm. Bởi vì bắt đầu kèm mà không có đích rõ thì cũng như lên xe mà không biết đi đâu — chạy nhiều mà không tới nơi nào cả."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":9,"title":"THÀNH TỐ 2: THỰC TRẠNG (chẩn đoán đúng gốc)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Thực trạng = xác định người này đang ở đâu so với đích, và gốc của khoảng cách đó","Hai gốc thường gặp, cần phân biệt:","Thiếu kỹ năng → chưa biết cách làm → giải pháp: hướng dẫn, huấn luyện","Thiếu động lực → biết cách nhưng ngại/mệt/mất hứng → giải pháp: lắng nghe, tháo gỡ, ghi nhận","Ví dụ: nhân viên lúng túng khi khách gay gắt — chẩn đoán: thiếu kỹ năng xử lý cảm xúc, không phải lười","Chẩn đoán sai gốc = kèm sai hướng, tốn công vô ích","Lời thoại: Thành tố thứ hai là Thực trạng — nghĩa là nhìn cho đúng nhân viên đang ở đâu so với đích, và quan trọng hơn, tìm cho ra gốc của khoảng cách đó. Đây là bước hay bị bỏ qua nhất, mà bỏ qua thì trả giá đắt. Vì sao? Vì cùng một biểu hiện bên ngoài có thể đến từ hai gốc hoàn toàn khác nhau. Gốc thứ nhất là thiếu kỹ năng — nhân viên chưa biết cách làm. Với gốc này, giải pháp là hướng dẫn, huấn luyện, chỉ cách. Gốc thứ hai là thiếu động lực — nhân viên biết cách làm rồi nhưng đang ngại, đang mệt, đang mất hứng thú. Với gốc này, dạy thêm kỹ năng vô ích; cái cần là lắng nghe, tháo gỡ khó khăn, ghi nhận để khơi lại động lực. Lấy ví dụ: một nhân viên cứ lúng túng mỗi khi gặp khách hàng gay gắt. Nếu anh/chị chẩn đoán vội là \"nhân viên này yếu, thiếu trách nhiệm\" thì sẽ đi nhắc nhở, phê bình — sai hướng. Chẩn đoán đúng thường là: nhân viên này thiếu kỹ năng xử lý cảm xúc của khách, chưa biết cách giữ bình tĩnh và dẫn dắt cuộc nói chuyện. Khi chẩn đoán đúng như vậy, giải pháp trở nên rõ ràng: kèm cho họ vài kỹ thuật ứng xử với khách khó tính. Tôi nhắc lại nguyên tắc: chẩn đoán sai gốc thì kèm sai hướng, tốn công vô ích. Hãy dành thời gian nhìn cho đúng gốc trước khi chọn cách kèm."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":10,"title":"THÀNH TỐ 3: PHƯƠNG ÁN (kèm bằng cách nào)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày: chọn phương pháp kèm theo gốc đã chẩn đoán","Huấn luyện tại chỗ (OJT — huấn luyện ngay trên công việc thực tế): đi cùng, quan sát, chỉnh, chốt — dùng cho thiếu kỹ năng","Giao việc thử thách + để tự làm: giao ca khó, đứng sau góp ý — dùng cho nhân viên tiềm năng","Phân người giỏi kèm người yếu (kèm bắc cầu): vừa phát triển người được kèm, vừa phát triển người đi kèm","Phản hồi SBI (nêu việc – nêu hành vi – chỉ tác động): sửa sai cụ thể, giữ động lực","Chọn 1–2 phương án phù hợp gốc, không trộn lẫn tất cả","Lời thoại: Thành tố thứ ba là Phương án — chọn cách kèm nào cho phù hợp. Ở Chuyên đề 3a anh/chị đã có sẵn bộ công cụ, giờ ta chọn công cụ đúng theo gốc đã chẩn đoán. Tôi xin điểm lại bốn phương án chính, và giải thích luôn các từ chuyên môn để anh/chị dễ dùng. Phương án một là huấn luyện tại chỗ — tiếng Anh gọi là OJT, viết tắt của cụm \"huấn luyện ngay trên công việc thực tế\". Cách làm là đi cùng nhân viên, quan sát họ làm, rồi chỉnh và chốt bài học — bốn bước anh/chị đã quen ở 3a. Phương án này hợp với nhân viên thiếu kỹ năng. Phương án hai là giao việc thử thách và để tự làm — giao một ca khó, mình đứng sau góp ý chứ không làm thay; cách này hợp với nhân viên tiềm năng, cần được trao cơ hội. Phương án ba là phân người giỏi kèm người yếu, tôi gọi là kèm bắc cầu — cái hay của nó là phát triển cùng lúc hai người: người được kèm giỏi lên, mà người đi kèm cũng trưởng thành vì được trao trách nhiệm. Phương án bốn là phản hồi theo công thức SBI — nêu tình huống, nêu hành vi, chỉ tác động — để sửa sai cụ thể mà không làm mất động lực. Nguyên tắc khi chọn: bám vào gốc đã chẩn đoán ở bước hai, chọn một đến hai phương án phù hợp, đừng trộn lẫn tất cả cùng lúc khiến nhân viên rối."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":11,"title":"THÀNH TỐ 4: NHỊP & MỐC (kèm đều đặn, kiểm đúng điểm)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Nhịp = lịch kèm cặp lặp lại đều đặn (ví dụ: mỗi tuần 1 buổi) — giữ cho việc kèm không bị sự vụ cuốn trôi","Mốc = các điểm kiểm tra giữa chừng để biết đang đi đúng hướng","Công cụ: spot-check (kiểm tra nhanh, xác suất) — mỗi tuần xem 2–3 sản phẩm/việc để biết nhân viên làm ra sao, không cần kiểm toàn bộ","Ví dụ: mỗi tuần 1 buổi huấn luyện tại chỗ + giữa tuần spot-check 2–3 phiếu; cuối tuần chốt tiến bộ","Không có nhịp → kèm cặp bị việc gấp lấn át, tiến bộ đứt quãng","Lời thoại: Thành tố thứ tư là Nhịp và mốc — đây là thành tố quyết định việc kèm cặp có sống được hay không giữa bộn bề công việc. Nhịp là lịch kèm cặp lặp lại đều đặn, ví dụ mỗi tuần một buổi. Vì sao cần nhịp? Vì nếu không đặt lịch cố định, việc kèm cặp luôn bị các việc gấp, việc sự vụ lấn át — hôm nay bận nên hoãn, tuần sau có sự cố nên quên, và thế là tiến bộ đứt quãng. Nhịp cố định biến việc kèm thành một cam kết, không phụ thuộc cảm hứng. Mốc là các điểm kiểm tra giữa chừng để biết mình đang đi đúng hướng hay lệch. Ở đây tôi giới thiệu một công cụ tên là spot-check — dịch nôm na là kiểm tra nhanh theo xác suất. Thay vì kiểm tra toàn bộ việc nhân viên làm, vốn tốn thời gian, anh/chị chỉ cần chọn ngẫu nhiên vài sản phẩm mỗi tuần — chẳng hạn hai đến ba phiếu, hai đến ba khiếu nại — để xem nhân viên xử lý ra sao. Cách này vừa tiết kiệm thời gian, vừa đủ để nắm được thực chất. Ghép lại thành một nhịp mẫu: mỗi tuần một buổi huấn luyện tại chỗ, giữa tuần kiểm tra nhanh hai ba sản phẩm, cuối tuần dành mươi phút chốt lại tiến bộ. Nhịp này gọn nhẹ nhưng đủ để đảm bảo việc kèm cặp chạy đều và anh/chị luôn biết nhân viên đang tiến tới đâu."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":12,"title":"THÀNH TỐ 5: ĐO & CHỐT (biết khi nào đạt, nối bước tiếp)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Đo = đối chiếu kết quả thực tế với thước đo đã đặt ở Thành tố 1","Chốt = xác nhận đạt/chưa đạt và quyết định bước tiếp theo","Hai khả năng khi chốt:","Đạt → ghi nhận + nâng đích mới / đưa vào lộ trình dài hạn (IDP)","Chưa đạt → tìm lại gốc, điều chỉnh phương án, kéo dài thêm","Ví dụ: nhân viên tự khép 3 khiếu nại liên tiếp → đạt → giao hướng dẫn lại cho người mới (nâng đích)","Nguyên tắc: không chốt = không có tiến bộ được ghi nhận; kèm mà không chốt sẽ rơi vào quên lãng","Lời thoại: Thành tố thứ năm, khép lại một chu kỳ, là Đo và chốt. Đo nghĩa là đối chiếu kết quả thực tế của nhân viên với thước đo mà anh/chị đã đặt ngay từ Thành tố một. Đây là lý do vì sao ở bước đầu tôi nhấn mạnh đích phải đo được — nếu đích mơ hồ thì đến đây không có gì để đối chiếu. Chốt nghĩa là xác nhận rõ ràng: đạt hay chưa đạt, và quyết định bước tiếp theo. Có hai khả năng. Khả năng thứ nhất, nhân viên đạt đích — thì anh/chị ghi nhận công khai để tạo động lực, rồi nâng một đích mới cao hơn, hoặc đưa người đó vào một lộ trình phát triển dài hạn mà lát nữa ta gọi là IDP. Khả năng thứ hai, nhân viên chưa đạt — thì đừng vội trách; hãy quay lại tìm gốc xem chẩn đoán ban đầu có đúng không, điều chỉnh phương án và kéo dài thêm một chu kỳ. Lấy ví dụ: nhân viên đã tự khép được ba khiếu nại liên tiếp đạt yêu cầu — vậy là đạt đích. Anh/chị chốt bằng cách ghi nhận trước tổ, rồi nâng đích mới: giao cho chính nhân viên đó hướng dẫn lại cho một người mới. Thế là vừa chốt vừa mở ra bước tiếp theo. Xin nhấn mạnh một nguyên tắc: không chốt thì coi như không có tiến bộ nào được ghi nhận, và việc kèm cặp dễ rơi vào quên lãng. Bước chốt tuy ngắn nhưng là cái neo giữ lại toàn bộ giá trị của cả chu kỳ."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":13,"title":"KÈM MỘT NGƯỜI HAY KÈM CẢ NHÓM?","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":3,"content":["Nội dung trình bày:","Kèm 1–1 khi: năng lực đích mang tính cá nhân, hoặc gắn yếu tố động lực/cảm xúc riêng","Kèm nhóm khi: nhiều nhân viên cùng thiếu một chuẩn chung (ví dụ cả tổ ghi phiếu mỗi người một kiểu)","Kèm bắc cầu: phân nhân viên giỏi kèm nhân viên yếu, dưới thiết kế của người quản lý → nhân đôi giá trị","Cách tổ chức kèm nhóm: 1 buổi chốt \"cách đúng\" chung + người giỏi kèm chéo + kiểm tra nhanh duy trì","Chọn hình thức theo tính chất năng lực đích, không theo thói quen","Lời thoại: Trước khi xem ví dụ, ta trả lời một câu hỏi thực tế: khi nào kèm một người, khi nào kèm cả nhóm? Không phải lúc nào cũng phải kèm một kèm một, vì như thế rất tốn thời gian. Anh/chị nên kèm một–một khi năng lực đích mang tính cá nhân — chỉ riêng một nhân viên yếu một kỹ năng nào đó — hoặc khi vấn đề gắn với động lực, cảm xúc riêng của người đó, cần trao đổi kín đáo. Ngược lại, nên kèm theo nhóm khi nhiều nhân viên cùng thiếu một chuẩn chung. Ví dụ cả tổ đang ghi phiếu tiếp nhận khiếu nại mỗi người một kiểu — đây không phải lỗi cá nhân, mà là thiếu một cách làm chuẩn được thống nhất; lúc này một buổi kèm nhóm hiệu quả hơn nhiều so với kèm từng người. Có một kỹ thuật tôi rất khuyến khích, gọi là kèm bắc cầu: phân một nhân viên giỏi kèm một nhân viên yếu, nhưng dưới sự thiết kế của anh/chị. Cái hay là nó nhân đôi giá trị — người yếu tiến bộ, mà người giỏi cũng trưởng thành thêm vì được trao trách nhiệm hướng dẫn. Về cách tổ chức kèm nhóm: thường bắt đầu bằng một buổi chốt \"cách đúng\" chung cho cả nhóm, sau đó để người giỏi kèm chéo người còn quên, và duy trì bằng kiểm tra nhanh hằng tuần. Nguyên tắc cuối cùng: chọn kèm một người hay kèm nhóm là dựa vào tính chất của năng lực đích, chứ đừng chọn theo thói quen."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":14,"title":"VÍ DỤ 1: KÈM 1–1 MỘT NHÂN VIÊN CÒN YẾU (tổ Kinh doanh)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":4,"content":["Nội dung trình bày: áp mô hình 5 thành tố cho anh D","Đối tượng: anh D, tổ Kinh doanh, hay sai số liệu khi lập báo cáo khiếu nại","Đích (4 tuần): tự lập báo cáo đúng số liệu, không phải sửa lại","Thực trạng: gốc là chưa biết trích xuất đúng dữ liệu trên hệ thống (thiếu kỹ năng, không phải thiếu ý thức)","Phương án: 3 buổi huấn luyện tại chỗ — quan sát → chỉ cách → tự làm hậu kiểm","Nhịp & mốc: mỗi tuần 1 buổi + kiểm tra nhanh 2 phiếu giữa tuần","Đo & chốt: đạt khi 3 báo cáo liên tiếp không phải sửa → giao anh D hướng dẫn người mới","Lời thoại: Giờ ta xem mô hình năm thành tố vận hành qua ba ví dụ thật. Ví dụ một: kèm một nhân viên còn yếu. Anh D ở tổ Kinh doanh hay sai số liệu khi lập báo cáo khiếu nại, tuần nào cũng phải sửa lại, mất thời gian của cả anh D lẫn người quản lý. Ta áp năm thành tố. Đích trong bốn tuần: anh D tự lập được báo cáo đúng số liệu, không phải sửa. Thực trạng — và đây là bước quan trọng: khi ngồi xuống tìm gốc, ta phát hiện anh D không hề thiếu ý thức, không phải lười; gốc là anh chưa biết cách trích xuất đúng trường dữ liệu trên hệ thống, tức thiếu kỹ năng. Chẩn đoán này định hướng toàn bộ cách kèm. Phương án: vì là thiếu kỹ năng nên dùng huấn luyện tại chỗ, ba buổi bám việc thật — buổi một quan sát anh D làm để thấy chính xác anh vướng ở đâu, buổi hai chỉ cách trích xuất đúng, buổi ba để anh tự làm và mình hậu kiểm. Nhịp và mốc: mỗi tuần một buổi, giữa tuần kiểm tra nhanh hai phiếu để bám tiến độ. Đo và chốt: coi như đạt khi anh D làm ba báo cáo liên tiếp không phải sửa; và khi đạt, ta nâng đích — giao anh D hướng dẫn lại cho nhân viên mới, vừa củng cố kỹ năng của anh, vừa biến anh thành nguồn lực kèm cặp cho tổ. Anh/chị thấy: cùng một nhân viên \"hay sai\", nhưng khi đi đủ năm bước, việc kèm trở nên rõ ràng và có đích đến."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":15,"title":"VÍ DỤ 2: KÈM 1–1 MỘT NHÂN VIÊN TIỀM NĂNG (tổ CSKH)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":4,"content":["Nội dung trình bày: áp mô hình cho chị K","Đối tượng: chị K, tổ Chăm sóc khách hàng, giỏi và muốn phát triển","Đích (6 tuần): tự chủ trì xử lý khiếu nại phức tạp; sẵn sàng làm đầu mối một loại việc liên tổ","Thực trạng: đã vững nghiệp vụ; thiếu kinh nghiệm điều phối và sự tự tin khi đứng chủ trì","Phương án: giao việc thử thách + để tự làm — mỗi tuần chủ trì 1 ca, quản lý đứng sau góp ý (không làm thay)","Nhịp & mốc: mỗi tuần 1 ca chủ trì + trao đổi 15' sau mỗi ca","Đo & chốt: khép 2 ca phức tạp độc lập → ghi nhận + đưa vào lộ trình lên tổ phó","Lời thoại: Ví dụ hai cho thấy kèm cặp không chỉ dành cho người yếu — người giỏi cũng cần kèm, nhưng theo cách khác. Chị K ở tổ Chăm sóc khách hàng là một nhân viên giỏi, vững nghiệp vụ và có mong muốn phát triển. Nếu để mặc, chị K dễ chững lại vì không thấy đường đi. Ta áp mô hình. Đích trong sáu tuần: chị K tự chủ trì xử lý được các khiếu nại phức tạp, và sẵn sàng làm đầu mối cho một loại việc liên tổ. Thực trạng: chị K không thiếu nghiệp vụ — cái chị thiếu là kinh nghiệm điều phối và sự tự tin khi phải đứng ra chủ trì trước người khác. Chẩn đoán này rất khác ví dụ một, nên phương án cũng phải khác. Phương án: không phải huấn luyện từng thao tác nữa, mà là giao việc thử thách và để chị tự làm — mỗi tuần giao chị K chủ trì một ca khiếu nại phức tạp, người quản lý đứng sau góp ý chứ tuyệt đối không nhảy vào làm thay, vì làm thay sẽ giết chết sự tự tin đang cần nuôi. Nhịp và mốc: mỗi tuần một ca chủ trì, sau mỗi ca dành mười lăm phút trao đổi để rút kinh nghiệm. Đo và chốt: khi chị K khép được hai ca phức tạp một cách độc lập thì coi là đạt; ta ghi nhận công khai trong giao ban và đưa chị vào một lộ trình dài hơn hướng tới vị trí tổ phó. Chính ví dụ này sẽ nối sang Nội dung 2, khi ta bàn về lộ trình phát triển dài hạn."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":16,"title":"VÍ DỤ 3: KÈM NHÓM ĐỂ CHUẨN HÓA MỘT CÁCH LÀM (cả tổ)","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Giảng","dur":4,"content":["Nội dung trình bày: áp mô hình cho cả tổ","Đối tượng: cả tổ (4–5 nhân viên) ghi phiếu tiếp nhận khiếu nại mỗi người một kiểu","Đích (3 tuần): 100% phiếu có đủ 3 yếu tố: mã phiếu + tên đầu mối + thời gian cam kết","Thực trạng: không ai sai ý thức; thiếu một \"cách đúng\" được chốt chung và nhắc đều","Phương án (kèm nhóm): 1 buổi chốt cách đúng + truyền đạt trong giao ban; anh D (đã đạt ở VD1) kèm chéo người còn quên","Nhịp & mốc: truyền đạt trong giao ban + kiểm tra nhanh 2–3 phiếu/tuần","Đo & chốt: tỷ lệ phiếu đủ 3 yếu tố ổn định ≥ mục tiêu → khen tổ → thành nề nếp","Lời thoại: Ví dụ ba minh họa trường hợp kèm cả một nhóm thay vì một người. Tình huống: cả tổ bốn đến năm nhân viên đang ghi phiếu tiếp nhận khiếu nại mỗi người một kiểu — người ghi đủ, người ghi thiếu, khiến khách hàng nhận trải nghiệm không nhất quán và người quản lý khó kiểm soát. Ta áp mô hình cho cả nhóm. Đích trong ba tuần: một trăm phần trăm phiếu phải có đủ ba yếu tố — mã phiếu, tên đầu mối phụ trách, và thời gian cam kết với khách. Thực trạng: điều quan trọng cần nhận ra là không ai sai ý thức cả; gốc vấn đề là đơn vị chưa chốt một \"cách đúng\" chung và chưa nhắc đều, nên mỗi người làm theo thói quen riêng. Vì gốc là thiếu chuẩn chung nên phương án phải là kèm nhóm, không phải kèm từng người. Cách làm: một buổi chốt \"cách đúng\" cho cả tổ rồi truyền đạt lại trong giao ban; đặc biệt, ta tận dụng kèm bắc cầu — giao anh D, người vừa đạt ở ví dụ một, kèm chéo những đồng nghiệp còn hay quên. Nhịp và mốc: nhắc chuẩn đều trong giao ban, kiểm tra nhanh hai đến ba phiếu mỗi tuần. Đo và chốt: khi tỷ lệ phiếu đủ ba yếu tố ổn định đạt mục tiêu, ta khen cả tổ trong giao ban để biến nó thành nề nếp. Ba ví dụ vừa rồi cho thấy cùng một mô hình năm thành tố linh hoạt áp được cho cả người yếu, người giỏi, lẫn cả một tập thể."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":17,"title":"ĐÚC KẾT NỘI DUNG 1","part":"NỘI DUNG 1 · Mô hình kèm cặp có cấu trúc","loai":"Đúc kết","dur":4,"content":["Nội dung trình bày:","Kèm cặp = đồng hành có mục tiêu, đo được, bám việc thật — khác hẳn nhắc việc","Mô hình 5 thành tố: Đích → Thực trạng → Phương án → Nhịp & mốc → Đo & chốt","Kèm 1–1 hay kèm nhóm tùy tính chất năng lực đích; tận dụng kèm bắc cầu","Rào cản lớn nhất là tâm lý người quản lý — không phải nhân viên","Cầu nối ND2: một chu kỳ kèm cặp giải một năng lực; phát triển cả một con người cần nhiều chu kỳ nối theo lộ trình — đó là IDP","Lời thoại: Ta khép lại Nội dung 1 bằng vài điểm cốt lõi cần mang theo. Thứ nhất, kèm cặp thật sự là đồng hành có mục tiêu, đo được và bám việc thật — nó khác hẳn với việc chỉ nhắc nhở suông. Thứ hai, mô hình năm thành tố là khung xương giúp anh/chị kèm cặp bài bản: Đích, Thực trạng, Phương án, Nhịp và mốc, Đo và chốt — thiếu bước nào việc kèm cũng dễ trôi. Thứ ba, việc chọn kèm một người hay kèm cả nhóm tùy thuộc tính chất của năng lực đích, và anh/chị nên tận dụng kỹ thuật kèm bắc cầu để nhân đôi giá trị. Thứ tư, xin nhắc lại một sự thật thẳng thắn: rào cản lớn nhất của kèm cặp thường nằm ở tâm lý người quản lý — ngại mất thời gian, không tin tưởng, sợ bị vượt qua, hoặc nóng vội bỏ cuộc — chứ không nằm ở nhân viên. Vượt qua được bốn rào cản tâm lý đó, anh/chị đã đi được nửa đường. Bây giờ, một câu hỏi tự nhiên đặt ra. Mỗi chu kỳ kèm cặp mà ta vừa học chỉ giải quyết một, hai năng lực trong vài tuần. Nhưng để phát triển trọn vẹn một con người — đưa họ từ nhân viên bình thường thành nhân sự chủ chốt, thành người kế cận — thì cần nhiều chu kỳ kèm cặp nối tiếp nhau theo một lộ trình dài. Cái lộ trình dài đó có tên là kế hoạch phát triển cá nhân, gọi tắt là IDP. Và đó chính là Nội dung 2.","NỘI DUNG 2 — LỘ TRÌNH PHÁT TRIỂN ĐỘI NGŨ QUA IDP","Nội dung trình bày:","Lộ trình phát triển năng lực đội ngũ qua mô hình IDP (Kế hoạch phát triển cá nhân)","IDP là gì · Khung 6 phần · Một ví dụ đầy đủ 12 tháng","Từ \"kèm một năng lực trong vài tuần\" → \"phát triển một con người trong 6–12 tháng\"","Lời thoại: Chúng ta bước sang Nội dung 2, nơi tầm nhìn được kéo dài ra. Nếu Nội dung 1 tập trung vào một chu kỳ kèm cặp ngắn — vài tuần cho một, hai năng lực — thì Nội dung 2 nhìn cả một con đường phát triển dài sáu đến mười hai tháng cho một con người. Công cụ để làm việc đó là kế hoạch phát triển cá nhân, tiếng Anh gọi là Individual Development Plan, quen viết tắt là IDP. Trong phần này, ta sẽ làm rõ ba điều: IDP là gì và vì sao cần nó; khung của một bản IDP gồm những phần nào; và quan trọng nhất, một ví dụ đầy đủ để anh/chị thấy một bản IDP hoàn chỉnh trông ra sao. Tôi sẽ dùng lại chính nhân vật chị K ở Nội dung 1, để anh/chị thấy chu kỳ kèm cặp sáu tuần vừa rồi ăn khớp vào lộ trình mười hai tháng như thế nào. Ý tưởng cốt lõi cần nắm ngay từ đầu: kèm cặp và IDP không phải hai việc tách rời — kèm cặp là từng chặng, IDP là cả con đường; mỗi chu kỳ kèm cặp chính là một bước trong lộ trình IDP."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":18,"title":"IDP LÀ GÌ VÀ VÌ SAO CẦN","part":"NỘI DUNG 2 · Lộ trình phát triển đội ngũ qua IDP","loai":"Giảng","dur":4,"content":["Nội dung trình bày:","IDP (Kế hoạch phát triển cá nhân) = lộ trình phát triển dài hạn 6–12 tháng của một nhân viên, gắn nhu cầu đơn vị với năng lực và nguyện vọng của người đó","Kế hoạch kèm cặp trả lời \"kèm cái gì trong 4 tuần\"; IDP trả lời \"người này đi tới đâu trong 1 năm, qua những bước nào\"","Không có IDP: phát triển ngẫu nhiên, ai gặp việc gì học việc nấy; người giỏi dễ chững lại","Có IDP: mỗi người có lộ trình rõ; quản lý nhìn được cả đội ngũ mạnh lên ở đâu, ai kế cận vị trí nào","Lời thoại: Trước hết, IDP là gì. IDP — kế hoạch phát triển cá nhân — là lộ trình phát triển dài hạn, thường sáu đến mười hai tháng, của một nhân viên, trong đó gắn nhu cầu của đơn vị với năng lực hiện có và nguyện vọng của chính người đó. Điểm mấu chốt là nó dài hạn và nó cá nhân hóa. Để phân biệt cho rõ với cái ta học ở Nội dung 1: kế hoạch kèm cặp trả lời câu hỏi \"kèm cái gì trong bốn tuần\"; còn IDP trả lời câu hỏi lớn hơn \"người này sẽ đi tới đâu trong một năm, và đi qua những bước nào\". Vậy vì sao cần IDP? Hãy so sánh hai tình huống. Đơn vị không có IDP: việc phát triển con người diễn ra ngẫu nhiên — ai tình cờ gặp việc gì thì học việc nấy, không có chủ đích. Hậu quả là những nhân viên giỏi, có tiềm năng, dễ chững lại và mất động lực vì họ không nhìn thấy con đường đi lên của mình; nhiều người rời đi cũng vì lý do này. Ngược lại, đơn vị có IDP: mỗi người có một lộ trình rõ ràng, biết mình đang ở đâu và sẽ tới đâu. Quan trọng không kém, người quản lý nhìn được bức tranh cả đội ngũ — biết đội ngũ sẽ mạnh lên ở những năng lực nào, và ai đang được chuẩn bị để kế cận vị trí nào. Đây chính là quản trị đội ngũ theo chiều dài, khác với việc chỉ chữa cháy từng lỗi phát sinh."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":19,"title":"KHUNG IDP 6 PHẦN","part":"NỘI DUNG 2 · Lộ trình phát triển đội ngũ qua IDP","loai":"Giảng","dur":4,"content":["Nội dung trình bày: cấu trúc một bản IDP","Điểm xuất phát — năng lực hiện tại (mạnh/yếu) theo khung năng lực vị trí","Đích phát triển — vị trí/vai trò hướng tới trong 6–12 tháng","Khoảng trống năng lực — 2–3 năng lực cần bổ sung để đi từ hiện tại tới đích","Các bước phát triển — chuỗi hành động: kèm cặp gì, đào tạo gì, giao việc phát triển nào","Mốc thời gian & người hỗ trợ — từng bước có mốc (theo quý) và người kèm","Cách đo & rà soát — dấu hiệu đạt từng bước; lịch rà soát định kỳ hằng quý","Lời thoại: Một bản IDP hoàn chỉnh gồm sáu phần, và tôi sẽ đi qua từng phần để anh/chị hình dung. Phần một, điểm xuất phát: mô tả năng lực hiện tại của nhân viên, mạnh gì yếu gì, đối chiếu với khung năng lực của vị trí. Đây là điểm khởi hành, phải nhìn cho thật. Phần hai, đích phát triển: vị trí hoặc vai trò mà người đó hướng tới trong sáu đến mười hai tháng — ví dụ trở thành tổ phó, hoặc thành đầu mối phụ trách một mảng việc. Phần ba, khoảng trống năng lực: đây là phần phân tích cốt lõi — liệt kê hai đến ba năng lực mà người đó còn thiếu để đi từ điểm xuất phát tới đích. Phần bốn, các bước phát triển: chuỗi hành động cụ thể để lấp khoảng trống đó — kèm cặp năng lực nào, cho đi đào tạo gì, giao việc phát triển nào, có cần luân chuyển không. Phần năm, mốc thời gian và người hỗ trợ: mỗi bước gắn với một mốc, thường theo quý, và chỉ rõ ai là người kèm, người hỗ trợ. Phần sáu, cách đo và rà soát: dấu hiệu để biết mỗi bước đã đạt, cùng một lịch rà soát định kỳ, thường mỗi quý một lần. Xin anh/chị lưu ý: giá trị thật của IDP không nằm ở chỗ viết cho đẹp để nộp, mà nằm ở phần bốn và phần sáu — tức các bước hành động và việc rà soát đều đặn. Và điểm nối quan trọng nhất: mỗi \"bước phát triển\" ở phần bốn chính là một chu kỳ kèm cặp có cấu trúc mà ta đã học ở Nội dung 1."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":20,"title":"VÍ DỤ IDP ĐẦY ĐỦ: CHỊ K (12 tháng lên tổ phó CSKH)","part":"NỘI DUNG 2 · Lộ trình phát triển đội ngũ qua IDP","loai":"Giảng","dur":4,"content":["Nội dung trình bày: IDP hoàn chỉnh nối tiếp Ví dụ 2","Điểm xuất phát: nghiệp vụ CSKH vững; đã tự khép được khiếu nại phức tạp; thiếu năng lực điều phối nhóm & phân tích dữ liệu","Đích phát triển: tổ phó CSKH trong 12 tháng","Khoảng trống: (1) điều phối nhóm nhỏ (2) phân tích dữ liệu khiếu nại tìm nguyên nhân gốc (3) kỹ năng kèm cặp nhân viên mới","Các bước (theo quý): Q1 chủ trì khiếu nại phức tạp → Q2 điều phối nhóm 2 người ca cao điểm → Q3 học phân tích dữ liệu, mỗi tháng 1 phát hiện → Q4 kèm 1 nhân viên mới + luân phiên điều hành giao ban","Đo & rà soát: cuối mỗi quý; Q4 đủ điều kiện xét tổ phó","Lời thoại: Giờ ta ghép tất cả lại thành một ví dụ đầy đủ, dùng chính chị K ở Nội dung 1. Nhớ lại: chị K vừa hoàn thành chu kỳ kèm cặp sáu tuần, đã tự khép được khiếu nại phức tạp. Bây giờ ta đặt chị vào một IDP mười hai tháng hướng tới vị trí tổ phó Chăm sóc khách hàng. Điểm xuất phát: nghiệp vụ vững, đã chủ trì được ca phức tạp, nhưng còn thiếu năng lực điều phối nhóm và phân tích dữ liệu. Đích phát triển: trở thành tổ phó trong mười hai tháng. Khoảng trống năng lực gồm ba thứ: một là điều phối một nhóm nhỏ, hai là phân tích dữ liệu khiếu nại để tìm nguyên nhân gốc, ba là kỹ năng kèm cặp lại nhân viên mới. Từ ba khoảng trống đó, ta thiết kế các bước theo quý. Quý một: chủ trì xử lý khiếu nại phức tạp — chính là chu kỳ kèm cặp đã làm, nay trở thành bước đầu của lộ trình. Quý hai: giao chị điều phối một nhóm hai người trong ca cao điểm, đây là giao việc phát triển để rèn năng lực điều phối. Quý ba: học phân tích dữ liệu khiếu nại, mỗi tháng yêu cầu chị trình bày một phát hiện về nguyên nhân gốc. Quý bốn: giao chị kèm một nhân viên mới — vận dụng kèm bắc cầu — và luân phiên thay tổ trưởng điều hành giao ban khi vắng, để chuẩn bị cho vai trò quản lý. Đo và rà soát: cuối mỗi quý nhìn lại một lần, đến hết quý bốn chị K đủ điều kiện xét tổ phó. Anh/chị thấy rõ: bốn bước này chính là bốn chu kỳ kèm cặp và giao việc nối tiếp nhau, tạo thành một con đường phát triển liền mạch."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":21,"title":"ĐÚC KẾT NỘI DUNG 2","part":"NỘI DUNG 2 · Lộ trình phát triển đội ngũ qua IDP","loai":"Đúc kết","dur":4,"content":["Nội dung trình bày:","IDP = lộ trình dài hạn 6–12 tháng; khung 6 phần từ điểm xuất phát đến cách đo & rà soát","Giá trị nằm ở các bước hành động + rà soát định kỳ, không ở bản kế hoạch đẹp","Mỗi bước trong IDP = một chu kỳ kèm cặp có cấu trúc (Nội dung 1)","IDP giúp giữ chân và phát triển người giỏi, chuẩn bị đội ngũ kế cận","Cầu nối Thảo luận: giờ anh/chị tự làm — chọn một nhân viên thật và thiết kế cả hai tầng","Lời thoại: Ta đúc kết Nội dung 2. Điều thứ nhất: IDP là lộ trình phát triển dài hạn sáu đến mười hai tháng, được tổ chức thành sáu phần rõ ràng từ điểm xuất phát cho đến cách đo và rà soát. Điều thứ hai: giá trị thật của IDP không nằm ở một bản kế hoạch trình bày đẹp, mà nằm ở các bước hành động cụ thể và ở việc rà soát định kỳ hằng quý — một IDP viết xong rồi cất tủ thì vô nghĩa. Điều thứ ba, và là mối nối quan trọng nhất giữa hai nội dung: mỗi bước trong IDP chính là một chu kỳ kèm cặp có cấu trúc mà ta học ở Nội dung 1; nói cách khác, IDP là chuỗi các chu kỳ kèm cặp được sắp xếp theo một hướng đi dài hạn. Điều thứ tư: IDP là công cụ mạnh để giữ chân và phát triển người giỏi — vì nó cho họ thấy con đường — đồng thời chuẩn bị sẵn đội ngũ kế cận cho đơn vị, tránh bị động khi có biến động nhân sự. Bây giờ, lý thuyết và ví dụ đã đủ. Đến lúc anh/chị tự tay làm. Trong phần thảo luận nhóm tiếp theo, mỗi anh/chị sẽ chọn một nhân viên thật của mình và thiết kế cả hai tầng: một kế hoạch kèm cặp ngắn hạn theo mô hình năm thành tố, và một IDP dài hạn theo khung sáu phần. Đây là lúc biến kiến thức thành sản phẩm dùng được.","NỘI DUNG 3 — LIÊN KẾT KÈM CẶP CÁ NHÂN VỚI LỘ TRÌNH ĐỘI NGŨ","Nội dung trình bày:","Liên kết giữa kèm cặp cá nhân và lộ trình phát triển đội ngũ — thế nào và làm thế nào","Vì sao hai việc hay bị tách rời · Cơ chế liên kết 4 bước theo vòng lặp quý · Nối lên TNKH","Mục tiêu: kèm cặp không rời rạc mà phục vụ bức tranh phát triển cả đội ngũ","Lời thoại: Chúng ta bước vào Nội dung 3, phần trả lời một câu hỏi mà nhiều đơn vị làm chưa tốt: làm sao để việc kèm cặp từng cá nhân và việc phát triển cả đội ngũ ăn khớp với nhau, trở thành một hệ thống thống nhất chứ không phải hai việc rời rạc. Rất nhiều nơi làm cả hai — có kèm cặp, có nói tới phát triển đội ngũ — nhưng hai việc chạy song song không gặp nhau: kèm cặp thì chữa cháy theo lỗi phát sinh, còn cái gọi là phát triển đội ngũ thì nằm trên giấy. Trong phần này, ta sẽ làm rõ hai điều. Thứ nhất, \"thế nào là liên kết\" — phân biệt giữa làm rời rạc và làm có liên kết. Thứ hai, \"làm thế nào\" — một cơ chế bốn bước chạy theo vòng lặp hằng quý để nối hai việc lại. Và cuối cùng, ta nối tất cả lên tầng cao nhất: trải nghiệm khách hàng và vòng xoáy đi lên mà anh/chị đã quen từ các chuyên đề trước. Mục tiêu của Nội dung 3 là để mỗi lần anh/chị kèm cặp một nhân viên không còn là một việc lẻ, mà là một nước đi có chủ đích trong bức tranh phát triển của cả đội ngũ."],"loithoai":"","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nội dung trình bày:","IDP = lộ trình dài hạn 6–12 tháng; khung 6 phần từ điểm xuất phát đến cách đo & rà soát"],["Giá trị nằm ở các bước hành động + rà soát định kỳ, không ở bản kế hoạch đẹp","Mỗi bước trong IDP = một chu kỳ kèm cặp có cấu trúc (Nội dung 1)"],["IDP giúp giữ chân và phát triển người giỏi, chuẩn bị đội ngũ kế cận","Cầu nối Thảo luận: giờ anh/chị tự làm — chọn một nhân viên thật và thiết kế cả hai tầng"],["Lời thoại: Ta đúc kết Nội dung 2. Điều thứ nhất: IDP là lộ trình phát triển dài hạn sáu đến mười hai tháng, được tổ c vòng lặp hằng quý để nối hai việc lại. Và cuối cùng, ta nối tất cả lên tầng cao nhất: trải nghiệm khách hàng và vòng xoáy đi lên mà anh/chị đã quen từ các chuyên đề trước. Mục tiêu của Nội dung 3 là để mỗi lần anh/chị kèm cặp một nhân viên không còn là một việc lẻ, mà là một nước đi có chủ đích trong bức tranh phát triển của cả đội ngũ.",""]]}]},{"n":22,"title":"THẾ NÀO LÀ LIÊN KẾT (rời rạc vs có hệ thống)","part":"NỘI DUNG 3 · Liên kết kèm cặp cá nhân với lộ trình đội ngũ","loai":"Giảng","dur":4,"content":["Nội dung trình bày: bảng đối chiếu","Rời rạc (hai việc tách nhau)","Liên kết (hai việc là một hệ)","Kèm cặp chạy theo lỗi vừa phát sinh","Kèm cặp theo khoảng trống năng lực đội ngũ đang cần","IDP viết xong cất tủ","IDP là nguồn xác định ưu tiên kèm cặp mỗi quý","Ai rảnh thì kèm, kèm gì cũng được","Ưu tiên kèm năng lực đội ngũ thiếu nhất / rủi ro nhất","Người giỏi lên nhờ may mắn gặp việc","Người giỏi lên theo lộ trình, có kế cận rõ","Lời thoại: Trước hết, thế nào là liên kết. Cách dễ nhất để hiểu là so sánh làm rời rạc với làm có liên kết, qua bốn cặp đối chiếu. Cặp thứ nhất, về cách chọn việc kèm: làm rời rạc thì kèm cặp chạy theo lỗi vừa phát sinh — hôm nay nhân viên sai chỗ nào thì nhắc chỗ đó, hoàn toàn bị động. Làm có liên kết thì kèm cặp theo khoảng trống năng lực mà đội ngũ đang thật sự cần — chủ động chọn. Cặp thứ hai, về vai trò của IDP: làm rời rạc thì IDP viết xong cất tủ, không dùng tới. Làm có liên kết thì IDP trở thành nguồn để xác định mỗi quý nên ưu tiên kèm ai, kèm cái gì. Cặp thứ ba, về thứ tự ưu tiên: làm rời rạc thì ai rảnh thì kèm, kèm gì cũng được, tùy hứng. Làm có liên kết thì ưu tiên kèm đúng năng lực mà đội ngũ đang thiếu nhất hoặc rủi ro nhất — ví dụ nếu cả đội chỉ có một người biết xử lý một loại việc quan trọng, thì đó là rủi ro cần kèm thêm người ngay. Cặp thứ tư, về cách người giỏi phát triển: làm rời rạc thì người giỏi lên nhờ may mắn tình cờ gặp việc hay. Làm có liên kết thì người giỏi lên theo một lộ trình rõ ràng, và đơn vị luôn có người kế cận. Anh/chị thấy: liên kết không phải làm thêm việc, mà là làm cùng những việc đó một cách có chủ đích và có hướng."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":23,"title":"LÀM THẾ NÀO: CƠ CHẾ LIÊN KẾT 4 BƯỚC (vòng lặp quý)","part":"NỘI DUNG 3 · Liên kết kèm cặp cá nhân với lộ trình đội ngũ","loai":"Giảng","dur":25,"content":["Nội dung trình bày: vòng lặp theo quý","Nhìn đội ngũ — lập bản đồ năng lực: mỗi người mạnh/yếu gì, ai kế cận vị trí nào, khoảng trống nào rủi ro nhất (rà soát đầu quý)","Chọn ưu tiên — từ bản đồ, chọn 2–3 ưu tiên phát triển của quý","Kèm cặp có cấu trúc — mỗi ưu tiên → 1 hoặc vài chu kỳ kèm cặp 5 thành tố (nhịp tuần: OJT + kiểm tra nhanh)","Rà soát & cập nhật IDP — cuối quý đo kết quả, cập nhật IDP, chọn ưu tiên quý sau","Nhịp: bước 1 & 4 theo quý; bước 3 theo tuần → kèm cặp hằng tuần luôn \"neo\" vào lộ trình quý","Lời thoại: Giờ đến phần \"làm thế nào\" — một cơ chế bốn bước chạy theo vòng lặp hằng quý để nối kèm cặp cá nhân với phát triển đội ngũ. Bước một, nhìn đội ngũ: đầu mỗi quý, anh/chị lập một bản đồ năng lực đơn giản của cả đội — mỗi người mạnh gì, yếu gì, ai đang được chuẩn bị kế cận vị trí nào, và đâu là khoảng trống rủi ro nhất. Rủi ro nhất thường là những năng lực chỉ một người nắm được. Bước hai, chọn ưu tiên: từ bản đồ đó, đừng ôm hết, chỉ chọn hai đến ba ưu tiên phát triển cho quý này — gắn với mục tiêu đơn vị và với IDP của từng người. Bước ba, kèm cặp có cấu trúc: mỗi ưu tiên biến thành một hoặc vài chu kỳ kèm cặp năm thành tố cho cá nhân hoặc nhóm, và đưa việc kèm này vào nhịp tuần — huấn luyện tại chỗ, kiểm tra nhanh — đúng như đã học. Bước bốn, cuối quý rà soát và cập nhật: đo kết quả các chu kỳ kèm cặp, cập nhật lại IDP từng người, rồi chọn ưu tiên cho quý sau. Điểm tinh tế của cơ chế này nằm ở nhịp: bước một và bước bốn chạy theo nhịp quý, còn bước ba chạy theo nhịp tuần. Nghĩa là hoạt động kèm cặp hằng tuần của anh/chị luôn được neo vào lộ trình quý, không trôi tự do. Nhờ vậy, mỗi buổi huấn luyện nhỏ hằng tuần đều góp vào một bức tranh lớn có chủ đích — đó chính là liên kết trong thực tế."],"loithoai":"","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nội dung trình bày: vòng lặp theo quý","Nhìn đội ngũ — lập bản đồ năng lực: mỗi người mạnh/yếu gì, ai kế cận vị trí nào, khoảng trống nào rủi ro nhất (rà soát đầu quý)"],["Chọn ưu tiên — từ bản đồ, chọn 2–3 ưu tiên phát triển của quý","Kèm cặp có cấu trúc — mỗi ưu tiên → 1 hoặc vài chu kỳ kèm cặp 5 thành tố (nhịp tuần: OJT + kiểm tra nhanh)"],["Rà soát & cập nhật IDP — cuối quý đo kết quả, cập nhật IDP, chọn ưu tiên quý sau","Nhịp: bước 1 & 4 theo quý; bước 3 theo tuần → kèm cặp hằng tuần luôn \"neo\" vào lộ trình quý"],["Lời thoại: Giờ đến phần \"làm thế nào\" — một cơ chế bốn bước chạy theo vòng lặp hằng quý để nối kèm cặp cá nhân với phát triển đội ngũ. Bước một, nhìn đội ngũ: đầu mỗi quý, anh/chị lập một bản đồ năng lực đơn giản của cả đội — mỗi người mạnh gì, yếu gì, ai đang được chuẩn bị kế cận vị trí nào, và đâu là khoảng trống rủi ro nhất. Rủi ro nhất thường là những năng lực chỉ một người nắm được. Bước hai, chọn ưu tiên: từ bản đồ đó, đừng ôm hết, chỉ chọn hai đến ba ưu tiên phát triển cho quý này — gắn với mục tiêu đơn vị và với IDP của từng người. Bước ba, kèm cặp có cấu trúc: mỗi ưu tiên biến thành một hoặc vài chu kỳ kèm cặp năm thành tố cho cá nhân hoặc nhóm, và đưa việc kèm này vào nhịp tuần — huấn luyện tại chỗ, kiểm tra nhanh — đúng như đã học. Bước bốn, cuối quý rà soát và cập nhật: đo kết quả các chu kỳ kèm cặp, cập nhật lại IDP từng người, rồi chọn ưu tiên cho quý sau. Điểm tinh tế của cơ chế này nằm ở nhịp: bước một và bước bốn chạy theo nhịp quý, còn bước ba chạy theo nhịp tuần. Nghĩa là hoạt động kèm cặp hằng tuần của anh/chị luôn được neo vào lộ trình quý, không trôi tự do. Nhờ vậy, mỗi buổi huấn luyện nhỏ hằng tuần đều góp vào một bức tranh lớn có chủ đích — đó chính là liên kết trong thực tế.",""]]}]},{"n":24,"title":"LIÊN KẾT LÊN TẦNG CAO: TNKH & VÒNG XOÁY ĐI LÊN","part":"NỘI DUNG 3 · Liên kết kèm cặp cá nhân với lộ trình đội ngũ","loai":"Giảng","dur":25,"content":["Nội dung trình bày:","Phát triển đội ngũ không phải mục tiêu tự thân — đích cuối là trải nghiệm khách hàng (TNKH)","Đội ngũ mạnh đúng năng lực đang thiếu (xử lý khiếu nại, phối hợp, chủ động thông tin) → khách được phục vụ tốt hơn","Vòng xoáy đi lên: kèm cặp đúng người → đội ngũ tự làm được nhiều hơn → quản lý nhẹ gánh, có thêm thời gian kèm cặp → đội ngũ giỏi hơn → TNKH tốt hơn → ít phàn nàn → lại có thời gian phát triển người","Đây là cách giảm tải bền vững, khác hẳn ôm việc cho nhanh","Lời thoại: Cuối Nội dung 3, ta nâng tầm nhìn lên một bậc nữa để thấy tất cả những việc này cuối cùng phục vụ điều gì. Phát triển đội ngũ không phải là mục tiêu tự thân, không phải phát triển cho vui. Đích cuối cùng, như xuyên suốt cả chương trình, vẫn là trải nghiệm khách hàng. Hãy nối lại mạch: khi anh/chị kèm cặp đúng những năng lực mà đội ngũ đang thiếu — xử lý khiếu nại, phối hợp liên tổ, chủ động thông tin cho khách — thì kết quả trực tiếp là khách hàng được phục vụ nhanh hơn, tốt hơn, nhất quán hơn. Và điều đẹp nhất là nó tạo thành một vòng xoáy đi lên. Anh/chị kèm cặp đúng người, đội ngũ tự làm được nhiều việc hơn; nhờ đó anh/chị nhẹ gánh, có thêm thời gian để kèm cặp và điều hành; đội ngũ lại giỏi hơn nữa; trải nghiệm khách hàng tốt lên; khách ít phàn nàn hơn; và vì ít phàn nàn nên anh/chị lại có thêm thời gian để phát triển người. Cứ thế vòng xoáy đi lên. Xin anh/chị ghi nhớ điều này: đây chính là cách giảm tải bền vững cho người quản lý. Nó khác hẳn với việc ôm việc cho nhanh — ôm việc giúp xong việc hôm nay nhưng khiến anh/chị bận mãi mãi; còn phát triển người thì mất công lúc đầu nhưng giải phóng anh/chị về lâu dài. Đầu tư vào con người luôn là khoản đầu tư có lãi kép."],"loithoai":"","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nội dung trình bày:","Phát triển đội ngũ không phải mục tiêu tự thân — đích cuối là trải nghiệm khách hàng (TNKH)"],["Đội ngũ mạnh đúng năng lực đang thiếu (xử lý khiếu nại, phối hợp, chủ động thông tin) → khách được phục vụ tốt hơn","Vòng xoáy đi lên: kèm cặp đúng người → đội ngũ tự làm được nhiều hơn → quản lý nhẹ gánh, có thêm thời gian kèm cặp → đội ngũ giỏi hơn → TNKH tốt hơn → ít phàn nàn → lại có thời gian phát triển người"],["Đây là cách giảm tải bền vững, khác hẳn ôm việc cho nhanh","Lời thoại: Cuối Nội dung 3, ta nâng tầm nhìn lên một bậc nữa để thấy tất cả những việc này cuối cùng phục vụ điều gì. Phát triển đội ngũ không phải là mục tiêu tự thân, không phải phát triển cho vui. Đích cuối cùng, như xuyên suốt cả chương trình, vẫn là trải nghiệm khách hàng. Hãy nối lại mạch: khi anh/chị kèm cặp đúng những năng lực mà đội ngũ đang thiếu — xử lý khiếu nại, phối hợp liên tổ, chủ động thông tin cho khách — thì kết quả trực tiếp là khách hàng được phục vụ nhanh hơn, tốt hơn, nhất quán hơn. Và điều đẹp nhất là nó tạo thành một vòng xoáy đi lên. Anh/chị kèm cặp đúng người, đội ngũ tự làm được nhiều việc hơn; nhờ đó anh/chị nhẹ gánh, có thêm thời gian để kèm cặp và điều hành; đội ngũ lại giỏi hơn nữa; trải nghiệm khách hàng tốt lên; khách ít phàn nàn hơn; và vì ít phàn nàn nên anh/chị lại có thêm thời gian để phát triển người. Cứ thế vòng xoáy đi lên. Xin anh/chị ghi nhớ điều này: đây chính là cách giảm tải bền vững cho người quản lý. Nó khác hẳn với việc ôm việc cho nhanh — ôm việc giúp xong việc hôm nay nhưng khiến anh/chị bận mãi mãi; còn phát triển người thì mất công lúc đầu nhưng giải phóng anh/chị về lâu dài. Đầu tư vào con người luôn là khoản đầu tư có lãi kép."]]}]},{"n":25,"title":"ĐÚC KẾT NỘI DUNG 3","part":"NỘI DUNG 3 · Liên kết kèm cặp cá nhân với lộ trình đội ngũ","loai":"Đúc kết","dur":4,"content":["Nội dung trình bày:","Liên kết = kèm cặp cá nhân là bước có chủ đích trong lộ trình đội ngũ; IDP xác định ưu tiên kèm","Cơ chế 4 bước vòng lặp quý: Nhìn đội ngũ → Chọn ưu tiên → Kèm cặp có cấu trúc → Rà soát & cập nhật IDP","Kèm hằng tuần luôn \"neo\" vào lộ trình quý — không trôi tự do","Đích cuối là TNKH; phát triển người là con đường giảm tải bền vững","Cầu nối ND4: xem một video hướng dẫn lập kế hoạch mẫu qua tình huống thật","Lời thoại: Ta đúc kết Nội dung 3. Thứ nhất, liên kết nghĩa là mỗi lần kèm cặp một cá nhân đều là một bước có chủ đích trong lộ trình phát triển cả đội ngũ, và ngược lại, IDP của từng người là nguồn để xác định nên ưu tiên kèm ai, kèm cái gì mỗi quý. Thứ hai, cơ chế để làm việc đó là một vòng lặp bốn bước theo quý: nhìn đội ngũ, chọn ưu tiên, kèm cặp có cấu trúc, rồi rà soát và cập nhật IDP. Thứ ba, điểm mấu chốt về nhịp: hoạt động kèm cặp hằng tuần luôn được neo vào lộ trình quý, nhờ đó không trôi tự do mà luôn góp vào bức tranh lớn. Thứ tư, đích cuối cùng của tất cả là trải nghiệm khách hàng, và phát triển con người chính là con đường giảm tải bền vững, tạo vòng xoáy đi lên. Đến đây, anh/chị đã có đủ cả ba mảnh ghép: mô hình kèm cặp có cấu trúc, công cụ IDP, và cơ chế liên kết hai tầng. Phần cuối cùng, để mọi thứ trở nên thật cụ thể và dễ hình dung, chúng ta sẽ cùng xem một video hướng dẫn — theo chân một Giám đốc Điện lực lập kế hoạch kèm cặp và IDP cho một cán bộ dưới quyền, trong một tình huống rất quen thuộc với các đơn vị.","NỘI DUNG 4 — VIDEO HƯỚNG DẪN","Nội dung trình bày:","Video hướng dẫn: cách lập một kế hoạch kèm cặp và IDP mẫu tại đơn vị","Tình huống: Giám đốc Điện lực kèm cặp cán bộ phụ trách kinh doanh — bộ phận 2 nhân viên, 80.000 khách hàng, nhiều khiếu nại","3 điểm quan sát khi xem: (1) cách đặt đích đo được (2) cách chẩn đoán đúng gốc (3) cách nối chu kỳ kèm cặp vào IDP 12 tháng","Sau video: mỗi học viên rà lại kế hoạch vừa xây ở phần thảo luận, bổ sung 1 điểm","Lời thoại: Chúng ta đến Nội dung 4 — phần khép lại chuyên đề bằng một video hướng dẫn cụ thể, dài khoảng bốn đến năm phút. Video này hướng dẫn cách lập một kế hoạch kèm cặp và một IDP mẫu, không phải bằng lý thuyết mà qua một tình huống rất thật. Tình huống như sau: một Giám đốc Điện lực kèm cặp cán bộ phụ trách công tác kinh doanh của mình. Người cán bộ này quản lý một bộ phận nhỏ chỉ có hai nhân viên, nhưng phụ trách địa bàn tám mươi nghìn khách hàng với rất nhiều thắc mắc, khiếu nại phải giải quyết — một tình huống quá tải điển hình mà nhiều đơn vị gặp phải. Khi xem, tôi đề nghị anh/chị chú ý ba điểm. Thứ nhất, cách vị Giám đốc đặt đích đo được — không nói chung chung mà chốt bằng con số. Thứ hai, cách ông chẩn đoán đúng gốc vấn đề của người cán bộ — điều gì thật sự cản trở, thiếu kỹ năng hay điều gì khác. Thứ ba, cách ông nối chu kỳ kèm cặp ngắn hạn vào một IDP mười hai tháng dài hơn. Đây đúng là ba điều cốt lõi của cả chuyên đề, được minh họa sống động trong một câu chuyện. Sau khi xem video, tôi mong anh/chị quay lại bản kế hoạch mình vừa xây ở phần thảo luận, đối chiếu với cách làm trong video, và bổ sung ít nhất một điểm mà mình thấy còn thiếu. Toàn văn lời thoại của video được đặt ở phần Phụ lục cuối giáo án để tiện thu âm. Bây giờ, xin mời cùng xem.","THẢO LUẬN NHÓM: XÂY KẾ HOẠCH KÈM CẶP & PHÁT TRIỂN NHÂN VIÊN","Nội dung trình bày:","Phần thực hành nhóm trên phần mềm V-discussion — thời lượng ~60 phút","Vì sao thảo luận: biến kiến thức thành một sản phẩm thật cho đơn vị, không dừng ở lý thuyết","Sản phẩm cuối: một bộ kế hoạch 2 tầng cho một nhân viên cụ thể — kèm cặp 4 tuần + phát triển 6 tháng, nối liền nhau","4 mục đích: ra sản phẩm dùng được · luyện chẩn đoán đúng gốc · học hỏi chéo giữa các Điện lực · tạo cam kết 30 ngày","Nguyên tắc xuyên suốt: một dòng làm được hơn cả trang viết chung chung","Lời thoại: Chúng ta chuyển sang phần được chờ đợi nhất của chuyên đề — phần thực hành nhóm, kéo dài khoảng bốn mươi lăm phút, làm trên phần mềm V-discussion. Trước khi đi vào các bước, tôi muốn anh/chị hiểu rõ vì sao có phần này. Cả buổi sáng nay chúng ta đã học mô hình kèm cặp năm thành tố, công cụ phát triển IDP, và cách liên kết hai tầng. Nhưng kiến thức nằm trong đầu thì chưa thay đổi được gì ở đơn vị. Mục tiêu của bốn mươi lăm phút tới là mỗi nhóm rời buổi học với một sản phẩm thật, cầm về dùng được ngay — chứ không phải thêm một mớ lý thuyết. Cụ thể, mỗi nhóm sẽ tạo ra một bộ kế hoạch hai tầng cho một nhân viên cụ thể: một kế hoạch kèm cặp bốn tuần, và một kế hoạch phát triển sáu tháng, hai tầng nối liền nhau. Phần thực hành này phục vụ bốn mục đích. Một, cho ra một sản phẩm dùng được. Hai, luyện cho anh/chị kỹ năng quan trọng nhất — chẩn đoán đúng gốc trước khi kèm. Ba, tạo cơ hội học hỏi chéo, vì mỗi Điện lực nhìn cùng một loại nhân viên theo một góc khác nhau. Bốn, tạo một cam kết cụ thể để anh/chị mang về áp dụng trong ba mươi ngày. Và xin ghi nhớ một nguyên tắc xuyên suốt: một kế hoạch chỉ cần một dòng thật sự làm được còn hơn cả trang viết chung chung. Hãy làm thật cụ thể và sát đơn vị mình."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":26,"title":"ĐẶT VẤN ĐỀ: CHỌN MỘT NHÂN VIÊN, XÂY MỘT CON ĐƯỜNG","part":"NỘI DUNG 4 · Thảo luận nhóm xây kế hoạch kèm cặp và IDP","loai":"Thực hành","dur":4,"content":["Nội dung trình bày:","Mỗi nhóm chọn 01 chân dung nhân viên điển hình tại Điện lực (hoặc nhân viên thật tương đương):","A — Nhân viên Kinh doanh: lúng túng khi khách gay gắt, hay đẩy ca khó lên cấp trên (thường: thiếu kỹ năng)","B — Công nhân điện: tay nghề ổn nhưng ngại quy trình số mới, ngại thay đổi (thường: thiếu động lực)","C — Đội trưởng/Tổ trưởng: giỏi chuyên môn nhưng ôm việc, chưa biết điều phối (thường: thiếu kỹ năng quản lý)","Câu hỏi trung tâm nhóm phải trả lời: \"Người này cần giỏi thêm ở đâu — và làm sao đưa họ tới đó?\"","Phân vai ngay: 1 nhóm trưởng điều phối · 1 thư ký nhập V-discussion · mọi thành viên góp ý mỗi bước","Lời thoại: Vấn đề đặt ra cho mỗi nhóm rất đơn giản để phát biểu nhưng không dễ để làm tốt: chọn một nhân viên, và xây cho họ một con đường phát triển. Để anh/chị khởi động nhanh, chúng tôi đã chuẩn bị sẵn ba chân dung nhân viên rất điển hình ở Điện lực trên phần mềm V-discussion. Chân dung A là nhân viên kinh doanh — chăm chỉ nhưng lúng túng khi gặp khách gay gắt, hay đẩy ca khó lên cấp trên; gốc thường là thiếu kỹ năng xử lý cảm xúc. Chân dung B là công nhân điện — tay nghề vững nhưng ngại ghi phiếu kèm ảnh, ngại quy trình số mới; đây thường là chuyện động lực, tâm lý ngại thay đổi, chứ không phải kém năng lực. Chân dung C là đội trưởng hoặc tổ trưởng — giỏi chuyên môn cá nhân nhưng ôm hết việc, chưa biết điều phối và phát triển tổ viên; bài toán \"thợ giỏi lên làm quản lý\" rất quen thuộc. Nhóm chọn một trong ba, hoặc thay bằng một nhân viên thật tương đương ở đơn vị mình. Dù chọn ai, cả nhóm phải cùng trả lời một câu hỏi trung tâm: người này cần giỏi thêm ở đâu, và làm sao đưa họ tới đó. Cuối cùng, xin phân vai ngay từ bây giờ để tiết kiệm thời gian: mỗi nhóm cử một nhóm trưởng điều phối và đặt câu hỏi, một thư ký nhập nội dung vào V-discussion, và quan trọng nhất — mọi thành viên đều phải góp ý ở mỗi bước, không ai ngồi im."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":27,"title":"YÊU CẦU & QUY TRÌNH 4 BƯỚC TRÊN V-DISCUSSION","part":"NỘI DUNG 4 · Thảo luận nhóm xây kế hoạch kèm cặp và IDP","loai":"Thực hành","dur":4,"content":["Nội dung trình bày:","Bước 1 (10′): chọn chân dung + điền 5 đặc điểm và 5 nội dung chẩn đoán (nhóm nào; thiếu kỹ năng hay động lực)","Bước 2 (15′): kế hoạch kèm cặp 4 tuần — điền đủ 5 thành tố (Đích đo được · Thực trạng · Phương án · Nhịp & mốc · Đo & chốt)","Bước 3 (15′): kế hoạch phát triển 6 tháng — điền khung 6 phần; nối chu kỳ kèm cặp làm bước đầu (ô mã năng lực LF/GC gắn khi có)","Bước 4 (5′): tự kiểm 5 tiêu chí → cử đại diện trình bày 3′","Đồng hồ đếm ngược từng bước hiển thị trên V-discussion; giảng viên phản hồi theo: cụ thể – đo được – khả thi","Lời thoại: Đây là yêu cầu cụ thể và quy trình bốn bước, tất cả thao tác ngay trên V-discussion, mỗi bước có đồng hồ đếm ngược riêng hiển thị trên màn hình để nhóm tự giữ nhịp. Bước một, mười phút: chọn chân dung, rồi điền năm đặc điểm và đặc biệt là năm nội dung chẩn đoán — thuộc nhóm nào, gốc là thiếu kỹ năng hay thiếu động lực. Xin nhấn mạnh: chẩn đoán đúng ở bước này quyết định chất lượng toàn bộ phần sau. Bước hai, mười lăm phút: thiết kế kế hoạch kèm cặp bốn tuần, điền đủ năm thành tố — Đích phải đo được bằng con số, Thực trạng đúng gốc, Phương án phù hợp, Nhịp và mốc, rồi Cách đo và chốt. Bước ba, mười lăm phút: nâng lên tầm dài hạn, thiết kế kế hoạch phát triển sáu tháng theo khung sáu phần; và nhớ nối chu kỳ kèm cặp vừa xây ở bước hai vào làm bước đầu tiên của lộ trình. Trong bước này, phần khoảng trống năng lực có sẵn một ô để gắn mã năng lực EVN — mã LF, GC — khi đơn vị có mã chính thức; chưa có thì để trống. Bước bốn, năm phút cuối: mỗi nhóm tự kiểm năm tiêu chí trên màn hình, sửa chỗ còn chung chung, rồi cử đại diện trình bày ba phút, chọn trường hợp tâm đắc nhất. Tôi sẽ phản hồi ngắn gọn theo ba tiêu chí: có cụ thể không, có đo được không, có khả thi không. Mời các nhóm bắt đầu.","Dưới đây là bộ nội dung hướng dẫn Thảo luận nhóm hoàn chỉnh, gồm hai phần: Phần hướng dẫn chung và Phần hướng dẫn chi tiết 4 bước trên V-discussion, kèm lời thoại đã hiệu chỉnh và trình bày theo từng bước lớn.","HƯỚNG DẪN THẢO LUẬN NHÓM","Xây dựng kế hoạch kèm cặp và phát triển nhân viên tại đơn vị","(Thời lượng: ~60 phút · Công cụ: phần mềm V-discussion · Hình thức: nhóm  học viên)","PHẦN 1 — HƯỚNG DẪN CHUNG","a) Mục đích của thảo luận nhóm","Buổi thảo luận này không nhằm tạo ra một bản kế hoạch lý thuyết để nộp, mà hướng tới bốn mục đích thiết thực:","Biến kiến thức thành sản phẩm dùng được: mỗi nhóm hoàn thành một bộ kế hoạch kèm cặp + phát triển cho một chân dung nhân viên cụ thể, đủ chi tiết để mang về triển khai ngay.","Luyện tư duy chẩn đoán đúng gốc: rèn thói quen phân biệt nhân viên thiếu kỹ năng hay thiếu động lực trước khi chọn cách kèm — đây là kỹ năng quyết định thành bại.","Học hỏi chéo giữa các đơn vị: qua trao đổi nhóm, mỗi người tiếp cận cách nhìn của đồng nghiệp ở các Điện lực khác nhau về cùng một loại nhân viên.","Tạo cam kết hành động: kết thúc buổi, mỗi cá nhân có một điểm neo để áp dụng trong 30 ngày, được nhìn lại tại hội thảo sau đào tạo.","b) Nội dung cần thảo luận chi tiết","Nhóm cùng thảo luận và thống nhất bốn cụm nội dung, theo trình tự:","Cụm 1 — Chọn & chẩn đoán đối tượng: chọn một chân dung nhân viên (gợi ý ở mục c), làm rõ 5 đặc điểm/nhu cầu, và đưa ra 5 nội dung chẩn đoán (thuộc nhóm nào; gốc là kỹ năng hay động lực).","Cụm 2 — Kế hoạch kèm cặp 4 tuần: điền đủ 5 thành tố (Đích – Thực trạng – Phương án – Nhịp & mốc – Đo & chốt), cụ thể đến mức làm được.","Cụm 3 — Kế hoạch phát triển 6 tháng: điền khung 6 phần, nối chu kỳ kèm cặp ở Cụm 2 làm bước đầu.","Cụm 4 — Chốt & trình bày: chọn điểm tâm đắc nhất, chuẩn bị trình bày 3 phút, rút một bài học chung của nhóm.","c) Ba chân dung nhân viên điển hình để nhóm chọn","Nhóm chọn một trong ba chân dung (hoặc thay bằng nhân viên thật tương đương tại đơn vị mình):","Chân dung A — Nhân viên Kinh doanh","Chân dung B — Công nhân điện","Chân dung C — Đội trưởng/Tổ trưởng","Vị trí","NV tiếp nhận & xử lý thắc mắc, khiếu nại KH","Công nhân vận hành/sửa chữa hiện trường","Tổ trưởng phụ trách một nhóm 5–8 người","Đặc điểm nổi bật","Chăm chỉ nhưng lúng túng khi khách gay gắt; hay đẩy ca khó lên cấp trên","Tay nghề ổn nhưng ngại ghi phiếu kèm ảnh, ngại quy trình số mới","Giỏi chuyên môn cá nhân nhưng ôm việc, chưa biết điều phối & phát triển tổ viên","Gốc vấn đề điển hình","Thiếu kỹ năng xử lý cảm xúc KH (thiếu kỹ năng)","Ngại thay đổi thói quen cũ (thiên về động lực/tâm lý)","Chưa có kỹ năng quản lý — mới lên từ vị trí kỹ thuật (thiếu kỹ năng quản lý)","Nhóm nhân viên (theo CĐ3a)","NV còn yếu một kỹ năng","NV chậm thay đổi/căng thẳng","NV tiềm năng cần nâng tầm","Điển hình vì","Rất phổ biến ở tuyến đầu CSKH","Đặc thù công nhân lâu năm, nhiều kinh nghiệm","Bài toán \"thợ giỏi lên làm quản lý\" rất thường gặp","d) Cách từng cá nhân tham gia đóng góp","Để tránh tình trạng một người làm cả nhóm ngồi nghe, phân vai rõ:","Nhóm trưởng: điều phối thời gian, đặt câu hỏi, chốt ý kiến, phân công người ghi/trình bày.","Người ghi (thư ký): nhập nội dung vào V-discussion theo thống nhất của nhóm.","Mỗi thành viên bắt buộc đóng góp tối thiểu: 1 đặc điểm nhân viên + 1 ý chẩn đoán + 1 đề xuất cho kế hoạch. Nhóm trưởng gọi lần lượt, không để ai im lặng.","Nguyên tắc tranh luận lành mạnh: góp ý vào nội dung, không phê phán người; ưu tiên phương án cụ thể – đo được – làm được.","e) Gợi ý tiêu chí \"một kế hoạch tốt\" (để nhóm tự kiểm trước khi trình bày)","Cụ thể: đọc lên là biết ai làm gì, khi nào.","Đo được: đích có con số hoặc dấu hiệu rõ để biết khi nào đạt.","Đúng gốc: phương án khớp với chẩn đoán (kỹ năng ↔ huấn luyện; động lực ↔ lắng nghe/ghi nhận).","Nối tầng: chu kỳ kèm cặp 4 tuần là bước đầu của lộ trình 6 tháng.","Khả thi: làm được với nguồn lực thật của đơn vị, không lý tưởng hóa."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":28,"title":"ĐÚC KẾT CHUYÊN ĐỀ","part":"NỘI DUNG 5 · Video hướng dẫn, đúc kết và phụ lục","loai":"Đúc kết","dur":8,"content":["Nội dung trình bày:","Tóm tắt: Kèm cặp có cấu trúc (5 thành tố) → IDP (lộ trình 6–12 tháng) → Liên kết cá nhân–đội ngũ (vòng lặp quý) → Video mẫu","Nguyên tắc bao trùm (băng đỏ): Kèm một chặng nằm trong cả con đường — phát triển người là cách giảm tải bền vững nhất","Định hướng: nhìn lại tại hội thảo trực tuyến sau đào tạo","Khép chuỗi CĐ3: 3a kỹ năng từng lần → 3b hệ thống & lộ trình","Lời thoại: Chúng ta khép lại Chuyên đề 3b, và cũng khép lại trọn cặp chuyên đề về huấn luyện, kèm cặp. Nhìn lại hành trình hôm nay: ta bắt đầu bằng mô hình kèm cặp có cấu trúc với năm thành tố — Đích, Thực trạng, Phương án, Nhịp và mốc, Đo và chốt; rồi nâng lên công cụ IDP để phát triển một con người theo lộ trình sáu đến mười hai tháng; tiếp đó là cơ chế liên kết bốn bước theo quý để nối kèm cặp cá nhân với phát triển cả đội ngũ; và cuối cùng là một video mẫu để thấy tất cả vận hành trong thực tế. Nguyên tắc bao trùm cả chuyên đề gói trong một câu: kèm một chặng luôn nằm trong cả con đường — và phát triển con người là cách giảm tải bền vững nhất cho người quản lý. Bây giờ, để chuyên đề không dừng ở nhận thức, tôi đề nghị mỗi anh/chị một cam kết cụ thể: chọn đúng một nhân viên của mình, và triển khai một chu kỳ kèm cặp có cấu trúc trong ba mươi ngày tới — anh/chị đã có sẵn bản kế hoạch từ phần thảo luận, giờ chỉ cần bắt tay làm. Chúng ta sẽ cùng nhìn lại kết quả tại hội thảo trực tuyến sau đào tạo, chia sẻ cái được và tháo gỡ vướng mắc. Và xin nhớ mạch liền của cặp chuyên đề: ở 3a anh/chị có kỹ năng kèm cặp từng lần; ở 3b anh/chị có hệ thống và lộ trình để những kỹ năng ấy tạo ra sự trưởng thành thật cho cả đội ngũ. Xin chân thành cảm ơn anh/chị."],"loithoai":"","hoatdong":"","callouts":[],"tables":[]},{"n":29,"title":"MẪU BẢN ĐỒ NĂNG LỰC ĐỘI NGŨ (công cụ cho Bước 1 của cơ chế liên kết)","part":"NỘI DUNG 5 · Video hướng dẫn, đúc kết và phụ lục","loai":"Phụ lục","dur":5,"content":["Nội dung trình bày: mẫu bảng để lập ở đầu quý","Nhân viên","Mạnh","Yếu / khoảng trống","Kế cận vị trí","Ưu tiên kèm quý này","(tên)","(năng lực mạnh)","(năng lực cần bổ sung)","(vị trí hướng tới)","(Có/Không + năng lực)","Cách dùng: điền đầu mỗi quý; cột \"khoảng trống\" + \"kế cận\" → chọn ưu tiên kèm cặp","Đánh dấu năng lực chỉ 1 người nắm được = rủi ro cao → ưu tiên kèm thêm người","Lời thoại: Đây là một công cụ phụ nhưng rất hữu ích, phục vụ đúng Bước một của cơ chế liên kết mà ta học ở Nội dung 3 — bản đồ năng lực đội ngũ. Mẫu bảng gồm năm cột. Cột một là tên nhân viên. Cột hai ghi những năng lực người đó đang mạnh. Cột ba ghi những năng lực còn yếu hoặc khoảng trống cần bổ sung. Cột bốn ghi vị trí mà người đó đang được chuẩn bị kế cận, nếu có. Cột năm là kết luận: quý này có ưu tiên kèm người này không, và nếu có thì kèm năng lực gì. Cách dùng rất đơn giản: đầu mỗi quý, anh/chị dành khoảng nửa giờ điền bảng này cho cả đội. Khi nhìn toàn bảng cùng lúc, hai cột \"khoảng trống\" và \"kế cận\" sẽ tự nói cho anh/chị biết nên ưu tiên kèm ai. Có một mẹo quan trọng: hãy đánh dấu những năng lực mà cả đội chỉ có duy nhất một người nắm được — đó là điểm rủi ro cao, vì nếu người đó nghỉ hoặc chuyển đi, cả mảng việc sẽ đứng. Những năng lực như vậy nên được ưu tiên kèm thêm cho người thứ hai ngay, để phân tán rủi ro. Bản đồ này biến việc chọn ưu tiên kèm cặp từ cảm tính thành có căn cứ, và nên được cập nhật đều mỗi quý cùng với việc rà soát IDP."],"loithoai":"","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nội dung trình bày: mẫu bảng để lập ở đầu quý","Nhân viên"],["Mạnh","Yếu / khoảng trống"],["Kế cận vị trí","Ưu tiên kèm quý này"],["(tên)","(năng lực mạnh)"],["(năng lực cần bổ sung)","(vị trí hướng tới)"],["(Có/Không + năng lực)","Cách dùng: điền đầu mỗi quý; cột \"khoảng trống\" + \"kế cận\" → chọn ưu tiên kèm cặp"],["Đánh dấu năng lực chỉ 1 người nắm được = rủi ro cao → ưu tiên kèm thêm người","Lời thoại: Đây là một công cụ phụ nhưng rất hữu ích, phục vụ đúng Bước một của cơ chế liên kết mà ta học ở Nội dung 3 — bản đồ năng lực đội ngũ. Mẫu bảng gồm năm cột. Cột một là tên nhân viên. Cột hai ghi những năng lực người đó đang mạnh. Cột ba ghi những năng lực còn yếu hoặc khoảng trống cần bổ sung. Cột bốn ghi vị trí mà người đó đang được chuẩn bị kế cận, nếu có. Cột năm là kết luận: quý này có ưu tiên kèm người này không, và nếu có thì kèm năng lực gì. Cách dùng rất đơn giản: đầu mỗi quý, anh/chị dành khoảng nửa giờ điền bảng này cho cả đội. Khi nhìn toàn bảng cùng lúc, hai cột \"khoảng trống\" và \"kế cận\" sẽ tự nói cho anh/chị biết nên ưu tiên kèm ai. Có một mẹo quan trọng: hãy đánh dấu những năng lực mà cả đội chỉ có duy nhất một người nắm được — đó là điểm rủi ro cao, vì nếu người đó nghỉ hoặc chuyển đi, cả mảng việc sẽ đứng. Những năng lực như vậy nên được ưu tiên kèm thêm cho người thứ hai ngay, để phân tán rủi ro. Bản đồ này biến việc chọn ưu tiên kèm cặp từ cảm tính thành có căn cứ, và nên được cập nhật đều mỗi quý cùng với việc rà soát IDP."]]}]}],"prep":["Mở file Word chuẩn CĐ3b và kiểm tra đủ 28 slide chính + 1 slide phụ công cụ.","Chuẩn bị tình huống nhân viên điển hình để minh họa kế hoạch kèm cặp và IDP.","Mở V-discussion/V-training cho hoạt động nhóm xây kế hoạch kèm cặp 4 tuần và IDP 6 tháng.","Chuẩn bị đồng hồ đếm ngược cho các bước thảo luận nhóm và tiêu chí phản hồi."],"prompts12":[],"checklist":["Giữ mạch từ kèm cặp có cấu trúc đến IDP và phát triển đội ngũ.","Mỗi ví dụ đều neo vào việc thật tại Điện lực, tránh nói chung chung.","Khi học viên làm nhóm, kiểm tra đủ 5 thành tố kèm cặp và 6 phần IDP.","Phản hồi theo ba tiêu chí: cụ thể, đo được, khả thi.","Nhấn mạnh nguyên tắc: kèm một chặng nằm trong cả con đường."],"vung":["Điện lực","Tổ Kinh doanh","Tổ Chăm sóc khách hàng","Công nhân điện","Đội trưởng/Tổ trưởng","V-discussion","IDP","TNKH"],"andanh":["Anh D","Chị K","Nhân viên A","Nhân viên B","Nhân viên C"],"tomtat":{"title":"Mục tiêu chuyên đề 3b","items":["Hiểu mô hình kèm cặp có cấu trúc gồm 5 thành tố.","Biết chuyển một chu kỳ kèm cặp thành bước trong IDP 6-12 tháng.","Thực hành xây kế hoạch kèm cặp và IDP cho một nhân viên tại đơn vị.","Liên kết phát triển cá nhân với lộ trình đội ngũ và trải nghiệm khách hàng."]},"mau4":[],"framework":[{"name":"Mô hình kèm cặp 5 thành tố","items":["Đích","Thực trạng","Phương án","Nhịp & mốc","Đo & chốt"]},{"name":"Khung IDP 6 phần","items":["Điểm xuất phát","Đích phát triển","Khoảng trống năng lực","Các bước phát triển","Mốc thời gian & người hỗ trợ","Cách đo & rà soát"]},{"name":"Vòng lặp quý","items":["Nhìn đội ngũ","Chọn ưu tiên","Kèm cặp có cấu trúc","Rà soát & cập nhật IDP"]}],"quiz":[{"q":"Một kế hoạch kèm cặp tốt phải bắt đầu từ đâu?","a":"Từ đích năng lực đo được và thực trạng đúng gốc."},{"q":"IDP khác kế hoạch kèm cặp ngắn hạn ở điểm nào?","a":"IDP là lộ trình 6-12 tháng, nối nhiều bước phát triển thành một con đường."},{"q":"Vì sao cần liên kết kèm cặp cá nhân với lộ trình đội ngũ?","a":"Để mỗi hoạt động kèm cặp phục vụ ưu tiên phát triển đội ngũ và TNKH, không rời rạc."}],"act":{"title":"Sản phẩm nhóm cần hoàn thành","items":["Chọn một chân dung nhân viên.","Chẩn đoán gốc thiếu kỹ năng/động lực.","Lập kế hoạch kèm cặp 4 tuần đủ 5 thành tố.","Lập IDP 6 tháng theo khung 6 phần.","Tự kiểm 5 tiêu chí và cử đại diện trình bày."]},"sourceDocx":"6. CĐ3b. Thực hành kèm cặp, xây dựng IDP.docx","meta":{"docCode":"CĐ03b","brandLabel":"CĐ03b · Kèm cặp & IDP · QL01A","program":"Chương trình QL01A · Chuyên đề 3b","title":"Thực hành kèm cặp và xây dựng kế hoạch phát triển nhân viên tại đơn vị","subtitle":"Sổ tay điện tử cho giảng viên theo file Word chuẩn CĐ3b: mô hình kèm cặp có cấu trúc, IDP, thảo luận nhóm, lộ trình phát triển đội ngũ và video hướng dẫn.","duration":"150 phút","durationNote":"90′ lý thuyết + 60′ thảo luận; có slide phụ công cụ cuối giáo án","mode":"Giảng · Thực hành · Thảo luận nhóm · Video","audience":"Trưởng/Phó Điện lực · GĐ/PGĐ Xí nghiệp","agendaTotal":"150′","agendaTotalNote":"90′ lý thuyết + 60′ thảo luận; slide phụ dùng như công cụ tham khảo"}};
