<style>
:root{
  --red:#C00000;--red-d:#8f0000;--ink:#1a1a1a;--grey:#565656;--lgrey:#8a8a8a;
  --line:#e7e7e8;--bg:#f4f4f5;--card:#fff;--gold:#B8860B;--green:#1F6F54;
  --blue:#1F5F8B;--violet:#6B4E9E;--teal:#127475;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
aside{width:296px;flex:0 0 296px;background:#fff;border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.brand .k{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:14px;margin:0;font-weight:800;letter-spacing:.02em}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--lgrey)}
.nav{padding:6px 0 60px}
.nav-sec{padding:13px 18px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--lgrey)}
.nav a{display:flex;gap:9px;align-items:baseline;padding:7px 18px;font-size:13px;color:var(--ink);border-left:3px solid transparent;cursor:pointer;user-select:none}
.nav a:hover{background:#faf6f6}
.nav a.active{background:#fbeaea;border-left-color:var(--red);color:var(--red);font-weight:700}
.nav a .sn{flex:0 0 24px;font-variant-numeric:tabular-nums;color:var(--lgrey);font-size:12px}
.nav a.active .sn{color:var(--red)}
.nav a .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .dur{font-size:11px;color:var(--lgrey);font-variant-numeric:tabular-nums}
main{flex:1;min-width:0;max-width:940px;margin:0 auto;padding:34px 42px 100px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
h2.page{font-size:27px;margin:0 0 6px;font-weight:800;line-height:1.2}
.sub{color:var(--grey);font-size:15px;margin:0 0 20px}
.metabar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#f0f0f0;color:var(--grey)}
.chip b{color:var(--ink)}
.chip.red{background:#fbeaea;color:var(--red)}.chip.green{background:#e9f5ef;color:var(--green)}
.chip.gold{background:#fbf3e2;color:var(--gold)}.chip.blue{background:#e9f1f7;color:var(--blue)}
.chip.violet{background:#efe9f6;color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#fff}
.card.content h3 .ic{background:var(--red)}.card.speak h3 .ic{background:var(--ink)}
.card.act h3 .ic{background:var(--green)}.card.guide h3 .ic{background:var(--gold)}
.card ul{margin:0;padding-left:20px}.card li{margin:5px 0}
.card .lead{margin:0 0 12px;color:#2f2f2f;font-size:14.5px}
.card .mini-title{margin:14px 0 7px;font-size:13px;font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.04em}
.card .bullet-card{margin:8px 0 14px;padding:12px 14px;border-radius:12px;background:#fafafa;border:1px solid var(--line)}
.card .bullet-card ul{margin:0}
.card .question-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#f7fbff;border:1px solid #cfe1ef;color:#173a54}
.card .question-box b{color:var(--blue)}
.card .note-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#fff8e6;border:1px solid #efd99c;color:#5a4a1a}
.card .note-box b{color:var(--gold)}
.message-box{margin:16px 0;border:1px solid #f0c36d;border-left:6px solid var(--gold);background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:var(--sh);padding:16px 18px;border-radius:12px}
.message-box .message-title{font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.message-box p{margin:0;color:var(--ink);font-weight:650}
td .strong-line{font-weight:800}
.speak p{margin:0;color:#2c2c2c;font-size:14.5px;white-space:pre-line}
.act p{margin:0;font-size:14.5px;white-space:pre-line}
.callout{border-left:4px solid var(--gold);background:#fdf9ef;padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.5px;color:#5a4a1a}
.callout b{color:var(--gold)}
.slidenav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:#c9c9c9}
.btn:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--red);color:#fff;font-weight:700;font-size:12px}
tr.part td{background:#fbeaea;font-weight:800;color:var(--red)}
tr.brk td{background:#fdf6e3;font-weight:800;color:var(--gold)}
tr.tot td{background:var(--red);color:#fff;font-weight:800}
td.c{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.loai{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.loai.Giảng,.loai.GiảngTH,.loai.GiảngDemo{background:#eef;color:#3a3a8a}
.loai.Demo{background:#fbf3e2;color:var(--gold)}
.loai.Thựchành{background:#e9f5ef;color:var(--green)}
.loai.Đúckết{background:#f0f0f0;color:var(--grey)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.gcard{border-radius:14px;padding:20px 22px;color:#fff;box-shadow:var(--sh)}
.gcard.v{background:linear-gradient(135deg,#1F5F8B,#144463)}
.gcard.g{background:linear-gradient(135deg,#C00000,#7d0000)}
.gcard.d{background:linear-gradient(135deg,#6B4E9E,#463168)}
.gcard.t{background:linear-gradient(135deg,#127475,#0b4a4b)}
.gcard h3{margin:0 0 4px;font-size:18px;font-weight:800}
.gcard .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gcard ol{margin:12px 0 0;padding-left:20px}.gcard li{margin:6px 0;font-size:14px}
.gcard .foot{margin-top:12px;font-size:12.5px;opacity:.92;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
/* prompt cards */
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.pcard .ph{background:#faf6f6;padding:12px 18px;font-weight:800;font-size:15px;color:var(--red);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.pcard .ph .no{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.pcard .pb{padding:6px 18px 14px}
.prow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.prow:last-child{border-bottom:none}
.prow .k{flex:0 0 168px;font-weight:700;color:var(--grey);font-size:13px}
.prow .v{flex:1;white-space:pre-line}
.prow .v code,.mono{font-family:"SF Mono",Consolas,monospace;font-size:12.5px}
.promptbox{background:#f7f7f9;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;white-space:pre-wrap;color:#2a2a2a;line-height:1.55;margin:6px 0}
/* good/bad compare */
.cmp{display:grid;grid-template-columns:1fr;gap:14px;margin:14px 0}
.cmp .col{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cmp .col .h{padding:10px 16px;font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;gap:8px}
.cmp .bad .h{background:var(--red)}.cmp .good .h{background:var(--green)}
.cmp .col .b{padding:14px 16px;background:#fff}
.cmp .col .b p{margin:0 0 8px;font-size:14px}
.cmp .col .b p:last-child{margin-bottom:0}
/* quiz */
.progress{height:8px;background:#e6e6e6;border-radius:999px;overflow:hidden;margin:10px 0 22px}
.progress>i{display:block;height:100%;background:var(--red);transition:width .4s}
.q-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh)}
.q-meta{font-size:12px;color:var(--lgrey);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.q-ref{font-size:12px;color:var(--red);font-weight:700;margin-bottom:12px;cursor:pointer}
.q-text{font-size:17px;font-weight:700;margin:0 0 18px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:11px;margin:9px 0;font-size:14.5px;cursor:pointer;background:#fff;transition:.12s;font-family:inherit}
.opt:hover{border-color:#c9c9c9}
.opt .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f0f0f0;color:#666;font-weight:800;font-size:12px;margin-right:10px;vertical-align:middle}
.opt.correct{border-color:var(--green);background:#e9f5ef}.opt.correct .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbeaea}.opt.wrong .l{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.q-why{margin-top:16px;padding:13px 16px;border-radius:10px;background:#f6faf8;border:1px solid #d9ece4;font-size:14px;color:#264c3d;display:none}
.q-why.show{display:block}.q-why b{color:var(--green)}
.result{text-align:center;padding:26px}
.result .score{font-size:56px;font-weight:900;color:var(--red);line-height:1}
.result .lab{font-size:18px;font-weight:800;margin-top:6px}
.rev-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0;font-size:13.5px;text-align:left}
.rev-item .ok{color:var(--green);font-weight:700}.rev-item .no{color:var(--red);font-weight:700}
.menuBtn{display:none}
@media(max-width:880px){
  aside{position:fixed;left:-310px;z-index:40;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{left:0}
  .menuBtn{display:inline-flex;position:fixed;top:12px;left:12px;z-index:50;background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-size:16px;cursor:pointer;box-shadow:var(--sh)}
  main{padding:60px 18px 90px}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}.backdrop.open{display:block}
  .prow{flex-direction:column;gap:2px}.prow .k{flex:none}
}
</style>

<script>
const DATA={"slides":[{"n":1,"title":"MỤC LỤC CHUYÊN ĐỀ","part":"Mở đầu","loai":"Giảng","dur":5,"content":["1. TNKH trong ngành điện — và sự khác biệt với dịch vụ khách hàng","2. Ba hành trình khách hàng — điểm chạm, điểm đau, \"điểm đau cơ chế\"","3. Vai trò người quản lý cấp Điện lực trong định hình TNKH","4. Video tình huống + Gamification \"Điều hành & TNKH\"","5. Thảo luận nhóm — đề xuất giải pháp & cam kết 30 ngày"],"loithoai":"Đây là lộ trình năm nội dung. Ta bắt đầu bằng việc làm rõ một khái niệm mà ai cũng nghe quen nhưng dễ hiểu lệch — trải nghiệm khách hàng là gì, và nó khác dịch vụ khách hàng ở chỗ nào; phân biệt được hai cái này là chìa khóa của cả chuyên đề. Sau đó ta đi qua ba hành trình khách hàng điển hình của ngành điện, nhận diện đâu là điểm chạm, đâu là điểm đau, và một phát hiện quan trọng: phần lớn điểm đau không phải do nhân viên kém, mà do cơ chế. Nội dung ba trả lời câu hỏi trực tiếp nhất với vai trò của anh/chị: người Trưởng/Phó Điện lực tác động đến trải nghiệm khách hàng bằng cách nào — qua nhịp điều hành và chất lượng thực thi. Rồi ta xem một video tình huống theo chân một yêu cầu của khách đi qua các khâu nội bộ, và chơi một mô phỏng: anh/chị ra quyết định điều hành và quan sát ngay tác động lên chỉ số trải nghiệm khách hàng. Cuối cùng, sáu mươi phút thảo luận nhóm để mỗi đơn vị đề xuất giải pháp gắn điều hành nội bộ với TNKH và cam kết một thay đổi.","hoatdong":"","callouts":["\"Khách hàng không đánh giá quy trình của ta — khách hàng đánh giá cảm xúc của họ.\""],"tables":[]},{"n":2,"title":"KẾT NỐI TỪ CHUYÊN ĐỀ 2a","part":"Mở đầu","loai":"Giảng","dur":5,"content":["CĐ2a: Xây cơ chế điều hành — nhịp Ngày/Tuần/Tháng, phân tầng, tam giác trách nhiệm (nhìn vào trong)","CĐ2b: Đo cơ chế đó bằng cảm nhận khách hàng — TNKH là thước đo (nhìn ra ngoài)","Mũi tên: Cơ chế tốt bên trong → Trải nghiệm tốt bên ngoài"],"loithoai":"Nối lại một nhịp với Chuyên đề 2a để thấy mạch liền. Ở 2a, toàn bộ công cụ anh/chị học đều hướng vào bên trong đơn vị: dựng nhịp giao ban, phân tầng để biết giữ gì giao gì, lập tam giác trách nhiệm để việc liên tổ không rơi vào vùng xám. Đó là xây cơ chế. Nhưng xây cơ chế để làm gì? Không phải để nội bộ gọn cho vui, mà để cái gọn đó khách hàng cảm nhận được. Chuyên đề 2b lật mặt còn lại của tấm huy chương: ta lấy trải nghiệm khách hàng làm thước đo để kiểm tra xem cơ chế điều hành của mình có thực sự tốt không. Có một câu tôi muốn anh/chị giữ suốt buổi: nếu cơ chế điều hành trông có vẻ ổn nhưng khách vẫn phàn nàn, thì cơ chế đó chưa đủ tốt. Ở 2a, trải nghiệm khách hàng là sợi chỉ đỏ chạy ngầm; sang 2b, nó là tâm điểm ta soi vào. Cùng một việc điều hành, nhưng nhìn từ hai phía — bên trong là cơ chế, bên ngoài là cảm nhận.","hoatdong":"","callouts":["Ở 2a, TNKH là sợi chỉ đỏ. Ở 2b, TNKH là tâm điểm."],"tables":[]},{"n":3,"title":"VÌ SAO CHUYÊN ĐỀ NÀY QUAN TRỌNG","part":"Mở đầu","loai":"Giảng","dur":5,"content":["3 thực tế + callout","Khách so sánh chéo ngành → quen dịch vụ ngân hàng, viễn thông nhanh–minh bạch, mang kỳ vọng đó sang ngành điện","Hầu hết phàn nàn KH không phải về kỹ thuật → mà về không được thông báo, phối hợp chậm, phải hỏi mới biết","Điểm đau nằm ở \"giữa các khâu\" → nơi không tổ nào sở hữu trọn vẹn → chính là vùng người quản lý phải thiết kế"],"loithoai":"Vì sao nội dung này quan trọng với riêng vai trò của anh/chị? Ba thực tế. Thứ nhất, khách hàng ngày nay đánh giá ngành điện bằng thước đo họ mang từ nơi khác sang: họ quen đặt xe, chuyển khoản, mua hàng online — mọi thứ nhanh, minh bạch, chủ động báo tin. Khi sang ngành điện mà phải gọi nhiều lần mới biết tiến độ, họ thấy tụt hậu, dù về kỹ thuật ta làm đúng. Thứ hai, và đây là con số đáng suy nghĩ: phần lớn phàn nàn của khách — khoảng bảy mươi đến bảy mươi lăm phần trăm — không phải về chất lượng kỹ thuật, mà về việc không được thông báo, phối hợp chậm, phải chủ động hỏi mới biết chuyện của chính mình. Nghĩa là gốc của phàn nàn nằm ở điều hành, không nằm ở tay nghề. Thứ ba, những điểm đau lớn nhất thường không nằm gọn trong một tổ, mà nằm ở khoảng giữa các khâu — chỗ hồ sơ chuyển từ tổ này sang tổ kia, chỗ không ai sở hữu trọn vẹn. Mà khoảng giữa đó chính là nơi người quản lý — chứ không phải nhân viên — có thẩm quyền thiết kế. Thông điệp gói trong một câu: nâng cao trải nghiệm khách hàng phần lớn không đòi thêm người hay thêm máy, mà đòi thiết kế lại cơ chế điều hành. Và đó đúng là việc của anh/chị.\n\nNỘI DUNG 1: TNKH trong ngành điện & sự khác biệt với dịch vụ khách hàng\n\nHai câu chuyện · Ba yếu tố · Ba đặc trưng · Vì sao \"làm đúng quy trình\" mà khách vẫn chưa hài lòng\n\nVào Nội dung 1. Trước khi bàn cách làm, ta phải thống nhất một khái niệm nền: trải nghiệm khách hàng thật ra là gì, và vì sao nó không đồng nghĩa với dịch vụ khách hàng. Cách tiếp cận dễ nhất không phải qua định nghĩa khô khan, mà qua hai câu chuyện có thật — hai khách hàng, cùng một việc, nhưng ra về với hai cảm nhận trái ngược.","hoatdong":"","callouts":["Nâng cao TNKH phần lớn không cần thêm nhân lực hay công nghệ — mà cần thiết kế lại cơ chế điều hành."],"tables":[]},{"n":4,"title":"HAI CÂU CHUYỆN KHÁCH HÀNG","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Demo","dur":3,"content":["Cùng đầu ra: được cấp điện. Khác trải nghiệm do quá trình và cảm xúc khác nhau."],"loithoai":"Hai câu chuyện. Chị N là chủ tạp hóa, xin cấp điện cho mặt bằng mới. Chị nộp hồ sơ qua kênh trực tuyến, vài phút sau có tin nhắn xác nhận kèm mã hồ sơ. Sáng hôm sau nhân viên gọi hẹn khảo sát mười giờ, và đúng mười giờ có mặt, khảo sát ba mươi phút, giải thích rõ các bước tiếp theo. Hai ngày sau có thông báo chi phí, thanh toán ngay trên ứng dụng. Tuần sau thợ đến đúng hẹn, còn báo trước ba mươi phút. Đóng điện xong có biên bản, có số hotline. Chị N nhận xét: chuyên nghiệp. Anh H cũng xin cấp điện mới, cùng khoảng thời gian, địa bàn ngay cạnh chị N. Nhưng anh nộp tại quầy, không nhận được xác nhận, phải gọi lên hỏi mới biết hồ sơ đã tiếp nhận. Hẹn khảo sát ba ngày nhưng bốn ngày mới có người đến. Nhân viên lịch sự nhưng không nói rõ bước tiếp theo. Anh phải gọi hai lần mới biết chi phí. Ngày thi công, thợ đến trễ ba giờ mà không báo — anh đã gọi thợ nội thất chờ sẵn, họ phải về và tính tiền trống buổi. Điện vẫn được đóng, nhưng anh H nói một câu rất đáng nhớ: \"việc thì xong nhưng không có cảm giác được quan tâm\". Xin anh/chị lưu ý: cùng một đầu ra — cả hai đều được cấp điện. Khác biệt duy nhất nằm ở trải nghiệm dọc đường. Và chính khác biệt đó quyết định chị N sẽ quay lại, giới thiệu bạn bè; còn anh H có thể im lặng nhưng kể chuyện không hay ở nơi khác.","hoatdong":"","callouts":[],"tables":[{"title":"Hai câu chuyện khách hàng","rows":[["Chị N ? cấp điện mới","Anh H ? cấp điện mới"],["Nộp online, xác nhận và hẹn khảo sát rõ ràng, báo chi phí và tiến độ chủ động, đóng điện đúng hẹn.","Nộp tại quầy, thiếu xác nhận, chờ lâu, phải gọi nhiều lần, thợ trễ không báo."],["Cảm nhận: chuyên nghiệp","Cảm nhận: việc xong nhưng không thấy được quan tâm"]]}]},{"n":5,"title":"TNKH LÀ GÌ: BA YẾU TỐ","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Giảng","dur":3,"content":["Định nghĩa: Trải nghiệm khách hàng = tổng thể cảm nhận của khách về đơn vị trong suốt quá trình tiếp xúc và sử dụng dịch vụ","3 yếu tố cấu thành: Kết quả khách nhận được · Quá trình khách trải qua · Cảm xúc đọng lại sau cùng","Ở hai câu chuyện: kết quả giống nhau, quá trình và cảm xúc khác nhau → trải nghiệm khác nhau"],"loithoai":"Từ hai câu chuyện, ta rút ra định nghĩa. Trải nghiệm khách hàng là tổng thể cảm nhận của khách về đơn vị trong suốt quá trình tiếp xúc và sử dụng dịch vụ. Nó gồm ba yếu tố. Một là kết quả — cái khách thực sự nhận được; ở đây cả chị N và anh H đều nhận được kết quả như nhau: có điện. Hai là quá trình — chuỗi các bước khách phải đi qua để nhận kết quả đó; và đây là chỗ hai câu chuyện bắt đầu tách ra. Ba là cảm xúc đọng lại sau cùng — điều khách mang theo khi mọi việc đã xong; chị N mang theo sự tin cậy, anh H mang theo cảm giác bị bỏ mặc. Điểm mấu chốt: khi kết quả giống hệt nhau mà trải nghiệm vẫn khác nhau một trời một vực, thì khác biệt nằm ở quá trình và cảm xúc — đúng hai thứ mà cơ chế điều hành của anh/chị chi phối trực tiếp.","hoatdong":"","callouts":[],"tables":[]},{"n":6,"title":"PHÂN BIỆT: DỊCH VỤ KH ≠ TRẢI NGHIỆM KH","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Giảng","dur":3,"content":[],"loithoai":"Đây là slide bản lề của Nội dung 1: phân biệt hai khái niệm hay bị nhập làm một. Dịch vụ khách hàng là hành động cụ thể tại một điểm tiếp xúc — nhân viên trả lời điện thoại, tư vấn tại quầy, xử lý một khiếu nại. Nó gắn với một khoảnh khắc, một con người. Trải nghiệm khách hàng thì rộng hơn: là cảm nhận tổng thể qua toàn bộ chuỗi điểm tiếp xúc, từ đầu đến cuối hành trình. Sự khác biệt này quan trọng vì nó quyết định \"ai chịu trách nhiệm\". Nếu coi đây là dịch vụ khách hàng, ta dễ đẩy hết cho tổ kinh doanh, cho bộ phận chăm sóc khách hàng. Nhưng nếu hiểu đúng là trải nghiệm, thì nó là việc của cả đơn vị — và người điều hành có vai trò lớn nhất, vì chính người điều hành quyết định các khâu nối với nhau ra sao. Một ví dụ để thấy rõ: một nhân viên tổng đài nói năng cực kỳ lịch sự — đó là dịch vụ tốt, không chê được. Nhưng nếu khách phải gọi năm lần mới gặp được người ấy, rồi chờ hai tuần mới có phản hồi, thì trải nghiệm tổng thể vẫn tệ, dù từng điểm tiếp xúc đều ổn. Dịch vụ tốt ở từng điểm không tự động cộng thành trải nghiệm tốt — cái nối các điểm lại mới quyết định, và cái nối đó chính là điều hành.","hoatdong":"","callouts":["NV tổng đài rất lịch sự (dịch vụ tốt) — nhưng khách gọi 5 lần mới gặp, chờ 2 tuần mới có phản hồi → trải nghiệm tổng thể vẫn kém"],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Tiêu chí","Dịch vụ khách hàng","Trải nghiệm khách hàng"],["Phạm vi","Một điểm tiếp xúc cụ thể","Toàn bộ chuỗi điểm tiếp xúc"],["Ví dụ","NV tổng đài trả lời lịch sự","Cả hành trình từ lúc gọi đến lúc xong"],["Ai lo","Bộ phận CSKH / tổ KD","Cả đơn vị ? trong đó có người điều hành"]]}]},{"n":7,"title":"BA ĐẶC TRƯNG CỦA TNKH","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Giảng","dur":3,"content":["Tính tổng thể — khách nhớ cả hành trình, không nhớ từng điểm rời; một khâu hỏng làm hỏng cảm nhận cả chuỗi","Tính cảm tính — cảm xúc thường quyết định đánh giá, không phải quy trình đúng hay sai","Tính tích lũy — mỗi lần tiếp xúc cộng/trừ vào \"tài khoản niềm tin\"; xây thì lâu, mất thì nhanh"],"loithoai":"Trải nghiệm khách hàng có ba đặc trưng cần nắm, vì hiểu chúng thì mới thôi thắc mắc \"tại sao tôi làm đúng quy trình mà khách vẫn không hài lòng\". Đặc trưng thứ nhất là tính tổng thể: khách hàng nhớ toàn bộ hành trình như một khối, chứ không chấm điểm từng khâu riêng lẻ; chỉ một khâu hỏng — như thợ đến trễ ba giờ của anh H — cũng đủ nhuộm màu tiêu cực lên cả những khâu trước đó vốn không tệ. Đặc trưng thứ hai là tính cảm tính: cái quyết định đánh giá của khách thường là cảm xúc, không phải việc quy trình có được tuân thủ đúng hay không. Khách không cầm bản quy trình ra chấm; khách cảm nhận mình có được tôn trọng, có được quan tâm hay không. Đặc trưng thứ ba là tính tích lũy: mỗi lần tiếp xúc là một khoản cộng hoặc trừ vào tài khoản niềm tin của khách với đơn vị; và như mọi tài khoản niềm tin, nó xây thì chậm mà sụt thì nhanh. Ba đặc trưng này giải thích vì sao \"đúng quy trình\" là điều kiện cần nhưng chưa đủ — vì khách không đánh giá quy trình, khách đánh giá cảm xúc, mà cảm xúc phụ thuộc vào cách quy trình được triển khai.","hoatdong":"","callouts":[],"tables":[]},{"n":8,"title":"QUẢN TRỊ TNKH KHÁC QUẢN TRỊ DỊCH VỤ KH","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Giảng","dur":3,"content":["so sánh 2 cách quản trị","Quản trị dịch vụ KH","Quản trị TNKH","Cải thiện từng điểm chạm rời rạc","Thiết kế cả hành trình liền mạch","Đo bằng: thái độ NV tại quầy/tổng đài","Đo bằng: cảm nhận suốt hành trình (nhanh–minh bạch–nhất quán)","Trách nhiệm: bộ phận tiền tuyến","Trách nhiệm: người thiết kế cơ chế = quản lý","Sửa khi khách phàn nàn","Phòng trước khi khách phàn nàn"],"loithoai":"Từ phân biệt khái niệm, ta rút ra khác biệt trong cách quản trị — đây chính là tên của chuyên đề. Quản trị dịch vụ khách hàng tập trung cải thiện từng điểm chạm: tập huấn nhân viên quầy nói năng dễ nghe hơn, nhắc tổng đài trả lời nhanh hơn. Việc đó tốt, nhưng rời rạc — vá từng chỗ. Quản trị trải nghiệm khách hàng thì thiết kế cả hành trình cho liền mạch: quan tâm việc các khâu nối với nhau ra sao, thông tin có chảy suốt không, khách có phải kể lại nhiều lần không. Về thước đo: quản trị dịch vụ đo thái độ nhân viên tại điểm chạm; quản trị trải nghiệm đo cảm nhận của khách suốt hành trình — nhanh không, minh bạch không, nhất quán không. Về trách nhiệm: quản trị dịch vụ giao cho tiền tuyến; quản trị trải nghiệm thuộc về người thiết kế cơ chế — tức người quản lý. Và về thời điểm: quản trị dịch vụ thường sửa sau khi khách đã phàn nàn; quản trị trải nghiệm phòng trước, chặn điểm đau từ khi nó còn chưa thành khiếu nại. Nói gọn: chuyển từ quản trị dịch vụ sang quản trị trải nghiệm chính là chuyển từ vá điểm sang thiết kế hành trình — và đó là việc của người điều hành.","hoatdong":"","callouts":[],"tables":[]},{"n":9,"title":"ĐÚC KẾT NỘI DUNG 1","part":"NỘI DUNG 1 · TNKH trong ngành điện & khác biệt với dịch vụ khách hàng","loai":"Đúc kết","dur":5,"content":["3 ý chốt + cầu nối","TNKH = kết quả + quá trình + cảm xúc; khách đánh giá cảm xúc, không đánh giá quy trình","Dịch vụ KH (một điểm) ≠ Trải nghiệm KH (cả hành trình) → trách nhiệm thuộc người điều hành","Quản trị TNKH = thiết kế cả hành trình, phòng trước, đo bằng cảm nhận khách"],"loithoai":"Khép Nội dung 1. Ba điều mang theo. Một: trải nghiệm khách hàng gồm kết quả, quá trình và cảm xúc; và khách đánh giá bằng cảm xúc chứ không bằng việc ta có đúng quy trình hay không — nên \"đúng quy trình\" chưa bảo đảm khách hài lòng. Hai: dịch vụ khách hàng là một điểm tiếp xúc, trải nghiệm khách hàng là cả hành trình; hiểu đúng điều này thì thấy trải nghiệm là trách nhiệm của người điều hành chứ không riêng bộ phận tiền tuyến. Ba: quản trị trải nghiệm nghĩa là thiết kế cả hành trình cho liền mạch, phòng điểm đau từ sớm, và lấy cảm nhận khách làm thước đo. Bây giờ câu hỏi tự nhiên là: hành trình khách hàng của ngành điện trông ra sao, điểm chạm nằm ở đâu, điểm đau xuất hiện chỗ nào? Đó là Nội dung 2.\n\nNỘI DUNG 2: Ba hành trình khách hàng — điểm chạm, điểm đau & \"điểm đau cơ chế\"\n\nHành trình cấp điện mới · đang dùng điện · sự cố–khiếu nại · Phát hiện then chốt về nguyên nhân gốc\n\nNội dung 2 đưa ta vào bản đồ thực tế. Trong ngành điện có ba hành trình khách hàng điển hình mà người Trưởng/Phó Điện lực cần thuộc nằm lòng: khách hàng mới xin cấp điện, khách hàng đang sử dụng điện, và khách hàng gặp sự cố hoặc khiếu nại. Với mỗi hành trình, ta xác định các điểm chạm — nơi khách tiếp xúc với đơn vị — và các điểm đau — nơi khách dễ bực bội, mất niềm tin. Rồi ta sẽ đến một phát hiện then chốt về việc các điểm đau đó thực sự bắt nguồn từ đâu.","hoatdong":"","callouts":["Muốn thiết kế được hành trình, trước hết phải nhìn thấy hành trình đó — với các điểm chạm và điểm đau của nó."],"tables":[]},{"n":10,"title":"HÀNH TRÌNH 1: KHÁCH HÀNG MỚI XIN CẤP ĐIỆN","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Giảng","dur":3,"content":["7 bước (dòng thời gian) + điểm đau","Bước: Tìm hiểu → Nộp hồ sơ (Zalo OA/quầy) → Chờ khảo sát → Nhận thông báo chi phí → Thanh toán → Chờ thi công → Đóng điện & nghiệm thu","Điểm đau thường gặp: thiếu thông tin chủ động trong giai đoạn chờ · không minh bạch thời gian thi công · thợ đến trễ không báo trước"],"loithoai":"Hành trình thứ nhất — khách hàng mới xin cấp điện — có bảy bước điển hình. Khách tìm hiểu thông tin; nộp hồ sơ qua Zalo OA hoặc quầy giao dịch; chờ khảo sát hiện trường; nhận thông báo chi phí và thủ tục; thanh toán; chờ thi công; và cuối cùng đóng điện, nghiệm thu. Bảy bước này chính là hành trình của cả chị N lẫn anh H mà ta đã gặp. Điểm đau tập trung ở đâu? Ở những khoảng chờ — chờ khảo sát, chờ thi công — nơi khách không có thông tin và bắt đầu bồn chồn; ở việc thời gian thi công không minh bạch, khách không biết chính xác khi nào xong để sắp xếp; và ở chuyện thợ đến trễ mà không báo trước, đúng cái đã làm hỏng trải nghiệm của anh H. Xin anh/chị để ý: cả ba điểm đau này đều nằm ở khoảng giữa các bước, và đều liên quan đến thông tin — chứ không phải liên quan đến tay nghề kỹ thuật.","hoatdong":"","callouts":[],"tables":[]},{"n":11,"title":"HÀNH TRÌNH 2: KHÁCH HÀNG ĐANG SỬ DỤNG ĐIỆN","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Demo","dur":3,"content":["điểm chạm định kỳ + điểm đau","Điểm chạm: Ghi chỉ số công tơ → Thông báo hóa đơn → Thanh toán → Tin nhắn lịch cắt điện bảo trì → Liên hệ khi thắc mắc hóa đơn","Điểm đau thường gặp: hóa đơn tăng bất thường không được giải thích · thông báo cắt điện gấp · khó liên hệ khi có thắc mắc"],"loithoai":"Hành trình thứ hai — khách hàng đang sử dụng điện — không có điểm khởi đầu và kết thúc rõ như cấp điện mới, mà là chuỗi điểm chạm định kỳ lặp lại: ghi chỉ số công tơ, nhận thông báo hóa đơn, thanh toán, nhận tin nhắn báo lịch cắt điện bảo trì, và liên hệ khi có thắc mắc về hóa đơn. Đây là hành trình dài nhất về thời gian — kéo dài suốt vòng đời khách hàng — nên từng điểm chạm nhỏ tích lũy thành ấn tượng lớn. Điểm đau đặc trưng: hóa đơn tăng bất thường mà không được giải thích trước, khiến khách nghi ngờ; thông báo cắt điện quá gấp, khách không kịp chuẩn bị, nhất là hộ kinh doanh; và khó liên hệ khi có thắc mắc, gọi mãi không được, hỏi mãi không rõ. Lại một lần nữa, nhìn kỹ: điểm đau nằm ở thông tin và ở sự chủ động — báo trước hay không, giải thích hay không, dễ liên hệ hay không.","hoatdong":"","callouts":[],"tables":[]},{"n":12,"title":"HÀNH TRÌNH 3: KHÁCH HÀNG GẶP SỰ CỐ / KHIẾU NẠI","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Giảng","dur":3,"content":["điểm chạm + cảnh báo cảm xúc","Điểm chạm: Báo sự cố (tổng đài/Zalo OA) → Chờ tiếp nhận → Chờ xử lý → Nhận cập nhật → Kết thúc sự cố → Phản hồi sau sự cố","Điểm đau: khó tiếp cận kênh báo lúc cao điểm · không có cập nhật tiến độ · NV hiện trường thiếu thông tin để giải thích"],"loithoai":"Hành trình thứ ba — khách gặp sự cố hoặc khiếu nại — là hành trình nhạy cảm nhất. Điểm chạm gồm: báo sự cố qua tổng đài hoặc Zalo OA, chờ tiếp nhận, chờ xử lý, nhận thông tin cập nhật, kết thúc sự cố, và phản hồi sau sự cố. Điều khác biệt căn bản của hành trình này là khách đang ở thế bất lợi — mất điện, gặp trục trặc, có khi đang lo lắng — nên cảm xúc vốn đã tiêu cực. Trong trạng thái đó, mọi sự chậm trễ hay thiếu thông tin không cộng thêm mà nhân lên: chờ mười lăm phút khi đang bực có thể cảm thấy như một giờ. Điểm đau: khó gọi được vào kênh báo sự cố đúng lúc cao điểm, khi ai cũng gọi cùng lúc; không có ai cập nhật tiến độ, khách ngồi chờ trong vô định; và nhân viên hiện trường đến nơi lại không đủ thông tin để giải thích cho khách, khiến khách càng mất niềm tin. Với hành trình này, tốc độ và thông tin không chỉ là tiện lợi — chúng là thứ giữ hoặc phá vỡ niềm tin của khách vào đơn vị.","hoatdong":"","callouts":["⚠ Hành trình có tác động cảm xúc lớn nhất — khách đang ở thế bất lợi, mọi chậm trễ/thiếu tin nhân lên nhiều lần"],"tables":[]},{"n":13,"title":"PHÁT HIỆN THEN CHỐT: \"ĐIỂM ĐAU CƠ CHẾ\" ≠ \"ĐIỂM ĐAU THÁI ĐỘ\"","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Giảng","dur":3,"content":[],"loithoai":"Đây là slide quan trọng nhất của Nội dung 2, và có lẽ là một trong những ý cốt lõi của cả chuyên đề. Khi nhìn ba hành trình vừa rồi, ta dễ có phản xạ đổ lỗi cho con người: thợ trễ là do thợ vô trách nhiệm, nhân viên không giải thích được là do kém chuyên môn, khách phải gọi nhiều lần là do nhân viên lười. Nhưng hãy truy ngược đến gốc. Thợ đến trễ mà không báo — gốc thường không phải thái độ, mà là đơn vị chưa có quy định buộc phải thông báo khi thay đổi lịch; nếu có quy định rõ, phần lớn sẽ báo. Nhân viên hiện trường không giải thích được cho khách — gốc thường là thiếu kênh nội bộ để cập nhật tiến độ cho nhân viên, chứ bản thân họ không tự bịa ra thông tin được. Khách phải gọi đi gọi lại để hỏi tiến độ — gốc là thiếu quy định thông báo chủ động các mốc xử lý, nên mặc định là khách phải tự hỏi. Cả ba, bản chất là \"điểm đau cơ chế\", không phải \"điểm đau thái độ\". Ý nghĩa của phân biệt này rất lớn: nếu chẩn đoán sai là do thái độ, ta sẽ đi khiển trách nhân viên — mà khiển trách thì không sửa được gốc, điểm đau vẫn tái diễn với người khác. Nếu chẩn đoán đúng là do cơ chế, ta thiết kế lại quy định, kênh, phân vai — và điểm đau biến mất một cách hệ thống. Đây chính là cầu nối tự nhiên sang vai trò của người quản lý.","hoatdong":"","callouts":["Phần lớn điểm đau là \"điểm đau cơ chế\" — sửa bằng thiết kế cơ chế, không sửa bằng khiển trách nhân viên."],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["3 ví dụ truy nguyên nhân gốc","Điểm đau khách thấy"],["Tưởng là do","Thực ra do (gốc cơ chế)"],["Thợ đến trễ không báo","NV vô trách nhiệm"],["Thiếu quy định báo khi đổi lịch","NV hiện trường không giải thích được"],["NV kém chuyên môn","Thiếu kênh nội bộ cập nhật tiến độ"],["Khách phải gọi nhiều lần hỏi tiến độ","NV lười"],["Thiếu quy định thông báo chủ động các mốc",""]]}]},{"n":14,"title":"VÌ SAO ĐIỂM ĐAU CƠ CHẾ CHỈ QUẢN LÝ MỚI SỬA ĐƯỢC","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Giảng","dur":3,"content":["3 lớp thẩm quyền","Nhân viên: không có thẩm quyền tự đặt quy định thông báo, tự lập kênh liên lạc nội bộ","Khách hàng: không thể tự yêu cầu đơn vị cải tiến cơ chế","Người quản lý cấp Điện lực: là người duy nhất có thẩm quyền thiết kế lại quy trình, kênh liên lạc, phân vai phối hợp","Kết luận: TNKH là một phần trách nhiệm điều hành của quản lý — không chỉ việc của tổ CSKH"],"loithoai":"Nếu phần lớn điểm đau là điểm đau cơ chế, thì câu hỏi tiếp theo là: ai sửa được cơ chế? Hãy nhìn ba lớp. Nhân viên tuyến đầu — dù tận tâm đến đâu — không có thẩm quyền tự ban hành một quy định \"phải báo khách khi đổi lịch\", cũng không tự lập được một kênh liên lạc nội bộ giữa các tổ; những việc đó vượt tầm của họ. Khách hàng thì càng không: khách chỉ có thể phàn nàn hoặc bỏ đi, không thể yêu cầu đơn vị thiết kế lại cơ chế bên trong. Vậy còn lại ai? Người quản lý cấp Điện lực — chính là anh/chị — là người duy nhất trong bức tranh này có thẩm quyền thiết kế lại quy trình, lập kênh liên lạc, phân vai phối hợp giữa các tổ. Đó là lý do vì sao trải nghiệm khách hàng phải được nhìn nhận là một phần trách nhiệm điều hành của quản lý cấp trung, chứ không phải chỉ là việc của tổ chăm sóc khách hàng. Bộ phận chăm sóc khách hàng là điểm chạm cuối, nhưng phần lớn trải nghiệm đã được định hình từ các khâu trước đó — những khâu mà anh/chị tổ chức và điều hành.","hoatdong":"","callouts":[],"tables":[]},{"n":15,"title":"TỰ VẼ BẢN ĐỒ HÀNH TRÌNH TẠI ĐƠN VỊ (giới thiệu công cụ)","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Thực hành","dur":8,"content":["3 bước tư duy bản đồ hành trình","Bước 1 – Liệt kê điểm chạm: ghi ra mọi nơi khách tiếp xúc với đơn vị trong 1 hành trình","Bước 2 – Đánh dấu điểm đau: khoanh những chỗ khách hay bực/mất niềm tin","Bước 3 – Truy nguyên nhân gốc: với mỗi điểm đau hỏi \"đây là điểm đau cơ chế hay thái độ? cơ chế nào đang thiếu?\"","Ghi chú: đây là cách tư duy sẽ dùng trong thảo luận nhóm (ND5)"],"loithoai":"Trước khi đúc kết, tôi giới thiệu nhanh một công cụ mà anh/chị sẽ dùng thực sự ở phần thảo luận nhóm cuối buổi: vẽ bản đồ hành trình khách hàng tại chính đơn vị mình. Ba bước. Bước một, liệt kê điểm chạm: chọn một hành trình — ví dụ cấp điện mới — và ghi ra tuần tự mọi nơi khách chạm vào đơn vị, từ lúc tìm hiểu đến lúc nghiệm thu. Bước hai, đánh dấu điểm đau: nhìn lại danh sách đó và khoanh những chỗ khách hay bực bội, hay mất kiên nhẫn, hay gọi lên phàn nàn. Bước ba — và đây là bước tạo ra giá trị — với mỗi điểm đau, đặt câu hỏi: đây là điểm đau cơ chế hay điểm đau thái độ? Nếu là cơ chế, thì cơ chế nào đang thiếu — thiếu quy định, thiếu kênh, hay thiếu phân vai? Ba bước này biến một cảm giác mơ hồ \"khách hay than phiền\" thành một danh sách vấn đề cụ thể có địa chỉ để sửa. Chúng ta sẽ làm đúng bài này trong sáu mươi phút thảo luận cuối buổi.","hoatdong":"","callouts":[],"tables":[]},{"n":16,"title":"ĐÚC KẾT NỘI DUNG 2","part":"NỘI DUNG 2 · Ba hành trình khách hàng, điểm chạm và điểm đau cơ chế","loai":"Đúc kết","dur":5,"content":["chốt + cầu nối","Ba hành trình: cấp điện mới · đang dùng điện · sự cố–khiếu nại — mỗi hành trình có điểm chạm & điểm đau riêng","Phần lớn điểm đau nằm ở thông tin & khoảng giữa các khâu, không ở tay nghề","Phát hiện then chốt: điểm đau cơ chế ≠ điểm đau thái độ → chỉ người quản lý sửa được gốc"],"loithoai":"Đúc kết Nội dung 2. Ta đã dựng bản đồ ba hành trình khách hàng: cấp điện mới, đang dùng điện, và sự cố–khiếu nại; mỗi hành trình có điểm chạm và điểm đau riêng. Nhìn xuyên suốt, phần lớn điểm đau tập trung ở thông tin và ở khoảng giữa các khâu — nơi hồ sơ chuyển tay, nơi thông tin dễ đứt — chứ không phải ở tay nghề kỹ thuật. Và phát hiện then chốt: phần lớn là điểm đau cơ chế, không phải điểm đau thái độ; mà điểm đau cơ chế thì chỉ người quản lý mới có thẩm quyền sửa tận gốc. Đến đây một câu hỏi rất thực tế hiện ra: người quản lý sửa cơ chế bằng công cụ gì? Câu trả lời không phải một công cụ mới — mà chính là những gì anh/chị đã học ở Chuyên đề 2a: nhịp điều hành và chất lượng thực thi. Nội dung 3 sẽ nối hai chuyên đề lại: mỗi công cụ điều hành ở 2a tác động lên trải nghiệm khách hàng như thế nào.\n\nNỘI DUNG 3: Vai trò người quản lý cấp Điện lực trong định hình TNKH\n\nQua nhịp điều hành · qua tam giác trách nhiệm · qua chất lượng thực thi · Bộ nguyên tắc & chuẩn ONE EVN CX\n\nNội dung 3 là trọng tâm nối kết của cả chuyên đề: chỉ ra cụ thể người Trưởng/Phó Điện lực tác động đến trải nghiệm khách hàng bằng đường nào. Ta sẽ thấy ba con đường, và đều là những thứ anh/chị đã có trong tay từ Chuyên đề 2a: nhịp điều hành, tam giác trách nhiệm, và chất lượng thực thi. Sau đó ta hệ thống lại bằng một bộ nguyên tắc và một chuẩn phục vụ để anh/chị mang về áp dụng.","hoatdong":"","callouts":["Người quản lý sửa cơ chế đó bằng công cụ gì? Bằng chính nhịp điều hành và chất lượng thực thi ở CĐ2a."],"tables":[]},{"n":17,"title":"CON ĐƯỜNG 1: NHỊP ĐIỀU HÀNH → TNKH","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Demo","dur":3,"content":["chuỗi nhân–quả","Giao ban có mục TNKH mỗi sáng → phát hiện sớm phiếu tồn/phàn nàn → xử lý trước khi thành khiếu nại","Nhịp tuần rà phối hợp liên tổ → khơi thông việc kẹt → rút thời gian phục vụ khách","Nhịp tháng nhìn lại phàn nàn KH → điều chỉnh cơ chế cho tháng sau"],"loithoai":"Con đường thứ nhất là nhịp điều hành — thứ anh/chị đã thiết kế ở 2a. Nhớ lại: nhịp giao ban ngày có bốn mục cố định, trong đó có một mục về trải nghiệm khách hàng. Chính mục nhỏ ấy là công cụ phòng bệnh mạnh nhất: mỗi sáng hỏi một câu — \"có phiếu nào tồn quá hạn, có phàn nàn nào đang nhen nhóm không\" — là anh/chị phát hiện sớm và xử lý trước khi nó bùng thành khiếu nại chính thức. Nhớ con số ở đầu buổi: bảy mươi đến bảy mươi lăm phần trăm phàn nàn là do khách không được thông báo; chỉ một mục TNKH trong giao ban đã chặn được phần lớn số đó ngay từ gốc. Nhịp tuần — buổi rà soát phối hợp liên tổ — khơi thông những việc kẹt giữa các tổ, mà kẹt giữa các tổ chính là nơi sinh ra chậm trễ khách nhìn thấy. Nhịp tháng nhìn lại toàn cảnh phàn nàn của tháng để điều chỉnh cơ chế cho tháng sau. Ba nhịp này không phải việc thêm vì khách hàng — chúng là chính công cụ điều hành của anh/chị, chỉ cần cài thêm lăng kính khách hàng vào.","hoatdong":"","callouts":["Hầu hết phàn nàn là do \"không được thông báo\" — một mục TNKH trong giao ban chặn phần lớn số đó từ gốc."],"tables":[]},{"n":18,"title":"CON ĐƯỜNG 2: TAM GIÁC TRÁCH NHIỆM → TNKH","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Demo","dur":3,"content":["sơ đồ + nguyên tắc Zero Repeat","Tam giác 3 vai (từ CĐ2a): Người chủ trì · Người phối hợp · Người phản hồi khách hàng (đầu mối duy nhất)","Tác động TNKH: khách có 1 đầu mối, không phải kể lại nhiều lần → \"không bắt khách làm công việc của EVN\"","Ví dụ: cấp điện mới → tổ KD chủ trì + là đầu mối phản hồi khách; tổ KT phối hợp khảo sát → khách chỉ nhớ 1 số điện thoại"],"loithoai":"Con đường thứ hai là tam giác trách nhiệm — công cụ phối hợp liên tổ anh/chị đã học ở 2a. Nhắc lại: với mỗi việc liên tổ, xác định đủ ba vai — người chủ trì chịu trách nhiệm chạy việc đầu cuối, người phối hợp hỗ trợ chuyên môn, và người phản hồi khách hàng là đầu mối duy nhất giao tiếp với khách. Bây giờ ta nhìn nó từ phía khách. Cái điểm đau lớn nhất trong các hành trình là gì? Là khách phải kể đi kể lại vấn đề của mình cho hết người này đến người kia, mỗi lần một câu trả lời khác nhau — như anh H gọi ba lần gặp ba người. Tam giác trách nhiệm xóa điểm đau đó: khi có một đầu mối phản hồi duy nhất, khách chỉ cần nhớ một số điện thoại, chỉ kể một lần, và luôn có người nắm trọn câu chuyện của họ. Đây đúng tinh thần một nguyên tắc rất hay trong ngành: không bắt khách hàng làm công việc của EVN — không bắt khách tự truyền tin giữa các tổ của ta. Ví dụ cấp điện mới: tổ kinh doanh vừa chủ trì vừa là đầu mối phản hồi khách, tổ kỹ thuật phối hợp khảo sát; ba vai rõ ràng thì việc không rơi vào vùng xám, và khách chỉ cần nhớ một đầu mối.","hoatdong":"","callouts":[],"tables":[]},{"n":19,"title":"CON ĐƯỜNG 3: CHẤT LƯỢNG THỰC THI → TNKH","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Demo","dur":3,"content":["3 tầng chuẩn phục vụ ONE EVN CX","Mức","Đặc điểm","Ví dụ (sự cố hẹn 2h, sẽ chậm)","Chuẩn","Làm đúng, đủ, đúng hạn","Xử lý xong, không báo gì thêm","Tốt","Chủ động thông tin, đồng cảm","Gọi báo: \"phức tạp hơn dự kiến, thêm 1h\"","Tỏa sáng","Vượt kỳ vọng, để lại ấn tượng","Báo chậm + cập nhật tiến độ giữa chừng + hỏi lại khi xong"],"loithoai":"Con đường thứ ba là chất lượng thực thi — cùng một việc nhưng làm ở mức nào. Ngành ta có một khung ba tầng gọi là ONE EVN CX rất đáng dùng. Mức Chuẩn: làm đúng, làm đủ, đúng hạn — đây là mức tối thiểu, nền của niềm tin. Nhưng đúng hạn không thôi chưa tạo được cảm xúc tích cực. Mức Tốt: chủ động thông tin và thể hiện đồng cảm. Mức Tỏa sáng, cộng một: vượt kỳ vọng, để lại ấn tượng khiến khách muốn kể lại. Lấy đúng tình huống rất quen: một sự cố hẹn khách hai tiếng, nhưng thực tế sẽ chậm. Ở mức Chuẩn, ta cứ xử lý cho xong, không nói gì thêm — khách ngồi chờ, quá hẹn, bắt đầu bực. Ở mức Tốt, ta chủ động gọi: \"việc phức tạp hơn dự kiến, xin thêm khoảng một giờ nữa, em sẽ cập nhật tiếp\" — chỉ một cuộc gọi báo trước như thế đã giảm tới khoảng tám mươi phần trăm bức xúc, vì khách sợ nhất là bị bỏ trong bóng tối, không phải sợ chờ. Ở mức Tỏa sáng, ta báo chậm, rồi còn cập nhật giữa chừng, và khi xong gọi lại hỏi khách đã ổn chưa. Điều đáng nói: khác biệt giữa ba mức gần như không tốn thêm nguồn lực — chỉ tốn một quyết định điều hành: có quy định báo lại khách hay không. Slide tiếp theo sẽ cho anh/chị thấy ba mức này qua các khoảnh khắc thật.","hoatdong":"","callouts":["chỉ một cuộc gọi báo trước → giảm phần lớn bức xúc của khách hàng"],"tables":[]},{"n":20,"title":"ONE EVN CX QUA CÁC KHOẢNH KHẮC THẬT — CHUẨN / TỐT / Tỏa sáng","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Demo","dur":3,"content":["Khoảnh khắc","Chuẩn (phải làm)","Tốt (nên làm)","Tỏa sáng","KH gọi báo mất điện, chưa rõ nguyên nhân","Xác nhận khu vực, ghi nhận & báo sẽ cập nhật trong 30'","Giải thích tình trạng bằng ngôn ngữ đời thường, hẹn mốc rõ","Chủ động: \"khu vực đang có nhiều KH cùng báo, đội đang được điều động, em theo dõi cập nhật ngay\"","Hóa đơn tăng gấp đôi, KH nghi tính sai","Bắt đầu bằng đồng cảm, đưa dữ liệu so sánh 3 tháng/cùng kỳ","Giải thích nguyên nhân đời thường (nóng, số ngày kỳ ghi); đề xuất kiểm tra công tơ","Hướng dẫn theo dõi điện theo ngày qua App để tự phát hiện bất thường","KH gọi lần 2, yêu cầu trước chưa xử lý","Xin lỗi, KHÔNG bắt kể lại, tự tìm phiếu, nêu trạng thái","Nhận đầu mối cá nhân theo dõi + hẹn giờ gọi lại cụ thể","Sau khi xong, gọi lại hỏi: \"trải nghiệm lần này của anh/chị thế nào để chúng em cải thiện?\"","Hóa đơn tăng >30% (chủ động chặn trước)","— (thuộc mức trên)","Nhắc hạn thanh toán trước 3–5 ngày","Chủ động gọi/nhắn KH TRƯỚC khi KH phát hiện: \"hóa đơn tháng này tăng, em giải thích trước để anh/chị không bất ngờ\""],"loithoai":"Slide phụ này cho anh/chị thấy khung Chuẩn – Tốt – Tỏa sáng sống động qua bốn khoảnh khắc rất quen với đơn vị. Khoảnh khắc thứ nhất, khách gọi báo mất điện: mức Chuẩn là xác nhận khu vực và hứa cập nhật trong ba mươi phút; mức Tốt là giải thích tình trạng bằng ngôn ngữ đời thường và hẹn mốc rõ; mức Tỏa sáng là chủ động nói cho khách biết khu vực đang có nhiều người cùng báo, đội đã được điều động — khách thấy mình không bị bỏ quên. Khoảnh khắc thứ hai, hóa đơn tăng gấp đôi: điều quan trọng nhất ở mức Chuẩn là bắt đầu bằng đồng cảm chứ không bằng câu \"hóa đơn của anh/chị hoàn toàn đúng\", và đưa dữ liệu so sánh khách quan; mức Tốt giải thích nguyên nhân đời thường và mời kiểm tra công tơ; mức Tỏa sáng hướng dẫn khách tự theo dõi điện theo ngày qua ứng dụng. Khoảnh khắc thứ ba, khách gọi lần hai mà yêu cầu trước chưa xử lý: mức Chuẩn tuyệt đối không bắt khách kể lại từ đầu, tự tìm phiếu; mức Tốt là một người nhận làm đầu mối theo dõi và hẹn giờ gọi lại; mức Tỏa sáng là sau khi xong còn hỏi lại trải nghiệm của khách. Khoảnh khắc thứ tư là một cấp độ điều hành cao hơn: chủ động chặn điểm đau trước khi nó xảy ra — khi hệ thống thấy hóa đơn tăng trên ba mươi phần trăm, gọi báo khách trước khi khách phát hiện và bực. Nhìn cả bốn, anh/chị thấy một quy luật: khác biệt giữa các mức gần như luôn nằm ở một quyết định chủ động thông tin — mà quyết định đó là do cơ chế đơn vị có quy định hay không, chứ không phải do nhân viên có khéo hay không. Đó chính là chỗ người quản lý can thiệp được.","hoatdong":"","callouts":["Cùng một khoảnh khắc, ba mức khác nhau gần như chỉ ở một quyết định chủ động thông tin — và đó là quyết định thuộc về cơ chế điều hành, không phải năng khiếu cá nhân."],"tables":[]},{"n":21,"title":"NĂM NGUYÊN TẮC THIẾT KẾ ĐIỂM CHẠM","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Giảng","dur":4,"content":["5 nguyên tắc (từ Bài 4 e-learning)","1. Chủ động thông tin — khách không phải hỏi mới biết; thông tin đi trước","2. Minh bạch thời gian — cam kết rõ; thay đổi phải báo trước kèm lý do","3. Đầu mối duy nhất — mỗi yêu cầu có một người theo suốt","4. Đồng cảm trong ngôn ngữ — tôn trọng, thấu hiểu, nhất là khi khách đang khó","5. Đóng vòng phản hồi — sau khi xong, kiểm tra khách có thực sự hài lòng & rút bài học"],"loithoai":"Từ ba con đường trên, ta hệ thống lại thành năm nguyên tắc thiết kế điểm chạm — anh/chị đã gặp chúng trong bài e-learning và giờ ta đặt vào tay người điều hành. Nguyên tắc một, chủ động thông tin: khách hàng không nên phải hỏi mới biết tình trạng yêu cầu của mình; thông tin phải đi trước một bước. Nguyên tắc hai, minh bạch thời gian: mọi cam kết về thời gian phải rõ ràng, và nếu có thay đổi thì báo trước kèm lý do — đây đúng là chỗ anh H bị tổn thương. Nguyên tắc ba, đầu mối duy nhất: mỗi yêu cầu có một người phụ trách theo suốt, khách không phải chuyển qua lại giữa các bộ phận — chính là tam giác trách nhiệm. Nguyên tắc bốn, đồng cảm trong ngôn ngữ: cách nói, cách viết, cách lắng nghe phải thể hiện tôn trọng và thấu hiểu, đặc biệt khi khách đang gặp khó. Nguyên tắc năm, đóng vòng phản hồi: sau mỗi việc, có một bước ngắn kiểm tra xem khách có thực sự hài lòng và rút bài học cho lần sau. Năm nguyên tắc này không phải khẩu hiệu — mỗi cái đều biến được thành một dòng quy định cụ thể trong nhịp điều hành của anh/chị.","hoatdong":"","callouts":[],"tables":[]},{"n":22,"title":"\"NGÀY TRẢI NGHIỆM KHÁCH HÀNG\" — CÔNG CỤ CỦA NGƯỜI QUẢN LÝ","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Demo","dur":4,"content":["Định kỳ (mỗi quý / ≥2 lần/năm): Trưởng-Phó ĐL tự trải nghiệm dịch vụ đơn vị mình","Cách làm: gọi tổng đài với tư cách khách (không báo trước) · hoặc quan sát NV phục vụ tại quầy/hiện trường (không mặc đồng phục lãnh đạo)","Nguyên tắc: \"Tôi không thể yêu cầu cải thiện điều tôi chưa từng trải nghiệm.\"","Sau đó: ghi nhận & chia sẻ trong giao ban — cả điểm tốt lẫn điểm cần sửa"],"loithoai":"Tôi muốn giới thiệu một công cụ cụ thể, đơn giản mà hiệu quả bất ngờ, dành riêng cho người quản lý: \"ngày trải nghiệm khách hàng\". Ý tưởng là định kỳ — mỗi quý, hoặc ít nhất hai lần một năm — anh/chị tự đặt mình vào vị trí khách hàng của chính đơn vị mình. Cách làm: gọi vào tổng đài với tư cách một khách hàng bình thường, không báo trước, và nghe xem mình được phục vụ ra sao; hoặc ra quầy, ra hiện trường quan sát nhân viên phục vụ khách mà không mặc đồng phục lãnh đạo, để thấy thực tế chứ không phải màn trình diễn. Nguyên tắc đằng sau rất giản dị: tôi không thể yêu cầu cải thiện một điều mà chính tôi chưa từng trải nghiệm. Rất nhiều Trưởng Điện lực quản lý dịch vụ khách hàng qua báo cáo, qua con số — mà báo cáo thì đẹp, còn cảm giác chờ máy mười phút thì báo cáo không kể. Sau khi trải nghiệm, anh/chị mang cả điểm tốt lẫn điểm cần sửa ra chia sẻ trong giao ban — vừa để ghi nhận việc làm tốt, vừa để cả đơn vị cùng thấy điểm đau qua con mắt khách hàng. Một buổi sáng làm khách hàng của chính mình dạy nhiều hơn mười bản báo cáo.","hoatdong":"","callouts":[],"tables":[]},{"n":23,"title":"TNKH VỪA LÀ \"QUẢ\" VỪA LÀ \"NHÂN\"","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Giảng","dur":4,"content":["vòng xoáy","TNKH là QUẢ: kết quả tự nhiên của điều hành nội bộ tốt","TNKH là NHÂN: khi lấy cảm nhận khách làm thước đo hằng ngày → thành động lực giữ nhịp","Vòng xoáy đi lên: Điều hành tốt → khách hài lòng → ít phàn nàn → có thêm thời gian điều hành → tốt hơn nữa"],"loithoai":"Trước khi đúc kết, tôi muốn gói cả Nội dung 3 vào một hình ảnh mà anh/chị đã thoáng gặp ở 2a: trải nghiệm khách hàng vừa là quả vừa là nhân. Là quả, vì nó là kết quả tự nhiên của điều hành nội bộ tốt — anh/chị dựng nhịp đúng, phân vai rõ, thực thi ở mức Tốt trở lên, thì khách hài lòng như một hệ quả. Nhưng nó cũng là nhân, vì khi anh/chị lấy cảm nhận khách làm thước đo mỗi ngày — đưa nó vào giao ban, hỏi nó trong mỗi quyết định — thì chính nó trở thành động lực giữ nhịp, thành la bàn định hướng. Hai vai đó tạo một vòng xoáy đi lên: điều hành tốt thì khách hài lòng, khách hài lòng thì ít phàn nàn, ít phàn nàn thì anh/chị bớt phải chữa cháy nên có thêm thời gian để điều hành tốt hơn nữa. Và đây là câu tôi muốn anh/chị khắc vào trí nhớ như một tiêu chuẩn tự kiểm: nếu cơ chế điều hành trông có vẻ tốt mà khách vẫn phàn nàn, thì nó chưa đủ tốt. Trải nghiệm khách hàng là thước đo cuối cùng — không phải bản báo cáo nội bộ.","hoatdong":"","callouts":["Nếu cơ chế điều hành tốt mà khách vẫn phàn nàn → chưa đủ tốt. TNKH là thước đo cuối cùng."],"tables":[]},{"n":24,"title":"ĐÚC KẾT NỘI DUNG 3","part":"NỘI DUNG 3 · Vai trò người quản lý cấp Điện lực trong định hình TNKH","loai":"Đúc kết","dur":5,"content":["chốt + cầu nối","3 con đường quản lý tác động TNKH: Nhịp điều hành · Tam giác trách nhiệm · Chất lượng thực thi","5 nguyên tắc điểm chạm + công cụ \"Ngày trải nghiệm KH\"","TNKH vừa là quả vừa là nhân — thước đo cuối cùng của điều hành"],"loithoai":"Đúc kết Nội dung 3. Người quản lý cấp Điện lực tác động đến trải nghiệm khách hàng qua ba con đường, và cả ba đều là công cụ anh/chị đã có từ 2a: nhịp điều hành để phát hiện và phòng điểm đau từ sớm; tam giác trách nhiệm để khách luôn có một đầu mối, không phải kể lại nhiều lần; và chất lượng thực thi ở mức Tốt trở lên, mà khác biệt chỉ nằm ở một quyết định — có báo lại khách hay không. Ta có năm nguyên tắc thiết kế điểm chạm và một công cụ tự soi rất mạnh là \"ngày trải nghiệm khách hàng\". Và trên hết, ta nhớ trải nghiệm khách hàng vừa là quả vừa là nhân — là thước đo cuối cùng của chất lượng điều hành. Bây giờ đủ lý thuyết rồi; điều cần là nhìn thấy nó vận hành. Nội dung 4: một video theo chân một yêu cầu của khách đi qua các khâu nội bộ, và một trò chơi mô phỏng nơi anh/chị ra quyết định điều hành và thấy ngay chỉ số trải nghiệm khách hàng thay đổi.\n\nNỘI DUNG 4: Video tình huống + Gamification \"Điều hành & TNKH\"\n\nXem hành trình một yêu cầu · Ra quyết định · Quan sát tác động lên chỉ số TNKH\n\nNội dung 4 là phần trải nghiệm trực quan. Trước hết ta xem một video kể câu chuyện một yêu cầu của khách hàng đi xuyên qua các khâu nội bộ của đơn vị — để thấy trải nghiệm được hình thành và bị bẻ gãy ở đâu. Sau đó anh/chị bước vào một trò chơi mô phỏng: đặt mình vào ghế người điều hành, đối mặt các tình huống, ra quyết định, và quan sát ngay lập tức quyết định đó đẩy chỉ số trải nghiệm khách hàng lên hay xuống. Đây là cách học \"thấm\" nhất — vì ta không nghe về nhân quả nữa, mà tự tay tạo ra nhân quả.","hoatdong":"","callouts":["Lý thuyết đã đủ. Giờ ta xem một video tình huống và chơi một mô phỏng để thấy các quyết định điều hành tác động lên chỉ số TNKH ra sao."],"tables":[]},{"n":25,"title":"HỌC LIỆU VIDEO: HÀNH TRÌNH MỘT YÊU CẦU KHÁCH HÀNG","part":"NỘI DUNG 4 · Video tình huống và gamification Điều hành & TNKH","loai":"Video","dur":8,"content":["mô tả video + câu hỏi dẫn thảo luận","Video: Một yêu cầu của khách đi qua các khâu nội bộ — tiếp nhận → chuyển tổ → khảo sát → xử lý → phản hồi; làm rõ điểm chạm nào tác động TNKH và chỗ nào thông tin bị đứt","4 điểm quan sát: (1) chỗ hồ sơ chuyển giữa 2 tổ (2) chỗ khách phải chủ động hỏi (3) chỗ thiếu đầu mối phản hồi (4) chỗ một quyết định điều hành đã cứu/hỏng trải nghiệm","Câu hỏi sau video: Điểm đứt gãy nằm ở khâu nào? Là điểm đau cơ chế hay thái độ? Cơ chế nào ở CĐ2a sửa được nó?"],"loithoai":"Video này dài khoảng bốn đến năm phút, kể theo chân một yêu cầu của khách hàng từ lúc phát sinh đến lúc kết thúc, đi xuyên qua các khâu nội bộ — tiếp nhận, chuyển tổ, khảo sát, xử lý, phản hồi. Khác với video ở 2a vốn phân tích nhịp giao ban nhìn từ bên trong, video này nhìn từ điểm chạm của khách: mỗi khâu nội bộ hiện ra như một điểm mà trải nghiệm khách được cộng thêm hoặc bị trừ đi. Khi xem, anh/chị chú ý bốn điểm. Một, chỗ hồ sơ chuyển từ tổ này sang tổ kia — vùng xám kinh điển. Hai, chỗ khách phải chủ động gọi hỏi vì không ai báo. Ba, chỗ thiếu một đầu mối phản hồi khiến khách bị đẩy qua lại. Bốn, chỗ một quyết định điều hành đúng lúc đã cứu được trải nghiệm — hoặc một quyết định thiếu đã làm hỏng nó. Xem xong, ta thảo luận nhanh ba câu: điểm đứt gãy nằm ở khâu nào; đó là điểm đau cơ chế hay thái độ; và cơ chế nào trong những gì ta học ở 2a — nhịp điều hành, tam giác trách nhiệm — sẽ sửa được nó. Video không phải để xem cho biết, mà để luyện đúng con mắt chẩn đoán \"điểm đau cơ chế\" mà ta vừa học.","hoatdong":"","callouts":[],"tables":[]},{"n":26,"title":"GAMIFICATION: \"ĐIỀU HÀNH & TNKH\" (30 phút)","part":"NỘI DUNG 4 · Video tình huống và gamification Điều hành & TNKH","loai":"Game","dur":30,"content":["luật chơi + cơ chế","Bối cảnh: mỗi người/nhóm là Trưởng Điện lực trong một ca điều hành mô phỏng; lần lượt gặp các tình huống (sự cố, khiếu nại, việc liên tổ, hồ sơ trễ...)","Cách chơi: mỗi tình huống có 3–4 lựa chọn quyết định điều hành → hệ thống hiển thị tác động real-time lên chỉ số TNKH (và chỉ số phụ: thời gian xử lý, tải đội ngũ)","Điểm học: lựa chọn theo cơ chế (báo trước, chốt đầu mối, giao ban có mục TNKH) → chỉ số TNKH tăng; lựa chọn kiểu \"chữa cháy/ôm việc\" → tăng tải mà TNKH vẫn giảm","Sau game: bảng xếp hạng + giảng viên đúc kết các quyết định \"cơ chế\" thắng \"sự vụ\""],"loithoai":"Bây giờ là ba mươi phút chơi. Mỗi anh/chị — hoặc mỗi nhóm nhỏ — vào vai Trưởng Điện lực trong một ca điều hành mô phỏng. Trò chơi lần lượt ném ra các tình huống rất quen: một sự cố cần xử lý, một khiếu nại đang nóng, một việc liên tổ dễ rơi vùng xám, một hồ sơ sắp trễ hẹn. Với mỗi tình huống, anh/chị có ba đến bốn lựa chọn quyết định điều hành, và điểm hay là: ngay khi anh/chị chọn, hệ thống hiển thị tác động lập tức lên chỉ số trải nghiệm khách hàng, đồng thời hai chỉ số phụ — thời gian xử lý và tải công việc của đội ngũ. Anh/chị sẽ tự khám phá một quy luật: những lựa chọn theo cơ chế — chủ động báo khách trước, chốt một đầu mối phản hồi, đưa việc vào nhịp giao ban — làm chỉ số trải nghiệm tăng mà không làm đội ngũ quá tải. Ngược lại, những lựa chọn kiểu chữa cháy — tự ôm việc cho nhanh, để đó xử lý sau — có thể xong việc trước mắt nhưng đẩy tải lên cao mà trải nghiệm khách vẫn tụt. Trò chơi này biến bài học trừu tượng \"cơ chế thắng sự vụ\" thành thứ anh/chị thấy bằng mắt qua con số. Cuối game có bảng xếp hạng cho vui, và tôi sẽ đúc kết vài quyết định điển hình mà \"cơ chế\" thắng \"sự vụ\".\n\nCách vận hành trong 30 phút trên lớp:\n\nMở đầu (3'): chiếu màn intro, giải thích luật chơi — mỗi lựa chọn đẩy TNKH lên hoặc xuống ngay trước mắt, và các tình huống là điểm đau có thật của EVNSPC. Chia lớp thành các nhóm học viên, mỗi nhóm một máy, đặt tên nhóm.\n\nChơi (18'): các nhóm tự chơi lần lượt 8 tình huống (~2 phút/tình huống gồm cả bàn bạc). Nhắc học viên đọc kỹ phản hồi sau mỗi lựa chọn — đó là nơi con số khảo sát xuất hiện. Nếu chơi lần lượt trên một máy chiếu chung, mỗi nhóm cử một người quyết định, cả lớp cùng thấy chỉ số đổi màu.\n\nĐúc kết (9'): mở màn kết của 1–2 nhóm, dùng ngay bảng \"Những chỗ cơ chế thắng sự vụ\" làm chất liệu. Chốt quy luật lặp lại trong game: chủ động báo trước, chốt một đầu mối, đưa việc vào nhịp giao ban — gần như luôn làm TNKH tăng mà không tăng tải. Kết bằng thông điệp đỏ ở cuối màn: 10/10 điểm đau lớn nhất là hành vi & giao tiếp, nằm trong tầm quyết định điều hành của chính học viên.","hoatdong":"","callouts":[],"tables":[]},{"n":27,"title":"ĐÚC KẾT NỘI DUNG 4","part":"NỘI DUNG 4 · Video tình huống và gamification Điều hành & TNKH","loai":"Đúc kết","dur":5,"content":["chốt + cầu nối","Video: thấy trải nghiệm được hình thành/bẻ gãy ở khoảng giữa các khâu nội bộ","Game: tự tay thấy quyết định điều hành theo cơ chế đẩy chỉ số TNKH lên; theo sự vụ thì không","Quy luật lặp lại: chủ động thông tin + một đầu mối + đưa vào nhịp = TNKH tăng, tải không tăng"],"loithoai":"Đúc kết Nội dung 4. Qua video, anh/chị đã thấy trải nghiệm khách hàng được hình thành hoặc bị bẻ gãy chủ yếu ở khoảng giữa các khâu nội bộ — đúng chỗ ta đã gọi tên là điểm đau cơ chế. Qua trò chơi, anh/chị tự tay chứng kiến: quyết định điều hành theo cơ chế đẩy chỉ số trải nghiệm lên mà không làm đội ngũ quá tải, còn quyết định theo kiểu sự vụ thì làm ngược lại. Một quy luật cứ lặp đi lặp lại trong game, đáng để mang về: chủ động thông tin, giữ một đầu mối, và đưa việc vào nhịp — ba cái đó gần như luôn làm trải nghiệm khách tốt lên mà chi phí thêm gần bằng không. Lý thuyết đủ, video đủ, mô phỏng đủ. Việc còn lại là quan trọng nhất và cũng khó nhất: áp vào chính đơn vị của anh/chị. Nội dung 5 — sáu mươi phút thảo luận nhóm — là nơi ta làm điều đó.\n\nNỘI DUNG 5: Thảo luận nhóm — đề xuất giải pháp\n\nVẽ hành trình thật · Truy điểm đau cơ chế · Thiết kế giải pháp · Trình bày\n\nNội dung 5 là phần thực hành sâu nhất, kéo dài khoảng một giờ theo nhóm. Đây là nơi anh/chị biến toàn bộ chuyên đề thành một sản phẩm cụ thể cho đơn vị mình: chọn một hành trình khách hàng thật, vẽ nó ra, tìm điểm đau, truy đến gốc cơ chế, và thiết kế giải pháp gắn điều hành nội bộ với trải nghiệm khách hàng. Mỗi nhóm sẽ trình bày, cả lớp cùng góp ý, và mỗi cá nhân rời lớp với một cam kết ba mươi ngày.","hoatdong":"","callouts":["Giờ đến lượt đơn vị anh/chị — thảo luận nhóm vẽ hành trình thật và đề xuất giải pháp thật."],"tables":[]},{"n":28,"title":"THẢO LUẬN NHÓM: QUY TRÌNH 4 BƯỚC (60 phút)","part":"NỘI DUNG 5 · Thảo luận nhóm, giải pháp và cam kết 30 ngày","loai":"Thực hành","dur":35,"content":["khung làm việc nhóm","Bước 1 (15'): Chọn 1 hành trình KH thật tại đơn vị → vẽ điểm chạm, khoanh 2–3 điểm đau nổi cộm","Bước 2 (15'): Với mỗi điểm đau, truy: cơ chế hay thái độ? Cơ chế nào đang thiếu (quy định / kênh / phân vai)?","Bước 3 (20'): Thiết kế giải pháp điều hành — dùng công cụ CĐ2a: thêm mục giao ban? áp tam giác trách nhiệm? đặt quy định báo lại khách?","Bước 4 (10'): Mỗi nhóm trình bày 3' — 1 điểm đau + 1 giải pháp cơ chế cụ thể; giảng viên phản hồi"],"loithoai":"Sáu mươi phút thảo luận chia làm bốn bước, mỗi nhóm làm trên chính đơn vị của các thành viên. Bước một, mười lăm phút: chọn một hành trình khách hàng thật — cấp điện mới, hóa đơn, hay xử lý sự cố — vẽ ra các điểm chạm và khoanh hai đến ba điểm đau nổi cộm nhất mà đơn vị hay gặp. Bước hai, mười lăm phút: với mỗi điểm đau, dùng đúng con mắt đã luyện hôm nay để truy — đây là điểm đau cơ chế hay thái độ, và nếu là cơ chế thì đang thiếu cái gì: thiếu một quy định, thiếu một kênh liên lạc, hay thiếu phân vai rõ ràng. Bước ba, hai mươi phút — phần cốt lõi: thiết kế giải pháp điều hành cho từng điểm đau, và tôi yêu cầu dùng chính công cụ của Chuyên đề 2a. Ví dụ: thêm một mục vào giao ban sáng để bắt sớm điểm đau này? Áp tam giác trách nhiệm cho loại việc này để có đầu mối duy nhất? Đặt một quy định buộc báo lại khách trước tại mốc nào? Bước bốn, mười phút: mỗi nhóm trình bày ba phút — chọn một điểm đau tâm đắc nhất và một giải pháp cơ chế cụ thể cho nó — rồi tôi phản hồi. Nguyên tắc chấm: giải pháp phải cụ thể và làm được ngay, không phải khẩu hiệu chung chung.","hoatdong":"","callouts":[],"tables":[]},{"n":29,"title":"MẪU PHIẾU: GẮN ĐIỀU HÀNH NỘI BỘ VỚI TNKH","part":"NỘI DUNG 5 · Thảo luận nhóm, giải pháp và cam kết 30 ngày","loai":"Thực hành","dur":20,"content":[],"loithoai":"Để phần thảo luận cho ra sản phẩm dùng được chứ không tan theo buổi học, mỗi nhóm và sau đó mỗi cá nhân điền vào mẫu phiếu này. Nó gồm sáu ô. Hành trình chọn: ghi rõ đang làm hành trình nào. Điểm đau nổi cộm: mô tả cụ thể khách gặp phải chuyện gì, bằng ngôn ngữ của khách. Chẩn đoán gốc: đây là cơ chế hay thái độ, và nếu cơ chế thì thiếu quy định nào, kênh nào, hay phân vai nào. Giải pháp điều hành: ghi rõ áp công cụ nào của 2a — thêm mục giao ban, áp tam giác trách nhiệm, hay đặt quy định báo lại khách. Đầu mối và thời hạn: ai chịu trách nhiệm triển khai và bao giờ bắt đầu. Và ô cuối, rất quan trọng mà hay bị bỏ qua: cách đo trải nghiệm khách đã cải thiện — dấu hiệu nào cho biết giải pháp có tác dụng, ví dụ giảm số phàn nàn về chậm trễ, giảm số cuộc gọi khách chủ động hỏi tiến độ. Có ô đo lường này thì cam kết mới không trôi, vì ba mươi ngày sau anh/chị có cái để nhìn lại.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["mẫu phiếu điền (nhóm + cá nhân)","Hạng mục"],["Nội dung điền","Hành trình chọn"],["(cấp điện mới / hóa đơn / sự cố...)","Điểm đau nổi cộm"],["(mô tả khách gặp gì)","Chẩn đoán gốc"],["Cơ chế / thái độ — thiếu quy định/kênh/phân vai nào?","Giải pháp điều hành"],["Công cụ CĐ2a áp dụng (giao ban / tam giác TN / quy định báo lại)","Đầu mối & thời hạn"],["Ai làm · khi nào áp dụng","Cách đo TNKH cải thiện"],["Dấu hiệu nào cho biết đã tốt hơn (giảm phàn nàn / giảm gọi lại...)",""]]}]},{"n":30,"title":"ĐÚC KẾT CHUYÊN ĐỀ","part":"NỘI DUNG 5 · Thảo luận nhóm, giải pháp và cam kết 30 ngày","loai":"Đúc kết","dur":5,"content":["Tóm tắt hành trình: TNKH là gì → 3 hành trình & điểm đau cơ chế → 3 con đường quản lý tác động → video + game → giải pháp thật","Nguyên tắc bao trùm (băng đỏ): Điều hành nội bộ tốt là cách phục vụ khách hàng tốt nhất — TNKH vừa là quả vừa là nhân.","Cam kết: mỗi học viên chọn 01 giải pháp gắn điều hành–TNKH triển khai trong 30 ngày","Định hướng: nhìn lại tại hội thảo trực tuyến sau đào tạo","Khép chuỗi CĐ2: 2a xây cơ chế bên trong · 2b đo bằng trải nghiệm bên ngoài → một vòng tròn hoàn chỉnh"],"loithoai":"Chúng ta khép lại Chuyên đề 2b, và cũng là khép trọn cặp Chuyên đề 2. Nhìn lại hành trình hôm nay: ta bắt đầu bằng việc làm rõ trải nghiệm khách hàng là gì và khác dịch vụ khách hàng ra sao; đi qua ba hành trình khách hàng với các điểm đau, và phát hiện then chốt rằng phần lớn là điểm đau cơ chế chứ không phải thái độ; chỉ ra ba con đường người quản lý tác động đến trải nghiệm — nhịp điều hành, tam giác trách nhiệm, chất lượng thực thi; xem video và chơi mô phỏng để thấy nhân quả bằng mắt; và cuối cùng mỗi nhóm thiết kế giải pháp thật cho đơn vị mình. Nguyên tắc bao trùm gói trong một câu: điều hành nội bộ tốt chính là cách phục vụ khách hàng tốt nhất — trải nghiệm khách hàng vừa là quả của điều hành, vừa là nhân định hướng điều hành. Bây giờ, để chuyên đề không dừng ở nhận thức: mỗi anh/chị chọn đúng một giải pháp gắn điều hành nội bộ với trải nghiệm khách hàng — có thể là thêm mục khách hàng vào giao ban, có thể là đặt một đầu mối duy nhất cho một loại yêu cầu, có thể là quy định báo lại khách trước tại một mốc. Ta sẽ cùng nhìn lại tại hội thảo trực tuyến sau đào tạo. Và xin nhớ mạch liền của cặp chuyên đề này: ở 2a anh/chị xây cơ chế điều hành bên trong; ở 2b anh/chị học cách đo chính cơ chế đó bằng trải nghiệm của khách bên ngoài — hai nửa khép lại thành một vòng tròn hoàn chỉnh của điều hành chuyên nghiệp. Xin chân thành cảm ơn anh/chị.","hoatdong":"","callouts":[],"tables":[]}],"prep":["Gắn điều hành nội bộ với nâng cao trải nghiệm khách hàng","Thời lượng: 105 phút giảng + 30 phút gamification + 60 phút thảo luận nhóm","Tài liệu chuẩn: 4. CĐ2b. Gắn điều hành nội bộ với TNKH.docx","Chuẩn bị học liệu video, game mô phỏng Điều hành & TNKH và mẫu phiếu thảo luận nhóm.","Giữ cấu trúc card/bullet/bảng/callout để giảng viên đọc theo từng slide."],"prompts12":[],"checklist":[["Hạng mục","Cách kiểm tra"],["Đúng nguồn Word","Đối chiếu số slide, tiêu đề, nội dung, lời thoại"],["Đúng thiết kế","Giữ card, bullet, bảng, chip, callout"],["Đúng vận hành","Có route, build xanh, không lỗi mã hóa"]],"vung":[["Nhóm","Nội dung","Ghi chú"],["CĐ2b","Điều hành nội bộ gắn với TNKH","Theo file Word chuẩn"]],"andanh":[["Nguồn","Cách xử lý"],["4. CĐ2
