<title>Sổ tay giảng viên · CĐ03a ? Huấn luyện nhân viên · QL01A</title>
<style>
:root{
  --red:#C00000;--red-d:#8f0000;--ink:#1a1a1a;--grey:#565656;--lgrey:#8a8a8a;
  --line:#e7e7e8;--bg:#f4f4f5;--card:#fff;--gold:#B8860B;--green:#1F6F54;
  --blue:#1F5F8B;--violet:#6B4E9E;--teal:#127475;
  --sh:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
aside{width:296px;flex:0 0 296px;background:#fff;border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.brand .k{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:14px;margin:0;font-weight:800;letter-spacing:.02em}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--lgrey)}
.nav{padding:6px 0 60px}
.nav-sec{padding:13px 18px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--lgrey)}
.nav a{display:flex;gap:9px;align-items:baseline;padding:7px 18px;font-size:13px;color:var(--ink);border-left:3px solid transparent;cursor:pointer;user-select:none}
.nav a:hover{background:#faf6f6}
.nav a.active{background:#fbeaea;border-left-color:var(--red);color:var(--red);font-weight:700}
.nav a .sn{flex:0 0 24px;font-variant-numeric:tabular-nums;color:var(--lgrey);font-size:12px}
.nav a.active .sn{color:var(--red)}
.nav a .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .dur{font-size:11px;color:var(--lgrey);font-variant-numeric:tabular-nums}
main{flex:1;min-width:0;max-width:940px;margin:0 auto;padding:34px 42px 100px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
h2.page{font-size:27px;margin:0 0 6px;font-weight:800;line-height:1.2}
.sub{color:var(--grey);font-size:15px;margin:0 0 20px}
.metabar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#f0f0f0;color:var(--grey)}
.chip b{color:var(--ink)}
.chip.red{background:#fbeaea;color:var(--red)}.chip.green{background:#e9f5ef;color:var(--green)}
.chip.gold{background:#fbf3e2;color:var(--gold)}.chip.blue{background:#e9f1f7;color:var(--blue)}
.chip.violet{background:#efe9f6;color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#fff}
.card.content h3 .ic{background:var(--red)}.card.speak h3 .ic{background:var(--ink)}
.card.act h3 .ic{background:var(--green)}.card.guide h3 .ic{background:var(--gold)}
.card ul{margin:0;padding-left:20px}.card li{margin:5px 0}
.card .lead{margin:0 0 12px;color:#2f2f2f;font-size:14.5px}
.card .mini-title{margin:14px 0 7px;font-size:13px;font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.04em}
.card .bullet-card{margin:8px 0 14px;padding:12px 14px;border-radius:12px;background:#fafafa;border:1px solid var(--line)}
.card .bullet-card ul{margin:0}
.card .question-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#f7fbff;border:1px solid #cfe1ef;color:#173a54}
.card .question-box b{color:var(--blue)}
.card .note-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#fff8e6;border:1px solid #efd99c;color:#5a4a1a}
.card .note-box b{color:var(--gold)}
.message-box{margin:16px 0;border:1px solid #f0c36d;border-left:6px solid var(--gold);background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:var(--sh);padding:16px 18px;border-radius:12px}
.message-box .message-title{font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.message-box p{margin:0;color:var(--ink);font-weight:650}
td .strong-line{font-weight:800}
.speak p{margin:0;color:#2c2c2c;font-size:14.5px;white-space:pre-line}
.act p{margin:0;font-size:14.5px;white-space:pre-line}
.callout{border-left:4px solid var(--gold);background:#fdf9ef;padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.5px;color:#5a4a1a}
.callout b{color:var(--gold)}
.slidenav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:#c9c9c9}
.btn:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--red);color:#fff;font-weight:700;font-size:12px}
tr.part td{background:#fbeaea;font-weight:800;color:var(--red)}
tr.brk td{background:#fdf6e3;font-weight:800;color:var(--gold)}
tr.tot td{background:var(--red);color:#fff;font-weight:800}
td.c{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.loai{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.loai.Giảng,.loai.GiảngTH,.loai.GiảngDemo{background:#eef;color:#3a3a8a}
.loai.Demo{background:#fbf3e2;color:var(--gold)}
.loai.Thựchành{background:#e9f5ef;color:var(--green)}
.loai.Đúckết{background:#f0f0f0;color:var(--grey)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.gcard{border-radius:14px;padding:20px 22px;color:#fff;box-shadow:var(--sh)}
.gcard.v{background:linear-gradient(135deg,#1F5F8B,#144463)}
.gcard.g{background:linear-gradient(135deg,#C00000,#7d0000)}
.gcard.d{background:linear-gradient(135deg,#6B4E9E,#463168)}
.gcard.t{background:linear-gradient(135deg,#127475,#0b4a4b)}
.gcard h3{margin:0 0 4px;font-size:18px;font-weight:800}
.gcard .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gcard ol{margin:12px 0 0;padding-left:20px}.gcard li{margin:6px 0;font-size:14px}
.gcard .foot{margin-top:12px;font-size:12.5px;opacity:.92;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
/* prompt cards */
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.pcard .ph{background:#faf6f6;padding:12px 18px;font-weight:800;font-size:15px;color:var(--red);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.pcard .ph .no{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.pcard .pb{padding:6px 18px 14px}
.prow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.prow:last-child{border-bottom:none}
.prow .k{flex:0 0 168px;font-weight:700;color:var(--grey);font-size:13px}
.prow .v{flex:1;white-space:pre-line}
.prow .v code,.mono{font-family:"SF Mono",Consolas,monospace;font-size:12.5px}
.promptbox{background:#f7f7f9;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;white-space:pre-wrap;color:#2a2a2a;line-height:1.55;margin:6px 0}
/* good/bad compare */
.cmp{display:grid;grid-template-columns:1fr;gap:14px;margin:14px 0}
.cmp .col{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cmp .col .h{padding:10px 16px;font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;gap:8px}
.cmp .bad .h{background:var(--red)}.cmp .good .h{background:var(--green)}
.cmp .col .b{padding:14px 16px;background:#fff}
.cmp .col .b p{margin:0 0 8px;font-size:14px}
.cmp .col .b p:last-child{margin-bottom:0}
/* quiz */
.progress{height:8px;background:#e6e6e6;border-radius:999px;overflow:hidden;margin:10px 0 22px}
.progress>i{display:block;height:100%;background:var(--red);transition:width .4s}
.q-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh)}
.q-meta{font-size:12px;color:var(--lgrey);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.q-ref{font-size:12px;color:var(--red);font-weight:700;margin-bottom:12px;cursor:pointer}
.q-text{font-size:17px;font-weight:700;margin:0 0 18px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:11px;margin:9px 0;font-size:14.5px;cursor:pointer;background:#fff;transition:.12s;font-family:inherit}
.opt:hover{border-color:#c9c9c9}
.opt .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f0f0f0;color:#666;font-weight:800;font-size:12px;margin-right:10px;vertical-align:middle}
.opt.correct{border-color:var(--green);background:#e9f5ef}.opt.correct .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbeaea}.opt.wrong .l{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.q-why{margin-top:16px;padding:13px 16px;border-radius:10px;background:#f6faf8;border:1px solid #d9ece4;font-size:14px;color:#264c3d;display:none}
.q-why.show{display:block}.q-why b{color:var(--green)}
.result{text-align:center;padding:26px}
.result .score{font-size:56px;font-weight:900;color:var(--red);line-height:1}
.result .lab{font-size:18px;font-weight:800;margin-top:6px}
.rev-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0;font-size:13.5px;text-align:left}
.rev-item .ok{color:var(--green);font-weight:700}.rev-item .no{color:var(--red);font-weight:700}
.menuBtn{display:none}
@media(max-width:880px){
  aside{position:fixed;left:-310px;z-index:40;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{left:0}
  .menuBtn{display:inline-flex;position:fixed;top:12px;left:12px;z-index:50;background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-size:16px;cursor:pointer;box-shadow:var(--sh)}
  main{padding:60px 18px 90px}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}.backdrop.open{display:block}
  .prow{flex-direction:column;gap:2px}.prow .k{flex:none}
}
</style>

<script>
const DATA={"slides":[{"n":1,"title":"MỤC LỤC CHUYÊN ĐỀ","part":"Mở đầu","loai":"Giảng","dur":3,"content":["5 thẻ nội dung","Vai trò phát triển con người của người quản lý","Phân biệt: nhắc việc – chỉ việc – huấn luyện – kèm cặp","OJT tại hiện trường & kỹ thuật phản hồi tại chỗ","Huấn luyện & phản hồi theo nhóm đối tượng nhân viên","Thực hành huấn luyện theo nhóm nhỏ"],"loithoai":"Đây là lộ trình của chuyên đề. Bắt đầu từ nhận thức nền: vì sao người quản lý phải là người phát triển con người, và điều đó liên hệ thế nào với chính việc giảm tải của anh/chị. Tiếp theo là một công cụ tư duy rất quan trọng — phân biệt rạch ròi bốn hình thức can thiệp: nhắc việc, chỉ việc, huấn luyện, kèm cặp; nhiều người làm lẫn lộn bốn cái này nên tốn sức mà đội ngũ không lớn lên. Sau đó là phần kỹ thuật cốt lõi: phương pháp huấn luyện tại hiện trường — gọi là OJT — và kỹ thuật phản hồi tại chỗ sao cho sửa được sai mà không làm mất động lực. Rồi ta học cách điều chỉnh phương pháp cho từng nhóm nhân viên: người mới, người còn yếu, người có tiềm năng, người đang căng thẳng. Cuối cùng, phần lớn thời gian dành cho thực hành theo nhóm nhỏ. Sợi chỉ đỏ xuyên suốt rất thực tế: cấp dưới giỏi hơn thì người quản lý nhẹ gánh hơn — phát triển người không phải việc làm thêm, mà là khoản đầu tư sinh lời cho chính anh/chị.","hoatdong":"","callouts":["\"Cấp dưới giỏi hơn — người quản lý nhẹ gánh hơn.\""],"tables":[]},{"n":2,"title":"KẾT NỐI TỪ CĐ1 & CĐ2a","part":"Mở đầu","loai":"Giảng","dur":3,"content":["CĐ1 — Công cụ: AI hỗ trợ xử lý phần việc hành chính","CĐ2a — Cơ chế: nhịp điều hành để đơn vị chạy đều","CĐ3a — Con người: phát triển đội ngũ để cơ chế có người vận hành tốt"],"loithoai":"Trước khi vào nội dung mới, ta đặt chuyên đề này vào bức tranh chung của cả khóa. Chuyên đề 1 cho anh/chị công cụ — dùng AI để xử lý nhanh phần việc hành chính. Chuyên đề 2a cho anh/chị cơ chế — nhịp điều hành để đơn vị chạy đều mà không phụ thuộc một người. Nhưng cả công cụ lẫn cơ chế đều cần con người vận hành; một nhịp điều hành tốt mà đội ngũ yếu thì vẫn trục trặc. Chuyên đề 3a bổ sung chân kiềng thứ ba: con người — phát triển đội ngũ để có người thực thi tốt cơ chế đó. Ba cái này là ba chân kiềng: công cụ, cơ chế, con người. Thiếu chân nào cái kiềng cũng đổ. Và có một liên hệ rất thực tế giữa ba chuyên đề: AI ở Chuyên đề 1 giúp anh/chị tiết kiệm thời gian; nhịp điều hành ở Chuyên đề 2a giúp anh/chị giải phóng khỏi việc vặt; thời gian giải phóng đó dùng để làm gì? Để phát triển con người — đúng nội dung hôm nay. Ba chuyên đề khớp vào nhau thành một vòng khép kín.","hoatdong":"","callouts":["Công cụ + Cơ chế + Con người = ba chân kiềng của điều hành chuyên nghiệp"],"tables":[]},{"n":3,"title":"VÌ SAO CHUYÊN ĐỀ NÀY QUAN TRỌNG: VÒNG XOÁY ÔM VIỆC","part":"Mở đầu","loai":"Giảng","dur":3,"content":["Không huấn luyện → cấp dưới chưa giỏi → phải làm thay → không có thời gian huấn luyện → cấp dưới vẫn chưa giỏi → … (vòng xoáy đi xuống)"],"loithoai":"Tôi muốn bắt đầu bằng một vòng xoáy mà gần như người quản lý nào cũng từng mắc, ít nhiều. Nó thế này: vì bận nên không có thời gian huấn luyện cấp dưới; cấp dưới không được huấn luyện nên chưa giỏi; chưa giỏi nên anh/chị không yên tâm giao, phải làm thay; làm thay thì lại càng bận; càng bận thì lại càng không có thời gian huấn luyện. Cứ thế, một vòng xoáy đi xuống, năm này qua năm khác. Đội ngũ không lớn lên, còn người quản lý thì kiệt sức. Anh/chị có thấy mình trong vòng xoáy này không? Phần lớn đều có, ở mức độ khác nhau. Điều quan trọng là: vòng xoáy này có một lối thoát duy nhất — dừng lại và đầu tư vào phát triển con người. Vâng, lúc đầu sẽ tốn thêm thời gian: hướng dẫn một việc kỹ càng mất nhiều thời gian hơn tự làm. Nhưng đó là khoản đầu tư: sau ba mươi ngày, sau hai tháng, cấp dưới làm được việc đó, và anh/chị được giải phóng vĩnh viễn khỏi nó. Đây chính là lý do chuyên đề này không phải \"việc làm thêm\" mà là chìa khóa để giảm tải bền vững.\n\nNỘI DUNG 1: Vai trò phát triển con người của người quản lý\n\nTừ \"làm cho xong việc\" sang \"đạt kết quả qua đội ngũ\"\n\nNội dung 1 làm rõ một chuyển dịch tư duy nền tảng: từ người quản lý \"làm cho xong việc\" sang người quản lý \"đạt kết quả thông qua đội ngũ\". Đây là ranh giới giữa một người làm việc giỏi và một người quản lý giỏi — và không phải ai cũng vượt qua được ranh giới đó một cách tự nhiên.","hoatdong":"","callouts":["Cách duy nhất thoát ra: DỪNG LẠI, đầu tư phát triển người. Tốn thêm thời gian lúc đầu — nhưng giảm tải bền vững sau đó."],"tables":[]},{"n":4,"title":"HAI TƯ DUY: \"LÀM CHO XONG\" VS \"ĐẠT KẾT QUẢ QUA ĐỘI NGŨ\"","part":"NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","loai":"Demo","dur":3,"content":[],"loithoai":"Hai tư duy này khác nhau ở từng tình huống nhỏ hằng ngày. Khi cấp dưới làm sai: người mang tư duy \"làm cho xong\" sẽ tự sửa hoặc làm lại cho nhanh; người mang tư duy \"đạt kết quả qua đội ngũ\" sẽ chỉ ra lỗi, hướng dẫn cách đúng, rồi để nhân viên tự sửa — mất thời gian hơn nhưng lần sau họ làm được. Khi việc gấp: một bên nói \"thôi để tôi làm cho nhanh\", một bên nói \"tôi hướng dẫn nhanh năm phút, lần sau em tự làm\". Khi cấp dưới hỏi: một bên trả lời ngay và giải quyết thay, một bên hỏi ngược \"em nghĩ nên làm thế nào\" rồi bổ sung — cách hỏi ngược này buộc nhân viên suy nghĩ, đó chính là huấn luyện. Nhìn từng dòng thì khác biệt rất nhỏ, chỉ vài câu nói. Nhưng cộng dồn qua hàng trăm tình huống mỗi tháng, kết quả dài hạn trái ngược hẳn: một bên càng ngày càng bận, đội ngũ thụ động chờ chỉ đạo; một bên dần nhẹ gánh, đội ngũ chủ động. Điều tôi muốn nhấn: chuyển tư duy không cần thay đổi gì lớn lao — chỉ cần thay đổi phản xạ trong những tình huống nhỏ hằng ngày.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Tình huống","Tư duy \"Làm cho xong\""],["Tư duy \"Đạt KQ qua đội ngũ\"","Cấp dưới làm sai"],["Tự sửa hoặc làm lại thay","Chỉ ra lỗi, hướng dẫn, để NV tự sửa"],["Khi việc gấp","\"Thôi để tôi làm cho nhanh\""],["\"Tôi hướng dẫn nhanh 5p, lần sau em tự làm\"","Khi cấp dưới hỏi"],["Trả lời ngay, giải quyết thay","Hỏi ngược: \"Em nghĩ nên làm thế nào?\" → bổ sung"],["Kết quả dài hạn","Càng bận hơn, đội ngũ thụ động"],["Dần nhẹ gánh, đội ngũ chủ động",""]]}]},{"n":5,"title":"PHÁT TRIỂN NGƯỜI LÀ MỘT PHẦN CỦA ĐIỀU HÀNH","part":"NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","loai":"Giảng","dur":3,"content":["3 lý do","Giảm tải bền vững: chỉ khi cấp dưới làm được, anh/chị mới thực sự rảnh tay cho việc tầng cao","Giữ nhịp ổn định: đội ngũ vững thì nhịp điều hành (CĐ2a) mới chạy được khi mình vắng","Phục vụ KH tốt hơn: chất lượng thực thi của nhân viên là cái khách hàng cảm nhận trực tiếp"],"loithoai":"Vì sao phát triển người không phải việc của riêng phòng đào tạo, mà là việc của chính người quản lý tuyến đầu? Ba lý do gắn chặt với những gì ta đã học. Một, giảm tải bền vững: ở Chuyên đề 2a ta nói về phân tầng công việc, giao việc tầng thấp đi; nhưng giao cho người chưa làm được thì không yên tâm, lại phải ôm. Chỉ khi cấp dưới thực sự làm được, việc giao đi mới bền — và muốn họ làm được thì phải huấn luyện. Hai, giữ nhịp ổn định: nhịp điều hành ở Chuyên đề 2a chỉ chạy được khi mình vắng nếu đội ngũ đủ vững để tự vận hành; đội ngũ vững là kết quả của huấn luyện, kèm cặp. Ba, phục vụ khách hàng tốt hơn: khách hàng không gặp anh/chị, họ gặp nhân viên của anh/chị — người trực tiếp khảo sát, xử lý sự cố, trả lời thắc mắc. Chất lượng thực thi của từng nhân viên chính là cái khách hàng cảm nhận. Nâng năng lực đội ngũ là nâng trực tiếp trải nghiệm khách hàng. Vậy nên phát triển con người không tách rời điều hành — nó là một trong bốn trục năng lực mà ta đã nêu ở Chuyên đề 2a.","hoatdong":"","callouts":[],"tables":[]},{"n":6,"title":"NGƯỜI QUẢN LÝ LÀ \"NGƯỜI LÀM VƯỜN\", KHÔNG PHẢI \"NGƯỜI THỢ\"","part":"NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","loai":"Demo","dur":3,"content":["phép so sánh","Người thợ: tự tay làm mọi sản phẩm → giỏi đến đâu cũng giới hạn ở sức một người","Người làm vườn: tạo điều kiện để cây tự lớn → kết quả nhân lên qua cả khu vườn","Liên hệ: vai trò quản lý là tạo điều kiện cho đội ngũ phát triển, không phải tự làm thay tất cả"],"loithoai":"Cho một hình ảnh dễ nhớ về sự chuyển vai này. Khi còn là nhân viên giỏi, anh/chị giống một người thợ lành nghề: tự tay làm ra sản phẩm tốt, và càng giỏi thì sản phẩm càng nhiều, càng đẹp. Nhưng dù giỏi đến mấy, năng lực của một người thợ vẫn giới hạn ở sức của một đôi tay. Khi trở thành người quản lý, vai trò thay đổi: anh/chị giống một người làm vườn hơn. Người làm vườn không tự mình mọc ra từng cái cây; họ tạo điều kiện — đất tốt, nước đủ, ánh sáng, tỉa cành đúng lúc — để cả khu vườn cùng lớn. Kết quả không còn giới hạn ở sức một người mà nhân lên qua cả đội ngũ. Nhiều người quản lý mới đề bạt vẫn giữ tư duy người thợ: thấy việc là nhảy vào làm, vì làm thì quen tay và yên tâm. Nhưng nếu cứ làm thợ trong vai người làm vườn thì khu vườn không bao giờ lớn, và bản thân thì kiệt sức. Chuyển từ tư duy người thợ sang tư duy người làm vườn — đó là bản chất của việc phát triển con người.","hoatdong":"","callouts":[],"tables":[]},{"n":7,"title":"TỰ NHẬN DIỆN: TUẦN VỪA RỒI ANH/CHỊ DÙNG HÌNH THỨC NÀO NHIỀU NHẤT?","part":"NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","loai":"Giảng","dur":3,"content":[],"loithoai":"Trước khi đi sâu vào bốn hình thức, tôi mời anh/chị làm một việc nhỏ để tự nhận diện. Hãy nghĩ về tuần vừa rồi và ước lượng: anh/chị đã nhắc việc bao nhiêu lần — kiểu \"phiếu kia xong chưa\", \"nhớ làm việc nọ\"? Đã chỉ việc bao nhiêu lần — hướng dẫn cụ thể cách làm một việc? Đã huấn luyện bao nhiêu lần — dành thời gian giúp nhân viên giỏi lên ở một kỹ năng? Và kèm cặp bao nhiêu lần — đồng hành nhiều buổi để một người trưởng thành rõ rệt? Cứ ghi con số ước lượng ra giấy. Tôi đoán phần lớn anh/chị sẽ thấy: nhắc việc và chỉ việc rất nhiều, còn huấn luyện và kèm cặp thì ít, thậm chí gần như không. Điều này hoàn toàn bình thường và rất phổ biến, vì nhắc việc thì nhanh và dễ. Nhưng đây chính là gốc của vòng xoáy ôm việc: càng nhắc nhiều thì đội ngũ càng phụ thuộc. Mục tiêu của chuyên đề là giúp anh/chị dịch chuyển — giảm dần nhắc việc bằng cách tăng huấn luyện và kèm cặp. Con số anh/chị vừa ghi là điểm xuất phát; cuối khóa chúng ta sẽ quay lại nhìn nó.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Hình thức","Số lần/tuần (tự ghi)"],["Nhắc việc","____ lần"],["Chỉ việc","____ lần"],["Huấn luyện","____ lần"],["Kèm cặp","____ lần"],["Câu hỏi: Phần lớn thời gian của anh/chị đang ở \"nhắc việc\" hay ở \"huấn luyện – kèm cặp\"?",""]]}]},{"n":8,"title":"ĐÚC KẾT NỘI DUNG 1","part":"NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","loai":"Giảng","dur":3,"content":["Người quản lý giỏi = đạt kết quả qua đội ngũ, không phải tự làm tất cả","Phát triển người là một phần của điều hành — giảm tải bền vững, giữ nhịp, phục vụ KH tốt hơn","Vòng xoáy ôm việc chỉ thoát được bằng đầu tư vào con người"],"loithoai":"Đúc kết Nội dung 1. Ba điều cần mang theo. Một: người quản lý giỏi không phải người tự làm tất cả, mà là người đạt kết quả thông qua đội ngũ — chuyển từ tư duy người thợ sang tư duy người làm vườn. Hai: phát triển con người không phải việc làm thêm hay việc của riêng phòng đào tạo, mà là một phần cốt lõi của điều hành — nó giúp giảm tải bền vững, giữ nhịp điều hành ổn định, và phục vụ khách hàng tốt hơn. Ba: cái vòng xoáy ôm việc khiến anh/chị mãi bận rộn chỉ có một lối thoát — dừng lại và đầu tư vào con người, chấp nhận tốn thêm thời gian lúc đầu để nhẹ gánh về sau. Bây giờ, để việc đầu tư đó hiệu quả, anh/chị cần một công cụ tư duy: phân biệt cho đúng bốn hình thức can thiệp — nhắc việc, chỉ việc, huấn luyện, kèm cặp. Vì nếu cứ nhầm cái này với cái kia thì tốn sức mà đội ngũ vẫn không lớn lên. Đó là Nội dung 2.\n\nNỘI DUNG 2: Phân biệt: nhắc việc – chỉ việc – huấn luyện – kèm cặp\n\nBốn hình thức, bốn mục đích, bốn thời điểm dùng\n\nNội dung 2 là phần công cụ tư duy quan trọng nhất của chuyên đề: phân biệt bốn hình thức can thiệp. Nghe thì đơn giản, nhưng phần lớn người quản lý dùng lẫn lộn — và đó là lý do bỏ nhiều công sức mà đội ngũ vẫn không tiến bộ. Nắm rõ bốn cái này, anh/chị sẽ biết khi nào dùng cái gì.","hoatdong":"","callouts":["Muốn phát triển người hiệu quả, trước hết phải phân biệt đúng 4 hình thức can thiệp."],"tables":[]},{"n":9,"title":"BỐN HÌNH THỨC: NHÌN TỔNG QUAN","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Giảng","dur":3,"content":["Nhắc việc (1–2 phút) — nhắc lại điều đã giao","Chỉ việc (5–10 phút) — hướng dẫn cách làm cụ thể","Huấn luyện (10–20 phút, bám việc thật) — phát triển kỹ năng qua việc thật","Kèm cặp (nhiều lần, 2–4 tuần) — đồng hành dài hạn nâng năng lực toàn diện","Mũi tên: mức can thiệp & giá trị phát triển tăng dần từ trái sang phải"],"loithoai":"Bốn hình thức xếp theo thang tăng dần về mức độ đầu tư và giá trị phát triển. Đầu tiên, nhắc việc: ngắn nhất, một hai phút, chỉ là nhắc lại điều đã giao — \"phiếu kia xong chưa\", \"nhớ nộp báo cáo\". Thứ hai, chỉ việc: dài hơn, năm tới mười phút, hướng dẫn cụ thể cách làm một việc nhân viên chưa biết. Thứ ba, huấn luyện: mười tới hai mươi phút, nhưng khác về bản chất — không phải chỉ cách làm mà là phát triển kỹ năng qua việc thật, để nhân viên giỏi lên chứ không chỉ làm xong. Thứ tư, kèm cặp: dài nhất, nhiều buổi trong hai tới bốn tuần, đồng hành để một người trưởng thành toàn diện. Càng sang phải, thời gian đầu tư càng lớn nhưng giá trị phát triển càng cao và càng bền. Một sai lầm phổ biến tôi muốn nêu sớm: nhiều người dành chín mươi phần trăm thời gian ở hai cột bên trái — nhắc và chỉ — và gần như bỏ trống hai cột bên phải. Mà chính hai cột bên phải mới làm đội ngũ thực sự lớn lên. Ta sẽ xem chi tiết từng cái.","hoatdong":"","callouts":[],"tables":[]},{"n":10,"title":"BẢNG PHÂN BIỆT CHI TIẾT","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Giảng","dur":3,"content":[],"loithoai":"Đây là bảng cốt lõi của Nội dung 2 — tôi đề nghị anh/chị chụp lại hoặc ghi ra. Bốn hình thức khác nhau ở bốn tiêu chí. Về bản chất: nhắc việc là nhắc lại điều đã giao; chỉ việc là hướng dẫn cách làm một lần; huấn luyện là phát triển kỹ năng qua việc thật; kèm cặp là đồng hành dài hạn để nâng năng lực. Về thời điểm dùng: nhắc khi nhân viên quên hoặc chưa xong; chỉ khi họ chưa biết cách; huấn luyện khi họ đã biết cơ bản nhưng cần nâng cấp; kèm cặp khi cần phát triển toàn diện một người. Về ai chủ động — đây là điểm tinh tế nhất: nhắc việc thì quản lý hỏi nhân viên trả lời; chỉ việc thì quản lý nói nhân viên nghe; nhưng huấn luyện là hai chiều — quản lý đặt câu hỏi để nhân viên tự tìm ra, chứ không nói luôn đáp án; còn kèm cặp thì nhân viên ngày càng chủ động hơn. Về kết quả: nhắc thì nhân viên nhớ và làm; chỉ thì họ biết làm việc này; huấn luyện thì họ giỏi hơn ở kỹ năng; kèm cặp thì họ trưởng thành rõ rệt. Nhìn cả bảng, anh/chị thấy: hai cột phải đòi hỏi nhân viên tự suy nghĩ — và đó là lý do chúng tạo ra sự phát triển thật.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Tiêu chí","Nhắc việc"],["Chỉ việc","Huấn luyện"],["Kèm cặp","Bản chất"],["Nhắc lại điều đã giao","Hướng dẫn cách làm"],["Phát triển kỹ năng qua việc thật","Đồng hành dài hạn nâng NL"],["Khi nào dùng","NV quên/chưa xong"],["NV chưa biết cách","NV biết cơ bản, cần nâng cấp"],["NV cần phát triển toàn diện","Ai chủ động"],["QL hỏi, NV trả lời","QL nói, NV nghe"],["Hai chiều (QL hỏi + NV tự tìm)","NV dần chủ động hơn"],["Kết quả","NV nhớ và làm"],["NV biết cách làm việc này","NV giỏi hơn ở kỹ năng này"],["NV trưởng thành rõ rệt",""]]}]},{"n":11,"title":"VÍ DỤ CÙNG MỘT VIỆC, BỐN CÁCH CAN THIỆP (TẠI ĐIỆN LỰC)","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Demo","dur":4,"content":["Nhắc việc: \"Phiếu khảo sát 123 xong chưa?\"","Chỉ việc: \"Phiếu cấp điện làm theo 4 bước này…\"","Huấn luyện: \"Em thử tự lập phương án khảo sát, rồi tôi góp ý\"","Kèm cặp: \"30 ngày tới, mỗi tuần em chủ trì 1 ca khảo sát, tôi quan sát và phản hồi\""],"loithoai":"Để thấy rõ khác biệt, ta lấy đúng một việc — khảo sát cấp điện — và xem bốn cách can thiệp. Nhắc việc: \"Phiếu khảo sát số 123 xong chưa em?\" — chỉ kiểm tra tiến độ, không thêm năng lực gì. Chỉ việc: \"Phiếu cấp điện em làm theo bốn bước này: bước một…, bước hai…\" — hướng dẫn cách làm, nhân viên biết làm việc cụ thể này, nhưng gặp việc khác lại phải hỏi tiếp. Huấn luyện: \"Em thử tự lập phương án khảo sát cho ca này đi, làm xong tôi góp ý\" — ở đây anh/chị không chỉ cách, mà để nhân viên tự làm rồi mới góp ý; cách này buộc họ tư duy, và năng lực thật sự tăng lên. Kèm cặp: \"Ba mươi ngày tới, mỗi tuần em chủ trì một ca khảo sát, tôi đi cùng quan sát và phản hồi sau mỗi ca\" — đây là đồng hành dài hạn, sau một tháng nhân viên không chỉ giỏi khảo sát mà còn tự tin chủ trì. Cùng một việc, bốn mức đầu tư, bốn kết quả khác hẳn. Mấu chốt anh/chị cần nhớ: nhắc và chỉ giải quyết việc hôm nay; huấn luyện và kèm cặp xây năng lực cho ngày mai.","hoatdong":"","callouts":[],"tables":[]},{"n":12,"title":"BỐN NHẦM LẪN THƯỜNG GẶP","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Giảng","dur":4,"content":[],"loithoai":"Có bốn nhầm lẫn rất phổ biến khiến người quản lý tưởng mình đang phát triển đội ngũ nhưng thực ra không. Nhầm lẫn một: \"tôi giao việc rồi nhắc lại liên tục, thế là huấn luyện rồi còn gì\". Không — nhắc lại chỉ là kiểm tra tiến độ, hoàn toàn không nâng kỹ năng; nhân viên bị nhắc mười lần vẫn không giỏi hơn. Nhầm lẫn hai: \"tôi chỉ cách làm rất kỹ, từng li từng tí, vậy là kèm cặp\". Không — chỉ việc dù kỹ đến đâu cũng chỉ là hướng dẫn một lần; kèm cặp là đồng hành nhiều lần, theo dõi tiến bộ qua thời gian. Nhầm lẫn ba: \"nhân viên bận tối mặt, lấy đâu thời gian mà huấn luyện\". Đây là hiểu lầm tai hại nhất: huấn luyện không phải tách ra một buổi học riêng, mà diễn ra ngay trong công việc — chỉ cần mười phút bám một việc thật. Nhầm lẫn bốn: \"nhân viên này kinh nghiệm lâu năm rồi, không cần huấn luyện\". Cẩn thận — kinh nghiệm không đồng nghĩa làm đúng; người làm lâu thường có thói quen cũ cần chuẩn hóa, và đôi khi họ là người khó huấn luyện nhất vì nghĩ mình đã biết hết. Nhận diện bốn nhầm lẫn này giúp anh/chị không tự ru ngủ rằng mình đang phát triển đội ngũ trong khi thực tế không.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nhầm lẫn","Thực tế"],["\"Giao việc rồi nhắc lại = huấn luyện\"","Nhắc là kiểm tra tiến độ; huấn luyện là nâng kỹ năng"],["\"Chỉ cách làm kỹ = kèm cặp\"","Chỉ việc = hướng dẫn 1 lần; kèm cặp = đồng hành nhiều lần"],["\"NV bận, không có thời gian huấn luyện\"","Huấn luyện TRONG công việc — chỉ cần 10p bám việc thật"],["\"NV có kinh nghiệm rồi, không cần\"","Kinh nghiệm ≠ làm đúng; nhiều thói quen cũ cần chuẩn hóa"]]}]},{"n":13,"title":"NGUYÊN TẮC VÀNG: GIẢM NHẮC VIỆC BẰNG CÁCH TĂNG HUẤN LUYỆN","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Giảng","dur":4,"content":["Hiện trạng phổ biến: 80% nhắc + chỉ / 20% huấn luyện + kèm cặp","Mục tiêu: dịch dần sang nhiều huấn luyện + kèm cặp hơn","Logic: mỗi lần huấn luyện đúng → bớt nhiều lần nhắc về sau"],"loithoai":"Từ bảng phân biệt, rút ra một nguyên tắc vàng cho việc phát triển người: giảm nhắc việc bằng cách tăng huấn luyện. Hiện trạng phổ biến mà anh/chị vừa tự nhận diện ở slide trước: khoảng tám mươi phần trăm thời gian nằm ở nhắc và chỉ, chỉ hai mươi phần trăm cho huấn luyện và kèm cặp. Mục tiêu không phải đảo ngược ngay lập tức — điều đó không thực tế — mà là dịch dần cán cân sang phải. Logic đằng sau rất quan trọng: mỗi lần huấn luyện đúng một việc sẽ xóa bỏ nhiều lần phải nhắc việc đó về sau. Ví dụ, thay vì mỗi tuần nhắc nhân viên \"nhớ kiểm tra đủ thông tin khảo sát\", anh/chị huấn luyện một lần cho họ hiểu vì sao và làm thế nào — từ đó họ tự làm đúng, không cần nhắc nữa. Nói cách khác: nhắc việc là xử lý triệu chứng, cứ tái đi tái lại; huấn luyện là xử lý gốc rễ, giải quyết một lần cho nhiều lần. Người quản lý khôn ngoan đầu tư vào gốc rễ. Và công cụ để huấn luyện đúng — ngắn gọn, ngay tại hiện trường — chính là OJT, nội dung tiếp theo.","hoatdong":"","callouts":["Nhắc việc xử lý triệu chứng; huấn luyện xử lý gốc rễ."],"tables":[]},{"n":14,"title":"ĐÚC KẾT NỘI DUNG 2","part":"NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","loai":"Giảng","dur":4,"content":["4 hình thức: nhắc việc – chỉ việc – huấn luyện – kèm cặp (mức đầu tư & giá trị tăng dần)","Nhắc & chỉ giải quyết việc hôm nay; huấn luyện & kèm cặp xây năng lực ngày mai","Tránh 4 nhầm lẫn; nguyên tắc vàng: giảm nhắc bằng cách tăng huấn luyện"],"loithoai":"Đúc kết Nội dung 2. Bốn hình thức can thiệp xếp theo mức đầu tư và giá trị tăng dần: nhắc việc, chỉ việc, huấn luyện, kèm cặp. Hai cái đầu — nhắc và chỉ — giải quyết việc hôm nay; hai cái sau — huấn luyện và kèm cặp — xây năng lực cho ngày mai, và đó mới là cái làm đội ngũ thật sự lớn lên. Anh/chị cần tránh bốn nhầm lẫn phổ biến khiến mình tưởng đang phát triển người mà thực ra không. Và nguyên tắc vàng để dịch chuyển: giảm nhắc việc bằng cách tăng huấn luyện, vì huấn luyện xử lý gốc rễ còn nhắc chỉ xử lý triệu chứng. Bây giờ câu hỏi thực hành là: huấn luyện ngay trong công việc, ngay tại hiện trường thì làm cụ thể thế nào, trong mười phút? Câu trả lời là một phương pháp rất gọn và hiệu quả — OJT bốn bước. Đó là Nội dung 3.\n\nNỘI DUNG 3: OJT tại hiện trường & kỹ thuật phản hồi tại chỗ\n\nCông thức OJT 4 bước · Kỹ thuật phản hồi SBI · Phản hồi không làm mất động lực\n\nNội dung 3 là phần kỹ thuật cốt lõi nhất của chuyên đề: phương pháp huấn luyện tại hiện trường — gọi là OJT, viết tắt của \"huấn luyện trong công việc\" — và kỹ thuật phản hồi tại chỗ. Đây là hai công cụ anh/chị dùng được ngay ngày mai, ngay trên hiện trường, mỗi lần chỉ mất mươi phút.","hoatdong":"","callouts":["Giờ học công cụ huấn luyện cụ thể — OJT 4 bước tại hiện trường."],"tables":[]},{"n":15,"title":"OJT LÀ GÌ — HUẤN LUYỆN NGAY TRONG VIỆC THẬT","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Giảng","dur":4,"content":["OJT (On-the-Job Training): huấn luyện ngay trong lúc làm việc thật, tại hiện trường","Khác lớp học: không tách khỏi công việc, không cần giáo trình — dùng chính việc đang làm","3 ưu điểm: bám sát thực tế · tiết kiệm thời gian · nhân viên nhớ lâu vì làm thật","Phù hợp đặc thù Điện lực: công việc hiện trường, áp lực tiến độ, ít thời gian học tập trung"],"loithoai":"Trước hết, OJT là gì. OJT là cụm từ chỉ việc huấn luyện ngay trong lúc làm việc thật, tại hiện trường, dùng chính công việc đang diễn ra làm bài học. Nó khác hẳn hình thức lớp học: không cần tách nhân viên ra một buổi riêng, không cần giáo trình, không cần phòng học — bài học chính là việc họ đang làm. Ba ưu điểm khiến OJT đặc biệt phù hợp với ngành ta. Một, bám sát thực tế: học đúng cái sẽ làm, không lý thuyết suông. Hai, tiết kiệm thời gian: không mất buổi học riêng, lồng vào công việc sẵn có. Ba, nhân viên nhớ lâu: vì học bằng cách làm thật, trải nghiệm trực tiếp ghi nhớ sâu hơn nghe giảng nhiều lần. Với đặc thù Điện lực — công việc chủ yếu ở hiện trường, áp lực tiến độ cao, khó có thời gian học tập trung — thì OJT gần như là cách huấn luyện khả thi nhất. Và tin tốt là nó có một công thức rất gọn, chỉ bốn bước, ai cũng làm được. Ta xem ngay.","hoatdong":"","callouts":[],"tables":[]},{"n":16,"title":"CÔNG THỨC OJT 4 BƯỚC: QUAN SÁT → HỎI → CHỈNH → CHỐT","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Giảng","dur":4,"content":["4 bước (icon tròn, mũi tên)","1. QUAN SÁT — xem NV làm thật, KHÔNG can thiệp ngay; ghi nhận điểm tốt & chưa tốt","2. HỎI — \"Em thấy thế nào? Có gì cần cải thiện?\"; để NV tự nhận ra trước","3. CHỈNH — chỉ 1–2 điểm cụ thể + cách đúng (không quá 2 điểm/lần)","4. CHỐT — chốt bài học + HẸN kiểm tra lại (không chốt = không thay đổi)"],"loithoai":"Đây là công thức OJT bốn bước — xin anh/chị thuộc bốn động từ này: quan sát, hỏi, chỉnh, chốt. Bước một, quan sát: để nhân viên làm việc thật và anh/chị quan sát, mấu chốt là không can thiệp ngay khi thấy sai; cứ im lặng quan sát, ghi nhận cả điểm tốt lẫn điểm chưa tốt. Nhiều người quản lý hỏng ngay bước này vì thấy sai là nhảy vào sửa liền — làm vậy nhân viên không bao giờ tự trưởng thành. Bước hai, hỏi: sau khi nhân viên làm xong, đừng vội nhận xét, hãy hỏi \"em thấy thế nào, có gì cần cải thiện không\"; để họ tự nhận ra trước, vì cái họ tự nhận ra sẽ nhớ lâu hơn nhiều cái mình nói cho. Bước ba, chỉnh: chỉ ra một đến hai điểm cụ thể cần cải thiện kèm cách làm đúng — và nhớ, không quá hai điểm một lần, vì nói nhiều thì nhân viên không nhớ nổi, rối thêm. Bước bốn, chốt: chốt lại bài học thành một câu rõ ràng và hẹn ngày kiểm tra lại; đây là bước hay bị bỏ qua nhất nhưng quan trọng nhất — không chốt thì không có thay đổi, lần sau đâu lại vào đấy. Bốn bước, mười phút, làm ngay trên hiện trường.","hoatdong":"","callouts":[],"tables":[]},{"n":17,"title":"VÍ DỤ OJT TẠI HIỆN TRƯỜNG: KHẢO SÁT CẤP ĐIỆN","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Demo","dur":4,"content":["4 bước áp vào tình huống thật","Quan sát: đi cùng NV tổ KT khảo sát; quan sát cách ghi nhận hiện trường (ảnh, đo khoảng cách, vị trí cột)","Hỏi: \"Em thấy phiếu khảo sát vừa rồi đã đủ thông tin cho tổ thi công chưa?\"","Chỉnh: \"Lần sau bổ sung: ảnh kèm GPS + khoảng cách đến nhà KH + vật cản trên tuyến — vì thiếu thì tổ thi công phải quay lại, mất thêm 1 ngày\"","Chốt: \"Vậy từ nay: khảo sát = ảnh GPS + khoảng cách + vật cản. Tuần sau tôi xem phiếu của em.\""],"loithoai":"Cho thật cụ thể, ta áp OJT bốn bước vào một việc rất quen — khảo sát cấp điện mới. Bước quan sát: Trưởng Điện lực đi cùng nhân viên tổ kỹ thuật ra hiện trường, quan sát cách họ ghi nhận: chụp ảnh thế nào, đo khoảng cách ra sao, ghi vị trí cột thế nào — chưa nói gì, chỉ quan sát. Bước hỏi: sau khi nhân viên làm xong phiếu, hỏi \"em thấy phiếu khảo sát vừa rồi đã đủ thông tin cho tổ thi công chưa?\"; có thể nhân viên tự nhận ra thiếu, có thể chưa — cả hai đều ổn. Bước chỉnh: chỉ rõ một vài điểm cụ thể — \"lần sau em bổ sung ba thứ: ảnh phải kèm tọa độ GPS, ghi khoảng cách đến nhà khách hàng, và đánh dấu vật cản trên tuyến\"; và quan trọng là giải thích lý do — \"vì nếu thiếu, tổ thi công phải quay lại đo, mất thêm một ngày, khách hàng chờ lâu hơn\". Lý do làm nhân viên hiểu chứ không chỉ làm theo. Bước chốt: chốt thành câu dễ nhớ — \"vậy từ nay khảo sát là ba thứ: ảnh GPS, khoảng cách, vật cản\" — và hẹn kiểm tra: \"tuần sau tôi xem phiếu của em\". Mười phút, đúng quy trình bốn bước, và nhân viên tiến bộ thật.","hoatdong":"","callouts":[],"tables":[]},{"n":18,"title":"KỸ THUẬT PHẢN HỒI TẠI CHỖ: SBI","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Demo","dur":4,"content":["mô hình SBI 3 phần","S – Tình huống (Situation): nêu rõ bối cảnh, thời điểm cụ thể","B – Hành vi (Behavior): mô tả hành vi quan sát được, KHÔNG phán xét con người","I – Tác động (Impact): chỉ ra hệ quả của hành vi đó","Ví dụ: \"Sáng nay khi khảo sát (S), em chưa ghi tọa độ GPS vào phiếu (B), nên tổ thi công không định vị được, phải gọi lại hỏi (I).\""],"loithoai":"Trong bốn bước OJT, bước \"chỉnh\" — tức phản hồi — là chỗ khó nhất, vì phản hồi sai cách dễ làm nhân viên tự ái, mất động lực. Có một kỹ thuật rất gọn giúp phản hồi vừa rõ vừa không gây tổn thương, gọi là SBI, ba phần. S là tình huống: nêu rõ bối cảnh và thời điểm cụ thể, không nói chung chung — \"sáng nay khi đi khảo sát ở khu vực X\". B là hành vi: mô tả đúng hành vi quan sát được, và đây là điểm mấu chốt — nói về hành vi, không phán xét con người; nói \"em chưa ghi tọa độ GPS vào phiếu\" chứ không nói \"em làm ăn cẩu thả\". Một bên là việc có thể sửa, một bên là gán nhãn nhân cách khiến người ta phòng thủ. I là tác động: chỉ ra hệ quả cụ thể của hành vi đó — \"nên tổ thi công không định vị được, phải gọi lại hỏi, mất thời gian\". Khi nhân viên hiểu hành vi của mình gây ra hệ quả gì, họ tự thấy cần sửa, không cần anh/chị phải gay gắt. Ghép lại: \"Sáng nay khi khảo sát, em chưa ghi tọa độ GPS vào phiếu, nên tổ thi công không định vị được, phải gọi lại hỏi.\" Ngắn, rõ, đúng việc, không đụng đến con người. Đó là cách phản hồi để sửa được sai mà vẫn giữ được người.","hoatdong":"","callouts":[],"tables":[]},{"n":19,"title":"PHẢN HỒI KHÔNG LÀM MẤT ĐỘNG LỰC: 4 LƯU Ý","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Giảng","dur":4,"content":["Đúng lúc: phản hồi gần thời điểm sự việc, đừng để dồn nhiều việc rồi \"tính sổ\"","Riêng tư khi chê, công khai khi khen: chê chỗ đông người làm mất mặt, phản tác dụng","Cân bằng: ghi nhận điểm tốt trước, rồi mới đến điểm cần cải thiện","Tập trung hành vi, không tấn công con người: \"việc này chưa đúng\" ≠ \"em kém\""],"loithoai":"Bổ sung cho kỹ thuật SBI, đây là bốn lưu ý để phản hồi sửa được sai mà không dập tắt động lực — vì một nhân viên mất động lực còn tệ hơn một nhân viên mắc lỗi. Lưu ý một, đúng lúc: phản hồi gần thời điểm sự việc xảy ra, đừng tích nhiều việc rồi một hôm gọi lên \"tính sổ\" cả loạt — vừa khiến nhân viên choáng ngợp, vừa mất tính thời sự. Lưu ý hai, riêng tư khi chê, công khai khi khen: nhắc nhở chỗ đông người làm nhân viên mất mặt, dù anh/chị nói đúng họ vẫn phản ứng tiêu cực; ngược lại, ghi nhận trước tập thể lại nhân đôi giá trị. Lưu ý ba, cân bằng: nêu điểm tốt trước rồi mới đến điểm cần cải thiện — không phải để xã giao, mà vì người ta tiếp nhận góp ý dễ hơn khi thấy nỗ lực của mình được nhìn nhận. Lưu ý bốn, và quan trọng nhất: luôn tập trung vào hành vi, không tấn công con người — \"việc này em làm chưa đúng\" hoàn toàn khác \"em kém\". Một câu mở ra hướng sửa, một câu đóng lại và gây tổn thương. Bốn lưu ý này nghe đơn giản nhưng là ranh giới giữa phản hồi giúp người tiến bộ và phản hồi đẩy người ta xa mình.","hoatdong":"","callouts":[],"tables":[]},{"n":20,"title":"SAI LẦM THƯỜNG GẶP KHI PHẢN HỒI","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Giảng","dur":4,"content":[],"loithoai":"Ngược lại với cách làm đúng, đây là bốn sai lầm phổ biến khi phản hồi mà tôi tin nhiều anh/chị từng mắc. Sai lầm một: thấy sai là sửa ngay, không cho nhân viên cơ hội tự nghĩ; hệ quả là nhân viên mãi phụ thuộc, cứ chờ mình sửa; cách thay là bước hai của OJT — hỏi trước, để họ tự nhận ra. Sai lầm hai: chê chung chung kiểu \"làm chưa tốt\", \"cần cố gắng hơn\"; nhân viên nghe xong không biết phải sửa cái gì cụ thể; thay bằng SBI — chỉ rõ hành vi nào, hệ quả gì. Sai lầm ba: một lần phản hồi nói quá nhiều điểm, liệt kê cả tràng lỗi; nhân viên không nhớ nổi, về cơ bản là không sửa được gì; nguyên tắc là tối đa hai điểm mỗi lần. Sai lầm bốn: phản hồi xong rồi thôi, không hẹn kiểm tra lại; thế là lời phản hồi trôi đi, lần sau lỗi vẫn nguyên; luôn phải chốt và hẹn một ngày kiểm tra cụ thể. Bốn sai lầm này — nếu để ý — đều là vi phạm một trong bốn bước OJT hoặc kỹ thuật SBI. Nên anh/chị cứ bám chắc công thức, là tránh được phần lớn.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Sai lầm","Hệ quả"],["Thay bằng","Thấy sai sửa ngay, không cho NV tự nghĩ"],["NV mãi phụ thuộc, không trưởng thành","Hỏi trước (bước 2 OJT)"],["Chê chung chung \"làm chưa tốt\"","NV không biết sửa gì"],["SBI: cụ thể hành vi","Nói quá nhiều điểm một lần"],["NV không nhớ nổi","Tối đa 2 điểm/lần"],["Phản hồi nhưng không hẹn kiểm tra","Không có thay đổi"],["Luôn chốt + hẹn ngày",""]]}]},{"n":21,"title":"ĐÚC KẾT NỘI DUNG 3","part":"NỘI DUNG 3 · OJT tại hiện trường và kỹ thuật phản hồi tại chỗ","loai":"Giảng","dur":4,"content":["OJT = huấn luyện ngay trong việc thật, 4 bước: Quan sát → Hỏi → Chỉnh → Chốt","Phản hồi tại chỗ dùng SBI: Tình huống – Hành vi – Tác động (không phán xét con người)","4 lưu ý giữ động lực; tránh 4 sai lầm phản hồi"],"loithoai":"Đúc kết Nội dung 3 — phần kỹ thuật quan trọng nhất. Anh/chị giờ có hai công cụ dùng được ngay tại hiện trường. Một là OJT bốn bước: quan sát nhân viên làm thật mà không vội can thiệp, hỏi để họ tự nhận ra, chỉnh tối đa hai điểm kèm cách đúng, chốt bài học và hẹn kiểm tra. Hai là kỹ thuật phản hồi SBI: nêu tình huống, mô tả hành vi chứ không phán xét con người, chỉ ra tác động — cộng với bốn lưu ý để giữ động lực và tránh bốn sai lầm phổ biến. Đây là bộ kỹ năng nền: nắm vững OJT và SBI, anh/chị có thể huấn luyện gần như mọi việc tại đơn vị. Nhưng có một điều quan trọng: con người không giống nhau. Cùng một kỹ thuật, áp vào một nhân viên mới sẽ khác với một nhân viên kỳ cựu đang chán việc, khác với một người đang căng thẳng vì áp lực. Nên Nội dung 4 sẽ giúp anh/chị điều chỉnh cách huấn luyện và phản hồi cho phù hợp từng nhóm đối tượng nhân viên điển hình ở đơn vị.\n\nNỘI DUNG 4: Huấn luyện & phản hồi theo nhóm đối tượng nhân viên\n\n4 nhóm điển hình · Cách tiếp cận phù hợp từng nhóm\n\nNội dung 4 trả lời câu hỏi: cùng một bộ kỹ thuật OJT và SBI, làm sao áp dụng cho hiệu quả với những con người rất khác nhau trong đơn vị? Ta sẽ nhận diện bốn nhóm nhân viên điển hình và cách tiếp cận phù hợp cho từng nhóm.","hoatdong":"","callouts":["Cùng một kỹ thuật, nhưng phải điều chỉnh theo từng nhóm nhân viên."],"tables":[]},{"n":22,"title":"BỐN NHÓM NHÂN VIÊN ĐIỂN HÌNH","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Giảng","dur":4,"content":["Nhân viên mới — chưa thạo việc, cần hướng dẫn nền tảng","Nhân viên còn yếu — làm lâu nhưng chưa đạt, hoặc hay sai lặp lại","Nhân viên có tiềm năng — làm tốt, cần thử thách để phát triển thêm","Nhân viên đang căng thẳng / chậm thay đổi — áp lực cao hoặc ngại cái mới"],"loithoai":"Trong bất kỳ đơn vị nào, đội ngũ cũng gồm nhiều dạng người khác nhau, và tôi gom thành bốn nhóm điển hình để dễ tiếp cận. Nhóm một, nhân viên mới: chưa thạo việc, còn bỡ ngỡ, cần được hướng dẫn nền tảng và xây sự tự tin ban đầu. Nhóm hai, nhân viên còn yếu: có thể đã làm lâu nhưng chất lượng chưa đạt, hoặc hay mắc lỗi lặp đi lặp lại; nhóm này cần kiên nhẫn và cách tiếp cận đúng. Nhóm ba, nhân viên có tiềm năng: làm tốt rồi, nhưng nếu cứ giao việc quen thuộc mãi thì lãng phí và họ dễ chán; nhóm này cần thử thách để phát triển thêm. Nhóm bốn, nhân viên đang căng thẳng hoặc chậm thay đổi: có thể đang quá tải áp lực, hoặc là người làm lâu ngại cái mới. Bốn nhóm này cần bốn cách tiếp cận khác nhau. Sai lầm phổ biến là dùng một kiểu cho tất cả — ví dụ phản hồi gay gắt như nhau với cả người mới lẫn người căng thẳng — và kết quả là chỗ thì làm nhân viên sợ, chỗ thì không đủ thử thách. Ta xem cách điều chỉnh cho từng nhóm.","hoatdong":"","callouts":[],"tables":[]},{"n":23,"title":"NHÂN VIÊN MỚI & NHÂN VIÊN CÒN YẾU","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Demo","dur":4,"content":["2 cột","Nhân viên mới: thiên về chỉ việc + huấn luyện; chia nhỏ bước; ghi nhận tiến bộ sớm để tạo tự tin; kiên nhẫn, không kỳ vọng nhanh","Nhân viên còn yếu: tìm đúng gốc (thiếu kỹ năng hay thiếu động lực?); huấn luyện đúng điểm yếu cụ thể; theo dõi sát qua điểm kiểm tra ngắn; ghi nhận từng cải thiện nhỏ"],"loithoai":"Hai nhóm đầu cần nhiều đầu tư hướng dẫn. Với nhân viên mới: thiên về chỉ việc và huấn luyện, vì họ chưa có nền. Mấu chốt là chia nhỏ các bước — đừng dồn cả quy trình phức tạp một lúc, họ sẽ ngợp; và đặc biệt là ghi nhận tiến bộ sớm, khen những bước làm đúng đầu tiên để tạo sự tự tin, vì người mới rất dễ nản nếu chỉ nghe chê. Cần kiên nhẫn, đừng kỳ vọng họ nhanh bằng người cũ. Với nhân viên còn yếu: việc đầu tiên là tìm đúng gốc rễ — họ yếu vì thiếu kỹ năng, hay vì thiếu động lực? Hai nguyên nhân này cần hai cách xử lý hoàn toàn khác nhau; thiếu kỹ năng thì huấn luyện, thiếu động lực thì phải tìm hiểu nguyên nhân sâu hơn. Khi đã rõ gốc, huấn luyện đúng vào điểm yếu cụ thể chứ không huấn luyện chung chung. Theo dõi sát qua các điểm kiểm tra ngắn — không phải để giám sát mà để kịp thời hỗ trợ. Và rất quan trọng với nhóm này: ghi nhận từng cải thiện nhỏ, vì người yếu lâu ngày thường mất tự tin, một lời ghi nhận đúng lúc có thể tạo bước ngoặt. Lưu ý: đừng vội kết luận một người là \"yếu\" và bỏ mặc — nhiều khi chỉ là chưa được huấn luyện đúng cách.","hoatdong":"","callouts":[],"tables":[]},{"n":24,"title":"NHÂN VIÊN TIỀM NĂNG & NHÂN VIÊN CĂNG THẲNG","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Demo","dur":4,"content":["2 cột","Nhân viên có tiềm năng: thiên về kèm cặp + giao việc thử thách; trao quyền dần (cho chủ trì 1 ca, 1 đầu việc); hỏi nhiều hơn nói; chỉ ra lộ trình phát triển để giữ chân","Nhân viên căng thẳng / chậm thay đổi: lắng nghe trước khi huấn luyện; giảm tải hoặc gỡ rào cản nếu quá tải; thay đổi từng bước nhỏ; giải thích \"vì sao\" để giảm kháng cự"],"loithoai":"Hai nhóm sau cần cách tiếp cận tinh tế hơn. Với nhân viên có tiềm năng: đừng phí phạm họ ở việc quen thuộc. Thiên về kèm cặp và giao việc thử thách — trao quyền dần, cho họ chủ trì một ca, phụ trách một đầu việc có độ khó. Với nhóm này, hỏi nhiều hơn nói: họ đủ năng lực để tự tìm ra giải pháp, vai trò của anh/chị là đặt câu hỏi gợi mở và thử thách tư duy họ. Và rất quan trọng: chỉ cho họ thấy lộ trình phát triển phía trước, vì người có tiềm năng mà không thấy đường đi lên thì dễ rời đi tìm cơ hội khác; kèm cặp họ cũng là giữ chân họ. Với nhân viên đang căng thẳng hoặc chậm thay đổi: tuyệt đối không lao vào huấn luyện ngay. Lắng nghe trước — tìm hiểu họ đang vướng gì; nếu họ quá tải thì việc cần làm là giảm tải hoặc gỡ rào cản, chứ không phải thêm yêu cầu. Với người ngại thay đổi, đừng ép đổi tất cả cùng lúc; thay đổi từng bước nhỏ để họ không thấy bị đe dọa. Và luôn giải thích \"vì sao\" cần thay đổi — người ta kháng cự cái mới chủ yếu vì không hiểu lý do; hiểu rồi thì kháng cự giảm hẳn. Với nhóm này, sự thấu hiểu quan trọng hơn kỹ thuật.","hoatdong":"","callouts":[],"tables":[]},{"n":25,"title":"BẢNG TÓM TẮT: HÌNH THỨC PHÙ HỢP THEO NHÓM","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Giảng","dur":4,"content":[],"loithoai":"Tôi tổng hợp lại thành một bảng để anh/chị dễ tra cứu khi về đơn vị. Nhân viên mới: hình thức chính là chỉ việc cộng huấn luyện; lưu ý quan trọng nhất là chia nhỏ bước và ghi nhận tiến bộ sớm. Nhân viên còn yếu: hình thức chính là huấn luyện nhưng phải đúng gốc; lưu ý quan trọng nhất là tìm cho ra gốc rễ — yếu vì kỹ năng hay vì động lực. Nhân viên tiềm năng: hình thức chính là kèm cặp cộng giao việc thử thách; lưu ý quan trọng nhất là hỏi nhiều hơn nói và cho họ thấy lộ trình. Nhân viên căng thẳng hoặc chậm thay đổi: cách tiếp cận là lắng nghe trước, thay đổi từng bước; lưu ý quan trọng nhất là thấu hiểu trước khi áp dụng bất kỳ kỹ thuật nào. Anh/chị thấy điểm chung không: kỹ thuật OJT và SBI là nền, nhưng liều lượng và cách vào phải uốn theo từng người. Một người quản lý giỏi đọc đúng nhân viên trước mặt mình thuộc nhóm nào, rồi mới chọn cách. Đây chính là cái sẽ được rèn trong phần thực hành sắp tới.","hoatdong":"","callouts":[],"tables":[{"title":"Nội dung trình bày trên slide","rows":[["Nhóm","Hình thức chính"],["Lưu ý quan trọng nhất","Nhân viên mới"],["Chỉ việc + Huấn luyện","Chia nhỏ bước, ghi nhận sớm"],["Nhân viên còn yếu","Huấn luyện (đúng gốc)"],["Tìm gốc: kỹ năng hay động lực?","Nhân viên tiềm năng"],["Kèm cặp + giao thử thách","Hỏi nhiều hơn nói, chỉ lộ trình"],["NV căng thẳng / chậm đổi","Lắng nghe trước, đổi từng bước"],["Thấu hiểu trước kỹ thuật",""]]}]},{"n":26,"title":"TÌNH HUỐNG TỔNG HỢP: ĐỌC ĐÚNG NGƯỜI TRƯỚC KHI HUẤN LUYỆN","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Thực hành","dur":25,"content":["tình huống ngắn + cách xử lý","Tình huống: Một nhân viên kỳ cựu liên tục làm phiếu khảo sát thiếu thông tin dù đã được nhắc nhiều lần","Đọc người: không phải \"mới\" hay \"yếu kỹ năng\" — có thể là chậm thay đổi/quen làm theo cách cũ","Cách xử lý: lắng nghe vì sao họ giữ cách cũ → giải thích tác động đến tổ thi công & KH → đổi từng bước, chốt 1 thay đổi nhỏ trước","Bài học: cùng một lỗi, nguyên nhân khác nhau → cách huấn luyện khác nhau"],"loithoai":"Một tình huống tổng hợp để thấy vì sao đọc đúng người lại quyết định cách huấn luyện. Tình huống: có một nhân viên kỳ cựu, làm lâu năm, nhưng liên tục làm phiếu khảo sát thiếu thông tin, dù anh/chị đã nhắc nhiều lần. Phản xạ thông thường là nghĩ \"nhân viên này yếu\" và phản hồi gay gắt hơn. Nhưng hãy đọc người trước: một người làm lâu năm thì không phải thiếu kỹ năng cơ bản, và càng không phải nhân viên mới. Nhiều khả năng đây thuộc nhóm chậm thay đổi — họ quen làm theo cách cũ, thấy yêu cầu ghi GPS, vật cản là rườm rà, không thấy cần thiết. Nếu vậy, cách xử lý không phải là nhắc gắt hơn — đã nhắc nhiều lần không ăn thua. Cách đúng theo nhóm này: lắng nghe trước, hỏi vì sao họ vẫn giữ cách cũ — có khi họ có lý do, có khi chỉ là thói quen. Rồi giải thích tác động cụ thể: cách cũ khiến tổ thi công phải quay lại, khách hàng chờ thêm. Khi họ hiểu \"vì sao\", kháng cự giảm. Cuối cùng đổi từng bước, chốt một thay đổi nhỏ trước — ví dụ chỉ cần thêm GPS thôi — rồi mới tới cái tiếp theo. Bài học lớn: cùng một lỗi bề ngoài, nguyên nhân có thể rất khác nhau, và cách huấn luyện phải theo nguyên nhân chứ không theo triệu chứng.","hoatdong":"","callouts":[],"tables":[]},{"n":27,"title":"ĐÚC KẾT NỘI DUNG 4","part":"NỘI DUNG 4 · Huấn luyện và phản hồi theo nhóm đối tượng nhân viên","loai":"Thực hành","dur":20,"content":["4 nhóm nhân viên: mới – còn yếu – tiềm năng – căng thẳng/chậm đổi","Kỹ thuật OJT/SBI là nền; liều lượng & cách vào uốn theo từng nhóm","Nguyên tắc: đọc đúng người (nguyên nhân) trước khi chọn cách huấn luyện"],"loithoai":"Đúc kết Nội dung 4. Đội ngũ của anh/chị gồm bốn nhóm điển hình: nhân viên mới, nhân viên còn yếu, nhân viên có tiềm năng, và nhân viên đang căng thẳng hoặc chậm thay đổi. Bộ kỹ thuật OJT và SBI là nền chung cho tất cả, nhưng liều lượng và cách tiếp cận phải uốn theo từng nhóm: người mới cần chia nhỏ và động viên, người yếu cần tìm đúng gốc, người tiềm năng cần thử thách và lộ trình, người căng thẳng cần thấu hiểu trước. Nguyên tắc bao trùm: đọc đúng người — đúng nguyên nhân — trước khi chọn cách huấn luyện; cùng một lỗi bề ngoài có thể đến từ những gốc rễ khác nhau. Đến đây, anh/chị đã có đủ bộ công cụ: hiểu vai trò phát triển người, phân biệt bốn hình thức, nắm OJT và SBI, biết điều chỉnh theo nhóm. Nhưng kỹ năng huấn luyện không hình thành bằng nghe — mà bằng làm. Nên phần lớn thời gian còn lại, bảy mươi lăm phút, dành cho thực hành theo nhóm nhỏ. Đó là Nội dung 5.\n\nNỘI DUNG 5: Thực hành huấn luyện & phản hồi theo nhóm nhỏ\n\n75 phút · Đóng vai OJT · Phản hồi SBI · Xử lý theo nhóm đối tượng\n\nNội dung 5 là phần thực hành — trọng tâm của chuyên đề, với bảy mươi lăm phút theo nhóm nhỏ. Đây là lúc anh/chị biến lý thuyết OJT, SBI và cách tiếp cận theo nhóm thành kỹ năng thật qua đóng vai và phản hồi lẫn nhau.","hoatdong":"","callouts":["Giờ anh/chị thực hành trực tiếp — huấn luyện & phản hồi theo nhóm nhỏ."],"tables":[]},{"n":28,"title":"HỌC LIỆU VIDEO & QUY TRÌNH THỰC HÀNH","part":"NỘI DUNG 5 · Thực hành huấn luyện theo nhóm nhỏ","loai":"Thực hành","dur":20,"content":["Video (đóng vai, ≈4–5 phút): minh họa kỹ thuật phản hồi tại chỗ theo OJT 4 bước cho một tình huống hiện trường","4 điểm quan sát trong video: cách quan sát không vội can thiệp · cách hỏi để NV tự nhận ra · cách chỉnh tối đa 2 điểm · cách chốt + hẹn kiểm tra","Quy trình thực hành nhóm nhỏ (3 người/nhóm):","Vai 1: Người quản lý (huấn luyện theo OJT) · Vai 2: Nhân viên (theo nhóm đối tượng được giao) · Vai 3: Người quan sát (phản hồi theo SBI)","Mỗi tình huống ~10 phút → đổi vai → 3 lượt"],"loithoai":"Phần thực hành bắt đầu bằng một video đóng vai khoảng bốn đến năm phút, minh họa kỹ thuật phản hồi tại chỗ theo đúng OJT bốn bước cho một tình huống hiện trường cụ thể. Khi xem, anh/chị quan sát bốn điểm: người quản lý trong video quan sát thế nào mà không vội can thiệp; hỏi ra sao để nhân viên tự nhận ra vấn đề; chỉnh thế nào, có giữ đúng tối đa hai điểm không; và chốt ra sao, có hẹn kiểm tra lại không. Video là mẫu tham khảo, không phải khuôn duy nhất đúng. Sau video, ta vào thực hành theo nhóm ba người. Mỗi nhóm có ba vai luân phiên: vai một là người quản lý, thực hành huấn luyện theo OJT bốn bước; vai hai là nhân viên, đóng theo nhóm đối tượng được giao — ví dụ nhân viên mới, hoặc nhân viên kỳ cựu chậm thay đổi; vai ba là người quan sát, sau đó phản hồi cho \"người quản lý\" theo đúng kỹ thuật SBI. Mỗi tình huống khoảng mười phút, rồi đổi vai, ba lượt để ai cũng được làm cả ba vai. Cái hay của cách này: anh/chị vừa luyện huấn luyện, vừa luyện phản hồi, vừa trải nghiệm cảm giác của nhân viên khi được huấn luyện — góc nhìn rất quý.","hoatdong":"","callouts":[],"tables":[]},{"n":29,"title":"ĐÚC KẾT CHUYÊN ĐỀ","part":"NỘI DUNG 5 · Thực hành huấn luyện theo nhóm nhỏ","loai":"Đúc kết","dur":10,"content":["Tóm tắt hành trình: Vai trò phát triển người → 4 hình thức → OJT & SBI → theo nhóm đối tượng → thực hành","Nguyên tắc bao trùm (băng đỏ): \"Cấp dưới giỏi hơn — người quản lý nhẹ gánh hơn. Phát triển người là khoản đầu tư sinh lời.\"","Định hướng: kết quả nhìn lại tại hội thảo trực tuyến sau đào tạo","Tiếp theo: CĐ3b — Thực hành kèm cặp & xây dựng kế hoạch phát triển nhân viên (IDP)"],"loithoai":"Chúng ta khép lại Chuyên đề 3a. Nhìn lại hành trình: bắt đầu từ nhận thức vai trò phát triển con người của người quản lý và cái vòng xoáy ôm việc; học cách phân biệt rạch ròi bốn hình thức nhắc – chỉ – huấn luyện – kèm cặp; nắm hai công cụ kỹ thuật cốt lõi là OJT bốn bước và phản hồi SBI; biết điều chỉnh cách tiếp cận theo bốn nhóm nhân viên; và vừa thực hành trực tiếp qua đóng vai. Nguyên tắc bao trùm gói trong một câu: cấp dưới giỏi hơn thì người quản lý nhẹ gánh hơn — phát triển con người không phải gánh nặng mà là khoản đầu tư sinh lời cho chính anh/chị. Ghi vào phiếu thật cụ thể: nhân viên nào, kỹ năng gì, quan sát khi nào, hẹn kiểm tra ngày nào. Kết quả này sẽ được cùng nhìn lại tại hội thảo trực tuyến sau đào tạo. Và ở Chuyên đề 3b tiếp theo, ta đi sâu hơn: từ huấn luyện từng việc sang kèm cặp có cấu trúc và xây dựng kế hoạch phát triển nhân viên — gọi là IDP — cho cả đội ngũ tại đơn vị. Cảm ơn anh/chị.","hoatdong":"","callouts":[],"tables":[]}],"prep":["Phương pháp đào tạo, huấn luyện nhân viên qua công việc","Thời lượng: 90 phút lý thuyết + 75 phút thực hành theo nhóm nhỏ","Tài liệu chuẩn: 5. CĐ3a. Phương pháp đào tạo, huấn luyện nhân viên.docx","Chuẩn bị tình huống huấn luyện nhân viên, phiếu tự đánh giá và bài thực hành nhóm nhỏ.","Giữ cấu trúc card/bullet/bảng/callout để giảng viên đọc theo từng slide."],"prompts12":[],"checklist":[["Hạng mục","Cách kiểm tra"],["Đúng nguồn Word","Đối chiếu số slide, tiêu đề, nội dung, lời thoại"],["Đúng thiết kế","Giữ card, bullet, bảng, chip, callout"],["Đúng vận hành","Có route, build xanh, không lỗi mã hóa"]],"vung":[["Nhóm","Nội dung","Ghi chú"],["CĐ3a","Phương pháp đào tạo, huấn luyện nhân viên qua công việc","Theo file Word chuẩn"]],"andanh":[["Nguồn","Cách xử lý"],["5. CĐ3a. Phương pháp đào tạo, huấn luyện nhân viên.docx","Trích nội dung vào HTML, giữ file Word làm bản gốc"]],"tomtat":[],"mau4":[],"framework":[["Phần","Số slide","Mục tiêu học tập","Hoạt động chính","Sản phẩm đầu ra","Thời lượng"],["Mở đầu","3","Biết phát triển con người qua công việc thật và chọn đúng hình thức can thiệp.","Giảng ngắn, phân tích tình huống, demo OJT/phản hồi và thực hành nhóm nhỏ.","Một kịch bản huấn luyện hoặc phản hồi có thể dùng tại đơn vị.","9′"],["NỘI DUNG 1 · Vai trò phát triển con người của người quản lý","5","Biết phát triển con người qua công việc thật và chọn đúng hình thức can thiệp.","Giảng ngắn, phân tích tình huống, demo OJT/phản hồi và thực hành nhóm nhỏ.","Một kịch bản huấn luyện hoặc phản hồi có thể dùng tại đơn vị.","15′"],["NỘI DUNG 2 · Phân biệt nhắc việc, chỉ việc, huấn luyện và kèm cặp","6","Biết phát triển con người qua công việc thật và chọn đúng hình thức can thiệp.","Giảng ngắn, phân tích tình huống, demo OJT/phản hồi và thực hành nhóm nhỏ.","Một kịch bản huấn luyện hoặc phản hồi có thể dùng tại đơn vị.","22′"],["NỘI DU const ORIENTATION={"title": "CHUYÊN ĐỀ ĐỊNH HƯỚNG", "subtitle": "Nền tảng lãnh đạo và quản trị chuyên nghiệp trong bối cảnh mới", "duration": "Thời lượng: 45 phút", "sourceFile": "1. CĐ Định hướng.docx", "items": [{"type": "heading", "text": "1. Mục tiêu chuyên đề"}, {"type": "p", "text": "Sau chuyên đề, học viên có thể:"}, {"type": "p", "text": "Nhận diện ba chuyển biến lớn (tổ chức – chuyển đổi số – kỳ vọng khách hàng) đang tác động trực tiếp đến công việc điều hành hằng ngày;"}, {"type": "p", "text": "Phân biệt hai cách tiếp cận quản lý sự vụ và quản trị chuyên nghiệp qua các biểu hiện cụ thể;"}, {"type": "p", "text": "Tiếp cận ba trụ cột quản trị chuyên nghiệp — Mục tiêu, Dữ liệu, Con người — và năm định hướng năng lực của giai đoạn mới;"}, {"type": "p", "text": "Tự soi chiếu cách điều hành hiện tại của bản thân so với các định hướng đó;"}, {"type": "p", "text": "Định vị lộ trình toàn khóa, ba chủ đề chủ đạo và yêu cầu đầu ra để chuẩn bị tâm thế học tập."}, {"type": "heading", "text": "2. Khởi động: Một ngày của hai người quản lý (8 phút)"}, {"type": "p", "text": "Tương tác học viên với Mentimeter (Vevents 1)"}, {"type": "p", "text": "Giảng viên hỏi cả lớp (giơ tay hoặc Mentimeter): “Một ngày làm việc điển hình của anh/chị, bao nhiêu phần trăm thời gian dành cho việc phát sinh, chữa cháy?”"}, {"type": "p", "text": "A. Dưới 30%    B. 30–50%    C. 50–70%    D. Trên 70%"}, {"type": "p", "text": "Kết quả dự kiến: Giảng viên không bình luận đúng/sai, chỉ ghi nhận: “Chúng ta cùng giữ con số này trong đầu đến cuối buổi.”"}, {"type": "p", "text": "Kể chuyện đối chiếu: Anh A và Chị B"}, {"type": "p", "text": "Giảng viên phác họa nhanh hai nhân vật cùng quy mô đơn vị (~20 nhân viên), cùng năng lực, nhưng khác nhau ở cách tổ chức công việc:"}, {"type": "table", "rows": [["ANH A — điều hành theo sự vụ", "CHỊ B — điều hành theo hệ thống"], ["7h30: mở điện thoại — 20 tin nhắn, 10 email, trả lời từng cái.9h: có sự cố, tự xuống hiện trường vì không yên tâm giao ai.11h: tự cầm máy xử lý khiếu nại.Chiều họp: phát biểu bằng cảm nhận, chưa kịp chuẩn bị số liệu.19h mới về. Tận tâm, chịu khó — nhưng luôn quá tải.", "7h30: nhìn bảng chỉ số tuần.7h45: giao ban 15 phút — mỗi đầu mối báo 1 phút việc hôm nay, điểm cần chú ý.9h: sự cố — giao đầu mối phụ trách, chốt điểm báo lại 10h. Không phải xuống hiện trường.11h: xem lịch sử khách trên hệ thống, đưa chuyên viên trả lời theo kịch bản chuẩn.17h về đúng giờ. Hôm sau đơn vị vẫn chạy tốt."]]}, {"type": "p", "text": "Thông điệp giảng viên: “Khác biệt giữa Anh A và Chị B không nằm ở năng lực hay sự tận tâm — cả hai đều giỏi. Khác biệt nằm ở cách tổ chức công việc. Anh A giải quyết sự vụ; Chị B thiết kế hệ thống. Buổi học hôm nay trả lời câu hỏi: điều gì tạo nên khác biệt đó, và vì sao bối cảnh mới đòi hỏi cách làm của Chị B.”"}, {"type": "heading", "text": "3. Ba chuyển biến đang định hình lại công việc điều hành (9 phút)"}, {"type": "p", "text": "Giảng viên dẫn dắt: cách làm của Anh A từng rất hiệu quả — nhưng môi trường vận hành đã thay đổi. Có ba chuyển biến diễn ra đồng thời, và người quản lý cấp trung là người chịu tác động trực tiếp nhất."}, {"type": "table", "rows": [["Chuyển biến", "Biểu hiện", "Tác động lên người quản lý"], ["1. Tổ chức", "Mô hình quản lý 2 cấp; sắp xếp lại bộ máy; địa bàn rộng hơn, nhiều đầu mối phối hợp hơn.", "Khối lượng và độ phức tạp tăng — trí nhớ cá nhân không còn theo kịp."], ["2. Chuyển đổi số", "Các nền tảng nội bộ, hệ thống chuyên ngành, ứng dụng hiện trường và AI đi vào vận hành.", "Câu hỏi chuyển từ “có dữ liệu không” sang “có biết khai thác dữ liệu để ra quyết định không”."], ["3. Kỳ vọng khách hàng", "Khách so sánh trải nghiệm điện với ngân hàng, TMĐT, viễn thông; mạng xã hội lan tin nhanh.", "Đòi hỏi minh bạch, phản hồi nhanh, cam kết thời gian — TNKH thành thước đo điều hành."]]}, {"type": "p", "text": "Câu hỏi tương tác (hỏi và mời học viên phát biểu ngay tại lớp): “Trong ba chuyển biến này, chuyển biến nào đang gây áp lực lớn nhất cho đơn vị anh/chị lúc này?”; mời 2–3 học viên chia sẻ nhanh, không phân tích sâu."}, {"type": "p", "text": "Chốt: Ba chuyển biến không xảy ra tuần tự mà đồng thời. Hiểu bức tranh chung giúp anh/chị định vị áp lực hiện tại và chọn cách thích ứng — thay vì chỉ phản ứng với từng việc rời rạc."}, {"type": "heading", "text": "4. Từ quản lý sự vụ sang quản trị chuyên nghiệp (10 phút)"}, {"type": "p", "text": "Năm biểu hiện của quản lý sự vụ"}, {"type": "p", "text": "Giảng viên nêu nhanh năm biểu hiện, mời học viên thầm đối chiếu với bản thân:"}, {"type": "p", "text": "Ôm việc vì “không tin ai làm được”;"}, {"type": "p", "text": "Nhắc việc liên tục vì không có cơ chế tự kiểm tra;"}, {"type": "p", "text": "Chữa cháy liên tục vì không có phòng ngừa;"}, {"type": "p", "text": "Quyết định theo cảm tính vì không có dữ liệu đối chiếu;"}, {"type": "p", "text": "Không có gì để đối thoại với cấp trên ngoài báo cáo định tính."}, {"type": "p", "text": "Ba trụ cột của quản trị chuyên nghiệp"}, {"type": "table", "rows": [["Trụ cột", "Bản chất", "Ví dụ tại Điện lực"], ["MỤC TIÊU", "Mỗi việc trả lời: đạt kết quả gì? đo bằng gì? ai chịu trách nhiệm cuối cùng?", "“Giảm tỷ lệ khiếu nại lặp lại xuống dưới 2% trong quý”, có đầu mối, có thời hạn."], ["DỮ LIỆU", "Bằng chứng khách quan hỗ trợ quyết định hằng ngày, không phải báo cáo cuối tháng.", "Tra hệ thống KH: khiếu nại theo nguyên nhân, khu vực, nhân viên tiếp nhận."], ["CON NGƯỜI", "Con người vừa là nguồn lực vừa là mục đích; quyết định tốt vừa xong việc vừa phát triển người.", "Giao việc khó cho NV tiềm năng kèm hướng dẫn — việc xong, người trưởng thành."]]}, {"type": "p", "text": "Nhấn mạnh: ba trụ cột liên kết chặt. Có mục tiêu mà thiếu dữ liệu thì theo dõi thiếu căn cứ; có dữ liệu mà không đầu tư con người thì đội ngũ không đủ sức dùng dữ liệu; có đội ngũ giỏi mà thiếu mục tiêu thì công sức phân tán. Phải phát triển song song."}, {"type": "p", "text": "Thông điệp: Chuyển dịch tư duy không phủ định kinh nghiệm, quan hệ, sự tận tâm — những giá trị đó cần được giữ. Nó bổ sung thêm một tầng: hệ thống, cấu trúc, dữ liệu và tính bền vững, để những gì đã có phát huy tốt hơn trong bối cảnh mới."}, {"type": "heading", "text": "5. Năm định hướng năng lực & lộ trình toàn khóa (10 phút)"}, {"type": "p", "text": "Năm định hướng năng lực của giai đoạn mới"}, {"type": "p", "text": "Định hướng 1 — Điều hành có cơ chế song song với xử lý sự vụ — nhịp giao ban cố định, quy tắc đầu mối–thời hạn–báo lại, điểm kiểm tra giữa chu kỳ."}, {"type": "p", "text": "Định hướng 2 — Dùng dữ liệu hỗ trợ ra quyết định — đặt câu hỏi vào dữ liệu sẵn có; dữ liệu bổ sung cho trực giác, không thay thế."}, {"type": "p", "text": "Định hướng 3 — Phát triển đội ngũ song song hoàn thành công việc — giao việc gắn phát triển, phản hồi tại chỗ, huấn luyện qua công việc."}, {"type": "p", "text": "Định hướng 4 — Ứng dụng công cụ số và AI đúng vai trò — AI lo tác vụ hành chính lặp lại; thời gian tiết kiệm dành cho hiện trường và con người. AI đề xuất – người quản lý quyết định."}, {"type": "p", "text": "Định hướng 5 — Gắn điều hành nội bộ với trải nghiệm khách hàng (TNKH) — rà soát mỗi quyết định qua câu hỏi “khách hàng sẽ cảm nhận thế nào”."}, {"type": "p", "text": "Liên kết: Cơ chế vận hành trên nền dữ liệu → dữ liệu cần đội ngũ đủ năng lực → đội ngũ hiệu quả hơn khi có công cụ số → đích đến cuối cùng của cả hệ thống là TNKH."}, {"type": "p", "text": "Lộ trình toàn khóa & yêu cầu đầu ra"}, {"type": "p", "text": "Giảng viên trình bày cách năm định hướng được triển khai qua ba chuyên đề chuyên môn:"}, {"type": "table", "rows": [["Chuyên đề", "Nội dung", "Giá trị cốt lõi"], ["CĐ 1", "Ứng dụng AI hiệu quả trong công tác quản lý", "AI giúp có THÊM THỜI GIAN — giảm việc hành chính lặp lại."], ["CĐ 2a", "Nâng cao năng lực quản trị công việc trên nền dữ liệu", "Cơ chế giúp đơn vị TỰ VẬN HÀNH — không phụ thuộc một người."], ["CĐ 2b", "Gắn điều hành nội bộ với nâng cao TNKH", "Nâng cao TNKH trong công việc của tuyến đầu"], ["CĐ 3a & CĐ 3b", "Đào tạo, huấn luyện và kèm cặp nhân viên qua công việc", "Huấn luyện giúp ĐỘI NGŨ TRƯỞNG THÀNH — giảm tải bền vững."]]}, {"type": "p", "text": "Vòng xoáy đi lên: AI giải phóng thời gian → có thời gian huấn luyện → cơ chế tạo nhịp → đội ngũ giỏi hơn → TNKH tốt hơn → ít phàn nàn → có thời gian lãnh đạo → tiếp tục đi lên."}, {"type": "heading", "text": "6. Tự soi chiếu & cam kết tâm thế (8 phút)"}, {"type": "p", "text": "Năm câu hỏi tự soi chiếu cho mỗi học viên"}, {"type": "p", "text": "Giảng viên mời cả lớp tạm dừng, tự trả lời — không cần viết ra, chỉ cần thành thật với chính mình:"}, {"type": "p", "text": "Câu 1: Một ngày điển hình, bao nhiêu % thời gian dành cho việc phát sinh, bao nhiêu % cho việc quan trọng nhưng không gấp?"}, {"type": "p", "text": "Câu 2: Lần gần nhất ra một quyết định quan trọng, anh/chị có tra cứu dữ liệu trước khi quyết định không?"}, {"type": "p", "text": "Câu 3: Trong đội ngũ hiện tại, có ai đủ năng lực thay anh/chị xử lý phần lớn công việc nếu anh/chị vắng một tuần không?"}, {"type": "p", "text": "Câu 4: Anh/chị đã từng thử dùng AI để hỗ trợ một tác vụ công việc nào chưa?"}, {"type": "p", "text": "Câu 5: Lần gần nhất ra một quyết định điều hành, anh/chị có nghĩ đến tác động tới khách hàng không?"}, {"type": "p", "text": "Liên hệ Phần 1: Giảng viên nhắc lại con số poll đầu buổi — “Con số đó chính là câu trả lời cho câu hỏi thứ nhất. Năm câu này không để tự phê bình, mà để định vị bản thân trước khi bước vào các chuyên đề.”"}, {"type": "p", "text": "Thông điệp kết:"}, {"type": "p", "text": "“Chương trình đào tạo này chỉ là một phần của quá trình thay đổi. Phần quan trọng còn lại nằm ở tâm thế học hỏi và mức độ áp dụng vào công việc thực tế của mỗi anh/chị. Anh/chị hoàn toàn có thể bắt đầu vòng xoáy đi lên này ngay từ tuần tới — không cần xin phép ai, không cần chờ hệ thống mới.”"}]};
let state={view:'overview',slide:1};

/* ---------- NAV ---------- */
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  nav.appendChild(el('div','nav-sec','Tổng quan & tài nguyên'));
  [['overview','📋 Agenda tổng quan'],
   ['orientation','🧭 Chuyên đề định hướng'],
   ['prompts','🗂 Bộ 12 prompt sổ tay'],
   ['mau','⚖ 4 prompt mẫu (tốt / chưa tốt)'],
   ['check','🔒 Checklist & bảo mật'],
   ['guide','🎯 Cẩm nang hoạt động'],
   ['quiz','📝 Trắc nghiệm kiểm tra']].forEach(([v,t])=>{
    const a=el('a','',`<span class="tt">${t}</span>`);a.dataset.v=v;a.onclick=()=>go(v);nav.appendChild(a);
  });
  PARTS.forEach(p=>{
    nav.appendChild(el('div','nav-sec',esc(p)));
    DATA.slides.filter(s=>s.part===p).forEach(s=>{
      const a=el('a','',`<span class="sn">${s.n}</span><span class="tt">${esc(s.title)}</span><span class="dur">${s.dur}′</span>`);
      a.dataset.slide=s.n;a.onclick=()=>goSlide(s.n);nav.appendChild(a);
    });
  });
}
function setActive(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  let a= state.view==='slide' ? document.querySelector(`.nav a[data-slide="${state.slide}"]`)
                              : document.querySelector(`.nav a[data-v="${state.view}"]`);
  if(a)a.classList.add('active');
}
function go(v){state.view=v;state.slide=null;render();closeNav();window.scrollTo(0,0);}
function goSlide(n){state.view='slide';state.slide=n;render();closeNav();window.scrollTo(0,0);}


/* ---------- ORIENTATION ---------- */
function renderOrientation(){
  const m=$('#main');m.innerHTML='';
  m.appendChild(el('div','eyebrow','Chương trình QL01A · Chuyên đề định hướng'));
  m.appendChild(el('h2','page',esc(ORIENTATION.title)));
  m.appendChild(el('p','sub',esc(ORIENTATION.subtitle)));
  const mb=el('div','metabar');
  const durationLabel=String(ORIENTATION.duration || '').replace('Thời lượng:', '').trim();
  mb.innerHTML=`<span class="chip red">Thời lượng <b>${esc(durationLabel)}</b></span>
    <span class="chip blue"><b>Nền tảng lãnh đạo</b></span>
    <span class="chip green">Mở tâm thế trước CĐ01</span>
    <span class="chip">File: ${esc(ORIENTATION.sourceFile)}</span>`;
  m.appendChild(mb);
  let card=null;
  let list=null;
  const flush=()=>{if(card){m.appendChild(card);card=null;}};
  const flushList=()=>{if(list&&card){card.appendChild(list);list=null;}};
  const isBulletLike=(text)=>{
    return /^(Nhận diện|Phân biệt|Tiếp cận|Tự soi chiếu|Định vị|Ôm việc|Nhắc việc|Chữa cháy|Quyết định|Không có gì|Định hướng \d|Câu \d|CĐ \d|Vòng xoáy)/.test(text);
  };
  const isNote=(text)=>/^(Kết quả dự kiến|Chốt:|Nhấn mạnh:|Liên kết:|Liên hệ Phần 1:)/.test(text);
  const isQuestion=(text)=>/^(Giảng viên hỏi|Câu hỏi tương tác)/.test(text);
  const isMiniTitle=(text)=>{
    return /^(Tương tác học viên|Kể chuyện đối chiếu|Năm biểu hiện|Ba trụ cột|Năm định hướng|Lộ trình toàn khóa|Năm câu hỏi)/.test(text);
  };
  const appendBullet=(text)=>{
    if(!list) list=el('div','bullet-card','<ul></ul>');
    list.querySelector('ul').appendChild(el('li','',esc(text)));
  };
  const appendParagraph=(text)=>{
    flushList();
    const p=el('p','lead',esc(text));
    card.appendChild(p);
  };
  const ensureCard=(title)=>{
    flushList();
    if(card) m.appendChild(card);
    card=el('div','card');
    card.appendChild(el('h3','',`<span class="ic" style="background:var(--red)">i</span>${esc(title)}`));
  };
  ORIENTATION.items.forEach((item, index)=>{
    if(item.type==='heading'){
      ensureCard(item.text);
      return;
    }
    if(!card) ensureCard('Nội dung định hướng');
    if(item.type==='table'){
      flushList();
      const table=el('table');
      const rows=item.rows||[];
      const formatCell=(cell)=>esc(cell)
        .replace(/\.(?=(?:9h|11h|19h|7h45|17h))/g,'.<br>')
        .replace(/\.(?=[A-Z])/g,'.<br>')
        .replace(/(10h\.)(?= Kh)/g,'$1<br>')
        .replace(/((?:19h|17h)[^<]*)$/g,'<span class="strong-line">$1</span>');
      table.innerHTML=rows.map((row,idx)=>'<tr>'+row.map((cell)=>idx===0?`<th>${esc(cell)}</th>`:`<td>${formatCell(cell)}</td>`).join('')+'</tr>').join('');
      card.appendChild(table);
      return;
    }
    if(item.text==='Thông điệp kết:'){
      flushList();
      const next=ORIENTATION.items[index+1];
      const box=el('div','message-box',`<div class="message-title">${esc(item.text.replace(':',''))}</div><p>${esc(next&&next.type==='p'?next.text:'')}</p>`);
      card.appendChild(box);
      return;
    }
    if(index>0 && ORIENTATION.items[index-1].text==='Thông điệp kết:') return;
    if(isMiniTitle(item.text)){
      flushList();
      card.appendChild(el('div','mini-title',esc(item.text)));
      return;
    }
    if(isQuestion(item.text)){
      flushList();
      card.appendChild(el('div','question-box',`<b>Câu hỏi tương tác:</b> ${esc(item.text.replace(/^Giảng viên hỏi cả lớp \(giơ tay hoặc Mentimeter\):\s*/,'').replace(/^Câu hỏi tương tác \(hỏi và mời học viên phát biểu ngay tại lớp\):\s*/,''))}`));
      return;
    }
    if(isNote(item.text)){
      flushList();
      const [label,...rest]=item.text.split(':');
      card.appendChild(el('div','note-box',`<b>${esc(label)}:</b>${rest.length?' '+esc(rest.join(':').trim()):''}`));
      return;
    }
    if(isBulletLike(item.text)){
      appendBullet(item.text);
      return;
    }
    appendParagraph(item.text);
  });
  flushList();
  flush();
  m.appendChild(el('div','callout','<b>Cách dùng:</b> Giảng viên mở mục này trước CĐ01 để thống nhất bối cảnh, tâm thế học tập và lộ trình toàn khóa; sau đó chuyển sang Agenda tổng quan hoặc Slide 1 của chuyên đề Ứng dụng AI.'));
  setActive();
}

/* ---------- QUIZ ---------- */
let quizState={i:0,answers:[],started:false};
function renderQuiz(){
  const m=$('#main');m.innerHTML='';
  m.appendChild(el('div','eyebrow','Kiểm tra kiến thức giảng viên'));
  m.appendChild(el('h2','page','Bài trắc nghiệm theo từng slide chính'));
  if(!quizState.started){
    m.appendChild(el('p','sub',`Bài gồm ${DATA.quiz.length} câu, mỗi câu gắn một slide cốt lõi. Sau mỗi câu nhận phản hồi ngay; hoàn thành để xem điểm và phần ôn lại có liên kết về slide.`));
    const c=el('div','card');
    c.innerHTML=`<h3><span class="ic" style="background:var(--red)">i</span>Trước khi bắt đầu</h3>
      <ul><li>Không giới hạn thời gian — trả lời thật để tự đánh giá mức nắm bài.</li>
      <li>Mỗi câu chọn một đáp án; chọn xong hiện giải thích và slide liên quan.</li>
      <li>Đạt yêu cầu gợi ý: đúng từ 80% trở lên (${Math.ceil(DATA.quiz.length*0.8)}/${DATA.quiz.length} câu).</li></ul>`;
    m.appendChild(c);
    const b=el('button','btn primary','Bắt đầu làm bài →');b.style.marginTop='8px';
    b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();};m.appendChild(b);setActive();return;
  }
  if(quizState.i>=DATA.quiz.length){renderResult(m);setActive();return;}
  const q=DATA.quiz[quizState.i];
  m.appendChild(el('div','progress',`<i style="width:${Math.round(quizState.i/DATA.quiz.length*100)}%"></i>`));
  const card=el('div','q-card');
  card.appendChild(el('div','q-meta',`Câu ${quizState.i+1} / ${DATA.quiz.length}`));
  const sref=DATA.slides.find(x=>x.n===q.slide);
  const rl=el('div','q-ref',`📑 Liên quan Slide ${q.slide}: ${esc(sref?sref.title:'')}`);rl.onclick=()=>goSlide(q.slide);card.appendChild(rl);
  card.appendChild(el('p','q-text',esc(q.q)));
  const answered=quizState.answers[quizState.i]!=null;
  q.opts.forEach((o,idx)=>{
    const b=el('button','opt',`<span class="l">${String.fromCharCode(65+idx)}</span>${esc(o)}`);
    if(answered){
      const ch=quizState.answers[quizState.i];
      if(idx===q.a)b.classList.add('correct');else if(idx===ch)b.classList.add('wrong');else b.classList.add('dim');
      b.disabled=true;
    }else b.onclick=()=>{quizState.answers[quizState.i]=idx;renderQuiz();};
    card.appendChild(b);
  });
  const why=el('div','q-why'+(answered?' show':''));
  if(answered){const ok=quizState.answers[quizState.i]===q.a;why.innerHTML=`<b>${ok?'✔ Chính xác.':'✘ Chưa đúng.'}</b> ${esc(q.why)}`;}
  card.appendChild(why);
  if(answered){
    const nav=el('div','slidenav');
    const nx=el('button','btn primary',quizState.i<DATA.quiz.length-1?'Câu tiếp →':'Xem kết quả →');
    nx.onclick=()=>{quizState.i++;renderQuiz();window.scrollTo(0,0);};
    nav.appendChild(el('span'));nav.appendChild(nx);card.appendChild(nav);
  }
  m.appendChild(card);setActive();
}
function renderResult(m){
  const total=DATA.quiz.length,correct=quizState.answers.filter((a,i)=>a===DATA.quiz[i].a).length,pct=Math.round(correct/total*100),pass=pct>=80;
  const c=el('div','q-card result');
  c.innerHTML=`<div class="score">${correct}/${total}</div>
    <div class="lab" style="color:${pass?'var(--green)':'var(--red)'}">${pass?'Đạt yêu cầu ('+pct+'%)':'Cần ôn lại ('+pct+'%)'}</div>
    <p style="color:var(--grey);margin-top:8px">${pass?'Bạn đã nắm vững nội dung cốt lõi. Có thể tự tin đứng lớp.':'Hãy xem lại các slide ở phần ôn lại bên dưới rồi làm lại bài.'}</p>`;
  const rev=el('div','');rev.style.textAlign='left';rev.style.marginTop='20px';
  DATA.quiz.forEach((q,i)=>{
    const ok=quizState.answers[i]===q.a;const sref=DATA.slides.find(x=>x.n===q.slide);
    rev.appendChild(el('div','rev-item',
      `<div style="font-weight:700">${esc(q.q)}</div>
       <div style="margin-top:4px">${ok?'<span class="ok">✔ Bạn trả lời đúng</span>':'<span class="no">✘ Đáp án đúng: '+esc(q.opts[q.a])+'</span>'}</div>
       <div style="margin-top:5px;font-size:12.5px;color:var(--grey)">📑 <a onclick="goSlide(${q.slide})" style="cursor:pointer;color:var(--red)">Ôn Slide ${q.slide}: ${esc(sref?sref.title:'')}</a></div>`));
  });
  c.appendChild(rev);m.appendChild(c);
  const b=el('button','btn primary','↻ Làm lại bài');b.style.marginTop='18px';
  b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();window.scrollTo(0,0);};m.appendChild(b);
}

/* ---------- router ---------- */
function render(){
  ({overview:renderOverview,orientation:renderOrientation,slide:renderSlide,prompts:renderPrompts,mau:renderMau,
    check:renderCheck,guide:renderGuide,quiz:renderQuiz}[state.view]||renderOverview)();
}
function toggleNav(){$('#aside').classList.toggle('open');$('#backdrop').classList.toggle('open');}
function closeNav(){$('#aside').classList.remove('open');$('#backdrop').classList.remove('open');}
buildNav();render();

</script>
</body>
