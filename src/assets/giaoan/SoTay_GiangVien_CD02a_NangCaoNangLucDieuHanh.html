<!DOCTYPE html>
<html lang="vi">
<head>

<title>Sổ tay giảng viên · CĐ02a ? Năng lực điều hành · QL01A</title>
<style>
:root{
  --red:#C00000;--red-d:#8f0000;--ink:#1a1a1a;--grey:#565656;--lgrey:#8a8a8a;
  --line:#e7e7e8;--bg:#f4f4f5;--card:#fff;--gold:#B8860B;--green:#1F6F54;
  --blue:#1F5F8B;--violet:#6B4E9E;--teal:#127475;
  --sh:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
aside{width:296px;flex:0 0 296px;background:#fff;border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.brand .k{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:14px;margin:0;font-weight:800;letter-spacing:.02em}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--lgrey)}
.nav{padding:6px 0 60px}
.nav-sec{padding:13px 18px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--lgrey)}
.nav a{display:flex;gap:9px;align-items:baseline;padding:7px 18px;font-size:13px;color:var(--ink);border-left:3px solid transparent;cursor:pointer;user-select:none}
.nav a:hover{background:#faf6f6}
.nav a.active{background:#fbeaea;border-left-color:var(--red);color:var(--red);font-weight:700}
.nav a .sn{flex:0 0 24px;font-variant-numeric:tabular-nums;color:var(--lgrey);font-size:12px}
.nav a.active .sn{color:var(--red)}
.nav a .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .dur{font-size:11px;color:var(--lgrey);font-variant-numeric:tabular-nums}
main{flex:1;min-width:0;max-width:940px;margin:0 auto;padding:34px 42px 100px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
h2.page{font-size:27px;margin:0 0 6px;font-weight:800;line-height:1.2}
.sub{color:var(--grey);font-size:15px;margin:0 0 20px}
.metabar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#f0f0f0;color:var(--grey)}
.chip b{color:var(--ink)}
.chip.red{background:#fbeaea;color:var(--red)}.chip.green{background:#e9f5ef;color:var(--green)}
.chip.gold{background:#fbf3e2;color:var(--gold)}.chip.blue{background:#e9f1f7;color:var(--blue)}
.chip.violet{background:#efe9f6;color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#fff}
.card.content h3 .ic{background:var(--red)}.card.speak h3 .ic{background:var(--ink)}
.card.act h3 .ic{background:var(--green)}.card.guide h3 .ic{background:var(--gold)}
.card ul{margin:0;padding-left:20px}.card li{margin:5px 0}
.card .lead{margin:0 0 12px;color:#2f2f2f;font-size:14.5px}
.card .mini-title{margin:14px 0 7px;font-size:13px;font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.04em}
.card .bullet-card{margin:8px 0 14px;padding:12px 14px;border-radius:12px;background:#fafafa;border:1px solid var(--line)}
.card .bullet-card ul{margin:0}
.card .question-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#f7fbff;border:1px solid #cfe1ef;color:#173a54}
.card .question-box b{color:var(--blue)}
.card .note-box{margin:12px 0;padding:13px 15px;border-radius:12px;background:#fff8e6;border:1px solid #efd99c;color:#5a4a1a}
.card .note-box b{color:var(--gold)}
.message-box{margin:16px 0;border:1px solid #f0c36d;border-left:6px solid var(--gold);background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:var(--sh);padding:16px 18px;border-radius:12px}
.message-box .message-title{font-weight:900;color:var(--red-d);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.message-box p{margin:0;color:var(--ink);font-weight:650}
td .strong-line{font-weight:800}
.speak p{margin:0;color:#2c2c2c;font-size:14.5px;white-space:pre-line}
.act p{margin:0;font-size:14.5px;white-space:pre-line}
.callout{border-left:4px solid var(--gold);background:#fdf9ef;padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.5px;color:#5a4a1a}
.callout b{color:var(--gold)}
.slidenav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:#c9c9c9}
.btn:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--red);color:#fff;font-weight:700;font-size:12px}
tr.part td{background:#fbeaea;font-weight:800;color:var(--red)}
tr.brk td{background:#fdf6e3;font-weight:800;color:var(--gold)}
tr.tot td{background:var(--red);color:#fff;font-weight:800}
td.c{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.loai{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.loai.Giảng,.loai.GiảngTH,.loai.GiảngDemo{background:#eef;color:#3a3a8a}
.loai.Demo{background:#fbf3e2;color:var(--gold)}
.loai.Thựchành{background:#e9f5ef;color:var(--green)}
.loai.Đúckết{background:#f0f0f0;color:var(--grey)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.gcard{border-radius:14px;padding:20px 22px;color:#fff;box-shadow:var(--sh)}
.gcard.v{background:linear-gradient(135deg,#1F5F8B,#144463)}
.gcard.g{background:linear-gradient(135deg,#C00000,#7d0000)}
.gcard.d{background:linear-gradient(135deg,#6B4E9E,#463168)}
.gcard.t{background:linear-gradient(135deg,#127475,#0b4a4b)}
.gcard h3{margin:0 0 4px;font-size:18px;font-weight:800}
.gcard .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gcard ol{margin:12px 0 0;padding-left:20px}.gcard li{margin:6px 0;font-size:14px}
.gcard .foot{margin-top:12px;font-size:12.5px;opacity:.92;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
/* prompt cards */
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.pcard .ph{background:#faf6f6;padding:12px 18px;font-weight:800;font-size:15px;color:var(--red);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.pcard .ph .no{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.pcard .pb{padding:6px 18px 14px}
.prow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.prow:last-child{border-bottom:none}
.prow .k{flex:0 0 168px;font-weight:700;color:var(--grey);font-size:13px}
.prow .v{flex:1;white-space:pre-line}
.prow .v code,.mono{font-family:"SF Mono",Consolas,monospace;font-size:12.5px}
.promptbox{background:#f7f7f9;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;white-space:pre-wrap;color:#2a2a2a;line-height:1.55;margin:6px 0}
/* good/bad compare */
.cmp{display:grid;grid-template-columns:1fr;gap:14px;margin:14px 0}
.cmp .col{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cmp .col .h{padding:10px 16px;font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;gap:8px}
.cmp .bad .h{background:var(--red)}.cmp .good .h{background:var(--green)}
.cmp .col .b{padding:14px 16px;background:#fff}
.cmp .col .b p{margin:0 0 8px;font-size:14px}
.cmp .col .b p:last-child{margin-bottom:0}
/* quiz */
.progress{height:8px;background:#e6e6e6;border-radius:999px;overflow:hidden;margin:10px 0 22px}
.progress>i{display:block;height:100%;background:var(--red);transition:width .4s}
.q-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh)}
.q-meta{font-size:12px;color:var(--lgrey);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.q-ref{font-size:12px;color:var(--red);font-weight:700;margin-bottom:12px;cursor:pointer}
.q-text{font-size:17px;font-weight:700;margin:0 0 18px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:11px;margin:9px 0;font-size:14.5px;cursor:pointer;background:#fff;transition:.12s;font-family:inherit}
.opt:hover{border-color:#c9c9c9}
.opt .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f0f0f0;color:#666;font-weight:800;font-size:12px;margin-right:10px;vertical-align:middle}
.opt.correct{border-color:var(--green);background:#e9f5ef}.opt.correct .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbeaea}.opt.wrong .l{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.q-why{margin-top:16px;padding:13px 16px;border-radius:10px;background:#f6faf8;border:1px solid #d9ece4;font-size:14px;color:#264c3d;display:none}
.q-why.show{display:block}.q-why b{color:var(--green)}
.result{text-align:center;padding:26px}
.result .score{font-size:56px;font-weight:900;color:var(--red);line-height:1}
.result .lab{font-size:18px;font-weight:800;margin-top:6px}
.rev-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0;font-size:13.5px;text-align:left}
.rev-item .ok{color:var(--green);font-weight:700}.rev-item .no{color:var(--red);font-weight:700}
.menuBtn{display:none}
@media(max-width:880px){
  aside{position:fixed;left:-310px;z-index:40;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{left:0}
  .menuBtn{display:inline-flex;position:fixed;top:12px;left:12px;z-index:50;background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-size:16px;cursor:pointer;box-shadow:var(--sh)}
  main{padding:60px 18px 90px}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}.backdrop.open{display:block}
  .prow{flex-direction:column;gap:2px}.prow .k{flex:none}
}
</style>

<script>
const DATA={"slides":[{"n":1,"title":"Mục lục chuyên đề","part":"Mở đầu","loai":"Giảng","dur":5,"content":["Yêu cầu mới & trục năng lực điều hành chuyên nghiệp","Tư duy tạo xung – tạo nhịp – tạo lực","Phân tầng công việc — phương pháp & ví dụ","Thiết kế nhịp điều hành & phối hợp liên bộ phận","Thực hành cải tiến nhịp điều hành tại đơn vị"],"loithoai":"Đây là lộ trình của chuyên đề. Chúng ta bắt đầu từ việc nhận diện đúng yêu cầu mới đặt ra cho Trưởng/Phó Điện lực hôm nay — bối cảnh đã khác trước rất nhiều. Sau đó đi vào tư duy nền: ba việc một người điều hành phải làm được là tạo xung, tạo nhịp và tạo lực. Tiếp theo là hai công cụ thực hành quan trọng nhất — phân tầng công việc để biết việc nào mình phải giữ, việc nào giao đi; và thiết kế nhịp điều hành để đơn vị chạy đều mà không cần nhắc. Cuối cùng anh/chị thực hành cải tiến chính nhịp điều hành tại đơn vị mình, có video phân tích một nhịp giao ban mẫu để tham khảo. Xuyên suốt năm nội dung là một sợi chỉ đỏ: mọi cải tiến điều hành nội bộ cuối cùng đều thể hiện ra ở trải nghiệm khách hàng.","hoatdong":"","callouts":["Câu chốt dưới: \"Điều hành có nhịp — khách hàng cảm nhận được sự ổn định.\""]},{"n":2,"title":"Kết nối từ chuyên đề 1","part":"Mở đầu","loai":"Giảng","dur":5,"content":["CĐ1: AI giúp xử lý nhanh từng phần việc (công cụ cá nhân)","CĐ2a: Tổ chức cả guồng việc của đơn vị chạy đều (cơ chế tập thể)","Mũi tên: Công cụ tốt + Cơ chế tốt = Điều hành chuyên nghiệp","Lưu ý: AI tiết kiệm thời gian → thời gian đó dồn cho việc \"giữ nhịp\" mà chỉ người quản lý làm được"],"loithoai":"Trước khi vào nội dung mới, ta nối lại với Chuyên đề 1. Ở đó anh/chị học cách dùng AI để làm nhanh từng việc cụ thể: tóm tắt văn bản, tổng hợp sự cố, soạn báo cáo. Đó là công cụ ở cấp độ cá nhân — giúp chính mình nhanh hơn. Chuyên đề 2a ở một tầng khác: không phải làm nhanh một việc, mà tổ chức để cả guồng công việc của đơn vị chạy đều, nhiều người phối hợp ăn khớp. Một bên là công cụ, một bên là cơ chế. Hai cái bổ sung nhau: có công cụ tốt mà không có cơ chế thì mỗi người nhanh một kiểu, đơn vị vẫn rời rạc; có cơ chế tốt mà không có công cụ thì guồng máy chạy nhưng chậm. Điểm nối quan trọng: thời gian anh/chị tiết kiệm được nhờ AI nên dồn vào đúng việc mà chỉ người quản lý làm được — giữ nhịp điều hành, phát triển đội ngũ. Đó chính là nội dung hôm nay.","hoatdong":""},{"n":3,"title":"Vì sao chuyên đề này quan trọng","part":"Mở đầu","loai":"Giảng","dur":4,"content":["Đơn vị phụ thuộc một người → Trưởng ĐL vắng là đơn vị \"chao đảo\"","Việc nhiều nhưng rời rạc → bận liên tục mà kết quả không ổn định","Khách hàng chịu thiệt đầu tiên → khi điều hành nội bộ trục trặc, điểm chạm KH lãnh hậu quả"],"loithoai":"Vì sao nội dung này quan trọng với riêng vai trò của anh/chị? Ba thực tế rất quen. Thứ nhất, nhiều đơn vị phụ thuộc vào một người: Trưởng Điện lực đi họp, đi vắng một hai ngày là công việc ùn lại, mọi thứ chờ \"anh về quyết\". Đó là dấu hiệu đơn vị chạy bằng con người chứ chưa chạy bằng cơ chế. Thứ hai, việc rất nhiều nhưng rời rạc — làm cả ngày không hết việc mà kết quả vẫn không ổn định, tuần này tốt tuần sau lại trục trặc. Thứ ba, và quan trọng nhất: khi điều hành nội bộ trục trặc, người chịu thiệt đầu tiên luôn là khách hàng — yêu cầu bị chuyển lòng vòng, phản hồi chậm, hồ sơ rơi vào \"vùng xám\" không ai chịu trách nhiệm. Thông điệp của cả chuyên đề gói trong một câu: điều hành chuyên nghiệp không phải là làm nhiều hơn, mà là thiết kế cơ chế để đơn vị tự chạy đúng nhịp, kể cả khi anh/chị không có mặt.\n\nNỘI DUNG 1: Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp\n\nBối cảnh tái cơ cấu · Từ \"xử lý việc\" sang \"thiết kế cơ chế\" · 4 trục năng lực\n\nChúng ta bắt đầu Nội dung 1: nhận diện đúng yêu cầu mới và các trục năng lực mà một người điều hành chuyên nghiệp cần có. Phần này trả lời câu hỏi: bối cảnh đã thay đổi thế nào, và nó đòi hỏi gì khác ở người Trưởng/Phó Điện lực so với trước đây.","hoatdong":"","callouts":["Callout đỏ: Điều hành chuyên nghiệp không phải làm nhiều hơn — mà là thiết kế cơ chế để đơn vị tự chạy đúng nhịp."]},{"n":4,"title":"Bối cảnh mới: yêu cầu đã khác trước","part":"NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","loai":"Giảng","dur":3,"content":["Tái cơ cấu sâu: mô hình 2 cấp, Đội Quản lý điện → Điện lực; nhiều cán bộ vừa thay đổi vị trí","Địa bàn mở rộng: sau sáp nhập hành chính, nhiều đầu mối xã/phường hơn","Áp lực kép: vừa vận hành – an toàn, vừa kinh doanh – dịch vụ khách hàng","Kỳ vọng KH tăng: chuyển đổi số tạo thêm điểm chạm, KH đòi hỏi nhanh và minh bạch hơn"],"loithoai":"Bối cảnh điều hành của anh/chị hôm nay đã khác trước rất nhiều, theo bốn hướng. Thứ nhất là tái cơ cấu sâu: Tổng công ty chuyển sang mô hình quản lý hai cấp, các Đội Quản lý điện được tổ chức lại và đổi tên thành Điện lực; nhiều anh/chị vừa thay đổi vị trí công tác, cần chuẩn hóa lại cách điều hành cho phù hợp vai trò mới. Thứ hai, sau sáp nhập đơn vị hành chính, mỗi Điện lực phụ trách địa bàn rộng hơn, nhiều đầu mối xã/phường hơn, kéo theo nhu cầu phối hợp tăng mạnh. Thứ ba là áp lực kép thường trực: cùng lúc phải lo vận hành lưới và an toàn, vừa lo kinh doanh và dịch vụ khách hàng — không được phép đánh đổi cái nào. Thứ tư, kỳ vọng khách hàng ngày càng cao; chuyển đổi số mở thêm nhiều điểm chạm, khách hàng quen được phục vụ nhanh, minh bạch ở các ngành khác và mang kỳ vọng đó sang ngành điện. Bốn sức ép này cộng lại khiến cách điều hành cũ — chủ yếu dựa kinh nghiệm và trí nhớ cá nhân — ngày càng đuối.","hoatdong":""},{"n":5,"title":"Biểu hiện của quản lý theo kinh nghiệm","part":"NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","loai":"Giảng","dur":3,"content":[],"loithoai":"Hãy thành thật nhìn lại một vài biểu hiện rất phổ biến — không phải để phê phán, mà để nhận diện. Thứ nhất là ôm việc: thấy giao ra không yên tâm nên tự làm cho chắc; hệ quả là chính mình trở thành nút thắt, mọi việc dồn về một người. Thứ hai là nhắc việc liên tục: việc đã giao nhưng phải hỏi đi hỏi lại tiến độ, đôn đốc lần hai lần ba; vừa tốn thời gian của mình, vừa khiến đội ngũ quen thụ động, cứ chờ nhắc mới làm. Thứ ba là xử lý phát sinh bị động: cả ngày chạy theo việc đột xuất, hết \"đám cháy\" này tới \"đám cháy\" khác, không bao giờ kiểm soát được đầu cuối. Thứ tư là giao việc bằng lời, qua Zalo, không chốt rõ đầu ra và thời hạn; việc liên tổ thì không ai chủ trì, dễ rơi vào \"vùng xám\" — ai cũng tưởng người khác làm. Nếu anh/chị thấy mình trong vài biểu hiện này thì hoàn toàn bình thường; vấn đề không phải do năng lực, mà do chưa có cơ chế. Và cơ chế thì học được, làm được.","hoatdong":"","tables":[{"title":"Nội dung trình bày trên slide","rows":[["Biểu hiện thường gặp","Hệ quả"],["Ôm việc, tự làm cho chắc","Trưởng ĐL thành nút thắt cổ chai"],["Nhắc việc liên tục, đôn đốc lần 2–3","Tốn thời gian, đội ngũ thụ động"],["Xử lý phát sinh bị động","Luôn \"chữa cháy\", không kiểm soát đầu cuối"],["Giao việc bằng lời, không chốt đầu ra","Việc rơi vào \"vùng xám\", đùn đẩy"]]}]},{"n":6,"title":"Chuyển dịch cốt lõi: từ xử lý việc → thiết kế cơ chế","part":"NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","loai":"Giảng","dur":3,"content":["\"Xử lý việc\" → \"Thiết kế cơ chế giữ nhịp\" (rõ việc – rõ trách nhiệm – rõ nhịp – rõ kết quả)","\"Nhắc việc\" → \"Phản hồi & kèm cặp đúng cách\"","\"Quản lý bằng kinh nghiệm\" → \"Kết hợp kinh nghiệm + phương pháp + công cụ\"","\"Tự làm thủ công\" → \"Ứng dụng công nghệ số/AI cho phần việc phù hợp, vẫn giữ kiểm soát\""],"loithoai":"Đây là slide bản lề của cả chuyên đề: bốn chuyển dịch tư duy mà khóa học hướng tới. Một, từ \"xử lý việc\" sang \"thiết kế cơ chế giữ nhịp\" — thay vì sa vào giải quyết từng việc lẻ, người quản lý chuyên nghiệp dựng cơ chế để công việc tự chạy theo bốn cái rõ: rõ việc, rõ trách nhiệm, rõ nhịp, rõ kết quả. Hai, từ \"nhắc việc\" sang \"phản hồi và kèm cặp đúng cách\" — thay vì đôn đốc, ta xây thói quen để cấp dưới tự báo lại, và dùng thời gian đó để hướng dẫn nâng năng lực. Ba, từ \"quản lý bằng kinh nghiệm\" sang kết hợp kinh nghiệm với phương pháp và công cụ — kinh nghiệm vẫn quý, nhưng cần phương pháp để nhân rộng và công cụ để kiểm soát. Bốn, từ \"tự làm thủ công\" sang biết ứng dụng công nghệ số và AI cho phần việc phù hợp, mà vẫn giữ quyền kiểm soát và trách nhiệm. Bốn chuyển dịch này là thước đo: cuối khóa, mỗi anh/chị nên chọn ít nhất một cái để thực sự thay đổi tại đơn vị.","hoatdong":""},{"n":7,"title":"Bốn trục năng lực điều hành chuyên nghiệp","part":"NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","loai":"Giảng","dur":3,"content":["Tổ chức công việc — phân tầng, phân vai, chốt trách nhiệm (xanh dương)","Giữ nhịp điều hành — giao ban, theo dõi, phản hồi đều nhịp (cam)","Điều phối phối hợp — liên tổ, liên đầu mối, xử lý \"vùng xám\" (lục)","Gắn với kết quả phục vụ — mọi việc quy về TNKH (đỏ)"],"loithoai":"Từ các chuyển dịch trên, ta rút ra bốn trục năng lực mà một người điều hành chuyên nghiệp cần vững. Trục một — tổ chức công việc: biết phân tầng việc nào quan trọng, phân vai ai làm gì, chốt rõ trách nhiệm; đây là nền của mọi thứ. Trục hai — giữ nhịp điều hành: duy trì nhịp giao ban, theo dõi, phản hồi đều đặn để đơn vị có \"mạch đập\" ổn định, không lúc dồn dập lúc đứt quãng. Trục ba — điều phối phối hợp: xử lý các việc liên tổ, liên đầu mối, không để hồ sơ rơi vào vùng xám giữa các bộ phận. Trục bốn — và đây là trục định hướng tất cả — gắn mọi hoạt động điều hành với kết quả phục vụ khách hàng; điều hành nội bộ không phải để gọn cho nội bộ, mà để khách hàng cảm nhận được sự ổn định và tin cậy. Bốn trục này chính là khung của ba nội dung tiếp theo: tạo xung – tạo nhịp – tạo lực sẽ làm rõ trục hai, phân tầng làm rõ trục một, thiết kế nhịp & phối hợp làm rõ trục ba, và TNKH xuyên suốt là trục bốn.","hoatdong":""},{"n":8,"title":"Đúc kết nội dung 1","part":"NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","loai":"Giảng","dur":3,"content":["Bối cảnh mới đòi hỏi cách điều hành mới — không thể dựa mãi vào kinh nghiệm cá nhân","Cốt lõi: chuyển từ \"xử lý việc\" sang \"thiết kế cơ chế\"","4 trục năng lực: Tổ chức – Giữ nhịp – Điều phối – Gắn với TNKH"],"loithoai":"Khép lại Nội dung 1. Ba điều cần mang theo. Một: bối cảnh tái cơ cấu, địa bàn rộng, áp lực kép và kỳ vọng khách hàng tăng đòi hỏi một cách điều hành mới — không thể dựa mãi vào kinh nghiệm và trí nhớ cá nhân. Hai: chuyển dịch cốt lõi là từ \"xử lý việc\" sang \"thiết kế cơ chế giữ nhịp\", với bốn cái rõ — rõ việc, rõ trách nhiệm, rõ nhịp, rõ kết quả. Ba: bốn trục năng lực của điều hành chuyên nghiệp là tổ chức công việc, giữ nhịp, điều phối phối hợp, và gắn với trải nghiệm khách hàng. Bây giờ câu hỏi tự nhiên là: làm thế nào để thực sự thiết kế được cơ chế đó? Câu trả lời bắt đầu từ một tư duy nền rất cô đọng — tạo xung, tạo nhịp, tạo lực — chính là Nội dung 2.\n\nNỘI DUNG 2: Tư duy tạo xung – tạo nhịp – tạo lực trong điều hành\n\nBa việc người điều hành phải làm được\n\nNội dung 2 là phần tư duy nền, ngắn nhưng quan trọng nhất về mặt định hướng. Tôi muốn anh/chị nhớ ba động từ: tạo xung, tạo nhịp, tạo lực. Đây là ba việc cốt lõi của bất kỳ người điều hành nào — hiểu được ba việc này thì mọi công cụ phía sau đều có chỗ đứng.","hoatdong":"","callouts":["Cầu nối ND2: Để thiết kế được cơ chế, trước hết cần một tư duy nền — tạo xung, tạo nhịp, tạo lực."]},{"n":9,"title":"Ba việc cốt lõi của người điều hành","part":"NỘI DUNG 2 · Tư duy tạo xung – tạo nhịp – tạo lực trong điều hành","loai":"Giảng","dur":3,"content":["TẠO XUNG (khởi động) — phát động, giao việc rõ, tạo điểm khởi đầu dứt khoát cho mỗi việc/mỗi ngày","TẠO NHỊP (duy trì) — thiết lập nhịp lặp lại đều đặn: giao ban, theo dõi, phản hồi theo chu kỳ","TẠO LỰC (thúc đẩy) — tạo động lực và sức kéo: ghi nhận, kèm cặp, gỡ rào cản để đội ngũ chủ động"],"loithoai":"Ba việc, hình dung như điều khiển một guồng máy. Thứ nhất là tạo xung — tức tạo lực khởi động. Mỗi đầu việc, mỗi ngày làm việc cần một điểm khởi đầu dứt khoát: việc được phát động rõ ràng, giao đúng người, đúng yêu cầu. Không có xung khởi động thì việc cứ \"lửng lơ\", không ai biết bắt đầu từ đâu. Thứ hai là tạo nhịp — tức duy trì. Một cái xung ban đầu chưa đủ; guồng máy cần nhịp lặp lại đều đặn để giữ đà: giao ban hằng ngày, rà soát hằng tuần, đánh giá hằng tháng. Nhịp là cái khiến công việc không phụ thuộc cảm hứng, mà chạy theo chu kỳ ổn định. Thứ ba là tạo lực — tức tạo sức kéo và động lực. Guồng máy có nhịp nhưng nếu người trong đó mệt mỏi, thụ động thì vẫn ì. Tạo lực là ghi nhận đúng lúc, kèm cặp để nâng năng lực, và chủ động gỡ rào cản để đội ngũ làm được việc. Một người điều hành giỏi làm cả ba: khởi động dứt khoát, giữ nhịp đều đặn, và tiếp lực liên tục.","hoatdong":""},{"n":10,"title":"Mối quan hệ giữa ba yếu tố","part":"NỘI DUNG 2 · Tư duy tạo xung – tạo nhịp – tạo lực trong điều hành","loai":"Giảng","dur":3,"content":["Xung mà không có nhịp → bùng lên rồi tắt (phát động nhiều phong trào, không duy trì)","Nhịp mà không có lực → chạy hình thức, đội ngũ làm cho có","Lực mà không có nhịp → nhiệt tình nhưng tản mạn, không thành kết quả ổn định"],"loithoai":"Ba yếu tố này phải đi cùng nhau, thiếu cái nào cũng lệch. Nếu chỉ có xung mà không có nhịp: anh/chị phát động rất nhiều, hôm nay phong trào này mai đợt thi đua kia, nhưng không duy trì — bùng lên rồi tắt, đội ngũ mệt vì hết đợt này tới đợt khác mà không thấy thành nề nếp. Nếu có nhịp mà không có lực: giao ban vẫn họp đều, báo cáo vẫn nộp đúng hạn, nhưng tất cả làm cho có, hình thức, không ai thật sự muốn cải thiện — nhịp rỗng. Nếu có lực mà không có nhịp: đội ngũ nhiệt tình, muốn làm tốt, nhưng thiếu chu kỳ ổn định nên nỗ lực tản mạn, lúc được lúc không, khó thành kết quả bền. Chỉ khi đủ cả ba — khởi động dứt khoát, nhịp đều đặn, và động lực được nuôi liên tục — thì đơn vị mới vận hành ổn định, có đà, có sức kéo, và quan trọng nhất là không phụ thuộc vào sự có mặt của một người. Đó chính là đích đến của điều hành chuyên nghiệp.","hoatdong":"","callouts":["Callout: Đủ cả ba — đơn vị vận hành ổn định, có đà, có động lực, không phụ thuộc một người."]},{"n":11,"title":"Ví dụ minh họa: ba yếu tố trong một ngày điều hành","part":"NỘI DUNG 2 · Tư duy tạo xung – tạo nhịp – tạo lực trong điều hành","loai":"Demo","dur":3,"content":["Tạo xung (đầu ngày): giao ban 15 phút, chốt việc trọng tâm, ai làm gì hôm nay","Tạo nhịp (trong ngày): mốc báo lại giữa ngày/cuối ngày theo quy ước, không cần nhắc","Tạo lực (xuyên suốt): ghi nhận nhanh việc làm tốt, gỡ vướng kịp thời khi có điểm nghẽn","Kết quả: một ngày có cấu trúc, đội ngũ chủ động, người quản lý không phải \"đuổi theo việc\""],"loithoai":"Cho cụ thể, ta xem ba yếu tố thể hiện thế nào trong đúng một ngày làm việc. Đầu ngày — tạo xung: một buổi giao ban mười lăm phút có cấu trúc, chốt việc trọng tâm trong ngày, ai phụ trách gì, đầu ra là gì. Đó là cú khởi động dứt khoát, cả đơn vị biết hôm nay tập trung vào đâu. Trong ngày — tạo nhịp: có những mốc báo lại theo quy ước, ví dụ tổ kỹ thuật báo tiến độ trước 14 giờ, không cần Trưởng Điện lực gọi hỏi; nhịp này khiến thông tin tự chảy về mà không tốn công đôn đốc. Xuyên suốt — tạo lực: khi thấy một việc làm tốt thì ghi nhận ngay một câu, khi thấy một điểm nghẽn thì gỡ vướng kịp thời thay vì để tồn. Kết quả là một ngày có cấu trúc rõ: đội ngũ chủ động vì biết nhịp, người quản lý không phải chạy theo từng việc mà có thời gian cho việc quan trọng hơn. Anh/chị thấy đấy, ba động từ trừu tượng này thực ra rất cụ thể — và phần lớn nằm ở chỗ \"tạo nhịp\". Nên hai nội dung tiếp theo sẽ đi sâu vào công cụ để tạo nhịp: phân tầng công việc và thiết kế nhịp điều hành.","hoatdong":""},{"n":12,"title":"Đúc kết nội dung 2","part":"NỘI DUNG 2 · Tư duy tạo xung – tạo nhịp – tạo lực trong điều hành","loai":"Giảng","dur":3,"content":["Người điều hành = người tạo xung (khởi động) + tạo nhịp (duy trì) + tạo lực (thúc đẩy)","Thiếu một yếu tố → guồng máy lệch","Trọng tâm thực hành nằm ở \"tạo nhịp\" — và nhịp được xây từ 2 việc: phân tầng đúng + thiết kế chu kỳ đúng"],"loithoai":"Tóm lại Nội dung 2. Người điều hành chuyên nghiệp đồng thời là người tạo xung — khởi động công việc dứt khoát; người tạo nhịp — duy trì chu kỳ vận hành đều đặn; và người tạo lực — nuôi động lực, gỡ rào cản cho đội ngũ. Thiếu yếu tố nào guồng máy cũng lệch: thiếu xung thì ì, thiếu nhịp thì đứt quãng, thiếu lực thì rỗng. Trong ba yếu tố, phần thực hành được nhiều nhất là tạo nhịp, vì nó là cái có thể thiết kế cụ thể. Và một nhịp tốt được xây từ hai việc: phân tầng công việc cho đúng để biết tập trung vào đâu, và thiết kế chu kỳ điều hành cho hợp lý. Hai việc đó chính là Nội dung 3 và Nội dung 4. Ta vào Nội dung 3 trước: phân tầng công việc — muốn tạo nhịp đúng, trước hết phải biết việc nào thuộc tầng nào.\n\nNỘI DUNG 3: Phân tầng công việc — phương pháp & ví dụ minh họa\n\nNhịp điều hành là gì · Phân tầng là gì · Giá trị · Cách làm\n\nNội dung 3 đi vào công cụ thực hành đầu tiên: phân tầng công việc. Đây là kỹ năng nền — nếu không phân tầng được, anh/chị sẽ luôn bị cuốn vào việc nhỏ mà bỏ lỡ việc lớn. Chúng ta sẽ làm rõ: nhịp điều hành là gì, phân tầng là gì, nó mang lại giá trị gì, và cách phân tầng hiệu quả qua một ví dụ cụ thể tại Điện lực.","hoatdong":"","callouts":["Cầu nối ND3: Muốn tạo nhịp đúng, trước hết phải biết việc nào ở tầng nào — đó là phân tầng công việc."]},{"n":13,"title":"Nhịp điều hành là gì","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Giảng","dur":3,"content":["Định nghĩa: Nhịp điều hành là chu kỳ lặp lại đều đặn của các hoạt động điều hành — giao ban, theo dõi, rà soát, phản hồi — theo Ngày / Tuần / Tháng.","Hình dung: như \"mạch đập\" của đơn vị; đều đặn thì đơn vị khỏe, đứt quãng thì rối loạn.","Đặc điểm: cố định về thời điểm, có cấu trúc về nội dung, không phụ thuộc cảm hứng hay sự có mặt của một người."],"loithoai":"Trước hết làm rõ khái niệm \"nhịp điều hành\", vì nó là từ khóa của cả chuyên đề. Nhịp điều hành là chu kỳ lặp lại đều đặn của các hoạt động điều hành cốt lõi — giao ban, theo dõi, rà soát, phản hồi — được tổ chức theo ngày, theo tuần và theo tháng. Cách hình dung dễ nhất: nhịp điều hành như mạch đập của đơn vị. Một cơ thể khỏe có mạch đập đều; mạch loạn là cơ thể có vấn đề. Đơn vị cũng vậy: khi có nhịp đều — sáng nào cũng giao ban đúng giờ, tuần nào cũng rà soát phối hợp, tháng nào cũng đánh giá — thì mọi người biết khi nào cần báo cáo gì, việc gì sắp tới, ai chịu trách nhiệm. Đặc điểm quan trọng của nhịp là: cố định về thời điểm, có cấu trúc về nội dung, và không phụ thuộc cảm hứng hay sự có mặt của riêng người quản lý. Chính ba đặc điểm đó làm cho đơn vị \"tự chạy\" được. Và để nhịp này có nội dung đúng, ta cần phân tầng công việc — phần tiếp theo.","hoatdong":""},{"n":14,"title":"Phân tầng công việc là gì","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Giảng","dur":3,"content":["Tầng 1 – Việc định hướng/chiến lược: kế hoạch, mục tiêu đơn vị, vấn đề lớn — người quản lý GIỮ","Tầng 2 – Việc điều phối: phân công, phối hợp liên tổ, chốt trách nhiệm — người quản lý CHỦ TRÌ","Tầng 3 – Việc giám sát: theo dõi tiến độ, kiểm soát chất lượng, hậu kiểm — người quản lý KIỂM theo ngoại lệ","Tầng 4 – Việc xử lý thường xuyên: tác nghiệp lặp lại hằng ngày — GIAO cho cấp dưới + cơ chế báo lại"],"loithoai":"Phân tầng công việc nghĩa là xếp các đầu việc vào đúng \"tầng\" theo tính chất, để biết việc nào người quản lý phải giữ, việc nào giao đi. Có bốn tầng. Tầng một — việc định hướng, chiến lược: kế hoạch của đơn vị, mục tiêu tháng/quý, các vấn đề lớn cần quyết; đây là việc người quản lý phải giữ, vì không ai làm thay được. Tầng hai — việc điều phối: phân công, phối hợp liên tổ, chốt trách nhiệm cho việc nhiều bên; người quản lý chủ trì, đây là phần \"điều\" trong điều hành. Tầng ba — việc giám sát: theo dõi tiến độ, kiểm soát chất lượng, hậu kiểm; việc này người quản lý không làm trực tiếp toàn bộ mà kiểm theo ngoại lệ — chỉ tập trung vào chỗ bất thường. Tầng bốn — việc xử lý thường xuyên: tác nghiệp lặp lại hằng ngày; đây là phần nên giao cho cấp dưới kèm cơ chế báo lại, không nên ôm. Sai lầm phổ biến là người quản lý dành phần lớn thời gian cho tầng bốn — việc dễ thấy, dễ làm — mà thiếu thời gian cho tầng một và tầng hai, vốn mới là việc tạo ra giá trị quản lý.","hoatdong":""},{"n":15,"title":"Phân tầng mang lại giá trị gì","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Giảng","dur":3,"content":["Đúng việc đúng người: việc tầng cao người quản lý giữ, việc tầng thấp giao đi → hết ôm việc","Giải phóng thời gian: dồn thời gian cho việc định hướng & điều phối thay vì tác nghiệp vặt","Đội ngũ trưởng thành: giao việc tầng 3–4 kèm trách nhiệm → cấp dưới chủ động, có cơ hội phát triển","Nhịp rõ ràng: mỗi tầng có chu kỳ riêng (tầng 4 hằng ngày, tầng 1 hằng tháng) → dễ thiết kế nhịp"],"loithoai":"Phân tầng đúng mang lại bốn giá trị rất thiết thực. Thứ nhất, đúng việc đúng người: việc tầng cao thì người quản lý giữ, việc tầng thấp giao đi — đây là cách thoát khỏi tình trạng ôm việc một cách có nguyên tắc, chứ không phải buông tùy tiện. Thứ hai, giải phóng thời gian: khi không còn sa vào tác nghiệp vặt, anh/chị có thời gian cho việc định hướng và điều phối — đúng phần việc tạo ra giá trị của vai trò quản lý. Thứ ba, đội ngũ trưởng thành: giao việc tầng ba, tầng bốn kèm trách nhiệm rõ ràng chính là trao cơ hội cho cấp dưới chủ động và phát triển; ôm hết việc thực ra là cản trở đội ngũ lớn lên. Thứ tư, và rất quan trọng cho chuyên đề này: phân tầng tạo cơ sở để thiết kế nhịp, vì mỗi tầng có chu kỳ tự nhiên riêng — việc tác nghiệp tầng bốn theo nhịp hằng ngày, việc điều phối tầng hai theo nhịp tuần, việc định hướng tầng một theo nhịp tháng. Biết tầng nào ở nhịp nào thì việc thiết kế nhịp điều hành ở Nội dung 4 trở nên rõ ràng.","hoatdong":""},{"n":16,"title":"Phương pháp phân tầng: 3 bước","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Giảng","dur":3,"content":["Bước 1 – Liệt kê: ghi ra toàn bộ đầu việc đang làm trong tuần/tháng (không bỏ sót việc vặt)","Bước 2 – Đặt 2 câu hỏi cho mỗi việc: (a) Việc này có cần phán đoán/quyết định của mình không? (b) Nếu mình không làm, có ai làm được không?","Bước 3 – Xếp tầng & quyết định: Giữ (tầng 1–2) / Giám sát theo ngoại lệ (tầng 3) / Giao kèm báo lại (tầng 4)"],"loithoai":"Phương pháp phân tầng rất đơn giản, ba bước, ai cũng làm được. Bước một — liệt kê: ngồi ghi ra toàn bộ đầu việc mình đang làm trong một tuần hoặc một tháng, kể cả việc vặt; nhiều người ngạc nhiên khi thấy danh sách dài thế nào, và bao nhiêu phần là việc tầng thấp. Bước hai — với mỗi việc, đặt hai câu hỏi. Câu hỏi a: việc này có thực sự cần phán đoán hoặc quyết định của riêng mình không? Câu hỏi b: nếu mình không làm, có ai khác làm được không? Hai câu hỏi này lọc rất nhanh: việc vừa cần phán đoán của mình vừa không ai thay được thì là tầng cao, phải giữ; việc không cần phán đoán đặc thù và người khác làm được thì là tầng thấp, nên giao. Bước ba — xếp tầng và quyết định: việc tầng một, tầng hai thì giữ; việc tầng ba thì giám sát theo ngoại lệ, tức chỉ can thiệp khi có bất thường; việc tầng bốn thì giao kèm cơ chế báo lại rõ ràng. Làm một lần cho danh sách của mình, anh/chị sẽ thấy bức tranh thời gian thay đổi hẳn.","hoatdong":""},{"n":17,"title":"Ví dụ minh họa: phân tầng tại một điện lực","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Demo","dur":3,"content":[],"loithoai":"Cho thật cụ thể bằng một ví dụ phân tầng tại một Điện lực. Việc xây kế hoạch giảm tổn thất điện năng trong quý — đây là việc định hướng tầng một, cần tầm nhìn và quyết định của người đứng đầu, phải tự giữ. Việc phân công xử lý một sự cố cần phối hợp giữa tổ kỹ thuật và tổ kinh doanh — đây là việc điều phối tầng hai, người quản lý chủ trì và chốt rõ ai chủ trì, ai phối hợp, ai phản hồi khách hàng. Việc theo dõi tiến độ các phiếu yêu cầu của khách hàng — đây là tầng ba, không cần đọc từng phiếu mà giám sát theo ngoại lệ: hệ thống hoặc tổ báo lên phiếu nào trễ thì mới tập trung vào đó. Việc ký duyệt đề nghị vật tư nhỏ lặp đi lặp lại — tầng bốn, hoàn toàn có thể phân quyền ký cho Phó hoặc Tổ trưởng theo hạn mức. Việc trả lời các thắc mắc nội bộ vốn nằm trong thẩm quyền cấp dưới — cũng tầng bốn, giải pháp là quy định rõ danh mục việc cấp dưới được tự quyết, để họ không phải hỏi và mình không phải trả lời vặt. Anh/chị thấy: sau khi phân tầng, hai việc cuối — vốn ngốn rất nhiều thời gian — được chuyển đi, trả lại thời gian cho hai việc đầu.","hoatdong":"","tables":[{"title":"Nội dung trình bày trên slide","rows":[["Đầu việc","Tầng","Quyết định"],["Xây kế hoạch giảm tổn thất quý","T1 – Định hướng","Tự giữ"],["Phân công xử lý sự cố liên tổ KT–KD","T2 – Điều phối","Chủ trì, chốt tam giác trách nhiệm"],["Theo dõi tiến độ phiếu yêu cầu KH","T3 – Giám sát","Giám sát theo ngoại lệ (chỉ rà việc trễ)"],["Ký duyệt đề nghị vật tư nhỏ lặp lại","T4 – Thường xuyên","Phân quyền ký cho Phó/Tổ trưởng"],["Trả lời thắc mắc nội bộ trong thẩm quyền cấp dưới","T4 – Thường xuyên","Quy định danh mục việc cấp dưới tự quyết"]]}]},{"n":18,"title":"Đúc kết nội dung 3","part":"NỘI DUNG 3 · Phân tầng công việc — phương pháp & ví dụ minh họa","loai":"Giảng","dur":3,"content":["Nhịp điều hành = mạch đập của đơn vị (Ngày–Tuần–Tháng)","Phân tầng = xếp việc vào 4 tầng để biết GIỮ gì, GIAO gì","Giá trị: đúng việc đúng người, giải phóng thời gian, đội ngũ trưởng thành, tạo cơ sở cho nhịp"],"loithoai":"Đúc kết Nội dung 3. Ta đã làm rõ hai khái niệm gắn chặt nhau: nhịp điều hành là mạch đập đều đặn của đơn vị theo ngày, tuần, tháng; và phân tầng công việc là cách xếp các đầu việc vào bốn tầng — định hướng, điều phối, giám sát, thường xuyên — để biết việc nào phải giữ, việc nào nên giao. Phân tầng mang lại bốn giá trị: đúng việc đúng người, giải phóng thời gian cho việc quản lý thực sự, giúp đội ngũ trưởng thành, và tạo cơ sở để thiết kế nhịp vì mỗi tầng có chu kỳ riêng. Phương pháp chỉ ba bước — liệt kê, đặt hai câu hỏi, xếp tầng và quyết định — và anh/chị đã thấy nó vận hành qua ví dụ thực tế. Bây giờ, khi đã biết việc nào ở tầng nào, câu hỏi tiếp theo là: tổ chức các chu kỳ ngày, tuần, tháng cụ thể ra sao để vận hành chúng cho ăn khớp? Đó là Nội dung 4 — thiết kế nhịp điều hành và phối hợp liên bộ phận.\n\nNỘI DUNG 4: Thiết kế nhịp điều hành & phối hợp liên bộ phận\n\nChu kỳ Ngày–Tuần–Tháng · Tam giác trách nhiệm · Vì sao nhiều nhà quản lý xem nhẹ nhịp\n\nNội dung 4 là phần thực hành trọng tâm: thiết kế nhịp điều hành cụ thể và cơ chế phối hợp liên bộ phận. Đây là chỗ biến tư duy \"tạo nhịp\" thành những chu kỳ và quy ước dùng được ngay tại đơn vị. Ta sẽ đi qua: nhịp Ngày – Tuần – Tháng nên gồm gì, cách phối hợp liên tổ qua \"tam giác trách nhiệm\", một tình huống cho thấy giá trị của nhịp, và lý do vì sao nhiều người xem nhẹ nhịp cho đến khi gặp hậu quả.","hoatdong":"","callouts":["Cầu nối ND4: Đã biết việc nào ở tầng nào — giờ thiết kế chu kỳ Ngày/Tuần/Tháng để vận hành chúng."]},{"n":19,"title":"Khung nhịp điều hành ngày – tuần – tháng","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":["NGÀY – Giao ban 15 phút: 4 mục cố định — (1) Việc tồn (2) Việc mới + chốt (3) TNKH hôm nay (4) An toàn","TUẦN – Rà soát phối hợp: kiểm tra việc liên tổ có nghẽn ở đâu; rà KPI tuần; chốt việc tuần tới","THÁNG – Đánh giá & điều chỉnh: nhìn lại việc tồn, điểm nghẽn phối hợp, phàn nàn KH → điều chỉnh cơ chế + ghi nhận"],"loithoai":"Đây là khung nhịp điều hành chuẩn, ba chu kỳ lồng nhau. Nhịp NGÀY là buổi giao ban mười lăm phút với bốn mục cố định, không tùy hứng \"ai có gì nói nấy\": một, điểm lại việc tồn từ hôm trước; hai, việc mới hôm nay và chốt ngay ai làm, đầu ra gì, khi nào xong; ba — và đây là mục đặc trưng của ngành ta — một câu hỏi về trải nghiệm khách hàng, ví dụ \"hôm nay có phiếu nào tồn quá hạn, có phàn nàn nào cần xử lý\"; bốn, một nhắc nhở về an toàn. Bốn mục này gọn trong mười lăm phút nhưng đủ giữ cả đơn vị cùng nhịp. Nhịp TUẦN là buổi rà soát phối hợp: tập trung kiểm tra việc liên tổ có bị nghẽn ở đâu không, rà các chỉ tiêu tuần, và chốt trọng tâm tuần tới. Nhịp THÁNG là đánh giá và điều chỉnh: nhìn lại tháng qua việc tồn nhiều ở đâu, phối hợp nghẽn chỗ nào, khách hàng phàn nàn về điều gì — từ đó điều chỉnh cơ chế cho tháng sau và ghi nhận những cá nhân, tổ làm tốt. Ba nhịp này khớp với phân tầng: nhịp ngày lo việc tác nghiệp, nhịp tuần lo điều phối, nhịp tháng lo định hướng.","hoatdong":""},{"n":20,"title":"Thiết kế giao ban ngày có cấu trúc","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":[],"loithoai":"Đi sâu vào nhịp ngày, vì giao ban là nơi tạo nhịp quan trọng nhất. So sánh hai cách. Giao ban tùy hứng: kéo dài ba bốn mươi phút theo kiểu ai có gì nói nấy, việc trao đổi bằng miệng không chốt hạn, không nhắc gì đến khách hàng, và phụ thuộc hoàn toàn vào người chủ trì — Trưởng Điện lực vắng là không ai họp. Giao ban có cấu trúc: gói gọn mười lăm phút với bốn mục cố định; mỗi việc chốt rõ tên người phụ trách, đầu ra cần đạt và thời hạn; luôn có một câu hỏi về cảm nhận khách hàng để giữ TNKH trong tầm mắt hằng ngày; và ở mức cao hơn, cấp dưới tự chuẩn bị nội dung báo cáo theo mẫu, người quản lý chỉ kiểm tra những ngoại lệ. Khác biệt không phải ở chỗ họp dài hay ngắn, mà ở chỗ giao ban có cấu trúc tạo ra \"rõ việc – rõ trách nhiệm\" ngay từ đầu ngày, giảm hẳn việc phải nhắc lại về sau. Một mẹo nhỏ nhưng hiệu quả: dán mẫu bốn mục lên bảng phòng giao ban, để nhịp này thành thói quen chứ không phụ thuộc trí nhớ.","hoatdong":"","tables":[{"title":"Nội dung trình bày trên slide","rows":[["Giao ban tùy hứng","Giao ban có cấu trúc"],["30–40 phút \"ai có gì nói nấy\"","15 phút, 4 mục cố định"],["Việc nói miệng, không chốt hạn","Mỗi việc có tên người + đầu ra + hạn"],["Không có mục TNKH","Luôn có 1 câu hỏi về cảm nhận KH"],["Phụ thuộc Trưởng ĐL điều hành","Cấp dưới tự chuẩn bị, Trưởng ĐL kiểm ngoại lệ"]]}]},{"n":21,"title":"Phối hợp liên bộ phận: tam giác trách nhiệm","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":["Người chủ trì — chịu trách nhiệm chính, đảm bảo việc chạy đầu-cuối","Người phối hợp — hỗ trợ phần chuyên môn của tổ mình","Người phản hồi khách hàng — đầu mối duy nhất giao tiếp với KH","Nguyên tắc: mỗi việc liên tổ phải xác định đủ 3 vai → xóa \"vùng xám\", KH luôn có 1 đầu mối"],"loithoai":"Phần khó nhất của điều hành tuyến đầu là việc liên tổ — việc cần nhiều bộ phận cùng làm. Đây là nơi hay phát sinh \"vùng xám\": ai cũng tưởng người khác lo, kết quả là không ai lo, và khách hàng là người mắc kẹt ở giữa. Công cụ để xử lý là \"tam giác trách nhiệm\": với mỗi việc liên tổ, xác định rõ ba vai. Một, người chủ trì — chịu trách nhiệm chính, đảm bảo việc chạy từ đầu đến cuối, không để đứt đoạn. Hai, người phối hợp — hỗ trợ phần chuyên môn thuộc tổ mình khi được yêu cầu. Ba, người phản hồi khách hàng — đầu mối duy nhất giao tiếp với khách, để khách không phải kể đi kể lại với nhiều người. Ví dụ một yêu cầu cấp điện mới: tổ kinh doanh chủ trì và là đầu mối phản hồi khách, tổ kỹ thuật phối hợp khảo sát; ba vai rõ ràng thì việc không rơi vào khoảng trống. Nguyên tắc cốt lõi: bất kỳ việc nào có từ hai tổ trở lên đều phải chốt đủ ba vai này trước khi bắt đầu — đó là cách xóa vùng xám và đảm bảo khách hàng luôn có một đầu mối duy nhất.","hoatdong":""},{"n":22,"title":"Ví dụ tình huống: hiệu quả từ nhịp điều hành","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Demo","dur":3,"content":["Tình huống: Yêu cầu cấp điện bị chậm — tổ KD xử lý xong nhưng tổ KT không biết để khảo sát; KH gọi 3 lần hỏi tiến độ","Trước (không nhịp): việc kẹt giữa 2 tổ 4 ngày, KH bức xúc, không ai nắm toàn cảnh","Sau (có nhịp Tuần + tam giác trách nhiệm): rà soát tuần phát hiện điểm nghẽn → chốt \"chuyển VPĐT trong ngày\" + đầu mối phản hồi KH rõ → rút còn 1,5 ngày, KH được cập nhật chủ động"],"loithoai":"Một tình huống thật quen để thấy nhịp điều hành tạo ra khác biệt cụ thể thế nào. Tình huống: có yêu cầu cấp điện mới; tổ kinh doanh đã xử lý xong phần hồ sơ nhưng tổ kỹ thuật không biết để đi khảo sát, vì thông tin không được chuyển sang. Việc kẹt ở giữa, khách hàng gọi tới ba lần hỏi tiến độ mà mỗi lần lại được một người khác nhau trả lời chung chung. Trước, khi không có nhịp: việc nằm im giữa hai tổ tới bốn ngày, khách hàng bức xúc, và không ai nắm được toàn cảnh để xử lý. Sau, khi có nhịp tuần và tam giác trách nhiệm: buổi rà soát phối hợp hằng tuần phát hiện ngay điểm nghẽn \"việc liên tổ không được chuyển kịp\", người quản lý chốt một quy ước đơn giản — mọi hồ sơ liên tổ phải chuyển qua văn phòng điện tử trong ngày, và xác định rõ tổ kinh doanh là đầu mối phản hồi khách. Kết quả: thời gian xử lý rút từ bốn ngày xuống còn ngày rưỡi, và khách hàng được cập nhật chủ động thay vì phải gọi đi gọi lại. Đây chính là minh chứng: nhịp điều hành không phải thủ tục hình thức, mà là cái trực tiếp quyết định khách hàng được phục vụ nhanh hay chậm.","hoatdong":""},{"n":23,"title":"Vì sao nhiều nhà quản lý xem nhẹ nhịp điều hành","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":["\"Bận xử lý việc, không có thời gian cho nhịp\" → nghịch lý: càng không có nhịp càng bận","\"Nhịp là hình thức, họp hành mất giờ\" → nhầm giao ban có cấu trúc với họp dàn trải","\"Đơn vị nhỏ, mình nắm hết được\" → đúng đến khi địa bàn rộng ra/mình vắng mặt","\"Vẫn chạy được mà\" → chạy được nhờ gồng sức người, không bền; hệ quả lộ ra khi có sự cố/áp lực cao"],"loithoai":"Một câu hỏi thẳng thắn: nếu nhịp điều hành quan trọng đến vậy, vì sao nhiều người vẫn xem nhẹ? Bốn lý do thường gặp. Thứ nhất, \"tôi bận xử lý việc, lấy đâu thời gian lo nhịp\" — đây là nghịch lý lớn nhất: chính vì không có nhịp nên mới bận, vì việc gì cũng phải tự nhắc, tự đôn đốc; bỏ chút thời gian dựng nhịp lại tiết kiệm thời gian về sau. Thứ hai, \"nhịp là hình thức, họp hành mất giờ\" — đây là nhầm lẫn giữa giao ban có cấu trúc mười lăm phút với những cuộc họp dàn trải; nhịp tốt là tinh gọn, không phải họp nhiều. Thứ ba, \"đơn vị tôi nhỏ, tôi nắm hết được\" — điều này đúng cho tới khi địa bàn mở rộng sau sáp nhập, hoặc tới ngày mình phải đi vắng; lúc đó cái \"nắm hết bằng trí nhớ\" sụp đổ. Thứ tư, \"lâu nay vẫn chạy được mà\" — vâng, chạy được, nhưng là nhờ gồng sức con người chứ không nhờ cơ chế, nên không bền. Điểm chung của cả bốn: cái giá của việc thiếu nhịp thường bị ẩn đi trong ngày thường, và chỉ lộ ra vào đúng lúc xấu nhất — khi có sự cố lớn, khi áp lực cao điểm, hoặc khi một khiếu nại của khách hàng bùng lên. Người quản lý chuyên nghiệp dựng nhịp trước, để không phải trả cái giá đó.","hoatdong":"","callouts":["Callout: Nhịp điều hành thường bị xem nhẹ cho đến khi cái giá của việc thiếu nó hiện ra — thường là qua một sự cố hoặc một khiếu nại."]},{"n":24,"title":"Nhịp điều hành gắn với trải nghiệm khách hàng","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":["Giao ban có mục TNKH → phát hiện phiếu tồn/phàn nàn sớm → xử lý trước khi thành khiếu nại","Tam giác trách nhiệm rõ → KH có 1 đầu mối, không phải kể lại nhiều lần (Zero Repeat)","Nhịp tuần rà phối hợp → giảm việc kẹt liên tổ → rút thời gian phục vụ KH"],"loithoai":"Khép phần thiết kế nhịp bằng việc nối thẳng nó với trải nghiệm khách hàng — vì đó là lý do cuối cùng của mọi cải tiến nội bộ. Ba liên hệ rất rõ. Một, khi giao ban có mục về khách hàng, anh/chị phát hiện sớm phiếu tồn, phàn nàn đang nhen nhóm, và xử lý trước khi nó bùng thành khiếu nại — phòng bệnh thay vì chữa bệnh. Hai, khi tam giác trách nhiệm rõ ràng, khách hàng luôn có một đầu mối duy nhất, không phải kể lại vấn đề của mình cho người thứ hai, thứ ba — đây đúng tinh thần nguyên tắc \"không để khách hàng làm công việc của EVN\", không bắt khách lặp lại. Ba, khi nhịp tuần rà soát phối hợp đều đặn, việc kẹt liên tổ được khơi thông sớm, thời gian phục vụ khách hàng được rút ngắn. Một ý cần nhớ: trải nghiệm khách hàng vừa là \"quả\" vừa là \"nhân\". Là quả, vì nó là kết quả tự nhiên của điều hành nội bộ tốt. Là nhân, vì khi anh/chị lấy cảm nhận khách hàng làm thước đo hằng ngày, nó trở thành động lực để giữ nhịp — một vòng tích cực: điều hành tốt thì khách hài lòng, khách hài lòng thì bớt phàn nàn, bớt phàn nàn thì có thêm thời gian điều hành tốt hơn nữa.","hoatdong":"","callouts":["Callout đỏ: TNKH vừa là \"quả\" (kết quả của điều hành tốt) vừa là \"nhân\" (động lực để giữ nhịp)."]},{"n":25,"title":"Đúc kết nội dung 4","part":"NỘI DUNG 4 · Thiết kế nhịp điều hành & phối hợp liên bộ phận","loai":"Giảng","dur":3,"content":["Nhịp điều hành = khung Ngày (giao ban 4 mục) – Tuần (rà phối hợp) – Tháng (đánh giá & điều chỉnh)","Phối hợp liên tổ = tam giác trách nhiệm (chủ trì – phối hợp – phản hồi KH) → xóa vùng xám","Nhịp thường bị xem nhẹ đến khi gặp hậu quả — dựng nhịp trước, đừng đợi sự cố","Nhịp tốt → TNKH tốt; TNKH vừa là quả vừa là nhân"],"loithoai":"Đúc kết Nội dung 4. Ta đã có một khung nhịp điều hành dùng được ngay: nhịp ngày là giao ban mười lăm phút bốn mục, nhịp tuần là rà soát phối hợp liên tổ, nhịp tháng là đánh giá và điều chỉnh cơ chế. Ta có công cụ phối hợp liên bộ phận là tam giác trách nhiệm — chủ trì, phối hợp, phản hồi khách hàng — để xóa vùng xám và đảm bảo khách luôn có một đầu mối. Ta cũng nhìn thẳng vào lý do nhịp hay bị xem nhẹ, và rút ra: hãy dựng nhịp trước, đừng đợi một sự cố hay một khiếu nại buộc mình phải làm. Và xuyên suốt, nhịp điều hành tốt dẫn tới trải nghiệm khách hàng tốt — TNKH vừa là quả vừa là nhân. Lý thuyết và ví dụ đã đủ; bây giờ là phần quan trọng nhất với mỗi anh/chị: thực hành cải tiến chính nhịp điều hành tại đơn vị mình. Đó là Nội dung 5.\n\nNỘI DUNG 5: Thực hành xây dựng & cải tiến nhịp điều hành tại đơn vị\n\nTự đánh giá nhịp hiện tại · Thiết kế nhịp cải tiến · Video phân tích · Cam kết 30 ngày\n\nNội dung 5 là phần thực hành — nơi anh/chị biến những gì vừa học thành một sản phẩm cụ thể cho chính đơn vị mình. Chúng ta sẽ làm ba việc: tự đánh giá nhịp điều hành hiện tại, phác thảo một nhịp cải tiến, và xem một video phân tích nhịp giao ban mẫu tại Điện lực để tham khảo. Kết thúc, mỗi anh/chị chọn một thay đổi ưu tiên để cam kết triển khai trong ba mươi ngày.","hoatdong":"","callouts":["Cầu nối ND5: Giờ anh/chị thực hành cải tiến chính nhịp điều hành tại đơn vị mình."]},{"n":26,"title":"Bước 1: tự đánh giá nhịp điều hành hiện tại","part":"NỘI DUNG 5 · Thực hành xây dựng & cải tiến nhịp điều hành tại đơn vị","loai":"Giảng","dur":8,"content":["Mức 1 – Theo kinh nghiệm: chưa có giao ban cố định, cần thì gọi họp","Mức 2 – Có ý thức: có giao ban nhưng \"ai có gì nói nấy\", chưa cấu trúc","Mức 3 – Có cơ chế: giao ban 15p có cấu trúc 4 mục, rõ việc rõ trách nhiệm","Mức 4 – Chuyên nghiệp: cấu trúc + cấp dưới tự chuẩn bị + kiểm soát theo ngoại lệ → đơn vị tự vận hành"],"loithoai":"Bước một là tự soi lại đơn vị mình đang ở đâu, qua bốn mức trình độ điều hành. Mức một — theo kinh nghiệm: chưa có giao ban cố định, khi cần thì gọi họp; việc dễ bị bỏ sót, mọi thứ phụ thuộc trí nhớ người quản lý. Mức hai — có ý thức: đã có giao ban nhưng kiểu \"ai có gì nói nấy\", chưa có cấu trúc, nên có nhịp mà chưa hiệu quả, vẫn phải nhắc lại nhiều. Mức ba — có cơ chế: giao ban mười lăm phút theo cấu trúc bốn mục, rõ việc rõ trách nhiệm, nhắc việc giảm hẳn. Mức bốn — chuyên nghiệp: ngoài cấu trúc, cấp dưới tự chuẩn bị nội dung, người quản lý chỉ kiểm tra ngoại lệ, đơn vị tự vận hành kể cả khi Trưởng Điện lực vắng. Tôi đề nghị anh/chị thành thật xác định đơn vị mình đang ở mức nào — không có gì phải ngại, phần lớn xuất phát ở mức một hoặc hai. Điều quan trọng không phải đang ở đâu, mà là bước kế tiếp để lên một mức là gì. Hãy ghi ra một câu trả lời cho riêng mình.","hoatdong":"","callouts":["Câu hỏi: Đơn vị anh/chị đang ở mức nào? Một bước lên mức kế tiếp là gì?"]},{"n":27,"title":"Bước 2: thiết kế nhịp cải tiến (mẫu phiếu thực hành)","part":"NỘI DUNG 5 · Thực hành xây dựng & cải tiến nhịp điều hành tại đơn vị","loai":"Giảng","dur":8,"content":[],"loithoai":"Bước hai, anh/chị phác thảo một nhịp cải tiến cho đơn vị mình, theo mẫu phiếu này. Không cần làm hoàn hảo, chỉ cần cụ thể và làm được. Với giao ban ngày: ghi thực trạng hiện tại, rồi đề xuất — họp mấy giờ, có áp dụng bốn mục không, và quan trọng là ai chủ trì khi mình vắng để nhịp không đứt. Với rà soát tuần: chọn một buổi cố định trong tuần và xác định rà cái gì — thường là điểm nghẽn liên tổ và việc tồn. Với việc liên tổ: chọn một loại việc hay phát sinh vùng xám — ví dụ cấp điện mới, hoặc xử lý khiếu nại — và áp tam giác trách nhiệm cho nó. Với mục TNKH: nghĩ một câu hỏi đơn giản để thêm vào giao ban mỗi sáng. Và cuối cùng, rất cụ thể: chọn đúng một việc tầng bốn mà lâu nay anh/chị vẫn ôm, quyết định giao cho ai và kèm cơ chế báo lại gì. Nếu chỉ làm được một dòng trong phiếu này một cách thực chất, đơn vị anh/chị đã tốt lên rồi. Anh/chị dành ít phút điền, sau đó vài người chia sẻ để cả lớp cùng học.","hoatdong":"","tables":[{"title":"Nội dung trình bày trên slide","rows":[["Hạng mục","Hiện tại","Cải tiến (đề xuất)"],["Giao ban ngày","(mô tả thực trạng)","Mấy giờ? 4 mục? Ai chủ trì khi mình vắng?"],["Rà soát tuần","…","Thứ mấy? Rà gì?"],["Việc liên tổ","…","Áp dụng tam giác trách nhiệm cho loại việc nào?"],["Mục TNKH","…","Thêm 1 câu hỏi KH vào giao ban thế nào?"],["1 việc tầng 4 sẽ giao đi","…","Giao cho ai + cơ chế báo lại?"]]}]},{"n":28,"title":"Học liệu video: phân tích nhịp điều hành mẫu","part":"NỘI DUNG 5 · Thực hành xây dựng & cải tiến nhịp điều hành tại đơn vị","loai":"Demo","dur":6,"content":["Video: Phân tích một nhịp điều hành mẫu tại Điện lực — họp giao ban → phân công → theo dõi → phản hồi","4 khoảnh khắc quan sát: (1) cách mở giao ban theo 4 mục (2) cách chốt việc kèm người–hạn (3) cách cấp dưới báo lại trong ngày (4) cách đưa mục TNKH vào"],"loithoai":"Để phần thực hành có hình mẫu tham khảo, chúng ta xem một video phân tích chuyên sâu, khoảng bốn đến năm phút, mổ xẻ một nhịp điều hành mẫu tại Điện lực — đi trọn vòng từ họp giao ban, phân công, theo dõi, đến phản hồi. Khi xem, anh/chị chú ý bốn khoảnh khắc. Một, cách người chủ trì mở giao ban theo đúng bốn mục — việc tồn, việc mới, TNKH, an toàn — gọn và rõ. Hai, cách chốt mỗi việc kèm tên người và thời hạn, không để việc nói miệng trôi đi. Ba, cách cấp dưới chủ động báo lại tiến độ trong ngày theo quy ước, không cần ai gọi nhắc. Bốn, cách mục trải nghiệm khách hàng được lồng vào một cách tự nhiên, không phải khẩu hiệu mà là một câu hỏi cụ thể. Video này không phải khuôn mẫu duy nhất đúng, chỉ là một cách làm có giá trị tham khảo. Sau khi xem, ta thảo luận ba câu: khâu nào trong video đơn vị mình đã làm tốt, khâu nào còn thiếu, và một điều cụ thể có thể áp dụng ngay tuần tới. Mục tiêu là mỗi anh/chị rời lớp với ít nhất một ý tưởng dùng được liền.","hoatdong":"","callouts":["Câu hỏi dẫn thảo luận sau video: Khâu nào trong video đơn vị mình làm tốt rồi? Khâu nào còn thiếu? Một điều có thể áp dụng ngay tuần tới?"]},{"n":29,"title":"Đúc kết chuyên đề","part":"NỘI DUNG 5 · Thực hành xây dựng & cải tiến nhịp điều hành tại đơn vị","loai":"Giảng","dur":3,"content":["Tóm tắt hành trình: Yêu cầu mới → Tạo xung/nhịp/lực → Phân tầng → Thiết kế nhịp → Thực hành","Nguyên tắc bao trùm (băng đỏ): Điều hành có nhịp — đơn vị tự vận hành, khách hàng cảm nhận sự ổn định.","Cam kết: mỗi học viên chọn 01 thay đổi ưu tiên trong điều hành sẽ triển khai trong 30 ngày","Định hướng: thay đổi này sẽ được nhìn lại tại hội thảo trực tuyến sau đào tạo","Tiếp theo: CĐ2b — Gắn điều hành nội bộ với nâng cao trải nghiệm khách hàng"],"loithoai":"Chúng ta khép lại Chuyên đề 2a. Nhìn lại hành trình: bắt đầu từ yêu cầu mới đặt ra cho quản lý cấp 4 trong bối cảnh tái cơ cấu; đi qua tư duy nền tạo xung – tạo nhịp – tạo lực; học hai công cụ thực hành cốt lõi là phân tầng công việc và thiết kế nhịp điều hành với tam giác trách nhiệm; và vừa thực hành cải tiến nhịp ngay trên đơn vị mình. Nguyên tắc bao trùm gói trong một câu: điều hành có nhịp thì đơn vị tự vận hành, và khi đơn vị vận hành ổn định, khách hàng là người cảm nhận rõ nhất sự tin cậy đó. Bây giờ, điều quan trọng nhất để chuyên đề này không dừng ở nhận thức: mỗi anh/chị chọn đúng một thay đổi ưu tiên trong điều hành — có thể là cấu trúc lại giao ban sáng, có thể là áp tam giác trách nhiệm cho một loại việc, có thể là giao đi một việc tầng bốn mình vẫn ôm — và cam kết triển khai trong ba mươi ngày tới. Thay đổi này sẽ được chúng ta cùng nhìn lại tại hội thảo trực tuyến sau đào tạo, để xem áp dụng vào thực tế ra sao và tháo gỡ vướng mắc. Và ở Chuyên đề 2b tiếp theo, chúng ta sẽ đi sâu hơn vào sợi chỉ đỏ xuyên suốt hôm nay: gắn điều hành nội bộ với nâng cao trải nghiệm khách hàng. Cảm ơn anh/chị.","hoatdong":""}],"prep":["Nâng cao năng lực điều hành quản lý công việc tại Điện lực","Thời lượng: 75 phút giảng + 30 phút thảo luận","Tài liệu chuẩn: 3. CĐ2a. Nâng cao năng lực điều hành.docx","Chuẩn bị phiếu thực hành nhịp điều hành và tình huống phối hợp liên tổ.","Giữ nguyên cấu trúc card/bullet/bảng để giảng viên đọc theo từng slide."],"prompts12":[],"checklist":[["Hạng mục","Cách kiểm tra"],["Đúng nguồn Word","Đối chiếu số slide, tiêu đề, nội dung, lời thoại"],["Đúng thiết kế","Giữ card, bullet, bảng, chip, callout"],["Đúng vận hành","Có route, build xanh, không lỗi mã hóa"]],"vung":[["Nhóm","Nội dung","Ghi chú"],["CĐ2a","Điều hành quản lý công việc","Theo file Word chuẩn"]],"andanh":[["Nguồn","Cách xử lý"],["3. CĐ2a. Nâng cao năng lực điều hành.docx","Trích nội dung vào HTML, giữ file Word làm bản gốc"]],"tomtat":[],"mau4":[],"framework":[["Phần","Số slide","Mục tiêu học tập","Hoạt động chính","Sản phẩm đầu ra","Thời lượng"],["Mở đầu","3","Nắm ý chính và áp dụng vào điều hành tại đơn vị.","Giảng ngắn, phân tích ví dụ, trao đổi và thực hành theo phiếu.","Một điểm cải tiến nhịp điều hành hoặc phối hợp có thể áp dụng.","14′"],["NỘI DUNG 1 · Yêu cầu mới & các trục năng lực điều hành chuyên nghiệp","5","Nắm ý chính và áp dụng vào điều hành tại đơn vị.","Giảng ngắn, phân tích ví dụ, trao đổi và thực hành theo phiếu.","Một điểm cải tiến nhịp điều hành hoặc phối hợp có thể áp dụng."," const ORIENTATION={"title": "CHUYÊN ĐỀ ĐỊNH HƯỚNG", "subtitle": "Nền tảng lãnh đạo và quản trị chuyên nghiệp trong bối cảnh mới", "duration": "Thời lượng: 45 phút", "sourceFile": "1. CĐ Định hướng.docx", "items": [{"type": "heading", "text": "1. Mục tiêu chuyên đề"}, {"type": "p", "text": "Sau chuyên đề, học viên có thể:"}, {"type": "p", "text": "Nhận diện ba chuyển biến lớn (tổ chức – chuyển đổi số – kỳ vọng khách hàng) đang tác động trực tiếp đến công việc điều hành hằng ngày;"}, {"type": "p", "text": "Phân biệt hai cách tiếp cận quản lý sự vụ và quản trị chuyên nghiệp qua các biểu hiện cụ thể;"}, {"type": "p", "text": "Tiếp cận ba trụ cột quản trị chuyên nghiệp — Mục tiêu, Dữ liệu, Con người — và năm định hướng năng lực của giai đoạn mới;"}, {"type": "p", "text": "Tự soi chiếu cách điều hành hiện tại của bản thân so với các định hướng đó;"}, {"type": "p", "text": "Định vị lộ trình toàn khóa, ba chủ đề chủ đạo và yêu cầu đầu ra để chuẩn bị tâm thế học tập."}, {"type": "heading", "text": "2. Khởi động: Một ngày của hai người quản lý (8 phút)"}, {"type": "p", "text": "Tương tác học viên với Mentimeter (Vevents 1)"}, {"type": "p", "text": "Giảng viên hỏi cả lớp (giơ tay hoặc Mentimeter): “Một ngày làm việc điển hình của anh/chị, bao nhiêu phần trăm thời gian dành cho việc phát sinh, chữa cháy?”"}, {"type": "p", "text": "A. Dưới 30%    B. 30–50%    C. 50–70%    D. Trên 70%"}, {"type": "p", "text": "Kết quả dự kiến: Giảng viên không bình luận đúng/sai, chỉ ghi nhận: “Chúng ta cùng giữ con số này trong đầu đến cuối buổi.”"}, {"type": "p", "text": "Kể chuyện đối chiếu: Anh A và Chị B"}, {"type": "p", "text": "Giảng viên phác họa nhanh hai nhân vật cùng quy mô đơn vị (~20 nhân viên), cùng năng lực, nhưng khác nhau ở cách tổ chức công việc:"}, {"type": "table", "rows": [["ANH A — điều hành theo sự vụ", "CHỊ B — điều hành theo hệ thống"], ["7h30: mở điện thoại — 20 tin nhắn, 10 email, trả lời từng cái.9h: có sự cố, tự xuống hiện trường vì không yên tâm giao ai.11h: tự cầm máy xử lý khiếu nại.Chiều họp: phát biểu bằng cảm nhận, chưa kịp chuẩn bị số liệu.19h mới về. Tận tâm, chịu khó — nhưng luôn quá tải.", "7h30: nhìn bảng chỉ số tuần.7h45: giao ban 15 phút — mỗi đầu mối báo 1 phút việc hôm nay, điểm cần chú ý.9h: sự cố — giao đầu mối phụ trách, chốt điểm báo lại 10h. Không phải xuống hiện trường.11h: xem lịch sử khách trên hệ thống, đưa chuyên viên trả lời theo kịch bản chuẩn.17h về đúng giờ. Hôm sau đơn vị vẫn chạy tốt."]]}, {"type": "p", "text": "Thông điệp giảng viên: “Khác biệt giữa Anh A và Chị B không nằm ở năng lực hay sự tận tâm — cả hai đều giỏi. Khác biệt nằm ở cách tổ chức công việc. Anh A giải quyết sự vụ; Chị B thiết kế hệ thống. Buổi học hôm nay trả lời câu hỏi: điều gì tạo nên khác biệt đó, và vì sao bối cảnh mới đòi hỏi cách làm của Chị B.”"}, {"type": "heading", "text": "3. Ba chuyển biến đang định hình lại công việc điều hành (9 phút)"}, {"type": "p", "text": "Giảng viên dẫn dắt: cách làm của Anh A từng rất hiệu quả — nhưng môi trường vận hành đã thay đổi. Có ba chuyển biến diễn ra đồng thời, và người quản lý cấp trung là người chịu tác động trực tiếp nhất."}, {"type": "table", "rows": [["Chuyển biến", "Biểu hiện", "Tác động lên người quản lý"], ["1. Tổ chức", "Mô hình quản lý 2 cấp; sắp xếp lại bộ máy; địa bàn rộng hơn, nhiều đầu mối phối hợp hơn.", "Khối lượng và độ phức tạp tăng — trí nhớ cá nhân không còn theo kịp."], ["2. Chuyển đổi số", "Các nền tảng nội bộ, hệ thống chuyên ngành, ứng dụng hiện trường và AI đi vào vận hành.", "Câu hỏi chuyển từ “có dữ liệu không” sang “có biết khai thác dữ liệu để ra quyết định không”."], ["3. Kỳ vọng khách hàng", "Khách so sánh trải nghiệm điện với ngân hàng, TMĐT, viễn thông; mạng xã hội lan tin nhanh.", "Đòi hỏi minh bạch, phản hồi nhanh, cam kết thời gian — TNKH thành thước đo điều hành."]]}, {"type": "p", "text": "Câu hỏi tương tác (hỏi và mời học viên phát biểu ngay tại lớp): “Trong ba chuyển biến này, chuyển biến nào đang gây áp lực lớn nhất cho đơn vị anh/chị lúc này?”; mời 2–3 học viên chia sẻ nhanh, không phân tích sâu."}, {"type": "p", "text": "Chốt: Ba chuyển biến không xảy ra tuần tự mà đồng thời. Hiểu bức tranh chung giúp anh/chị định vị áp lực hiện tại và chọn cách thích ứng — thay vì chỉ phản ứng với từng việc rời rạc."}, {"type": "heading", "text": "4. Từ quản lý sự vụ sang quản trị chuyên nghiệp (10 phút)"}, {"type": "p", "text": "Năm biểu hiện của quản lý sự vụ"}, {"type": "p", "text": "Giảng viên nêu nhanh năm biểu hiện, mời học viên thầm đối chiếu với bản thân:"}, {"type": "p", "text": "Ôm việc vì “không tin ai làm được”;"}, {"type": "p", "text": "Nhắc việc liên tục vì không có cơ chế tự kiểm tra;"}, {"type": "p", "text": "Chữa cháy liên tục vì không có phòng ngừa;"}, {"type": "p", "text": "Quyết định theo cảm tính vì không có dữ liệu đối chiếu;"}, {"type": "p", "text": "Không có gì để đối thoại với cấp trên ngoài báo cáo định tính."}, {"type": "p", "text": "Ba trụ cột của quản trị chuyên nghiệp"}, {"type": "table", "rows": [["Trụ cột", "Bản chất", "Ví dụ tại Điện lực"], ["MỤC TIÊU", "Mỗi việc trả lời: đạt kết quả gì? đo bằng gì? ai chịu trách nhiệm cuối cùng?", "“Giảm tỷ lệ khiếu nại lặp lại xuống dưới 2% trong quý”, có đầu mối, có thời hạn."], ["DỮ LIỆU", "Bằng chứng khách quan hỗ trợ quyết định hằng ngày, không phải báo cáo cuối tháng.", "Tra hệ thống KH: khiếu nại theo nguyên nhân, khu vực, nhân viên tiếp nhận."], ["CON NGƯỜI", "Con người vừa là nguồn lực vừa là mục đích; quyết định tốt vừa xong việc vừa phát triển người.", "Giao việc khó cho NV tiềm năng kèm hướng dẫn — việc xong, người trưởng thành."]]}, {"type": "p", "text": "Nhấn mạnh: ba trụ cột liên kết chặt. Có mục tiêu mà thiếu dữ liệu thì theo dõi thiếu căn cứ; có dữ liệu mà không đầu tư con người thì đội ngũ không đủ sức dùng dữ liệu; có đội ngũ giỏi mà thiếu mục tiêu thì công sức phân tán. Phải phát triển song song."}, {"type": "p", "text": "Thông điệp: Chuyển dịch tư duy không phủ định kinh nghiệm, quan hệ, sự tận tâm — những giá trị đó cần được giữ. Nó bổ sung thêm một tầng: hệ thống, cấu trúc, dữ liệu và tính bền vững, để những gì đã có phát huy tốt hơn trong bối cảnh mới."}, {"type": "heading", "text": "5. Năm định hướng năng lực & lộ trình toàn khóa (10 phút)"}, {"type": "p", "text": "Năm định hướng năng lực của giai đoạn mới"}, {"type": "p", "text": "Định hướng 1 — Điều hành có cơ chế song song với xử lý sự vụ — nhịp giao ban cố định, quy tắc đầu mối–thời hạn–báo lại, điểm kiểm tra giữa chu kỳ."}, {"type": "p", "text": "Định hướng 2 — Dùng dữ liệu hỗ trợ ra quyết định — đặt câu hỏi vào dữ liệu sẵn có; dữ liệu bổ sung cho trực giác, không thay thế."}, {"type": "p", "text": "Định hướng 3 — Phát triển đội ngũ song song hoàn thành công việc — giao việc gắn phát triển, phản hồi tại chỗ, huấn luyện qua công việc."}, {"type": "p", "text": "Định hướng 4 — Ứng dụng công cụ số và AI đúng vai trò — AI lo tác vụ hành chính lặp lại; thời gian tiết kiệm dành cho hiện trường và con người. AI đề xuất – người quản lý quyết định."}, {"type": "p", "text": "Định hướng 5 — Gắn điều hành nội bộ với trải nghiệm khách hàng (TNKH) — rà soát mỗi quyết định qua câu hỏi “khách hàng sẽ cảm nhận thế nào”."}, {"type": "p", "text": "Liên kết: Cơ chế vận hành trên nền dữ liệu → dữ liệu cần đội ngũ đủ năng lực → đội ngũ hiệu quả hơn khi có công cụ số → đích đến cuối cùng của cả hệ thống là TNKH."}, {"type": "p", "text": "Lộ trình toàn khóa & yêu cầu đầu ra"}, {"type": "p", "text": "Giảng viên trình bày cách năm định hướng được triển khai qua ba chuyên đề chuyên môn:"}, {"type": "table", "rows": [["Chuyên đề", "Nội dung", "Giá trị cốt lõi"], ["CĐ 1", "Ứng dụng AI hiệu quả trong công tác quản lý", "AI giúp có THÊM THỜI GIAN — giảm việc hành chính lặp lại."], ["CĐ 2a", "Nâng cao năng lực quản trị công việc trên nền dữ liệu", "Cơ chế giúp đơn vị TỰ VẬN HÀNH — không phụ thuộc một người."], ["CĐ 2b", "Gắn điều hành nội bộ với nâng cao TNKH", "Nâng cao TNKH trong công việc của tuyến đầu"], ["CĐ 3a & CĐ 3b", "Đào tạo, huấn luyện và kèm cặp nhân viên qua công việc", "Huấn luyện giúp ĐỘI NGŨ TRƯỞNG THÀNH — giảm tải bền vững."]]}, {"type": "p", "text": "Vòng xoáy đi lên: AI giải phóng thời gian → có thời gian huấn luyện → cơ chế tạo nhịp → đội ngũ giỏi hơn → TNKH tốt hơn → ít phàn nàn → có thời gian lãnh đạo → tiếp tục đi lên."}, {"type": "heading", "text": "6. Tự soi chiếu & cam kết tâm thế (8 phút)"}, {"type": "p", "text": "Năm câu hỏi tự soi chiếu cho mỗi học viên"}, {"type": "p", "text": "Giảng viên mời cả lớp tạm dừng, tự trả lời — không cần viết ra, chỉ cần thành thật với chính mình:"}, {"type": "p", "text": "Câu 1: Một ngày điển hình, bao nhiêu % thời gian dành cho việc phát sinh, bao nhiêu % cho việc quan trọng nhưng không gấp?"}, {"type": "p", "text": "Câu 2: Lần gần nhất ra một quyết định quan trọng, anh/chị có tra cứu dữ liệu trước khi quyết định không?"}, {"type": "p", "text": "Câu 3: Trong đội ngũ hiện tại, có ai đủ năng lực thay anh/chị xử lý phần lớn công việc nếu anh/chị vắng một tuần không?"}, {"type": "p", "text": "Câu 4: Anh/chị đã từng thử dùng AI để hỗ trợ một tác vụ công việc nào chưa?"}, {"type": "p", "text": "Câu 5: Lần gần nhất ra một quyết định điều hành, anh/chị có nghĩ đến tác động tới khách hàng không?"}, {"type": "p", "text": "Liên hệ Phần 1: Giảng viên nhắc lại con số poll đầu buổi — “Con số đó chính là câu trả lời cho câu hỏi thứ nhất. Năm câu này không để tự phê bình, mà để định vị bản thân trước khi bước vào các chuyên đề.”"}, {"type": "p", "text": "Thông điệp kết:"}, {"type": "p", "text": "“Chương trình đào tạo này chỉ là một phần của quá trình thay đổi. Phần quan trọng còn lại nằm ở tâm thế học hỏi và mức độ áp dụng vào công việc thực tế của mỗi anh/chị. Anh/chị hoàn toàn có thể bắt đầu vòng xoáy đi lên này ngay từ tuần tới — không cần xin phép ai, không cần chờ hệ thống mới.”"}]};
let state={view:'overview',slide:1};

/* ---------- NAV ---------- */
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  nav.appendChild(el('div','nav-sec','Tổng quan & tài nguyên'));
  [['overview','📋 Agenda tổng quan'],
   ['orientation','🧭 Chuyên đề định hướng'],
   ['prompts','🗂 Bộ 12 prompt sổ tay'],
   ['mau','⚖ 4 prompt mẫu (tốt / chưa tốt)'],
   ['check','🔒 Checklist & bảo mật'],
   ['guide','🎯 Cẩm nang hoạt động'],
   ['quiz','📝 Trắc nghiệm kiểm tra']].forEach(([v,t])=>{
    const a=el('a','',`<span class="tt">${t}</span>`);a.dataset.v=v;a.onclick=()=>go(v);nav.appendChild(a);
  });
  PARTS.forEach(p=>{
    nav.appendChild(el('div','nav-sec',esc(p)));
    DATA.slides.filter(s=>s.part===p).forEach(s=>{
      const a=el('a','',`<span class="sn">${s.n}</span><span class="tt">${esc(s.title)}</span><span class="dur">${s.dur}′</span>`);
      a.dataset.slide=s.n;a.onclick=()=>goSlide(s.n);nav.appendChild(a);
    });
  });
}
function setActive(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  let a= state.view==='slide' ? document.querySelector(`.nav a[data-slide="${state.slide}"]`)
                              : document.querySelector(`.nav a[data-v="${state.view}"]`);
  if(a)a.classList.add('active');
}
function go(v){state.view=v;state.slide=null;render();closeNav();window.scrollTo(0,0);}
function goSlide(n){state.view='slide';state.slide=n;render();closeNav();window.scrollTo(0,0);}


/* ---------- ORIENTATION ---------- */
function renderOrientation(){
  const m=$('#main');m.innerHTML='';
  m.appendChild(el('div','eyebrow','Chương trình QL01A · Chuyên đề định hướng'));
  m.appendChild(el('h2','page',esc(ORIENTATION.title)));
  m.appendChild(el('p','sub',esc(ORIENTATION.subtitle)));
  const mb=el('div','metabar');
  const durationLabel=String(ORIENTATION.duration || '').replace('Thời lượng:', '').trim();
  mb.innerHTML=`<span class="chip red">Thời lượng <b>${esc(durationLabel)}</b></span>
    <span class="chip blue"><b>Nền tảng lãnh đạo</b></span>
    <span class="chip green">Mở tâm thế trước CĐ01</span>
    <span class="chip">File: ${esc(ORIENTATION.sourceFile)}</span>`;
  m.appendChild(mb);
  let card=null;
  let list=null;
  const flush=()=>{if(card){m.appendChild(card);card=null;}};
  const flushList=()=>{if(list&&card){card.appendChild(list);list=null;}};
  const isBulletLike=(text)=>{
    return /^(Nhận diện|Phân biệt|Tiếp cận|Tự soi chiếu|Định vị|Ôm việc|Nhắc việc|Chữa cháy|Quyết định|Không có gì|Định hướng \d|Câu \d|CĐ \d|Vòng xoáy)/.test(text);
  };
  const isNote=(text)=>/^(Kết quả dự kiến|Chốt:|Nhấn mạnh:|Liên kết:|Liên hệ Phần 1:)/.test(text);
  const isQuestion=(text)=>/^(Giảng viên hỏi|Câu hỏi tương tác)/.test(text);
  const isMiniTitle=(text)=>{
    return /^(Tương tác học viên|Kể chuyện đối chiếu|Năm biểu hiện|Ba trụ cột|Năm định hướng|Lộ trình toàn khóa|Năm câu hỏi)/.test(text);
  };
  const appendBullet=(text)=>{
    if(!list) list=el('div','bullet-card','<ul></ul>');
    list.querySelector('ul').appendChild(el('li','',esc(text)));
  };
  const appendParagraph=(text)=>{
    flushList();
    const p=el('p','lead',esc(text));
    card.appendChild(p);
  };
  const ensureCard=(title)=>{
    flushList();
    if(card) m.appendChild(card);
    card=el('div','card');
    card.appendChild(el('h3','',`<span class="ic" style="background:var(--red)">i</span>${esc(title)}`));
  };
  ORIENTATION.items.forEach((item, index)=>{
    if(item.type==='heading'){
      ensureCard(item.text);
      return;
    }
    if(!card) ensureCard('Nội dung định hướng');
    if(item.type==='table'){
      flushList();
      const table=el('table');
      const rows=item.rows||[];
      const formatCell=(cell)=>esc(cell)
        .replace(/\.(?=(?:9h|11h|19h|7h45|17h))/g,'.<br>')
        .replace(/\.(?=[A-Z])/g,'.<br>')
        .replace(/(10h\.)(?= Kh)/g,'$1<br>')
        .replace(/((?:19h|17h)[^<]*)$/g,'<span class="strong-line">$1</span>');
      table.innerHTML=rows.map((row,idx)=>'<tr>'+row.map((cell)=>idx===0?`<th>${esc(cell)}</th>`:`<td>${formatCell(cell)}</td>`).join('')+'</tr>').join('');
      card.appendChild(table);
      return;
    }
    if(item.text==='Thông điệp kết:'){
      flushList();
      const next=ORIENTATION.items[index+1];
      const box=el('div','message-box',`<div class="message-title">${esc(item.text.replace(':',''))}</div><p>${esc(next&&next.type==='p'?next.text:'')}</p>`);
      card.appendChild(box);
      return;
    }
    if(index>0 && ORIENTATION.items[index-1].text==='Thông điệp kết:') return;
    if(isMiniTitle(item.text)){
      flushList();
      card.appendChild(el('div','mini-title',esc(item.text)));
      return;
    }
    if(isQuestion(item.text)){
      flushList();
      card.appendChild(el('div','question-box',`<b>Câu hỏi tương tác:</b> ${esc(item.text.replace(/^Giảng viên hỏi cả lớp \(giơ tay hoặc Mentimeter\):\s*/,'').replace(/^Câu hỏi tương tác \(hỏi và mời học viên phát biểu ngay tại lớp\):\s*/,''))}`));
      return;
    }
    if(isNote(item.text)){
      flushList();
      const [label,...rest]=item.text.split(':');
      card.appendChild(el('div','note-box',`<b>${esc(label)}:</b>${rest.length?' '+esc(rest.join(':').trim()):''}`));
      return;
    }
    if(isBulletLike(item.text)){
      appendBullet(item.text);
      return;
    }
    appendParagraph(item.text);
  });
  flushList();
  flush();
  m.appendChild(el('div','callout','<b>Cách dùng:</b> Giảng viên mở mục này trước CĐ01 để thống nhất bối cảnh, tâm thế học tập và lộ trình toàn khóa; sau đó chuyển sang Agenda tổng quan hoặc Slide 1 của chuyên đề Ứng dụng AI.'));
  setActive();
}

  m.appendChild(el('div','eyebrow','Kiểm tra kiến thức giảng viên'));
  m.appendChild(el('h2','page','Bài trắc nghiệm theo từng slide chính'));
  if(!quizState.started){
    m.appendChild(el('p','sub',`Bài gồm ${DATA.quiz.length} câu, mỗi câu gắn một slide cốt lõi. Sau mỗi câu nhận phản hồi ngay; hoàn thành để xem điểm và phần ôn lại có liên kết về slide.`));
    const c=el('div','card');
    c.innerHTML=`<h3><span class="ic" style="background:var(--red)">i</span>Trước khi bắt đầu</h3>
      <ul><li>Không giới hạn thời gian — trả lời thật để tự đánh giá mức nắm bài.</li>
      <li>Mỗi câu chọn một đáp án; chọn xong hiện giải thích và slide liên quan.</li>
      <li>Đạt yêu cầu gợi ý: đúng từ 80% trở lên (${Math.ceil(DATA.quiz.length*0.8)}/${DATA.quiz.length} câu).</li></ul>`;
    m.appendChild(c);
    const b=el('button','btn primary','Bắt đầu làm bài →');b.style.marginTop='8px';
    b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();};m.appendChild(b);setActive();return;
  }
  if(quizState.i>=DATA.quiz.length){renderResult(m);setActive();return;}
  const q=DATA.quiz[quizState.i];
  m.appendChild(el('div','progress',`<i style="width:${Math.round(quizState.i/DATA.quiz.length*100)}%"></i>`));
  const card=el('div','q-card');
  card.appendChild(el('div','q-meta',`Câu ${quizState.i+1} / ${DATA.quiz.length}`));
  const sref=DATA.slides.find(x=>x.n===q.slide);
  const rl=el('div','q-ref',`📑 Liên quan Slide ${q.slide}: ${esc(sref?sref.title:'')}`);rl.onclick=()=>goSlide(q.slide);card.appendChild(rl);
  card.appendChild(el('p','q-text',esc(q.q)));
  const answered=quizState.answers[quizState.i]!=null;
  q.opts.forEach((o,idx)=>{
    const b=el('button','opt',`<span class="l">${String.fromCharCode(65+idx)}</span>${esc(o)}`);
    if(answered){
      const ch=quizState.answers[quizState.i];
      if(idx===q.a)b.classList.add('correct');else if(idx===ch)b.classList.add('wrong');else b.classList.add('dim');
      b.disabled=true;
    }else b.onclick=()=>{quizState.answers[quizState.i]=idx;renderQuiz();};
    card.appendChild(b);
  });
  const why=el('div','q-why'+(answered?' show':''));
  if(answered){const ok=quizState.answers[quizState.i]===q.a;why.innerHTML=`<b>${ok?'✔ Chính xác.':'✘ Chưa đúng.'}</b> ${esc(q.why)}`;}
  card.appendChild(why);
  if(answered){
    const nav=el('div','slidenav');
    const nx=el('button','btn primary',quizState.i<DATA.quiz.length-1?'Câu tiếp →':'Xem kết quả →');
    nx.onclick=()=>{quizState.i++;renderQuiz();window.scrollTo(0,0);};
    nav.appendChild(el('span'));nav.appendChild(nx);card.appendChild(nav);
  }
  m.appendChild(card);setActive();
}
function renderResult(m){
  const total=DATA.quiz.length,correct=quizState.answers.filter((a,i)=>a===DATA.quiz[i].a).length,pct=Math.round(correct/total*100),pass=pct>=80;
  const c=el('div','q-card result');
  c.innerHTML=`<div class="score">${correct}/${total}</div>
    <div class="lab" style="color:${pass?'var(--green)':'var(--red)'}">${pass?'Đạt yêu cầu ('+pct+'%)':'Cần ôn lại ('+pct+'%)'}</div>
    <p style="color:var(--grey);margin-top:8px">${pass?'Bạn đã nắm vững nội dung cốt lõi. Có thể tự tin đứng lớp.':'Hãy xem lại các slide ở phần ôn lại bên dưới rồi làm lại bài.'}</p>`;
  const rev=el('div','');rev.style.textAlign='left';rev.style.marginTop='20px';
  DATA.quiz.forEach((q,i)=>{
    const ok=quizState.answers[i]===q.a;const sref=DATA.slides.find(x=>x.n===q.slide);
    rev.appendChild(el('div','rev-item',
      `<div style="font-weight:700">${esc(q.q)}</div>
       <div style="margin-top:4px">${ok?'<span class="ok">✔ Bạn trả lời đúng</span>':'<span class="no">✘ Đáp án đúng: '+esc(q.opts[q.a])+'</span>'}</div>
       <div style="margin-top:5px;font-size:12.5px;color:var(--grey)">📑 <a onclick="goSlide(${q.slide})" style="cursor:pointer;color:var(--red)">Ôn Slide ${q.slide}: ${esc(sref?sref.title:'')}</a></div>`));
  });
  c.appendChild(rev);m.appendChild(c);
  const b=el('button','btn primary','↻ Làm lại bài');b.style.marginTop='18px';
  b.onclick=()=>{quizState={i:0,answers:[],started:true};renderQuiz();window.scrollTo(0,0);};m.appendChild(b);
}

/* ---------- router ---------- */
function render(){
  ({overview:renderOverview,orientation:renderOrientation,slide:renderSlide,prompts:renderPrompts,mau:renderMau,
    check:renderCheck,guide:renderGuide,quiz:renderQuiz}[state.view]||renderOverview)();
}
function toggleNav(){$('#aside').classList.toggle('open');$('#backdrop').classList.toggle('open');}
function closeNav(){$('#aside').classList.remove('open');$('#backdrop').classList.remove('open');}
buildNav();render();

</script>
</body>
</html>
