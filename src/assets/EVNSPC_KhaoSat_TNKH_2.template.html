});

<span style={{color:B,fontWeight:700,fontSize:11,minWidth:20,paddingTop:7}}>{i+1}.</span>
<textarea rows={2} value={r} onChange={e=>updR("c1",i,e.target.value)} placeholder="Nhập câu hỏi / tình huống..." style={{flex:1,border:"1px solid #cfd4da",borderRadius:4,padding:"6px 8px",fontSize:12.5,fontFamily:"inherit",resize:"vertical",outline:"none"}}/>
<select style={{width:105,border:"1px solid #cfd4da",borderRadius:4,padding:"6px 4px",fontSize:11,fontFamily:"inherit"}}><option>Tần suất</option><option>Rất thường xuyên</option><option>Thường xuyên</option><option>Thỉnh thoảng</option><option>Hiếm khi</option></select>
{(dr.c1||[]).length>1&&<button onClick={()=>delR("c1",i)} style={{background:"#fee2e2",border:"none",borderRadius:4,padding:"4px 7px",cursor:"pointer",color:"#c00",fontWeight:700,fontSize:14}}>x</button>}
</div>)}
<button onClick={()=>addR("c1")} style={{width:"100%",marginTop:4,background:LB,border:`1px dashed ${B}`,borderRadius:4,padding:"7px",fontSize:11.5,fontWeight:600,color:B,cursor:"pointer",fontFamily:"inherit"}}>+ Thêm dòng</button>
</div></div>
{/* C2 */}
<div style={{background:"#fff",borderRadius:6,marginBottom:14,overflow:"hidden",border:"1px solid #e0e0e0"}}>
<div style={{background:B,color:"#fff",padding:"9px 16px",fontSize:13,fontWeight:700}}>Nội dung 2 — Hành vi tiêu cực lặp lại trong 12 tháng</div>
<div style={{padding:"14px 16px"}}>
{NB.map((t,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f5f5f5"}}><span style={{fontSize:12.5,color:"#555",flex:1}}>{t}</span><Stars v={ns[`nb${i}`]||0} set={v=>setNs({...ns,[`nb${i}`]:v})}/></div>)}
<div style={{marginTop:12}}><TA label="Hành vi tiêu cực khác (bổ sung):" value={nn.other} onChange={v=>setNn({...nn,other:v})} rows={2}/><TA label="Ví dụ cụ thể (bối cảnh, lời nói, phản ứng khách hàng):" value={nn.ex} onChange={v=>setNn({...nn,ex:v})} rows={3}/></div>
</div></div>
{/* C3 */}
<div style={{background:"#fff",borderRadius:6,marginBottom:14,overflow:"hidden",border:"1px solid #e0e0e0"}}>
<div style={{background:B,color:"#fff",padding:"9px 16px",fontSize:13,fontWeight:700}}>Nội dung 3 — Nhu cầu hỗ trợ nhóm yếu thế</div>
<div style={{padding:"14px 16px"}}>
{SN.map((sn,si)=><div key={sn.id} style={{border:"1px solid #e0e0e0",borderRadius:4,padding:12,marginBottom:8}}>
<div style={{fontWeight:700,color:B,fontSize:12.5,marginBottom:8}}>{si+1}. {cleanLeadingNumber(sn.t)}</div>
{sn.f.map((f,fi)=>{const k=`${sn.id}_${fi}`;return <div key={fi} style={{marginBottom:5}}><label style={{fontSize:11.5,fontWeight:600,color:"#555",display:"block",marginBottom:1}}>{f}</label><input type="text" value={snd[k]||""} onChange={e=>setSnd({...snd,[k]:e.target.value})} placeholder="Nhập..." style={{width:"100%",border:"1px solid #cfd4da",borderRadius:4,padding:"5px 8px",fontSize:12,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/></div>})}
</div>)}
</div></div>
{/* C4 */}
<div style={{background:"#fff",borderRadius:6,marginBottom:14,overflow:"hidden",border:"1px solid #e0e0e0"}}>
<div style={{background:O,color:"#fff",padding:"9px 16px",fontSize:13,fontWeight:700}}>Chuyển dịch năng lượng — Nhu cầu thực tế tại địa bàn</div>
<div style={{padding:"14px 16px"}}>
<div style={{background:"#fff7ed",borderLeft:`4px solid ${O}`,padding:"8px 12px",borderRadius:4,marginBottom:12,fontSize:12,lineHeight:1.6}}>Thu thập nhu cầu thực tế về điện mặt trời áp mái, xe điện, tiết kiệm năng lượng.</div>
{EF.map(f=><TA key={f.k} label={f.l} value={ed[f.k]||""} onChange={v=>setEd({...ed,[f.k]:v})} rows={f.r}/>)}
</div></div>

<div style={{background:"#fff",borderRadius:6,marginBottom:14,overflow:"hidden",border:"1px solid #e0e0e0"}}>
<div style={{background:B,color:"#fff",padding:"9px 16px",fontSize:13,fontWeight:700}}>Đo lường CSAT/NPS/CES và phối hợp nội bộ TTCSKH – Công ty Điện lực</div>
<div style={{padding:"14px 16px"}}>
<div style={{background:LO,borderLeft:`4px solid ${O}`,padding:"8px 12px",borderRadius:4,marginBottom:12,fontSize:12,lineHeight:1.6}}>Căn cứ QT CSKH EVNSPC Điều 10-11 và QĐ 2286. Thu thập thực trạng đo lường và chỉ số phối hợp.</div>
{MF.map(f=><TA key={f.k} label={f.l} value={mf[f.k]||""} onChange={v=>setMf({...mf,[f.k]:v})} rows={f.r}/>)}
</div></div>
<div style={{background:LO,borderRadius:6,padding:18,textAlign:"center"}}><p style={{color:"#8B6914",fontWeight:600,fontSize:13,margin:"0 0 10px"}}>Cảm ơn Anh/Chị đã dành thời gian cung cấp thông tin.</p><button onClick={exp} disabled={sending} style={{background:B,color:"#fff",border:"none",padding:"10px 28px",borderRadius:4,fontSize:13,fontWeight:600,cursor:sending?"wait":"pointer",opacity:sending?0.75:1,fontFamily:"inherit"}}>{sending?"Đang gửi kết quả...":"Gửi kết quả khảo sát"}</button></div>
</div>}

</div>
<div style={{textAlign:"center",padding:14,color:"#bbb",fontSize:10,borderTop:"1px solid #eee",marginTop:14}}>Tập đoàn Điện lực Việt Nam | Tổng Công ty Điện lực miền Nam | Peopleone | ISO 10001:2018</div>
</div>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
