<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinabrain</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: #202124;
        background: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .vb-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 34px;
        padding: 24px;
        text-align: center;
        background: #ffffff;
      }

      .vb-brain-logo {
        width: min(380px, calc(100vw - 56px));
        height: auto;
        display: grid;
        place-items: center;
        animation: vbSplashFloat 2.6s ease-in-out infinite;
      }

      .vb-brain-logo img {
        display: block;
        width: 100%;
        height: auto;
      }

      .vb-splash-status {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        margin: 0;
        width: min(520px, calc(100vw - 48px));
        color: rgba(32, 33, 36, 0.62);
        font-size: 1rem;
        font-weight: 700;
        text-align: center;
      }

      .vb-loading-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: 32px;
      }

      .vb-loading-dots span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.34;
        animation: vbLoadingDotPulse 1.1s ease-in-out infinite;
      }

      .vb-loading-dots span:nth-child(2) {
        animation-delay: 140ms;
      }

      .vb-loading-dots span:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes vbSplashFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes vbLoadingDotPulse {
        0%,
        80%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        40% {
          opacity: 0.9;
          transform: translateY(-3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .vb-brain-logo,
        .vb-loading-dots span {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vb-splash" aria-label="Vinabrain đang tải">
        <div class="vb-brain-logo" aria-hidden="true">
          <img src="/vinabrain-logo-transparent.png" alt="" />
        </div>
        <p class="vb-splash-status" aria-label="Chúng tôi đang thiết lập mọi thứ cho bạn...">
          <span>Chúng tôi đang thiết lập mọi thứ cho bạn</span>
          <span class="vb-loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </p>
      </div>
    </div>
    <script>
      (function () {
        var reloadKey = 'vinabrain.splash.reload.v1';
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var stillOnStaticSplash =
            root &&
            root.children.length === 1 &&
            root.firstElementChild &&
            root.firstElementChild.classList.contains('vb-splash');
          if (!stillOnStaticSplash || window.sessionStorage.getItem(reloadKey) === '1') return;
          window.sessionStorage.setItem(reloadKey, '1');
          var url = new URL(window.location.href);
          url.searchParams.set('__vb_reload', String(Date.now()));
          window.location.replace(url.toString());
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
