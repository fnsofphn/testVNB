/* ================== TÍNH TRẠNG THÁI ================== */
function split(ref){const [s,f]=ref.split('.');return {s,f,def:SRC_DEF[s].fields[f]}}
function fieldMissing(ctx,s,f){const def=SRC_DEF[s].fields[f];const inp=inputOf(ctx,s);if(!inp)return true;const v=inp.values[f];
  if(def.type==='repeat'){const n=ctx.course.acts[REPEAT_COUNT[f]]||0;return !Array.isArray(v)||v.length<n||v.slice(0,n).some(x=>!x)}
  if(def.type==='derived'&&def.from)return !inp.values[def.from];
  return v==null||v===''}
function fieldState(t,ref){const {s,f,def}=split(ref);const inp=inputOf(t,s);const st=t.status;
  const changed=inp&&inp.changes&&inp.changes[f]&&t.used[s]&&t.used[s]<inp.ver&&!(t.ack[s]>=inp.ver);
  if(st==='DONE')return changed?'chg':'ok';
  if(def.req&&fieldMissing(t,s,f))return 'miss';
  if(changed&&PROGRESSED.includes(st))return 'chg';
  if(!def.req&&fieldMissing(t,s,f))return 'opt';
  return 'ok'}
function missingRefs(t){return t.refs.filter(r=>fieldState(t,r)==='miss')}
function chgRefs(t){return t.refs.filter(r=>fieldState(t,r)==='chg')}
function depCodes(t){if(t.tpl.depsGroup)return classTasks(t.cls).filter(x=>x.tpl.group===t.tpl.depsGroup).map(x=>x.code);return (t.tpl.deps||[]).filter(code=>classTasks(t.cls).some(x=>x.code===code))}
function openDeps(t){return depCodes(t).filter(code=>status(classTasks(t.cls).find(x=>x.code===code))!=='DONE')}
function status(t){if(PROGRESSED.includes(t.status))return t.status;if(missingRefs(t).length)return 'WAITING_INPUT';if(openDeps(t).length)return 'WAITING';if(!t.who)return 'UNASSIGNED';return 'READY'}
function isImpact(t){return t.status==='DONE'&&chgRefs(t).length&&classState(t.cls).k!=='ended'}
function chgPending(t){return ['IN_PROGRESS','IN_REVIEW','REWORK'].includes(t.status)&&chgRefs(t).length>0}
function due(t){const base=t.tpl.anchor==='END'?t.cls.end:t.cls.start;return addDays(base,-t.tpl.off)}
function dueInfo(t){const d=due(t);const st=status(t);const n=diffDays(TODAY,d);
  const rel=st==='DONE'?'đã xong':n<0?`quá hạn ${-n} ngày`:n===0?'hôm nay':`còn ${n} ngày`;
  return {d,text:`${fmtD(d)} (${wd(d)})`,rel,cls:st==='DONE'?'':n<0?'red':n<=2?'amber':'',overdue:st!=='DONE'&&n<0}}
function inputSummary(t){const st=status(t);const req=t.refs.filter(r=>split(r).def.req).length;
  if(st==='DONE')return isImpact(t)?['Có phiên bản mới sau khi xong','t-purple','chg']:[t.refs.length?'Đủ · đã dùng':'Không cần input','t-green','ok'];
  const miss=missingRefs(t).length;if(miss)return [`Thiếu ${miss} trường`,'t-amber','miss'];
  if(chgRefs(t).length)return ['Có phiên bản mới','t-purple','chg'];
  const dep=openDeps(t).length;
  if(dep&&!t.refs.length)return [`Chờ ${dep} việc trước`,'t-teal','dep'];
  if(dep)return [`Đủ ${req}/${req} · chờ ${dep} việc`,'t-teal','dep'];
  if(!t.refs.length)return [t.local?'Đủ thiết lập':'Không cần input','t-green','ok'];
  return [`Đủ ${req}/${req}`,'t-green','ok']}
function classMetrics(c){const ts=classTasks(c);const done=ts.filter(t=>status(t)==='DONE').length;const overdue=ts.filter(t=>dueInfo(t).overdue);
  const wait=ts.filter(t=>status(t)==='WAITING_INPUT').length;const unassigned=ts.filter(t=>status(t)==='UNASSIGNED').length;const chg=ts.filter(t=>chgPending(t)||isImpact(t)).length;
  const open=ts.filter(t=>status(t)!=='DONE').sort((a,b)=>due(a).localeCompare(due(b)));
  return {total:ts.length,done,overdue,wait,unassigned,chg,next:overdue[0]||open[0]||null}}
function sumMetrics(classes){return classes.reduce((a,c)=>{const m=classMetrics(c);const k=classState(c).k;a.total+=m.total;a.done+=m.done;a.overdue+=m.overdue.length;a.wait+=m.wait;a.chg+=m.chg;a[k]++;return a},{total:0,done:0,overdue:0,wait:0,chg:0,upcoming:0,running:0,ended:0})}

function canEditSource(code){return state.role===SRC_DEF[code].owner||state.role==='operations'}
function fieldRow(ctx,ref,st,opts={}){const {s,f,def}=split(ref);const inp=inputOf(ctx,s)||{values:{}};const v=inp.values[f];const key=srcKey(ctx,s);
  const edit=opts.editable&&canEditSource(s);let val='';

    val=v?`<div class="fileitem"><span class="ic ${v.ic}">${v.ic.toUpperCase()}</span><div><b>${esc(v.name)}</b><small>${esc(v.meta)}</small></div><button class="btn xs" type="button" data-toast="Mở xem trước ${esc(v.name)}">Xem</button></div>`
      :edit?`<input class="inp" data-edit="${key}|${f}" placeholder="${esc(def.ph||'Tên file')}">${def.type==='file-template'?'<small>Tải mẫu Mau_DS_hoc_vien.xlsx · hệ thống đọc file, báo lỗi từng dòng</small>':''}`:`<b>Chưa có file</b><small>Chờ ${OWNER_LABEL[SRC_DEF[s].owner]} bổ sung</small>`}
  else if(def.type==='repeat'){const n=ctx.course.acts[REPEAT_COUNT[f]]||0;const arr=Array.isArray(v)?v:[];
    val=Array.from({length:n},(_,i)=>{const it=arr[i];return it?`<div class="fileitem"><span class="ic ${it.ic}">${it.ic==='lib'?'LIB':it.ic.toUpperCase()}</span><div><b>${esc(it.name)}</b><small>${esc(it.meta)}</small></div></div>`
      :`<div class="fileitem need"><span class="ic none">${i+1}</span><div><b>Mục ${i+1} · chưa có</b><small>${esc(def.ph||'')}</small></div>${edit?`<input class="inp" style="max-width:180px" data-edit="${key}|${f}|${i}" placeholder="${esc(def.ph||'')}">`:''}</div>`}).join('')}
  else if(def.type==='derived'&&def.from&&!inp.values[def.from])val=`<b>Chờ file</b><small>Tự đọc từ ${esc(SRC_DEF[s].fields[def.from].label)}</small>`;
  else if(v==null||v==='')val=edit?`<input class="inp" data-edit="${key}|${f}" placeholder="${esc(def.ph||'Nhập giá trị')}">`:`<b>Chưa có</b><small>${def.req?`Chờ ${OWNER_LABEL[SRC_DEF[s].owner]} bổ sung`:'Không bắt buộc'}</small>`;
  else{let sub='';if(def.type==='counts')sub='Lấy từ phạm vi khóa, không nhập tay';if(def.type==='derived'&&f==='class_ids')sub='';
    if(inp.changes&&inp.changes[f])sub=`v${inp.ver-1} → v${inp.ver}: ${inp.changes[f]}`;if(f==='learner_count'&&inp.note)sub=inp.note;
    val=`${def.type==='library-ref'?'<span class="tag t-amber" style="margin-right:5px">Thư viện</span>':''}<b>${esc(opts.inTask&&f==='class_ids'?ctx.cls.id:v)}</b>${sub?`<small>${esc(sub)}</small>`:''}`}
  const tag=st==='miss'?'<span class="tag t-amber">Thiếu</span>':st==='chg'?'<span class="tag t-purple">Đã đổi</span>':st==='opt'?'<span class="tag t-grey">Tùy chọn</span>':'<span class="tag t-green">✓</span>';
  return `<div class="field ${st==='miss'?'missing':''} ${st==='chg'?'changed':''}"><span class="lb">${esc(def.label)}${def.req?' <i>*</i>':''}<small>${TYPE_LABEL[def.type]}</small></span><span class="val">${val}</span>${tag}</div>`}
function genericState(ctx,s,f){const def=SRC_DEF[s].fields[f];const inp=inputOf(ctx,s);if(def.req&&fieldMissing(ctx,s,f))return 'miss';if(inp&&inp.changes&&inp.changes[f])return 'chg';if(!def.req&&fieldMissing(ctx,s,f))return 'opt';return 'ok'}
function saveSource(key,container){const inp=INPUTS[key];const code=key.split(':').pop();let filled=0;
  container.querySelectorAll(`[data-edit^="${key}|"]`).forEach(el=>{const [,f,idx]=el.dataset.edit.split('|');const val=el.value.trim();if(!val)return;filled++;const def=SRC_DEF[code].fields[f];
    if(def.type==='repeat'){if(!Array.isArray(inp.values[f]))inp.values[f]=[];inp.values[f][+idx]={ic:/^https?:|\.(vn|com)/.test(val)?'link':'pdf',name:val,meta:'vừa bổ sung'}}
    else if(def.type==='file'||def.type==='file-template'){inp.values[f]={ic:/xlsx?$/i.test(val)?'xlsx':'pdf',name:val,meta:def.type==='file-template'?'Đã đọc theo mẫu · 42 dòng hợp lệ · 0 lỗi':'vừa tải lên'};
      if(code==='D03b'){inp.values.learner_count='42';inp.values.groups='Nhóm A: 21 · Nhóm B: 21'}}
    else inp.values[f]=val});
  if(!filled){toast('Nhập ít nhất một giá trị trước khi lưu.');return false}
  inp.ver+=1;inp.at='11/09 · vừa xong';inp.by=PEOPLE[state.role][0];

function inputMap(c){const ts=classTasks(c);const course=courseOf(c);const ctx={cls:c,course};
  const codes=Object.keys(SRC_DEF).filter(s=>!SRC_DEF[s].act||course.acts[SRC_DEF[s].act]);
  let blockTotal=0;
  const rows=codes.map(s=>{const inp=inputOf(ctx,s);let block=0;const miss=Object.keys(SRC_DEF[s].fields).some(f=>SRC_DEF[s].fields[f].req&&fieldMissing(ctx,s,f));
    const cells=ts.map(t=>{const refs=t.refs.filter(r=>r.startsWith(s+'.'));if(!refs.length)return '<td></td>';const sts=refs.map(r=>fieldState(t,r));
      if(sts.includes('miss')){block++;return '<td><span class="dot miss">!</span></td>'}if(sts.includes('chg')){block++;return `<td><span class="dot chg">v${inp.ver}</span></td>`}return '<td><span class="dot ok">✓</span></td>'}).join('');
    blockTotal+=block;
    return `<tr><td class="src"><b>${s} · ${SRC_DEF[s].title} ${miss?'<span class="tag t-amber">Thiếu</span>':inp&&inp.changes?`<span class="tag t-purple">v${inp.ver} mới</span>`:`<span class="tag t-green">v${inp?inp.ver:0}</span>`}</b><small>${SRC_DEF[s].level==='class'?'Theo lớp':'Theo khóa'} · ${OWNER_LABEL[SRC_DEF[s].owner]}</small></td>${cells}<td>${block?`<span class="tag ${miss?'t-amber':'t-purple'}">${block}</span>`:'–'}</td></tr>`}).join('');
  const depRow=`<tr><td class="src"><b>Kết quả việc trước</b><small>Tự động</small></td>${ts.map(t=>depCodes(t).length?(openDeps(t).length?'<td><span class="dot dep">→</span></td>':'<td><span class="dot ok">✓</span></td>'):'<td></td>').join('')}<td>${ts.filter(t=>depCodes(t).length&&openDeps(t).length).length||'–'}</td></tr>`;
  const locRow=`<tr><td class="src"><b>Thiết lập riêng</b><small>Vận hành VTraining</small></td>${ts.map(t=>t.local?'<td><span class="dot ok">⚙</span></td>':'<td></td>').join('')}<td>–</td></tr>`;
  return `<details class="mapbox" ${state.role==='manager'?'open':''}><summary><span class="l">Bản đồ input của lớp · nguồn nào đang chặn việc nào</span>${blockTotal?`<span class="tag t-amber">${blockTotal} ô cần xử lý</span>`:'<span class="tag t-green">Không có nguồn chặn</span>'}</summary><div class="table-wrap"><table class="matrix"><thead><tr><th>Nguồn input</th>${ts.map(t=>`<th class="tk">${t.code}</th>`).join('')}<th>Chặn</th></tr></thead><tbody>${rows}${depRow}${locRow}</tbody></table></div></details>`}

/* ================== INPUT ================== */
function allSourceKeys(){const out=[];
  CLASSES.forEach(c=>['D03a','D03b'].forEach(s=>out.push({key:`${c.id}:${s}`,code:s,ctx:{cls:c,course:courseOf(c)},scope:c})));
  COURSES.forEach(co=>Object.keys(SRC_DEF).filter(s=>SRC_DEF[s].level==='course'&&co.acts[SRC_DEF[s].act]).forEach(s=>{const cls=CLASSES.find(c=>c.course===co.id);out.push({key:`${co.id}:${s}`,code:s,ctx:{cls,course:co},scope:co})}));
  out.forEach(o=>{o.miss=Object.keys(SRC_DEF[o.code].fields).filter(f=>SRC_DEF[o.code].fields[f].req&&!SRC_DEF[o.code].fields[f].from&&fieldMissing(o.ctx,o.code,f)).length;o.inp=INPUTS[o.key];
    o.users=TASKS.filter(t=>t.refs.some(r=>r.startsWith(o.code+'.'))&&srcKey(t,o.code)===o.key);o.blocking=o.users.filter(t=>t.refs.some(r=>r.startsWith(o.code+'.')&&['miss','chg'].includes(fieldState(t,r)))&&status(t)!=='DONE'||isImpact(t)&&t.refs.some(r=>r.startsWith(o.code+'.')))});
  return out}
function visibleSourceKeys(){const all=allSourceKeys();if(state.role==='intake')return all.filter(o=>SRC_DEF[o.code].owner==='intake');if(state.role==='content')return all.filter(o=>SRC_DEF[o.code].owner==='content');return all}
function srcCard(o){const def=SRC_DEF[o.code];const inp=o.inp||{ver:0,values:{}};const edit=canEditSource(o.code);const chg=inp.changes;
  const scopeLabel=def.level==='class'?`${sttOf(o.scope)} · ${o.scope.id} · ${esc(o.scope.name)}`:`${sttOf(o.scope)} · ${o.scope.id}`;
  const fields=Object.keys(def.fields).map(f=>fieldRow(o.ctx,`${o.code}.${f}`,genericState(o.ctx,o.code,f),{editable:true})).join('');
  const users=o.users.map(t=>t.code+(def.level==='course'?`·${t.cls.id.replace('PPO_TEST-','')}`:'')).slice(0,6).join(', ')+(o.users.length>6?` +${o.users.length-6}`:'');
  return `<article class="src-card ${o.miss?'miss':chg?'chg':''}" data-card="${o.key}" id="card-${o.key.replace(/[^\w]/g,'_')}"><header><div><b>${o.code} · ${def.title}</b><small>${scopeLabel}</small><small>${inp.ver?`v${inp.ver} · ${esc(inp.by)} · ${inp.at}`:'Chưa có phiên bản'}${inp.reason?` · Lý do: ${esc(inp.reason)}`:''}</small></div>${o.miss?`<span class="tag t-amber">Thiếu ${o.miss} trường</span>`:chg?`<span class="tag t-purple">v${inp.ver} mới</span>`:'<span class="tag t-green">Đủ</span>'}</header><div class="body">${fields}</div>
  <footer><span>Dùng cho ${o.users.length} việc: ${users||'–'}${o.blocking.length?` · <b style="color:var(--amber)">đang chặn ${o.blocking.length}</b>`:''}</span><span class="toolbar" style="width:auto">${edit&&o.miss?`<button class="btn primary" data-save="${o.key}">Lưu input ${o.code}</button>`:''}${edit&&!o.miss?`<button class="btn" data-toast="Mở form cập nhật ${o.code} v${inp.ver+1}: bắt buộc ghi lý do, hệ thống báo việc bị ảnh hưởng">Cập nhật phiên bản</button>`:''}</span></footer></article>`}
function inputsView(){const keys=visibleSourceKeys();const r=state.role;
  const title=r==='intake'?'Input lớp học':r==='content'?'Input khóa học':r==='manager'?'Input công việc':'Input readiness';
  const desc=r==='intake'?'Thông tin lớp (D03a) và danh sách học viên theo file mẫu (D03b) cho từng lớp. Ô vàng là trường còn thiếu, nhập trực tiếp rồi bấm Lưu.':r==='content'?'Nội dung theo khóa (D04 – D09). Số ô trong nhóm lặp tự sinh theo số lượng hoạt động của khóa.':'Tình trạng từng nguồn input, việc đang dùng và việc đang bị chặn.';
  const table=`<div class="table-wrap"><table><thead><tr><th>Nguồn</th><th>Phạm vi</th><th>Người sở hữu</th><th>Phiên bản</th><th>Tình trạng</th><th>Dùng cho</th><th>Đang chặn</th></tr></thead><tbody>${keys.map(o=>`<tr class="task-row" data-jump="${o.key}"><td><b>${o.code}</b> · ${SRC_DEF[o.code].title}</td><td>${sttOf(o.scope)} · ${o.scope.id}</td><td>${OWNER_LABEL[SRC_DEF[o.code].owner]}</td><td>${o.inp&&o.inp.ver?'v'+o.inp.ver:'–'}</td><td>${o.miss?`<span class="tag t-amber">Thiếu ${o.miss} trường</span>`:o.inp&&o.inp.changes?`<span class="tag t-purple">Có v${o.inp.ver} mới</span>`:'<span class="tag t-green">Đủ</span>'}</td><td>${o.users.length} việc</td><td>${o.blocking.length?`<span class="tag t-amber">${o.blocking.length} việc</span>`:'–'}</td></tr>`).join('')}</tbody></table></div>`;

  else if(r==='content'){COURSES.forEach(co=>{cards+=`<p class="scope-title">${STT['co:'+co.id]} · ${co.id} · ${esc(co.name)} · ${esc(actCountText(co.acts))}</p><div class="src-grid">${keys.filter(o=>o.scope.id===co.id).map(srcCard).join('')}</div>`})}
  else{const att=keys.filter(o=>o.miss||o.inp&&o.inp.changes);cards=`<p class="scope-title">Cần chú ý · ${att.length} nguồn</p><div class="src-grid">${att.map(srcCard).join('')}</div>`}
  return `${pageHead('INPUT CONTROL',title,desc)}<section class="page-surface" style="margin-top:14px"><header class="surface-head"><div><small>TÌNH TRẠNG NGUỒN INPUT</small><h2>${ready}/${keys.length} nguồn đã đủ</h2><p>Bấm một dòng để xem chi tiết nguồn bên dưới</p></div></header>${table}</section><section class="page-surface" style="margin-top:14px">${cards}</section>`}

function dueItems(){const impact=TASKS.filter(isImpact),confirm=TASKS.filter(chgPending),review=TASKS.filter(t=>status(t)==='IN_REVIEW'),wait=TASKS.filter(t=>status(t)==='WAITING_INPUT'),unassigned=TASKS.filter(t=>status(t)==='UNASSIGNED'),over=TASKS.filter(t=>dueInfo(t).overdue);
  return {impact,confirm,review,wait,unassigned,over,total:impact.length+review.length+wait.length+unassigned.length+over.length}}
function queue(title,list,hint,action){return `<section class="page-surface queue-sec" style="margin-top:14px"><h3><span>${title}</span><span class="muted" style="font-weight:600">${list.length} việc · ${hint}</span></h3>${list.length?`<div class="table-wrap"><table><tbody>${list.map(t=>{const i=dueInfo(t);return `<tr class="task-row" data-task="${t.id}"><td style="width:40%"><span class="task-title">${esc(t.tpl.title)}</span><span class="task-meta">${t.code} · ${STT[t.cls.id]} ${t.cls.id} · ${esc(t.who||'Chưa giao')}</span></td><td><span class="tag ${inputSummary(t)[1]}">${inputSummary(t)[0]}</span></td><td class="dl ${i.cls}"><b>${i.text}</b><small>${i.rel}</small></td><td>${badge(t)}</td><td style="text-align:right"><button class="btn" data-open-task="${t.id}">${action}</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty-row">Không có việc.</p>'}</section>`}

  <article class="change-row"><span class="badge done">Đã duyệt</span><div><b>Scope V2 · Tài liệu VTraining tăng từ 3 lên 4</b><p>CX-FOUNDATION · 09/09 · D09 cần thêm 1 tài liệu · T-109 của TNKH03 chuyển Chờ input</p></div><span>Tác động: 1 việc</span><button class="btn" data-toast="Mở yêu cầu">Chi tiết</button></article>
  <article class="change-row"><span class="badge review">Chờ phê duyệt</span><div><b>Bổ sung 3 học viên lớp TNKH03</b><p>D03b v1 → v2 · 45 → 48 học viên · T-103 dùng v2</p></div><span>Không đổi phạm vi</span><button class="btn ${state.role==='operations'?'primary':''}" data-toast="Mở yêu cầu">${state.role==='operations'?'Review':'Chi tiết'}</button></article></div></section>`}
function auditView(){const ev=[['D07 lên v2: Rubric điểm đạt 70 → 75','Thu Trang · Chuyên viên nội dung · input: CX-FOUNDATION:D07 · 10/09 16:40'],['D03b TNKH03 lên v2: 48 học viên','Ngọc Hân · Đầu mối / Sale · input: TNKH03:D03b · 10/09 14:20'],['T-102 TNKH03 được duyệt PASS','Hoàng Long · Quản lý ekip · task: TNKH03-T-102 · 10/09'],['Scope V2 được duyệt: tài liệu 3 → 4','Phạm Hoài Nam · Quản lý vận hành · course: CX-FOUNDATION · 09/09'],['T-101 TNKH03 hoàn thành, dùng D03a v1 · D03b v1','Chiêu Anh · Thành viên ekip · task: TNKH03-T-101 · 09/09']];
  return `${pageHead('AUDIT LOG','Audit Log','Lịch sử không sửa được: ai làm gì, lúc nào, trên đối tượng nào, với phiên bản input nào.')}<section class="page-surface" style="margin-top:14px"><div class="audit-list">${ev.map(e=>`<div class="audit-row"><b>${e[0]}</b><small>${e[1]}</small></div>`).join('')}</div></section>`}

/* ================== CHI TIẾT CÔNG VIỆC (DRAWER) ================== */
function outText(t){if(t.code==='T-102')return `Link lớp trên VTraining: vtraining.vn/class/${t.cls.id}`;if(t.code==='T-103')return 'Tài khoản test: test.nhomA@… (trước lớp) · test.nhomB@… (demo tại lớp)';return t.tpl.out}
function feeds(t){return classTasks(t.cls).filter(x=>depCodes(x).includes(t.code)).map(x=>x.code)}
function openTask(id){state.drawer=id;state.editLocal=false;renderDrawer();$('taskDrawer').hidden=false}
function closeDrawer(){state.drawer=null;$('taskDrawer').hidden=true}
function renderDrawer(){const t=taskById(state.drawer);if(!t)return;const st=status(t);const i=dueInfo(t);const r=state.role;
  const isMine=r==='member'&&t.who==='Chiêu Anh';const isMgr=['manager','operations'].includes(r);const canLocal=['vtraining','operations'].includes(r);
  const verUsed=srcCodes(t).map(s=>`${s} v${t.used[s]||inputOf(t,s).ver}`).join(' · ')||'–';
  $('drawerCode').textContent=`${t.code} · ${t.tpl.group} · ${STT[t.cls.id]} ${t.cls.id}`;$('drawerTitle').textContent=t.tpl.title;
  const miss=missingRefs(t),chg=chgRefs(t);
  const chgText=()=>[...new Set(chg.map(x=>x.split('.')[0]))].map(s=>{const inp=inputOf(t,s);return `<b>${s}</b> đã lên <b>v${inp.ver}</b> lúc ${inp.at} (${esc(inp.by)}): ${Object.entries(inp.changes).map(([f,v])=>`${SRC_DEF[s].fields[f].label} ${v}`).join('; ')}${inp.reason?`. Lý do: “${esc(inp.reason)}”`:''}. Việc đang dùng v${t.used[s]}.`}).join(' ');
  let banner='';
  if(isImpact(t))banner=`<div class="banner chg"><b>Việc đã hoàn thành, nhưng input vừa đổi.</b> ${chgText()}<div class="acts">${isMgr?'<button class="btn" data-act="ack">Giữ nguyên kết quả</button><button class="btn primary" data-act="reopen">Mở lại việc</button>':'Quản lý ekip quyết định giữ nguyên hay mở lại việc.'}</div></div>`;
  else if(st==='DONE')banner=`<div class="banner ok"><b>Đã hoàn thành</b> với input ${verUsed}.</div>`;
  else if(miss.length){const owners=[...new Set(miss.map(x=>SRC_DEF[x.split('.')[0]].owner))];const names=miss.map(x=>split(x).def.label).join(', ');
    banner=`<div class="banner miss"><b>Chưa thể bắt đầu:</b> thiếu ${miss.length} trường bắt buộc (${esc(names)}). Người bổ sung: <b>${owners.map(o=>OWNER_LABEL[o]).join(', ')}</b>.<div class="acts">${owners.includes(r)||r==='operations'?'<span>Nhập trực tiếp vào ô màu vàng bên dưới rồi bấm “Lưu input”.</span>':isMgr?'<button class="btn soft" data-toast="Đã nhắc người sở hữu input bổ sung">Nhắc bổ sung</button><button class="btn" data-toast="Mở hộp thoại dời deadline, bắt buộc ghi lý do">Dời deadline</button>':'<button class="btn soft" data-toast="Đã gửi nhắc tới người sở hữu input">Nhắc bổ sung</button>'}</div></div>`}
  else if(chgPending(t))banner=`<div class="banner chg"><b>Input vừa có phiên bản mới.</b> ${chgText()}<div class="acts">${isMine?'<button class="btn primary" data-act="apply">Xác nhận áp dụng phiên bản mới</button><button class="btn" data-toast="Đã báo Quản lý ekip: không áp dụng được phiên bản mới">Báo không áp dụng được</button>':isMgr?'<button class="btn primary" data-act="apply">Áp dụng phiên bản mới</button><button class="btn" data-act="ack">Giữ phiên bản cũ cho lớp này</button>':'Đang chờ người thực hiện xác nhận.'}</div></div>`;
  else if(st==='WAITING'){const o=openDeps(t);banner=`<div class="banner dep"><b>Chờ việc trước:</b> còn ${o.length}/${depCodes(t).length} việc chưa hoàn thành (${o.join(', ')}). Việc tự chuyển sang Sẵn sàng khi các việc này xong.</div>`}
  else if(st==='IN_REVIEW')banner=`<div class="banner rev"><b>Đã gửi duyệt.</b> Người duyệt: ${REVIEWER}.<div class="acts">${isMgr?'<button class="btn primary" data-act="pass">Duyệt PASS</button><button class="btn" data-act="rework">Yêu cầu làm lại</button>':''}</div></div>`;
  else if(st==='UNASSIGNED')banner=`<div class="banner ok"><b>Đủ điều kiện</b> nhưng chưa có người thực hiện.${isMgr?`<div class="acts"><select class="class-switch" id="drawerWho">${MEMBERS.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn primary" data-act="assign">Giao việc</button></div>`:''}</div>`;
  else if(st==='READY')banner=`<div class="banner ok"><b>Đủ điều kiện.</b> Toàn bộ input bắt buộc đã có. Khi bắt đầu, hệ thống ghi lại phiên bản đang dùng: ${verUsed}.</div>`;
  else banner=`<div class="banner ok"><b>Đủ input.</b> Việc đang làm với ${verUsed} (ghi lại khi bắt đầu).</div>`;
  // ① input
  let inp='';
  srcCodes(t).forEach(s=>{const src=inputOf(t,s);const refs=t.refs.filter(x=>x.startsWith(s+'.'));const u=t.used[s];
    inp+=`<div class="srchead"><span><b>${s} · ${SRC_DEF[s].title}</b> · ${SRC_DEF[s].level==='class'?'Theo lớp':'Theo khóa'} · v${src.ver}${u&&u<src.ver?` <span class="tag t-purple">việc đang dùng v${u}</span>`:''}</span><span>${esc(src.by)} (${OWNER_LABEL[SRC_DEF[s].owner]}) · ${src.at} · <u data-toast="Lịch sử ${s}: ${Array.from({length:src.ver},(_,k)=>'v'+(k+1)).join(' → ')||'chưa có'}">Lịch sử</u></span></div>`+
      refs.map(x=>fieldRow(t,x,fieldState(t,x),{editable:true,inTask:true})).join('')+
      (canEditSource(s)&&refs.some(x=>fieldState(t,x)==='miss')?`<div style="text-align:right;padding:6px 0"><button class="btn primary" data-save="${srcKey(t,s)}">Lưu input ${s}</button></div>`:'')});
  if(depCodes(t).length){const dc=depCodes(t);inp+=`<div class="srchead"><span><b>Kết quả việc trước</b> · tự động</span><span>${dc.length-openDeps(t).length}/${dc.length} xong</span></div>`+dc.map(code=>{const d=classTasks(t.cls).find(x=>x.code===code);return `<div class="dep-row"><span><b>${code}</b> · ${esc(d.tpl.title)}${status(d)==='DONE'?`<small>Output: ${esc(outText(d))}</small>`:''}</span>${badge(d)}</div>`}).join('')}
  if(t.local){inp+=`<div class="srchead"><span><b>Thiết lập riêng của việc</b> · Vận hành VTraining đặt</span>${canLocal&&!state.editLocal&&st!=='DONE'?'<button class="btn xs" data-act="editlocal">Sửa</button>':''}</div>`+t.local.map(l=>`<div class="field"><span class="lb">${esc(l.label)} <i>*</i><small>Form · ngày giờ</small></span><span class="val">${state.editLocal?`<input class="inp plain" data-local="${l.key}" value="${esc(l.value)}">`:`<b>${esc(l.value)}</b>${l.sub?`<small>${esc(l.sub)}</small>`:''}`}</span><span class="tag t-green">✓</span></div>`).join('')+(state.editLocal?'<div style="text-align:right;padding:6px 0"><button class="btn primary" data-act="savelocal">Lưu thiết lập</button></div>':'')}
  if(!inp)inp='<p class="muted" style="font-size:11px">Việc này không cần input.</p>';
  // ② checklist
  const canTick=isMine&&['IN_PROGRESS','REWORK'].includes(st);
  const chk=t.checklist.map(([text,ref],k)=>{let exp='';
    if(ref&&ref.startsWith('L.')){const l=(t.local||[]).find(x=>x.key===ref.slice(2));if(l)exp=`Đối chiếu thiết lập: ${l.label} = ${l.value}`}
    else if(ref){const {s,f,def}=split(ref);const v=inputOf(t,s).values[f];const val=typeof v==='string'?v:v&&v.name?v.name:Array.isArray(v)?v.filter(Boolean).map(x=>x.name.split(' · ')[0]).join(', '):'';exp=`Đối chiếu input: ${def.label} = ${val||'(chưa có)'}`}
    const affected=ref&&chg.includes(ref);
    return `<label class="chk"><input type="checkbox" data-chk="${k}" ${t.done[k]?'checked':''} ${canTick?'':'disabled'}><span>${esc(text)}${exp?`<span class="exp" ${affected?'style="color:var(--purple)"':''}>↳ ${esc(exp)}${affected?' · giá trị vừa đổi':''}</span>`:''}</span></label>`}).join('');
  // ③ output
  const fd=feeds(t);
  const out=['DONE','IN_REVIEW'].includes(st)?`<b style="font-size:11.5px">${esc(outText(t))}</b>`:canTick?'<textarea class="note-field" placeholder="Nhập output, link minh chứng hoặc ghi chú bàn giao…"></textarea>':'<span class="muted" style="font-size:11px">Người thực hiện nộp output và minh chứng khi gửi duyệt.</span>';
  $('drawerBody').innerHTML=`<div class="dmeta"><div class="meta-box"><span>Trạng thái</span><b>${badge(t)}</b></div><div class="meta-box"><span>Người thực hiện</span><b>${esc(t.who||'Chưa giao')}</b></div><div class="meta-box"><span>Người duyệt</span><b>${REVIEWER}</b></div><div class="meta-box"><span>Deadline</span><b style="${i.cls==='red'?'color:var(--red)':i.cls==='amber'?'color:var(--amber)':''}">${i.text} · ${i.rel}</b></div><div class="meta-box"><span>Input đang dùng</span><b>${verUsed}</b></div><div class="meta-box"><span>Lớp</span><b>${stateTag(t.cls)}</b></div></div>
  ${banner}
  <section class="sec"><header><span>① Input của công việc</span><span class="tag ${inputSummary(t)[1]}">${inputSummary(t)[0]}</span></header><div class="body">${inp}</div></section>
  <section class="sec"><header><span>② Checklist nghiệm thu</span><span class="muted" style="font-weight:650">${t.done.filter(Boolean).length}/${t.checklist.length}</span></header><div class="body">${chk}</div></section>
  <section class="sec"><header><span>③ Output &amp; minh chứng</span></header><div class="body" style="padding-top:8px">${out}${fd.length?`<p class="muted" style="font-size:10.5px;margin:6px 0 0">Output của việc này là input của: ${fd.join(', ')}</p>`:''}</div></section>`;
  let foot='';
  if(isMine){if(st==='READY')foot='<button class="btn primary" data-act="start">Bắt đầu thực hiện</button>';
    else if(['IN_PROGRESS','REWORK'].includes(st))foot=`<button class="btn" data-toast="Đã báo input sai hoặc thiếu cho người sở hữu. Việc giữ trạng thái hiện tại">Báo input sai</button><button class="btn primary" data-act="submit" ${chgPending(t)?'disabled title="Cần xác nhận phiên bản input mới trước"':''}>Gửi duyệt</button>`}
  if(isMgr&&!['DONE','UNASSIGNED'].includes(st))foot+=`<select class="class-switch" id="drawerWho">${MEMBERS.map(x=>`<option ${x===t.who?'selected':''}>${x}</option>`).join('')}</select><button class="btn" data-act="assign">Giao lại</button>`;
  if(r==='vtraining')foot+='<button class="btn" data-toast="Mở cấu hình việc: input cần dùng (inputSpec), deadline, checklist">Cấu hình việc</button>';
  $('drawerActions').innerHTML=foot+'<button class="btn" data-close-drawer>Đóng</button>'}

function drawerAct(act){const t=taskById(state.drawer);if(!t)return;const chgSrc=[...new Set(chgRefs(t).map(x=>x.split('.')[0]))];
  const uncheckAffected=()=>{const aff=chgRefs(t);t.checklist.forEach(([,ref],k)=>{if(ref&&aff.includes(ref))t.done[k]=0})};
  if(act==='start'){t.status='IN_PROGRESS';srcCodes(t).forEach(s=>t.used[s]=inputOf(t,s).ver);toast(`${t.code} bắt đầu. Đã ghi lại phiên bản input đang dùng.`)}
  if(act==='submit'){const left=t.done.filter(x=>!x).length;if(left){toast(`Còn ${left} mục checklist chưa tích.`);return}t.status='IN_REVIEW';toast(`${t.code} đã gửi duyệt cho ${REVIEWER}.`)}
  if(act==='pass'){t.status='DONE';t.done=t.done.map(()=>1);toast(`${t.code} được duyệt PASS.`)}
  if(act==='rework'){t.status='REWORK';toast(`${t.code} chuyển sang Cần làm lại.`)}
  if(act==='apply'){uncheckAffected();chgSrc.forEach(s=>t.used[s]=inputOf(t,s).ver);if(t.status==='IN_REVIEW')t.status='REWORK';toast(`${t.code} dùng phiên bản mới. Mục checklist bị ảnh hưởng đã được bỏ tích để kiểm tra lại.`)}
  if(act==='ack'){chgSrc.forEach(s=>t.ack[s]=inputOf(t,s).ver);toast(`${t.code} giữ kết quả theo phiên bản cũ. Đã ghi lý do vào Audit Log.`)}
  if(act==='reopen'){uncheckAffected();chgSrc.forEach(s=>t.used[s]=inputOf(t,s).ver);t.status='REWORK';toast(`${t.code} được mở lại để làm theo phiên bản mới.`)}
  if(act==='assign'){const w=$('drawerWho').value;t.who=w;toast(`${t.code} giao cho ${w}.`)}
  if(act==='editlocal'){state.editLocal=true;renderDrawer();return}
  if(act==='savelocal'){$('drawerBody').querySelectorAll('[data-local]').forEach(el=>{const l=t.local.find(x=>x.key===el.dataset.local);if(l&&el.value.trim())l.value=el.value.trim()});state.editLocal=false;toast('Đã lưu thiết lập riêng của việc.')}
  render()}

/* ================== RENDER & SỰ KIỆN ================== */
const VIEW_FN={overview:overviewView,structure:structureView,tasks:tasksView,mine:mineView,inputs:inputsView,requests:requestsView,due:dueView,team:teamView,accounts:accountsView,change:changeView,audit:auditView};
function viewLabel(v){for(const [,items] of ROLES[state.role].groups)for(const [k,n] of items)if(k===v)return n;return v==='tasks'?'Công việc lớp':'Tổng quan'}
function render(){const p=PEOPLE[state.role];$('identityName').textContent=`${p[0]} · ${ROLES[state.role].label}`;$('identityMail').textContent=p[1];$('avatar').textContent=p[2];
  $('breadcrumb').textContent=`VWORK / ${viewLabel(state.view).toUpperCase()}${state.view==='tasks'?' / '+state.classId:''}`;
  renderSidebar();$('workspace').innerHTML=(VIEW_FN[state.view]||overviewView)();bindWorkspace();if(state.drawer)renderDrawer()}
function bindWorkspace(){
  const s=$('ovSearch');if(s)s.oninput=()=>{state.search=s.value;const pos=s.selectionStart;render();const n=$('ovSearch');n.focus();n.setSelectionRange(pos,pos)};
  const cs=$('classSwitch');if(cs)cs.onchange=()=>go('tasks',{classId:cs.value});
  const all=$('selectAll');if(all)all.onchange=()=>{classTasks(classById(state.classId)).forEach(t=>all.checked?state.sel.add(t.id):state.sel.delete(t.id));render()};
  document.querySelectorAll('[data-select-task]').forEach(b=>b.onchange=()=>{b.checked?state.sel.add(b.dataset.selectTask):state.sel.delete(b.dataset.selectTask);render()});
  const as=$('assignSelected');if(as)as.onclick=()=>{const w=$('bulkWho').value;if(!w){toast('Chọn người thực hiện trước.');return}state.sel.forEach(id=>taskById(id).who=w);toast(`Đã giao ${state.sel.size} việc cho ${w}.`);state.sel.clear();render()}}
document.addEventListener('click',e=>{const el=e.target;
  if(el.closest('[data-close-drawer]')){closeDrawer();return}
  const act=el.closest('[data-act]');if(act){drawerAct(act.dataset.act);return}
  const sv=el.closest('[data-save]');if(sv){const box=sv.closest('[data-card]')||$('drawerBody');if(saveSource(sv.dataset.save,box))render();return}
  const tt=el.closest('[data-toast]');if(tt){toast(tt.dataset.toast);return}
  const gt=el.closest('[data-go]');if(gt){if(gt.dataset.openp)state.open.add('p:'+gt.dataset.openp);if(gt.dataset.openco){const co=COURSES.find(c=>c.id===gt.dataset.openco);state.open.add('p:'+co.project);state.open.add('co:'+co.id)}go(gt.dataset.go);return}
  const oc=el.closest('[data-open-class]');if(oc){go('tasks',{classId:oc.dataset.openClass});return}
  const tg=el.closest('[data-toggle]');if(tg){const set=state.view==='structure'?state.sopen:state.open;const k=tg.dataset.toggle;set.has(k)?set.delete(k):set.add(k);if(state.view==='structure'&&!k.startsWith('c:'))return;render();return}
  const ex=el.closest('[data-expand]');if(ex){state.open.clear();if(ex.dataset.expand==='all'){PROJECTS.forEach(p=>state.open.add('p:'+p.id));COURSES.forEach(c=>state.open.add('co:'+c.id))}render();return}
  const ot=el.closest('[data-ovtab]');if(ot){state.ovTab=ot.dataset.ovtab;render();return}
  const jp=el.closest('[data-jump]');if(jp){const c=document.getElementById('card-'+jp.dataset.jump.replace(/[^\w]/g,'_'));if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.boxShadow='0 0 0 3px rgba(200,16,46,.25)';setTimeout(()=>c.style.boxShadow='',1600)}else toast('Nguồn này đủ, không nằm trong nhóm cần chú ý.');return}
  if(el.closest('input,select,textarea,label'))return;
  const tk=el.closest('[data-open-task],[data-task]');if(tk){openTask(tk.dataset.openTask||tk.dataset.task)}});
document.addEventListener('change',e=>{const c=e.target.closest('[data-chk]');if(c){const t=taskById(state.drawer);t.done[+c.dataset.chk]=c.checked?1:0;renderDrawer()}});
$('taskDrawer').addEventListener('click',e=>{if(e.target===$('taskDrawer'))closeDrawer()});
$('mobileMenu').onclick=()=>$('sidebar').classList.toggle('open');
$('roleSelect').onchange=e=>{state.role=e.target.value;closeDrawer();go(ROLES[state.role].def);toast(`Đã chuyển sang vai trò ${ROLES[state.role].label}.`)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('sidebar').classList.remove('open')}});
render();

</script>
